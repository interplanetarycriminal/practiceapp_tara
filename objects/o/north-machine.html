<body>
<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   00 · north-machine: "The Machine" (north star)
   A real, tiny GPT-2-style transformer: ARENA [1.1]'s DemoTransformer line for line at
   toy size (d_model 12, 4 layers x 3 heads, a 12-word vocabulary), trained with ARENA
   [0.3]'s AdamW on 12 toy sentences "A met B. B thanked" -> A. Every stream colour, arc,
   bar, needle and red arrow on screen comes from its forward and backward passes. The
   default weights are the float32 result of the seeded training run below, so nothing
   heavy runs on page load; other sizes (and "train again") train live, a few AdamW steps
   per frame. The MATH block is extracted and checked in node against an independent
   implementation (see LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
/* The toy: ARENA's DemoTransformer ([1.1] Transformers from scratch), line for line, at toy
   size. Every stream value, arc, bar and gradient on screen comes from these functions. */
const WORDS = ['Mary', 'Anna', 'John', 'Tom', 'met', '.', 'thanked', 'and', 'the', 'store', 'gave', 'drink'];
const WID = Object.fromEntries(WORDS.map((w, i) => [w, i]));
const NAMES = [WID.Mary, WID.Anna, WID.John, WID.Tom];
const PROMPT = [WID.Mary, WID.met, WID.John, WID['.'], WID.John, WID.thanked];   // "Mary met John. John thanked"
const ANSWER = WID.Mary;
/* ARENA's Config at toy size. d_mlp = 4 d_model and eps as ARENA; init_range is ARENA's 0.02
   scaled to the toy's width, 0.02 * sqrt(768 / 12) = 0.16, so every dot product starts with the
   same spread as in GPT-2 small (with 0.02 at d_model 12 the toy barely learns). */
const TOY = { d_model: 12, d_vocab: WORDS.length, n_ctx: 6, d_mlp: 48, layer_norm_eps: 1e-5, init_range: 0.16 };
/* ARENA's Config() for GPT-2 small (chapter 1, [1.1], "class Config") */
const GPT2 = { d_model: 768, d_vocab: 50257, n_ctx: 1024, d_head: 64, d_mlp: 3072, n_heads: 12, n_layers: 12, layer_norm_eps: 1e-5, init_range: 0.02 };
const config = (n_layers, n_heads) => ({ ...TOY, n_layers, n_heads, d_head: TOY.d_model / n_heads });

/* ARENA's parameter names and shapes, in state_dict order, in one flat Float64Array */
function layout(cfg) {
  const { d_model: d, d_vocab: V, n_ctx: C, d_mlp: M, n_heads: H, d_head: E, n_layers: L } = cfg;
  const spec = [['embed.W_E', [V, d], 'w'], ['pos_embed.W_pos', [C, d], 'w']];
  for (let l = 0; l < L; l++) {
    const b = `blocks.${l}.`;
    spec.push([b + 'ln1.w', [d], 'one'], [b + 'ln1.b', [d], 'zero'],
      [b + 'attn.W_Q', [H, d, E], 'w'], [b + 'attn.W_K', [H, d, E], 'w'], [b + 'attn.W_V', [H, d, E], 'w'], [b + 'attn.W_O', [H, E, d], 'w'],
      [b + 'attn.b_Q', [H, E], 'zero'], [b + 'attn.b_K', [H, E], 'zero'], [b + 'attn.b_V', [H, E], 'zero'], [b + 'attn.b_O', [d], 'zero'],
      [b + 'ln2.w', [d], 'one'], [b + 'ln2.b', [d], 'zero'],
      [b + 'mlp.W_in', [d, M], 'w'], [b + 'mlp.W_out', [M, d], 'w'], [b + 'mlp.b_in', [M], 'zero'], [b + 'mlp.b_out', [d], 'zero']);
  }
  spec.push(['ln_final.w', [d], 'one'], ['ln_final.b', [d], 'zero'], ['unembed.W_U', [d, V], 'w'], ['unembed.b_U', [V], 'frozen']);
  const T = {};
  let off = 0;
  for (const [name, shape, init] of spec) { const n = shape.reduce((a, b) => a * b, 1); T[name] = { off, n, shape, init }; off += n; }
  const o = (k) => T[k].off;
  const blocks = [];
  for (let l = 0; l < L; l++) {
    const b = `blocks.${l}.`;
    blocks.push({ ln1w: o(b + 'ln1.w'), ln1b: o(b + 'ln1.b'), WQ: o(b + 'attn.W_Q'), WK: o(b + 'attn.W_K'), WV: o(b + 'attn.W_V'), WO: o(b + 'attn.W_O'),
      bQ: o(b + 'attn.b_Q'), bK: o(b + 'attn.b_K'), bV: o(b + 'attn.b_V'), bO: o(b + 'attn.b_O'), ln2w: o(b + 'ln2.w'), ln2b: o(b + 'ln2.b'),
      Win: o(b + 'mlp.W_in'), Wout: o(b + 'mlp.W_out'), bin: o(b + 'mlp.b_in'), bout: o(b + 'mlp.b_out') });
  }
  const off2 = { WE: o('embed.W_E'), WP: o('pos_embed.W_pos'), blocks, lnfw: o('ln_final.w'), lnfb: o('ln_final.b'), WU: o('unembed.W_U'), bU: o('unembed.b_U') };
  return { spec, T, size: off, o: off2 };
}
/* parameter count of ARENA's DemoTransformer for any Config: W_U separate (as ARENA writes it) or tied to W_E (GPT-2) */
function paramCount(cfg, { tied = false, b_U = false } = {}) {
  const { d_model: d, d_vocab: V, n_ctx: C, d_mlp: M, n_heads: H, d_head: E, n_layers: L } = cfg;
  const block = 2 * d + (3 * H * d * E + H * E * d + 3 * H * E + d) + 2 * d + (d * M + M * d + M + d);
  const inside = L * (4 * H * d * E + 2 * d * M);                    // the big matrices inside the blocks only
  const total = V * d + C * d + L * block + 2 * d + (tied ? 0 : d * V) + (b_U ? V : 0);
  return { total, block, inside, embed: V * d, pos: C * d };
}

function rng(seed) {                        // mulberry32 (same generator as K.rng)
  let a = (seed >>> 0) || 1;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }

/* nn.init.normal_(std=init_range) for the W's, zeros for biases, ones for LayerNorm w */
function initModel(cfg, seed = 7) {
  const lay = layout(cfg), p = new Float64Array(lay.size), r = rng(seed);
  for (const [name, , init] of lay.spec) {
    const t = lay.T[name];
    for (let i = 0; i < t.n; i++) p[t.off + i] = init === 'w' ? cfg.init_range * gauss(r) : init === 'one' ? 1 : 0;
  }
  return { cfg, lay, p };
}

/* gelu_new (TransformerLens / GPT-2): 0.5 x (1 + tanh(sqrt(2/pi) (x + 0.044715 x^3))) */
const GC = Math.sqrt(2 / Math.PI);
const gelu_new = (x) => 0.5 * x * (1 + Math.tanh(GC * (x + 0.044715 * x * x * x)));

/* LayerNorm.forward: (x - mean) / sqrt(var(unbiased=False) + eps) * w + b, per position */
function layerNorm(x, n, d, P, wo, bo, eps, out, xhat, rstd) {
  for (let p = 0; p < n; p++) {
    const r = p * d;
    let m = 0; for (let i = 0; i < d; i++) m += x[r + i];
    m /= d;
    let v = 0; for (let i = 0; i < d; i++) { const c = x[r + i] - m; v += c * c; }
    v /= d;
    const rs = 1 / Math.sqrt(v + eps);
    rstd[p] = rs;
    for (let i = 0; i < d; i++) { const h = (x[r + i] - m) * rs; xhat[r + i] = h; out[r + i] = h * P[wo + i] + P[bo + i]; }
  }
}

/* A cache of every activation (ARENA's hook names), allocated once per (config, length). */
function makeCache(cfg, n) {
  const { d_model: d, d_vocab: V, d_mlp: M, n_heads: H, d_head: E, n_layers: L } = cfg;
  const F = (k) => new Float64Array(k);
  const blk = () => ({ resid_pre: F(n * d), ln1: { y: F(n * d), xhat: F(n * d), rstd: F(n) }, q: F(n * H * E), k: F(n * H * E), v: F(n * H * E),
    pattern: F(H * n * n), z: F(n * H * E), head_out: F(n * H * d), attn_out: F(n * d), resid_mid: F(n * d),
    ln2: { y: F(n * d), xhat: F(n * d), rstd: F(n) }, pre: F(n * M), th: F(n * M), post: F(n * M), mlp_out: F(n * d), resid_post: F(n * d) });
  return { n, tokens: new Int32Array(n), embed: F(n * d), blocks: Array.from({ length: L }, blk), final: F(n * d),
    lnf: { y: F(n * d), xhat: F(n * d), rstd: F(n) }, logits: F(n * V), probs: F(n * V) };
}

/* DemoTransformer.forward, caching every activation, with optional interventions (hooks):
   zero = { attn: Set(layers), mlp: Set(layers) }: that block's output is replaced by 0;
   add = { layer, pos, vec, alpha }: resid_pre[layer][pos] += alpha * vec (layer = n_layers: the final stream);
   patch = { layer, pos, vec }: resid_pre[layer][pos] = vec. */
function forward(model, tokens, iv = {}, c = null) {
  const { cfg, lay, p: P } = model, O = lay.o;
  const { d_model: d, d_vocab: V, d_mlp: M, n_heads: H, d_head: E, n_layers: L, layer_norm_eps: eps } = cfg;
  const n = tokens.length, sc = 1 / Math.sqrt(E), HE = H * E;
  if (!c) c = makeCache(cfg, n);
  const zA = iv.zero && iv.zero.attn, zM = iv.zero && iv.zero.mlp;
  for (let p = 0; p < n; p++) c.tokens[p] = tokens[p];
  // residual = embed(tokens) + pos_embed(tokens)
  const x0 = c.embed;
  for (let p = 0; p < n; p++) for (let i = 0; i < d; i++) x0[p * d + i] = P[O.WE + tokens[p] * d + i] + P[O.WP + p * d + i];
  let x = x0;
  const intervene = (l, buf) => {
    if (iv.add && iv.add.layer === l) { const o = iv.add.pos * d; for (let i = 0; i < d; i++) buf[o + i] += iv.add.alpha * iv.add.vec[i]; }
    if (iv.patch && iv.patch.layer === l) { const o = iv.patch.pos * d; for (let i = 0; i < d; i++) buf[o + i] = iv.patch.vec[i]; }
  };
  for (let l = 0; l < L; l++) {
    const B = O.blocks[l], A = c.blocks[l];
    A.resid_pre.set(x);
    intervene(l, A.resid_pre);
    const xr = A.resid_pre;
    // ln1
    const y1 = A.ln1.y;
    layerNorm(xr, n, d, P, B.ln1w, B.ln1b, eps, y1, A.ln1.xhat, A.ln1.rstd);
    // q, k, v = einsum(normalized_resid_pre, W, "posn d_model, nheads d_model d_head -> posn nheads d_head") + b
    const q = A.q, k = A.k, v = A.v;
    for (let p = 0; p < n; p++) for (let h = 0; h < H; h++) {
      const r = (p * H + h) * E;
      for (let e = 0; e < E; e++) { q[r + e] = P[B.bQ + h * E + e]; k[r + e] = P[B.bK + h * E + e]; v[r + e] = P[B.bV + h * E + e]; }
      for (let i = 0; i < d; i++) {
        const yi = y1[p * d + i], w = (h * d + i) * E;
        for (let e = 0; e < E; e++) { q[r + e] += yi * P[B.WQ + w + e]; k[r + e] += yi * P[B.WK + w + e]; v[r + e] += yi * P[B.WV + w + e]; }
      }
    }
    // attn_scores / d_head**0.5 -> apply_causal_mask (IGNORE = -inf) -> softmax(-1): pattern[h][posn_Q][posn_K]
    const pat = A.pattern;
    for (let h = 0; h < H; h++) for (let a = 0; a < n; a++) {
      const row = (h * n + a) * n, qa = (a * H + h) * E;
      let mx = -Infinity;
      for (let bb = 0; bb <= a; bb++) {
        const kb = (bb * H + h) * E;
        let s = 0;
        for (let e = 0; e < E; e++) s += q[qa + e] * k[kb + e];
        s *= sc;
        pat[row + bb] = s;
        if (s > mx) mx = s;
      }
      let Z = 0;
      for (let bb = 0; bb <= a; bb++) { const ex = Math.exp(pat[row + bb] - mx); pat[row + bb] = ex; Z += ex; }
      for (let bb = 0; bb <= a; bb++) pat[row + bb] /= Z;
      for (let bb = a + 1; bb < n; bb++) pat[row + bb] = 0;                 // exp(-inf) = 0 exactly
    }
    // z = einsum(v, pattern); attn_out = einsum(z, W_O) summed over heads + b_O (head_out keeps each head's share)
    const z = A.z, ho = A.head_out, ao = A.attn_out;
    z.fill(0); ho.fill(0);
    for (let h = 0; h < H; h++) for (let a = 0; a < n; a++) {
      const za = (a * H + h) * E, row = (h * n + a) * n;
      for (let bb = 0; bb <= a; bb++) { const w = pat[row + bb], vb = (bb * H + h) * E; for (let e = 0; e < E; e++) z[za + e] += w * v[vb + e]; }
    }
    for (let a = 0; a < n; a++) for (let h = 0; h < H; h++) {
      const hr = (a * H + h) * d;
      for (let e = 0; e < E; e++) { const ze = z[(a * H + h) * E + e], w = B.WO + (h * E + e) * d; for (let j = 0; j < d; j++) ho[hr + j] += ze * P[w + j]; }
    }
    for (let a = 0; a < n; a++) for (let j = 0; j < d; j++) {
      let s = P[B.bO + j];
      for (let h = 0; h < H; h++) s += ho[(a * H + h) * d + j];
      ao[a * d + j] = s;
    }
    if (zA && zA.has(l)) ao.fill(0);
    // resid_mid = attn(ln1(resid_pre)) + resid_pre
    const mid = A.resid_mid;
    for (let i = 0; i < n * d; i++) mid[i] = ao[i] + xr[i];
    // ln2, mlp: gelu_new(normalized_resid_mid @ W_in + b_in) @ W_out + b_out
    const y2 = A.ln2.y;
    layerNorm(mid, n, d, P, B.ln2w, B.ln2b, eps, y2, A.ln2.xhat, A.ln2.rstd);
    const pre = A.pre, th = A.th, post = A.post, mo = A.mlp_out;
    for (let a = 0; a < n; a++) {
      const r = a * M;
      for (let m = 0; m < M; m++) pre[r + m] = P[B.bin + m];
      for (let i = 0; i < d; i++) { const yi = y2[a * d + i], w = B.Win + i * M; for (let m = 0; m < M; m++) pre[r + m] += yi * P[w + m]; }
      for (let m = 0; m < M; m++) {
        const xx = pre[r + m], t = Math.tanh(GC * (xx + 0.044715 * xx * xx * xx));
        th[r + m] = t; post[r + m] = 0.5 * xx * (1 + t);
      }
      for (let j = 0; j < d; j++) mo[a * d + j] = P[B.bout + j];
      for (let m = 0; m < M; m++) { const pm = post[r + m], w = B.Wout + m * d; for (let j = 0; j < d; j++) mo[a * d + j] += pm * P[w + j]; }
    }
    if (zM && zM.has(l)) mo.fill(0);
    // resid_post = mlp(ln2(resid_mid)) + resid_mid
    const rp = A.resid_post;
    for (let i = 0; i < n * d; i++) rp[i] = mo[i] + mid[i];
    x = rp;
  }
  c.final.set(x);
  intervene(L, c.final);
  // logits = unembed(ln_final(residual))
  const yf = c.lnf.y;
  layerNorm(c.final, n, d, P, O.lnfw, O.lnfb, eps, yf, c.lnf.xhat, c.lnf.rstd);
  const lg = c.logits, pr = c.probs;
  for (let a = 0; a < n; a++) {
    const r = a * V;
    for (let t = 0; t < V; t++) lg[r + t] = P[O.bU + t];
    for (let i = 0; i < d; i++) { const yi = yf[a * d + i], w = O.WU + i * V; for (let t = 0; t < V; t++) lg[r + t] += yi * P[w + t]; }
    let mx = -Infinity;
    for (let t = 0; t < V; t++) if (lg[r + t] > mx) mx = lg[r + t];
    let Z = 0;
    for (let t = 0; t < V; t++) { const e = Math.exp(lg[r + t] - mx); pr[r + t] = e; Z += e; }
    for (let t = 0; t < V; t++) pr[r + t] /= Z;
  }
  return c;
}

/* mean next-token cross-entropy (ARENA's get_log_probs, negated and averaged), and dL/dlogits * scale */
function lossAndGrad(c, targets, V, scale, g) {
  const n = c.n;
  let loss = 0;
  for (let a = 0; a < n; a++) {
    loss -= Math.log(c.probs[a * V + targets[a]]);
    for (let t = 0; t < V; t++) g[a * V + t] = scale * (c.probs[a * V + t] - (t === targets[a] ? 1 : 0)) / n;
  }
  return loss / n;
}

/* LayerNorm backward: dx += rstd * (dy*w - mean(dy*w) - xhat * mean(dy*w * xhat)) */
function lnBack(dy, ln, n, d, P, wo, G, gw, gb, dx) {
  for (let p = 0; p < n; p++) {
    const r = p * d;
    let s1 = 0, s2 = 0;
    for (let i = 0; i < d; i++) {
      const dyw = dy[r + i] * P[wo + i];
      G[gw + i] += dy[r + i] * ln.xhat[r + i]; G[gb + i] += dy[r + i];
      s1 += dyw; s2 += dyw * ln.xhat[r + i];
    }
    s1 /= d; s2 /= d;
    const rs = ln.rstd[p];
    for (let i = 0; i < d; i++) dx[r + i] += rs * (dy[r + i] * P[wo + i] - s1 - ln.xhat[r + i] * s2);
  }
}

/* scratch buffers for backward, one set per (config, length) */
function makeGradWork(cfg, n) {
  const { d_model: d, d_mlp: M, n_heads: H, d_head: E } = cfg, F = (k) => new Float64Array(k);
  return { dyf: F(n * d), dx: F(n * d), dmid: F(n * d), dy2: F(n * d), dpost: F(M), dz: F(n * H * E), dq: F(n * H * E), dk: F(n * H * E),
    dv: F(n * H * E), dP: F(n), dy1: F(n * d), dres: F(n * d) };
}

/* .backward() by hand: the gradient of the loss with respect to every weight, accumulated into G */
function backward(model, c, dlogits, G, W = null) {
  const { cfg, lay, p: P } = model, O = lay.o;
  const { d_model: d, d_vocab: V, d_mlp: M, n_heads: H, d_head: E, n_layers: L } = cfg;
  const n = c.n, sc = 1 / Math.sqrt(E);
  if (!W) W = makeGradWork(cfg, n);
  // unembed (b_U is frozen: requires_grad=False in ARENA)
  const dyf = W.dyf;
  for (let a = 0; a < n; a++) for (let i = 0; i < d; i++) {
    const yi = c.lnf.y[a * d + i], w = O.WU + i * V;
    let s = 0;
    for (let t = 0; t < V; t++) { const gl = dlogits[a * V + t]; G[w + t] += yi * gl; s += P[w + t] * gl; }
    dyf[a * d + i] = s;
  }
  const dx = W.dx; dx.fill(0);
  lnBack(dyf, c.lnf, n, d, P, O.lnfw, G, O.lnfw, O.lnfb, dx);
  for (let l = L - 1; l >= 0; l--) {
    const B = O.blocks[l], A = c.blocks[l];
    // resid_post = mlp_out + resid_mid: the gradient reaches resid_mid directly and through the MLP
    const dmid = W.dmid; dmid.set(dx);
    const dy2 = W.dy2; dy2.fill(0);
    const dpost = W.dpost;
    for (let a = 0; a < n; a++) {
      const r = a * M, gr = a * d;
      for (let j = 0; j < d; j++) G[B.bout + j] += dx[gr + j];
      for (let m = 0; m < M; m++) {
        const pm = A.post[r + m], w = B.Wout + m * d;
        let s = 0;
        for (let j = 0; j < d; j++) { const gj = dx[gr + j]; G[w + j] += pm * gj; s += P[w + j] * gj; }
        const xx = A.pre[r + m], t = A.th[r + m];
        dpost[m] = s * (0.5 * (1 + t) + 0.5 * xx * (1 - t * t) * GC * (1 + 3 * 0.044715 * xx * xx));   // gelu_new'
        G[B.bin + m] += dpost[m];
      }
      for (let i = 0; i < d; i++) {
        const yi = A.ln2.y[gr + i], w = B.Win + i * M;
        let s = 0;
        for (let m = 0; m < M; m++) { G[w + m] += yi * dpost[m]; s += P[w + m] * dpost[m]; }
        dy2[gr + i] = s;
      }
    }
    lnBack(dy2, A.ln2, n, d, P, B.ln2w, G, B.ln2w, B.ln2b, dmid);
    // resid_mid = attn_out + resid_pre
    const dres = W.dres; dres.set(dmid);
    const dz = W.dz; dz.fill(0);
    for (let a = 0; a < n; a++) {
      const gr = a * d;
      for (let j = 0; j < d; j++) G[B.bO + j] += dmid[gr + j];
      for (let h = 0; h < H; h++) for (let e = 0; e < E; e++) {
        const zi = (a * H + h) * E + e, ze = A.z[zi], w = B.WO + (h * E + e) * d;
        let s = 0;
        for (let j = 0; j < d; j++) { const gj = dmid[gr + j]; G[w + j] += ze * gj; s += P[w + j] * gj; }
        dz[zi] = s;
      }
    }
    const dq = W.dq, dk = W.dk, dv = W.dv, dP = W.dP;
    dq.fill(0); dk.fill(0); dv.fill(0);
    for (let h = 0; h < H; h++) for (let a = 0; a < n; a++) {
      const row = (h * n + a) * n, za = (a * H + h) * E;
      let dot = 0;
      for (let bb = 0; bb <= a; bb++) {
        const vb = (bb * H + h) * E, w = A.pattern[row + bb];
        let s = 0;
        for (let e = 0; e < E; e++) { s += dz[za + e] * A.v[vb + e]; dv[vb + e] += w * dz[za + e]; }
        dP[bb] = s; dot += s * w;
      }
      for (let bb = 0; bb <= a; bb++) {
        const ds = A.pattern[row + bb] * (dP[bb] - dot) * sc;          // softmax backward, then the 1/sqrt(d_head)
        const kb = (bb * H + h) * E;
        for (let e = 0; e < E; e++) { dq[za + e] += ds * A.k[kb + e]; dk[kb + e] += ds * A.q[za + e]; }
      }
    }
    const dy1 = W.dy1; dy1.fill(0);
    for (let a = 0; a < n; a++) for (let h = 0; h < H; h++) {
      const r = (a * H + h) * E;
      for (let e = 0; e < E; e++) { G[B.bQ + h * E + e] += dq[r + e]; G[B.bK + h * E + e] += dk[r + e]; G[B.bV + h * E + e] += dv[r + e]; }
      for (let i = 0; i < d; i++) {
        const yi = A.ln1.y[a * d + i], w = (h * d + i) * E;
        let s = 0;
        for (let e = 0; e < E; e++) {
          const gq = dq[r + e], gk = dk[r + e], gv = dv[r + e];
          G[B.WQ + w + e] += yi * gq; G[B.WK + w + e] += yi * gk; G[B.WV + w + e] += yi * gv;
          s += P[B.WQ + w + e] * gq + P[B.WK + w + e] * gk + P[B.WV + w + e] * gv;
        }
        dy1[a * d + i] += s;
      }
    }
    lnBack(dy1, A.ln1, n, d, P, B.ln1w, G, B.ln1w, B.ln1b, dres);
    dx.set(dres);
  }
  // residual = embed(tokens) + pos_embed(tokens)
  for (let a = 0; a < n; a++) for (let i = 0; i < d; i++) { G[O.WE + c.tokens[a] * d + i] += dx[a * d + i]; G[O.WP + a * d + i] += dx[a * d + i]; }
  return G;
}

/* The training set: "A met B. B thanked" -> A, for every ordered pair of different names (12
   sentences). Every position learns to predict its next token, as in ARENA's training loop. */
function dataset() {
  const out = [];
  for (const A of NAMES) for (const B of NAMES) if (A !== B) {
    const toks = [A, WID.met, B, WID['.'], B, WID.thanked];
    out.push({ tokens: toks, targets: [...toks.slice(1), A] });
  }
  return out;
}
const DATA = dataset();

/* ARENA's AdamW ([0.3] solution): theta *= 1 - lr*wd; moments m, v; bias-corrected step */
function makeAdamW(model, { lr = 0.01, betas = [0.9, 0.999], eps = 1e-8, weight_decay = 0.01 } = {}) {
  const N = model.p.length, f = model.lay.T['unembed.b_U'];
  return { lr, b1: betas[0], b2: betas[1], eps, wd: weight_decay, t: 1, m: new Float64Array(N), v: new Float64Array(N), f0: f.off, f1: f.off + f.n };
}
function adamwStep(opt, P, G) {
  const { lr, b1, b2, eps, wd, f0, f1 } = opt;
  const c1 = 1 - b1 ** opt.t, c2 = 1 - b2 ** opt.t;
  for (let i = 0; i < P.length; i++) {
    if (i >= f0 && i < f1) continue;                              // b_U: requires_grad=False
    const g = G[i];
    P[i] *= 1 - lr * wd;
    opt.m[i] = b1 * opt.m[i] + (1 - b1) * g;
    opt.v[i] = b2 * opt.v[i] + (1 - b2) * g * g;
    P[i] -= lr * (opt.m[i] / c1) / (Math.sqrt(opt.v[i] / c2) + eps);
  }
  opt.t += 1;
}

/* a trainer: full batch (the 12 sentences), AdamW; step() returns the loss before the step */
const TRAIN = { steps: 300, lr: 0.01, weight_decay: 0.01, seed: 7 };
function makeTrainer(cfg) {
  const model = initModel(cfg, TRAIN.seed), opt = makeAdamW(model, { lr: TRAIN.lr, weight_decay: TRAIN.weight_decay });
  const n = DATA[0].tokens.length, cache = makeCache(cfg, n), work = makeGradWork(cfg, n);
  const G = new Float64Array(model.p.length), dl = new Float64Array(n * cfg.d_vocab);
  const T = {
    model, opt, G, step: 0, losses: [],
    grad() {                                                       // loss and gradient at the current weights
      G.fill(0);
      let loss = 0;
      for (const s of DATA) {
        forward(model, s.tokens, {}, cache);
        loss += lossAndGrad(cache, s.targets, cfg.d_vocab, 1 / DATA.length, dl) / DATA.length;
        backward(model, cache, dl, G, work);
      }
      return loss;
    },
    stepOnce() { const loss = T.grad(); adamwStep(opt, model.p, G); T.losses.push(loss); T.step++; return loss; },
  };
  return T;
}
function train(cfg, steps = TRAIN.steps) { const T = makeTrainer(cfg); for (let s = 0; s < steps; s++) T.stepOnce(); return T; }
function datasetLoss(model) {
  const n = DATA[0].tokens.length, cache = makeCache(model.cfg, n), g = new Float64Array(n * model.cfg.d_vocab);
  let loss = 0;
  for (const s of DATA) { forward(model, s.tokens, {}, cache); loss += lossAndGrad(cache, s.targets, model.cfg.d_vocab, 1, g) / DATA.length; }
  return loss;
}
/* gradient size per part of the tower (the red arrows' lengths) */
function partNorms(model, G) {
  const T = model.lay.T, L = model.cfg.n_layers, out = { embed: 0, attn: [], mlp: [], unembed: 0 };
  const sq = (name) => { const t = T[name]; let s = 0; for (let i = 0; i < t.n; i++) s += G[t.off + i] ** 2; return s; };
  out.embed = Math.sqrt(sq('embed.W_E') + sq('pos_embed.W_pos'));
  for (let l = 0; l < L; l++) {
    const b = `blocks.${l}.`;
    out.attn.push(Math.sqrt(['ln1.w', 'ln1.b', 'attn.W_Q', 'attn.W_K', 'attn.W_V', 'attn.W_O', 'attn.b_Q', 'attn.b_K', 'attn.b_V', 'attn.b_O'].reduce((s, k) => s + sq(b + k), 0)));
    out.mlp.push(Math.sqrt(['ln2.w', 'ln2.b', 'mlp.W_in', 'mlp.W_out', 'mlp.b_in', 'mlp.b_out'].reduce((s, k) => s + sq(b + k), 0)));
  }
  out.unembed = Math.sqrt(sq('ln_final.w') + sq('ln_final.b') + sq('unembed.W_U'));
  return out;
}

const _o = new THREE.Object3D();
function setI(mesh, i, x, y, z, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0) {
  _o.position.set(x, y, z); _o.rotation.set(rx, ry, rz); _o.scale.set(sx, sy, sz); _o.updateMatrix();
  mesh.setMatrixAt(i, _o.matrix);
}
function commit(mesh, n) {
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.computeBoundingSphere();
}
function inst(geom, mat, n, shadow = true) {
  const m = new THREE.InstancedMesh(geom, mat, n);
  m.castShadow = shadow; m.receiveShadow = true; m.frustumCulled = false; m.count = 0;
  return m;
}
const COL = {
  data: new THREE.Color(C.data), aux: new THREE.Color(C.aux), dir: new THREE.Color(C.dir), prob: new THREE.Color(C.prob),
  grey: new THREE.Color('#b9b3a8'), pale: new THREE.Color('#f5e3bf'), head: new THREE.Color('#ecc071'), mlp: new THREE.Color('#e8decd'), mlpOff: new THREE.Color('#bdb7ad'),
  arcOff: new THREE.Color('#aaa49a'), white: new THREE.Color('#ffffff'), tmp: new THREE.Color(),
};

/* one floor plate (JSCAD, z-up, unit height): a rounded slab with a hole for every tube */
function slabSolid() {
  const { roundedRectangle, cylinder } = J.primitives;
  const w = SLAB.x1 - SLAB.x0, d = SLAB.z1 - SLAB.z0, cx = (SLAB.x0 + SLAB.x1) / 2, cy = -(SLAB.z0 + SLAB.z1) / 2;
  const plate = J.extrusions.extrudeLinear({ height: 1 }, roundedRectangle({ size: [w, d], roundRadius: 0.07, center: [cx, cy], segments: 24 }));
  const holes = Array.from({ length: NP }, (_, p) => cylinder({ radius: RT + 0.014, height: 1.4, center: [X(p), 0, 0.5], segments: 28 }));
  return J.booleans.subtract(plate, ...holes);
}
function rimSolid() {
  const { roundedRectangle } = J.primitives;
  const w = SLAB.x1 - SLAB.x0, d = SLAB.z1 - SLAB.z0, cx = (SLAB.x0 + SLAB.x1) / 2, cy = -(SLAB.z0 + SLAB.z1) / 2;
  const outer = roundedRectangle({ size: [w + 0.028, d + 0.028], roundRadius: 0.084, center: [cx, cy], segments: 24 });
  const inner = roundedRectangle({ size: [w - 0.004, d - 0.004], roundRadius: 0.068, center: [cx, cy], segments: 24 });
  return J.extrusions.extrudeLinear({ height: 1 }, J.booleans.subtract(outer, inner));
}
function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const FONT = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
/* an MLP collar: a rounded ring round its tube (lathe profile, closed) */
function collarGeometry() {
  const r0 = RT + 0.006, r1 = MLP_R, h = FY.mlpH / 2, c = 0.022;
  const pts = [[r0, -h], [r1 - c, -h], [r1 - c * 0.3, -h + c * 0.3], [r1, -h + c], [r1, h - c], [r1 - c * 0.3, h - c * 0.3], [r1 - c, h], [r0, h], [r0, -h]];
  return new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), 36);
}

function buildGauge(S) {

  panel.castShadow = true; g.add(panel);
  const edge = new THREE.Mesh(new THREE.BoxGeometry(GW - 0.06, 0.012, 0.012).translate(0, GH / 2 - 0.004, 0.022), mat.brass); g.add(edge);
  const span = GB.dx * 11 + GB.w + 0.06, mid = GB.x0 + GB.dx * 5.5;
  for (const y of GROWS) { const r = new THREE.Mesh(new THREE.BoxGeometry(span, 0.006, 0.01), mat.brass); r.position.set(mid, y, 0.025); g.add(r); }
  st.meshes.gBars = inst(new THREE.BoxGeometry(GB.w, 1, 0.022).translate(0, 0.5, 0), mat.gaugeBar, 36, false);
  g.add(st.meshes.gBars);
  st.gaugeRoot = new THREE.Group(); st.gaugeRoot.add(g); S.root.add(st.gaugeRoot);
  st.gaugeRod = K.tube([[0, 0, 0], [0, 1, 0]], C.brass, 0.011, { material: mat.brass });
  st.gaugeClamp = new THREE.Mesh(new THREE.TorusGeometry(RT + 0.02, 0.014, 8, 28).rotateX(Math.PI / 2), mat.brass);
  st.gaugeRoot.add(st.gaugeRod.mesh, st.gaugeClamp);
  st.gaugeRoot.visible = false;
}

function wirePicking(S) {
  const st = S.state, M = st.meshes, T = st.tool;
  const pk = (obj, id, info) => K.pick(obj, (hit) => { st.pickedAt = performance.now(); openPart(S, id, info ? info(hit) : {}); });
  const L = () => st.model.cfg.n_layers, H = () => st.model.cfg.n_heads;
  pk(M.tiles, 'tok', (h) => ({ p: h.instanceId }));
  pk(M.glass, 'stream', (h) => ({ p: h.instanceId }));
  pk(M.cores, 'stream', (h) => ({ p: Math.floor(h.instanceId / (3 * L() + 2)) }));
  pk(M.slabs, 'block', (h) => ({ s: h.instanceId }));
  pk(M.heads, 'attn', (h) => ({ l: Math.floor(h.instanceId / H()), h: h.instanceId % H() }));
  pk(M.mlps, 'mlp', (h) => ({ l: Math.floor(h.instanceId / NP), p: h.instanceId % NP }));
  pk(M.caps, 'top');
  pk(st.sky, 'top');
  pk(st.fan, 'top');
  st.arcMeshes.forEach((m, l) => pk(m, 'arcs', () => ({ l })));
  pk(M.shafts, 'grad'); pk(M.tips, 'grad');
  st.gaugePick = () => { st.pickedAt = performance.now(); openPart(S, 'gauge', {}); };
  st.toolPick = {};
  for (const k of ['probe', 'steer', 'patch', 'sae', 'lora', 'reward', 'evals', 'loop', 'plaque']) st.toolPick[k] = (hit) => { st.pickedAt = performance.now(); openPart(S, k, {}); };
}
/* the kit raycasts hidden objects too, so hidden instruments leave the pick list */
function setToolPick(S, on) {
  const st = S.state;
  for (const k in st.toolPick) {
    const g = st.tool[k];
    if (on && !g.userData.picked) { K.pick(g, st.toolPick[k]); g.userData.picked = true; }
    if (!on && g.userData.picked) { K.unpick(g); g.userData.picked = false; }
  }
}

/* ---- the part card (own DOM; closes on an empty tap, Escape, or when a kit sheet opens) ---- */
function mdLite(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
    .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function buildPartCard(S) {
  const st = S.state, app = document.querySelector('.k-app') || document.body;
  const box = document.createElement('div');
  box.className = 'nm-part'; box.hidden = true;
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'About this part');
  box.innerHTML = '<div class="nm-ph"><span class="nm-pn"></span><span class="nm-pw"></span><button type="button" class="nm-px" aria-label="Close">✕</button></div><p class="nm-pt"></p><p class="nm-live"></p><div class="nm-pl"></div>';
  app.appendChild(box);
  box.querySelector('.nm-px').addEventListener('click', () => closePart(S));
  st.part = { box, id: null, info: null };
  new MutationObserver(() => { if (app.dataset && app.dataset.sheet) closePart(S); }).observe(app, { attributes: true, attributeFilter: ['data-sheet'] });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') closePart(S); });
  const cv = S.renderer.domElement;
  let dn = null;
  cv.addEventListener('pointerdown', (e) => { dn = { x: e.clientX, y: e.clientY, t: performance.now() }; }, { passive: true });
  cv.addEventListener('pointerup', (e) => {
    if (!dn) return;
    const tap = Math.hypot(e.clientX - dn.x, e.clientY - dn.y) < 8 && performance.now() - dn.t < 450;
    dn = null;
    if (tap && !(performance.now() - (st.pickedAt || 0) < 150)) closePart(S);
  }, { passive: true });
}
function openPart(S, id, info = {}) {
  const st = S.state, P = PARTS[id];
  if (!P) return;
  st.part.id = id; st.part.info = info;
  paintPart(S);
  st.part.box.hidden = false;
  st.part.box.scrollTop = 0;
}
function closePart(S) { const st = S.state; if (st.part && !st.part.box.hidden) { st.part.box.hidden = true; st.part.id = null; } }
function paintPart(S) {
  const st = S.state, id = st.part.id;
  if (!id) return;
  const P = PARTS[id], box = st.part.box, t = S.tier;
  box.querySelector('.nm-pn').textContent = P.name[t] || P.name[2];
  box.querySelector('.nm-pw').textContent = P.wk;
  box.querySelector('.nm-pt').innerHTML = mdLite(P.txt[t] || P.txt[2]);
  box.querySelector('.nm-live').textContent = liveLine(S, id, st.part.info);
  box.querySelector('.nm-pl').innerHTML = P.links.map((o) => `<a href="${o}.html">${mdLite(OBJ[o][0])} <i>W${OBJ[o][1]}</i></a>`).join('');
}
/* one line of live numbers for the tapped part */
function liveLine(S, id, info) {
  const st = S.state, m = st.model, cfg = m.cfg, d = cfg.d_model, L = cfg.n_layers, A = st.c.A, k = S.knobs;
  const toks = st.toks, top = argmaxAt(A.probs, LAST);
  switch (id) {
    case 'tok': { const p = info.p ?? 0; return `Live: ${wq(toks[p])} is token ${toks[p]} of ${V}, at position ${p}.`; }
    case 'embed': return `Live: the last word starts as ${d} numbers with length ${f2(nrm(A.embed, LAST * d, d))}.`;
    case 'stream': { const p = info.p ?? LAST; return `Live: ${wq(toks[p])}'s stream grows from length ${f2(nrm(A.embed, p * d, d))} to ${f2(nrm(A.final, p * d, d))} on its way up.`; }
    case 'block': return `Live: this toy has ${L} blocks × ${cfg.n_heads} heads, ${paramCount(cfg, { b_U: true }).total.toLocaleString('en-US')} weights. GPT-2 small: 12 × 12, 124M.`;
    case 'attn': {
      const l = info.l ?? 0, h = info.h ?? 0, n = NP, pat = A.blocks[l].pattern, row = (h * n + LAST) * n;
      let b = 0; for (let j = 1; j < n; j++) if (pat[row + j] > pat[row + b]) b = j;
      const off = zeroSets(k.off, L).attn.has(l) ? ' (switched off: its output is zeroed)' : '';
      return `Live: head ${l}.${h}: the last word puts ${pc(pat[row + b])} of its attention on ${wq(toks[b])}${off}.`;
    }
    case 'arcs': {
      const l = info.l ?? 0, n = NP, pat = A.blocks[l].pattern, H = cfg.n_heads;
      let best = [0, 0, 0]; for (let h = 0; h < H; h++) for (let j = 0; j < LAST; j++) { const w = pat[(h * n + LAST) * n + j]; if (w > best[0]) best = [w, h, j]; }
      return `Live: block ${l}'s strongest arc into the last word is head ${l}.${best[1]} from ${wq(toks[best[2]])}, weight ${f2(best[0])}.`;
    }
    case 'mlp': { const l = info.l ?? 0, p = info.p ?? LAST; return `Live: block ${l}'s MLP adds a vector of length ${f2(nrm(A.blocks[l].mlp_out, p * d, d))} to ${wq(toks[p])}'s stream.`; }
    case 'top': return `Live: next word ${wq(top)} at ${pc(A.probs[LAST * V + top])}; the 12 amber bars sum to 1.`;
    case 'grad': return st.gnorm ? `Live: gradient size now: embed ${f3(st.gnorm.embed)}, attention ${st.gnorm.attn.map(f3).join(' / ')}, unembed ${f3(st.gnorm.unembed)}.` : '';
    case 'probe': return `Live: the needle reads ${f2(st.probe)} (0 = Mary's run, 1 = Anna's run).`;
    case 'steer': return `Live: α = ${k.steer.toFixed(2)} at floor ${st.sL}; the next word is ${wq(top)} at ${pc(A.probs[LAST * V + top])}.`;
    case 'evals': return `Live: ${st.evals.ok} of 12 toy prompts right, mean p(answer) ${f3(st.evals.mp)}.`;
    case 'loop': return `Live: the next tile would be ${wq(top)}.`;
    case 'gauge': return st.gaugeErr != null ? `Live: largest |row 1 + row 2 − row 3| = ${st.gaugeErr === 0 ? '0 exactly' : st.gaugeErr.toExponential(1)}.` : '';
    default: return '';
  }
}
function argmaxAt(pr, pos) { let b = 0; for (let t = 1; t < V; t++) if (pr[pos * V + t] > pr[pos * V + b]) b = t; return b; }

/* ====================================================================== the model */
const keyOf = (L, H) => `L${L}H${H}`;
function setModel(S, m, force = false) {
  const st = S.state;
  if (st.model !== m || force) st.modelVer = (st.modelVer || 0) + 1;
  st.model = m;
  if (!st.c || st.c.cfg !== m.cfg) {
    const cfg = m.cfg;
    st.c = { cfg, A: makeCache(cfg, NP), R: makeCache(cfg, NP), M: makeCache(cfg, NP), N: makeCache(cfg, NP), E: makeCache(cfg, NP) };
  }
}
/* switch to the model for the current knobs: cached, or train it live */
function ensureModel(S) {
  const st = S.state, key = keyOf(S.knobs.layers, S.knobs.heads);
  if (st.trainer && st.trainer.key === key && !st.trainer.replay) return;
  if (st.models.has(key) && !(st.trainer && st.trainer.key === key)) { st.trainer = null; setModel(S, st.models.get(key)); return; }
  if (!st.models.has(key)) startTraining(S, false);
}
function startTraining(S, replay) {
  const st = S.state, key = keyOf(S.knobs.layers, S.knobs.heads);
  const T = makeTrainer(config(S.knobs.layers, S.knobs.heads));
  T.key = key; T.replay = replay; T.arcStep = -99;
  st.trainer = T;
  setModel(S, T.model);
  if (S.shot) { while (T.step < TRAIN.steps) T.stepOnce(); finishTraining(S, false); return; }
  if (!replay) K.toast(`Training a new ${S.knobs.layers} × ${S.knobs.heads} toy live (${TRAIN.steps} steps)`);
  S.invalidate();
}
function finishTraining(S, repaint = true) {
  const st = S.state, T = st.trainer;
  if (!T) return;
  st.models.set(T.key, T.model);
  st.lastLosses = T.losses.slice();
  st.trainer = null;
  setModel(S, T.model, true);
  if (repaint) { compute(S); paint(S); }
}
function cancelReplay(S) {
  const st = S.state;
  if (st.trainer && st.trainer.replay && st.models.has(st.trainer.key)) { const k = st.trainer.key; st.trainer = null; setModel(S, st.models.get(k)); }
}

/* all forward passes the picture needs, with the knobs' hooks */
function compute(S) {
  const st = S.state, k = S.knobs, m = st.model, cfg = m.cfg, L = cfg.n_layers, d = cfg.d_model, c = st.c;
  forward(m, PROMPT, {}, c.M);                                   // clean Mary run
  forward(m, PROMPT_ANNA, {}, c.N);                              // clean Anna run
  st.sL = Math.ceil(L / 2); st.pr = Math.min(st.sL + 1, L);
  if (!st.v || st.v.length !== d) { st.v = new Float64Array(d); st.u = new Float64Array(d); }
  const diff = (l, out) => { const a = streamAt(c.N, l, L), b = streamAt(c.M, l, L); for (let i = 0; i < d; i++) out[i] = a[LAST * d + i] - b[LAST * d + i]; };
  diff(st.sL, st.v); diff(st.pr, st.u);                         // v: the dial's direction; u: the probe's
  const iv = { zero: zeroSets(k.off, L) };
  if (k.steer > 0) iv.add = { layer: st.sL, pos: LAST, vec: st.v, alpha: k.steer };
  st.iv = iv;
  st.toks = tokensFor(k.swap);
  forward(m, st.toks, iv, c.A);
  st.cmp = k.swap !== 'none' ? 'swap' : k.off !== 'none' ? 'off' : k.steer > 0 ? 'steer' : null;
  if (st.cmp) forward(m, PROMPT, k.swap !== 'none' ? iv : {}, c.R);
  // probe: (x - x_Mary) . u / |u|^2 one floor above the dial
  const x = streamAt(c.A, st.pr, L), x0 = streamAt(c.M, st.pr, L);
  let s = 0, uu = 0;
  for (let i = 0; i < d; i++) { s += (x[LAST * d + i] - x0[LAST * d + i]) * st.u[i]; uu += st.u[i] * st.u[i]; }
  st.probe = uu > 1e-12 ? s / uu : 0;
  // evals: the 12 toy prompts with the same hooks
  let ok = 0, mp = 0;
  for (const ex of DATA) {
    forward(m, ex.tokens, iv, c.E);

  {
    const T = st.trainer, losses = T ? T.losses : v.note === 'train' ? st.lastLosses : null;
    if (losses && losses.length) {
      const step = T ? T.step : losses.length, lo = losses[losses.length - 1];

      Lb.train.show(true);
    } else Lb.train.show(false);
  }
  if (v.note === 'steer') {
    st.at.note.position.copy(st.tool.steer.position).add(new THREE.Vector3(0.56, -0.02, 0.05));

    N.show(true);
  }
  if (v.note === 'contested' && L >= 4) {
    const pat = A.blocks[3].pattern, w = pat[(0 * NP + LAST) * NP + 0];

  if (v.note === 'mlpoff') {
    const l = Math.min(1, L - 1);
    st.at.note.position.set(X(0) - MLP_R - 0.12, st.G.yb(l) + FY.mlpC, 0.06);     // left of the tower: the gauge fills the right
    N.anchor('right');
    const B = A.blocks[l]; let mx = 0; for (let i = 0; i < NP * d; i++) mx = Math.max(mx, Math.abs(B.resid_post[i] - B.resid_mid[i]));

      : sub === 'mlp' ? { 1: ['before', '+ calculator', '= after'], 2: ['resid_mid', '+ mlp_out', '= resid_post'], 3: ['resid_mid', '+ mlp_out', '= resid_post'] }
      : { 1: ['before', '+ attention', '= after'], 2: ['resid_pre', '+ attn_out', '= resid_mid'], 3: ['resid_pre', '+ attn_out', '= resid_mid'] };

      ? { 1: `“${w}” → ${d} numbers (GPT-2 small: 768)\nits word's row + its place's row`, 2: `“${w}”, position ${gp}: W_E row ${st.toks[gp]} + W_pos row ${gp}\nd_model = ${d} here, 768 in GPT-2 small`, 3: `embed[${gp}] = W_E[${st.toks[gp]}] + W_pos[${gp}], max|Δ| = ${es}\nW_E ${V} × ${d}, W_pos ${NP} × ${d} (GPT-2: 50,257 × 768)` }[t]
      : { 1: `the ${d} numbers of “${w}”'s tube · row 1 + row 2 = row 3`, 2: `“${w}”'s stream in block ${gl} · max |1 + 2 − 3| = ${es}`, 3: `posn ${gp}, block ${gl} · max|x + f(x) − x′| = ${es}` }[t]);

  Lb.tools.evals.show(!!k.tools && v.toolTags !== false);
}

/* ====================================================================== beats */
function scene(S, o = {}) {
  const st = S.state;
  if (!o.train) cancelReplay(S);
  st.view = { note: o.note || null, gauge: o.gauge || null, tags: new Set(o.tags || []), toolTags: o.toolTags, arrows: !!o.arrows, sky: o.sky, chips: o.chips };
  placeGauge(S);
  const f = st.fig;
  if (o.fig) {
    f.group.visible = true;
    f.place(o.figAt || FIG, o.face || [0, 2.2, 0]);
    f.pose('stand', { ms: 0 });
    const at = typeof o.at === 'function' ? o.at(S) : o.at;
    const go = () => f.pose(o.fig, { at });
    if (S.shot) go(); else setTimeout(go, 480);
  } else f.group.visible = false;
  if (o.train) startTraining(S, true);
  compute(S); paint(S);
}
const worldOf = (obj) => obj.getWorldPosition(new THREE.Vector3()).toArray();
const DEF = { layers: 4, heads: 3, swap: 'none', off: 'none', steer: 0, explode: 0.3 };
function wait(S, ms) { return S.shot ? Promise.resolve() : new Promise((r) => setTimeout(r, ms)); }
