<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Highway · Object Lessons</title>
<meta name="description" content="Why deep nets need a shortcut: a gradient beam passes down through up to 50 panes of glass, vanishing or exploding, until a residual pipe keeps a path worth exactly 1.">
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   04 · d02-highway: "The highway" (W2 deep, ARENA [0.2] ResNets)
   A toy network: a chain of N scalar layers. The backward pass multiplies the
   gradient by every layer's local slope, so what reaches the input is a
   product. Every number on screen comes from the MATH block below, which is
   extracted and checked in node against independent computations (LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
const BN_EPS = 1e-5;   // ARENA: BatchNorm2d(num_features, eps=1e-05, momentum=0.1)

/* Local slope of every layer, in FORWARD order (index 0 = the layer next to the input).
   plain:      x_l = g·x_(l-1)                slope g
   BatchNorm:  x_l = BN(g·x_(l-1))            slope g/√(g²v + ε) on the part of the gradient that
               BN passes (v = batch variance of x_(l-1)); BN divides the gain back out, so ≈ 1
   residual:   x_l = x_(l-1) + f(x_(l-1))     slope 1 + f'                                        */
function layerSlopes(N, { g, res, fp, norm }) {
  const out = [];
  let v = 1;                                  // the toy input batch has variance 1
  for (let l = 0; l < N; l++) {
    if (res) out.push(1 + fp);
    else if (norm) {
      const vy = g * g * v;                   // variance of y = g·x over the batch
      out.push(Math.abs(g) / Math.sqrt(vy + BN_EPS));
      v = vy / (vy + BN_EPS);                 // variance after normalising (a hair under 1)
    } else out.push(g);
  }
  return out;
}

/* Backward pass: the gradient leaves the loss as dL/dL = 1 and each layer multiplies it by its
   slope on the way down (chain rule). beam[d] = the gradient after passing d layers from the top. */
function backward(slopes) {
  const beam = [1];
  for (let d = 0; d < slopes.length; d++) beam.push(beam[d] * slopes[slopes.length - 1 - d]);
  return beam;
}

/* Π(1 + f'_l) multiplied out: one term per route (skip or branch at every block).
   e[k] = total worth of the routes through exactly k branches (the elementary symmetric
   polynomial of degree k in f'_1..f'_N); Σ e[k] = Π(1 + f'_l). */
function routeSums(fps) {
  const e = [1];
  for (const f of fps) {
    e.push(0);
    for (let k = e.length - 1; k >= 1; k--) e[k] += f * e[k - 1];
  }
  return e;
}
function routeList(N, fp) {                   // every route as a bitmask of the branches it takes
  const out = [];
  for (let m = 0; m < (1 << N); m++) {
    let k = 0;
    for (let b = 0; b < N; b++) if (m & (1 << b)) k++;
    out.push({ m, k, worth: fp ** k });
  }
  return out;
}
const binom = (n, k) => { let c = 1; for (let i = 1; i <= k; i++) c = (c * (n - k + i)) / i; return c; };
const MATH = { BN_EPS, layerSlopes, backward, routeSums, routeList, binom };
// MATH-END

/* ============================================================ display setup */

const PANE_W = 1.24, PANE_T = 0.02, HOLE_R = 0.165, PIPE_R = 0.13;
const Y_TOP = 2.68, Y_BOT = 0.46, CROSS_Y = 2.92, LAMP_Y = 3.07, IN_Y = 0.135;
const POST = 0.6, R0 = 0.05;
const RESNET34 = [3, 4, 6, 3];           // ARENA ResNet34: n_blocks_per_group (input side first)
const COL = {
  red: new THREE.Color(C.grad), hot: new THREE.Color('#ffe2a8'), ash: new THREE.Color('#c9c1b5'),
  teal: new THREE.Color(C.aux), smoke: new THREE.Color('#6f6a64'), amber: new THREE.Color(C.prob),
  clear: new THREE.Color('#f4f7f7'), brass: new THREE.Color(C.brass),
};
const CAM = {
  front: { pos: [3.2, 3.0, 7.4], target: [0, 1.5, 0] },
  high: { pos: [2.6, 5.2, 6.8], target: [0, 1.45, 0] },
  low: { pos: [3.6, 1.6, 7.0], target: [0, 1.4, 0] },
  routes: { pos: [1.9, 5.6, 5.9], target: [0, 1.5, 0] },
  bars: { pos: [1.4, 3.1, 7.2], target: [0, 1.2, 0.3] },
  side: { pos: [-3.4, 2.6, 6.9], target: [0, 1.45, 0] },
};

/* numbers: 3 significant figures, powers of ten outside [0.001, 100000) */
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const sup = (n) => String(n).split('').map((c) => SUP[c] ?? c).join('');
function num(v, d = 3) {
  if (!Number.isFinite(v)) return v > 0 ? '∞' : '−∞';
  const a = Math.abs(v);
  if (a === 0) return '0';
  let s;
  if (a >= 1e-3 && a < 1e5) {
    const e = Math.floor(Math.log10(a));
    s = e >= d ? String(Math.round(v / 10 ** (e - d + 1)) * 10 ** (e - d + 1)) : v.toPrecision(d);
  } else {
    let e = Math.floor(Math.log10(a)), m = v / 10 ** e;
    if (Math.abs(Number(m.toFixed(d - 1))) >= 10) { m /= 10; e += 1; }
    s = `${m.toFixed(d - 1)} × 10${sup(e)}`;
  }
  return s.replace('-', '−');
}
const numT = (v, d = 4) => String(Number(v.toPrecision(d))).replace('-', '−');     // no trailing zeros
const g2 = (v) => String(Number(v.toFixed(2))).replace('-', '−');          // 0.7, 1.05, −0.1
const signed = (v) => (v < 0 ? `− ${g2(-v)}` : `+ ${g2(v)}`);

/* ======================================================== object behaviour */

function paneY(N, i) { return N === 1 ? (Y_TOP + Y_BOT) / 2 : Y_TOP - (i * (Y_TOP - Y_BOT)) / (N - 1); }

function compute(S) {
  const st = S.state, k = S.knobs;
  const N = Math.round(k.depth);
  st.N = N;
  st.slopes = layerSlopes(N, { g: k.gain, res: k.res, fp: k.fp, norm: k.norm });
  st.beam = backward(st.slopes);
  st.bottom = st.beam[N];
  st.e = k.res ? routeSums(new Array(N).fill(k.fp)) : null;
}

/* beam width and colour from the gradient's size (log scale: width shows powers of ten) */
function beamLook(I, out) {
  const s = Math.log10(Math.max(1e-300, Math.abs(I)));
  const r = R0 * Math.min(2.1, Math.max(0.05, 1 + s / 5));
  out.copy(COL.red);
  if (s < 0) out.lerp(COL.ash, Math.min(1, -s / 3.5));
  else out.lerp(COL.hot, Math.min(0.85, s / 4));
  return r;
}

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _c = new THREE.Color();

function layoutPanes(S) {
  const st = S.state, k = S.knobs, N = st.N;
  st.panes.geometry = k.res ? st.geoHole : st.geoSolid;
  st.panes.count = N;
  const groups = st.groups && k.res && N === 16;
  let gi = 0;
  const ends = [];
  { let acc = 0; for (const n of RESNET34) { acc += n; ends.push(acc); } }
  for (let i = 0; i < N; i++) {
    _m.makeTranslation(0, paneY(N, i), 0);
    st.panes.setMatrixAt(i, _m);
    // tint: plain panes show their gain (smoke < 1 < amber); residual panes are clear
    if (groups) {
      const fromBottom = N - 1 - i;
      gi = ends.findIndex((e) => fromBottom < e);
      _c.copy(gi % 2 ? COL.clear : COL.brass).lerp(COL.clear, gi % 2 ? 0 : 0.15);
    } else if (k.res || k.norm) _c.copy(COL.clear);
    else if (k.gain < 1) _c.copy(COL.clear).lerp(COL.smoke, Math.min(1, (1 - k.gain) / 0.7));
    else _c.copy(COL.clear).lerp(COL.amber, Math.min(1, (k.gain - 1) / 0.5));
    st.panes.setColorAt(i, _c);
  }
  st.panes.instanceMatrix.needsUpdate = true;
  if (st.panes.instanceColor) st.panes.instanceColor.needsUpdate = true;
  st.panes.material.opacity = k.res ? 0.2 : k.norm ? 0.2 : 0.2 + Math.min(0.2, Math.abs(k.gain - 1) * 0.35);
  st.pipe.visible = !!k.res;
  st.pipe.material.opacity = st.showRoutes && N <= 5 ? 0.1 : 0.2;
}

/* the beam: N + 1 segments, drawn down to fraction u of the way (the pour) */
function drawBeam(S) {
  const st = S.state, N = st.N, u = st.u;
  const showBeam = !(st.showRoutes && N <= 5);
  let n = 0;
  if (showBeam) {
    for (let d = 0; d <= N; d++) {
      const y0 = d === 0 ? CROSS_Y : paneY(N, d - 1);
      const y1 = d === N ? IN_Y : paneY(N, d);
      const f = Math.max(0, Math.min(1, u - d));
      if (f <= 0) break;
      const r = beamLook(st.beam[d], _c);
      const yb = y0 - (y0 - y1) * f;
      _p.set(0, (y0 + yb) / 2, 0);
      _s.set(r, Math.max(1e-4, y0 - yb), r);
      _m.compose(_p, _q.identity(), _s);
      st.beamMesh.setMatrixAt(n, _m);
      st.beamMesh.setColorAt(n, _c);
      n++;
    }
  }
  st.beamMesh.count = n;
  st.beamMesh.instanceMatrix.needsUpdate = true;
  if (st.beamMesh.instanceColor) st.beamMesh.instanceColor.needsUpdate = true;
  // the glow where the beam lands on the input
  const done = u >= N + 1 - 1e-9;
  st.spot.visible = done && showBeam;
  if (st.spot.visible) {
    const r = beamLook(st.bottom, _c);
    st.spot.material.color.copy(_c);
    st.spot.scale.set(r * 2.6, 1, r * 2.6);
  }
}

/* level numbers: every pane for short stacks, about five evenly spaced for tall ones */
function levelList(N) {          // the bottom (d = N) is the readout's job
  if (N <= 6) return [...Array(N - 1).keys()].map((i) => i + 1);
  const L = new Set();
  const n = N <= 12 ? 3 : 4;
  for (let j = 1; j <= n; j++) L.add(Math.round((N * j) / (n + 1)));
  return [...L].filter((d) => d >= 1 && d < N).sort((a, b) => a - b);
}

function powText(S, d) {       // the gradient after d panes, as a formula
  const k = S.knobs;
  if (k.res) return `${g2(1 + k.fp)}${sup(d)}`;
  if (k.norm) return null;
  return `${g2(k.gain)}${sup(d)}`;
}

function paintLabels(S) {
  const st = S.state, k = S.knobs, N = st.N, t = S.tier;
  const lv = st.levels ? levelList(N) : [];
  const groupsOn = st.groups && k.res && N === 16;
  st.levelTags.forEach((L, j) => {
    const d = lv[j];
    if (d == null || groupsOn || (st.showRoutes && N <= 5)) { L.show(false); return; }
    const y = paneY(N, d - 1) - (paneY(N, 0) - paneY(N, 1)) / 2;
    L.move([PANE_W / 2 + 0.04, y, 0]);
    const p = powText(S, d), v = num(st.beam[d]);
    L.set(t === 1 || !p ? v : `${p} = ${v}`);
    L.show(st.u >= d);
  });
  // ResNet34's four BlockGroups (beat 7)
  const ends = []; { let a = 0; for (const n of RESNET34) { a += n; ends.push(a); } }
  st.groupTags.forEach((L, gi) => {
    if (!groupsOn) { L.show(false); return; }
    const lo = gi === 0 ? 0 : ends[gi - 1], hi = ends[gi] - 1;            // counted from the bottom
    const iTop = N - 1 - hi, iBot = N - 1 - lo;
    L.move([PANE_W / 2 + 0.04, (paneY(N, iTop) + paneY(N, iBot)) / 2, 0]);
    const n = RESNET34[gi], ch = [64, 128, 256, 512][gi];
    L.set(t === 1 ? `${n} blocks` : t === 2 ? `BlockGroup · ${n} blocks` : `BlockGroup(${n}, → ${ch})`);
    L.show(true);
  });
  // readout at the input
  const bot = st.bottom;
  let head;
  if (k.res) head = t === 1 ? `reaches the input: **${num(bot)}**` : `at the input: (1 ${signed(k.fp)})${sup(N)} = **${num(bot)}**`;
  else if (k.norm) head = t === 1 ? `reaches the input: **${num(bot)}**` : `at the input: **${num(bot)}** (≈ ×${num(st.bottom ** (1 / N))} per pane)`;
  else head = t === 1 ? `reaches the input: **${num(bot)}**` : `at the input: ${g2(k.gain)}${sup(N)} = **${num(bot)}**`;
  if (t === 3) head = head.replace('at the input', '∂L/∂x₀');
  st.readout.set(head);
  st.readout.show(st.u >= N + 1 - 1e-9 && !st.showRoutes);
  st.inTag.show(!st.showRoutes);
  st.lossTag.set(t === 3 ? 'loss · ∂L/∂L = 1' : t === 2 ? 'loss (gradient 1)' : 'the loss');
  st.inTag.set(t === 3 ? 'x₀ (input)' : t === 2 ? 'input / first layer' : 'first layer');
  paintRouteNote(S);
}

/* ---------------------------------------------------------------- routes */

function buildRoutes(S) {
  const st = S.state, k = S.knobs, N = st.N;
  if (st.routeMesh) { S.root.remove(st.routeMesh); st.routeMesh.geometry.dispose(); st.routeMesh = null; }
  if (!(st.showRoutes && N <= 5)) return;
  const list = routeList(N, k.fp);
  const geos = [];
  const RS = 0.075, RB = 0.43;                         // skip lane (inside the pipe), branch lane (in the glass)
  const halfGap = N > 1 ? Math.min(0.12, (paneY(N, 0) - paneY(N, 1)) * 0.22) : 0.12;
  for (const R of list) {
    const th = ((R.m + 0.5) / list.length) * Math.PI * 2 + 0.35;
    const straight = R.m === 0;                        // the all-skip route runs down the axis
    const cx = straight ? 0 : Math.cos(th), cz = straight ? 0 : Math.sin(th);
    const pts = [new THREE.Vector3(0, CROSS_Y - 0.02, 0), new THREE.Vector3(RS * cx, CROSS_Y - 0.1, RS * cz)];
    for (let i = 0; i < N; i++) {
      const block = N - 1 - i;                         // bit 0 = the block next to the input
      const rho = (R.m >> block) & 1 ? RB : RS, y = paneY(N, i);
      pts.push(new THREE.Vector3(rho * cx, y + halfGap, rho * cz), new THREE.Vector3(rho * cx, y - halfGap, rho * cz));
    }
    pts.push(new THREE.Vector3(RS * cx, IN_Y + 0.12, RS * cz), new THREE.Vector3(0, IN_Y + 0.01, 0));
    const w = Math.abs(R.worth);
    const r = 0.006 + 0.016 * Math.min(1, w);
    const path = new THREE.CurvePath();
    for (let i = 0; i + 1 < pts.length; i++) path.add(new THREE.LineCurve3(pts[i], pts[i + 1]));
    const geo = new THREE.TubeGeometry(path, pts.length * 3, r, 7, false);
    const col = R.worth < 0 ? COL.teal : COL.red.clone().lerp(COL.ash, R.k === 0 ? 0 : Math.min(0.5, 0.14 * R.k));
    const arr = new Float32Array(geo.attributes.position.count * 3);
    for (let i = 0; i < arr.length; i += 3) { arr[i] = col.r; arr[i + 1] = col.g; arr[i + 2] = col.b; }
    geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    geos.push(geo);
  }
  const merged = THREE.mergeGeometries(geos);
  geos.forEach((g) => g.dispose());
  st.routeMesh = new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, emissive: '#2a0808', emissiveIntensity: 0.4 }));
  st.routeMesh.castShadow = true;
  S.root.add(st.routeMesh);
}

function paintRouteNote(S) {
  const st = S.state, k = S.knobs, N = st.N, t = S.tier;
  const on = st.showRoutes && k.res;
  if (!on) { st.routeNote.show(false); return; }
  const e = st.e, total = e.reduce((a, b) => a + b, 0);
  if (N <= 5) {
    const terms = e.map((ek, kk) => {
      if (kk === 0) return '1';
      const c = binom(N, kk), p = Math.abs(k.fp) ** kk, neg = k.fp < 0 && kk % 2 === 1;
      return `${neg ? '−' : '+'} ${c === 1 ? '' : c + '×'}${numT(p)}`;
    }).join(' ');
    st.routeNote.set(t === 1
      ? `**${2 ** N} routes** down\nthey add up to **${numT(total)}**\n= ${g2(1 + k.fp)} × … (${N} times)`
      : `**${2 ** N} routes** (2${sup(N)})\n${terms}\n= **${numT(total)}** = ${g2(1 + k.fp)}${sup(N)}`);
  } else {
    let kmax = 0;
    e.forEach((v, i) => { if (Math.abs(v) > Math.abs(e[kmax])) kmax = i; });
    st.routeNote.set(t === 1
      ? `**2${sup(N)} routes**, grouped by how\nmany panes they cross (bars)\nmost blame: routes through **${kmax}**\nall together: **${num(total)}**`
      : t === 2
        ? `**2${sup(N)}** = ${num(2 ** N)} routes\nbar k: routes through k branches\npeak at k = **${kmax}** (${num(e[kmax])})\nsum = **${num(total)}** = ${g2(1 + k.fp)}${sup(N)}`
        : `2${sup(N)} routes; bar k = e_k\npeak e_${kmax} = ${num(e[kmax])}\nΣ e_k = **${num(total)}** = ${g2(1 + k.fp)}${sup(N)}`);
  }
  st.routeNote.show(true);
}

/* bars in front of the tower: worth of the routes through k branches, k = 0, 1, 2, ... */
const BARS = { n: 21, x0: -0.8, x1: 0.8, z: 1.04, h: 0.95 };
function paintBars(S) {
  const st = S.state, k = S.knobs;
  const on = st.showRoutes && k.res;
  st.bars.visible = on;
  st.barRail.visible = on;
  st.barTag.show(on);
  if (!on) return;
  const e = st.e, kmax = Math.min(st.N, BARS.n - 1), n = kmax + 1;
  const big = Math.max(...e.slice(0, n).map(Math.abs));
  const dx = (BARS.x1 - BARS.x0) / Math.max(1, BARS.n - 1);
  const w = Math.min(0.1, dx * 0.72);
  for (let i = 0; i < n; i++) {
    const h = Math.max(0.004, (BARS.h * Math.abs(e[i])) / big);
    _p.set(BARS.x0 + dx * i + (BARS.n - n) * dx / 2, 0.03 + h / 2, BARS.z);
    _s.set(w, h, 0.07);
    _m.compose(_p, _q.identity(), _s);
    st.bars.setMatrixAt(i, _m);
    st.bars.setColorAt(i, e[i] < 0 ? COL.teal : COL.red);
  }
  st.bars.count = n;
  st.bars.instanceMatrix.needsUpdate = true;
  if (st.bars.instanceColor) st.bars.instanceColor.needsUpdate = true;
  st.barRail.scale.x = (n - 1) * dx + 0.16;
  st.barTag.move([BARS.x0 + (BARS.n - n) * dx / 2 - 0.02, 0.02, BARS.z + 0.06]);
  st.barTag.set(S.tier === 1 ? 'k = 0: the straight route →' : S.tier === 2 ? 'k = 0 (all skips) →' : 'e₀ = 1 →');
}

/* --------------------------------------------------------------- the pour */

function pour(S, o = {}) {
  const st = S.state;
  if (st.done) { const d = st.done; st.done = null; d(); }
  if (S.shot || o.instant) { st.u = st.N + 1; st.playing = false; refresh(S); return Promise.resolve(); }
  st.u = 0; st.t0 = null; st.playing = true;
  refresh(S);
  return new Promise((res) => { st.done = res; });
}
function refresh(S) { drawBeam(S); paintLabels(S); S.invalidate(); }

function rebuildAll(S) {
  const st = S.state;
  compute(S);
  st.showRoutes = !!S.knobs.routes && !!S.knobs.res;
  layoutPanes(S);
  buildRoutes(S);
  paintBars(S);
  dimKnobs(S);
}

function dimKnobs(S) {
  const k = S.knobs;
  const dim = (id, on) => {
    const el = document.getElementById('k-' + id);
    const row = el && el.closest('.k-knob');
    if (row) row.style.opacity = on ? '0.42' : '';
  };
  dim('gain', k.res); dim('norm', k.res); dim('fp', !k.res); dim('routes', !k.res);
}

/* scene configuration shared by beats and predictions */
function scene(S, o = {}) {
  const st = S.state;
  st.levels = o.levels !== false;
  st.groups = !!o.groups;
  if (o.figure) {
    st.fig.group.visible = true;
    st.fig.place(o.at || [-0.98, 0, 0.62], o.face || [0.4, 0, 6]);
    st.fig.pose('stand', { ms: 0 });
    const doPose = () => st.fig.pose(o.figure, { at: o.point });
    if (S.shot) doPose(); else setTimeout(doPose, 520);
  } else st.fig.group.visible = false;
  layoutPanes(S);
  refresh(S);
}

/* ================================================================== run() */

run({
  id: 'd02-highway', num: '04', week: 2, kind: 'deep',
  title: 'The highway',
  subtitle: 'Why deep nets need a shortcut: a gradient passing down through 50 panes of glass.',
  back2d: '#week-02',
  film: 'deep-w02-conv',
  plinth: { r: 1.4, h: 0.14 },

  knobs: [
    { id: 'depth', type: 'range', label: { 1: 'Layers (panes)', 2: 'Depth N', 3: 'N (layers)' }, min: 2, max: 50, step: 1, value: 10, fmt: (v) => String(Math.round(v)) },
    { id: 'gain', type: 'range', label: { 1: 'Each pane\'s gain', 2: 'Gain g per layer (plain)', 3: 'slope g (plain)' }, min: 0.3, max: 1.5, step: 0.01, value: 0.8, fmt: (v) => v.toFixed(2) },
    { id: 'res', type: 'toggle', label: { 1: 'Shortcut pipe', 2: 'Residual skip', 3: 'x + F(x)' }, value: false },
    { id: 'fp', type: 'range', label: { 1: 'Side branch slope f′', 2: 'Branch slope f′ (residual)', 3: 'f′ = ∂F/∂x per block' }, min: -0.5, max: 0.5, step: 0.01, value: 0, fmt: (v) => g2(v) },
    { id: 'norm', type: 'toggle', label: { 1: 'Rescale each layer (BatchNorm)', 2: 'BatchNorm after each layer', 3: 'BatchNorm2d per layer' }, value: false },
    { id: 'routes', type: 'toggle', label: { 1: 'Show every route', 2: 'Show routes (residual)', 3: 'Expand Π(1 + f′)' }, value: false },
  ],

  setup(S) {
    const st = S.state, root = S.root;
    // brass frame: base plate, four posts, a top ring and a cross that holds the lamp
    const parts = [];

  rebuild(S, id) {
    const st = S.state;
    rebuildAll(S);
    if (id === '*' || id === 'res' || id === 'norm' || id === 'routes') { pour(S); return; }
    // slider scrubs: redraw at once, no pour
    if (st.playing) { st.playing = false; if (st.done) { const d = st.done; st.done = null; d(); } }
    st.u = st.N + 1;
    refresh(S);
  },

  frame(S, t) {
    const st = S.state;
    if (!st.playing) return false;
    if (st.t0 == null) st.t0 = t;
    const dur = 1.25, end = st.N + 1;
    st.u = Math.min(end, Math.max(0, ((t - st.t0 - 0.25) / dur) * end));
    refresh(S);
    if (st.u >= end) {
      st.playing = false;
      if (st.done) { const d = st.done; st.done = null; d(); }
      return false;
    }
    return true;
  },

  onTier(S) { paintLabels(S); paintBars(S); },

  solids(S) {
    const st = S.state, k = S.knobs, N = st.N;
    const out = [];
    const P = (x, y, z) => [x, -z, y];                       // three (x, y, z) -> JSCAD z-up
    out.push(J.primitives.cuboid({ size: [1.42, 1.42, 0.05], center: P(0, 0.025, 0) }));
    for (const [x, z] of [[-POST, -POST], [POST, -POST], [-POST, POST], [POST, POST]]) {
      out.push(J.primitives.cylinder({ radius: 0.03, height: CROSS_Y - 0.03, center: P(x, (CROSS_Y + 0.03) / 2, z), segments: 16 }));
    }
    out.push(J.primitives.cuboid({ size: [2 * POST + 0.06, 0.06, 0.04], center: P(0, CROSS_Y, -POST) }));
    out.push(J.primitives.cuboid({ size: [2 * POST + 0.06, 0.06, 0.04], center: P(0, CROSS_Y, POST) }));
    out.push(J.primitives.cuboid({ size: [0.06, 2 * POST + 0.06, 0.04], center: P(-POST, CROSS_Y, 0) }));
    out.push(J.primitives.cuboid({ size: [0.06, 2 * POST + 0.06, 0.04], center: P(POST, CROSS_Y, 0) }));
    out.push(J.primitives.sphere({ radius: 0.115, center: P(0, LAMP_Y, 0), segments: 24 }));
    out.push(J.primitives.cylinder({ radius: 0.09, height: 0.16, center: P(0, CROSS_Y + 0.05, 0), segments: 20 }));
    out.push(J.primitives.cuboid({ size: [0.86, 0.86, 0.085], center: P(0, 0.0925, 0) }));
    // panes (printable: each pane reaches the four posts), holed when residual
    const t = Math.max(PANE_T, Math.min(0.04, (Y_TOP - Y_BOT) / Math.max(1, N - 1) * 0.45));
    for (let i = 0; i < N; i++) {
      let pane = J.primitives.cuboid({ size: [2 * POST + 0.02, 2 * POST + 0.02, t], center: P(0, paneY(N, i), 0) });
      if (k.res) pane = J.booleans.subtract(pane, J.primitives.cylinder({ radius: HOLE_R, height: t * 3, center: P(0, paneY(N, i), 0), segments: 32 }));
      out.push(pane);
    }
    if (k.res) {
      const h = CROSS_Y - IN_Y;
      out.push(J.booleans.subtract(
        J.primitives.cylinder({ radius: PIPE_R, height: h, center: P(0, (CROSS_Y + IN_Y) / 2, 0), segments: 32 }),
        J.primitives.cylinder({ radius: PIPE_R - 0.025, height: h + 0.02, center: P(0, (CROSS_Y + IN_Y) / 2, 0), segments: 32 })));
    }
    // the beam as a rod whose width follows the gradient (log scale), segment by segment
    for (let d = 0; d <= N; d++) {
      const y0 = d === 0 ? CROSS_Y : paneY(N, d - 1), y1 = d === N ? IN_Y : paneY(N, d);
      const r = Math.max(0.012, beamLook(st.beam[d], _c));
      out.push(J.primitives.cylinder({ radius: r, height: y0 - y1, center: P(0, (y0 + y1) / 2, 0), segments: 12 }));
    }
    return out;
  },
