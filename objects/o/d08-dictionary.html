<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   17 · d08-dictionary: "The dictionary" (W8 deep, ARENA [1.5.4] Toy Models of
   Superposition & SAEs, sections 4-5: sparse autoencoders in toy models).
   ARENA's ToySAE (after Bricken et al. 2023), trained live in the page on the activations
   of the polytope's toy model (Elhage et al. 2022), which is trained first:
   acts_post = ReLU((h - b_dec) @ W_enc + b_enc), h_reconstructed = acts_post @ W_dec_normalized
   + b_dec, loss = mean_d (h_reconstructed - h)^2 + sparsity_coeff * sum |acts_post|.
   Gradients are written by hand (including through the decoder-row normalisation) and checked
   against finite differences in node (see LEDGER.md); the node checks load MATH and RUN below.
   ========================================================================= */

// MATH-BEGIN
/* Seeded randomness: mulberry32 (the same generator as K.rng) + Box-Muller normals. */
function rng(seed = 1) {
  let a = (seed >>> 0) || 1;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randn(rand) {                       // standard normal (Box-Muller)
  let u = 0;
  while (u <= 1e-12) u = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand());
}

/* torch.optim.Adam (betas (0.9, 0.999), eps 1e-8, bias correction), elementwise over
   a list of Float64Array parameters. step(grads) takes one gradient array per parameter. */
class Adam {
  constructor(params, { lr = 1e-3, betas = [0.9, 0.999], eps = 1e-8 } = {}) {
    this.params = params;
    this.lr = lr;
    [this.beta1, this.beta2] = betas;
    this.eps = eps;
    this.t = 0;
    this.m = params.map((p) => new Float64Array(p.length));
    this.v = params.map((p) => new Float64Array(p.length));
  }
  step(grads) {
    this.t += 1;
    const b1 = this.beta1, b2 = this.beta2, c1 = 1 - b1 ** this.t, c2 = 1 - b2 ** this.t;
    this.params.forEach((p, pi) => {
      const g = grads[pi], m = this.m[pi], v = this.v[pi];
      for (let i = 0; i < p.length; i++) {
        m[i] = b1 * m[i] + (1 - b1) * g[i];
        v[i] = b2 * v[i] + (1 - b2) * g[i] * g[i];
        p[i] -= this.lr * (m[i] / c1) / (Math.sqrt(v[i] / c2) + this.eps);
      }
    });
  }
}

/* ARENA's learning-rate schedules (optimize multiplies lr by lr_scale(step, steps)). */
const constant_lr = () => 1.0;
const linear_lr = (step, steps) => 1 - step / steps;
const cosine_decay_lr = (step, steps) => Math.cos(0.5 * Math.PI * step / (steps - 1));

/* ARENA [1.5.4] ToyModel, one instance (n_inst = 1).
   W: (d_hidden, n_features), stored W[k * n + i]; b_final: (n_features,).
   forward: h = W x,  out = ReLU(W.T @ h + b_final).
   calculate_loss: mean over batch and features of importance * (batch - out)**2. */
class ToyModel {
  constructor(cfg, { feature_probability = 0.01, importance = 1.0, seed = 1 } = {}) {
    const n = cfg.n_features, m = cfg.d_hidden;
    this.cfg = { n_features: n, d_hidden: m };
    this.rand = rng(seed);
    const bc = (v) => Float64Array.from({ length: n }, (_, i) => (typeof v === 'number' ? v : v[i]));
    this.feature_probability = bc(feature_probability);
    this.importance = bc(importance);
    // nn.init.xavier_normal_ on a (n_inst=1, d_hidden, n_features) tensor:
    // fan_in = d_hidden * n_features, fan_out = n_inst * n_features, std = sqrt(2 / (fan_in + fan_out))
    const std = Math.sqrt(2 / (m * n + 1 * n));
    this.W = Float64Array.from({ length: m * n }, () => std * randn(this.rand));
    this.b_final = new Float64Array(n);
    this.gW = new Float64Array(m * n);
    this.gb = new Float64Array(n);
    this.h = new Float64Array(m);
    this.step_count = 0;
  }
  forward(x, out = new Float64Array(this.cfg.n_features)) {       // one example
    const { n_features: n, d_hidden: m } = this.cfg, W = this.W, h = this.h;
    for (let k = 0; k < m; k++) { let s = 0; for (let i = 0; i < n; i++) s += W[k * n + i] * x[i]; h[k] = s; }
    for (let i = 0; i < n; i++) {
      let s = this.b_final[i];
      for (let k = 0; k < m; k++) s += W[k * n + i] * h[k];
      out[i] = s > 0 ? s : 0;
    }
    return out;
  }
  generate_batch(batch_size) {
    // Each feature is present with probability feature_probability, magnitude ~ U[0, 1]: the same
    // distribution as ARENA's where(feat_seeds <= p, feat_mag, 0). With one p for all features, the
    // gaps between present entries are drawn directly (geometric), so a sparse batch costs a few
    // dozen random numbers instead of thousands.
    const n = this.cfg.n_features, N = batch_size * n, r = this.rand, P = this.feature_probability;
    const x = new Float64Array(N), p = P[0];
    if (P.some((q) => q !== p)) { for (let j = 0; j < N; j++) if (r() <= P[j % n]) x[j] = r(); return x; }
    if (p >= 1) { for (let j = 0; j < N; j++) x[j] = r(); return x; }
    if (p <= 0) return x;
    const lq = Math.log(1 - p);
    for (let j = Math.floor(Math.log(1 - r()) / lq); j < N; j += 1 + Math.floor(Math.log(1 - r()) / lq)) x[j] = r();
    return x;
  }
  calculate_loss(out, batch) {
    const n = this.cfg.n_features, N = batch.length;
    let s = 0;
    for (let j = 0; j < N; j++) { const e = batch[j] - out[j]; s += this.importance[j % n] * e * e; }
    return s / N;                                                   // einops.reduce(..., 'mean')
  }
  /* loss and hand-derived gradients (what loss.backward() leaves in W.grad, b_final.grad).
     Sparse batches are mostly all-zero rows, which are identical: their share is computed once
     and counted z times (exact; it only saves time on a phone). */
  loss_and_grad(batch) {
    const { n_features: n, d_hidden: m } = this.cfg, W = this.W, gW = this.gW, gb = this.gb;
    const B = batch.length / n, scale = 2 / (B * n);
    const h = new Float64Array(m), dh = new Float64Array(m);
    gW.fill(0); gb.fill(0);
    let L = 0, z = 0;
    for (let b = 0; b < B; b++) {
      const o = b * n;
      let nz = false;
      for (let i = 0; i < n; i++) if (batch[o + i] !== 0) { nz = true; break; }
      if (!nz) { z++; continue; }
      for (let k = 0; k < m; k++) { let s = 0; for (let i = 0; i < n; i++) s += W[k * n + i] * batch[o + i]; h[k] = s; }
      dh.fill(0);
      for (let i = 0; i < n; i++) {
        let pre = this.b_final[i];
        for (let k = 0; k < m; k++) pre += W[k * n + i] * h[k];
        const out = pre > 0 ? pre : 0, err = out - batch[o + i];
        L += this.importance[i] * err * err;
        if (pre > 0) {                                             // ReLU passes the gradient
          const g = scale * this.importance[i] * err;              // dL/dpre_i
          gb[i] += g;
          for (let k = 0; k < m; k++) { gW[k * n + i] += g * h[k]; dh[k] += W[k * n + i] * g; }
        }
      }
      for (let i = 0; i < n; i++) {                                  // h = W x: dL/dW[k, i] += dh_k x_i
        const xi = batch[o + i];
        if (xi !== 0) for (let k = 0; k < m; k++) gW[k * n + i] += dh[k] * xi;
      }
    }
    if (z) for (let i = 0; i < n; i++) {                             // x = 0: h = 0, out = ReLU(b_final)
      const bi = this.b_final[i];
      if (bi > 0) { L += z * this.importance[i] * bi * bi; gb[i] += z * scale * this.importance[i] * bi; }
    }
    return L / (B * n);
  }
  /* ToyModel.optimize, resumable: one call = one Adam step. */
  train_step(o) {
    if (!this.opt) this.opt = new Adam([this.W, this.b_final], { lr: o.lr });
    const lr_scale = o.lr_scale || constant_lr;
    this.opt.lr = o.lr * lr_scale(this.step_count, o.steps);
    const batch = this.generate_batch(o.batch_size);
    const loss = this.loss_and_grad(batch);
    this.opt.step([this.gW, this.gb]);
    this.step_count += 1;
    return loss;
  }
  optimize(o) {
    const log = [];
    for (let s = 0; s < o.steps; s++) {
      const loss = this.train_step(o);
      if (o.log_freq && (s % o.log_freq === 0 || s + 1 === o.steps)) log.push({ step: s, loss });
    }
    return log;
  }
  /* column i of W: feature i's direction in hidden space */
  col(i) { const { n_features: n, d_hidden: m } = this.cfg; return Array.from({ length: m }, (_, k) => this.W[k * n + i]); }
}

/* W^T W (n x n): diagonal = squared length ||W_i||^2, off-diagonal = interference W_i . W_j */
function gram(W, n, m) {
  const G = new Float64Array(n * n);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    let s = 0; for (let k = 0; k < m; k++) s += W[k * n + i] * W[k * n + j];
    G[i * n + j] = s;
  }
  return G;
}
/* ARENA compute_dimensionality: D_i = ||W_i||^2 / sum_j (W_i_hat . W_j)^2 */
function compute_dimensionality(W, n, m) {
  const G = gram(W, n, m), D = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const norm = Math.sqrt(G[i * n + i]), num = norm * norm;
    let den = 0;
    for (let j = 0; j < n; j++) { const d = G[i * n + j] / (norm + 1e-8); den += d * d; }
    D[i] = num / den;
  }
  return D;
}

/* ARENA [1.5.4] ToySAE, one instance, untied weights.
   W_enc: (d_in, d_sae) stored [k * d_sae + l]; _W_dec: (d_sae, d_in) stored [l * d_in + k].
   acts_post = ReLU((h - b_dec) @ W_enc + b_enc);  h_reconstructed = acts_post @ W_dec_normalized + b_dec
   L_reconstruction = mean over d_in of (h_reconstructed - h)**2;  L_sparsity = sum over d_sae of |acts_post|
   loss = L_reconstruction + sparsity_coeff * L_sparsity  (then mean over the batch). */
class ToySAE {
  constructor(cfg, model, { seed = 7, normalize = true } = {}) {
    const d_in = cfg.d_in, d_sae = cfg.d_sae;
    this.cfg = { d_in, d_sae, sparsity_coeff: cfg.sparsity_coeff ?? 0.2, weight_normalize_eps: cfg.weight_normalize_eps ?? 1e-8 };
    this.model = model;
    this.normalize = normalize;                   // ARENA always normalises; false only for the "what if" reveal
    this.rand = rng(seed);
    // nn.init.kaiming_uniform_ on (n_inst, d_in, d_sae) and (n_inst, d_sae, d_in): fan_in = d_in * d_sae,
    // gain sqrt(2), bound = gain * sqrt(3 / fan_in)
    const bound = Math.sqrt(2) * Math.sqrt(3 / (d_in * d_sae));
    this.W_enc = Float64Array.from({ length: d_in * d_sae }, () => (2 * this.rand() - 1) * bound);
    this._W_dec = Float64Array.from({ length: d_sae * d_in }, () => (2 * this.rand() - 1) * bound);
    this.b_enc = new Float64Array(d_sae);
    this.b_dec = new Float64Array(d_in);
    this.g = [new Float64Array(d_in * d_sae), new Float64Array(d_sae * d_in), new Float64Array(d_sae), new Float64Array(d_in)];
    this.step_count = 0;
  }
  get W_dec() { return this._W_dec; }
  get W_dec_normalized() {                      // W_dec / (W_dec.norm(dim=-1, keepdim=True) + eps)
    const { d_in, d_sae, weight_normalize_eps: eps } = this.cfg, W = this._W_dec, out = new Float64Array(W.length);
    for (let l = 0; l < d_sae; l++) {
      let s = 0; for (let k = 0; k < d_in; k++) s += W[l * d_in + k] ** 2;
      const r = Math.sqrt(s) + eps;
      for (let k = 0; k < d_in; k++) out[l * d_in + k] = W[l * d_in + k] / r;
    }
    return out;
  }
  generate_batch(batch_size) {                  // h = W x for a fresh batch of toy-model inputs
    const M = this.model, n = M.cfg.n_features, m = M.cfg.d_hidden, x = M.generate_batch(batch_size);
    const h = new Float64Array(batch_size * m);
    for (let b = 0; b < batch_size; b++) for (let i = 0; i < n; i++) {
      const xi = x[b * n + i];
      if (xi !== 0) for (let k = 0; k < m; k++) h[b * m + k] += M.W[k * n + i] * xi;
    }
    return h;
  }
  forward(h) {
    const { d_in: D, d_sae: F, sparsity_coeff } = this.cfg, B = h.length / D;
    const Wd = this.normalize ? this.W_dec_normalized : this._W_dec;
    const acts_post = new Float64Array(B * F), h_reconstructed = new Float64Array(B * D);
    const L_reconstruction = new Float64Array(B), L_sparsity = new Float64Array(B), loss = new Float64Array(B);
    for (let b = 0; b < B; b++) {
      for (let l = 0; l < F; l++) {
        let s = this.b_enc[l];
        for (let k = 0; k < D; k++) s += (h[b * D + k] - this.b_dec[k]) * this.W_enc[k * F + l];
        acts_post[b * F + l] = s > 0 ? s : 0;
      }
      let rec = 0, sp = 0;
      for (let k = 0; k < D; k++) {
        let s = this.b_dec[k];
        for (let l = 0; l < F; l++) s += acts_post[b * F + l] * Wd[l * D + k];
        h_reconstructed[b * D + k] = s;
        rec += (s - h[b * D + k]) ** 2;
      }
      for (let l = 0; l < F; l++) sp += Math.abs(acts_post[b * F + l]);
      L_reconstruction[b] = rec / D;
      L_sparsity[b] = sp;
      loss[b] = L_reconstruction[b] + sparsity_coeff * L_sparsity[b];
    }
    return { loss_dict: { L_reconstruction, L_sparsity }, loss, acts_post, h_reconstructed };
  }
  /* mean-over-batch loss and hand-derived gradients for [W_enc, _W_dec, b_enc, b_dec].
     All-zero rows of h (no feature active) are identical: computed once, weighted by their count. */
  loss_and_grad(h) {
    const { d_in: D, d_sae: F, sparsity_coeff: lam, weight_normalize_eps: eps } = this.cfg, B = h.length / D;
    const [gE, gD, gbe, gbd] = this.g;
    gE.fill(0); gD.fill(0); gbe.fill(0); gbd.fill(0);
    const W = this._W_dec, Wd = this.normalize ? this.W_dec_normalized : W;
    const gWn = new Float64Array(F * D);                  // dL/dW_dec_normalized
    const fa = this.fa = new Float64Array(F);             // frac_active = (acts.abs() > 1e-8).mean(0)
    const hc = new Float64Array(D), pre = new Float64Array(F), a = new Float64Array(F), dr = new Float64Array(D);
    let Ltot = 0, z = 0;
    const row = (o, w) => {                               // one input row h[o .. o+D), counted w times
      for (let k = 0; k < D; k++) hc[k] = (o < 0 ? 0 : h[o + k]) - this.b_dec[k];
      let sp = 0;
      for (let l = 0; l < F; l++) {
        let s = this.b_enc[l];
        for (let k = 0; k < D; k++) s += hc[k] * this.W_enc[k * F + l];
        pre[l] = s; a[l] = s > 0 ? s : 0; sp += a[l];
        if (a[l] > 1e-8) fa[l] += w / B;
      }
      let rec = 0;
      for (let k = 0; k < D; k++) {
        let s = this.b_dec[k];
        for (let l = 0; l < F; l++) s += a[l] * Wd[l * D + k];
        const e = s - (o < 0 ? 0 : h[o + k]);
        rec += e * e;
        dr[k] = w * (2 / (D * B)) * e;                       // dL/dh_reconstructed
        gbd[k] += dr[k];
      }
      Ltot += w * (rec / D + lam * sp);
      for (let l = 0; l < F; l++) {
        if (a[l] > 0) for (let k = 0; k < D; k++) gWn[l * D + k] += a[l] * dr[k];
        if (pre[l] > 0) {                                        // ReLU (and |.|: sign(+) = 1)
          let g = w * lam / B;
          for (let k = 0; k < D; k++) g += dr[k] * Wd[l * D + k];
          gbe[l] += g;
          for (let k = 0; k < D; k++) { gE[k * F + l] += hc[k] * g; gbd[k] -= this.W_enc[k * F + l] * g; }
        }
      }
    };
    for (let b = 0; b < B; b++) {
      let nz = false;
      for (let k = 0; k < D; k++) if (h[b * D + k] !== 0) { nz = true; break; }
      if (nz) row(b * D, 1); else z++;
    }
    if (z) row(-1, z);
    // back through W_dec_normalized = W / (||W|| + eps), row by row
    for (let l = 0; l < F; l++) {
      if (!this.normalize) { for (let k = 0; k < D; k++) gD[l * D + k] = gWn[l * D + k]; continue; }
      let s = 0, wg = 0;
      for (let k = 0; k < D; k++) { s += W[l * D + k] ** 2; wg += W[l * D + k] * gWn[l * D + k]; }
      const r = Math.sqrt(s), q = r + eps;
      for (let k = 0; k < D; k++) gD[l * D + k] = gWn[l * D + k] / q - (r > 0 ? W[l * D + k] * wg / (r * q * q) : 0);
    }
    return Ltot / B;
  }
  /* ToySAE.optimize, resumable: one call = one step (resample check, Adam step, renormalise W_dec,
     record frac_active). */
  train_step(o) {
    if (!this.opt) { this.opt = new Adam([this.W_enc, this._W_dec, this.b_enc, this.b_dec], { lr: o.lr }); this.frac_active_list = []; this.resampled = new Uint8Array(this.cfg.d_sae); }
    const step = this.step_count;
    if (o.resample_method && (step + 1) % o.resample_freq === 0) {
      const win = this.frac_active_list.slice(-o.resample_window);
      if (o.resample_method === 'simple') this.resample_simple(win, o.resample_scale);
      else this.resample_advanced(win, o.resample_scale, o.batch_size);
    }
    this.opt.lr = o.lr * (o.lr_scale || constant_lr)(step, o.steps);
    const h = this.generate_batch(o.batch_size);
    const loss = this.loss_and_grad(h);
    this.opt.step(this.g);
    if (this.normalize) this._W_dec.set(this.W_dec_normalized);   // self.W_dec.data = self.W_dec_normalized.data
    this.frac_active_list.push(this.fa);             // from this step's forward pass (acts before the update)
    if (this.frac_active_list.length > (o.resample_window || 1) + 2) this.frac_active_list.shift();
    this.step_count += 1;
    return loss;
  }
  dead_mask(win) {                                // (frac_active_in_window < 1e-8).all(dim=0)
    const F = this.cfg.d_sae, dead = new Uint8Array(F).fill(win.length ? 1 : 0);
    for (const fa of win) for (let l = 0; l < F; l++) if (!(fa[l] < 1e-8)) dead[l] = 0;
    return dead;
  }
  resample_simple(win, resample_scale) {
    const { d_in: D, d_sae: F, weight_normalize_eps: eps } = this.cfg, dead = this.dead_mask(win);
    for (let l = 0; l < F; l++) {
      if (!dead[l]) continue;
      const v = Array.from({ length: D }, () => randn(this.rand));
      const r = Math.hypot(...v) + eps;
      for (let k = 0; k < D; k++) {
        this.W_enc[k * F + l] = resample_scale * v[k] / r;
        this._W_dec[l * D + k] = v[k] / r;
      }
      this.b_enc[l] = 0;
      this.resampled[l] = 1;
    }
  }
  resample_advanced(win, resample_scale, batch_size) {
    const { d_in: D, d_sae: F, weight_normalize_eps: eps } = this.cfg, dead = this.dead_mask(win);
    const deadIdx = []; for (let l = 0; l < F; l++) if (dead[l]) deadIdx.push(l);
    if (!deadIdx.length) return;
    const h = this.generate_batch(batch_size);
    const l2 = this.forward(h).loss_dict.L_reconstruction;
    let mx = 0; for (const v of l2) mx = Math.max(mx, v);
    if (mx < 1e-6) return;
    const w = Array.from(l2, (v) => v * v), tot = w.reduce((s, v) => s + v, 0);
    // mean encoder norm of the alive latents (1.0 if none)
    let an = 0, na = 0;
    for (let l = 0; l < F; l++) if (!dead[l]) { let s = 0; for (let k = 0; k < D; k++) s += this.W_enc[k * F + l] ** 2; an += Math.sqrt(s); na++; }
    const W_enc_norm_alive_mean = na ? an / na : 1.0;
    for (const l of deadIdx) {
      let u = this.rand() * tot, x = 0;
      while (x < w.length - 1 && (u -= w[x]) > 0) x++;
      const v = Array.from({ length: D }, (_, k) => h[x * D + k] - this.b_dec[k]);
      const r = Math.hypot(...v) + eps;
      for (let k = 0; k < D; k++) {
        this._W_dec[l * D + k] = v[k] / r;

/* The toy model the SAE reads: the polytope's, trained the same way (Adam, lr 0.01 with cosine

   and ARENA's own 5 in 2 (pentagon). */

/* A snapshot's SAE as plain arrays: encoder, unit decoder rows (or raw rows when not normalising) */

function encode(A, h) {

  const cosTo = (i, l) => { const d = A.dec[l], r = Math.hypot(...d) || 1; return T.dirs[i].reduce((s, x, k) => s + x * d[k], 0) / r; };

    frac: Array.from(fires, (v) => v / N), alive, dead: alive.filter((a) => !a).length, found, best, owner, dup };
}

const SPH = { c: new THREE.Vector3(0, 1.72, -0.3), r: 1.32 };   // glass sphere = the toy's hidden space

const RACK = { c: new THREE.Vector3(0, 0, 1.25), W: 1.8, H: 0.42 };   // the code rack: one bar per latent
const PLAY_S = 2.4;                                           // replay length (s)
const MAXF = 16;
const GREY = '#b8b0a3';
const sub = (k) => String(k).split('').map((d) => '₀₁₂₃₄₅₆₇₈₉'[+d]).join('');
const fx = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d).replace('-', '−');

  front: { pos: [2.8, 5.0, 9.2], target: [0, 1.3, 0.3] },

  high: { pos: [1.8, 7.6, 7.4], target: [0, 1.0, 0.4] },

function cfgOf(S) {
  const k = S.knobs;
  return { toy: k.toy, d_sae: Math.round(k.d_sae), coeff: +k.sparsity_coeff, resample: k.resample_method, norm: !!k.unit_norm, seed: Math.round(k.seed) };

/* hidden space -> world: a fixed rotation per toy (the model only depends on W^T W, so any
   rotation of hidden space is the same model): feature 1 points up, the next one leans toward
   the viewer; a 2-dim toy faces the viewer. */
function orient(T) {
  const { n, m, model } = T, col = (i) => model.col(i), nrm = (v) => Math.hypot(...v);
  if (m === 2) {
    const a = col(0), th = Math.PI / 2 - Math.atan2(a[1], a[0]), cs = Math.cos(th), sn = Math.sin(th);
    return [[cs, -sn], [sn, cs], [0, 0]];
  }

  for (let i = 1; i < n; i++) {
    const v = col(i), d = v.reduce((s, x, k) => s + x * a[k], 0), w = v.map((x, k) => x - d * a[k]), l = nrm(w);

/* points worth showing as "the" example: feature 1 alone near 0.8, or two features together.

  const F = T.frame || (T.frame = orient(T));

    if (a === undefined) continue;

/* a new toy: rebuild the star and the guides */
function setToy(S, T) {
  const st = S.state, F = T.frame || (T.frame = orient(T));
  const o = new THREE.Object3D(), c = new THREE.Color(), v = new THREE.Vector3();
  const N = Math.min(800, T.rows.length);
  for (let j = 0; j < N; j++) {
    const r = T.rows[j];
    o.position.copy(toWorld(F, r.h, v));
    o.scale.setScalar(r.on.length > 1 ? 0.017 : 0.02);
    o.updateMatrix();
    st.star.setMatrixAt(j, o.matrix);
    st.star.setColorAt(j, c.set(r.on.length > 1 ? '#8fb0e6' : C.data));
  }
  st.star.count = N;
  st.star.instanceMatrix.needsUpdate = true; st.star.instanceColor.needsUpdate = true;
  st.guides.forEach((g, i) => {
    g.mesh.visible = i < T.n;
    if (i < T.n) g.set([SPH.c, toWorld(F, T.model.col(i).map((x) => x * 1.12))]);
  });
  st.pickIdx = pickDefault(T, st.pickKind || 'one');
  st.pickProvisional = st.pickKind === 'two';
}

/* tap inside the sphere: the nearest point on screen becomes the picked point */
function tapPoint(S, p) {
  const st = S.state, R = st.run;
  if (!R || !['code', 'fee', 'where'].includes(st.mode)) return;
  const cam = S.camera, a = p.clone().project(cam), v = new THREE.Vector3();
  let best = -1, bd = Infinity;
  R.T.rows.forEach((r, j) => {
    if (j >= 800) return;
    toWorld(R.T.frame, r.h, v).project(cam);
    const d = (v.x - a.x) ** 2 + (v.y - a.y) ** 2;
    if (d < bd) { bd = d; best = j; }
  });
  if (best >= 0) { st.pickIdx = best; st.pickProvisional = false; draw(S); }
}
function anotherPoint(S) {
  const st = S.state, R = st.run;
  if (!R) return;
  const rows = R.T.rows, n = rows.length;
  for (let k = 1; k < n; k++) {                    // walk with a fixed stride to the next sizeable point
    const j = (st.pickIdx + 37 * k) % Math.min(n, 800);
    if (Math.hypot(...rows[j].h) > 0.45) { st.pickIdx = j; st.pickProvisional = false; break; }
  }
  if (!['code', 'fee', 'where'].includes(st.mode)) stage(S, { mode: 'code', keepPick: true });
  draw(S);
}

const _o = new THREE.Object3D(), _c = new THREE.Color(), _v = new THREE.Vector3(), _w = new THREE.Vector3();
function draw(S) {
  const st = S.state, R = st.run;
  if (!R) return;
  const T = R.T, F = T.frame, { n, m } = T, Fn = R.c.d_sae, t = S.tier, mode = st.mode;
  st.disc.visible = st.rim.visible = m === 2;
  st.glass.visible = st.eq.visible = m !== 2;
  const ready = !st.computing;
  const u = ready ? st.u : 0;
  const [A0, A1, f] = snapAt(R, u);
  const A = saeAt(R, A0), B = saeAt(R, A1);
  const E = ready ? evaluate(R, A) : null;
  st.E = E; st.A = A;
  const showSAE = mode !== 'star' && ready;
  // guides: strong in the star beat, faint otherwise
  st.guides.forEach((g, i) => { g.mesh.material.opacity = mode === 'star' ? 0.55 : 0.22; });
  // arrows: decoder rows (unit length when normalised), interpolated between snapshots
  const flash = new Set();
  if (st.playing) for (const e of R.events) if (e.step <= u && e.step > u - 160) e.latents.forEach((l) => flash.add(l));
  const everResampled = new Set();
  for (const e of R.events) if (e.step <= u) e.latents.forEach((l) => everResampled.add(l));
  for (let l = 0; l < MAXF; l++) {
    const a = st.arrows[l], tip = st.tips[l], tag = st.tags[l];
    const on = showSAE && l < Fn;
    if (!on) { a.show(false); tip.visible = false; tag.show(false); continue; }
    const d0 = A.dec[l].map((x, k) => x + (B.dec[l][k] - x) * f), len0 = Math.hypot(...d0);
    const d = len0 > 1.25 ? d0.map((x) => x * 1.25 / len0) : d0;          // unnormalised rows can grow 10x: drawn clamped
    const len = Math.hypot(...d);
    const tipW = toWorld(F, d, _v).clone();
    const dead = !E.alive[l];
    const colr = flash.has(l) ? C.prob : dead ? GREY : C.dir;
    a.group.children.forEach((ch) => ch.material.color.set(colr));
    tip.material.color.set(colr);
    a.show(len * SW > 0.05); if (len * SW > 0.05) a.set(SPH.c, tipW);
    tip.position.copy(tipW); tip.visible = true;
    tip.scale.setScalar(dead ? 0.03 : 0.042);
    tag.show(true);
    const rs = mode === 'exercise' && everResampled.has(l) ? ' ↻' : '';
    const long = !R.c.norm && len0 > 1.3 ? ` ×${fx(len0, 1)}` : '';
    tag.set(dead ? `${l + 1} dead` : `${l + 1}${rs}${long}`);
  }
  // trails (training beat): tip positions over the snapshots up to u
  let k = 0;
  if (mode === 'train' && showSAE) {
    for (const sn of R.snaps) {
      if (sn.step > u) break;
      const Z = saeAt(R, sn);
      for (let l = 0; l < Fn && k < st.trail.instanceMatrix.count; l++) {
        const d = Z.dec[l], len = Math.hypot(...d) || 1;
        _o.position.copy(toWorld(F, d.map((x) => x / len), _w));
        _o.scale.setScalar(0.009); _o.updateMatrix();
        st.trail.setMatrixAt(k, _o.matrix);
        st.trail.setColorAt(k, _c.set('#b3a3e6'));
        k++;
      }
    }
  }
  st.trail.count = k;
  st.trail.instanceMatrix.needsUpdate = true; if (st.trail.instanceColor) st.trail.instanceColor.needsUpdate = true;
  // the picked point, its code, its rebuild
  const showPick = showSAE && ['code', 'fee', 'where'].includes(mode) && T.rows.length > 0;
  st.hBead.visible = st.rBead.visible = st.bBead.visible = st.path.mesh.visible = st.err.mesh.visible = showPick;
  st.hTag.show(showPick); st.rTag.show(showPick);
  let codeLines = '';
  let code = null;
  if (showPick) {
    const row = T.rows[Math.min(st.pickIdx, T.rows.length - 1)];
    code = encode(A, row.h);
    const hw = toWorld(F, row.h), rw = toWorld(F, code.hr), bw = toWorld(F, A.b_dec);
    st.hBead.position.copy(hw); st.rBead.position.copy(rw); st.bBead.position.copy(bw);
    const act = code.f.map((v, l) => [l, v]).filter(([, v]) => v > 1e-8).sort((p, q) => q[1] - p[1]);
    const pts = [bw];
    let acc = A.b_dec.slice();
    for (const [l, v] of act) { acc = acc.map((x, kk) => x + v * A.dec[l][kk]); pts.push(toWorld(F, acc)); }
    if (pts.length < 2) pts.push(bw.clone().add(new THREE.Vector3(0, 1e-4, 0)));
    st.path.set(pts);
    st.path.mesh.visible = act.length > 0;
    st.err.set([rw, hw]);
    const hl = Math.hypot(...row.h), rl = Math.hypot(...code.hr);
    const e2 = code.hr.reduce((s, x, kk) => s + (x - row.h[kk]) ** 2, 0);
    const top = act.slice(0, t === 1 ? 2 : 3);
    const more = act.length > top.length ? ` + ${act.length - top.length} more` : '';
    const feats = row.on.map(([i]) => i + 1).join(' + ');
    if (t === 1) {
      codeLines = (act.length ? `this point = ${top.map(([l, v]) => `${fx(v)} × word ${l + 1}`).join(' + ')}${more}` : 'no word fires for this point (too small)')
        + `\nmade of ${row.on.length} feature${row.on.length > 1 ? 's' : ''} · rebuilt at ${Math.round(100 * rl / Math.max(1e-9, hl))}% of its length`;
    } else if (t === 2) {
      codeLines = `code: ${act.length ? top.map(([l, v]) => `f${sub(l + 1)} = ${fx(v)}`).join(', ') + more : 'all 0'} (L0 ${act.length})`
        + `\n‖ĥ‖/‖h‖ = ${fx(rl / Math.max(1e-9, hl))} · ‖ĥ − h‖ = ${fx(Math.sqrt(e2))} · feature ${feats}`;
    } else {
      codeLines = `acts_post: ${act.length ? top.map(([l, v]) => `[${l}] ${fx(v, 3)}`).join(', ') + more : 'all 0'}`
        + `\nx: ${row.on.map(([i, x]) => `[${i}] ${fx(x)}`).join(', ')} · L_reconstruction ${fe(e2 / m)}`;
    }
  }
  // the rack: the code of the picked point (or firing rates when nothing is picked)
  const rackOn = showSAE && mode !== 'train';
  const rates = ['exercise', 'split'].includes(mode);          // bars = frac_active instead of the code
  st.rackParts.forEach((p) => { p.visible = rackOn; });
  st.rackTag.show(rackOn);
  st.rackTag.set(rates ? { 1: 'how often each word fires', 2: 'frac_active per latent', 3: 'frac_active = (acts > 1e-8).mean(0)' } : { 1: 'the code: how much of each word', 2: 'code f: one bar per latent', 3: 'acts_post (d_sae bars)' });
  const cell = RACK.W / Fn, w = Math.min(0.09, cell * 0.62);
  for (let l = 0; l < MAXF; l++) {
    const on = rackOn && l < Fn;
    const val = !on ? 0 : rates ? Math.min(1.25, E.frac[l] / 0.03) : (code ? code.f[l] : 0);   // rates: 3% = full height
    const dead = E && !E.alive[l];
    const hgt = Math.max(0.006, Math.min(1.25, val) * RACK.H);
    _o.position.set(RACK.c.x - RACK.W / 2 + (l + 0.5) * cell, 0.05 + hgt / 2, RACK.c.z);
    _o.scale.set(on ? w : 0, on ? hgt : 0, on ? w : 0);
    _o.updateMatrix();
    st.bars.setMatrixAt(l, _o.matrix);
    st.bars.setColorAt(l, _c.set(val > 1e-8 ? C.dir : dead ? GREY : '#e2dacd'));
    const bt = st.barTags[l];
    const txt = !on ? '' : rates ? (dead ? `${l + 1}: 0` : `${l + 1}: ${fx(100 * E.frac[l], 1)}%`) : t === 1 ? `${l + 1}` : `${l + 1}: ${fx(val)}`;
    if (on && (rates ? Fn <= 8 : val > 1e-8)) { bt.move([_o.position.x, 0.05 + hgt + 0.02, RACK.c.z]).set(txt); bt.show(true); } else bt.show(false);
  }
  st.bars.count = MAXF;
  st.bars.instanceMatrix.needsUpdate = true; st.bars.instanceColor.needsUpdate = true;
  // readout
  const pct = R.done ? 100 : Math.round(100 * R.sae.step_count / SAE_BUDGET.steps);
  let head;
  if (!ready) head = t === 1 ? `training the SAE… ${pct}%` : `training ${R.sae.step_count.toLocaleString('en')} / ${SAE_BUDGET.steps.toLocaleString('en')} steps…`;
  else if (mode === 'star') {
    const one = T.rows.filter((r) => r.on.length === 1).length;
    head = t === 1 ? `${n} features squeezed into ${m} neurons: ${n} spikes`
      : t === 2 ? `h = Wx, 3,000 inputs: ${T.rows.length} non-zero, ${one} on one spike`
        : `h = W x, p = ${TOY_P}: ${T.rows.length}/3000 non-zero, ${one} on one ray`;
  } else {
    const step = Math.round(u).toLocaleString('en'), dup = E.dup ? ` · ${E.dup} duplicate${E.dup > 1 ? 's' : ''}` : '';
    const maxLen = Math.max(...A.decRaw.map((d) => Math.hypot(...d)));
    head = t === 1 ? `${E.found} of ${n} features found · ${E.dead} dead word${E.dead === 1 ? '' : 's'}\n${fx(E.L0, 1)} words per point on average`
      : t === 2 ? `step ${step} · L_reconstruction ${fe(E.L_reconstruction)} · L0 ${fx(E.L0)}\nfound ${E.found}/${n} · dead ${E.dead}/${Fn}${dup}`
        : `step ${Math.round(u)} · loss ${fe(E.loss)} = ${fe(E.L_reconstruction)} + ${R.c.coeff}·${fx(E.L_sparsity, 3)}\nL0 ${fx(E.L0)} · dead ${E.dead}/${Fn} · found ${E.found}/${n}${E.dup ? ` · dup ${E.dup}` : ''}`;
    if (!R.c.norm) head += t === 1 ? `\nlongest word ${fx(maxLen, 1)}× its proper length` : ` · max ‖W_dec‖ ${fx(maxLen, 1)}`;
  }
  st.readout.set(head + (codeLines ? '\n' + codeLines : ''));
  st.sphTag.set(m === 2 ? { 1: '2 neurons', 2: 'hidden plane (2 dims)', 3: 'h ∈ ℝ², d_in = 2' } : { 1: '3 neurons', 2: 'hidden space (3 dims)', 3: 'h ∈ ℝ³, d_in = 3' });
  S.invalidate();
}

/* per-beat staging */
function stage(S, o = {}) {
  const st = S.state;
  st.mode = o.mode || 'code';
  st.wide = o.wide !== false;
  st.sphTag.show(st.wide);
  st.readout.move(o.readoutAt || [SPH.c.x, SPH.c.y + SPH.r + 0.1, SPH.c.z]);
  if (!o.keepPick) { st.pickKind = o.pick || 'one'; repick(S); }
  if (o.figure) {
    st.fig.group.visible = true;
    st.fig.place(o.at || [1.6, 0, 0.75], o.face || [0, 1.2, -0.4]);
    st.fig.pose('stand', { ms: 0 });
    const doPose = () => st.fig.pose(o.figure, { at: o.look ? SPH.c.clone().add(new THREE.Vector3(...o.look)) : undefined });
    if (S.shot) doPose(); else setTimeout(doPose, 480);
  } else st.fig.group.visible = false;
  draw(S);
}

const BASE = { toy: 'anti', d_sae: 8, sparsity_coeff: 0.2, resample_method: 'advanced', unit_norm: true, seed: 1 };
const setBase = (S, extra = {}) => S.setKnobs({ ...BASE, ...extra });

run({
  id: 'd08-dictionary', num: '17', week: 8, kind: 'deep',

  frame(S, t, dt) {
    const st = S.state, R = st.run;
    if (!R) return false;
    if (st.computing) { pump(S); return false; }     // training runs in pump(); the replay follows
    if (st.playing) {
      st.tau += dt;
      const f = Math.min(1, st.tau / PLAY_S);
      st.u = SAE_BUDGET.steps * f ** 1.6;                 // early steps (the big swings) play slower
      if (f >= 1) finishPlay(S);
      draw(S);
      return st.playing;
    }

  },

  onTier(S) { draw(S); },

  solids(S) {
    // "print your dictionary": the live decoder rows as rods with beads, a hub and a round foot
    const st = S.state, R = st.run, T = R.T, F = T.frame, A = saeAt(R, R.snaps[R.snaps.length - 1]), E = evaluate(R, A);
