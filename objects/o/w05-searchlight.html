<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Searchlight · Object Lessons</title>
<meta name="description" content="One attention head you can hold: a query arrow searches six key arrows, dot products fall as shadows, softmax pours amber sand into cups that sum to 1, values mix tip to tail, and a causal mask frosts the future.">
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   09 · w05-searchlight: "The searchlight" (W5, ARENA [1.1] Attention)
   One toy attention head with d_head = 3, so queries, keys and values are
   arrows you can see. The vectors are hand-picked toys; every score, weight
   and sum on screen is computed live by the MATH block below, which follows
   ARENA's Attention.forward and is checked in node (see LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
const D_HEAD = 3;                        // toy head size (GPT-2 small: d_head = 64)
const TOKENS = ['the', 'cat', 'sat', 'and', 'it', 'purred'];
/* toy vectors, hand-picked: KEYS = what each word contains, VALUES = what it passes on,
   QUERY_DIRS = each word's own query (what it looks for) as turn / tilt / length */
const KEYS = [[-1.4, 0.5, -1.0], [1.9, 0.3, -0.4], [-0.5, 1.8, 0.2], [-1.5, -0.6, -0.6], [1.2, -0.5, 0.9], [0.5, 1.7, -0.3]];
const VALUES = [[-0.6, -0.8, 0.2], [1.7, 0.8, 0.1], [-0.4, 1.4, 0.3], [-1.0, 0.2, -0.3], [0.6, -0.9, 0.4], [0.3, 1.2, -0.6]];
const QUERY_DIRS = [{ turn: -124, tilt: 16, len: 1.5 }, { turn: -123, tilt: 10, len: 1.7 }, { turn: 90, tilt: 3, len: 1.8 },
  { turn: -56, tilt: 79, len: 1.8 }, { turn: 81, tilt: -6, len: 1.9 }, { turn: 62, tilt: -13, len: 1.7 }];
const RAD = Math.PI / 180;
function queryVec(turn, tilt, len) {       // turn: about the vertical, from +z (front) toward +x (right); tilt: up
  return [len * Math.cos(tilt * RAD) * Math.sin(turn * RAD), len * Math.sin(tilt * RAD), len * Math.cos(tilt * RAD) * Math.cos(turn * RAD)];
}
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const IGNORE = -Infinity;                  // ARENA: self.register_buffer("IGNORE", t.tensor(float("-inf")))
/* "all keys equal": every key replaced by one shared arrow (the mean key's direction, length 1.8) */
const MEAN_KEY = [0, 1, 2].map((c) => KEYS.reduce((a, k) => a + k[c], 0) / KEYS.length);
const SAME_KEY = MEAN_KEY.map((c) => (c / Math.hypot(...MEAN_KEY)) * 1.8);

/* One row of ARENA's Attention.forward (the query at position pos):
   attn_scores = q·k_j;  apply_causal_mask(attn_scores / d_head**0.5);  softmax(-1);  z = Σ_j pattern_j v_j */
function attendRow(q, keys, values, pos, { scale = true, mask = true } = {}) {
  const raw = keys.map((k) => dot(q, k));
  const scores = raw.map((s) => (scale ? s / Math.sqrt(D_HEAD) : s));
  const masked = scores.map((s, j) => (mask && j > pos ? IGNORE : s));
  const m = Math.max(...masked);
  const ex = masked.map((s) => Math.exp(s - m));          // exp(−inf) = 0 exactly
  const Z = ex.reduce((a, b) => a + b, 0);
  const w = ex.map((e) => e / Z);
  const z = [0, 0, 0];
  values.forEach((v, j) => { for (let c = 0; c < 3; c++) z[c] += w[j] * v[c]; });
  return { raw, scores, masked, w, z };
}
/* every word asks at once: attn_pattern[posn_Q][posn_K] */
function fullPattern(queries, keys, values, opts) { return queries.map((q, i) => attendRow(q, keys, values, i, opts).w); }

/* Why ÷√d_head: a toy experiment with seeded random unit-variance vectors. */
function rng(seed) {                        // mulberry32 (same generator as K.rng)
  let a = (seed >>> 0) || 1;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
function dotSpread(d, n, seed) {           // standard deviation of q·k over n random pairs
  const r = rng(seed);
  let s = 0, s2 = 0;
  for (let i = 0; i < n; i++) {
    let x = 0;
    for (let c = 0; c < d; c++) x += gauss(r) * gauss(r);
    s += x; s2 += x * x;
  }
  const m = s / n;
  return Math.sqrt(s2 / n - m * m);
}
function randomHeadTop(d, nKeys, seed) {   // one random query vs nKeys random keys: top softmax weight
  const r = rng(seed);
  const q = Array.from({ length: d }, () => gauss(r));
  const raw = Array.from({ length: nKeys }, () => { let x = 0; for (let c = 0; c < d; c++) x += gauss(r) * q[c]; return x; });
  const soft = (a) => { const m = Math.max(...a); const e = a.map((x) => Math.exp(x - m)); const Z = e.reduce((p, c) => p + c, 0); return e.map((x) => x / Z); };
  return { raw: Math.max(...soft(raw)), scaled: Math.max(...soft(raw.map((x) => x / Math.sqrt(d)))) };
}
const MATH = { D_HEAD, TOKENS, KEYS, VALUES, QUERY_DIRS, SAME_KEY, queryVec, dot, attendRow, fullPattern, dotSpread, randomHeadTop };
// MATH-END

/* ============================================================ display setup */

const NT = TOKENS.length;
const PX = (j) => -1.4 + 0.56 * j, PZ = 1.05, PH = 0.36, PW = 0.3;      // pillars
const CUP_R = 0.15, CUP_H = 0.42, SAND_R = 0.132, SAND_H = 0.4;
const O = new THREE.Vector3(0, 2.0, -0.35), HALF = 0.9, VS = 0.4;       // the cage = the head's 3-D space
const BOARD = { z: -0.55, y0: 1.08, rowH: 0.3, cellW: 0.47, depth: 0.42 };
const TOP = PH + CUP_H;
const COL = { key: new THREE.Color(C.data), q: new THREE.Color(C.dir), val: new THREE.Color(C.aux), sand: new THREE.Color(C.prob),
  grey: new THREE.Color('#b9b3a9'), pale: new THREE.Color('#efe3cc'), ink: new THREE.Color(C.ink) };
const CAM = {
  main: { pos: [2.2, 3.4, 7.8], target: [0, 1.35, 0.2] },
  vals: { pos: [0.45, 2.8, 5.6], target: [0.18, 2.0, -0.3], fit: 2.4 },
  shadow: { pos: [0.5, 2.5, 5.6], target: [0, 1.95, -0.35], fit: 1.3 },
  cups: { pos: [0.9, 2.4, 6.9], target: [0, 1.1, 1.0], fit: 0.95 },
  board: { pos: [0.8, 2.6, 7.4], target: [0, 1.5, 0] },
  side: { pos: [-3.2, 3.6, 6.6], target: [0, 1.4, 0.1] },
};
const NOTE_BELOW = [0.26, 1.5, -0.3];                                   // the values notes, under the chain
const fx = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d).replace('-', '−');
const vec = (v, d = 2) => `(${v.map((x) => fx(x, d)).join(', ')})`;
const q3 = (s) => `“${s}”`;

/* instanced arrows: one shaft mesh + one head mesh for any number of arrows (2 draw calls) */
const UP = new THREE.Vector3(0, 1, 0);
function arrowSet(n, mat) {
  const shaft = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 12, 1).translate(0, 0.5, 0), mat, n);
  const head = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 16, 1).translate(0, 0.5, 0), mat, n);
  for (const m of [shaft, head]) {
    m.castShadow = true; m.userData.noFit = true; m.frustumCulled = false;
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    for (let i = 0; i < n; i++) { m.setMatrixAt(i, new THREE.Matrix4().makeScale(0, 0, 0)); m.setColorAt(i, COL.ink); }
  }
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), P = new THREE.Vector3(), Sc = new THREE.Vector3(), d = new THREE.Vector3();
  const zero = new THREE.Matrix4().makeScale(0, 0, 0);
  return {
    shaft, head,
    set(i, A, B, r, color, maxHead = 0.45) {   // maxHead: the head's largest share of the length
      d.copy(B).sub(A);
      const len = d.length();
      if (len < 1e-5) { this.hide(i); return; }
      d.divideScalar(len);
      Q.setFromUnitVectors(UP, d);
      const hl = Math.min(r * 6.5, len * maxHead);
      shaft.setMatrixAt(i, M.compose(P.copy(A), Q, Sc.set(r, Math.max(1e-4, len - hl), r)));
      head.setMatrixAt(i, M.compose(P.copy(A).addScaledVector(d, len - hl), Q, Sc.set(r * 2.6, hl, r * 2.6)));
      shaft.setColorAt(i, color); head.setColorAt(i, color);
    },
    hide(i) { shaft.setMatrixAt(i, zero); head.setMatrixAt(i, zero); },
    done() {
      for (const m of [shaft, head]) { m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true; }
    },
  };
}
/* instanced rods (thin strings between two points) */
function rodSet(n, mat) {
  const mesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 8, 1).translate(0, 0.5, 0), mat, n);
  mesh.userData.noFit = true; mesh.frustumCulled = false;
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), Sc = new THREE.Vector3(), d = new THREE.Vector3(), zero = new THREE.Matrix4().makeScale(0, 0, 0);
  for (let i = 0; i < n; i++) mesh.setMatrixAt(i, zero);
  return {
    mesh,
    set(i, A, B, r) {
      d.copy(B).sub(A);
      const len = d.length();
      if (len < 1e-5) { mesh.setMatrixAt(i, zero); return; }
      Q.setFromUnitVectors(UP, d.divideScalar(len));
      mesh.setMatrixAt(i, M.compose(A, Q, Sc.set(r, len, r)));
    },
    hide(i) { mesh.setMatrixAt(i, zero); },
    done() { mesh.instanceMatrix.needsUpdate = true; },
  };
}
const toW = (v, out = new THREE.Vector3()) => out.set(O.x + v[0] * VS, O.y + v[1] * VS, O.z + v[2] * VS);

/* ======================================================== object behaviour */

function keysNow(S) { return S.knobs.same ? KEYS.map(() => SAME_KEY) : KEYS; }
function queryNow(S) { const k = S.knobs; return queryVec(k.turn, k.tilt, k.qlen); }
function queriesAll(S) {       // every word's own query (the asker's follows the knobs)
  return QUERY_DIRS.map((d, i) => (i === S.knobs.asker ? queryNow(S) : queryVec(d.turn, d.tilt, d.len)));
}

function compute(S) {
  const st = S.state, k = S.knobs, opts = { scale: k.scale, mask: k.mask };
  st.q = queryNow(S);
  st.keys = keysNow(S);
  st.row = attendRow(st.q, st.keys, VALUES, k.asker, opts);
  st.pattern = fullPattern(queriesAll(S), st.keys, VALUES, opts);
}

function paintSand(S) {
  const st = S.state, w = st.row.w, k = S.knobs;
  const m = new THREE.Matrix4();
  for (let j = 0; j < NT; j++) {
    const h = Math.max(0.002, SAND_H * w[j] * st.fill);
    st.sand.setMatrixAt(j, m.compose(new THREE.Vector3(PX(j), PH + 0.012 + h / 2, PZ), new THREE.Quaternion(), new THREE.Vector3(SAND_R, h, SAND_R)));
  }
  st.sand.instanceMatrix.needsUpdate = true;
  // asker ring + frosted glass over the future
  st.ring.position.set(PX(k.asker), 0.012, PZ);
  const masked = k.mask && k.asker < NT - 1;
  st.frost.visible = masked;
  if (masked) {
    const x0 = PX(k.asker + 1) - 0.27, x1 = PX(NT - 1) + 0.27;
    st.frost.scale.set(x1 - x0, 1, 1);
    st.frost.position.set((x0 + x1) / 2, 0.51, PZ + 0.27);
  }
  st.words.forEach((L, j) => { L.el.style.opacity = masked && j > k.asker ? '0.4' : ''; });
}

function paintCage(S) {
  const st = S.state, k = S.knobs, view = k.view;
  const scoresView = view === 'scores', valuesView = view === 'values', cageOn = view !== 'pattern';
  st.cage.visible = cageOn;
  const A = new THREE.Vector3(), B = new THREE.Vector3();
  const qhat = st.q.map((c) => c / Math.hypot(...st.q));
  // keys (blue; greyed when masked), the query (violet)
  for (let j = 0; j < NT; j++) {
    const hidden = k.mask && j > k.asker;
    if (scoresView) st.arrows.set(j, O, toW(st.keys[j], B), 0.019, hidden ? COL.grey : COL.key);
    else st.arrows.hide(j);
  }
  if (cageOn && view !== 'values') st.arrows.set(NT, O, toW(st.q, B), 0.027, COL.q);
  else st.arrows.hide(NT);
  // values view: weighted values laid tip to tail, and the output z
  const w = st.row.w;
  let acc = [0, 0, 0];
  for (let j = 0; j < NT; j++) {
    const idx = NT + 1 + j;
    if (!valuesView || w[j] < 1e-9) { st.arrows.hide(idx); st.ghosts.hide(j); continue; }
    const next = acc.map((c, i) => c + w[j] * VALUES[j][i]);
    st.arrows.set(idx, toW(acc, A), toW(next, B), 0.013 + 0.01 * Math.sqrt(w[j]), COL.val, 0.32);
    st.ghosts.set(j, O, toW(VALUES[j], B), 0.008, COL.val);
    acc = next;
  }
  if (valuesView) st.arrows.set(2 * NT + 1, O, toW(st.row.z, B), 0.017, COL.ink);
  else st.arrows.hide(2 * NT + 1);
  st.arrows.done(); st.ghosts.done();
  st.ghosts.shaft.visible = st.ghosts.head.visible = valuesView;
  // shadows: a string from each key tip to its foot on the query's line, a bead at the foot
  for (let j = 0; j < NT; j++) {
    const hidden = k.mask && j > k.asker;
    if (!scoresView || hidden || !st.shadows) { st.strings.hide(j); st.feet.setMatrixAt(j, new THREE.Matrix4().makeScale(0, 0, 0)); continue; }
    const s = dot(st.keys[j], qhat);
    toW(st.keys[j], A); toW(qhat.map((c) => c * s), B);
    st.strings.set(j, A, B, 0.006);
    st.feet.setMatrixAt(j, new THREE.Matrix4().compose(B, new THREE.Quaternion(), new THREE.Vector3(0.036, 0.036, 0.036)));
  }
  st.strings.done(); st.feet.instanceMatrix.needsUpdate = true;
  // the query's line through the origin, and the string from the asker's pillar
  st.qline.mesh.visible = scoresView;
  if (scoresView) st.qline.set([toW(qhat.map((c) => -c * 2.3)), toW(qhat.map((c) => c * 2.3))]);
  st.cord.mesh.visible = cageOn && !valuesView;
  if (st.cord.mesh.visible) st.cord.set([new THREE.Vector3(PX(k.asker), TOP + 0.02, PZ - 0.16), O.clone()]);
}

function paintBoard(S) {
  const st = S.state, k = S.knobs, on = k.view === 'pattern';
  st.board.visible = on;
  if (!on) return;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  let n = 0, f = 0;
  for (let i = 0; i < NT; i++) {
    for (let j = 0; j < NT; j++) {
      const y = BOARD.y0 + (NT - 1 - i + 0.5) * BOARD.rowH, x = PX(j);
      const wij = st.pattern[i][j];
      if (k.mask && j > i) {
        st.frostCells.setMatrixAt(f++, m.compose(new THREE.Vector3(x, y, BOARD.z + 0.02), q, new THREE.Vector3(BOARD.cellW, BOARD.rowH - 0.05, 0.012)));
        continue;
      }
      const dz = 0.02 + BOARD.depth * wij;
      st.cells.setMatrixAt(n, m.compose(new THREE.Vector3(x, y, BOARD.z + 0.012 + dz / 2), q, new THREE.Vector3(BOARD.cellW, BOARD.rowH - 0.05, dz)));
      const c = COL.pale.clone().lerp(COL.sand, Math.min(1, Math.sqrt(wij)));
      if (i === k.asker) c.lerp(COL.q, 0.18);
      st.cells.setColorAt(n, c);
      n++;
    }
  }
  st.cells.count = n; st.frostCells.count = f;
  st.cells.instanceMatrix.needsUpdate = true; st.frostCells.instanceMatrix.needsUpdate = true;
  if (st.cells.instanceColor) st.cells.instanceColor.needsUpdate = true;
  const yA = BOARD.y0 + (NT - 1 - k.asker + 0.5) * BOARD.rowH;
  st.rowFrame.position.set(0, yA, BOARD.z + 0.02);
}

function paintLabels(S) {
  const st = S.state, k = S.knobs, t = S.tier, view = k.view, row = st.row;
  const asker = TOKENS[k.asker];
  // numbers above the cups
  st.nums.forEach((L, j) => {
    const hidden = k.mask && j > k.asker;
    if (st.num === 'raw') { L.show(false); return; }
    let s;
    if (st.num === 'raw') s = hidden ? '—' : fx(row.raw[j]);
    else if (st.num === 'score') s = hidden ? (t === 1 ? '—' : '−∞') : fx(row.scores[j]);
    else s = hidden ? '0' : fx(row.w[j], row.w[j] > 0.995 ? 2 : 3);
    L.set(s);
    L.show(st.num !== 'none');
  });
  // key tags (scores view)
  st.keyTags.forEach((L, j) => {                   // key tips (scores view) or value tips (values view)
    const vis = !(k.mask && j > k.asker);
    const onK = view === 'scores' && st.keyWords && st.num !== 'raw' && vis, onV = view === 'values' && vis;
    L.show(onK || onV);
    if (onK) L.move(toW(st.keys[j].map((c) => c * 1.08)));
    if (onV) L.move(toW(VALUES[j].map((c) => c * 1.08)));
  });
  st.keyScores.forEach((L, j) => {                  // beat 2: each key tip carries its q·k
    const on = view === 'scores' && st.num === 'raw' && !(k.mask && j > k.asker);
    L.show(on);
    if (on) { L.move(toW(st.keys[j].map((c) => c * 1.06))); L.set(t === 3 ? `q·k = ${fx(row.raw[j])}` : `${TOKENS[j]} **${fx(row.raw[j])}**`); }
  });
  st.qTag.show(view !== 'pattern' && view !== 'values');
  st.qTag.move(toW(st.q.map((c) => c * 1.1)));
  st.qTag.set(t === 1 ? `${q3(asker)} asks` : t === 2 ? `q of ${q3(asker)}` : `q_${asker}`);
  st.zTag.show(view === 'values');
  st.zTag.move(toW(row.z));
  st.zTag.set(t === 1 ? 'new meaning' : t === 2 ? 'output z' : 'z = Σ wⱼvⱼ');
  st.diag.forEach((L, i) => {
    const on = view === 'pattern';
    L.show(on);
    if (on) L.move([PX(i), BOARD.y0 + (NT - 1 - i + 0.5) * BOARD.rowH, BOARD.z + 0.05 + BOARD.depth * st.pattern[i][i]]);
  });
  st.boardTag.show(view === 'pattern');
  st.boardTag.set(t === 1 ? 'each row: one word asking' : t === 2 ? 'rows: asking word · columns: looked-at word' : 'attn_pattern[posn_Q, posn_K]');
  paintNote(S);
}

function paintNote(S) {
  const st = S.state, k = S.knobs, t = S.tier, row = st.row, mode = st.note;
  const N = st.note ? st.noteEl : null;
  st.noteEl.show(!!mode);
  if (!N) return;
  const asker = TOKENS[k.asker];
  const vis = row.w.map((x, j) => ({ x, j })).filter((o) => !(k.mask && o.j > k.asker));
  if (mode === 'spread') {
    const sp = st.spread;
    N.set(t === 1
      ? `toy test, random arrows\nscore spread, 3 numbers: **${fx(sp.d3)}**\n64 numbers: **${fx(sp.d64)}** (about √d)\nbiggest share in a 64-d head:\n${fx(sp.top.raw, 3)} unshrunk → **${fx(sp.top.scaled, 2)}** ÷8`
      : `toy check, random vectors\nspread of q·k ≈ √d:\nd = 3 → **${fx(sp.d3)}** · d = 64 → **${fx(sp.d64)}**\n64-d head, top weight:\n${fx(sp.top.raw, 3)} raw → **${fx(sp.top.scaled, 2)}** ÷√64`);
  } else if (mode === 'sum') {
    const tot = row.w.reduce((a, b) => a + b, 0);
    N.set(t === 1
      ? `all the sand together: **${fx(tot, 3)}**`
      : `${vis.map((o) => fx(o.x, 3)).join(' + ')}\n= **${fx(tot, 3)}**`);
  } else if (mode === 'z') {
    const big = vis.slice().sort((a, b) => b.x - a.x).slice(0, 2), more = vis.length > big.length;
    N.set(t === 1
      ? `${big.map((o) => `${fx(o.x)} of ${q3(TOKENS[o.j])}`).join(' + ')}${more ? ' + crumbs' : ''}`
      : `z = ${big.map((o) => `${fx(o.x)}·v_${TOKENS[o.j]}`).join(' + ')}${more ? ' + …' : ''}\n= **${vec(row.z)}**`);
  } else if (mode === 'push') {
    const top = vis.slice().sort((a, b) => b.x - a.x).slice(0, 2).map((o) => ({ ...o, p: o.x * Math.hypot(...VALUES[o.j]) }));
    const d = t === 1 ? 2 : 3;
    N.set([t === 1 ? 'sand → how far it moves z' : t === 2 ? 'weight → push ‖w·v‖' : 'w_j → ‖w_j v_j‖',
      ...top.map((o) => `${t === 3 ? TOKENS[o.j] : q3(TOKENS[o.j])} ${fx(o.x, d)} → **${fx(o.p, d)}**`)].join('\n'));
  } else if (mode === 'rows') {
    N.set(t === 1 ? 'every row of sand adds up to 1' : `row sums: ${st.pattern.map((r) => fx(r.reduce((a, b) => a + b, 0), 2)).join(', ')}`);
  } else if (mode === 'raw') {
    const s = row.raw.map((x, j) => ({ x, j })).filter((o) => !(k.mask && o.j > k.asker)).sort((a, b) => b.x - a.x);
    N.set(t === 1 || s.length < 3
      ? `best match for ${q3(asker)}: ${q3(TOKENS[s[0].j])}`
      : `q·k: ${q3(TOKENS[s[0].j])} ${fx(s[0].x)} · ${q3(TOKENS[s[1].j])} ${fx(s[1].x)}\nworst: ${q3(TOKENS[s[s.length - 1].j])} ${fx(s[s.length - 1].x)}`);
  }
}

function refresh(S) { paintSand(S); paintCage(S); paintBoard(S); paintLabels(S); S.invalidate(); }

/* sand pours in over ~0.9 s (instant under ?shot=1) */
function pourSand(S) {
  const st = S.state;
  if (st.done) { const d = st.done; st.done = null; d(); }
  if (S.shot) { st.fill = 1; st.playing = false; refresh(S); return Promise.resolve(); }
  st.fill = 0; st.t0 = null; st.playing = true;
  refresh(S);
  return new Promise((res) => { st.done = res; });
}

function loadQuery(S, i) {      // the asking word's own query into the direction knobs
  const d = QUERY_DIRS[i];
  S.setKnob('turn', d.turn, { silent: true });
  S.setKnob('tilt', d.tilt, { silent: true });
  S.setKnob('qlen', d.len, { silent: true });
}

function scene(S, o = {}) {
  const st = S.state;
  st.num = o.num || 'weight';
  st.note = o.note || null;
  st.shadows = o.shadows !== false;
  st.keyWords = o.keyWords !== false;
  st.noteEl.move(o.noteAt || [0, O.y + HALF + 0.12, O.z]);
  st.noteEl.anchor(o.noteAnchor || 'bottom');
  if (o.figure) {
    st.fig.group.visible = true;
    st.fig.place(o.at || [-1.72, 0, 0.12], o.face || [0.3, 1.5, 3]);
    st.fig.pose('stand', { ms: 0 });
    const doPose = () => st.fig.pose(o.figure, { at: typeof o.point === 'function' ? o.point(S) : o.point });
    if (S.shot) doPose(); else setTimeout(doPose, 480);
  } else st.fig.group.visible = false;
  refresh(S);
}

  rebuild(S, id) {

  frame(S, t) {
    const st = S.state;
    if (!st.playing) return false;
    if (st.t0 == null) st.t0 = t;
    const u = Math.min(1, Math.max(0, (t - st.t0 - 0.2) / 0.9));
    st.fill = 1 - (1 - u) * (1 - u);
    paintSand(S);
    S.invalidate();
    if (u >= 1) {
      st.playing = false;

    }
    return true;

  solids(S) {
    const st = S.state, k = S.knobs;
    const P = (x, y, z) => [x, -z, y];                     // three (x, y, z) -> JSCAD z-up
    const out = [];
    for (let j = 0; j < NT; j++) {
      out.push(J.primitives.cuboid({ size: [PW, PW, PH], center: P(PX(j), PH / 2, PZ) }));
      out.push(J.booleans.subtract(
        J.primitives.cylinder({ radius: CUP_R, height: CUP_H, center: P(PX(j), PH + CUP_H / 2, PZ), segments: 28 }),
        J.primitives.cylinder({ radius: CUP_R - 0.02, height: CUP_H, center: P(PX(j), PH + CUP_H / 2 + 0.02, PZ), segments: 28 })));
      const h = Math.max(0.01, SAND_H * st.row.w[j]);
      out.push(J.primitives.cylinder({ radius: SAND_R, height: h, center: P(PX(j), PH + 0.02 + h / 2, PZ), segments: 24 }));
    }
    if (k.view === 'pattern') {
      for (let i = 0; i < NT; i++) for (let j = 0; j <= (k.mask ? i : NT - 1); j++) {
        const dz = 0.02 + BOARD.depth * st.pattern[i][j];
        out.push(J.primitives.cuboid({ size: [BOARD.cellW, dz, BOARD.rowH - 0.05], center: P(PX(j), BOARD.y0 + (NT - 1 - i + 0.5) * BOARD.rowH, BOARD.z + dz / 2) }));
      }
      out.push(J.primitives.cuboid({ size: [PX(NT - 1) - PX(0) + BOARD.cellW + 0.16, 0.04, NT * BOARD.rowH + 0.12], center: P(0, BOARD.y0 + NT * BOARD.rowH / 2, BOARD.z - 0.02) }));
      return out;
    }
    // the cage edges and legs
    const H = HALF;
    for (const a of [-1, 1]) for (const b of [-1, 1]) {
      out.push(J.primitives.cuboid({ size: [2 * H + 0.04, 0.04, 0.04], center: P(O.x, O.y + a * H, O.z + b * H) }));
      out.push(J.primitives.cuboid({ size: [0.04, 0.04, 2 * H + 0.04], center: P(O.x + a * H, O.y, O.z + b * H) }));
      out.push(J.primitives.cuboid({ size: [0.04, 2 * H + 0.04, 0.04], center: P(O.x + a * H, O.y + b * H, O.z) }));
      out.push(J.primitives.cuboid({ size: [0.04, 0.04, O.y - H], center: P(O.x + a * H, (O.y - H) / 2, O.z + b * H) }));
    }
    // arrows as printable solids: a cylinder shaft and a cone head, turned from +z onto the arrow
    const place = (g, A, d, len) => {                       // g spans z in [−len/2, len/2]
      const dj = [d.x, -d.z, d.y];
      const th = Math.acos(Math.max(-1, Math.min(1, dj[2]))), ph = Math.atan2(dj[1], dj[0]);
      const m = P(A.x + d.x * len / 2, A.y + d.y * len / 2, A.z + d.z * len / 2);
      return J.transforms.translate(m, J.transforms.rotateZ(ph, J.transforms.rotateY(th, g)));
    };
    const arrow = (a, b, r) => {
      const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A), len = d.length();
      if (len < 1e-4) return;
      d.divideScalar(len);
      const hl = Math.min(r * 6, len * 0.45);
      out.push(place(J.primitives.cylinder({ radius: r, height: len - hl + r, segments: 12 }), A, d, len - hl + r));
      const M = A.clone().addScaledVector(d, len - hl);
      out.push(place(J.primitives.cylinderElliptic({ height: hl, startRadius: [r * 2.6, r * 2.6], endRadius: [r * 0.2, r * 0.2], segments: 12 }), M, d, hl));
    };
    const w = (v) => { const p = toW(v); return [p.x, p.y, p.z]; };
    const r0 = 0.035;
    if (k.view === 'values') {
      let acc = [0, 0, 0];
      for (let j = 0; j < NT; j++) {
        if (st.row.w[j] < 0.02) continue;
        const next = acc.map((c, i) => c + st.row.w[j] * VALUES[j][i]);
        arrow(w(acc), w(next), r0 * 0.7); acc = next;
      }
      arrow(w([0, 0, 0]), w(st.row.z), r0);
    } else {
      for (let j = 0; j < NT; j++) arrow(w([0, 0, 0]), w(st.keys[j]), r0 * 0.8);
      arrow(w([0, 0, 0]), w(st.q), r0);
    }
    return out;
  },
