<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sanded Saddle · Object Lessons</title>
<meta name="description" content="PPO's clipped objective as a plaster saddle with its over-eager slopes sanded flat: ARENA's calc_clipped_surrogate_objective, computed live.">
<link rel="stylesheet" href="../kit.css">
<style>
  /* the kit's beat chip .k-tag sets min-width:52px; not wanted on 3D tags */
  .k-label.k-tag{min-width:0; text-transform:none; letter-spacing:.01em; font-size:10.5px}
  .k-label.k-tag.k-teal{color:color-mix(in srgb, var(--k-aux, #1c9aa0) 80%, var(--ink))}
</style>
</head>
<body>
<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   20 · w10-saddle: "The sanded saddle" (W10, ARENA [2.3] PPO)
   The plaster surface is ARENA's clipped surrogate, one sample's term:
   min(r·Â, clip(r, 1 − ε, 1 + ε)·Â), with Â the minibatch-normalised
   advantage. Every height, slope and readout is computed below; the MATH
   block is extracted and verified in node (see LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sigmoid = (z) => 1 / (1 + Math.exp(-z));
const logsigmoid = (z) => (z >= 0 ? -Math.log1p(Math.exp(-z)) : z - Math.log1p(Math.exp(z)));
const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
// torch's Tensor.std() is the sample standard deviation (Bessel's correction: divide by n - 1)
const std = (a) => { const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1)); };

// ARENA [2.3]: advantage normalisation inside calc_clipped_surrogate_objective (PPO detail #7)
function normalize_advantages(mb_advantages, eps = 1e-8) {
  const m = mean(mb_advantages), s = std(mb_advantages);
  return mb_advantages.map((a) => (a - m) / (s + eps));
}

// ARENA [2.3] calc_clipped_surrogate_objective, line for line; new_logprobs = dist.log_prob(mb_action)
function calc_clipped_surrogate_objective(new_logprobs, mb_advantages, mb_logprobs, clip_coef, eps = 1e-8) {
  const logits_diff = new_logprobs.map((lp, i) => lp - mb_logprobs[i]);
  const prob_ratio = logits_diff.map((d) => Math.exp(d));
  const adv = normalize_advantages(mb_advantages, eps);
  const non_clipped = prob_ratio.map((r, i) => r * adv[i]);
  const clipped = prob_ratio.map((r, i) => clamp(r, 1 - clip_coef, 1 + clip_coef) * adv[i]);
  return mean(non_clipped.map((x, i) => Math.min(x, clipped[i])));
}

// one sample's term: the height of the plaster at (r, Â); and the unclipped saddle r·Â
function surrogate(r, A, clip_coef) { return Math.min(r * A, clamp(r, 1 - clip_coef, 1 + clip_coef) * A); }
function unclipped(r, A) { return r * A; }

// ∂term/∂r exactly as torch autograd computes it: t.clip passes gradient only where
// 1 − ε <= r <= 1 + ε; t.minimum sends it to the smaller input and splits it evenly on a tie
function dsurrogate_dr(r, A, clip_coef) {
  const x = r * A, y = clamp(r, 1 - clip_coef, 1 + clip_coef) * A;
  const gx = A, gy = (r >= 1 - clip_coef && r <= 1 + clip_coef) ? A : 0;
  if (x < y) return gx;
  if (x > y) return gy;
  return 0.5 * gx + 0.5 * gy;
}

// ARENA's logged diagnostics (compute_ppo_objective, under inference_mode)
function diagnostics(new_logprobs, mb_logprobs, clip_coef) {
  const logratio = new_logprobs.map((lp, i) => lp - mb_logprobs[i]);
  const ratio = logratio.map((d) => Math.exp(d));
  const approx_kl = mean(ratio.map((r, i) => r - 1 - logratio[i]));
  const clipfrac = mean(ratio.map((r) => (Math.abs(r - 1.0) > clip_coef ? 1 : 0)));
  return { approx_kl, clipfrac };
}

/* Toy policy (illustrative): one state, two actions; θ is the logit of the action that was taken,
   π_θ(a) = σ(θ), and the old policy took it with p_old = 0.5 (a near-uniform start, like ARENA's
   std = 0.01 actor head). Gradient ascent (SGD, maximize=True) on this sample's term:
   θ ← θ + lr · ∂term/∂r · ∂r/∂θ, with ∂r/∂θ = r · (1 − σ(θ)). */
function climb({ r0, A, clip_coef, lr, steps, p_old = 0.5, clip = true }) {
  const lp_old = Math.log(p_old);
  let theta = Math.log((r0 * p_old) / (1 - r0 * p_old));   // σ(θ₀) = r₀ · p_old
  const path = [];
  for (let k = 0; k <= steps; k++) {
    const r = Math.exp(logsigmoid(theta) - lp_old);        // prob_ratio = exp(logprob − old logprob)
    const g = clip ? dsurrogate_dr(r, A, clip_coef) : A;
    path.push({ k, theta, r, L: clip ? surrogate(r, A, clip_coef) : unclipped(r, A), g });
    theta += lr * g * r * (1 - sigmoid(theta));
  }
  return path;
}

/* Toy minibatch (illustrative): N states, each with its own logit (a table, not a network), all
   starting at θ = θ_old (so r = 1). SGD on ARENA's mean objective. */
function trainBatch({ raw, clip_coef, lr, steps, p_old = 0.5, clip = true }) {
  const N = raw.length, lp_old = new Array(N).fill(Math.log(p_old));
  const adv = normalize_advantages(raw);
  let theta = new Array(N).fill(Math.log(p_old / (1 - p_old)));
  const hist = [];
  for (let k = 0; k <= steps; k++) {
    const lp = theta.map(logsigmoid);
    const ratio = lp.map((l, i) => Math.exp(l - lp_old[i]));
    const obj = clip ? calc_clipped_surrogate_objective(lp, raw, lp_old, clip_coef) : mean(ratio.map((r, i) => r * adv[i]));
    hist.push({ k, ratio, obj, ...diagnostics(lp, lp_old, clip_coef) });
    theta = theta.map((t, i) => t + lr * (1 / N) * (clip ? dsurrogate_dr(ratio[i], adv[i], clip_coef) : adv[i]) * ratio[i] * (1 - sigmoid(t)));
  }
  return { adv, hist };
}
const MATH = { clamp, sigmoid, logsigmoid, mean, std, normalize_advantages, calc_clipped_surrogate_objective,
  surrogate, unclipped, dsurrogate_dr, diagnostics, climb, trainBatch };
// MATH-END

/* ============================================================ display setup */

/* Height is the GAIN this sample claims over not changing: z = L − Â (the value at r = 1).
   Â is fixed data during the update, so subtracting it moves no slope (∂z/∂r = ∂L/∂r), and ARENA's
   normalised Â average exactly 0, so a minibatch's mean height is L^CLIP itself. Unclipped,
   z = (r − 1)·Â: a saddle centred on the plinth; the clip caps the gain at ε·|Â|. */
const gainC = (r, A, c) => surrogate(r, A, c) - A;       // the plaster (clipped)
const gainU = (r, A) => unclipped(r, A) - A;              // the unsanded saddle, (r − 1)·Â
const SR = 1.7, SA = 0.75, ZS = 0.45, BASE = 0.1, ZMIN = -2;   // world scales (r, Â, height)
const wx = (r) => (r - 1) * SR;
const wz = (A) => -A * SA;                                     // Â > 0 at the back
const wy = (z) => BASE + (z - ZMIN) * ZS;
const STEPS = 20;                                              // gradient steps per run
const RAW = [2.1, 1.7, 1.4, 1.0, 0.7, 0.3, 0.2, -0.2];          // toy raw advantages (mean 0.9)
const BR = 0.075, TR = 0.0085, RAIL = 0.011, BEAD = 0.066;
const UP = new THREE.Vector3(0, 1, 0);
const CAM = {
  hero: { pos: [4.0, 3.8, 5.8], target: [0, 0.9, 0] },
  axisA: { pos: [1.6, 4.8, 6.6], target: [0, 0.9, 0] },
  saddle: { pos: [4.6, 3.2, 5.2], target: [0, 0.9, 0] },
  sand: { pos: [3.4, 4.0, 6.0], target: [0, 0.9, 0] },
  corner: { pos: [2.0, 3.0, 6.8], target: [0.2, 0.8, 0] },
  batch: { pos: [3.0, 5.0, 5.6], target: [0, 0.9, 0] },
  wide: { pos: [-3.6, 4.2, 6.0], target: [0, 0.9, 0] },
  low: { pos: [5.9, 2.2, 3.0], target: [0.4, 1.0, -0.5] },
};
const fx = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d).replace('-', '−');
const sg = (v, d = 1) => (v > 0 ? '+' : '') + fx(v, d);

function axisGrid(a, b, n, extra) {
  const v = [];
  for (let i = 0; i <= n; i++) v.push(a + (b - a) * i / n);
  for (const e of extra) if (e > a && e < b) v.push(e);
  v.sort((p, q) => p - q);
  return v.filter((x, i) => i === 0 || x - v[i - 1] > 1e-9);
}
// the displayed plaster: s = 1 is ARENA's clipped term exactly, s = 0 is the unsanded saddle r·Â
function hDisp(r, A, c, s) { const u = gainU(r, A); return s >= 1 ? gainC(r, A, c) : u - s * (u - gainC(r, A, c)); }
function slopeDisp(r, A, c, s) { return (1 - s) * A + s * dsurrogate_dr(r, A, c); }

function rod(mat, radius, seg = 8) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 1, seg, 1), mat);
  m.castShadow = true;
  const d = new THREE.Vector3();
  m.userData.set = (p, q) => {
    d.subVectors(q, p);
    const len = Math.max(d.length(), 1e-6);
    m.position.copy(p).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(UP, d.multiplyScalar(1 / len));
    m.scale.set(1, len, 1);
  };
  return m;
}

/* ============================================================ the plaster */

function buildSurface(S) {
  const st = S.state, c = st.c;
  st.rs = axisGrid(0, 2, 40, [1 - c, 1 + c]);
  st.As = axisGrid(-2, 2, 40, [0]);
  const nx = st.rs.length - 1, ny = st.As.length - 1;
  const nt = nx * ny * 6, ns = (2 * nx + 2 * ny) * 6;
  const mk = (n, col) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    if (col) g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    return g;
  };
  if (st.top) { st.top.geometry.dispose(); st.skirt.geometry.dispose(); st.top.geometry = mk(nt, true); st.skirt.geometry = mk(ns, false); }
  else {
    const topMat = new THREE.MeshStandardMaterial({ color: '#ffffff', vertexColors: true, roughness: 0.9, metalness: 0 });
    topMat.shadowSide = THREE.DoubleSide;
    st.top = new THREE.Mesh(mk(nt, true), topMat);
    st.skirt = new THREE.Mesh(mk(ns, false), K.mat.plaster('#e9e2d6'));
    for (const m of [st.top, st.skirt]) { m.castShadow = true; m.receiveShadow = true; S.root.add(m); }
    // brass trim round the foot
    const bm = K.mat.brass(), tw = 0.026, th = 0.06, hx = SR, hz = 2 * SA;
    const box = (w, d, x, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, th, d), bm); b.position.set(x, th / 2, z); b.castShadow = true; b.receiveShadow = true; S.root.add(b); };
    box(2 * hx + 2 * tw, tw, 0, hz + tw / 2); box(2 * hx + 2 * tw, tw, 0, -hz - tw / 2);
    box(tw, 2 * hz, hx + tw / 2, 0); box(tw, 2 * hz, -hx - tw / 2, 0);
  }
  paintSurface(S);
}

const cPl = new THREE.Color(), cGr = new THREE.Color(), cTmp = new THREE.Color();
function paintSurface(S) {
  const st = S.state, c = st.c, s = st.sand, rs = st.rs, As = st.As;
  const nx = rs.length - 1, ny = As.length - 1, W1 = nx + 1;
  const Y = new Float32Array((nx + 1) * (ny + 1));
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) Y[j * W1 + i] = wy(hDisp(rs[i], As[j], c, s));
  const pos = st.top.geometry.attributes.position.array, nor = st.top.geometry.attributes.normal.array;
  const col = st.top.geometry.attributes.color.array;
  cPl.set(C.plaster); cGr.set(C.grad);
  let q = 0;
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), n = new THREE.Vector3();
  const tri = (ax, ay, az, bx, by, bz, cx, cy, cz, cr) => {
    e1.set(bx - ax, by - ay, bz - az); e2.set(cx - ax, cy - ay, cz - az); n.crossVectors(e1, e2).normalize();
    for (const [x, y, z] of [[ax, ay, az], [bx, by, bz], [cx, cy, cz]]) {
      pos[q] = x; pos[q + 1] = y; pos[q + 2] = z;
      nor[q] = n.x; nor[q + 1] = n.y; nor[q + 2] = n.z;
      col[q] = cr.r; col[q + 1] = cr.g; col[q + 2] = cr.b;
      q += 3;
    }
  };
  for (let j = 0; j < ny; j++) {
    const z0 = wz(As[j]), z1 = wz(As[j + 1]), Ac = (As[j] + As[j + 1]) / 2;
    for (let i = 0; i < nx; i++) {
      const x0 = wx(rs[i]), x1 = wx(rs[i + 1]), rc = (rs[i] + rs[i + 1]) / 2;
      const y00 = Y[j * W1 + i], y10 = Y[j * W1 + i + 1], y11 = Y[(j + 1) * W1 + i + 1], y01 = Y[(j + 1) * W1 + i];
      // red tint = |slope along r| of the displayed surface (the push this sample feels); shelves stay white
      const g = Math.abs(slopeDisp(rc, Ac, c, s));
      cTmp.copy(cPl).lerp(cGr, 0.62 * Math.min(1, g / 2));
      tri(x0, y00, z0, x1, y10, z0, x1, y11, z1, cTmp);
      tri(x0, y00, z0, x1, y11, z1, x0, y01, z1, cTmp);
    }
  }
  const tg = st.top.geometry;
  tg.attributes.position.needsUpdate = true; tg.attributes.normal.needsUpdate = true; tg.attributes.color.needsUpdate = true;
  tg.computeBoundingSphere(); tg.computeBoundingBox();
  // skirts: walk the perimeter, outward quads down to the plinth
  const per = [];
  for (let i = 0; i < nx; i++) per.push([i, 0, [0, 0, 1]]);
  for (let j = 0; j < ny; j++) per.push([nx, j, [1, 0, 0]]);
  for (let i = nx; i > 0; i--) per.push([i, ny, [0, 0, -1]]);
  for (let j = ny; j > 0; j--) per.push([0, j, [-1, 0, 0]]);
  const sp = st.skirt.geometry.attributes.position.array, sn = st.skirt.geometry.attributes.normal.array;
  let w = 0;
  const put = (x, y, z, o) => { sp[w] = x; sp[w + 1] = y; sp[w + 2] = z; sn[w] = o[0]; sn[w + 1] = o[1]; sn[w + 2] = o[2]; w += 3; };
  for (let p = 0; p < per.length; p++) {
    const [ia, ja, o] = per[p], [ib, jb] = per[(p + 1) % per.length];
    const ax = wx(rs[ia]), az = wz(As[ja]), ay = Y[ja * W1 + ia];
    const bx = wx(rs[ib]), bz = wz(As[jb]), by = Y[jb * W1 + ib];
    // winding chosen so the face normal points along o (outward)
    e1.set(bx - ax, 0, bz - az); e2.set(0, -1, 0); n.crossVectors(e1, e2);
    const flip = n.x * o[0] + n.z * o[2] < 0;
    if (!flip) { put(ax, ay, az, o); put(bx, by, bz, o); put(ax, 0, az, o); put(bx, by, bz, o); put(bx, 0, bz, o); put(ax, 0, az, o); }
    else { put(ax, ay, az, o); put(ax, 0, az, o); put(bx, by, bz, o); put(bx, by, bz, o); put(ax, 0, az, o); put(bx, 0, bz, o); }
  }
  const sg2 = st.skirt.geometry;
  sg2.attributes.position.needsUpdate = true; sg2.attributes.normal.needsUpdate = true; sg2.computeBoundingSphere();
  placeLines(S);
  paintGhost(S);
  S.invalidate();
}

/* creases (brass), the r = 1 line (ink), the slice rail (amber), tick posts */
function placeLines(S) {
  const st = S.state, c = st.c, s = st.sand, A = S.knobs.A;
  const P = (r, a, lift = 0.012) => new THREE.Vector3(wx(r), wy(hDisp(r, a, c, s)) + lift, wz(a));
  st.creaseUp.userData.set(P(1 + c, 0, 0.014), P(1 + c, 2, 0.014));
  st.creaseDn.userData.set(P(1 - c, -2, 0.014), P(1 - c, 0, 0.014));
  st.oneLine.userData.set(P(1, -2, 0.01), P(1, 2, 0.01));
  st.rail.set([0, 1 - c, 1 + c, 2].map((r) => P(r, A, RAIL)));
  const zf = wz(-2) + 0.12;
  st.ticks.forEach((t, i) => { const r = [1 - c, 1, 1 + c][i]; t.position.set(wx(r), 0.04, zf); });
  st.tickTags.forEach((t, i) => t.move(new THREE.Vector3(wx([1 - c, 1, 1 + c][i]), 0.02, zf + 0.12)));
  st.tickTags[0].set(() => (S.tier === 1 ? fx(1 - S.knobs.eps) : '1−ε'));
  st.tickTags[2].set(() => (S.tier === 1 ? fx(1 + S.knobs.eps) : '1+ε'));
  st.shelfTag.move(P(1 + c + (1 - c) * 0.55, 1.45, 0.02));
  st.slopeTag.move(P(1.62, -1.4, 0.02));
  st.shelfDnTag.move(P((1 - c) * 0.3, -1.65, 0.02));
}

/* the unclipped saddle r·Â where the min cut material away: translucent teal wedges over the two
   shelves (L <= r·Â everywhere, so there is nothing to show elsewhere), ruled with straight strings
   (z = r·Â is doubly ruled). */
const WN = 8;
function ghostRegions(c) {   // [r range, Â range, the two outer walls]
  return [
    { r: [1 + c, 2], A: [0, 2], walls: [['r', 2], ['A', 2]] },
    { r: [0, 1 - c], A: [-2, 0], walls: [['r', 0], ['A', -2]] },
  ];
}
function buildGhost(S) {
  const st = S.state;
  const nv = 2 * (WN * WN * 6 + 2 * WN * 6);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nv * 3), 3));
  const mat = K.mat.glass(C.aux, 0.26);
  mat.side = THREE.DoubleSide;
  st.wedge = new THREE.Mesh(g, mat);
  st.wedge.renderOrder = 2;
  st.wedge.userData.noFit = true;
  S.root.add(st.wedge);
  st.strings = new THREE.InstancedMesh(new THREE.CylinderGeometry(TR, TR, 1, 6, 1), K.mat.string(C.aux), 12);
  st.strings.castShadow = true;
  S.root.add(st.strings);
  st.sliceStr = rod(K.mat.string(C.aux), TR * 1.6, 6);
  S.root.add(st.sliceStr);
}
function paintGhost(S) {
  const st = S.state, c = st.c, s = st.sand;
  const pos = st.wedge.geometry.attributes.position.array;
  let q = 0;
  const put = (x, y, z) => { pos[q++] = x; pos[q++] = y; pos[q++] = z; };
  const G = (r, A) => [wx(r), wy(gainU(r, A)), wz(A)];
  const Hs = (r, A) => [wx(r), wy(hDisp(r, A, c, s)), wz(A)];
  for (const R of ghostRegions(c)) {
    const [r0, r1] = R.r, [a0, a1] = R.A;
    for (let j = 0; j < WN; j++) for (let i = 0; i < WN; i++) {
      const ra = r0 + (r1 - r0) * i / WN, rb = r0 + (r1 - r0) * (i + 1) / WN;
      const aa = a0 + (a1 - a0) * j / WN, ab = a0 + (a1 - a0) * (j + 1) / WN;
      const p00 = G(ra, aa), p10 = G(rb, aa), p11 = G(rb, ab), p01 = G(ra, ab);
      put(...p00); put(...p10); put(...p11); put(...p00); put(...p11); put(...p01);
    }
    for (const [kind, val] of R.walls) {
      for (let i = 0; i < WN; i++) {
        let ta, tb, ba, bb;
        if (kind === 'r') { const aa = a0 + (a1 - a0) * i / WN, ab = a0 + (a1 - a0) * (i + 1) / WN; ta = G(val, aa); tb = G(val, ab); ba = Hs(val, aa); bb = Hs(val, ab); }
        else { const ra = r0 + (r1 - r0) * i / WN, rb = r0 + (r1 - r0) * (i + 1) / WN; ta = G(ra, val); tb = G(rb, val); ba = Hs(ra, val); bb = Hs(rb, val); }
        put(...ta); put(...tb); put(...bb); put(...ta); put(...bb); put(...ba);
      }
    }
  }
  const g = st.wedge.geometry;
  g.attributes.position.needsUpdate = true;
  g.computeVertexNormals();
  g.computeBoundingSphere();
  // strings on the wedge tops (straight: rulings of z = r·Â)
  const d = new THREE.Object3D(), v = new THREE.Vector3();
  const V = (r, A) => new THREE.Vector3(wx(r), wy(gainU(r, A)) + TR, wz(A));
  let i = 0;
  const seg = (p, qq) => {
    v.subVectors(qq, p); const len = Math.max(1e-6, v.length());
    d.position.copy(p).addScaledVector(v, 0.5); d.quaternion.setFromUnitVectors(UP, v.multiplyScalar(1 / len)); d.scale.set(1, len, 1);
    d.updateMatrix(); st.strings.setMatrixAt(i++, d.matrix);
  };
  for (const A of [0.5, 1, 1.5, 2]) seg(V(1 + c, A), V(2, A));
  for (const A of [-0.5, -1, -1.5, -2]) seg(V(0, A), V(1 - c, A));
  for (const r of [1.5, 2]) seg(V(r, 0), V(r, 2));
  for (const r of [0, 0.5]) seg(V(r, -2), V(r, 0));
  st.strings.instanceMatrix.needsUpdate = true;
  st.strings.computeBoundingSphere();
  const show = S.knobs.ghost && s > 0.02;
  st.wedge.visible = show; st.strings.visible = show;
}

/* ============================================================ state and motion */

function compute(S) {
  const st = S.state, k = S.knobs;
  st.P = climb({ r0: k.r0, A: k.A, clip_coef: k.eps, lr: k.lr, steps: STEPS, clip: k.clip });
  st.G = climb({ r0: k.r0, A: k.A, clip_coef: k.eps, lr: k.lr, steps: STEPS, clip: false });
  st.B = trainBatch({ raw: RAW, clip_coef: k.eps, lr: k.lr * RAW.length, steps: STEPS, clip: k.clip });
  st.u = 0; st.ub = 0; st.nf = 1;
  st.glide = null;
}

const tmp = new THREE.Vector3();
function onSurf(S, r, A, lift) { const st = S.state; return tmp.set(wx(r), wy(hDisp(r, A, st.c, st.sand)) + lift, wz(A)); }

function pathAt(P, u) {   // position along a path at fractional step u (hops between landings)
  const last = P.length - 1, k = Math.min(Math.floor(u), last), f = Math.min(1, u - k);
  if (k >= last) return { r: P[last].r, hop: 0, k: last };
  const a = P[k].r, b = P[k + 1].r;
  return { r: a + (b - a) * f, hop: 4 * f * (1 - f) * (0.12 * Math.abs(b - a) * SR + 0.004), k };
}

function drawOne(S) {
  const st = S.state, k = S.knobs;
  let r, A = k.A, hop = 0, kk = 0;
  if (st.glide) { r = st.glide.r; A = st.glide.A; }
  else { const p = pathAt(st.P, st.u); r = p.r; hop = p.hop; kk = p.k; }
  st.ball.position.copy(onSurf(S, r, A, BR + hop));
  // the numbers this spot stands for (a hop shows the landing it left from)
  const g = st.glide ? (k.clip ? dsurrogate_dr(r, A, k.eps) : A) : st.P[kk].g;
  const rr = st.glide ? r : st.P[kk].r;
  st.shown = { r: rr, A, L: k.clip ? surrogate(rr, A, k.eps) : unclipped(rr, A), g, k: kk };
  readout(S);
  // gradient arrow: along the rail, pointing the way gradient ascent moves r
  if (Math.abs(g) < 1e-12 || !st.showArrow) st.arrow.show(false);
  else {
    const p0 = st.ball.position.clone();
    const dir = new THREE.Vector3(Math.sign(g) * SR, ZS * Math.abs(g) * 1, 0).normalize();
    const len = 0.16 + 0.3 * Math.min(2, Math.abs(g));
    st.arrow.show(true);
    st.arrow.set(p0.clone().addScaledVector(dir, BR * 0.9), p0.clone().addScaledVector(dir, BR + len));
  }
  // the ghost ball runs the same steps on the unclipped saddle
  const gv = st.ghostBall.visible;
  if (gv) {
    const q = st.glide ? { r, hop: 0 } : pathAt(st.G, st.u);
    st.ghostBall.position.set(wx(q.r), wy(gainU(q.r, A)) + BR * 0.95 + q.hop, wz(A));
    const gk = st.glide ? null : st.G[Math.min(Math.floor(st.u), STEPS)];
    const rg = gk ? gk.r : r;
    st.ghostTag.set(S.tier === 1 ? `unsanded · r = ${fx(rg)}` : S.tier === 2 ? `unclipped · r = ${fx(rg)}` : `r·Â only · r = ${fx(rg, 3)}`);
  }
  S.invalidate();
}

function readout(S) {
  const st = S.state, k = S.knobs, v = st.shown;
  if (!v) return;
  const z = v.L - v.A;                       // the height: gain over r = 1
  const push = v.g === 0 ? (S.tier === 1 ? 'flat here: no push' : '∂L/∂r = 0 (flat)') : null;
  if (S.tier === 1) {
    st.readout.set(`**r = ${fx(v.r)}** · gain ${sg(z, 2)}\n${push || `push ${sg(v.g, 1)}: ${v.g > 0 ? 'r goes up' : 'r goes down'}`}`);
  } else if (S.tier === 2) {
    st.readout.set(`**r = ${fx(v.r, 3)}** · Â = ${sg(v.A)}\ngain ${k.clip ? 'L' : 'r·Â'} − Â = ${sg(z, 3)} · ${push || `∂L/∂r = ${fx(v.g, 2)}`}`);
  } else {
    st.readout.set(`**r = ${fx(v.r, 3)}** · Â = ${sg(v.A, 2)} · step ${v.k}\n${k.clip ? 'L' : 'r·Â'} = ${fx(v.L, 3)}, height ${sg(z, 3)} · ∂L/∂r = ${fx(v.g, 2)}`);
  }
}

function drawBatch(S) {
  const st = S.state, B = st.B, nf = st.nf;
  const raw = RAW, adv = B.adv, H = B.hist;
  const last = H.length - 1, u = Math.min(st.ub, last), kk = Math.min(Math.floor(u), last), f = Math.min(1, u - kk);
  const m0 = mean(raw);
  for (let i = 0; i < raw.length; i++) {
    const A = raw[i] + (adv[i] - raw[i]) * nf;
    let r = 1, hop = 0;
    if (nf >= 1) {
      const a = H[kk].ratio[i], b = kk < last ? H[kk + 1].ratio[i] : a;
      r = a + (b - a) * f; hop = 4 * f * (1 - f) * (0.1 * Math.abs(b - a) * SR);
    }
    st.beads[i].position.copy(onSurf(S, r, A, BEAD + hop));
    // trail: from r = 1 along the landings so far
    const pts = [onSurf(S, 1, A, 0.012).clone()];
    if (nf >= 1) {
      for (let j = 1; j <= kk; j++) pts.push(onSurf(S, H[j].ratio[i], A, 0.012).clone());
      pts.push(onSurf(S, r, A, 0.012).clone());
    }
    st.trails[i].set(pts.length > 1 ? pts : [pts[0], pts[0].clone().add(new THREE.Vector3(1e-4, 0, 0))]);
  }
  st.hiRing.visible = st.hi >= 0;
  if (st.hi >= 0) st.hiRing.position.copy(st.beads[st.hi].position).add(new THREE.Vector3(0, -BEAD + 0.006, 0));
  st.meanRing.position.copy(onSurf(S, 1, m0 * (1 - nf), 0.014));
  const h = H[kk];
  const nClip = Math.round(h.clipfrac * raw.length);
  if (nf < 1) {
    const s = std(raw);
    st.batchNote.set(S.tier === 1 ? `raw advantages (toy): average ${fx(m0)}\nrescaled: average 0, spread 1`
      : S.tier === 2 ? `raw A (toy): mean ${fx(m0)}, std ${fx(s)}\nÂ = (A − mean) / (std + 1e-8)`
      : `mb_advantages (toy): μ = ${fx(m0, 3)}, σ = ${fx(s, 3)}\n(A − A.mean()) / (A.std() + eps)`);
  } else if (S.tier === 1) {
    st.batchNote.set(`**score = average height ${fx(h.obj, 3)}**\n${nClip} of ${raw.length} past a sanded edge · step ${h.k}`);
  } else if (S.tier === 2) {
    st.batchNote.set(`**L^CLIP = mean height = ${fx(h.obj, 3)}**\nclipfrac ${fx(h.clipfrac, 3)} · approx_kl ${fx(h.approx_kl, 4)} · step ${h.k}`);
  } else {
    st.batchNote.set(`**${S.knobs.clip ? 'calc_clipped_surrogate_objective' : 'mean(r·Â)'} → ${fx(h.obj, 4)}**\nclipfrac ${fx(h.clipfrac, 3)} · approx_kl ${fx(h.approx_kl, 4)} · step ${h.k}`);
  }
  S.invalidate();
}

/* ---------------- a small animation queue (cancellable; instant under ?shot=1) */
function play(S, phases) {
  const st = S.state;
  if (st.done) { const d = st.done; st.done = null; d(); }
  st.q = phases.slice(); st.qt0 = null;
  if (S.shot) {
    for (const p of phases) p.fn(1);
    st.q = [];
    S.invalidate();
    return Promise.resolve();
  }
  if (st.q.length) st.q[0].fn(0);
  S.invalidate();
  return new Promise((res) => { st.done = res; });
}
const ph = (ms, fn) => ({ ms, fn });
const ease = (f) => (f < 0.5 ? 2 * f * f : 1 - 2 * (1 - f) * (1 - f));
function climbPhase(S, per = 150) { return ph(STEPS * per, (f) => { S.state.glide = null; S.state.u = f * STEPS; drawOne(S); }); }
function sandPhase(S, from, to, ms = 1300) {
  return ph(ms, (f) => { const st = S.state; st.sand = from + (to - from) * ease(f); paintSurface(S); drawOne(S); });
}
function glidePhase(S, a, b, ms) {
  return ph(ms, (f) => { const st = S.state, e = ease(f); st.glide = { r: a[0] + (b[0] - a[0]) * e, A: a[1] + (b[1] - a[1]) * e }; placeRailAt(S, st.glide.A); drawOne(S); });
}
function holdPhase(ms) { return ph(ms, () => {}); }
function normPhase(S, ms = 1100) { return ph(ms, (f) => { S.state.nf = ease(f); S.state.ub = 0; drawBatch(S); }); }
function trainPhase(S, per = 120) { return ph(STEPS * per, (f) => { S.state.nf = 1; S.state.ub = f * STEPS; drawBatch(S); }); }

function placeRailAt(S, A) {
  const st = S.state, c = st.c, s = st.sand;
  st.rail.set([0, 1 - c, 1 + c, 2].map((r) => new THREE.Vector3(wx(r), wy(hDisp(r, A, c, s)) + RAIL, wz(A))));
  st.sliceStr.userData.set(new THREE.Vector3(wx(0), wy(gainU(0, A)) + TR, wz(A)), new THREE.Vector3(wx(2), wy(gainU(2, A)) + TR, wz(A)));
}

/* default run after a knob change */
function runDefault(S) {
  const st = S.state;
  if (S.knobs.mode === 'batch') return play(S, [normPhase(S), holdPhase(300), trainPhase(S)]);
  st.glide = null;
  return play(S, [holdPhase(250), climbPhase(S)]);
}

/* visibility per mode / toggles */
function applyMode(S) {
  const st = S.state, one = S.knobs.mode === 'one';
  st.ball.visible = one; st.rail.mesh.visible = one; st.readout.show(one);
  st.ghostBall.visible = one && S.knobs.ghost && S.knobs.clip;
  st.ghostTag.show(st.ghostBall.visible && st.cfg.ghostTag !== false);
  st.sliceStr.visible = one && S.knobs.ghost;
  st.wedge.visible = st.strings.visible = S.knobs.ghost && st.sand > 0.02;
  for (const b of st.beads) b.visible = !one;
  for (const t of st.trails) t.mesh.visible = !one;
  st.meanRing.visible = !one;
  st.batchNote.show(!one);
  if (one) st.hiRing.visible = false;
  st.showArrow = one;
  if (!one) st.arrow.show(false);
  const btn = document.querySelector('.k-knob-button .k-btn');
  if (btn) btn.textContent = goLabel(S);
  dimKnobs(S);
}
function goLabel(S) {
  const one = S.knobs.mode === 'one';
  return one ? { 1: 'Roll the ball', 2: 'Climb: 20 gradient steps', 3: 'Run 20 SGD steps (ascent)' }[S.tier]
    : { 1: 'Train the batch', 2: 'Normalise, then train', 3: 'Normalise + 20 SGD steps' }[S.tier];
}
function dimKnobs(S) {   // the kit cannot dim knobs; grey the ones that do nothing right now
  const dim = (id, on) => { const el = document.getElementById('k-' + id); const row = el && el.closest('.k-knob'); if (row) row.style.opacity = on ? '0.42' : ''; };
  const batch = S.knobs.mode === 'batch';
  dim('A', batch); dim('r0', batch); dim('eps', !S.knobs.clip);
}

/* scene configuration shared by beats and predictions */
function scene(S, o = {}) {
  const st = S.state;
  st.cfg = o;
  const names = o.names ?? !!o.axes;
  st.tagR.show(names); st.tagAp.show(names); st.tagAm.show(names);
  st.axR.show(!!o.axes); st.axA.show(!!o.axes);
  st.ticks.forEach((t, i) => { t.visible = !!o.axes && (i === 1 || !!o.ticks); });
  st.tickTags.forEach((t, i) => t.show(!!o.axes && (i === 1 || !!o.ticks)));
  st.shelfTag.show(!!o.shelf); st.slopeTag.show(!!o.slope); st.shelfDnTag.show(!!o.shelfDn);
  st.grpoTag.show(!!o.grpo);
  st.hi = o.hi ?? -1;
  if (o.figure) {
    st.fig.group.visible = true;
    st.fig.place(o.figAt || [2.0, 0, 1.05], o.face || [0, 0.9, 0]);
    st.fig.pose('stand', { ms: 0 });
    const doPose = () => st.fig.pose(o.figure, { at: typeof o.at === 'function' ? o.at(S) : o.at });
    if (S.shot) doPose(); else setTimeout(doPose, 520);
  } else st.fig.group.visible = false;
  applyMode(S);
}
const ballWorld = (S) => S.state.ball.getWorldPosition(new THREE.Vector3());

run({

  },

  frame(S, t) {

  solids(S) {

    const out = [surfaceSolid(c)];

    }

/* watertight STL solid of the clipped surface (JSCAD is z-up: three (x, y, z) -> JSCAD (x, -z, y)) */
function surfaceSolid(c) {
  const rs = axisGrid(0, 2, 40, [1 - c, 1 + c]), As = axisGrid(-2, 2, 40, [0]);
  const nx = rs.length - 1, ny = As.length - 1, W1 = nx + 1;
  const points = [], faces = [];
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) points.push([wx(rs[i]), -wz(As[j]), wy(gainC(rs[i], As[j], c))]);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = j * W1 + i, b = a + 1, cc = a + 1 + W1, d = a + W1;
    faces.push([a, b, cc], [a, cc, d]);
  }
  const per = [];
  for (let i = 0; i < nx; i++) per.push([i, 0]);
  for (let j = 0; j < ny; j++) per.push([nx, j]);
  for (let i = nx; i > 0; i--) per.push([i, ny]);
  for (let j = ny; j > 0; j--) per.push([0, j]);
  const bIdx = new Map();
  const bottom = (i, j) => { const key = j * W1 + i; if (!bIdx.has(key)) { bIdx.set(key, points.length); points.push([points[key][0], points[key][1], 0]); } return bIdx.get(key); };
  for (let p = 0; p < per.length; p++) {
    const [ia, ja] = per[p], [ib, jb] = per[(p + 1) % per.length];
    faces.push([ja * W1 + ia, bottom(ia, ja), bottom(ib, jb), jb * W1 + ib]);
  }
  const c0 = points.length;
  points.push([0, 0, 0]);
  for (let p = 0; p < per.length; p++) {
    const [ia, ja] = per[p], [ib, jb] = per[(p + 1) % per.length];
    faces.push([c0, bottom(ib, jb), bottom(ia, ja)]);
  }
  return J.primitives.polyhedron({ points, faces, orientation: 'outward' });
}
