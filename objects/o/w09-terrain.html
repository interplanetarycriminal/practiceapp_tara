<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   18 · w09-terrain: "The value terrain" (W9, ARENA [2.1] Intro to RL, planning)
   Every height is V*(s) for the board as set, computed in the page by ARENA's own
   planning functions (policy_eval_exact + policy_improvement inside
   find_optimal_policy); the sweeps are the Bellman optimality operator from
   ARENA's proof. The MATH block is extracted and checked in node against an
   independent numpy implementation, closed forms and Monte Carlo (LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
/* ARENA [2.1] conventions: actions up (0), right (1), down (2), left (3); states numbered
   left-to-right, top-to-bottom; env.T[s, a, s'] = T(s' | s, a) and env.R[s, a, s'] = R(s, a, s'),
   stored flat at index (s * num_actions + a) * num_states + s'. */
const ACTIONS = ['up', 'right', 'down', 'left'];
const DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];            // (row, col) step for each action

class Environment {
  constructor(num_states, num_actions, start = 0, terminal = []) {
    this.num_states = num_states;
    this.num_actions = num_actions;
    this.start = start;
    this.terminal = terminal;
  }
  /* T and R from dynamics() (ARENA's constructor does this itself; JS subclasses must set their
     fields first, so they call build()). Several outcomes can land in the same s' with different
     rewards (falling off the cliff and bumping a wall can both leave you at the start), so
     R[s, a, s'] is their probability-weighted mean: then sum_s' T * R is exactly the expected reward. */
  build() {
    const S = this.num_states, A = this.num_actions;
    const T = new Float64Array(S * A * S), R = new Float64Array(S * A * S);
    for (let s = 0; s < S; s++) for (let a = 0; a < A; a++) {
      const [states, rewards, probs] = this.dynamics(s, a);
      const pr = new Map();
      states.forEach((s2, i) => {
        const k = (s * A + a) * S + s2;
        T[k] += probs[i];
        pr.set(k, (pr.get(k) || 0) + probs[i] * rewards[i]);
      });
      for (const [k, v] of pr) R[k] = v / T[k];
    }
    this.T = T; this.R = R;
    return this;
  }
}

/* ARENA's GridWorld: 'S' start, 'G' goal (+goal_reward, terminal), 'T' trap (+trap_reward,
   terminal), 'C' cliff (+cliff_reward, back to the start, not terminal), '#' wall (bump: stay),
   '.' floor. Every other transition pays step_reward. slipperiness p: the chosen move happens
   with prob 1 - p, each of the other three with p / 3. This page adds '$', a coin that pays
   coin_reward each time you step onto it (it respawns at once); with coin_reward 0 it is floor. */
class GridWorld extends Environment {
  constructor(grid_map, { step_reward = 0.0, goal_reward = 1.0, trap_reward = -1.0, cliff_reward = -100.0,
    slipperiness = 0.0, coin_reward = 0.0 } = {}) {
    const rows = grid_map.trim().split('\n').map((r) => r.trim());
    const cells = rows.join('');
    const terminal = [...cells].flatMap((ch, i) => (ch === 'G' || ch === 'T' ? [i] : []));
    super(cells.length, 4, cells.indexOf('S'), terminal);
    Object.assign(this, { rows, cells, H: rows.length, W: rows[0].length,
      step_reward, goal_reward, trap_reward, cliff_reward, slipperiness, coin_reward });
    this.build();
  }
  /* one attempted move in direction d from state s: where you land, what you get, what happened */
  move(s, d) {
    const { H, W, cells } = this;
    const r = Math.floor(s / W), c = s % W, nr = r + DIRS[d][0], nc = c + DIRS[d][1];
    if (nr < 0 || nr >= H || nc < 0 || nc >= W || cells[nr * W + nc] === '#') return { s2: s, r: this.step_reward, kind: 'bump' };
    const s2 = nr * W + nc, ch = cells[s2];
    if (ch === 'C') return { s2: this.start, r: this.cliff_reward, kind: 'fall', over: s2 };
    if (ch === 'G') return { s2, r: this.goal_reward, kind: 'goal' };
    if (ch === 'T') return { s2, r: this.trap_reward, kind: 'trap' };
    if (ch === '$' && this.coin_reward) return { s2, r: this.coin_reward, kind: 'coin' };
    return { s2, r: this.step_reward, kind: 'step' };
  }
  dynamics(state, action) {
    const ch = this.cells[state];
    if (ch === 'G' || ch === 'T' || ch === '#' || ch === 'C') return [[state], [0], [1]];   // absorbing, reward 0
    const p = this.slipperiness, states = [], rewards = [], probs = [];
    for (let d = 0; d < 4; d++) {
      const q = d === action ? 1 - p : p / 3;
      if (q <= 0) continue;
      const out = this.move(state, d);
      states.push(out.s2); rewards.push(out.r); probs.push(q);
    }
    return [states, rewards, probs];
  }
}

/* ARENA: iterate V <- sum_s' T(s'|s,pi(s)) (R + gamma V) until max |dV| < eps */
function policy_eval_numerical(env, pi, gamma = 0.99, eps = 1e-8, max_iterations = 10000) {
  const S = env.num_states, A = env.num_actions;
  let value = new Float64Array(S);
  for (let i = 0; i < max_iterations; i++) {
    const new_value = new Float64Array(S);
    for (let s = 0; s < S; s++) {
      const base = (s * A + pi[s]) * S;
      let v = 0;
      for (let s2 = 0; s2 < S; s2++) { const t = env.T[base + s2]; if (t) v += t * (env.R[base + s2] + gamma * value[s2]); }
      new_value[s] = v;
    }
    let delta = 0;
    for (let s = 0; s < S; s++) delta = Math.max(delta, Math.abs(new_value[s] - value[s]));
    if (delta < eps) break;
    value = new_value;
  }
  return value;
}

/* ARENA: solve (I - gamma P_pi) v = r_pi exactly (np.linalg.solve: Gaussian elimination, partial pivoting) */
function policy_eval_exact(env, pi, gamma = 0.99) {
  const S = env.num_states, A = env.num_actions;
  const M = Array.from({ length: S }, () => new Float64Array(S + 1));
  for (let s = 0; s < S; s++) {
    const base = (s * A + pi[s]) * S;
    let r = 0;
    for (let s2 = 0; s2 < S; s2++) {
      const t = env.T[base + s2];
      r += t * env.R[base + s2];
      M[s][s2] = (s === s2 ? 1 : 0) - gamma * t;
    }
    M[s][S] = r;
  }
  for (let c = 0; c < S; c++) {
    let piv = c;
    for (let r = c + 1; r < S; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    [M[c], M[piv]] = [M[piv], M[c]];
    for (let r = c + 1; r < S; r++) {
      const f = M[r][c] / M[c][c];
      if (f) for (let k = c; k <= S; k++) M[r][k] -= f * M[c][k];
    }
  }
  const v = new Float64Array(S);
  for (let r = S - 1; r >= 0; r--) {
    let x = M[r][S];
    for (let k = r + 1; k < S; k++) x -= M[r][k] * v[k];
    v[r] = x / M[r][r];
  }
  return v;
}

/* Q(s, a) = sum_s' T(s'|s,a) (R(s,a,s') + gamma V(s'))  (ARENA's einsum "s a s_next, s a s_next -> s a") */
function q_values(env, V, gamma = 0.99) {
  const S = env.num_states, A = env.num_actions, Q = new Float64Array(S * A);
  for (let s = 0; s < S; s++) for (let a = 0; a < A; a++) {
    const base = (s * A + a) * S;
    let q = 0;
    for (let s2 = 0; s2 < S; s2++) { const t = env.T[base + s2]; if (t) q += t * (env.R[base + s2] + gamma * V[s2]); }
    Q[s * A + a] = q;
  }
  return Q;
}
/* ties go to the first action, like np.argmax; values within 1e-12 count as tied, so float
   noise from the linear solve cannot flip a policy back and forth */
function argmax_first(Q, s, A) {
  let best = 0;
  for (let a = 1; a < A; a++) if (Q[s * A + a] > Q[s * A + best] + 1e-12) best = a;
  return best;
}
/* ARENA: pi_better = argmax_a Q(s, a) */
function policy_improvement(env, V, gamma = 0.99) {
  const Q = q_values(env, V, gamma), A = env.num_actions;
  return Int32Array.from({ length: env.num_states }, (_, s) => argmax_first(Q, s, A));
}
/* ARENA: policy iteration from pi = 0 (all "up"): evaluate exactly, improve, until stable */
function find_optimal_policy(env, gamma = 0.99, max_iterations = 10000) {
  let pi = new Int32Array(env.num_states);
  for (let i = 0; i < max_iterations; i++) {
    const V = policy_eval_exact(env, pi, gamma);
    const pi_new = policy_improvement(env, V, gamma);
    if (pi_new.every((a, s) => a === pi[s])) return { pi: pi_new, V, rounds: i + 1 };
    pi = pi_new;
  }
  return { pi, V: policy_eval_exact(env, pi, gamma), rounds: max_iterations };
}

/* One sweep of value iteration: the Bellman optimality operator from ARENA's proof,
   (BV)(s) = max_a sum_s' T(s'|s,a) (R(s,a,s') + gamma V(s')), applied to every state at once. */
function bellman_backup(env, V, gamma = 0.99) {
  const Q = q_values(env, V, gamma), A = env.num_actions, S = env.num_states;
  const out = new Float64Array(S);
  for (let s = 0; s < S; s++) { let m = -Infinity; for (let a = 0; a < A; a++) m = Math.max(m, Q[s * A + a]); out[s] = m; }
  return out;
}
function value_iteration(env, gamma = 0.99, tol = 1e-12, max_sweeps = 100000) {
  let V = new Float64Array(env.num_states), k = 0;
  for (; k < max_sweeps; k++) {
    const V2 = bellman_backup(env, V, gamma);
    let d = 0;
    for (let s = 0; s < V.length; s++) d = Math.max(d, Math.abs(V2[s] - V[s]));
    V = V2;
    if (d < tol) return { V, sweeps: k + 1 };
  }
  return { V, sweeps: k };
}

/* seeded rollout of a policy: the walk. Each step samples one outcome from dynamics. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function rollout(env, pi, gamma, seed, max_steps = 60) {
  const rand = mulberry32(seed), p = env.slipperiness, steps = [];
  let s = env.start, G = 0, disc = 1;
  for (let t = 0; t < max_steps; t++) {
    if (env.terminal.includes(s)) break;
    const a = pi[s];
    let d = a;
    if (p > 0) {
      const u = rand();
      if (u >= 1 - p) { const k = Math.min(2, Math.floor((u - (1 - p)) / (p / 3))); d = [0, 1, 2, 3].filter((x) => x !== a)[k]; }
    }
    const out = env.move(s, d);
    G += disc * out.r; disc *= gamma;
    steps.push({ s, a, d, s2: out.s2, r: out.r, kind: out.kind, over: out.over, slip: d !== a, G });
    s = out.s2;
  }
  return { steps, G };
}

/* the two boards */
const MAPS = {
  cliff: `
    ........
    ..#.....
    ..#.$...
    ..#.....
    ........
    SCCCCCCG`,
  norvig: `
    ...G
    .#.T
    S...`,
};
function makeBoard(board, { step_reward = -0.04, slipperiness = 0, coin = false } = {}) {
  if (board === 'norvig') return new GridWorld(MAPS.norvig, { step_reward, goal_reward: 1.0, trap_reward: -1.0, slipperiness });
  return new GridWorld(MAPS.cliff, { step_reward, goal_reward: 1.0, cliff_reward: -1.0, slipperiness, coin_reward: coin ? 0.1 : 0 });
}
// MATH-END

/* ============================================================ display setup */

const LAYOUT = {
  cliff: { P: 0.42, bead: 0.075, flagH: 0.5 },
  norvig: { P: 0.76, bead: 0.1, flagH: 0.62 },
};
const CAP = 0.04;                             // coloured cap on each column
const K0 = 0.95, Y0 = 0.45, TOP = 1.45, BOT = 0.07;   // default: height = 0.45 + 0.95 V (world units)
const PLASTER_CAP = new THREE.Color('#efe8dc'), GREEN = new THREE.Color(C.good), RED = new THREE.Color(C.grad);
const ARW = ['↑', '→', '↓', '←'];
const PHI = [Math.PI / 2, 0, -Math.PI / 2, Math.PI];   // yaw that turns +x into each action's direction
const G99 = 0.99;
const fx = (v, d = 2) => { const s = (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d); return s.replace('-', '−'); };

const CAM = {
  hero: { pos: [-1.9, 5.6, 7.2], target: [0.1, 0.55, 0.1] },
  low: { pos: [-3.4, 3.6, 6.8], target: [0.1, 0.6, 0.1] },
  side: { pos: [-2.9, 4.3, 7.2], target: [0.1, 0.6, 0.1] },
  high: { pos: [-1.2, 7.4, 5.2], target: [0.1, 0.45, 0.15] },
  norvig: { pos: [-2.0, 5.6, 7.0], target: [0.1, 0.55, 0.1] },
  wide: { pos: [-0.9, 6.3, 6.9], target: [0.1, 0.5, 0.1] },
};

/* ---------------------------------------------------------------- geometry */
function arrowGeometry(len, w) {
  const s = new THREE.Shape(), hw = w * 0.3, head = len * 0.46, hh = w * 0.62;
  s.moveTo(-len / 2, -hw); s.lineTo(len / 2 - head, -hw); s.lineTo(len / 2 - head, -hh); s.lineTo(len / 2, 0);
  s.lineTo(len / 2 - head, hh); s.lineTo(len / 2 - head, hw); s.lineTo(-len / 2, hw); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.016, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  return g;
}
function flagMesh(color, h) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, h, 8).translate(0, h / 2, 0), K.mat.brass());
  pole.castShadow = true;
  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.lineTo(0.2, -0.055); shape.lineTo(0, -0.11); shape.closePath();
  const cloth = new THREE.Mesh(new THREE.ShapeGeometry(shape), K.mat.paint(color));
  cloth.material.side = THREE.DoubleSide;
  cloth.position.set(0.005, h - 0.005, 0);
  cloth.castShadow = true;
  const tip = new THREE.Object3D(); tip.position.set(0.05, h + 0.02, 0);
  g.add(pole, cloth, tip);
  g.userData.tip = tip;
  return g;
}

/* ------------------------------------------------------------ board layout */
function cellXZ(st, s) {
  const { W, H } = st.env, P = st.L.P, r = Math.floor(s / W), c = s % W;
  return [(c - (W - 1) / 2) * P, (r - (H - 1) / 2) * P];
}
const isLive = (env, s) => '.S$'.includes(env.cells[s]);
const niceDown = (x) => { const e = 10 ** Math.floor(Math.log10(x)); for (const m of [10, 8, 5, 4, 2.5, 2, 1]) if (m * e <= x + 1e-12) return m * e; return e; };
function chooseScale(env, V) {
  let lo = 0, hi = 0;
  for (let s = 0; s < env.num_states; s++) if (isLive(env, s)) { lo = Math.min(lo, V[s]); hi = Math.max(hi, V[s]); }
  if (Y0 + K0 * lo >= BOT - 1e-9 && Y0 + K0 * hi <= TOP + 1e-9) return { k: K0, y0: Y0, lo, hi };
  const k = niceDown((TOP - BOT) / (hi - lo));
  return { k, y0: BOT - k * lo, lo, hi };
}
const disp = (st, v) => Math.max(0.03, st.scale.y0 + st.scale.k * v);

/* the solved board for the current knobs */
function solve(S) {
  const st = S.state, k = S.knobs;
  st.env = makeBoard(k.board, { step_reward: k.step, slipperiness: k.slip, coin: k.coin && k.board === 'cliff' });
  st.L = LAYOUT[k.board];
  st.gamma = k.gamma;
  const res = find_optimal_policy(st.env, k.gamma);
  st.Vstar = res.V; st.piStar = res.pi; st.rounds = res.rounds;
  st.scale = chooseScale(st.env, st.Vstar);
}

/* greedy policy + ties on whatever values are shown */
function greedyOn(st, V) {
  const env = st.env, A = 4, Q = q_values(env, V, st.gamma), pi = new Int32Array(env.num_states), tie = new Uint8Array(env.num_states);
  for (let s = 0; s < env.num_states; s++) {
    pi[s] = argmax_first(Q, s, A);
    let m = -Infinity, n = 0;
    for (let a = 0; a < A; a++) m = Math.max(m, Q[s * A + a]);
    for (let a = 0; a < A; a++) if (Q[s * A + a] >= m - 1e-9) n++;
    tie[s] = n === 4 ? 1 : 0;
  }
  return { Q, pi, tie };
}

/* ------------------------------------------------------- scene construction */
const _o = new THREE.Object3D(), _c = new THREE.Color();
function inst(S, geo, mat, n, shadow = true) {
  const m = new THREE.InstancedMesh(geo, mat, n);
  m.castShadow = shadow; m.receiveShadow = true; m.frustumCulled = false; m.userData.noFit = true;
  m.count = 0; S.root.add(m); return m;
}

function buildBoard(S) {
  const st = S.state, env = st.env, L = st.L, P = L.P, N = env.num_states;
  // columns + caps (one instance per live square, goal and trap included)
  st.tileStates = [];
  for (let s = 0; s < N; s++) if ('.S$GT'.includes(env.cells[s])) st.tileStates.push(s);
  st.inst = new Int32Array(N).fill(-1);
  st.tileStates.forEach((s, i) => { st.inst[s] = i; });
  for (const m of [st.cols, st.caps, st.arrows, st.dots, st.walls, st.wallCaps, st.pits]) m.count = 0;
  st.cols.geometry.dispose(); st.caps.geometry.dispose(); st.arrows.geometry.dispose(); st.dots.geometry.dispose();
  st.cols.geometry = new THREE.BoxGeometry(P * 0.9, 1, P * 0.9).translate(0, 0.5, 0);
  st.caps.geometry = new THREE.RoundedBoxGeometry(P * 0.93, CAP, P * 0.93, 2, 0.012).translate(0, CAP / 2, 0);
  st.arrows.geometry = arrowGeometry(P * 0.6, P * 0.46);
  st.dots.geometry = new THREE.CylinderGeometry(P * 0.075, P * 0.075, 0.014, 16).translate(0, 0.007, 0);
  st.cols.count = st.caps.count = st.tileStates.length;
  // walls and the cliff's drop
  const walls = [], pits = [];
  for (let s = 0; s < N; s++) { if (env.cells[s] === '#') walls.push(s); if (env.cells[s] === 'C') pits.push(s); }
  st.wallStates = walls; st.pitStates = pits;
  st.walls.geometry.dispose(); st.wallCaps.geometry.dispose(); st.pits.geometry.dispose();
  st.walls.geometry = new THREE.BoxGeometry(P * 0.96, 1, P * 0.96).translate(0, 0.5, 0);
  st.wallCaps.geometry = new THREE.BoxGeometry(P * 0.99, 0.022, P * 0.99).translate(0, 0.011, 0);
  st.pits.geometry = new THREE.BoxGeometry(P * 0.99, 0.018, P * 0.99).translate(0, 0.009, 0);
  st.walls.count = st.wallCaps.count = walls.length;
  st.pits.count = pits.length;
  pits.forEach((s, i) => { const [x, z] = cellXZ(st, s); _o.position.set(x, 0, z); _o.rotation.set(0, 0, 0); _o.scale.set(1, 1, 1); _o.updateMatrix(); st.pits.setMatrixAt(i, _o.matrix); });
  st.pits.instanceMatrix.needsUpdate = true;
  // flags, ring, coin, bead size
  const goal = env.cells.indexOf('G'), trap = env.cells.indexOf('T');
  S.root.remove(st.flag); S.root.remove(st.trapFlag);
  st.flag = flagMesh(C.good, L.flagH); S.root.add(st.flag);
  st.trapFlag = flagMesh(C.grad, L.flagH * 0.8); S.root.add(st.trapFlag);
  st.trapFlag.visible = trap >= 0;
  st.goalS = goal; st.trapS = trap;
  st.ring.scale.setScalar(P / 0.42);
  st.bead.scale.setScalar(L.bead);
  st.coinS = env.cells.indexOf('$');
  st.flagTag.move(st.flag.userData.tip);
  st.trapTag.move(st.trapFlag.userData.tip);
  // the cliff tag sits in front of the middle of the drop
  if (pits.length) { const [x0, z0] = cellXZ(st, pits[0]), [x1] = cellXZ(st, pits[pits.length - 1]); st.cliffAt.position.set((x0 + x1) / 2, 0.02, z0 + P * 0.52); }
  // ruler: back-left corner, just off the board
  st.ruler.position.set(-(env.W / 2) * P - 0.2, 0, -(env.H / 2) * P + 0.12);
  // figure spot: left of the board
  st.figAt = [-(env.W / 2) * P - 0.3, 0, 0.62 * (env.H / 2) * P];
  st.boardKey = S.knobs.board;
  // framing proxy: the board and its tallest possible column
  st.proxy.scale.set(env.W * P, TOP + 0.45, env.H * P);
  st.proxy.position.set(0, (TOP + 0.45) / 2, 0);
}

/* a wall stands a little above the columns around it */
function wallHeight(st, s, h) {
  const { W, H } = st.env, r = Math.floor(s / W), c = s % W;
  let m = 0.3;

/* place every per-square thing at the heights in st.hNow (display units, from values) */

    _o.position.set(x, h, z); _o.scale.set(1, 1, 1); _o.updateMatrix(); st.caps.setMatrixAt(i, _o.matrix);

function capColors(S, V) {
  const st = S.state, env = st.env;
  let m = 1;
  for (let s = 0; s < env.num_states; s++) if (isLive(env, s)) m = Math.max(m, Math.abs(st.Vstar[s]));
  st.capCol = [];
  for (let s = 0; s < env.num_states; s++) {
    const ch = env.cells[s];
    if (ch === 'G') { st.capCol[s] = GREEN.clone().lerp(PLASTER_CAP, 0.35); continue; }
    if (ch === 'T') { st.capCol[s] = RED.clone().lerp(PLASTER_CAP, 0.3); continue; }
    const t = Math.max(-1, Math.min(1, V[s] / m));
    st.capCol[s] = PLASTER_CAP.clone().lerp(t >= 0 ? GREEN : RED, 0.12 + 0.8 * Math.abs(t) ** 0.85);

/* ------------------------------------------------------------------ ruler */
function buildRuler(S) {
  const st = S.state, g = new THREE.Group();

  st.rulerRod.castShadow = true;
  g.add(st.rulerRod);
  st.ticks = [];
  const tg = new THREE.CylinderGeometry(0.006, 0.006, 0.12, 6).rotateZ(Math.PI / 2).translate(0.05, 0, 0);
  for (let i = 0; i < 12; i++) { const m = new THREE.Mesh(tg, K.mat.brass()); m.visible = false; g.add(m); st.ticks.push(m); }
  st.tickTags = [0, 1, 2].map(() => K.label([0, 0, 0], '', { cls: 'tag rule', anchor: 'right', dx: -6, dy: 0 }));
  st.ruler = g;

}
function placeRuler(S) {

  let step = 0.1;
  for (const s of [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10]) { step = s; if (sc.k * s >= 0.3) break; }
  const ys = (v) => sc.y0 + sc.k * v;

  let i1 = Math.ceil(span[1] / step - 1e-9);
  while (i1 > i0 && ys(i1 * step) > TOP + 0.06) i1--;
  const vals = [];
  for (let i = i0; i <= i1; i++) vals.push(i * step);
  const lo = Math.max(0.02, ys(vals[0] ?? 0)), hi = ys(vals[vals.length - 1] ?? 1);
  st.rulerRod.scale.y = Math.max(0.05, hi + 0.04);
  st.ticks.forEach((m, i) => {
    m.visible = i < vals.length && st.rulerOn;
    if (m.visible) m.position.y = ys(vals[i]);
  });
  st.ruler.visible = st.rulerOn;
  // labels: the top value, zero, the bottom value (if below zero)
  const pick = [vals[vals.length - 1], 0, vals[0] < 0 ? vals[0] : null];
  st.tickTags.forEach((L, i) => {
    const v = pick[i];
    const show = st.rulerOn && v != null && !(i === 0 && Math.abs(v) < 1e-9) && ys(v) > 0.02;
    L.show(show);
    if (!show) return;
    L.move(new THREE.Vector3(st.ruler.position.x, ys(v), st.ruler.position.z));
    const dg = step < 1 ? (step < 0.5 ? 2 : 1) : 0;

}

/* ------------------------------------------------------------- the bead */

  const st = S.state;
  const s = st.beadS ?? st.env.start;
  if (!st.hNow || s >= st.hNow.length) return;

  st.bead.visible = st.beadOn;

/* ------------------------------------------------------------ show values */
function setValues(S, V, { tween = true, keepScale = false } = {}) {
  const st = S.state, env = st.env;

  if (!keepScale) st.shownScale = st.scale;
  const to = new Float64Array(env.num_states);
  for (let s = 0; s < env.num_states; s++) to[s] = '.S$GT'.includes(env.cells[s]) ? disp(st, V[s]) : 0;
  st.greedy = greedyOn(st, st.Vshow);
  capColors(S, st.Vshow);
  if (!st.hNow || st.hNow.length !== env.num_states || !tween || S.shot) {
    st.hNow = to; st.hTween = null; place(S); readout(S); S.invalidate(); return;
  }

}
function stepHeights(S, t) {

/* ----------------------------------------------------------- readouts */
function qLine(st, s) {
  const Q = st.greedy.Q, parts = [];
  for (let a = 0; a < 4; a++) parts.push(`${ARW[a]}${fx(Q[s * 4 + a], 2)}`);
  return parts.join('  ');
}

  R.show(true);
  const v = st.Vshow[s], T = S.tier;
  const name = s === env.start ? (T === 1 ? 'the start' : 'start') : env.cells[s] === '$' && env.coin_reward ? 'coin square' : `square ${s}`;
  if (env.cells[s] === 'G' || env.cells[s] === 'T') {
    const g = env.cells[s] === 'G';
    R.set(T === 1 ? `**${g ? 'The flag' : 'The trap'}: worth 0**\ngame over here; the ${g ? '+1' : '−1'} was paid\non the step in`
      : T === 2 ? `**V(${g ? 'flag' : 'trap'}) = 0**\nterminal: no reward after this;\nthe ${g ? '+1' : '−1'} is paid on the way in`
        : `**V(s) = 0** (terminal, T(s|s,·) = 1, R = 0)\nR(s′, a, ${g ? 'G' : 'T'}) = ${g ? '+1' : '−1'} on entry`);

  else if (T === 2) R.set(`**V(${name}) = ${fx(v, 3)}**\nQ: ${qLine(st, s)}`);

function note(S, text) {

  st.noteText = text;

  st.note.show(true);

/* ------------------------------------------------------------ Bellman sweeps */
function startSweeps(S, { from = 'zero', upTo = Infinity, auto = true } = {}) {
  const st = S.state, env = st.env;
  stopWalk(S);
  if (from === 'zero' || st.sweepK == null) { st.sweepK = 0; setValues(S, new Float64Array(env.num_states), { tween: 360, keepScale: true }); }
  st.lastDelta = null;

  sweepNote(S);
  if (S.shot && auto) { while (st.sweepK < upTo && !sweepOnce(S, true)); setValues(S, st.Vshow, { tween: false, keepScale: true }); st.sweep.running = false; sweepNote(S); }
  S.invalidate();
}

  for (let s = 0; s < V2.length; s++) d = Math.max(d, Math.abs(V2[s] - st.Vshow[s]));
  st.sweepK++; st.lastDelta = d;

}

  if (sw.tLast == null) sw.tLast = t;
  const gap = st.sweepK < 14 ? 0.42 : 0.1;
  if (t - sw.tLast < gap) return true;
  sw.tLast = t;
  const done = sweepOnce(S);
  sweepNote(S);
  if (done || st.sweepK >= sw.upTo) { sw.running = false; return !!st.hTween; }
  return true;
}

    const T = S.tier;

/* ------------------------------------------------------------------ walks */
function startWalk(S, seed) {

  const ro = rollout(env, pi, st.gamma, seed, loopy ? 26 : 60);
  st.walk = { ro, i: 0, t0: null, running: true, pts: [tileTop(st, env.start)], seed };
  st.beadS = env.start; st.beadOn = true; placeBead(S);
  st.trail.set([]);

}

const HOP = 0.3;
function stepWalk(S, t) {

/* --------------------------------------------------------- scene per beat */
function scene(S, o = {}) {

  st.sel = o.sel === 'start' ? st.env.start : o.sel === 'goal' ? st.goalS : o.sel === 'coin' ? st.coinS : o.sel === 'nb' ? st.goalS - st.env.W : o.sel ?? -1;
  st.rulerOn = o.ruler ?? true;
  st.showArrows = !!o.arrows;
  st.beadOn = o.bead ?? true;
  st.startTag.show(o.tags !== false);
  st.flagTag.show(o.tags !== false);
  st.cliffTag.show(o.tags !== false && st.pitStates.length > 0);
  st.trapTag.show(o.tags !== false && st.trapS >= 0);
  st.coinTag.show(o.tags !== false && st.coin.visible);
  if (o.figure) {

    st.fig.place(st.figAt, o.face || [0, 0.5, 0]);

  setup(S) {

    st.caps = inst(S, new THREE.BoxGeometry(1, 1, 1), K.mat.paint('#ffffff'), 64);

    st.startTag = K.label(st.ring, { 1: 'start', 2: 'start', 3: 'S (start)' }, { cls: 'tag rw', anchor: 'top', dy: 12 });

    st.trapTag = K.label([0, 0, 0], { 1: '−1 trap', 2: 'trap −1', 3: 'T: −1' }, { cls: 'tag rw bad', anchor: 'bottom', dy: -4 });
    st.cliffTag = K.label(st.cliffAt, { 1: 'cliff: −1, back to start', 2: 'cliff −1 → back to start', 3: 'C: cliff_reward −1, → S' }, { cls: 'tag rw bad', anchor: 'top', dy: 6 });
    st.coinTag = K.label(st.coin, { 1: 'coin +0.1, comes back', 2: '+0.1, respawns', 3: '$: +0.1 per entry' }, { cls: 'tag rw coin', anchor: 'bottom', dy: -14 });

    st.note = K.label(new THREE.Vector3(0.2, 1.95, -1.1), '', { cls: 'note', anchor: 'bottom', dy: -4 });
    st.note.show(false); st.readout.show(false);
    st.fig = K.figure();
    S.root.add(st.fig.group);
    st.fig.group.visible = false;
    // tap a square to read its value
    const tap = (hit) => { if (hit.instanceId == null) return; const s = S.state.tileStates[hit.instanceId]; if (s == null) return;
      S.state.sel = s; S.state.selAt.position.copy(tileTop(S.state, s)).setY(S.state.hNow[s] + CAP + 0.02); readout(S); S.invalidate(); };
    K.pick(st.caps, tap); K.pick(st.cols, tap);
  },

  rebuild(S, id) {
    const st = S.state, ch = new Set(S.changed || [id]);
    if (id === 'arrows') { st.showArrows = S.knobs.arrows; place(S); S.invalidate(); return; }
    const boardChanged = !st.env || st.boardKey !== S.knobs.board;
    if (st.walk) stopWalk(S);
    solve(S);
    if (boardChanged) { st.hNow = null; buildBoard(S); }
    st.sweep = null; st.sweepK = null;
    st.beadS = st.env.start;
    if (ch.has('arrows') || id === '*') st.showArrows = S.knobs.arrows;
    if (st.sel >= 0 && !'.S$GT'.includes(st.env.cells[st.sel] || '#')) st.sel = -1;
    setValues(S, st.Vstar, { tween: id === '*' ? 420 : true });
    if (id !== '*') {
      note(S, null);
      st.coinTag.show(st.coin.visible);
      st.trapTag.show(st.trapS >= 0);
      st.cliffTag.show(st.pitStates.length > 0);
    }
    if (boardChanged && !S.first) S.stage.refit();
  },

  frame(S, t) {
    let busy = false;
    busy = stepHeights(S, t) || busy;
    busy = stepSweep(S, t) || busy;
    busy = stepWalk(S, t) || busy;
    return busy;
  },

  onTier(S) { readout(S); if (S.state.noteText) note(S, S.state.noteText); place(S); },

  solids(S) {
    const st = S.state, env = st.env, P = st.L.P, out = [];
    const W = env.W * P + 0.16, D = env.H * P + 0.16;
    out.push(J.primitives.cuboid({ size: [W, D, 0.06], center: [0, 0, -0.03] }));
    for (const s of st.tileStates) {
      const [x, z] = cellXZ(st, s), h = disp(st, st.Vstar[s]) + CAP;
      out.push(J.primitives.cuboid({ size: [P * 0.9, P * 0.9, h], center: [x, -z, h / 2] }));
      if (isLive(env, s) && !st.greedy.tie[s]) {
        const a = st.greedy.pi[s], L = P * 0.34;
        const tri = J.primitives.polygon({ points: [[L, 0], [-L * 0.6, L * 0.55], [-L * 0.6, -L * 0.55]] });
        let g = J.extrusions.extrudeLinear({ height: 0.02 }, tri);
        g = J.transforms.rotateZ(PHI[a], g);
        out.push(J.transforms.translate([x, -z, h - 0.001], g));
      }
    }
    const hs = new Float64Array(env.num_states);
    for (const s of st.tileStates) hs[s] = disp(st, st.Vstar[s]);
    for (const s of st.wallStates) { const [x, z] = cellXZ(st, s), wallH = wallHeight(st, s, hs); out.push(J.primitives.cuboid({ size: [P * 0.96, P * 0.96, wallH], center: [x, -z, wallH / 2] })); }
    return out;
  },
