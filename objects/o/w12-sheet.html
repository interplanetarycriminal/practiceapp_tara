<body>
<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   24 · w12-sheet: "One thin sheet" (W12 capstone, ARENA [4.1] + [2.4] LoRA)
   Every sheet, fin, bar and number is computed below: ΔW = (lora_alpha/r)·B·A,
   its singular values (Jacobi SVD), the best rank-r copy of a toy full-rank
   change (Eckart–Young), parameter counts at toy and real sizes (ARENA's
   printed 170,496 / 137,625,600 are reproduced from Qwen2.5-14B's shapes), and
   a d = 3 room where inputs move by (α/r)·b·(a·x). The MATH block is extracted
   and checked in node against independent computations (see LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
/* ---- tiny linear algebra (plain arrays; d is 12 or 3, so no typed arrays needed) ---- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rnd) { let u = 0; while (u === 0) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); }
const zeros = (n, m) => Array.from({ length: n }, () => new Array(m).fill(0));
const dot = (x, y) => { let s = 0; for (let i = 0; i < x.length; i++) s += x[i] * y[i]; return s; };
const norm = (x) => Math.sqrt(dot(x, x));
function matmul(X, Y) {                                   // (n x k) @ (k x m)
  const n = X.length, k = Y.length, m = Y[0].length, Z = zeros(n, m);
  for (let i = 0; i < n; i++) for (let p = 0; p < k; p++) { const x = X[i][p]; for (let j = 0; j < m; j++) Z[i][j] += x * Y[p][j]; }
  return Z;
}
const matvec = (M, x) => M.map((row) => dot(row, x));
const frob = (M) => Math.sqrt(M.reduce((s, row) => s + dot(row, row), 0));
const msub = (X, Y) => X.map((row, i) => row.map((x, j) => x - Y[i][j]));
const mscale = (X, c) => X.map((row) => row.map((x) => x * c));
function gramSchmidt(vs) {
  const out = [];
  for (const v0 of vs) {
    let v = v0.slice();
    for (let pass = 0; pass < 2; pass++) for (const q of out) { const c = dot(v, q); v = v.map((x, i) => x - c * q[i]); }
    const n = norm(v); out.push(v.map((x) => x / n));
  }
  return out;
}

/* ---- the slab: d = 12 shown ---- */
const D = 12;
/* smooth orthonormal directions (slow waves first) so a sheet reads as a sheet, not noise */
function smoothBasis(d, rnd) {
  const vs = [];
  for (let k = 0; k < d; k++) {
    const f = 0.8 + k + 0.4 * rnd(), ph = 2 * Math.PI * rnd();
    vs.push(Array.from({ length: d }, (_, i) => Math.cos((Math.PI * f * (i + 0.5)) / d + ph) + 0.05 * gauss(rnd)));
  }
  return gramSchmidt(vs);
}
/* TOY "full fine-tune" change ΔW* = Σ_k σ_k u_k v_kᵀ: full rank (all 12 σ > 0), but most of it in a
   few directions, as Hu et al. 2021 argue real fine-tuning updates are ("low intrinsic rank"). */
const SIGMA = [2.6, 1.5, 0.95, 0.62, 0.42, 0.3, 0.22, 0.16, 0.12, 0.09, 0.07, 0.05];
function makeTarget(seed = 41) {
  const rnd = mulberry32(seed);
  const U = smoothBasis(D, rnd), V = smoothBasis(D, rnd);          // U[k] = u_k (output side), V[k] = v_k (input side)
  const T = zeros(D, D);
  for (let k = 0; k < D; k++) for (let i = 0; i < D; i++) for (let j = 0; j < D; j++) T[i][j] += SIGMA[k] * U[k][i] * V[k][j];
  return { U, V, sigma: SIGMA.slice(), T };
}
/* TOY trained factors. They were "fitted" at lora_alpha / r = 8, ARENA's Lora defaults (rank 4,
   lora_alpha 32): b_k = √(σ_k/8)·u_k, a_k = √(σ_k/8)·v_k, so at α/r = 8 the sheet is the best
   rank-r copy of ΔW*. Any other α just turns the finished adapter up or down. */
const FIT_SCALE = 8;
function loraFactors(tg, r) {                                        // B: d x r (columns b_k), A: r x d (rows a_k)
  const B = zeros(D, r), A = zeros(r, D);
  for (let k = 0; k < r; k++) {
    const c = Math.sqrt(tg.sigma[k] / FIT_SCALE);
    for (let i = 0; i < D; i++) { B[i][k] = c * tg.U[k][i]; A[k][i] = c * tg.V[k][i]; }
  }
  return { B, A };
}
/* step 0 of training, as peft and ARENA's Lora initialise it: A ~ kaiming_uniform_(a=√5) = U(±1/√d_in), B = 0 */
function initFactors(r, seed = 7) {
  const rnd = mulberry32(seed), bound = 1 / Math.sqrt(D);
  const A = Array.from({ length: r }, () => Array.from({ length: D }, () => (2 * rnd() - 1) * bound));
  return { B: zeros(D, r), A };
}
const scaling = (lora_alpha, r) => lora_alpha / r;                  // peft: self.scaling = lora_alpha / r
function deltaW(B, A, lora_alpha, r) { return mscale(matmul(B, A), scaling(lora_alpha, r)); }   // ΔW = (α/r)·B·A
/* sheet k: column k of B times row k of A ('i, j -> i j'), times the same α/r */
function sheetK(B, A, lora_alpha, r, k) { const s = scaling(lora_alpha, r); return B.map((row) => A[k].map((a) => s * row[k] * a)); }

/* one-sided Jacobi SVD (Hestenes): M = U diag(S) Vᵀ, S sorted descending. U[k], V[k] = k-th vectors. */
function svd(M) {
  const n = M.length, m = M[0].length;
  const Ac = Array.from({ length: m }, (_, j) => M.map((row) => row[j]));
  const Vc = Array.from({ length: m }, (_, j) => Array.from({ length: m }, (_, i) => (i === j ? 1 : 0)));
  for (let sweep = 0; sweep < 80; sweep++) {
    let off = 0;
    for (let p = 0; p < m - 1; p++) for (let q = p + 1; q < m; q++) {
      const ap = Ac[p], aq = Ac[q];
      const al = dot(ap, ap), be = dot(aq, aq), ga = dot(ap, aq);
      if (ga === 0 || Math.abs(ga) <= 1e-15 * Math.sqrt(al * be)) continue;
      off = Math.max(off, Math.abs(ga) / Math.sqrt(al * be));
      const zeta = (be - al) / (2 * ga);
      const t = (zeta >= 0 ? 1 : -1) / (Math.abs(zeta) + Math.sqrt(1 + zeta * zeta));
      const c = 1 / Math.sqrt(1 + t * t), s = c * t;
      for (let i = 0; i < n; i++) { const x = ap[i], y = aq[i]; ap[i] = c * x - s * y; aq[i] = s * x + c * y; }
      const vp = Vc[p], vq = Vc[q];
      for (let i = 0; i < m; i++) { const x = vp[i], y = vq[i]; vp[i] = c * x - s * y; vq[i] = s * x + c * y; }
    }
    if (off < 1e-15) break;
  }
  const S0 = Ac.map(norm);
  const order = S0.map((_, i) => i).sort((i, j) => S0[j] - S0[i]);
  return { S: order.map((i) => S0[i]), U: order.map((i) => Ac[i].map((x) => (S0[i] > 0 ? x / S0[i] : 0))), V: order.map((i) => Vc[i]) };
}
const RANK_TOL = 1e-10;                                              // σ below 1e-10·σ₁ counts as zero
const numericRank = (S) => S.filter((s) => s > RANK_TOL * (S[0] || 1)).length;
/* Eckart–Young: the best rank-r copy of T keeps its top r singular pairs; nothing of rank r is closer */
function bestRankR(T, r) {
  const { U, S, V } = svd(T), M = zeros(T.length, T[0].length);
  for (let k = 0; k < r; k++) for (let i = 0; i < M.length; i++) for (let j = 0; j < M[0].length; j++) M[i][j] += S[k] * U[k][i] * V[k][j];
  return M;
}
const relErr = (T, M) => frob(msub(T, M)) / frob(T);
function eckartYoung(S, r) { let tot = 0, tail = 0; S.forEach((s, k) => { tot += s * s; if (k >= r) tail += s * s; }); return Math.sqrt(tail / tot); }

/* parameter counts: W is (d_out, d_in); LoRA trains A (r, d_in) and B (d_out, r) */
const fullParams = (d_in, d_out) => d_in * d_out;
const loraParams = (d_in, d_out, r) => r * (d_in + d_out);
/* ARENA [4.1]'s organisms sit on Qwen2.5-14B: d_model 5120, MLP 13824, 48 layers, k/v width 8 heads x 128 */
const QWEN14 = { d_model: 5120, d_mlp: 13824, n_layers: 48, d_kv: 1024 };
const R1_3_3_3_LAYERS = [15, 16, 17, 21, 22, 23, 27, 28, 29];
function organismParams(which) {
  const q = QWEN14;
  if (which === 'rank1') return R1_3_3_3_LAYERS.length * loraParams(q.d_mlp, q.d_model, 1);   // down_proj only: A (1, 13824), B (5120, 1)
  const mods = [[q.d_model, q.d_model], [q.d_model, q.d_kv], [q.d_model, q.d_kv], [q.d_model, q.d_model],   // q k v o
    [q.d_model, q.d_mlp], [q.d_model, q.d_mlp], [q.d_mlp, q.d_model]];                                 // gate up down
  return q.n_layers * mods.reduce((s, [i, o]) => s + loraParams(i, o, 32), 0);                         // rank 32 everywhere
}

/* ---- the effect room: the same maths at d = 3 (toy), W = identity so each input moves by ΔW·x ---- */
const E3 = {
  a: [[0.27, 0, 0.1], [-0.07, 0.08, 0.24], [0.05, -0.22, 0.06]],       // rows of A3: what each sheet reads
  b: [[0.03, 0.3, -0.05], [0.24, 0.02, 0.06], [-0.03, 0.07, 0.22]],     // columns of B3: where each sheet writes
};
function effectFactors(r) {
  const rnd = mulberry32(303);
  const B = zeros(3, r), A = zeros(r, 3);
  for (let k = 0; k < r; k++) {
    const a = k < 3 ? E3.a[k] : [0, 1, 2].map(() => 0.1 * gauss(rnd)), b = k < 3 ? E3.b[k] : [0, 1, 2].map(() => 0.1 * gauss(rnd));
    for (let i = 0; i < 3; i++) { A[k][i] = a[i]; B[i][k] = b[i]; }
  }
  return { B, A };
}
/* inputs: a 3 x 3 x 3 lattice (spacing 0.6). a₁ has no y part, so the middle column (0, y, 0) lies on
   sheet 1's blind plane a₁·x = 0: the hinge the lattice tilts about. */
const LAT = [-0.6, 0, 0.6];
function effectInputs() {
  const pts = [];
  for (const x of LAT) for (const y of LAT) for (const z of LAT) pts.push([x, y, z]);
  return pts;
}
const LATTICE_EDGES = (() => {                       // neighbour pairs, for drawing the lattice
  const e = [], id = (i, j, k) => 9 * i + 3 * j + k;
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) for (let k = 0; k < 3; k++) {
    if (i < 2) e.push([id(i, j, k), id(i + 1, j, k)]);
    if (j < 2) e.push([id(i, j, k), id(i, j + 1, k)]);
    if (k < 2) e.push([id(i, j, k), id(i, j, k + 1)]);
  }
  return e;
})();
const PLANE_POINT = 9 * 1 + 3 * 2 + 1;              // (0, 0.6, 0): on the blind plane of sheet 1
function effectMove(x, B, A, lora_alpha, r) {        // y = W x + ΔW x with W = I
  const s = scaling(lora_alpha, r), ax = A.map((row) => dot(row, x));   // ax[k] = a_k · x: what sheet k reads
  return x.map((xi, i) => xi + s * B[i].reduce((acc, bik, k) => acc + bik * ax[k], 0));
}
const MATH = { mulberry32, gauss, zeros, dot, norm, matmul, matvec, frob, msub, mscale, gramSchmidt, D, SIGMA, makeTarget,
  FIT_SCALE, loraFactors, initFactors, scaling, deltaW, sheetK, svd, RANK_TOL, numericRank, bestRankR, relErr, eckartYoung,
  fullParams, loraParams, QWEN14, R1_3_3_3_LAYERS, organismParams, E3, effectFactors, effectInputs, LAT, LATTICE_EDGES, PLANE_POINT, effectMove };
// MATH-END

/* ============================================================ display setup */

const TG = makeTarget();                            // the toy full fine-tune ΔW* (teal)
const TSVD = svd(TG.T);                             // its spectrum, computed here (not copied from SIGMA)
const TMAX = Math.max(...TG.T.map((row) => Math.max(...row.map(Math.abs))));
const RMAX = 12;
const CS = 0.19, HALF = (CS * D) / 2;              // cell size and half-width of the 12 x 12 slab
const OX = 0.22, OZ = 0.22;                         // slab centre: room for the B fins (left) and the A fins (behind)
const SLAB_H = 0.2, Y_S = 0.8, LIFT = 0.7;          // slab height, the sheet's zero level, lift of a pulled-out sheet
const KH = 0.6 / TMAX;                              // world height per unit of ΔW, fixed: α really scales the relief
const KF = 1.3;                                     // world height per unit of a B or A entry (the fins)
const KSIG = 0.2;                                   // world height per unit of singular value (the comb)
const cellX = (j) => OX - HALF + CS * (j + 0.5);    // input index j runs left -> right
const cellZ = (i) => OZ - HALF + CS * (i + 0.5);    // output index i runs back -> front
const squash = (h) => { const a = Math.abs(h); return a <= 1 ? h : Math.sign(h) * (1 + 0.4 * Math.tanh((a - 1) / 0.4)); };   // display only
const finGap = (r) => (r <= 4 ? 0.15 : Math.max(0.05, 0.62 / r));
const finX = (k, r) => OX - HALF - 0.15 - k * finGap(r);     // column k of B: a fin left of the slab
const finZ = (k, r) => OZ - HALF - 0.15 - k * finGap(r);     // row k of A: a fin behind it
const FX0 = cellX(0) - 0.025, FX1 = cellX(D - 1) + 0.025, FZ0 = cellZ(0) - 0.025, FZ1 = cellZ(D - 1) + 0.025;   // brass frame
const E0 = new THREE.Vector3(0.05, 1.3, 0.05);      // centre of the d = 3 effect room
const PALE = '#d6cdf3', READ = '#9d86e3';
const fmt = (v, d = 2) => K.fmt(v, d);
const fx = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d).replace('-', '−');
const int = (n) => Math.round(n).toLocaleString('en-US');
const pc = (x, d = 2) => `${(100 * x).toFixed(d)}%`;
const sub = (k) => String(k).split('').map((c) => '₀₁₂₃₄₅₆₇₈₉'[+c]).join('');
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* numbers quoted in captions, computed once from the MATH block */
const N = {
  full12: fullParams(D, D), lora12r4: loraParams(D, D, 4),
  full4096: fullParams(4096, 4096), lora4096r4: loraParams(4096, 4096, 4), lora4096r8: loraParams(4096, 4096, 8),
  org1: organismParams('rank1'), org32: organismParams('rank32'),
  down: fullParams(QWEN14.d_mlp, QWEN14.d_model), down1: loraParams(QWEN14.d_mlp, QWEN14.d_model, 1),
  ey2: eckartYoung(TSVD.S, 2), ey4: eckartYoung(TSVD.S, 4), rankT: numericRank(TSVD.S),
};

const CAM = {
  slab: { pos: [2.9, 4.4, 6.9], target: [0.2, 0.55, 0.3], fit: 1.3 },
  sheet: { pos: [-4.3, 5.9, 5.4], target: [-0.15, 0.62, 0.3], fit: 1.15 },
  table: { pos: [-3.2, 7.0, 5.2], target: [-0.1, 1.0, 0.1], fit: 1.1 },
  effect: { pos: [3.25, 2.4, 6.45], target: [0.35, 1.45, 0.05], fit: 1.3 },
  full: { pos: [2.5, 4.0, 7.1], target: [0.2, 0.62, 0.45], fit: 1.3 },
  fins: { pos: [-5.9, 5.2, 2.6], target: [-0.45, 0.7, 0.15], fit: 1.15 },
  em: { pos: [-3.3, 4.3, 6.6], target: [-0.1, 0.65, 0.25], fit: 1.25 },
  organism: { pos: [-4.8, 5.6, 4.6], target: [-0.25, 0.95, 0.1], fit: 1.1 },
  wide: { pos: [4.4, 5.6, 6.6], target: [0, 0.6, 0] },
};

/* ======================================================== geometry helpers */

const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 10, 1);
const smallBead = new THREE.SphereGeometry(1, 16, 12);
const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), P3 = new THREE.Vector3(), S3 = new THREE.Vector3(), UPV = new THREE.Vector3(0, 1, 0);
const COL = new THREE.Color();

function gridTexture(line) {            // grid lines through the 12 x 12 cell centres: the knots are the numbers
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = line; g.lineWidth = 3;
  for (let k = 0; k < D; k++) {
    const u = 2 + (508 * k) / (D - 1);
    g.beginPath(); g.moveTo(u, 0); g.lineTo(u, 512); g.stroke();
    g.beginPath(); g.moveTo(0, u); g.lineTo(512, u); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const SUB = 3, NV = (D - 1) * SUB + 1;              // sheet vertices: every cell centre + 2 in between
function sheetMesh(hex, line) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(NV * NV * 3), uv = new Float32Array(NV * NV * 2), idx = [];
  for (let a = 0; a < NV; a++) for (let b = 0; b < NV; b++) { const p = a * NV + b; uv[2 * p] = b / (NV - 1); uv[2 * p + 1] = 1 - a / (NV - 1); }
  for (let a = 0; a < NV - 1; a++) for (let b = 0; b < NV - 1; b++) { const p = a * NV + b; idx.push(p, p + NV, p + 1, p + 1, p + NV, p + NV + 1); }
  g.setIndex(idx);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  const m = new THREE.MeshStandardMaterial({ color: hex, roughness: 0.5, metalness: 0.02, side: THREE.DoubleSide, map: gridTexture(line) });
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
/* heights at the 144 knots are exact (KH·ΔW[i][j]); between knots the sheet is bilinear */
function setSheet(mesh, M, y0) {
  const pos = mesh.geometry.attributes.position.array;
  for (let a = 0; a < NV; a++) {
    const u = a / SUB, i0 = Math.min(D - 2, Math.floor(u)), fi = u - i0;
    for (let b = 0; b < NV; b++) {
      const w = b / SUB, j0 = Math.min(D - 2, Math.floor(w)), fj = w - j0;
      const h = (1 - fi) * ((1 - fj) * M[i0][j0] + fj * M[i0][j0 + 1]) + fi * ((1 - fj) * M[i0 + 1][j0] + fj * M[i0 + 1][j0 + 1]);
      const p = (a * NV + b) * 3;
      pos[p] = cellX(0) + (cellX(D - 1) - cellX(0)) * (b / (NV - 1));
      pos[p + 1] = y0 + squash(KH * h);
      pos[p + 2] = cellZ(0) + (cellZ(D - 1) - cellZ(0)) * (a / (NV - 1));
    }
  }
  mesh.geometry.attributes.position.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
  mesh.geometry.computeBoundingBox(); mesh.geometry.computeBoundingSphere();
}
function frameAt(y) {                  // brass outline of a sheet's zero level (the group moves, not the bars)
  const g = new THREE.Group(), mat = K.mat.brass(), t = 0.018, w = FX1 - FX0, dz = FZ1 - FZ0;
  for (const [x, z, sx, sz] of [[(FX0 + FX1) / 2, FZ0, w + t, t], [(FX0 + FX1) / 2, FZ1, w + t, t], [FX0, (FZ0 + FZ1) / 2, t, dz + t], [FX1, (FZ0 + FZ1) / 2, t, dz + t]]) {
    const m = new THREE.Mesh(unitBox, mat); m.scale.set(sx, t, sz); m.position.set(x, 0, z); m.castShadow = true; g.add(m);
  }
  g.position.y = y;
  return g;
}
function setInst(mesh, n, x, y, z, sx, sy, sz, hex) {
  M4.compose(P3.set(x, y, z), Q.identity(), S3.set(sx, sy, sz));
  mesh.setMatrixAt(n, M4);
  if (hex) mesh.setColorAt(n, COL.set(hex));
}
function setRod(mesh, n, a, b, r, hex) {     // a cylinder instance from a to b
  const d = P3.copy(b).sub(a), len = d.length();
  Q.setFromUnitVectors(UPV, len > 1e-9 ? d.normalize() : UPV);
  M4.compose(new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5), Q, S3.set(r, Math.max(len, 1e-4), r));
  mesh.setMatrixAt(n, M4);
  if (hex) mesh.setColorAt(n, COL.set(hex));
}
function inst(geo, mat, n, opt = {}) {
  const m = new THREE.InstancedMesh(geo, mat, n);
  m.castShadow = opt.shadow !== false; m.receiveShadow = true; m.count = 0; m.frustumCulled = false;   // instances move: skip stale bounds
  if (opt.color) { for (let k = 0; k < n; k++) m.setColorAt(k, COL.set(opt.color)); }
  return m;
}
/* the fins: every column of B and row of A is one ribbon (an area chart of its 12 entries), all in one mesh */
const FIN_V = 2 * RMAX * (D - 1) * 6, EDGE_V = 2 * RMAX * (D - 1) * 2;
function vertexBuffer(n, lines) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));

/* ============================================================ build (once) */

  const shackle = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.012, 8, 20, Math.PI), brass); shackle.position.y = 0.12;
  body.castShadow = shackle.castShadow = true;
  lock.add(body, shackle); lock.position.set(OX + HALF - 0.3, 0.02, OZ + HALF + 0.07); lock.scale.setScalar(1.1);
  st.slabG.add(lock);
  /* the sheet's zero level: a brass frame on four pins */
  st.frame = frameAt(Y_S); st.slabG.add(st.frame);
  for (const x of [FX0, FX1]) for (const z of [FZ0, FZ1]) {
    const pin = new THREE.Mesh(unitCyl, brass); pin.scale.set(0.011, Y_S - SLAB_H, 0.011); pin.position.set(x, (Y_S + SLAB_H) / 2, z); pin.castShadow = true;
    st.slabG.add(pin);
  }
  /* sheets: the LoRA sum (violet), one pulled-out sheet (violet), the full fine-tune (teal) */
  st.sheet = sheetMesh(C.dir, '#5f4d9e'); st.slabG.add(st.sheet);
  st.sheetHL = sheetMesh(C.dir, '#5f4d9e'); st.slabG.add(st.sheetHL);
  st.frameHL = frameAt(Y_S + LIFT); st.slabG.add(st.frameHL);
  st.sheetFT = sheetMesh(C.aux, '#176a6e'); st.slabG.add(st.sheetFT);
  K.pick(st.sheet, (hit) => tapCell(S, hit, 'sum'));
  K.pick(st.sheetHL, (hit) => tapCell(S, hit, 'hl'));
  K.pick(st.sheetFT, (hit) => tapCell(S, hit, 'ft'));
  /* fins: B's r columns stand left of the slab (entry i beside output row i), A's r rows behind it (entry j behind input j) */
  st.fins = vertexBuffer(FIN_V, false); st.finEdge = vertexBuffer(EDGE_V, true); st.slabG.add(st.fins, st.finEdge);
  st.rails = inst(unitBox, brass, 2 * RMAX + 4); st.posts = inst(unitCyl, brass, 4); st.slabG.add(st.rails, st.posts);
  /* the full-fine-tune target as 144 teal beads, and red rods for what the sheet misses */

  st.combRail.scale.set(FX1 - FX0 + 0.2, 0.02, 0.1); st.combRail.position.set(OX, 0.01, OZ + HALF + 0.3);
  st.combRail.castShadow = true; st.slabG.add(st.combRail);

  /* ---- the effect room (d = 3 toy, W = I): a 3 x 3 x 3 lattice of inputs and where ΔW sends them ---- */
  const E = new THREE.Group(); st.effG = E; root.add(E);
  const stand = new THREE.Mesh(unitCyl, brass); stand.scale.set(0.016, E0.y - 0.63, 0.016); stand.position.set(E0.x, (E0.y - 0.63) / 2, E0.z);
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.05, 32), brass); foot.position.set(E0.x, 0.025, E0.z);
  stand.castShadow = foot.castShadow = true;
  E.add(stand, foot);
  st.inputs = effectInputs();
  const nIn = st.inputs.length;
  st.inBeads = inst(smallBead, K.mat.paint(C.data), nIn); st.inBeads.count = nIn; E.add(st.inBeads);
  st.outBeads = inst(smallBead, K.mat.paint(C.dir), nIn); st.outBeads.count = nIn; E.add(st.outBeads);
  st.strings = inst(unitCyl, K.mat.paint(C.dir), nIn); st.strings.count = nIn; E.add(st.strings);
  for (let n = 0; n < nIn; n++) setInst(st.inBeads, n, E0.x + st.inputs[n][0], E0.y + st.inputs[n][1], E0.z + st.inputs[n][2], 0.05, 0.05, 0.05);
  st.inBeads.instanceMatrix.needsUpdate = true;
  K.pick(st.inBeads, (hit) => { if (hit.instanceId != null) { st.focus = hit.instanceId; drawEffect(S); note(S); S.invalidate(); } });
  const lattice = (hex, op) => {
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(LATTICE_EDGES.length * 6), 3));
    return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: hex, transparent: true, opacity: op }));
  };
  st.latIn = lattice(C.data, 0.45); st.latOut = lattice(C.dir, 0.8); E.add(st.latIn, st.latOut);
  setLattice(st.latIn, st.inputs);
  /* the glass pane: the inputs a rank-1 sheet cannot see (a₁·x = 0) */
  st.pane = new THREE.Group();
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.7), K.mat.glass('#e6eef7', 0.3));
  glass.material.side = THREE.DoubleSide; glass.userData.noFit = true; st.pane.add(glass);
  for (const [x, y, sx, sy] of [[0, 0.85, 1.72, 0.016], [0, -0.85, 1.72, 0.016], [0.85, 0, 0.016, 1.72], [-0.85, 0, 0.016, 1.72]]) {

  st.aArrows = [0, 1, 2].map(() => { const a = K.arrow([0, 0, 0], [0, 1, 0], READ, { r: 0.016 }); E.add(a.group); return a; });
  st.bArrows = [0, 1, 2].map(() => { const a = K.arrow([0, 0, 0], [0, 1, 0], C.dir, { r: 0.026 }); E.add(a.group); return a; });
  st.focusRing = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.013, 8, 32), brass); E.add(st.focusRing);
  st.focusPlane = PLANE_POINT;                      // (0, 0.6, 0): on sheet 1's blind plane
  st.focus = 9 * 2 + 3 * 0 + 2;                     // (0.6, −0.6, 0.6): front, right, low; sheet 1 reads it most

  /* ---- labels ---- */
  st.tagW = K.label([OX + HALF - 0.3, 0.02, OZ + HALF + 0.1], { 1: 'W · frozen', 2: 'W · frozen', 3: 'W₀ · frozen' }, { cls: 'tag', anchor: 'top', dy: 8 });
  st.tagB = K.label([0, 0, 0], { 1: 'strip B', 2: 'B · d × r', 3: 'B ∈ ℝ^(d×r)' }, { cls: 'tag', anchor: 'top', dy: 6 });
  st.tagA = K.label([0, 0, 0], { 1: 'strip A', 2: 'A · r × d', 3: 'A ∈ ℝ^(r×d)' }, { cls: 'tag', anchor: 'left', dx: 8 });
  st.tagS = K.label([FX1 + 0.04, Y_S, FZ1], { 1: 'the sheet', 2: 'ΔW = (α/r)·B·A', 3: 'ΔW = (α/r)·BA' }, { cls: 'tag', anchor: 'left', dx: 8 });
  st.tagT = K.label([FX1 + 0.04, Y_S, FZ1], { 1: 'full fine-tune', 2: 'ΔW* (full, toy)', 3: 'ΔW* (dense, toy)' }, { cls: 'tag', anchor: 'left', dx: 8 });
  st.tagC = K.label([FX1 + 0.12, 0.05, OZ + HALF + 0.3], { 1: 'sheet strengths', 2: 'singular values', 3: 'σₖ' }, { cls: 'tag', anchor: 'left', dx: 8 });
  st.tagRead = K.label([0, 0, 0], { 1: 'A: reads', 2: 'a₁ · reads', 3: 'a₁ (row of A)' }, { cls: 'tag', anchor: 'left', dx: 6 });
  st.tagWrite = K.label([0, 0, 0], { 1: 'B: pushes', 2: 'b₁ · writes', 3: 'b₁ (column of B)' }, { cls: 'tag', anchor: 'bottom', dy: -6 });
  st.tagPlane = K.label([0, 0, 0], { 1: 'glass: ignored', 2: 'a·x = 0: no change', 3: 'null(A)' }, { cls: 'tag', anchor: 'left', dx: 6 });

  st.readout = K.label([0, 0, 0], '', { cls: 'readout', anchor: 'bottom', dy: -12 });

}
function setLattice(lines, pts) {
  const p = lines.geometry.attributes.position.array;
  LATTICE_EDGES.forEach(([a, b], e) => {
    for (const [o, n] of [[0, a], [3, b]]) { p[6 * e + o] = E0.x + pts[n][0]; p[6 * e + o + 1] = E0.y + pts[n][1]; p[6 * e + o + 2] = E0.z + pts[n][2]; }
  });
  lines.geometry.attributes.position.needsUpdate = true;
  lines.geometry.computeBoundingSphere();
}

/* ============================================================ compute + draw */

function compute(S) {
  const st = S.state, k = S.knobs, r = k.r, al = k.alpha;
  const f = st.zeroB ? initFactors(r) : loraFactors(TG, r);
  st.B = f.B; st.A = f.A; st.r = r; st.al = al; st.s = scaling(al, r);
  st.dW = deltaW(st.B, st.A, al, r);
  st.sv = svd(st.dW).S; st.rank = numericRank(st.sv);
  st.hlk = k.hl > 0 ? Math.min(k.hl, r) : 0;
  st.sheetK = st.hlk ? sheetK(st.B, st.A, al, r, st.hlk - 1) : null;
  st.err = relErr(TG.T, st.dW); st.best = eckartYoung(TSVD.S, r);
  st.maxAbs = Math.max(...st.dW.map((row) => Math.max(...row.map(Math.abs))));
  st.E = effectFactors(r);
  st.outs = st.inputs.map((x) => effectMove(x, st.E.B, st.E.A, al, r));
  st.effRank = numericRank(svd(matmul(st.E.B, st.E.A)).S);
}

function drawFins(S, on) {
  const st = S.state, r = st.r;
  const P = st.fins.geometry.attributes.position.array, Cv = st.fins.geometry.attributes.color.array;
  const EP = st.finEdge.geometry.attributes.position.array, EC = st.finEdge.geometry.attributes.color.array;
  const hot = new THREE.Color(C.dir), pale = new THREE.Color(PALE), hotE = new THREE.Color('#3b2c7e'), paleE = new THREE.Color('#b3a6de');
  let nv = 0, ne = 0, nr = 0, np = 0;
  const put = (p, c) => { P.set(p, 3 * nv); Cv[3 * nv] = c.r; Cv[3 * nv + 1] = c.g; Cv[3 * nv + 2] = c.b; nv++; };
  const putE = (p, c) => { EP.set(p, 3 * ne); EC[3 * ne] = c.r; EC[3 * ne + 1] = c.g; EC[3 * ne + 2] = c.b; ne++; };
  if (on) {
    for (let k = 0; k < r; k++) {
      const isHot = st.hlk === 0 || st.hlk === k + 1, c = isHot ? hot : pale, ce = isHot ? hotE : paleE;
      for (const side of [0, 1]) {                   // 0: column k of B (along z), 1: row k of A (along x)
        const at = side === 0 ? (u, h) => [finX(k, r), Y_S + h, u] : (u, h) => [u, Y_S + h, finZ(k, r)];
        const us = side === 0 ? cellZ : cellX;
        const hs = Array.from({ length: D }, (_, i) => KF * (side === 0 ? st.B[i][k] : st.A[k][i]));
        for (let i = 0; i < D - 1; i++) {
          const u0 = us(i), u1 = us(i + 1), h0 = hs[i], h1 = hs[i + 1];
          const tri = (a, b, w) => { put(at(...a), c); put(at(...b), c); put(at(...w), c); };
          if (h0 * h1 < 0) {                         // the curve crosses its baseline: split at the crossing
            const uc = u0 + (h0 / (h0 - h1)) * (u1 - u0);
            tri([u0, 0], [u0, h0], [uc, 0]); tri([uc, 0], [u1, h1], [u1, 0]);
          } else { tri([u0, 0], [u0, h0], [u1, h1]); tri([u0, 0], [u1, h1], [u1, 0]); }
          putE(at(u0, h0), ce); putE(at(u1, h1), ce);
        }
      }
      setInst(st.rails, nr++, finX(k, r), Y_S, (FZ0 + FZ1) / 2, 0.016, 0.012, FZ1 - FZ0);
      setInst(st.rails, nr++, (FX0 + FX1) / 2, Y_S, finZ(k, r), FX1 - FX0, 0.012, 0.016);
    }
    const xo = finX(r - 1, r) - 0.02, zo = finZ(r - 1, r) - 0.02;   // crossbars from the frame out to the last fin, on two posts each
    for (const z of [FZ0, FZ1]) { setInst(st.rails, nr++, (xo + FX0) / 2, Y_S, z, FX0 - xo, 0.014, 0.018); setRod(st.posts, np++, V(xo, 0, z), V(xo, Y_S, z), 0.011); }
    for (const x of [FX0, FX1]) { setInst(st.rails, nr++, x, Y_S, (zo + FZ0) / 2, 0.018, 0.014, FZ0 - zo); setRod(st.posts, np++, V(x, 0, zo), V(x, Y_S, zo), 0.011); }
  }
  P.fill(0, 3 * nv); EP.fill(0, 3 * ne);           // stale tail -> origin (keeps bounds honest)
  for (const [m, n] of [[st.fins, nv], [st.finEdge, ne]]) {
    const g = m.geometry;
    g.setDrawRange(0, n);
    g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true;
    m.visible = on && n > 0;
  }
  if (on) st.fins.geometry.computeVertexNormals();
  st.fins.geometry.computeBoundingSphere(); st.finEdge.geometry.computeBoundingSphere();
  st.rails.count = nr; st.posts.count = np;
  for (const m of [st.rails, st.posts]) { m.instanceMatrix.needsUpdate = true; m.visible = on; }
}

function draw(S) {
  const st = S.state, view = S.knobs.view, eff = view === 'effect';
  st.slabG.visible = !eff; st.effG.visible = eff;
  const ft = view === 'ft', full = view === 'full';
  /* sheets */
  st.sheet.visible = !ft && !eff;
  st.sheetFT.visible = ft;
  if (ft) setSheet(st.sheetFT, TG.T, Y_S);
  if (st.sheet.visible) setSheet(st.sheet, st.dW, Y_S);
  const hl = st.sheet.visible && st.hlk > 0, mat = st.sheet.material;
  if (mat.transparent !== hl) { mat.transparent = hl; mat.depthWrite = !hl; mat.needsUpdate = true; }
  mat.opacity = hl ? 0.28 : 1;
  st.sheetHL.visible = st.frameHL.visible = hl;
  if (hl) { setSheet(st.sheetHL, st.sheetK, Y_S + st.lift); st.frameHL.position.y = Y_S + st.lift; }
  /* fins */
  const finsOn = !ft && !eff;
  drawFins(S, finsOn);
  /* target beads + residual rods (full view) */
  let nb = 0, nd = 0;
  if (full) {
    const a = new THREE.Vector3(), b = new THREE.Vector3();
    for (let i = 0; i < D; i++) for (let j = 0; j < D; j++) {
      const yt = Y_S + squash(KH * TG.T[i][j]), ys = Y_S + squash(KH * st.dW[i][j]);
      setInst(st.tbeads, nb++, cellX(j), yt, cellZ(i), 0.026, 0.026, 0.026);
      if (Math.abs(yt - ys) > 0.012) { a.set(cellX(j), ys, cellZ(i)); b.set(cellX(j), yt, cellZ(i)); setRod(st.rods, nd++, a, b, 0.011); }
    }
  }
  st.tbeads.count = nb; st.rods.count = nd;
  st.tbeads.instanceMatrix.needsUpdate = st.rods.instanceMatrix.needsUpdate = true;
  st.tbeads.visible = st.rods.visible = full;
  /* comb: σ_k of the sheet (violet, only the non-zero ones) and, in the full view, of ΔW* (teal) */
  const combOn = !eff && !ft && st.combOn;
  let nc = 0;
  if (combOn) {
    const z = OZ + HALF + 0.3;
    for (let k = 0; k < D; k++) {
      const hs = squash(KSIG * st.sv[k]);
      if (st.sv[k] > RANK_TOL * (st.sv[0] || 1)) setInst(st.comb, nc++, cellX(k) - (full ? 0.036 : 0), 0.02 + hs / 2, z, 0.06, Math.max(hs, 0.004), 0.06, C.dir);
      if (full) { const ht = squash(KSIG * TSVD.S[k]); setInst(st.comb, nc++, cellX(k) + 0.036, 0.02 + ht / 2, z, 0.06, ht, 0.06, C.aux); }
    }
  }
  st.comb.count = nc; st.comb.instanceMatrix.needsUpdate = true; if (st.comb.instanceColor) st.comb.instanceColor.needsUpdate = true;
  st.comb.visible = st.combRail.visible = combOn;
  /* tags */
  const tags = !eff && st.tagsOn, r = st.r;
  st.tagW.show(tags); st.tagB.show(tags && finsOn); st.tagA.show(tags && finsOn);
  st.tagS.show(tags && !ft && !hl); st.tagT.show(tags && ft); st.tagC.show(combOn && st.tagsOn);
  st.tagB.move([finX((r - 1) / 2, r), Y_S - 0.05, FZ1 + 0.12]);
  st.tagA.move([FX1 + 0.05, Y_S + 0.34, finZ(0, r)]);
  if (eff) drawEffect(S);
  else { st.tagRead.show(false); st.tagWrite.show(false); st.tagPlane.show(false); }
  note(S);
  S.invalidate();
}

function drawEffect(S) {
  const st = S.state, r = st.r, nIn = st.inputs.length;
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  for (let n = 0; n < nIn; n++) {
    const x = st.inputs[n], y = st.outs[n];
    a.set(E0.x + x[0], E0.y + x[1], E0.z + x[2]); b.set(E0.x + y[0], E0.y + y[1], E0.z + y[2]);
    setInst(st.outBeads, n, b.x, b.y, b.z, 0.036, 0.036, 0.036);
    setRod(st.strings, n, a, b, a.distanceTo(b) > 0.004 ? 0.008 : 0.0001);
  }
  st.outBeads.instanceMatrix.needsUpdate = st.strings.instanceMatrix.needsUpdate = true;
  setLattice(st.latOut, st.outs);
  /* reading directions (rows of A) and writing directions (columns of B), drawn as unit directions */
  const EA = st.E.A, EB = st.E.B;
  for (let k = 0; k < 3; k++) {
    const on = k < r;
    st.aArrows[k].show(on); st.bArrows[k].show(on);
    if (!on) continue;
    const av = V(...EA[k]).normalize(), bv = V(EB[0][k], EB[1][k], EB[2][k]).normalize();
    st.aArrows[k].set(E0, E0.clone().addScaledVector(av, 1.18));
    st.bArrows[k].set(E0, E0.clone().addScaledVector(bv, 1.22));
    if (k === 0) { st.tagRead.move(E0.clone().addScaledVector(av, 1.22)); st.tagWrite.move(E0.clone().addScaledVector(bv, 1.3)); }
  }
  st.tagRead.show(true); st.tagWrite.show(true);
  /* what the adapter ignores: the plane a₁·x = 0 (r = 1), the line null(A) (r = 2), nothing (r ≥ 3) */
  const a1 = V(...EA[0]).normalize();
  st.pane.visible = r === 1; st.nullRod.visible = r === 2;
  st.tagPlane.show(r <= 2);
  if (r === 1) {
    st.pane.quaternion.setFromUnitVectors(V(0, 0, 1), a1);
    const side = UPV.clone().cross(a1); if (side.z < 0) side.negate();          // along the glass, towards the viewer
    st.tagPlane.move(E0.clone().addScaledVector(UPV, 0.86).addScaledVector(side, 0.6));
  }
  if (r === 2) {
    const nl = V(...EA[0]).cross(V(...EA[1])).normalize(); if (nl.y < 0) nl.negate();
    st.nullRod.position.copy(E0); st.nullRod.quaternion.setFromUnitVectors(UPV, nl); st.nullRod.scale.set(0.03, 2.3, 0.03);
    st.tagPlane.move(E0.clone().addScaledVector(nl, 1.12));
  }
  const x = st.inputs[st.focus];
  st.focusRing.position.set(E0.x + x[0], E0.y + x[1], E0.z + x[2]);
}

/* ============================================================ notes (live maths) */

function tapCell(S, hit, which) {
  const st = S.state, p = hit.point.clone(); S.root.worldToLocal(p);
  const j = Math.max(0, Math.min(D - 1, Math.round((p.x - cellX(0)) / CS))), i = Math.max(0, Math.min(D - 1, Math.round((p.z - cellZ(0)) / CS)));
  st.cell = { i, j, which };
  note(S);
  S.invalidate();
}

function note(S) {
  const st = S.state, t = S.tier, view = S.knobs.view;
  const N0 = st.note, R0 = st.readout;
  R0.show(false);
  /* a tapped knot shows its own sum, next to it */
  if (st.cell && view !== 'effect') {
    const { i, j, which } = st.cell, y = Y_S + (which === 'hl' ? st.lift : 0);
    const M = which === 'ft' ? TG.T : which === 'hl' ? st.sheetK : st.dW;

}

function dimKnobs(S) {        // the kit cannot dim knobs: grey the ones that do nothing in this view
  const dim = (id, on) => { const el = document.getElementById('k-' + id); const row = el && el.closest('.k-knob'); if (row) row.style.opacity = on ? '0.42' : ''; };
  const v = S.knobs.view;
  dim('r', v === 'ft'); dim('alpha', v === 'ft'); dim('hl', v === 'ft' || v === 'effect');
}

/* scene configuration shared by beats and predictions */
function scene(S, o = {}) {
  const st = S.state;
  if (!!o.zero !== st.zeroB) { st.zeroB = !!o.zero; compute(S); }
  st.noteMode = o.note || null;
  st.combOn = o.comb !== false;
  st.tagsOn = o.tags !== false;
  st.cell = null;
  if (o.focus != null) st.focus = o.focus === 'plane' ? st.focusPlane : o.focus;
  if (o.figure) {
    st.fig.group.visible = true;
    st.fig.place(o.figAt || [1.95, 0, 0.5], o.face || [OX, 0.6, OZ]);
    st.fig.pose('stand', { ms: 0 });
    const doPose = () => st.fig.pose(o.figure, { at: o.at });
    if (S.shot) doPose(); else setTimeout(doPose, 480);
  } else st.fig.group.visible = false;
  draw(S);
  dimKnobs(S);
}
function lift(S, on) {        // pull a sheet out of the stack (animated unless ?shot=1)
  const st = S.state;
  if (S.shot || !on) { st.lift = LIFT; draw(S); return; }
  st.lift = 0.02;
  S.tween(700, (u) => {
    st.lift = 0.02 + (LIFT - 0.02) * u;
    if (st.hlk) { setSheet(st.sheetHL, st.sheetK, Y_S + st.lift); st.frameHL.position.y = Y_S + st.lift; }
    if (st.noteMode === 'table') note(S);
    S.invalidate();
  }, K.ease.out);
}

/* ================================================================ STL solids */

function sheetSolid(M, y0, th = 0.035) {       // watertight thin sheet; JSCAD is z-up: three (x, y, z) -> (x, -z, y)
  const top = (i, j) => [cellX(j), -cellZ(i), y0 + squash(KH * M[i][j])];
  const bot = (i, j) => { const p = top(i, j); return [p[0], p[1], p[2] - th]; };
  const polys = [];
  for (let i = 0; i < D - 1; i++) for (let j = 0; j < D - 1; j++) {
    polys.push([top(i, j), top(i + 1, j), top(i + 1, j + 1)], [top(i, j), top(i + 1, j + 1), top(i, j + 1)]);
    polys.push([bot(i, j), bot(i + 1, j + 1), bot(i + 1, j)], [bot(i, j), bot(i, j + 1), bot(i + 1, j + 1)]);
  }
  for (let j = 0; j < D - 1; j++) {
    polys.push([top(0, j), top(0, j + 1), bot(0, j + 1), bot(0, j)]);
    polys.push([top(D - 1, j), bot(D - 1, j), bot(D - 1, j + 1), top(D - 1, j + 1)]);
  }
  for (let i = 0; i < D - 1; i++) {
    polys.push([top(i, 0), bot(i, 0), bot(i + 1, 0), top(i + 1, 0)]);
    polys.push([top(i, D - 1), top(i + 1, D - 1), bot(i + 1, D - 1), bot(i, D - 1)]);
  }
  return J.geometries.geom3.fromPoints(polys);
}
const cub = (x, y, z, sx, sy, sz) => J.primitives.cuboid({ size: [sx, sz, sy], center: [x, -z, y] });
