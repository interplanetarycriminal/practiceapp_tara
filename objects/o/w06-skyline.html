<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   11 · w06-skyline: "The skyline" (W6, ARENA [1.1] sampling)
   Every probability on screen comes from the functions in the MATH block:
   ARENA's TransformerSampler methods mirrored line for line, applied to the
   logits of a toy word-pair model trained in this page. The block is
   extracted and checked in node against an independent pure-Python
   implementation (see LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
/* The toy model. Eight Aesop fables, retold in plain words (Aesop is public domain; the wording is ours).
   Tokens are lower-case words plus "," and ".". */
const FABLES = [
  'A hungry fox saw ripe grapes hanging from a high vine. The fox jumped and jumped, but he could not reach them. At last he walked away and said, the grapes are sour.',
  'The hare laughed at the slow tortoise. The tortoise said, let us run a race. The hare ran far ahead and lay down to sleep. The tortoise walked on and on, and when the hare woke up, the tortoise had won the race.',
  'A thirsty crow found a pitcher with a little water in it. The water was too low for the crow to reach. So the crow dropped stones into the pitcher, one by one, until the water rose up and the crow could drink.',
  'A lion caught a little mouse. The mouse said, let me go, and one day I will help you. The lion laughed and let the mouse go. Later the lion was caught in a net. The little mouse ran up and bit the net until the lion was free.',
  'In the summer the grasshopper sang all day, while the ant carried corn to the nest. When the winter came, the grasshopper had no food, and the ant had plenty. Work today, said the ant, and eat tomorrow.',
  'A boy kept the sheep near the village. For fun he cried wolf, and the men ran up to help. There was no wolf, and the boy laughed. One day a wolf came, and the boy cried wolf, but no one came, and the wolf ate the sheep.',
  'A dog with a bone in his mouth crossed a river. He saw his own face in the water and thought it was another dog with a bigger bone. He snapped at it, and his bone fell into the river.',
  'The wind and the sun argued about who was stronger. The wind blew hard at a man, but the man held his cloak tight. Then the sun shone warm, and the man took off his cloak. The sun had won.',
];
function tokenize(s) { return s.toLowerCase().replace(/([.,])/g, ' $1 ').split(/\s+/).filter(Boolean); }
function buildCorpus(fables) {
  const toks = fables.flatMap(tokenize);
  const vocab = [...new Set(toks)];
  const id = new Map(vocab.map((w, i) => [w, i]));
  return { toks, vocab, id, ids: toks.map((w) => id.get(w)), V: vocab.length };
}

/* A word-pair (bigram) network: logits(prev) = W[prev] + b. Karpathy's makemore, part 1, with words.
   Trained here, in the browser, by full-batch Adam on mean cross-entropy + lam * sum(W^2).
   W starts at zero, so training is deterministic (no random init needed). */
function trainBigram(corpus, { steps = 120, lr = 0.15, lam = 1e-5, beta1 = 0.9, beta2 = 0.999, eps = 1e-8 } = {}) {
  const { V, ids } = corpus;
  const cnt = new Float64Array(V * V), rowN = new Float64Array(V);
  for (let i = 0; i + 1 < ids.length; i++) { cnt[ids[i] * V + ids[i + 1]] += 1; rowN[ids[i]] += 1; }
  const N = ids.length - 1;
  const W = new Float64Array(V * V), mW = new Float64Array(V * V), vW = new Float64Array(V * V);
  const b = new Float64Array(V), mb = new Float64Array(V), vb = new Float64Array(V), gb = new Float64Array(V);
  const e = new Float64Array(V);
  const losses = [];
  for (let t = 1; t <= steps; t++) {
    let loss = 0;
    gb.fill(0);
    const c1 = 1 / (1 - beta1 ** t), c2 = 1 / (1 - beta2 ** t);
    for (let a = 0; a < V; a++) {
      const na = rowN[a];
      if (!na) continue;
      const o = a * V;
      let mx = -Infinity;
      for (let j = 0; j < V; j++) { const l = W[o + j] + b[j]; if (l > mx) mx = l; }
      let z = 0;
      for (let j = 0; j < V; j++) { const x = Math.exp(W[o + j] + b[j] - mx); e[j] = x; z += x; }
      const lz = Math.log(z) + mx;
      for (let j = 0; j < V; j++) {
        const c = cnt[o + j], k = o + j;
        if (c) loss -= c * (W[k] + b[j] - lz);
        const g0 = (na * e[j] / z - c) / N;                  // d(mean CE)/d logit
        gb[j] += g0;
        const g = g0 + 2 * lam * W[k];
        mW[k] = beta1 * mW[k] + (1 - beta1) * g;
        vW[k] = beta2 * vW[k] + (1 - beta2) * g * g;
        W[k] -= lr * (mW[k] * c1) / (Math.sqrt(vW[k] * c2) + eps);
      }
    }
    for (let j = 0; j < V; j++) {
      const g = gb[j];
      mb[j] = beta1 * mb[j] + (1 - beta1) * g;
      vb[j] = beta2 * vb[j] + (1 - beta2) * g * g;
      b[j] -= lr * (mb[j] * c1) / (Math.sqrt(vb[j] * c2) + eps);
    }
    losses.push(loss / N);                                   // loss at the weights BEFORE step t
  }
  return { W, b, V, steps, losses, nParams: V * V + V, N };
}
function modelLogits(M, prev) {                              // model(input_ids)[0, -1]: depends on the last token only
  const l = new Float64Array(M.V), o = prev * M.V;
  for (let j = 0; j < M.V; j++) l[j] = M.W[o + j] + M.b[j];
  return l;
}

/* ---- tensor helpers with torch semantics ---- */
function softmax(l) {
  let mx = -Infinity;
  for (const x of l) if (x > mx) mx = x;
  const p = new Float64Array(l.length);
  let z = 0;
  for (let i = 0; i < l.length; i++) { p[i] = Math.exp(l[i] - mx); z += p[i]; }
  for (let i = 0; i < l.length; i++) p[i] /= z;
  return p;
}
function log_softmax(l) {
  let mx = -Infinity;
  for (const x of l) if (x > mx) mx = x;
  let z = 0;
  for (const x of l) z += Math.exp(x - mx);
  const lz = mx + Math.log(z);
  return Float64Array.from(l, (x) => x - lz);
}
function argsortDesc(l) {                                     // logits.sort(descending=True, stable=True).indices
  return Array.from(l, (_, i) => i).sort((i, j) => (l[j] - l[i]) || (i - j));
}
function cumsum(a) { const c = new Float64Array(a.length); let s = 0; for (let i = 0; i < a.length; i++) { s += a[i]; c[i] = s; } return c; }
function searchsortedLeft(sorted, v) {                        // t.searchsorted(cumul_probs, v, side="left")
  let lo = 0, hi = sorted.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (sorted[mid] < v) lo = mid + 1; else hi = mid; }
  return lo;
}
/* Categorical(logits=...).sample() with the uniform draw u made explicit: walk the cumulative
   probabilities (inverse CDF). Same distribution as torch; the walk order is the display order. */
function categorical(logitsKept, u) {
  const p = softmax(logitsKept);
  let s = 0;
  for (let i = 0; i < p.length; i++) { s += p[i]; if (u < s) return i; }
  return p.length - 1;                                        // u within rounding of 1
}

/* ---- ARENA [1.1] TransformerSampler, static methods, line for line ---- */
function greedy_search(logits) {                              // logits.argmax().item(): first index of the max
  let bi = 0;
  for (let i = 1; i < logits.length; i++) if (logits[i] > logits[bi]) bi = i;
  return bi;
}
function apply_temperature(logits, temperature) { return logits.map((x) => x / temperature); }
function apply_frequency_penalty(input_ids, logits, freq_penalty) {
  const d_vocab = logits.length;
  const id_freqs = new Float64Array(d_vocab);                 // t.bincount(input_ids, minlength=d_vocab)
  for (const t of input_ids) id_freqs[t] += 1;
  return logits.map((x, i) => x - freq_penalty * id_freqs[i]);
}
function sample_basic(logits, u) {
  const order = argsortDesc(logits);                          // walk tallest first (display order)
  return order[categorical(Float64Array.from(order, (i) => logits[i]), u)];
}
function sample_top_k(logits, k, u) {
  const top_k_token_ids = argsortDesc(logits).slice(0, k);    // logits.topk(k)
  const top_k_logits = Float64Array.from(top_k_token_ids, (i) => logits[i]);
  return top_k_token_ids[categorical(top_k_logits, u)];
}
function sample_top_p(logits, top_p, u, min_tokens_to_keep = 1) {
  const indices = argsortDesc(logits);
  const logits_sorted = Float64Array.from(indices, (i) => logits[i]);
  const cumul_probs = cumsum(softmax(logits_sorted));
  let n_keep = searchsortedLeft(cumul_probs, top_p) + 1;
  n_keep = Math.max(n_keep, min_tokens_to_keep);
  const keep_idx = indices.slice(0, n_keep);
  const keep_logits = Float64Array.from(keep_idx, (i) => logits[i]);
  return keep_idx[categorical(keep_logits, u)];
}
function sample_next_token(input_ids, logits, { temperature = 1.0, top_k = 0, top_p = 0.0, frequency_penalty = 0.0 } = {}, u = 0.5) {
  if (!(temperature >= 0)) throw new Error('Temperature should be non-negative');
  if (!(top_p >= 0 && top_p <= 1)) throw new Error('Top-p must be a probability');
  if (!(top_k >= 0)) throw new Error('Top-k must be non-negative');
  if (top_p !== 0 && top_k !== 0) throw new Error('At most one of top-p and top-k supported');
  if (temperature === 0) return greedy_search(logits);
  else if (temperature !== 1.0) logits = apply_temperature(logits, temperature);
  if (frequency_penalty !== 0.0) logits = apply_frequency_penalty(input_ids, logits, frequency_penalty);
  if (top_k > 0) return sample_top_k(logits, top_k, u);
  if (top_p > 0.0) return sample_top_p(logits, top_p, u);
  return sample_basic(logits, u);
}

/* ---- everything the skyline draws, from the same functions ----
   order: ranks -> token ids, tallest first; pre: softmax of the final logits (before any fence);
   nKeep: survivors (a prefix of order); fin: the renormalised probabilities actually sampled from. */
function skyline(input_ids, raw, { temperature = 1.0, top_k = 0, top_p = 0.0, frequency_penalty = 0.0 } = {}) {
  const V = raw.length;
  if (temperature === 0) {                                    // greedy_search: argmax of the raw logits
    const g = greedy_search(raw);
    const order = argsortDesc(raw);
    const pre = new Float64Array(V); pre[g] = 1;              // the T -> 0 limit of softmax(l / T)
    return { mode: 'greedy', raw, logits: raw, order, pre, cumul: cumsum(Float64Array.from(order, (i) => pre[i])),
      nKeep: 1, fin: Float64Array.of(1), choice: g };
  }
  let logits = raw;
  if (temperature !== 1.0) logits = apply_temperature(logits, temperature);
  if (frequency_penalty !== 0.0) logits = apply_frequency_penalty(input_ids, logits, frequency_penalty);
  const order = argsortDesc(logits);
  const pre = softmax(logits);
  const cumul = cumsum(Float64Array.from(order, (i) => pre[i]));
  let nKeep = V, mode = 'basic';
  if (top_k > 0) { nKeep = Math.min(top_k, V); mode = 'topk'; }
  else if (top_p > 0) { nKeep = Math.min(V, Math.max(1, searchsortedLeft(cumul, top_p) + 1)); mode = 'topp'; }
  const fin = softmax(Float64Array.from(order.slice(0, nKeep), (i) => logits[i]));
  return { mode, raw, logits, order, pre, cumul, nKeep, fin };
}
function pick(sk, u) {                                        // the marble: rank it lands on
  if (sk.mode === 'greedy') return 0;
  let s = 0;
  for (let r = 0; r < sk.nKeep; r++) { s += sk.fin[r]; if (u < s) return r; }
  return sk.nKeep - 1;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
/* TransformerSampler.sample: n new tokens, one uniform draw per token from the seed */
function generate(M, prompt_ids, n, opts, seed) {
  const rng = mulberry32(seed);
  const ids = prompt_ids.slice();
  const steps = [];
  for (let i = 0; i < n; i++) {
    const u = rng();
    const sk = skyline(ids, modelLogits(M, ids[ids.length - 1]), opts);
    const r = pick(sk, u);
    const tok = sk.order[r];
    steps.push({ sk, u, rank: r, tok, ctx: ids.slice() });
    ids.push(tok);
  }
  return { ids, steps };
}
/* ARENA's beam_search with Beams.generate / Beams.filter (no end-of-text token in this toy,
   so no beam terminates early). Candidates keep ARENA's order: beam-major, k per beam. */
function beam_search(M, prompt_ids, num_return_sequences, num_beams, max_new_tokens) {
  let beams = [{ lp: 0, toks: prompt_ids.slice() }];
  const rows = [];
  for (let s = 0; s < max_new_tokens; s++) {
    const cand = [];
    beams.forEach((B, bi) => {
      const logprobs = log_softmax(modelLogits(M, B.toks[B.toks.length - 1]));
      for (const j of argsortDesc(logprobs).slice(0, num_beams)) cand.push({ lp: B.lp + logprobs[j], toks: [...B.toks, j], parent: bi, tok: j, step: logprobs[j] });
    });
    const top = argsortDesc(Float64Array.from(cand, (c) => c.lp)).slice(0, num_beams);   // logprob_sums.topk(k)
    rows.push({ cand, order: argsortDesc(Float64Array.from(cand, (c) => c.lp)), keep: top });
    beams = top.map((i) => cand[i]);
  }
  return { best: beams.slice(0, num_return_sequences), rows };
}
const MATH = { FABLES, tokenize, buildCorpus, trainBigram, modelLogits, softmax, log_softmax, argsortDesc, cumsum,
  searchsortedLeft, categorical, greedy_search, apply_temperature, apply_frequency_penalty, sample_basic, sample_top_k,
  sample_top_p, sample_next_token, skyline, pick, mulberry32, generate, beam_search };
// MATH-END

/* ============================================================ the toy, trained right now */
const CORPUS = buildCorpus(FABLES);
const MODEL = trainBigram(CORPUS);                 // ~0.1-0.3 s: 120 full-batch Adam steps, deterministic
const VOC = CORPUS.vocab, V = CORPUS.V;
const enc = (s) => tokenize(s).map((w) => CORPUS.id.get(w));
const PROMPTS = {                                  // every prompt is a phrase from the fables
  said: 'at last he walked away and said ,',
  day: 'one day the',
  cried: 'the boy cried',
  lion: 'the lion',
  he: 'he',
};

/* ============================================================ display constants */
const H = 3.6;                 // world height of probability 1 (heights are linear in p)
const BH = 1.5;                // beam rows: height of the row's best candidate (exp(lp - lp_max) = 1)
const NV = 12;                 // towers per row; slot 12 lumps the rest of the vocabulary
const SLOT = 0.25, TW = 0.17, BENCH = 0.03;
const ZF = 0.45, GAP = 0.22;   // front row; each earlier step one row further back
const ZT = 0.98, XT0 = -1.52, LT = 3.04;           // the marble track
const RS = 0.2;                // logit posts: world units per logit unit
const MINH = 0.006;            // display floor so a p ~ 0 tower still reads as a tile
const GEN_N = 10, BEAMS = 3, BEAM_STEPS = 4;
const xOf = (r) => (r - NV / 2) * SLOT;
const xBeam = (r, n) => (r - (n - 1) / 2) * SLOT;
const COL = { amber: C.prob, rest: '#f3d49d', chosen: C.data, drop: '#e2dbcd', segA: '#e8a33d', segB: '#f4cb86',
  segRest: '#f8e2bb', fan: '#c9a567', bead: '#c27d1c', cut: '#8a5a12', beadDrop: '#d9d1c3', rod: C.data, rodTip: C.brass };
const CAM = {
  front: { pos: [1.2, 3.5, 8.2], target: [0, 0.9, 0.3] },
  low: { pos: [0.6, 2.2, 8.4], target: [0, 1.0, 0.3] },
  marble: { pos: [2.6, 4.4, 6.8], target: [0, 0.5, 0.7] },
  land: { pos: [2.2, 8.3, 6.5], target: [0, 1.3, -0.5], fit: 0.9 },
  beam: { pos: [2.2, 4.4, 7.4], target: [0, 0.55, 0.1], fit: 1.35 },       // a close-up: the auto-fit frames the whole plinth
};
const f2 = (v) => v.toFixed(2).replace('-', '−');
const f3 = (v) => v.toFixed(3).replace('-', '−');
const pct = (v) => (v >= 0.995 ? '100%' : v >= 0.095 ? Math.round(v * 100) + '%' : v >= 0.001 ? (v * 100).toFixed(1) + '%' : '<0.1%');
const qw = (w) => `‘${w}’`;
const optsOf = (k) => ({ temperature: k.T, top_k: k.topk, top_p: k.topp, frequency_penalty: k.pen });
const entropy = (p) => { let h = 0; for (const x of p) if (x > 0) h -= x * Math.log(x); return h; };
const words = (ids) => ids.map((i) => VOC[i]).join(' ');
function wrap(text, n = 34) {                     // hard-wrap long label lines on phones
  const out = []; let line = '';
  for (const w of text.split(' ')) { if (line && (line + ' ' + w).length > n) { out.push(line); line = w; } else line = line ? line + ' ' + w : w; }
  if (line) out.push(line);
  return out.join('\n');
}
const STATIC = () => ({ e: 0, lvl: null, d: 1, g: 1, f: 1, slide: 1 });
const wait = (S, ms) => (S.shot ? Promise.resolve() : new Promise((r) => setTimeout(r, ms)));

/* ============================================================ rows (what gets drawn) */
function sampleRow(sk, chosenRank) {
  const items = [];
  for (let r = 0; r < NV; r++) {
    const tok = sk.order[r], kept = r < sk.nKeep;
    items.push({ r, tok, word: VOC[tok], pre: sk.pre[tok], fin: kept ? sk.fin[r] : 0, kept, cum: sk.cumul[r], logit: sk.logits[tok] });
  }
  let pre = 0, fin = 0;
  for (let r = NV; r < sk.order.length; r++) { pre += sk.pre[sk.order[r]]; if (r < sk.nKeep) fin += sk.fin[r]; }
  items.push({ r: NV, rest: true, count: sk.order.length - NV, pre, fin, kept: sk.nKeep > NV, keptCount: Math.max(0, sk.nKeep - NV), cum: 1 });
  return { kind: 'sample', sk, items, chosen: chosenRank == null ? -1 : Math.min(chosenRank, NV), chosenRank, ent: entropy(sk.pre) };
}
function beamRows(B) {                              // one row per step: the k*k candidates, best first
  return B.rows.map((R) => {
    const lpMax = R.cand[R.order[0]].lp;
    const items = R.order.map((ci, r) => {
      const c = R.cand[ci];
      return { r, tok: c.tok, word: VOC[c.tok], pre: Math.exp(c.lp - lpMax), fin: Math.exp(c.lp - lpMax), kept: r < BEAMS, lp: c.lp, cand: c };
    });
    return { kind: 'beam', items, chosen: -1 };
  });
}
function compute(S) {
  const st = S.state, k = S.knobs;
  st.prompt = enc(PROMPTS[k.ctx]);
  if (st.mode === 'beam') {
    st.beam = beam_search(MODEL, st.prompt, BEAMS, BEAMS, BEAM_STEPS);
    st.rows = beamRows(st.beam).reverse();          // front row = the last step
    st.front = null; st.gen = null;
  } else {
    const opts = optsOf(k);
    st.gen = generate(MODEL, st.prompt, st.nGen, opts, k.seed);
    const ids = st.gen.ids;
    st.front = skyline(ids, modelLogits(MODEL, ids[ids.length - 1]), opts);
    const rng = mulberry32(k.seed);                 // the next uniform draw of the same seed
    for (let i = 0; i < st.nGen; i++) rng();
    st.uNext = rng();
    st.rows = [sampleRow(st.front, null)];
    for (let i = st.gen.steps.length - 1; i >= 0; i--) st.rows.push(sampleRow(st.gen.steps[i].sk, st.gen.steps[i].rank));
  }
  st.landed = null;
  st.marbleX = XT0 - 0.14;
  fitProxy(S);
}
const rodsOn = (S) => S.knobs.rods && S.state.mode === 'sample' && S.state.nGen === 0;
function rodHeights(S) {
  const it = S.state.rows[0].items.slice(0, NV);
  const lmin = Math.min(...it.map((x) => x.logit));
  return it.map((x) => RS * (x.logit - lmin) + 0.06);
}
/* An invisible box that tells the kit's framing how big the object is right now (instanced
   towers don't report their extent). Grows on knob changes; beats reframe from scratch. */
function fitProxy(S, reframe = false) {
  const st = S.state;
  let top = 0;
  const hs = st.mode === 'beam' ? BH : H;
  for (const row of st.rows) for (const it of row.items) top = Math.max(top, hs * Math.max(it.pre, it.fin));
  if (rodsOn(S)) top = Math.max(top, Math.min(H + 0.2, Math.max(...rodHeights(S))));
  if (st.mode === 'sample' && st.front.mode === 'topp') top = Math.max(top, H);     // the running-total beads reach 1
  top = Math.max(1.35, top + 0.3);
  const back = ZF - (st.rows.length - 1) * GAP - 0.2, front = st.mode === 'sample' ? ZT + 0.06 : ZF + 0.25;
  st.proxy.scale.set(3.4, top, front - back);
  st.proxy.position.set(0, 0, (front + back) / 2);
  st.proxy.updateMatrixWorld();
  if (reframe || S.first) { st.fitTop = top; st.fitBack = back; return; }
  if (top > st.fitTop + 0.05 || back < st.fitBack - 0.05) {
    st.fitTop = Math.max(st.fitTop, top); st.fitBack = Math.min(st.fitBack, back);
    S.stage.refit();
  }

/* ============================================================ drawing */

  await tw(S, my, 1600, (x) => { st.A.lvl = p * x; }, K.ease.inOut);
  await tw(S, my, 700, (x) => { st.A.d = x; st.A.g = x; }, K.ease.out);
  if (alive(S, my)) { st.A = STATIC(); draw(S); }
}
async function sweepT(S, a, b, ms = 1500) {
  const st = S.state, my = newAnim(S);
  if (S.shot) { S.setKnob('T', b); return; }
  st.sweeping = true;
  S.setKnob('T', a);
  await S.tween(ms, (x) => {
    if (!alive(S, my)) return;
    const v = Math.round((a + (b - a) * x) * 20) / 20;
    if (v !== S.knobs.T) S.setKnob('T', v);
  });
  st.sweeping = false;
  if (alive(S, my) && S.knobs.T !== b) S.setKnob('T', b);
}
function beamMode(S) {
  const st = S.state;
  st.mode = 'beam'; compute(S);
  const my = newAnim(S);
  if (S.shot) { draw(S); return Promise.resolve(); }
  st.A.f = 0; draw(S);
  return tw(S, my, 650, (x) => { st.A.f = x; }, K.ease.back);
}

/* scene configuration shared by beats and predictions */
function scene(S, o = {}) {
  const st = S.state;
  st.noteMode = o.note || null;
  st.noteAt = o.noteAt || null;
  st.tagsOn = !!o.tags;
  st.wordsOn = o.words !== false;
  st.rowTagsOn = o.rowTags !== false;
  st.readoutOn = o.readout !== false;
  if (o.fig) {
    st.fig.group.visible = true;
    st.fig.place(o.figAt || [1.92, 0, 0.92], o.face || [0, 0.6, 0.7]);
    st.fig.pose('stand', { ms: 0 });
    const doPose = () => st.fig.pose(o.fig, { at: o.at });
    if (S.shot) doPose(); else setTimeout(doPose, 480);
  } else st.fig.group.visible = false;
}
function setMode(S, mode, nGen = 0) {
  const st = S.state;
  st.mode = mode; st.nGen = nGen;
  compute(S); fitProxy(S, true);
  newAnim(S); draw(S);
}

  solids(S) {
    const st = S.state, out = [];
    const cube = (x, z, w, d, h) => J.primitives.cuboid({ size: [w, d, h], center: [x, -z, h / 2] });
    const back = ZF - (st.rows.length - 1) * GAP - 0.2;
    out.push(J.primitives.cuboid({ size: [4.4, ZT + 0.2 - back, 0.04], center: [0, -((ZT + 0.2 + back) / 2), -0.02] }));
    st.rows.forEach((row, j) => {
      const z = ZF - j * GAP, n = row.items.length;
      row.items.forEach((it, r) => {
        const h = Math.max(0.02, (st.mode === 'beam' ? BH : H) * (it.kept ? it.fin : 0));
        const x = st.mode === 'beam' ? xBeam(r, n) : xOf(r);
        out.push(cube(x, z, TW, TW, h));
      });
    });
    if (st.mode === 'sample') out.push(J.primitives.cuboid({ size: [LT + 0.12, 0.19, 0.03], center: [XT0 + LT / 2, -ZT, 0.015] }));
    return out;
  },
