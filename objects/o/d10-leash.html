<body>
<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   21 · d10-leash: "The leash" (W10 deep, ARENA [2.4] RLHF)
   A toy chatbot with six possible answers. The floor is a slice of policy
   space, the plaster is the reward model's score, the colour is the truth,
   and the red string is the KL leash back to the reference model. The ball
   does natural-gradient ascent on E[r] − β·KL(π‖π_ref). Every height,
   colour, contour and readout is computed below; the MATH block is extracted
   and verified in node and Python (see LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
/* Toy world: six completions of ARENA's prefix "This is". The strings are real (their full stops are
   counted live by reward_fn_char_count); the reference probabilities, the gold (human) scores and the
   reward model's errors are toy numbers. Everything computed from them below is exact. */
const ANSWERS = [
  { s: 'This is my dog.',        ref: 0.31,  gold:  0.6, err: 0   },
  { s: 'This is a list of the',  ref: 0.30,  gold: -0.2, err: 0   },
  { s: 'This is it. We won.',    ref: 0.20,  gold:  1.0, err: 0.1 },
  { s: 'This is the U.S. team.', ref: 0.12,  gold:  0.4, err: 0.3 },
  { s: 'This is Python 2.7.12.', ref: 0.066, gold: -0.2, err: 0.5 },
  { s: 'This is......',          ref: 0.004, gold: -1.0, err: 2.5 },
];
// ARENA's reward_fn_char_count: the number of '.' in each sample
const reward_fn_char_count = (samples, char = '.') => samples.map((s) => s.split(char).length - 1);
const dot = (p, f) => { let a = 0; for (let i = 0; i < p.length; i++) a += p[i] * f[i]; return a; };
const cov = (p, a, b) => { const ma = dot(p, a), mb = dot(p, b); let c = 0; for (let i = 0; i < p.length; i++) c += p[i] * (a[i] - ma) * (b[i] - mb); return c; };
// normalize_reward over an infinitely large batch drawn from p: (r - mean) / std under p
function normalize(f, p) { const m = dot(p, f), sd = Math.sqrt(cov(p, f, f)); return f.map((v) => (v - m) / sd); }
function logSoftmax(l) {
  let m = -Infinity; for (const t of l) if (t > m) m = t;
  let s = 0; for (const t of l) s += Math.exp(t - m);
  const lz = m + Math.log(s); return l.map((t) => t - lz);
}
/* One world: the reward model r and gold, both normalised on the reference policy. 'toy': a learned RM
   that is gold plus δ times its errors (largest on answers the reference rarely writes). 'dots': ARENA's
   reward_fn_char_count, normalised. */
function makeWorld({ delta = 1, rm = 'toy' } = {}) {
  const ref = ANSWERS.map((a) => a.ref);
  const lref = ref.map(Math.log);
  const gold = normalize(ANSWERS.map((a) => a.gold), ref);
  const dots = reward_fn_char_count(ANSWERS.map((a) => a.s));
  const raw = rm === 'dots' ? dots : ANSWERS.map((a) => a.gold + delta * a.err);
  return { ref, lref, gold, r: normalize(raw, ref), dots, kind: rm, delta, corr: cov(ref, normalize(raw, ref), gold) };
}
/* The floor. A point (x, s) is the policy "tilt the reference towards the RM by x, then sample at
   temperature T = e^-s":  pi ∝ (pi_ref · exp(x·r))^(1/T).  Relative to pi_ref that is an exponential
   family with features (r, log pi_ref) and natural parameters a = x/T, b = 1/T - 1. Home: x = 0, T = 1. */
const nat = (x, s) => [x * Math.exp(s), Math.exp(s) - 1];
const unnat = (a, b) => [a / (1 + b), Math.log(1 + b)];
function policy(W, x, s) {
  const k = Math.exp(s);
  const lp = logSoftmax(W.lref.map((l, i) => k * (l + x * W.r[i])));
  return { lp, p: lp.map(Math.exp) };
}
// KL(pi || pi_ref) = sum pi (log pi - log pi_ref): the inner sum of ARENA's calc_kl_penalty
function klDiv(lp, lq) { let k = 0; for (let i = 0; i < lp.length; i++) k += Math.exp(lp[i]) * (lp[i] - lq[i]); return Math.max(0, k); }
// everything the object shows at one point. J is the RLHF objective E[r] - beta·KL.
function measure(W, x, s, beta = 0) {
  const { lp, p } = policy(W, x, s);
  const kl = klDiv(lp, W.lref), r = dot(p, W.r), gold = dot(p, W.gold);
  let top = 0; for (let i = 1; i < p.length; i++) if (p[i] > p[top]) top = i;
  return { p, lp, kl, r, gold, J: r - beta * kl, top };
}
/* Gradients in natural coordinates (a, b), features phi = (r, log pi_ref):
   dE[f]/dtheta = Cov_pi(phi, f);  dKL/dtheta = Cov_pi(phi, log pi - log pi_ref) (the score term has
   mean zero).  Fisher F = Cov_pi(phi, phi).  Natural gradient = F^-1 · grad J (solved 2 x 2). */
function gradients(W, x, s, beta) {
  const { lp, p } = policy(W, x, s);
  const g = lp.map((l, i) => l - W.lref[i]);
  const f = W.r.map((r, i) => r - beta * g[i]);
  const ga = cov(p, W.r, f), gb = cov(p, W.lref, f);
  const Faa = cov(p, W.r, W.r), Fab = cov(p, W.r, W.lref), Fbb = cov(p, W.lref, W.lref);
  const det = Faa * Fbb - Fab * Fab;
  return { ga, gb, na: (Fbb * ga - Fab * gb) / det, nb: (Faa * gb - Fab * ga) / det, det,
    pull: cov(p, W.r, W.r), leash: beta * cov(p, W.r, g) };
}
/* Training: natural-gradient ascent on J from a start point, the step TRPO computes and PPO approximates.
   The map ends at x = XMAX (the policy would keep going). */
const XMIN = -1.5, XMAX = 6.5, SMAX = Math.log(2);
function train(W, { beta, eta = 0.08, steps = 300, x0 = 0, s0 = 0 }) {
  let [a, b] = nat(x0, s0);
  const path = [[x0, s0]];
  for (let t = 0; t < steps; t++) {
    const [x, s] = unnat(a, b);
    const G = gradients(W, x, s, beta);
    a += eta * G.na; b += eta * G.nb;
    let [x1, s1] = unnat(a, b);
    if (x1 > XMAX) { x1 = XMAX; [a, b] = nat(x1, s1); }
    if (x1 < XMIN) { x1 = XMIN; [a, b] = nat(x1, s1); }
    path.push([x1, s1]);
  }
  return path;
}
// closed form: over ALL policies the maximiser of E[r] - beta·KL is pi* ∝ pi_ref·exp(r/beta),
// which is the floor point x = 1/beta, T = 1; max J = beta·log E_ref[exp(r/beta)]
function optimum(W, beta) {
  const lp = logSoftmax(W.lref.map((l, i) => l + W.r[i] / beta));
  let m = -Infinity; for (const r of W.r) m = Math.max(m, r / beta);
  const Jmax = beta * (m + Math.log(dot(W.ref, W.r.map((r) => Math.exp(r / beta - m)))));
  return { lp, p: lp.map(Math.exp), x: 1 / beta, Jmax };
}
// the road (T = 1) sampled for the back wall: distance from home d = sqrt(KL), RM score, gold
function road(W, n = 160) {
  const out = [];
  for (let i = 0; i <= n; i++) { const x = XMAX * i / n, m = measure(W, x, 0); out.push({ x, d: Math.sqrt(m.kl), r: m.r, gold: m.gold, kl: m.kl }); }
  return out;
}
const MATH = { ANSWERS, reward_fn_char_count, dot, cov, normalize, logSoftmax, makeWorld, nat, unnat, policy, klDiv, measure, gradients, train, optimum, road, XMIN, XMAX, SMAX };
// MATH-END

/* ============================================================ display setup */

const XC = 2.5, SX = 0.42, Z0 = 0.3, SZ = 1.15;       // floor: x across (right = towards the RM), s = log(1/T) front (hot) to back (cold)
const wX = (x) => (x - XC) * SX;
const wZ = (s) => Z0 - s * SZ;
const BASE = 0.12, RELIEF = 0.95;                         // plaster heights: each view fills the same relief
const NX = 80, NS = 16;                                   // grid cells
const ETA = 0.08, STEPS = 300, TRAIN_MS = 3000;           // natural-gradient steps per run
const LEVELS = [0.25, 1, 2.25, 4];                        // KL contours: √KL = 0.5, 1, 1.5, 2
const BETAS = [[1, '1'], [0.5, '½'], [0.25, '¼'], [0.2, '⅕']];
const BR = 0.075;
// the back wall (gold and RM score vs √KL along the road)
const CZ = -1.22, PX0 = -1.34, PW = 2.66, PY0 = 0.86, PH = 1.28;
const UP = new THREE.Vector3(0, 1, 0);
const FIG = [wX(XMAX) - 0.1, 0, wZ(-SMAX) + 0.28];         // the guide's spot: front right, by the RM's hack corner
const CAM = {
  hero: { pos: [1.0, 5.0, 5.8], target: [0, 0.82, -0.1] },
  floor: { pos: [0.6, 5.8, 4.6], target: [0, 0.7, 0] },
  side: { pos: [4.2, 4.5, 4.6], target: [0.2, 0.9, -0.1] },
  close: { pos: [0.2, 4.8, 4.2], target: [0, 0.85, -0.1], fit: 0.58 },   // a little nearer than the auto fit
  wall: { pos: [0, 3.0, 5.2], target: [0, 1.35, -0.9], fit: 0.8 },
};
const fx = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d).replace('-', '−');
const sg = (v, d = 2) => (v > 0.5 * 10 ** -d ? '+' : '') + fx(v, d);
const pct = (p) => `${Math.round(p * 100)}%`;
const quote = (i) => `“${ANSWERS[i].s}”`;

function rod(mat, radius, seg = 8) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 1, seg, 1), mat);
  m.castShadow = true;
  const d = new THREE.Vector3();
  m.userData.set = (p, q) => {
    d.subVectors(q, p);
    const len = Math.max(d.length(), 1e-6);
    m.position.copy(p).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(UP, d.multiplyScalar(1 / len));
    m.scale.set(1, len, 1);
  };
  return m;
}

/* ============================================================ the world */

function setWorld(S) {
  const st = S.state, k = S.knobs;
  st.W = makeWorld({ delta: k.delta, rm: k.rm });
  const W = st.W;
  // grid values (β-independent)
  const n = (NX + 1) * (NS + 1);
  st.gx = new Float64Array(NX + 1); st.gs = new Float64Array(NS + 1);
  for (let i = 0; i <= NX; i++) st.gx[i] = XMIN + (XMAX - XMIN) * i / NX;
  for (let j = 0; j <= NS; j++) st.gs[j] = -SMAX + 2 * SMAX * j / NS;
  st.gR = new Float64Array(n); st.gK = new Float64Array(n); st.gG = new Float64Array(n);
  for (let j = 0; j <= NS; j++) for (let i = 0; i <= NX; i++) {
    const m = measure(W, st.gx[i], st.gs[j]), q = j * (NX + 1) + i;
    st.gR[q] = m.r; st.gK[q] = m.kl; st.gG[q] = m.gold;
  }
  rescale(S);
  st.road = road(W, 160);
  st.contours = contourSegments(S);
  scaleWall(S);
}
/* heights: the shown value (RM score, or J = score − β·KL while the obj toggle morphs in) mapped affinely
   so that each view fills the same relief; the readouts carry the numbers */
function rescale(S) {
  const st = S.state, b = S.knobs.beta, o = st.obj;
  let lo = Infinity, hi = -Infinity;
  for (let q = 0; q < st.gR.length; q++) { const v = st.gR[q] - o * b * st.gK[q]; if (v < lo) lo = v; if (v > hi) hi = v; }
  st.VLO = lo; st.HS = RELIEF / Math.max(1e-6, hi - lo);
}
const wY = (S, v) => BASE + (v - S.state.VLO) * S.state.HS;
const hv = (S, r, kl) => r - S.state.obj * S.knobs.beta * kl;         // displayed value: RM score, or morphing to J
const surfY = (S, x, s) => { const m = measure(S.state.W, x, s); return wY(S, hv(S, m.r, m.kl)); };

/* ============================================================ the plaster */

function buildSurface(S) {
  const st = S.state;
  const n = (NX + 1) * (NS + 1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const idx = [];
  for (let j = 0; j < NS; j++) for (let i = 0; i < NX; i++) {
    const a = j * (NX + 1) + i, b = a + 1, c = a + NX + 2, d = a + NX + 1;
    idx.push(a, b, c, a, c, d);
  }
  g.setIndex(idx);
  const mat = new THREE.MeshStandardMaterial({ color: '#ffffff', vertexColors: true, roughness: 0.9, metalness: 0 });
  mat.shadowSide = THREE.DoubleSide;
  st.top = new THREE.Mesh(g, mat);
  const ns = 2 * (NX + NS) * 6;
  const sgm = new THREE.BufferGeometry();
  sgm.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ns * 3), 3));
  sgm.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(ns * 3), 3));
  st.skirt = new THREE.Mesh(sgm, K.mat.plaster('#e9e2d6'));
  for (const m of [st.top, st.skirt]) { m.castShadow = true; m.receiveShadow = true; S.root.add(m); }
  // brass trim round the foot
  const bm = K.mat.brass(), tw = 0.026, th = 0.06;
  const x0 = wX(XMIN), x1 = wX(XMAX), zb = wZ(SMAX), zf = wZ(-SMAX);
  const box = (w, d, x, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, th, d), bm); b.position.set(x, th / 2, z); b.castShadow = true; b.receiveShadow = true; S.root.add(b); };
  box(x1 - x0 + 2 * tw, tw, (x0 + x1) / 2, zf + tw / 2); box(x1 - x0 + 2 * tw, tw, (x0 + x1) / 2, zb - tw / 2);
  box(tw, zf - zb, x1 + tw / 2, (zb + zf) / 2); box(tw, zf - zb, x0 - tw / 2, (zb + zf) / 2);
}

const cPl = new THREE.Color(), cGo = new THREE.Color(), cBa = new THREE.Color(), cT = new THREE.Color();
function tint(S, gold) {
  const a = S.state.goldAmt;
  cT.copy(cPl);
  if (a <= 0) return cT;
  if (gold >= 0) cT.lerp(cGo, a * 0.8 * Math.min(1, gold / 1.1));
  else cT.lerp(cBa, a * 0.8 * Math.min(1, -gold / 1.8));
  return cT;
}
function paintSurface(S) {
  const st = S.state;
  rescale(S);
  cPl.set(C.plaster); cGo.set(C.good); cBa.set(C.grad);
  const pos = st.top.geometry.attributes.position.array, col = st.top.geometry.attributes.color.array;
  const Y = new Float32Array((NX + 1) * (NS + 1));
  for (let j = 0; j <= NS; j++) for (let i = 0; i <= NX; i++) {
    const q = j * (NX + 1) + i, y = wY(S, hv(S, st.gR[q], st.gK[q]));
    Y[q] = y;
    pos[3 * q] = wX(st.gx[i]); pos[3 * q + 1] = y; pos[3 * q + 2] = wZ(st.gs[j]);
    const c = tint(S, st.gG[q]);
    col[3 * q] = c.r; col[3 * q + 1] = c.g; col[3 * q + 2] = c.b;
  }
  const g = st.top.geometry;
  g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true;
  g.computeVertexNormals(); g.computeBoundingSphere(); g.computeBoundingBox();
  // skirts: walk the perimeter, outward quads down to the plinth
  const per = [];
  for (let i = 0; i < NX; i++) per.push([i, 0, [0, 0, 1]]);
  for (let j = 0; j < NS; j++) per.push([NX, j, [1, 0, 0]]);
  for (let i = NX; i > 0; i--) per.push([i, NS, [0, 0, -1]]);
  for (let j = NS; j > 0; j--) per.push([0, j, [-1, 0, 0]]);
  const sp = st.skirt.geometry.attributes.position.array, sn = st.skirt.geometry.attributes.normal.array;
  let w = 0;
  const put = (x, y, z, o) => { sp[w] = x; sp[w + 1] = y; sp[w + 2] = z; sn[w] = o[0]; sn[w + 1] = o[1]; sn[w + 2] = o[2]; w += 3; };
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(0, -1, 0), nn = new THREE.Vector3();
  for (let p = 0; p < per.length; p++) {
    const [ia, ja, o] = per[p], [ib, jb] = per[(p + 1) % per.length];
    const ax = wX(st.gx[ia]), az = wZ(st.gs[ja]), ay = Y[ja * (NX + 1) + ia];
    const bx = wX(st.gx[ib]), bz = wZ(st.gs[jb]), by = Y[jb * (NX + 1) + ib];
    e1.set(bx - ax, 0, bz - az); nn.crossVectors(e1, e2);
    if (nn.x * o[0] + nn.z * o[2] >= 0) { put(ax, ay, az, o); put(bx, by, bz, o); put(ax, 0, az, o); put(bx, by, bz, o); put(bx, 0, bz, o); put(ax, 0, az, o); }
    else { put(ax, ay, az, o); put(ax, 0, az, o); put(bx, by, bz, o); put(bx, by, bz, o); put(ax, 0, az, o); put(bx, 0, bz, o); }
  }
  const s2 = st.skirt.geometry;
  s2.attributes.position.needsUpdate = true; s2.attributes.normal.needsUpdate = true; s2.computeBoundingSphere();
  placeFloorLines(S);
  S.invalidate();
}

/* KL contours by marching squares on the grid; endpoints carry exact (r, KL) for re-heighting */
function contourSegments(S) {
  const st = S.state, W = st.W, segs = [];
  const at = (i, j) => st.gK[j * (NX + 1) + i];
  const cross = (i0, j0, i1, j1, L) => {
    const k0 = at(i0, j0), k1 = at(i1, j1), t = (L - k0) / (k1 - k0);
    const x = st.gx[i0] + (st.gx[i1] - st.gx[i0]) * t, s = st.gs[j0] + (st.gs[j1] - st.gs[j0]) * t;
    const m = measure(W, x, s);
    return { x, s, r: m.r, kl: m.kl };
  };
  for (const L of LEVELS) for (let j = 0; j < NS; j++) for (let i = 0; i < NX; i++) {
    const e = [];
    const edges = [[i, j, i + 1, j], [i + 1, j, i + 1, j + 1], [i + 1, j + 1, i, j + 1], [i, j + 1, i, j]];
    for (const [a, b, c, d] of edges) { const ka = at(a, b), kc = at(c, d); if ((ka < L) !== (kc < L)) e.push(cross(a, b, c, d, L)); }
    if (e.length === 2) segs.push([e[0], e[1], L]);
    else if (e.length === 4) { segs.push([e[0], e[1], L]); segs.push([e[2], e[3], L]); }
  }
  return segs;
}

/* the road (T = 1), the contours, the β ruler, the peg: everything that sits on the plaster */
function placeFloorLines(S) {
  const st = S.state;
  const P = (x, s, r, kl, lift) => new THREE.Vector3(wX(x), wY(S, hv(S, r, kl)) + lift, wZ(s));
  st.roadLine.set(st.road.filter((q, i) => i % 2 === 0).map((q) => P(q.x, 0, q.r, q.kl, 0.009)));
  // the road also runs west of home
  const west = [];
  for (let i = 0; i <= 12; i++) { const x = XMIN * (1 - i / 12), m = measure(st.W, x, 0); west.push(P(x, 0, m.r, m.kl, 0.009)); }
  st.roadWest.set(west);
  const d = new THREE.Object3D(), v = new THREE.Vector3();
  let n = 0;
  for (const [a, b] of st.contours) {
    if (n >= st.ringsMax) break;
    const p = P(a.x, a.s, a.r, a.kl, 0.008), q = P(b.x, b.s, b.r, b.kl, 0.008);
    v.subVectors(q, p); const len = Math.max(1e-6, v.length());
    d.position.copy(p).addScaledVector(v, 0.5); d.quaternion.setFromUnitVectors(UP, v.multiplyScalar(1 / len)); d.scale.set(1, len, 1);
    d.updateMatrix(); st.rings.setMatrixAt(n++, d.matrix);
  }
  st.rings.count = n;
  st.rings.instanceMatrix.needsUpdate = true; st.rings.computeBoundingSphere();
  // contour tags where each ring crosses the back edge (cold side), else the road
  st.ringTags.forEach((t, li) => {
    const L = LEVELS[li];
    let spot = null;
    for (let i = 0; i < NX && !spot; i++) { const q0 = NS * (NX + 1) + i; if ((st.gK[q0] < L) !== (st.gK[q0 + 1] < L) && st.gx[i] > 0) spot = [st.gx[i], SMAX]; }
    if (!spot) { const rq = st.road.find((q) => q.kl >= L); if (rq) spot = [rq.x, 0]; }
    t.spot = spot;
    if (spot) { const m = measure(st.W, spot[0], spot[1]); t.move(P(spot[0], spot[1], m.r, m.kl, 0.02)); }
  });
  // β ruler along the front edge: the rest point x = 1/β for each β

/* ============================================================ the back wall */

/* ============================================================ the ball, the leash, the pulls */

function buildBall(S) {
  const st = S.state;
  st.ball = K.bead([0, 1, 0], C.prob, BR); S.root.add(st.ball);
  st.trail = K.tube([new THREE.Vector3(), new THREE.Vector3(0.01, 0, 0)], C.prob, 0.012); S.root.add(st.trail.mesh);
  st.leash = K.tube([new THREE.Vector3(), new THREE.Vector3(0.01, 0, 0)], C.grad, 0.011); S.root.add(st.leash.mesh);
  st.pullR = K.arrow([0, 0, 0], [0.1, 0, 0], C.aux, { r: 0.016 }); S.root.add(st.pullR.group);
  st.pullL = K.arrow([0, 0, 0], [-0.1, 0, 0], C.grad, { r: 0.016 }); S.root.add(st.pullL.group);
  st.readout = K.label([0, 2.33, CZ - 0.03], '', { cls: 'readout', anchor: 'bottom', dy: -6 });   // scoreboard on the wall

};
function drawBall(S) {

  st.trail.mesh.visible = pts[0].distanceTo(pts[pts.length - 1]) > 0.02;

  if (k.beta <= 0) {

    for (let i = 0; i <= 10; i++) { const t = i / 10; L.push(new THREE.Vector3(knob.x + 0.13 * t, knob.y - 0.3 * Math.sin(t * Math.PI / 2) - 0.02 * t, knob.z + 0.1 * t)); }

/* ---------------- a small animation queue (cancellable; instant under ?shot=1) */

    });
    st.peg = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.03, 0.34, 12), brass); st.peg.castShadow = true; S.root.add(st.peg);
    st.knob = new THREE.Mesh(new THREE.SphereGeometry(0.038, 16, 12), brass); st.knob.castShadow = true; S.root.add(st.knob);
    st.homeTag = K.label([0, 0, 0], { 1: 'home: the starting model', 2: 'home: reference model π_ref', 3: 'π_ref (x = 0, T = 1)' }, { cls: 'tag brass', anchor: 'bottom', dy: -4 });
    st.hackTag = K.label([0, 0, 0], { 1: 'RM\'s favourite: “This is......”', 2: 'RM\'s top answer, people\'s worst', 3: 'argmax r: “This is......”' }, { cls: 'tag red', anchor: 'top', dy: 6 });
    st.goodTag = K.label([0, 0, 0], { 1: 'people\'s favourite', 2: 'people\'s top: “This is it. We won.”', 3: 'argmax gold: “This is it. We won.”' }, { cls: 'tag green', anchor: 'bottom', dy: -6 });
    st.eastTag = K.label([0, 0, 0], { 1: 'leans into what the RM likes →', 2: 'x: tilt towards the RM →', 3: 'x (π ∝ π_ref·e^{x·r}) →' }, { cls: 'tag', anchor: 'right', dx: -2, dy: -12 });
    st.hotTag = K.label([0, 0, 0], { 1: 'front: more random · back: surer', 2: 'front: temperature 2 · back: ½', 3: 'T = 2 (front) … ½ (back)' }, { cls: 'tag', anchor: 'top', dy: 5 });
    buildWall(S);
    buildBall(S);
    st.fig = K.figure();
    S.root.add(st.fig.group);
    st.fig.group.traverse((m) => { m.userData.noFit = true; });   // the guide never changes the framing
    st.fig.group.visible = false;
    // tap the plaster to drop the ball there and train from it
    K.pick(st.top, (h) => {
      const p = S.root.worldToLocal(h.point.clone());
      const x = Math.min(XMAX, Math.max(XMIN, p.x / SX + XC)), s = Math.min(SMAX, Math.max(-SMAX, (Z0 - p.z) / SZ));
      st.start = [x, s];
      applyVis(S);

  rebuild(S, id) {
    const st = S.state, k = S.knobs;
    if (id === '*') {
      if (st.done) { const d = st.done; st.done = null; d(); }
      st.q = [];
      st.obj = k.obj ? 1 : 0; st.goldAmt = k.gold ? 1 : 0;
      setWorld(S); paintSurface(S); paintWall(S);
      st.start = [0, 0]; st.path = [[0, 0]]; st.u = 0;
      applyVis(S); drawBall(S);
      return;
    }
    if (id === 'beta') { if (st.obj > 0) paintSurface(S); applyVis(S); trainRun(S, 120); return; }
    if (id === 'delta' || id === 'rm') { setWorld(S); paintSurface(S); paintWall(S); applyVis(S); trainRun(S, 200); return; }
    if (id === 'gold') { applyVis(S); play(S, [goldPhase(S, st.goldAmt, k.gold ? 1 : 0)]).then(() => drawBall(S)); drawBall(S); return; }
    if (id === 'obj') { applyVis(S); play(S, [morphPhase(S, st.obj, k.obj ? 1 : 0)]); return; }
  },

  frame(S, t) {
    const st = S.state;
    if (!st.q.length) return false;
    if (st.qt0 == null) st.qt0 = t;
    for (;;) {
      const p = st.q[0], f = ((t - st.qt0) * 1000) / p.ms;
      if (f < 1) { p.fn(Math.max(0, f)); return true; }
      p.fn(1);
      st.q.shift();
      st.qt0 += p.ms / 1000;
      if (!st.q.length) { if (st.done) { const d = st.done; st.done = null; d(); } return false; }
      st.q[0].fn(0);
    }
  },

  onTier(S) {
    readout(S); applyVis(S); drawBall(S);
  },

  solids(S) {
    const st = S.state;
    const J3 = (v) => [v.x, -v.z, v.y];
    const out = [surfaceSolid(S)];
    // the peg, the ball, the back wall with its gold curve (printable)
    out.push(J.primitives.cylinder({ radius: 0.03, height: 0.36, center: J3(new THREE.Vector3(wX(0), wY(S, hv(S, 0, 0)) + 0.18, wZ(0))), segments: 16 }));
    out.push(J.primitives.sphere({ radius: BR, center: J3(st.ball.position), segments: 16 }));
    out.push(J.primitives.cuboid({ size: [3.24, 0.05, 1.68], center: [0, -(CZ - 0.03), 0.62 + 0.84] }));
    for (const x of [-1.42, 1.42]) out.push(J.primitives.cylinder({ radius: 0.02, height: 0.62, center: [x, -(CZ - 0.03), 0.31], segments: 12 }));
    const gpts = st.road.filter((q, i) => i % 4 === 0).map((q) => J3(new THREE.Vector3(pX(S, q.d), pY(S, q.gold), CZ + 0.02)));
    const tube = K.tubeSolid(gpts, 0.02, 8); if (tube) out.push(tube);
    return out;
  },

/* watertight STL solid of the slab as shown (JSCAD is z-up: three (x, y, z) -> JSCAD (x, -z, y)) */
function surfaceSolid(S) {
  const st = S.state, W1 = NX + 1;
  const points = [], faces = [];
  for (let j = 0; j <= NS; j++) for (let i = 0; i <= NX; i++) {
    const q = j * W1 + i;
    points.push([wX(st.gx[i]), -wZ(st.gs[j]), wY(S, hv(S, st.gR[q], st.gK[q]))]);
  }
  for (let j = 0; j < NS; j++) for (let i = 0; i < NX; i++) {
    const a = j * W1 + i, b = a + 1, cc = a + 1 + W1, d = a + W1;
    faces.push([a, b, cc], [a, cc, d]);
  }
  const per = [];
  for (let i = 0; i < NX; i++) per.push([i, 0]);
  for (let j = 0; j < NS; j++) per.push([NX, j]);
  for (let i = NX; i > 0; i--) per.push([i, NS]);
  for (let j = NS; j > 0; j--) per.push([0, j]);
  const bIdx = new Map();
  const bottom = (i, j) => { const key = j * W1 + i; if (!bIdx.has(key)) { bIdx.set(key, points.length); points.push([points[key][0], points[key][1], 0]); } return bIdx.get(key); };
  for (let p = 0; p < per.length; p++) {
    const [ia, ja] = per[p], [ib, jb] = per[(p + 1) % per.length];
    faces.push([ja * W1 + ia, bottom(ia, ja), bottom(ib, jb), jb * W1 + ib]);
  }
  const c0 = points.length;
  points.push([wX((XMIN + XMAX) / 2), -Z0, 0]);
  for (let p = 0; p < per.length; p++) {
    const [ia, ja] = per[p], [ib, jb] = per[(p + 1) % per.length];
    faces.push([c0, bottom(ib, jb), bottom(ia, ja)]);
  }
  return J.primitives.polyhedron({ points, faces, orientation: 'outward' });
}
