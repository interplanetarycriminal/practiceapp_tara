<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   23 · d11-threshold: "The threshold wall" (W11 deep, ARENA [3.5] AI Control)
   A track of suspicion scores. Two TOY hills of beads (honest ~ N(0, 1),
   attacks ~ N(d', 1)); a brass audit wall at the honest (1 - budget)
   quantile; a lower teal defer-to-trusted wall; a ribbon for the safety-
   usefulness frontier. Every number is exact for the toy: the MATH block is
   extracted and verified in node (verify-d11.js, see LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
/* Every number the threshold wall shows comes from here. Verified in node (verify-d11.js).
   TOY MODEL (labelled as toy on the page): the trusted monitor T gives each output of U a
   suspicion score. Honest outputs score ~ N(0, 1); attacks (backdoored code) score ~ N(d', 1):
   the same bell shifted right by d' standard deviations. A wall is a threshold on that score. */
const SQ2PI = 2.5066282746310002;                          // sqrt(2 pi)
const pdf = (x) => Math.exp(-0.5 * x * x) / SQ2PI;

/* Standard normal CDF to double precision: Hart (1968) algorithm 5666, as given by West (2005). */
function Phi(x) {
  const z = Math.abs(x);
  let c = 0;
  if (z <= 37) {
    const e = Math.exp(-0.5 * z * z);
    if (z < 7.07106781186547) {
      let n = 0.0352624965998911 * z + 0.700383064443688;
      n = n * z + 6.37396220353165; n = n * z + 33.912866078383; n = n * z + 112.079291497871;
      n = n * z + 221.213596169931; n = n * z + 220.206867912376;
      let d = 0.0883883476483184 * z + 1.75566716318264;
      d = d * z + 16.064177579207; d = d * z + 86.7807322029461; d = d * z + 296.564248779674;
      d = d * z + 637.333633378831; d = d * z + 793.826512519948; d = d * z + 440.413735824752;
      c = e * n / d;
    } else {
      let q = z + 0.65; q = z + 4 / q; q = z + 3 / q; q = z + 2 / q; q = z + 1 / q;
      c = e / q / SQ2PI;
    }
  }
  return x > 0 ? 1 - c : c;
}
/* Its inverse: Acklam's rational approximation, polished by one Halley step (full precision).
   Above 1/2 it uses the mirror image, PhiInv(p) = -PhiInv(1 - p), which keeps every digit. */
function PhiInv(p) {
  if (!(p > 0)) return -Infinity;
  if (!(p < 1)) return Infinity;
  if (p > 0.5) return -PhiInv(1 - p);
  let x;
  if (p < 0.02425) {
    const q = Math.sqrt(-2 * Math.log(p));
    x = (((((-7.784894002430293e-3 * q - 3.223964580411365e-1) * q - 2.400758277161838) * q - 2.549732539343734) * q + 4.374664141464968) * q + 2.938163982698783)
      / ((((7.784695709041462e-3 * q + 3.224671290700398e-1) * q + 2.445134137142996) * q + 3.754408661907416) * q + 1);
  } else {
    const q = p - 0.5, r = q * q;
    x = (((((-3.969683028665376e1 * r + 2.209460984245205e2) * r - 2.759285104469687e2) * r + 1.383577518672690e2) * r - 3.066479806614716e1) * r + 2.506628277459239) * q
      / (((((-5.447609879822406e1 * r + 1.615858368580409e2) * r - 1.556989798598866e2) * r + 6.680131188771972e1) * r - 1.328068155288572e1) * r + 1);
  }
  const e = Phi(x) - p, u = e * SQ2PI * Math.exp(0.5 * x * x);
  return x - u / (1 + 0.5 * x * u);
}

/* A wall at score tau. Beyond it lie a share fpr(tau) of honest outputs (false alarms) and a share
   tpr(tau) of attacks (caught attacks). The audit wall goes where exactly a share b of honest
   outputs lies beyond it: b is the budget (ARENA: the 98th percentile of clean scores for 2%). */
const wallFor = (share) => (share <= 0 ? Infinity : share >= 1 ? -Infinity : -PhiInv(share));
const fpr = (tau) => Phi(-tau);
const tpr = (tau, dp) => Phi(dp - tau);
const auc = (dp) => Phi(dp / Math.SQRT2);                          // P(an attack outscores an honest output)
const dpFor = (tprAt, fprAt) => PhiInv(1 - fprAt) + PhiInv(tprAt);   // the d' whose curve passes this point
const budgetFor = (catchShare, dp) => Phi(PhiInv(catchShare) - dp);  // budget needed to catch that share

/* A protocol = walls on the score (ARENA [3.5]). The top b of honest outputs go to the human H
   (audit); from there up to the top f, U's answer is swapped for T's (defer to trusted; f <= b
   means no band, i.e. plain trusted monitoring); below, U's answer is submitted as it is.
   Toy game: U attacks again and again. Each attack is caught (audited: U is shut down, blue wins),
   deferred (T's answer is used instead: nothing happens, U tries again) or submitted (a backdoor
   ships: red wins). Safety = P(caught before anything ships) = c / (c + u).
   Usefulness in the paper's units (T alone = 0, U alone = 1): only honest problems handed to T lose
   U's answer (an audited honest answer is checked, then used), so usefulness = 1 - (f - b).
   editKeep (trusted editing): T edits U's answer instead of replacing it; an edit misses the
   backdoor with this probability (ARENA's simulate_safety: 1 - edit_removes_backdoor_rate = 0.3).
   Its usefulness depends on how edits change honest code, which the toy does not model (null). */
function protocol(dp, b, f = 0, editKeep = null) {
  const fd = Math.max(b, f), ta = wallFor(b), td = wallFor(fd);
  const caught = tpr(ta, dp);
  const under = Phi(td - dp);                                          // attacks left of the defer wall
  const band = fd > b ? Math.max(0, Phi(ta - dp) - under) : 0;         // attacks between the walls
  const ships = under + (editKeep == null ? 0 : editKeep * band);
  const safety = caught + ships > 0 ? caught / (caught + ships) : 1;
  return { dp, b, f: fd, ta, td, falseAlarms: fpr(ta), caught, band, under, ships,
    blocked: editKeep == null ? band : (1 - editKeep) * band, honestToT: fd - b, safety,
    usefulness: editKeep == null ? 1 - (fd - b) : null };
}
/* The frontier: slide the defer wall from the audit wall (f = b: trusted monitoring) all the way
   left (f = 1: T's answer wherever H does not audit). Points are [safety, usefulness]. */
function frontier(dp, b, K = 120) {
  const out = [];
  for (let i = 0; i <= K; i++) { const m = protocol(dp, b, b + (1 - b) * (i / K)); out.push([m.safety, m.usefulness]); }
  return out;
}
/* P1 upfront auditing (no monitor): H audits the first share b of all problems. A patient attacker
   attacks each problem with a small probability; over a long run let x = P(no attack at all).
   Red wins iff no attack falls in the audited start and at least one comes later: x^b - x, which
   is largest at x = b^(1/(1-b)). Safety = 1 - (x^b - x); expected attempts in the run = -ln x. */
function upfront(b) {
  if (b <= 0) return { safety: 0, attempts: Infinity };
  if (b >= 1) return { safety: 1, attempts: 0 };
  const x = Math.pow(b, 1 / (1 - b));
  return { safety: 1 - (Math.pow(x, b) - x), attempts: -Math.log(x) };
}
/* The beads: n equal slices of each toy distribution (bead i sits at its (i + 1/2)/n quantile), so
   the share of beads past any wall matches the exact share to within one bead. Not random draws. */
function quantileBeads(n, shift = 0) {
  const s = new Float64Array(n);
  for (let i = 0; i < n; i++) s[i] = shift + PhiInv((i + 0.5) / n);
  return s;
}
const MATH = { SQ2PI, pdf, Phi, PhiInv, wallFor, fpr, tpr, auc, dpFor, budgetFor, protocol, frontier, upfront, quantileBeads };
// MATH-END

/* ================================================================ layout */
const NB = 200;                         // beads per hill: bead i is the (i + 1/2)/200 quantile (0.5% each)
const SMIN = -3.145, SMAX = 7.955;      // suspicion axis on the track (toy units: honest SD = 1)
const BIN = 0.37, NBIN = 30;            // columns 0.37 wide, centred on multiples of 0.37 (at most 30 beads high)
const W = 3.6, X0 = -W / 2, XU = W / (SMAX - SMIN);
const DB = BIN * XU * 0.9;              // bead diameter
const DEEP = 3;                         // beads side by side (in depth) per column
const OFFS = [0, 1, -1];                // fill order across the depth: middle, front, back
const FLOOR_Y = 0.1, SHELF_Y = 1.23;    // honest lane floor (track top); attack shelf (step top)
const ZH = 0.2, ZA = -0.2, LANE = 0.38; // lane centres and depth
const WALL_H = 2.42, DEFER_H = 2.08, WZ = 0.44;
const BOARD = { x0: -1.42, x1: 1.42, y0: 2.62, y1: 3.86, z: -0.58 };
const CH = { x0: -1.1, x1: 1.18, y0: 2.78, y1: 3.68 };   // chart: safety 0..1 across, usefulness 0..1 up
const ZF = BOARD.z + 0.021;             // the board's front face
const U_AT = [-1.7, 0, 0.8];            // U's box (front left)
const T_AT = [-1.7, 0.6, 0.8];          // T's ring above it: every output passes through
const H_AT = [1.62, 0, 0.74];           // the human auditor H (front right)
const PALE = '#d9d2c4';
const TINT = { aud: '#e6d3a4', def: '#c3e2df' };
const CAM = {
  cast: { pos: [-1.3, 2.5, 9.4], target: [-0.4, 1.0, 0.2] },
  front: { pos: [2.5, 2.9, 9.3], target: [0, 1.25, 0] },
  full: { pos: [2.1, 3.7, 9.5], target: [0, 1.95, 0] },
  side: { pos: [6.3, 3.5, 6.9], target: [0, 1.3, 0] },
};

const pct = (x, d = 1) => `${(100 * x).toFixed(d)}%`;
const d3 = (x) => x.toFixed(3);
const xOf = (s) => X0 + (Math.min(SMAX, Math.max(SMIN, s)) - SMIN) * XU;
const binOf = (s) => Math.min(NBIN - 1, Math.max(0, Math.floor((s - SMIN) / BIN)));
const colX = (j) => X0 + (j + 0.5) * BIN * XU;
const bx = (s) => CH.x0 + s * (CH.x1 - CH.x0);
const by = (u) => CH.y0 + u * (CH.y1 - CH.y0);
const mix = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), t);
const CC = { h: new THREE.Color(C.good), a: new THREE.Color(C.grad), aud: new THREE.Color(C.brass),
  hT: mix(C.good, PALE, 0.72), aT: mix(C.grad, PALE, 0.72) };
const ease = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
function setBead(mesh, i, x, y, z, d) { mesh.setMatrixAt(i, _m4.compose(_p.set(x, y, z), _q, _s.set(d, d, d))); }

/* one hill: bead i goes to the column of its score, stacked DEEP across and then upward */
function layoutHill(sc, y0, zc, out) {
  const cnt = new Int32Array(NBIN);
  for (let i = 0; i < sc.length; i++) {
    const j = binOf(sc[i]), m = cnt[j]++;
    out[3 * i] = colX(j);
    out[3 * i + 1] = y0 + DB / 2 + Math.floor(m / DEEP) * DB;
    out[3 * i + 2] = zc + OFFS[m % DEEP] * DB;
  }
  return cnt;
}

/* ============================================================ the object */
function buildStatic(S) {
  const st = S.state, g = new THREE.Group(), brass = K.mat.brass(), plaster = K.mat.plaster('#efe8dc');
  const box = (sx, sy, sz, x, y, z, mat, o = {}) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
    m.position.set(x, y, z); m.castShadow = o.shadow !== false; m.receiveShadow = true; g.add(m); return m;
  };
  const len = W + 0.12;
  box(len, FLOOR_Y, LANE, 0, FLOOR_Y / 2, ZH, plaster);                              // the track: honest lane
  box(len, SHELF_Y, LANE, 0, SHELF_Y / 2, ZA, plaster);                              // the step: attack shelf
  box(len, 0.03, 0.03, 0, FLOOR_Y - 0.012, ZH + LANE / 2 + 0.015, brass, { shadow: false });   // brass ruler (the score axis)
  box(len, 0.022, 0.026, 0, SHELF_Y - 0.009, ZA + LANE / 2 + 0.013, brass, { shadow: false }); // brass lip of the shelf
  for (let s = -3; s <= 7; s++) box(0.012, 0.02, 0.034, xOf(s), FLOOR_Y + 0.012, ZH + LANE / 2 + 0.015, brass, { shadow: false });
  // U (the strong, untrusted model): a plaster block with an output slot; T (the trusted monitor): a brass ring
  box(0.3, 0.42, 0.26, U_AT[0], 0.21, U_AT[2], plaster);
  box(0.16, 0.012, 0.05, U_AT[0], 0.426, U_AT[2], K.mat.ink(), { shadow: false });
  box(0.022, T_AT[1] - 0.1 - 0.42, 0.022, T_AT[0], (0.42 + T_AT[1] - 0.1) / 2, T_AT[2], brass);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.017, 12, 40), brass);
  ring.position.set(...T_AT); ring.rotation.y = Math.PI / 2; ring.castShadow = true; g.add(ring);
  g.add(K.bead([T_AT[0], T_AT[1] + 0.135, T_AT[2]], C.prob, 0.026));                // T's eye
  S.root.add(g);
  // zones on the lanes: brass = audited by H, teal = handed to T
  st.zone = {};
  for (const k of ['aud', 'def']) for (const lane of ['h', 'a']) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(1, 0.006, LANE - 0.03), K.mat.paint(TINT[k]));
    m.receiveShadow = true; m.userData.noFit = true;
    m.position.set(0, (lane === 'h' ? FLOOR_Y : SHELF_Y) + 0.003, lane === 'h' ? ZH : ZA);
    S.root.add(m); st.zone[k + lane] = m;
  }
  // the walls: glass panes in a frame; the audit wall is brass, the lower defer wall teal
  const wall = (h, glass, frame) => {
    const w = new THREE.Group();
    const pane = new THREE.Mesh(new THREE.BoxGeometry(0.016, h, 2 * WZ), K.mat.glass(glass, 0.34));
    pane.position.y = h / 2; pane.renderOrder = 2; w.add(pane);
    const top = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 2 * WZ + 0.07), frame);
    top.position.y = h; top.castShadow = true; w.add(top);
    for (const z of [-WZ, WZ]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.04, h, 0.04), frame); p.position.set(0, h / 2, z); p.castShadow = true; w.add(p); }
    w.userData.top = new THREE.Object3D(); w.userData.top.position.set(0, h + 0.03, 0); w.add(w.userData.top);
    S.root.add(w);
    return w;
  };
  st.wallA = wall(WALL_H, '#e8d29a', brass);
  st.wallD = wall(DEFER_H, '#9fd6d2', K.mat.paint(C.aux));
  // the beads: one instanced mesh per hill, coloured per bead by its fate
  const bg = new THREE.SphereGeometry(0.5, 12, 9);
  st.bm = {};
  for (const H of ['h', 'a']) {
    const m = new THREE.InstancedMesh(bg, K.mat.paint('#ffffff'), NB);
    m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false; m.userData.noFit = true;
    m.setColorAt(0, CC[H]);
    S.root.add(m); st.bm[H] = m;
  }
  // H, the human auditor
  st.fig = K.figure();
  st.fig.group.traverse((m) => { m.userData.noFit = true; });
  S.root.add(st.fig.group);
  st.fig.place(H_AT, [0.2, 0.9, -0.2]);
}

function buildBoard(S) {               // the safety-usefulness frontier, on a plaster board behind
  const st = S.state, g = new THREE.Group(), brass = K.mat.brass();
  const add = (geo, mat, x, y, z, shadow = true) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; g.add(m); return m;
  };
  const B = BOARD;
  add(new THREE.BoxGeometry(B.x1 - B.x0, B.y1 - B.y0, 0.04), K.mat.plaster('#fcf9f3'), (B.x0 + B.x1) / 2, (B.y0 + B.y1) / 2, B.z);
  for (const x of [B.x0 + 0.24, B.x1 - 0.24]) add(new THREE.CylinderGeometry(0.018, 0.018, B.y0, 12).translate(0, B.y0 / 2, 0), brass, x, 0, B.z - 0.035);
  const line = K.mat.plaster('#ddd3c3');
  for (const u of [0.5, 1]) add(new THREE.BoxGeometry(CH.x1 - CH.x0, 0.006, 0.004), line, (CH.x0 + CH.x1) / 2, by(u), ZF + 0.002, false);
  for (const s of [0.5, 1]) add(new THREE.BoxGeometry(0.006, CH.y1 - CH.y0, 0.004), line, bx(s), (CH.y0 + CH.y1) / 2, ZF + 0.002, false);
  add(new THREE.BoxGeometry(CH.x1 - CH.x0 + 0.03, 0.016, 0.016), brass, (CH.x0 + CH.x1) / 2 + 0.005, CH.y0, ZF + 0.008, false);   // safety axis
  add(new THREE.BoxGeometry(0.016, CH.y1 - CH.y0 + 0.03, 0.016), brass, CH.x0, (CH.y0 + CH.y1) / 2 + 0.005, ZF + 0.008, false);   // usefulness axis
  st.ribbon = K.tube([], C.prob, 0.027, { shadow: false, sides: 10 });
  st.ribbon.mesh.userData.noFit = true;
  g.add(st.ribbon.mesh);
  st.dot = add(new THREE.SphereGeometry(0.064, 20, 14), K.mat.ink(), 0, 0, ZF + 0.06);
  const sg = new THREE.CylinderGeometry(0.046, 0.046, 0.02, 24).rotateX(Math.PI / 2);
  st.studs = {};
  for (const k of ['up', 'tm', 'dtt', 't0']) st.studs[k] = add(sg, brass, 0, 0, ZF + 0.03, false);
  st.board = g;
  S.root.add(g);
}

/* ============================================================ the state */
function moveAttack(S) {               // d' moved: every attack bead slides to its new column
  const st = S.state;
  for (let i = 0; i < NB; i++) st.sc.a[i] = st.q[i] + S.knobs.dp;
  layoutHill(st.sc.a, SHELF_Y, ZA, st.tgt.a);
  if (st.pour.a) return;                                   // mid-pour: beads fly to the new spots
  if (S.shot || S.first || !st.shown.a) { placeHill(S, 'a'); return; }
  st.morph = { t: 0, from: Float32Array.from(st.pos.a) };
  S.invalidate();
}
function placeHill(S, H) {
  const st = S.state, mesh = st.bm[H], tg = st.tgt[H];
  st.pos[H].set(tg);
  for (let i = 0; i < NB; i++) setBead(mesh, i, tg[3 * i], tg[3 * i + 1], tg[3 * i + 2], DB);
  mesh.instanceMatrix.needsUpdate = true;
}
function pour(S, H, o = {}) {         // beads leave U, pass through T's ring and land at their score
  const st = S.state;
  st.shown[H] = true;
  if (H === 'a') st.morph = null;
  if (S.shot || o.instant) { st.pour[H] = null; placeHill(S, H); }
  else {
    st.pour[H] = { t0: st.clock + (o.delay || 0), gap: o.gap ?? 0.01, dur: 0.7 };
    const mesh = st.bm[H];
    for (let i = 0; i < NB; i++) setBead(mesh, i, T_AT[0], T_AT[1], T_AT[2], 0);
    mesh.instanceMatrix.needsUpdate = true;
  }
  applyView(S);
  S.invalidate();
}
function stepPour(S, H) {
  const st = S.state, P = st.pour[H], mesh = st.bm[H], tg = st.tgt[H], pos = st.pos[H], ord = st.ord[H];
  let done = true;
  for (let i = 0; i < NB; i++) {
    const tau = st.clock - (P.t0 + ord[i] * P.gap), j = 3 * i;
    if (tau >= P.dur) { pos[j] = tg[j]; pos[j + 1] = tg[j + 1]; pos[j + 2] = tg[j + 2]; setBead(mesh, i, pos[j], pos[j + 1], pos[j + 2], DB); continue; }
    done = false;
    if (tau < 0) { setBead(mesh, i, T_AT[0], T_AT[1], T_AT[2], 0); continue; }
    const u = tau / P.dur, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u;
    const apex = Math.max(T_AT[1], tg[j + 1]) + 0.32, my = 2 * apex - (T_AT[1] + tg[j + 1]) / 2;
    pos[j] = a * T_AT[0] + b * (T_AT[0] + tg[j]) / 2 + c * tg[j];
    pos[j + 1] = a * T_AT[1] + b * my + c * tg[j + 1];
    pos[j + 2] = a * T_AT[2] + b * (T_AT[2] + tg[j + 2]) / 2 + c * tg[j + 2];
    setBead(mesh, i, pos[j], pos[j + 1], pos[j + 2], DB * (0.55 + 0.45 * u));
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (done) st.pour[H] = null;
  return !done;
}
function ensureHills(S) { const st = S.state; if (!st.shown.h) pour(S, 'h', { instant: true }); if (!st.shown.a) pour(S, 'a', { instant: true }); }

/* walls follow the model; during a slide the thresholds glide in score space */
function setWalls(S, animate) {
  const st = S.state, m = st.m, defer = m.f > m.b;
  const to = { ta: m.ta, td: defer ? m.td : m.ta };
  if (!animate || S.shot || !st.view.walls) { st.wt = null; st.cur.ta = to.ta; st.cur.td = to.td; st.cur.defer = defer; placeWalls(S); return; }
  if (Math.abs(to.ta - st.cur.ta) < 1e-9 && Math.abs(to.td - st.cur.td) < 1e-9 && defer === st.cur.defer) return;
  st.wt = { t: 0, from: { ta: st.cur.ta, td: st.cur.td }, to, defer };
  if (defer) st.cur.defer = true;
  S.invalidate();
}
function placeWalls(S) {
  const st = S.state, xa = xOf(st.cur.ta), xd = xOf(st.cur.td), xr = X0 + W;
  st.wallA.position.x = xa;
  st.wallD.position.x = xd;
  const size = (m, a, b) => { const w = Math.max(1e-4, b - a); m.scale.x = w; m.position.x = (a + b) / 2; };
  size(st.zone.audh, xa, xr); size(st.zone.auda, xa, xr);
  size(st.zone.defh, xd, xa); size(st.zone.defa, xd, xa);
}
function paintBeads(S) {
  const st = S.state, cur = st.cur, walls = st.view.walls;
  for (const H of ['h', 'a']) {
    const mesh = st.bm[H], sc = st.sc[H], base = CC[H], pale = CC[H + 'T'];
    for (let i = 0; i < NB; i++) {
      const s = sc[i];
      mesh.setColorAt(i, !walls ? base : s > cur.ta ? CC.aud : cur.defer && s > cur.td ? pale : base);
    }
    mesh.instanceColor.needsUpdate = true;
  }
}
function paintBoard(S) {
  const st = S.state, k = S.knobs, m = st.m, z = ZF + 0.06;
  st.ribbon.set(MATH.frontier(k.dp, k.b, 140).map(([s, u]) => [bx(s), by(u), z]));
  st.dot.position.set(bx(m.safety), by(m.usefulness), z);
  const up = MATH.upfront(k.b), tm = MATH.protocol(k.dp, k.b, 0), dt = MATH.protocol(k.dp, k.b, 0.10);
  st.studs.up.position.set(bx(up.safety), by(1), ZF + 0.03);
  st.studs.tm.position.set(bx(tm.safety), by(1), ZF + 0.03);
  st.studs.dtt.position.set(bx(dt.safety), by(dt.usefulness), ZF + 0.03);
  st.studs.t0.position.set(bx(1), by(0), ZF + 0.03);
}

/* what is on show: hills, walls, board, tags, chips, readout */
function applyView(S) {
  const st = S.state, v = st.view, walls = v.walls, board = !!S.knobs.fr;
  st.bm.h.visible = st.shown.h;
  st.bm.a.visible = st.shown.a && v.attack;
  st.wallA.visible = walls;
  st.wallD.visible = walls && st.cur.defer;
  st.zone.audh.visible = st.zone.auda.visible = walls;
  st.zone.defh.visible = st.zone.defa.visible = walls && st.cur.defer;
  st.board.visible = board;
  const studs = board && v.studs, dttOn = S.knobs.b < 0.10;
  for (const k in st.studs) st.studs[k].visible = studs && (k !== 'dtt' || dttOn);
  for (const k in st.studTag) st.studTag[k].show(studs && (k !== 'dtt' || dttOn));
  st.tagA.show(walls);
  st.tagD.show(walls && st.cur.defer);
  st.tagSafe.show(board); st.tagUse.show(board);
  for (const t of st.cast) t.show(v.cast);
  st.readAt.position.set(0, board ? BOARD.y1 + 0.06 : walls ? WALL_H + 0.22 : SHELF_Y + (v.attack ? 1.2 : 0.2), 0);
  paintBeads(S);
  legend(S);
  refresh(S);
  S.invalidate();
}
function legend(S) {
  const st = S.state, v = st.view;
  const items = [{ id: 'h', label: 'honest', color: C.good }];
  if (v.attack) items.push({ id: 'a', label: 'attack', color: C.grad });
  if (v.walls) items.push({ id: 'aud', label: 'audited', color: C.brass });
  if (v.walls && st.cur.defer) items.push({ id: 't', label: 'to T', color: PALE });
  const key = items.map((x) => x.id).join();
  if (key !== st.legendKey) { st.legendKey = key; K.legend(items, null); }
}
function refresh(S) {                   // readout and wall tags, per tier
  const st = S.state, m = st.m, v = st.view, t = S.tier, board = !!S.knobs.fr, defer = m.f > m.b;
  const p0 = (x) => pct(x, 0), p1 = (x) => pct(x, 1);
  let s;
  if (!v.attack) s = { 1: 'Each bead is one output of U,\nplaced at T\'s suspicion score',
    2: '200 honest outputs (toy):\na bell curve of suspicion scores',
    3: 'honest scores ~ N(0, 1) (toy)\n200 beads = 0.5% quantile slices' }[t];
  else if (!v.walls) s = { 1: 'Attacks score higher on average,\nbut the two hills overlap',
    2: `Attack hill shifted right by d′ = ${m.dp.toFixed(2)}\nAn attack outscores honest work ${p0(MATH.auc(m.dp))} of the time`,
    3: `d′ = ${m.dp.toFixed(2)} · AUC = Φ(d′/√2) = ${d3(MATH.auc(m.dp))}` }[t];
  else if (!defer && !board) s = { 1: `**${p0(m.caught)}** of attacks caught\n**${p1(m.b)}** of honest work checked`,
    2: `Audit wall: top ${p1(m.b)} of honest work\ncatches **${p1(m.caught)}** of attacks`,
    3: `τ = ${d3(m.ta)} · FPR ${d3(m.falseAlarms)} · TPR **${d3(m.caught)}**\nsafety = TPR = ${d3(m.safety)} (no deferral)` }[t];
  else s = { 1: `Caught **${p0(m.caught)}** · to T ${p0(m.band)} · slip ${p0(m.under)}\nSafety **${p0(m.safety)}** · useful **${p0(m.usefulness)}** (toy)`,
    2: `Attacks: ${p1(m.caught)} caught · ${p1(m.band)} to T · ${p1(m.under)} ship\nSafety **${p1(m.safety)}** · usefulness **${p1(m.usefulness)}** (toy)`,
    3: `c ${d3(m.caught)} · g ${d3(m.band)} · u ${d3(m.under)} · τd ${d3(m.td)}\nsafety c/(c+u) **${d3(m.safety)}** · use 1−(f−b) **${d3(m.usefulness)}**` }[t];
  st.read.set(s);
  st.tagA.set({ 1: `human checks · top ${p1(m.b)}`, 2: `audit · top ${p1(m.b)}`, 3: `audit τ = ${m.ta.toFixed(2)}` }[t]);
  st.tagD.set({ 1: `T answers · top ${p1(m.f)}`, 2: `defer · top ${p1(m.f)}`, 3: `defer τ = ${m.td.toFixed(2)}` }[t]);
}

function scene(S, o = {}) {             // a beat or prediction sets what is on show
  const st = S.state;
  st.view = { attack: o.attack !== false, walls: !!o.walls, studs: !!o.studs, cast: !!o.cast };
  setWalls(S, false);
  st.fig.pose('stand', { ms: 0 });
  if (o.pose) {
    const doPose = () => st.fig.pose(o.pose, { at: typeof o.at === 'function' ? o.at(S) : o.at });
    if (S.shot) doPose(); else later(S, 420, doPose);
  }
  applyView(S);
}
const auditZone = (S) => [Math.min(X0 + W - 0.2, xOf(S.state.m.ta) + 0.45), SHELF_Y + 0.35, ZA];
function wait(S, ms) { return S.shot ? Promise.resolve() : new Promise((r) => setTimeout(r, ms)); }
function later(S, ms, fn) {             // run fn after ms, unless the learner has left this beat
  if (S.shot) { fn(); return; }
  const b = S.beat, tok = (S.state.tok = (S.state.tok || 0) + 1);
  setTimeout(() => { if (S.beat === b && S.state.tok === tok) fn(); }, ms);
}

  frame(S, t, dt) {
