<meta name="description" content="run_with_cache hands you a cabinet: every activation of GPT-2 small in a named drawer, one index card per token. Shapes, shorthand, hooks and the KV cache, with the real names and shapes from ARENA.">

  }

</style>

<body>
<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   12 · d06-shelf: "The activation shelf" (W6 deep, ARENA [1.1] + [1.2], TransformerLens)
   The cabinet is the ActivationCache that run_with_cache returns for GPT-2 small:
   rows = the 17 hook points of a block in computation order (bottom to top), columns =
   blocks, one index card per token in every drawer. Names and shapes come from the
   SHELF block, checked in node against the table ARENA prints from a real 35-token run
   and against an independent Python implementation (see LEDGER.md).
   ========================================================================= */

// SHELF-BEGIN
/* GPT-2 small as TransformerLens builds it (HookedTransformer "gpt2-small" config) and the
   cache run_with_cache returns. Every name and shape here is checked in node against the
   list ARENA prints from a real run (reference_text, 35 tokens) and against an independent
   Python re-implementation (see LEDGER.md). */
const CFG = { n_layers: 12, d_model: 768, n_heads: 12, d_head: 64, d_mlp: 3072, d_vocab: 50257, n_ctx: 1024 };
const REAL_SEQ = 35;                       // ARENA's printed run: reference_gpt2.run_with_cache(tokens), tokens (1, 35)
const dimSize = (d, seq) => ({ batch: 1, pos: seq, query_pos: seq, key_pos: seq, d_model: CFG.d_model,
  head_index: CFG.n_heads, d_head: CFG.d_head, d_mlp: CFG.d_mlp, d_vocab: CFG.d_vocab, 1: 1 })[d];
const mk = (key, short, ln, dims, where) => ({ key, short, ln, dims: dims.split(' '), where });
// one block's 17 hook points, in the order the block computes (and the cache stores) them
const BLOCK = [
  mk('hook_resid_pre', 'resid_pre', null, 'batch pos d_model', 'attn'),
  mk('ln1.hook_scale', 'scale', 'ln1', 'batch pos 1', 'attn'),
  mk('ln1.hook_normalized', 'normalized', 'ln1', 'batch pos d_model', 'attn'),
  mk('attn.hook_q', 'q', null, 'batch pos head_index d_head', 'attn'),
  mk('attn.hook_k', 'k', null, 'batch pos head_index d_head', 'attn'),
  mk('attn.hook_v', 'v', null, 'batch pos head_index d_head', 'attn'),
  mk('attn.hook_attn_scores', 'attn_scores', null, 'batch head_index query_pos key_pos', 'attn'),
  mk('attn.hook_pattern', 'pattern', null, 'batch head_index query_pos key_pos', 'attn'),
  mk('attn.hook_z', 'z', null, 'batch pos head_index d_head', 'attn'),
  mk('hook_attn_out', 'attn_out', null, 'batch pos d_model', 'attn'),
  mk('hook_resid_mid', 'resid_mid', null, 'batch pos d_model', 'mlp'),
  mk('ln2.hook_scale', 'scale', 'ln2', 'batch pos 1', 'mlp'),
  mk('ln2.hook_normalized', 'normalized', 'ln2', 'batch pos d_model', 'mlp'),
  mk('mlp.hook_pre', 'pre', null, 'batch pos d_mlp', 'mlp'),
  mk('mlp.hook_post', 'post', null, 'batch pos d_mlp', 'mlp'),
  mk('hook_mlp_out', 'mlp_out', null, 'batch pos d_model', 'mlp'),
  mk('hook_resid_post', 'resid_post', null, 'batch pos d_model', 'mlp'),
];
const EMBEDS = [mk('hook_embed', 'embed', null, 'batch pos d_model', 'in'), mk('hook_pos_embed', 'pos_embed', null, 'batch pos d_model', 'in')];
const FINAL = [mk('ln_final.hook_scale', 'scale', 'ln_final', 'batch pos 1', 'out'), mk('ln_final.hook_normalized', 'normalized', 'ln_final', 'batch pos d_model', 'out')];
const LOGITS = mk('logits', 'logits', null, 'batch pos d_vocab', 'ret');     // the return value, not a cache entry
const HOOKS = [...EMBEDS, ...BLOCK, ...FINAL];
const hookById = new Map(HOOKS.map((h) => [h.key, h]));
const isBlock = (h) => BLOCK.includes(h);

// every cache key, in the order run_with_cache stores them
function cacheKeys(n_layers = CFG.n_layers) {
  const out = EMBEDS.map((h) => ({ name: h.key, h, layer: null }));
  for (let l = 0; l < n_layers; l++) for (const h of BLOCK) out.push({ name: `blocks.${l}.${h.key}`, h, layer: l });
  for (const h of FINAL) out.push({ name: h.key, h, layer: null });
  return out;
}
const fullName = (h, layer) => (isBlock(h) ? `blocks.${layer}.${h.key}` : h.key);
function shapeOf(h, seq, removeBatch = false) {
  const dims = removeBatch ? h.dims.slice(1) : h.dims;
  return { dims, sizes: dims.map((d) => dimSize(d, seq)) };
}
const numel = (sizes) => sizes.reduce((a, b) => a * b, 1);
const perToken = (h, seq) => numel(shapeOf(h, seq).sizes) / seq;    // floats stored per position (batch 1)
// the shorthand ARENA uses: cache["pattern", 0], cache["normalized", 0, "ln1"], cache["embed"];
// ln_final is written out in full, as ARENA writes it: cache["ln_final.hook_scale"]
function shorthand(h, layer) {
  if (isBlock(h)) return h.ln ? `cache["${h.short}", ${layer}, "${h.ln}"]` : `cache["${h.short}", ${layer}]`;
  if (h.ln === 'ln_final') return `cache["${h.key}"]`;
  return `cache["${h.short}"]`;
}
function actName(h, layer) {
  if (isBlock(h)) return h.ln ? `utils.get_act_name("${h.short}", ${layer}, "${h.ln}")` : `utils.get_act_name("${h.short}", ${layer})`;
  return null;
}
function cacheFloats(seq, n_layers = CFG.n_layers) {
  let s = 0;
  for (const k of cacheKeys(n_layers)) s += numel(shapeOf(k.h, seq).sizes);
  return s;
}
// KV cache, as ARENA's KeyValueCache: one tensor (n_layers, 2, batch, seq_len, n_heads, d_head)
const kvShape = (L) => [CFG.n_layers, 2, 1, L, CFG.n_heads, CFG.d_head];
const kvBytes = (L, bytes) => numel(kvShape(L)) * bytes;          // = 2 * 12 * 768 * L * bytes
/* Work to run a P-token prompt and then feed s more tokens one at a time.
   positions: token positions pushed through the 12 blocks (every matmul runs once per position).
   qk: query-key dot products per head per layer, counted as ARENA's einsum computes them
       (the full L x L grid, masked afterwards; with the cache, 1 new query x L keys). */
function kvWork(P, s) {
  let posWith = P, posWithout = P, qkWith = P * P, qkWithout = P * P;
  for (let i = 1; i <= s; i++) { const L = P + i; posWith += 1; posWithout += L; qkWith += L; qkWithout += L * L; }
  return { L: P + s, posWith, posWithout, qkWith, qkWithout };
}
const SHELF = { CFG, REAL_SEQ, BLOCK, EMBEDS, FINAL, LOGITS, HOOKS, hookById, cacheKeys, fullName, shapeOf, numel, perToken, shorthand, actName, cacheFloats, kvShape, kvBytes, kvWork };
// SHELF-END

/* ============================================================ layout */
// A drawer's front is as wide as the floats each token stores there, on a square-root scale
// (so 3072 reads twice as wide as 768, and a 1-float LayerNorm scale is a slot). Every drawer is
// as deep as the sequence: it holds one index card per token.
const W768 = 0.25;
const wOf = (n) => Math.max(0.05, W768 * Math.sqrt(n / 768));
const DH = 0.12, RP = 0.16, Y0 = 0.1;               // drawer front height, row pitch, lowest row
const CPW = 0.64, GW = 0.26, LBW = 0.98, SIDE = 0.04;
const ZF = 0.35;                                    // the plane of the drawer fronts
const depthOf = (L) => 0.14 + 0.0095 * L;
const RACK = 0.075;                                 // KV rack: row pitch on the plinth
const zRack = (row) => ZF + 0.16 + row * RACK;
const zTokens = (G, kv) => ZF + (kv ? 0.185 + 2 * G.n * RACK : 0.52);
const NROW = 21;                                    // embed, pos_embed, 17 block rows, ln_final x2
const yRow = (g) => Y0 + g * RP;                    // bottom of row g's drawer front
const HEADS = new Set(['attn.hook_q', 'attn.hook_k', 'attn.hook_v', 'attn.hook_attn_scores', 'attn.hook_pattern', 'attn.hook_z']);
const MASKED = new Set(['attn.hook_attn_scores', 'attn.hook_pattern']);
const KVH = new Set(['attn.hook_k', 'attn.hook_v']);
const MAX_NEW = 24;                                 // KV mode: tokens you can add after the prompt
const COL = {
  carcass: '#e9e1d3', board: '#e4dac8', rail: '#d9cfbd', empty: '#fbf8f2', filled: '#a4c0f2', sel: '#3f74de',
  twin: '#3f74de', edited: '#c7b6f2', fresh: '#6f97e3', ghost: '#ede7dc', kv: '#5f8be0', divider: '#c9bfae', tray: '#efe7da',
  card: '#6f97e3', cardP: C.prob, cardNew: C.data, token: '#7ea2e6', tokenNew: C.data, cube: '#7ea2e6',
};
const CAM = {
  front: { pos: [2.0, 3.5, 11.0], target: [0, 1.6, 0.3] },          // far and narrow: little perspective
  high: { pos: [3.1, 5.2, 10.3], target: [0, 1.5, 0.35] },
  tray: { pos: [0.8, 2.95, 2.78], target: [0.04, 1.6, 0.56], fit: 1.1 },    // close-up on block 0's pattern drawer
  kv: { pos: [3.3, 5.8, 10.1], target: [0, 1.2, 0.6] },
};
const f2 = (v) => v.toFixed(2);
const int = (v) => Math.round(v).toLocaleString('en');
const mb = (b) => (b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(2) + ' MB' : (b / 1e3).toFixed(1) + ' kB');
const tup = (a) => `(${a.join(', ')}${a.length === 1 ? ',' : ''})`;
const STATIC = () => ({ fill: Infinity, pull: 1, flash: 0, clip: 0, cube: 1 });
const bytesOf = (k) => (k.dtype === 'fp16' ? 2 : 4);

function layout(S) {
  const k = S.knobs, st = S.state;
  const n = k.layers, L = st.L;
  const gap = n < CFG.n_layers;
  const TW = SIDE * 2 + LBW + n * CPW + (gap ? GW : 0);
  const x0 = -TW / 2, xLB = x0 + SIDE, xC0 = xLB + LBW;
  const colX = (c) => xC0 + (c + 0.5) * CPW;
  const xGap = xC0 + n * CPW + GW / 2;
  const D = depthOf(L);
  const xOut = gap ? xGap : colX(n - 1);
  const yTop = yRow(NROW) + 0.02;
  st.geo = { n, L, gap, TW, x0, xLB, xC0, colX, xGap, xOut, D, yTop };
  const dr = [];
  const add = (h, layer, x, g) => dr.push({ h, layer, x, g, y: yRow(g), w: wOf(perToken(h, L)), i: dr.length });
  add(EMBEDS[0], null, colX(0), 0);
  add(EMBEDS[1], null, colX(0), 1);
  for (let c = 0; c < n; c++) BLOCK.forEach((h, r) => add(h, c, colX(c), r + 2));
  add(FINAL[0], null, xOut, 19);
  add(FINAL[1], null, xOut, 20);
  st.drawers = dr;
  // computation order: embeds, block 0 bottom to top, block 1, ..., the hidden blocks, ln_final, logits
  const ord = [0, 1];
  for (let c = 0; c < n; c++) for (let r = 0; r < 17; r++) ord.push(2 + c * 17 + r);
  st.gapOrd = gap ? ord.length : -1;
  if (gap) ord.push('gap');
  ord.push(dr.length - 2, dr.length - 1, 'logits');
  st.order = ord;
  st.ordOf = new Map(ord.map((v, i) => [v, i]));
  st.nOrd = ord.length;
}
const selIndex = (S) => {
  const k = S.knobs, st = S.state;
  return st.drawers.findIndex((d) => d.h.key === k.hook && (d.layer == null || d.layer === Math.min(k.layer, k.layers - 1)));
};

function compute(S) {
  const st = S.state, k = S.knobs;
  if (k.layer > k.layers - 1) S.setKnob('layer', k.layers - 1, { silent: true });
  st.L = k.mode === 'kv' ? k.seq + st.s : k.seq;
  layout(S);
  st.sel = selIndex(S);
  st.clipOrd = k.mode === 'hooks' && st.sel >= 0 ? st.ordOf.get(st.sel) : null;
  fitProxy(S);
}

/* An invisible box tells the kit's framing how big the object is (instanced drawers don't report
   their extent). Beats reframe from scratch; knob changes only ever grow it. */
function fitProxy(S, reframe = false) {
  const st = S.state, G = st.geo;
  // just the cabinet (plus headroom for the read-out): anything wider or deeper would inflate the
  // turntable-safe fit cylinder beyond the plinth and shrink the drawers on a phone
  const back = ZF - G.D - 0.03, front = ZF + 0.02, top = G.yTop + 0.5;
  st.proxy.scale.set(G.TW, top, front - back);
  st.proxy.position.set(0, top / 2, (front + back) / 2);
  st.proxy.updateMatrixWorld();
  const size = [G.TW, G.yTop, front - back];
  if (reframe || S.first || !st.fitSize) { st.fitSize = size; return; }
  if (size.some((v, i) => v > st.fitSize[i] + 0.04)) { st.fitSize = size.map((v, i) => Math.max(v, st.fitSize[i])); S.stage.refit(); }
}

/* ============================================================ drawing */
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();
function put(mesh, i, x, y, z, sx, sy, sz, hex) {
  mesh.setMatrixAt(i, _m.compose(_p.set(x, y, z), _q.identity(), _s.set(sx, sy, sz)));
  if (hex != null) mesh.setColorAt(i, _c.set(hex));
}
function done(...ms) { for (const m of ms) { m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true; } }

function frontHex(S, d) {
  const st = S.state, k = S.knobs, A = st.A;
  const o = st.ordOf.get(d.i);
  if (k.mode === 'kv') return KVH.has(d.h.key) ? COL.kv : (A.flash > 0 && o < A.fill ? COL.filled : COL.ghost);
  if (d.i === st.sel) return COL.sel;
  if (st.twin === d.i) return COL.twin;
  if (o >= A.fill) return COL.empty;
  if (k.mode === 'hooks' && k.edit && st.clipOrd != null && o > st.clipOrd) return COL.edited;
  if (A.fill !== Infinity && o >= A.fill - 1.5) return COL.fresh;    // the pass is here right now
  return COL.filled;
}
// drawers pulled out: the selected one (cache and hooks modes) and its twin
function pulled(S) {
  const st = S.state, k = S.knobs;
  if (k.mode === 'kv') return [];
  const out = st.sel >= 0 ? [st.sel] : [];
  if (st.twin != null && st.twin >= 0) out.push(st.twin);
  return out;
}

function draw(S) {
  const st = S.state, k = S.knobs, G = st.geo, A = st.A;
  if (!G) return;
  const D = G.D, zBack = ZF - D - 0.03;
  // carcass: back, sides, top, bottom, label board, rails between rows, column dividers
  let nc = 0;
  const cx = 0, yT = G.yTop;
  put(st.carcass, nc++, cx, yT / 2, zBack - 0.015, G.TW, yT, 0.03, COL.carcass);
  put(st.carcass, nc++, G.x0 + SIDE / 2, yT / 2, ZF - D / 2 - 0.02, SIDE, yT, D + 0.04, COL.carcass);
  put(st.carcass, nc++, G.x0 + G.TW - SIDE / 2, yT / 2, ZF - D / 2 - 0.02, SIDE, yT, D + 0.04, COL.carcass);
  put(st.carcass, nc++, cx, yT + 0.015, ZF - D / 2 - 0.02, G.TW + 0.04, 0.03, D + 0.08, COL.carcass);
  put(st.carcass, nc++, cx, 0.03, ZF - D / 2 - 0.02, G.TW, 0.06, D + 0.04, COL.carcass);
  put(st.carcass, nc++, G.xLB + LBW / 2, yT / 2, ZF - D / 2 - 0.03, LBW, yT - 0.06, D, COL.board);
  const xa = G.xC0, xb = G.x0 + G.TW - SIDE;
  for (let g = 1; g < NROW; g++) put(st.carcass, nc++, (xa + xb) / 2, yRow(g) - (RP - DH) / 2, ZF - D / 2 - 0.02, xb - xa, 0.008, D, COL.rail);
  for (let c = 1; c <= G.n; c++) { const x = G.xC0 + c * CPW; put(st.carcass, nc++, x, yT / 2, ZF - D / 2 - 0.02, 0.008, yT - 0.06, D, COL.rail); }
  st.carcass.count = nc;

  // drawer fronts, knobs, head dividers
  const pulls = pulled(S);
  let nf = 0, nk = 0, nd = 0;
  const pullOf = (d) => (pulls.includes(d.i) ? (D - 0.03) * A.pull : 0);
  for (const d of st.drawers) {
    const z = ZF + pullOf(d), yc = d.y + DH / 2;
    put(st.fronts, nf++, d.x, yc, z - 0.012, d.w - 0.012, DH, 0.024, frontHex(S, d));
    put(st.knobs, nk++, d.x, yc, z + 0.006, 0.013, 0.013, 0.013);
    if (HEADS.has(d.h.key)) for (let j = 1; j < 12; j++) put(st.divs, nd++, d.x - (d.w - 0.012) / 2 + j * (d.w - 0.012) / 12, yc, z + 0.001, 0.0032, DH * 0.74, 0.003);
  }
  st.fronts.count = nf; st.knobs.count = nk; st.divs.count = nd;
  // the hidden blocks: ghost slots in the gap column, lit when the run passes
  let ng = 0;
  if (G.gap) {
    const lit = A.fill > st.gapOrd && k.mode !== 'kv';
    const hex = lit ? (k.mode === 'hooks' && k.edit && st.clipOrd != null && st.gapOrd > st.clipOrd ? COL.edited : COL.filled) : COL.ghost;
    for (let r = 0; r < 17; r++) put(st.ghost, ng++, G.xGap, yRow(r + 2) + DH / 2, ZF - 0.01, GW - 0.08, DH * 0.8, 0.02, hex);
  }
  st.ghost.count = ng;

  // pulled drawers: tray + one index card per token
  let nt = 0, nCard = 0;
  for (const i of pulls) {
    const d = st.drawers[i], z0 = ZF + pullOf(d);
    const len = D - 0.05, zc = z0 - 0.024 - len / 2;
    put(st.trays, nt++, d.x, d.y + 0.006, zc, d.w - 0.012, 0.012, len, COL.tray);
    put(st.trays, nt++, d.x - (d.w - 0.012) / 2 + 0.004, d.y + 0.03, zc, 0.008, 0.05, len);
    put(st.trays, nt++, d.x + (d.w - 0.012) / 2 - 0.004, d.y + 0.03, zc, 0.008, 0.05, len);
    const L = G.L, pitch = len / L, th = Math.min(0.012, pitch * 0.55), wIn = d.w - 0.034, hC = DH * 0.7;
    const masked = MASKED.has(d.h.key);
    for (let j = 0; j < L; j++) {
      const fill = masked ? (j + 1) / L : 1;               // causal mask: query j sees keys 0..j
      const w = Math.max(0.004, wIn * fill);
      const z = z0 - 0.024 - len + (j + 0.5) * pitch;       // position 0 at the back, the newest at the front
      put(st.cards, nCard++, d.x - wIn / 2 + w / 2, d.y + 0.012 + hC / 2, z, w, hC, th, d.h.key === 'attn.hook_pattern' ? COL.cardP : COL.card);
    }
  }
  st.trays.count = nt; st.cards.count = nCard;

  // tokens on the plinth in front (the input), and in KV mode the cache rack
  let nTok = 0, nCube = 0;
  const kv = k.mode === 'kv';
  const avail = G.TW - LBW - 0.1, pitchT = Math.min(0.07, avail / G.L), xT0 = G.xC0 + 0.02;
  const zTok = zTokens(G, kv);
  for (let j = 0; j < G.L; j++) {
    const isNew = kv && st.s > 0 && j === G.L - 1;
    const sc = isNew ? A.cube : 1;
    put(st.tokens, nTok++, xT0 + (j + 0.5) * pitchT, 0.012 * sc, zTok, pitchT * 0.78 * sc, 0.024 * sc, 0.1 * sc, isNew ? COL.tokenNew : COL.token);
  }
  st.rackRows = [];
  if (kv) {
    for (let c = 0; c < G.n; c++) for (let kvI = 0; kvI < 2; kvI++) {
      const row = c * 2 + kvI, z = zRack(row);
      put(st.rails, row, xT0 + (G.L * pitchT) / 2, 0.006, z, G.L * pitchT + 0.03, 0.012, 0.06);
      st.rackRows.push({ c, kvI, z });
      for (let j = 0; j < G.L; j++) {
        const isNew = st.s > 0 && j === G.L - 1, sc = isNew ? A.cube : 1;
        put(st.cubes, nCube++, xT0 + (j + 0.5) * pitchT, 0.012 + 0.024 * sc, z, pitchT * 0.72 * sc, 0.045 * sc, 0.05 * sc, isNew ? COL.cardNew : kvI ? '#86a8ea' : '#7098e0');
      }
    }
  }
  st.rails.count = kv ? G.n * 2 : 0;
  st.tokens.count = nTok; st.cubes.count = nCube;

  // logits: the return value, a wide tray on top (not a drawer: it is not in the cache)
  const wl = wOf(CFG.d_vocab);

    const rim = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.012, 1.02).translate(0, 0.056, 0), K.mat.brass());
    rim.userData.noFit = true; st.logits.add(rim);
    // the clip: a small brass clamp
    st.clip = new THREE.Group();
    const brass = K.mat.brass();
    for (const [x, y, z, sx, sy, sz] of [[0, 0.03, 0, 0.05, 0.012, 0.05], [0, 0.0, 0.022, 0.05, 0.07, 0.01], [0, 0.0, -0.022, 0.05, 0.07, 0.01], [0, 0.085, 0, 0.012, 0.1, 0.012]]) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), brass); m.position.set(x, y, z); m.castShadow = true; st.clip.add(m);
    }
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.007, 8, 20), brass); ring.position.set(0, 0.15, 0); st.clip.add(ring);
    st.clip.traverse((o) => { o.userData.noFit = true; });
    S.root.add(st.clip);
    st.proxy = new THREE.Mesh(box, new THREE.MeshBasicMaterial({ visible: false }));
    S.root.add(st.proxy);
    // labels
    st.rowLabels = [];
    for (let g = 0; g < NROW; g++) st.rowLabels.push(K.label([0, 0, 0], '', { cls: 'row', anchor: 'right', dx: -2, dy: 0, prio: 1 }));
    st.colTags = [0, 1].map(() => K.label([0, 0, 0], '', { cls: 'tag col', anchor: 'bottom', dy: -2 }));
    st.gapTag = K.label([0, 0, 0], '', { cls: 'tag vert', anchor: 'center' });
    st.logitsTag = K.label([0, 0, 0], '', { cls: 'tag col', anchor: 'center', prio: 0.5 });
    st.tokensTag = K.label([0, 0, 0], '', { cls: 'tag col', anchor: 'top', dy: 4 });
    st.rackTag = K.label([0, 0, 0], '', { cls: 'tag col', anchor: 'right', dx: -4, dy: 0 });
    st.readout = K.label([0, 0, 0], '', { cls: 'readout key', anchor: 'bottom', dy: -4 });
    st.note = K.label([0, 0, 0], '', { cls: 'note', anchor: 'top', dy: 6 });
    st.hookTag = K.label([0, 0, 0], '', { cls: 'tag col fn', anchor: 'left', dx: 4, dy: 0, prio: 1.5 });
    st.fig = K.figure();
    st.fig.group.visible = false;
    S.root.add(st.fig.group);
    // tap a drawer to read it; tap the tray for the logits
    S.stage.pick(st.fronts, (hit) => {
      const d = st.drawers && st.drawers[hit.instanceId];
      if (!d) return;
      const k = S.knobs;
      if (k.mode === 'kv') { K.toast('KV mode keeps only k and v: switch Mode to read other drawers'); return; }
      st.logitsSel = false;
      S.setKnobs({ hook: d.h.key, layer: d.layer ?? k.layer });
    });
    S.stage.pick(st.logits, () => { if (S.knobs.mode !== 'kv') { st.logitsSel = true; draw(S); } });
  },

  rebuild(S, id) {
    const st = S.state, k = S.knobs;
    const ch = S.changed || [];
    if (id === '*' && !S.first && ch.length && ch.every((c) => c === 'hook' || c === 'layer')) id = 'select';   // a tap
    if (id === '*') {                              // a beat or a prediction: its enter()/show() sets the scene
      st.animId++; st.A = STATIC(); st.s = 0;
      compute(S); fitProxy(S, true); applyTwin(S); draw(S);
      return;
    }
    if (id === 'mode' || id === 'seq') { st.s = 0; st.logitsSel = false; if (id === 'mode') st.noteMode = k.mode === 'kv' ? 'kv' : k.mode === 'hooks' ? 'hook' : 'cache'; }
    if (id === 'mode' && k.mode === 'hooks') { compute(S); applyTwin(S); runPass(S); return; }     // show the clip at work
    if (id === 'layers' || id === 'seq' || id === 'mode') { compute(S); applyTwin(S); newAnim(S); draw(S); return; }
    if (id === 'select' || id === 'hook' || id === 'layer') {
      compute(S); applyTwin(S);
      if (k.mode === 'hooks') { runPass(S); return; }
      pullOut(S); return;
    }
    if (id === 'edit' && k.mode === 'hooks') { runPass(S); return; }
    draw(S);
  },

  frame(S) { thinRows(S); return false; },
  onTier(S) { labels(S); },

  solids(S) {
    const st = S.state, G = st.geo, out = [];
    const cube = (x, y, z, sx, sy, sz) => J.primitives.cuboid({ size: [sx, sz, sy], center: [x, -z, y] });   // three (x,y,z) -> JSCAD (x,-z,y)
    const D = G.D;
    out.push(cube(0, G.yTop / 2, ZF - D / 2 - 0.02, G.TW, G.yTop, D + 0.04));
    for (const d of st.drawers) out.push(cube(d.x, d.y + DH / 2, ZF + 0.009, d.w - 0.012, DH, 0.03));      // fronts sink 6 mm into the carcass
    out.push(cube(0, G.yTop + 0.02, ZF - D / 2, wOf(CFG.d_vocab), 0.05, D));                                 // the logits tray, seated on top
    return out;
  },
