<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   15 · w08-twins: "The twin towers" (W8, ARENA [1.4.1] Indirect Object Identification)
   Every window, bar and needle is computed below by real forward passes of a
   tiny hand-built 4-layer x 3-head attention-only transformer (explicit weight
   matrices, softmax attention, causal mask, unembedding) that solves IOI with
   the circuit Wang et al. 2022 found in GPT-2 small: duplicate-token (0.1) ->
   S-inhibition (1.1) -> name mover (2.0), plus a negative name mover (2.2), a
   backup name mover (3.0) and bystander heads. Hand-built toy, not GPT-2.
   The patching functions and metrics carry ARENA's names and do what ARENA's
   solutions do. The MATH block is checked in node against an independent
   feature-level computation (see LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
/* The prompt, as ARENA [1.4.1] builds it: BOS + "When Mary and John went to the store, John gave a
   drink to" (15 tokens). The corrupted prompt flips only S2 (the second John) to Mary, exactly
   ARENA's corruption, so the right answer flips from Mary to John. */
const WORDS = ['BOS', 'When', 'Mary', 'and', 'John', 'went', 'to', 'the', 'store', ',', 'gave', 'a', 'drink'];
const NV = WORDS.length, BOS = 0, MARY = 2, JOHN = 4;
const clean_tokens = [BOS, 1, MARY, 3, JOHN, 5, 6, 7, 8, 9, JOHN, 10, 11, 12, 6];
const corrupted_tokens = clean_tokens.map((t, i) => (i === 10 ? MARY : t));
const answer_tokens = [MARY, JOHN];                 // [correct, incorrect] for the clean prompt
const NP = clean_tokens.length, N_LAYERS = 4, N_HEADS = 3;
const POSN = { IO: 2, S1: 4, S2: 10, END: 14 };
/* residual stream d_model = 50 in named blocks. POS is added to the query/key inputs only
   ("shortformer" positions, as in ARENA's attn-only models), never to the stream. */
const O = { TOK: 0, NAME: 13, ONE: 15, DUP: 16, INH: 18, OUT: 20, SCR: 22, POS: 35 }, D = 50, DH = 16;
const HP = { bd: 10, sd: 6, gs: 10, ss: 4, alpha: 6, delta: 8, sn: 3, kappa: 4, kneg: 1, sb: 0, rho: 3, kb: 3, beta: 5, sbos: 6 };
const ROLES = [['prev', 'dup', 'cur'], ['bos', 'sinh', 'prev'], ['nm', 'bos', 'neg'], ['backup', 'cur', 'bos']];

const zeros = (r, c) => Array.from({ length: r }, () => new Float64Array(c));
/* The weights, set by hand. attn_scale = sqrt(d_head); a weight r(x) on both sides gives score x. */
function buildModel(p = HP) {
  const sc = Math.sqrt(DH), r = (x) => Math.sqrt(x * sc);
  const W_E = zeros(NV, D);
  for (let t = 0; t < NV; t++) { W_E[t][O.TOK + t] = 1; if (t !== BOS) W_E[t][O.ONE] = 1; }
  W_E[MARY][O.NAME] = 1; W_E[JOHN][O.NAME + 1] = 1;                  // "I am a name" features
  const W_pos = zeros(NP, D); for (let q = 0; q < NP; q++) W_pos[q][O.POS + q] = 1;
  const H = () => ({ W_Q: zeros(D, DH), W_K: zeros(D, DH), W_V: zeros(D, DH), W_O: zeros(DH, D) });
  const sinkQK = (h, s) => { h.W_Q[O.ONE][DH - 1] = r(s); h.W_K[O.TOK + BOS][DH - 1] = r(s); };
  const copyTokToScratch = (h) => { for (let t = 0; t < NV; t++) { h.W_V[O.TOK + t][t] = 1; h.W_O[t][O.SCR + t] = 1; } };
  // bystanders (their outputs land in SCR, which no later head reads)
  const prevTok = () => { const h = H(); for (let q = 0; q < NP; q++) { h.W_Q[O.POS + q][q] = r(p.beta); if (q + 1 < DH - 1) h.W_K[O.POS + q][q + 1] = r(p.beta); } copyTokToScratch(h); return h; };
  const curTok = () => { const h = H(); for (let q = 0; q < NP; q++) { h.W_Q[O.POS + q][q] = r(p.beta); h.W_K[O.POS + q][q] = r(p.beta); } copyTokToScratch(h); return h; };
  const bosHead = () => { const h = H(); sinkQK(h, p.sbos); copyTokToScratch(h); return h; };
  // 0.1 duplicate-token head: a name attends to an earlier copy of itself (not itself: positional
  // self-penalty), else rests on BOS. OV: NAME -> DUP ("my name appeared before").
  const dup = H();
  dup.W_Q[O.NAME][0] = r(p.bd); dup.W_K[O.NAME][0] = r(p.bd); dup.W_Q[O.NAME + 1][1] = r(p.bd); dup.W_K[O.NAME + 1][1] = r(p.bd);
  for (let q = 0; q < NP && 2 + q < DH - 1; q++) { dup.W_Q[O.POS + q][2 + q] = r(p.bd); dup.W_K[O.POS + q][2 + q] = -r(p.bd); }
  sinkQK(dup, p.sd);
  dup.W_V[O.NAME][0] = 1; dup.W_V[O.NAME + 1][1] = 1; dup.W_O[0][O.DUP] = 1; dup.W_O[1][O.DUP + 1] = 1;
  // 1.1 S-inhibition head: attend where DUP is loud; OV: DUP -> INH ("don't say this name")
  const sinh = H();
  sinh.W_Q[O.ONE][0] = r(p.gs); sinh.W_K[O.DUP][0] = r(p.gs); sinh.W_K[O.DUP + 1][0] = r(p.gs);
  sinkQK(sinh, p.ss);
  sinh.W_V[O.DUP][0] = 1; sinh.W_V[O.DUP + 1][1] = 1; sinh.W_O[0][O.INH] = 1; sinh.W_O[1][O.INH + 1] = 1;
  // name movers: score = alpha [key is a name] - delta <INH at query, NAME at key>; OV: NAME -> OUT x kappa
  const mover = (kap, sink) => {
    const h = H();
    h.W_Q[O.ONE][0] = r(p.alpha); h.W_K[O.NAME][0] = r(p.alpha); h.W_K[O.NAME + 1][0] = r(p.alpha);
    h.W_Q[O.INH][1] = -r(p.delta); h.W_K[O.NAME][1] = r(p.delta);
    h.W_Q[O.INH + 1][2] = -r(p.delta); h.W_K[O.NAME + 1][2] = r(p.delta);
    sinkQK(h, sink);
    h.W_V[O.NAME][0] = 1; h.W_V[O.NAME + 1][1] = 1; h.W_O[0][O.OUT] = kap; h.W_O[1][O.OUT + 1] = kap;
    return h;
  };
  const nm = mover(p.kappa, p.sn), neg = mover(-p.kneg, p.sn), backup = mover(p.kb, p.sb);
  // 3.0 backup name mover: its BOS-sink score also grows with what is already in OUT (rho per unit),
  // so it rests on BOS while 2.0 has done the job, and moves the name itself when 2.0 is gone.
  backup.W_Q[O.OUT][DH - 1] = p.rho * sc / r(1); backup.W_Q[O.OUT + 1][DH - 1] = p.rho * sc / r(1);
  backup.W_K[O.TOK + BOS][DH - 1] = r(1);
  backup.W_Q[O.ONE][DH - 1] = p.sb * sc / r(1);
  const W_U = zeros(D, NV); W_U[O.OUT][MARY] = 1; W_U[O.OUT + 1][JOHN] = 1;
  return { W_E, W_pos, W_U, blocks: [[prevTok(), dup, curTok()], [bosHead(), sinh, prevTok()], [nm, bosHead(), neg], [backup, curTok(), bosHead()]] };
}

const vecmat = (x, M) => {
  const out = new Float64Array(M[0].length);
  for (let k = 0; k < x.length; k++) { const a = x[k]; if (a) { const row = M[k]; for (let l = 0; l < out.length; l++) out[l] += a * row[l]; } }
  return out;
};
const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };
/* the hand-set matrices are 99% zeros: forward() multiplies by their nonzero entries only, in the
   same order as a dense x @ W (so the sums are identical, just faster). Activations are plain arrays. */
function sparse(M) {
  const r = [], c = [], v = [];
  M.forEach((row, i) => row.forEach((x, j) => { if (x) { r.push(i); c.push(j); v.push(x); } }));
  return { r, c, v, n: M[0].length };
}
function spmv(x, S) {
  const out = new Array(S.n).fill(0);
  for (let t = 0; t < S.r.length; t++) { const a = x[S.r[t]]; if (a) out[S.c[t]] += a * S.v[t]; }
  return out;
}
function softmax(s) {
  let m = -Infinity; for (const v of s) m = Math.max(m, v);
  const e = s.map((v) => Math.exp(v - m)); const z = e.reduce((a, b) => a + b, 0);
  return e.map((v) => v / z);
}
const toArr = (x) => { const a = new Array(x.length); for (let i = 0; i < x.length; i++) a[i] = x[i]; return a; };
/* TransformerLens hook names (utils.get_act_name) */
const get_act_name = (name, layer) => (name === 'resid_pre' ? `blocks.${layer}.hook_resid_pre`
  : name === 'z' ? `blocks.${layer}.attn.hook_z` : name === 'pattern' ? `blocks.${layer}.attn.hook_pattern` : `blocks.${layer}.hook_${name}`);

/* One forward pass (attention-only, causal mask) with forward hooks and a full cache.
   fwd_hooks = [[hook_name, fn(tensor, hook) -> tensor]], like model.run_with_hooks.
   Shapes (batch of 1 dropped): resid_pre [pos][d_model], z [pos][head][d_head], pattern [head][dest][src]. */
function forward(model, tokens, fwd_hooks = []) {
  const L = tokens.length, isc = 1 / Math.sqrt(DH), cache = {};
  const hookPoint = (name, layer, x) => {
    for (const [n, fn] of fwd_hooks) if (n === name) { const y = fn(x, { name, layer: () => layer }); if (y) x = y; }
    cache[name] = x; return x;
  };
  let resid = tokens.map((t) => toArr(model.W_E[t]));
  model.blocks.forEach((heads, l) => {
    resid = hookPoint(get_act_name('resid_pre', l), l, resid);
    const qk_in = resid.map((x, i) => { const y = x.slice(), pp = model.W_pos[i]; for (let d = 0; d < D; d++) y[d] += pp[d]; return y; });
    const pattern = [];
    let z = Array.from({ length: L }, () => heads.map(() => new Array(DH).fill(0)));
    heads.forEach((Hd, h) => {
      const sp = Hd.sp || (Hd.sp = { Q: sparse(Hd.W_Q), K: sparse(Hd.W_K), V: sparse(Hd.W_V), O: sparse(Hd.W_O) });
      const q = qk_in.map((x) => spmv(x, sp.Q)), k = qk_in.map((x) => spmv(x, sp.K)), v = resid.map((x) => spmv(x, sp.V));
      const pat = [];
      for (let i = 0; i < L; i++) {
        const row = new Array(L).fill(0);                 // src > dest stays 0: the causal mask
        let m = -Infinity, sum = 0;
        for (let j = 0; j <= i; j++) { row[j] = dot(q[i], k[j]) * isc; if (row[j] > m) m = row[j]; }
        for (let j = 0; j <= i; j++) { row[j] = Math.exp(row[j] - m); sum += row[j]; }
        const zi = z[i][h];
        for (let j = 0; j <= i; j++) { const w = (row[j] /= sum), vj = v[j]; for (let d = 0; d < DH; d++) zi[d] += w * vj[d]; }
        pat.push(row);
      }
      pattern.push(pat);
    });
    cache[get_act_name('pattern', l)] = pattern;
    z = hookPoint(get_act_name('z', l), l, z);
    resid = resid.map((x, i) => {
      const o = x.slice();
      heads.forEach((Hd, h) => { const w = spmv(z[i][h], Hd.sp.O); for (let d = 0; d < D; d++) o[d] += w[d]; });
      return o;
    });
  });
  cache[`blocks.${N_LAYERS - 1}.hook_resid_post`] = resid;
  const WU = model.sp_U || (model.sp_U = sparse(model.W_U));
  return { logits: resid.map((x) => spmv(x, WU)), cache };
}
const run_with_cache = (model, tokens) => forward(model, tokens);
const run_with_hooks = (model, tokens, fwd_hooks) => forward(model, tokens, fwd_hooks).logits;

/* ARENA [1.4.1] metrics. logit diff = logit(Mary) - logit(John) at the final position. */
function logits_to_ave_logit_diff(logits, answer = answer_tokens) {
  const fin = logits[logits.length - 1];
  return fin[answer[0]] - fin[answer[1]];
}
// 0 = same as the corrupted run, 1 = same as the clean run (denoising convention)
function ioi_metric(logits, answer, corrupted_logit_diff, clean_logit_diff) {
  return (logits_to_ave_logit_diff(logits, answer) - corrupted_logit_diff) / (clean_logit_diff - corrupted_logit_diff);
}
// 0 = unharmed, -1 = as bad as the corrupted run (noising convention; ARENA uses it with the ABC set)
function ioi_metric_2(logits, answer, clean_logit_diff, corrupted_logit_diff) {
  return (logits_to_ave_logit_diff(logits, answer) - clean_logit_diff) / (clean_logit_diff - corrupted_logit_diff);
}

/* ARENA's patching hooks and sweeps. For noising, call them with the roles swapped:
   "corrupted_tokens" = the clean prompt, "clean_cache" = the corrupted run's cache. */
function patch_residual_component(corrupted_residual_component, hook, pos, clean_cache) {
  corrupted_residual_component[pos] = clean_cache[hook.name][pos].slice();
  return corrupted_residual_component;
}
function get_act_patch_resid_pre(model, corrupted_tokens, clean_cache, patching_metric, extra_hooks = []) {
  const results = [];
  for (let layer = 0; layer < N_LAYERS; layer++) {
    const row = [];
    for (let position = 0; position < corrupted_tokens.length; position++) {
      const hook_fn = (x, hook) => patch_residual_component(x, hook, position, clean_cache);
      const patched_logits = run_with_hooks(model, corrupted_tokens, [...extra_hooks, [get_act_name('resid_pre', layer), hook_fn]]);
      row.push(patching_metric(patched_logits));
    }
    results.push(row);
  }
  return results;                                    // [layer][pos]
}
function patch_head_vector(corrupted_head_vector, hook, head_index, clean_cache) {
  corrupted_head_vector.forEach((zp, p) => { zp[head_index] = clean_cache[hook.name][p][head_index].slice(); });
  return corrupted_head_vector;
}
function get_act_patch_attn_head_out_all_pos(model, corrupted_tokens, clean_cache, patching_metric, extra_hooks = []) {
  const results = [];
  for (let layer = 0; layer < N_LAYERS; layer++) {
    const row = [];
    for (let head = 0; head < N_HEADS; head++) {
      const hook_fn = (x, hook) => patch_head_vector(x, hook, head, clean_cache);
      const patched_logits = run_with_hooks(model, corrupted_tokens, [...extra_hooks, [get_act_name('z', layer), hook_fn]]);
      row.push(patching_metric(patched_logits));
    }
    results.push(row);
  }
  return results;                                    // [layer][head]
}
/* ARENA [1.2]'s head_zero_ablation_hook: z[:, :, head, :] = 0 */
function head_zero_ablation_hook(z, hook, head_index_to_ablate) {
  z.forEach((zp) => zp[head_index_to_ablate].fill(0));
  return z;
}
const ablate_nm_hooks = () => [[get_act_name('z', 2), (z, hook) => head_zero_ablation_hook(z, hook, 0)]];

/* everything the object shows, for the intact model or with name mover 2.0 zero-ablated */
function analyse(model, ablate = false) {
  const base_hooks = ablate ? ablate_nm_hooks() : [];
  const clean = forward(model, clean_tokens, base_hooks), corr = forward(model, corrupted_tokens, base_hooks);
  const clean_logit_diff = logits_to_ave_logit_diff(clean.logits);
  const corrupted_logit_diff = logits_to_ave_logit_diff(corr.logits);
  const metric = (logits) => ioi_metric(logits, answer_tokens, corrupted_logit_diff, clean_logit_diff);
  return {
    ablate, base_hooks, clean, corr, clean_logit_diff, corrupted_logit_diff, metric,
    resid: { denoise: get_act_patch_resid_pre(model, corrupted_tokens, clean.cache, metric, base_hooks),
      noise: get_act_patch_resid_pre(model, clean_tokens, corr.cache, metric, base_hooks) },
    heads: { denoise: get_act_patch_attn_head_out_all_pos(model, corrupted_tokens, clean.cache, metric, base_hooks),
      noise: get_act_patch_attn_head_out_all_pos(model, clean_tokens, corr.cache, metric, base_hooks) },
  };
}
/* one patched run (for the dials and the glow): mode 'resid' | 'heads', dir 'denoise' | 'noise' */
function patched_run(model, R, mode, dir, layer, col) {
  const tokens = dir === 'denoise' ? corrupted_tokens : clean_tokens;
  const src = dir === 'denoise' ? R.clean.cache : R.corr.cache;
  const hook = mode === 'resid' ? [get_act_name('resid_pre', layer), (x, hk) => patch_residual_component(x, hk, col, src)]
    : [get_act_name('z', layer), (x, hk) => patch_head_vector(x, hk, col, src)];
  return forward(model, tokens, [...R.base_hooks, hook]);
}
/* self-repair: zero-ablate 2.0 on the clean prompt, then also hold 3.0 at its un-ablated output */
function self_repair(model) {
  const full = forward(model, clean_tokens);
  const ablated = forward(model, clean_tokens, ablate_nm_hooks());
  const frozen = forward(model, clean_tokens, [...ablate_nm_hooks(),
    [get_act_name('z', 3), (z, hk) => patch_head_vector(z, hk, 0, full.cache)]]);
  const ld = (r) => logits_to_ave_logit_diff(r.logits);
  return { intact: ld(full), ablated: ld(ablated), frozen: ld(frozen), full, ablated_run: ablated };
}
const MATH = { WORDS, NV, BOS, MARY, JOHN, clean_tokens, corrupted_tokens, answer_tokens, NP, N_LAYERS, N_HEADS, POSN, O, D, DH, HP, ROLES,
  buildModel, forward, run_with_cache, run_with_hooks, get_act_name, logits_to_ave_logit_diff, ioi_metric, ioi_metric_2,
  patch_residual_component, get_act_patch_resid_pre, patch_head_vector, get_act_patch_attn_head_out_all_pos,
  head_zero_ablation_hook, analyse, patched_run, self_repair, softmax, vecmat };
// MATH-END

/* ============================================================ display setup */

const MODEL = buildModel();
const RES = {};                                     // analyse() per model variant (the ablated one on demand)
function getR(ablate) { const key = ablate ? 'ablated' : 'intact'; return RES[key] || (RES[key] = analyse(MODEL, ablate)); }
const SR = self_repair(MODEL);
const PHONE = (() => { try { return Math.min(innerWidth, innerHeight) < 700; } catch (e) { return false; } })();

/* Layout. Two towers at the back (x: positions or heads, floors: layers 0-3), the bar field in front
   (x: the same columns, z: layers, layer 0 at the back as if each tower were folded forward onto the
   floor, which is also the order of ARENA's imshow rows), the word rail at the front. */
const TW = 1.8, TD = 0.3, TX = 1.0, TZ = -1.3, LOB = 0.24, FH = 0.42, Y0 = LOB + 0.03, ROOF = Y0 + N_LAYERS * FH;
const CELL_Z = TZ + 0.02, CW = TW - 0.14;
const DR = 0.46, DIAL_Y = ROOF + 0.05, DIAL_Z = TZ + 0.03, LD_MAX = 4, SWING = 1.3;
const FZ0 = -0.62, BR = 0.34, BH = 0.8, SLAB = 0.05, RAIL_Z = 0.99, RAIL_D = 0.5, RAIL_TILT = 0.62;
const FW = { resid: 3.5, heads: 1.95 }, NCOL = { resid: NP, heads: N_HEADS }, MAXC = NP;
const SIDES = ['clean', 'corr'];
const towerX = (side) => (side === 'clean' ? -TX : TX);
const cellX = (side, mode, c) => towerX(side) - CW / 2 + (c + 0.5) * CW / NCOL[mode];
const cellY = (l) => Y0 + (l + 0.5) * FH;
const fieldX = (mode, c) => -FW[mode] / 2 + (c + 0.5) * FW[mode] / NCOL[mode];
const fieldZ = (l) => FZ0 + (l + 0.5) * BR;
const cid = (l, c) => l * MAXC + c;
const ROLE_OF = { [POSN.IO]: 'IO', [POSN.S1]: 'S1', [POSN.S2]: 'S2', [POSN.END]: 'END' };
const word = (p, side = 'clean') => WORDS[(side === 'clean' ? clean_tokens : corrupted_tokens)[p]];
const posLabel = (p) => `${p} · ${p === POSN.S2 ? 'John|Mary' : word(p)}${ROLE_OF[p] ? ' (' + ROLE_OF[p] + ')' : ''}`;
const ROLE_TXT = {
  dup: { 1: 'spots the repeat', 2: 'duplicate-token', 3: 'dup-token' },
  sinh: { 1: 'says "not him"', 2: 'S-inhibition', 3: 'S-inhibition' },
  nm: { 1: 'says the name', 2: 'name mover', 3: 'name mover' },
  neg: { 1: 'pushes back', 2: 'negative mover', 3: 'negative NM' },
  backup: { 1: 'understudy', 2: 'backup mover', 3: 'backup NM' },
  prev: { 1: 'looks back', 2: 'previous-token', 3: 'prev-token' },
  cur: { 1: 'looks at itself', 2: 'current-token', 3: 'current-token' },
  bos: { 1: 'resting', 2: 'resting (BOS)', 3: 'BOS sink' },
};
const CIRCUIT_HEADS = [[0, 1], [1, 1], [2, 0], [2, 2], [3, 0]];
const hn = (l, h) => `${l}.${h}`;
const f2 = (v) => (Math.abs(v) < 0.005 ? '0.00' : v.toFixed(2).replace('-', '−'));
const f3 = (v) => (Math.abs(v) < 0.0005 ? '0.000' : v.toFixed(3).replace('-', '−'));
const sgn = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? (0).toFixed(d) : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(d));
const pct = (v) => `${Math.round(v * 100)}%`.replace('-', '−');
const PAL = {
  cell: new THREE.Color('#f4f1ea'), glow: new THREE.Color(C.data),
  mary: new THREE.Color(C.good), john: new THREE.Color(C.grad),
  tile: new THREE.Color('#f4eee4'), tileDone: new THREE.Color('#e3dac9'), tileSel: new THREE.Color('#e5c476'),
};
/* Views. Phones get close-ups (fit: k) of the part that matters; desktops keep the kit's auto-fit. */
const view = (pos, target, phoneFit, deskFit) => {
  const f = PHONE ? phoneFit : deskFit;
  return f ? { pos, target, fit: f } : { pos, target };
};
const CAM = {
  towers: view([0.35, 3.0, 7.6], [0, 1.3, -1.05], 1.1),
  field: view([0.1, 7.2, 5.1], [0, 0.4, -0.12], 1.08),

/* ======================================================== object behaviour */

const curCol = (S) => Math.round(S.knobs.mode === 'resid' ? S.knobs.pos : S.knobs.head);

}

function paintField(S, instant) {

  const sel = st.run ? cid(Math.round(k.layer), curCol(S)) : -1;

    const id = cid(l, c);

    vP.set(fieldX(mode, c), SLAB + 0.003, fieldZ(l)); vS.set(pw * 0.94, 0.006, BR * 0.94);

function drawBars(S) {

/* the patch cable: a teal string from the source cell to the same cell of the other tower */
function makeCable() {

      const d = st.diff ? st.diff[l][c] : 0, m = st.metric;
      return tier === 1 ? `"gave" differs (a copied name\nno later head reads): ${pct(m)} back`
        : tier === 2 ? `‖Δ‖ = ${f2(d)} here, but ioi_metric\n= ${f2(m)}: 0.0 copied S2's name\ninto a slot nothing reads`
          : `‖Δresid_pre[1][11]‖ = ${f2(d)}\n(SCR block only)\nioi_metric = ${f3(m)}`;
    }
    case 'mid': {
      const mix = R.clean.logits.map((row, i) => row.map((v, j) => (v + R.corr.logits[i][j]) / 2));
      return tier === 1 ? `halfway between ${sgn(cl)} and ${sgn(co)}\nis 0.00: score **${f2(R.metric(mix))}**`
        : `ioi_metric((clean + corr) / 2)\n= (${sgn(logits_to_ave_logit_diff(mix))} − (${sgn(co)})) / ${f2(cl - co)}\n= **${f2(R.metric(mix))}**`;
    }
    default: return '';
  }
}

function labels(S) {
  const st = S.state, k = S.knobs, sh = st.show || {};
  for (const side of SIDES) st.dialLab[side].set(dialText(S, side)).show(sh.dials !== false);
  const nt = st.noteMode ? noteText(S) : '';
  st.note.set(nt).show(!!nt);
  if (st.noteAt) st.note.move(st.noteAt);
  st.rowTags.forEach((t) => t.show(!!sh.rows));
  st.levelTag.show(!!sh.rows && revSet(S).size > 0);
  const rev = revSet(S);
  st.roleTags.forEach(({ tag, l, h }) => {
    const id = cid(l, h);
    tag.show(!!sh.roles && k.mode === 'heads' && rev.has(id));
    tag.move([fieldX('heads', h), SLAB + Math.abs(st.hT[id]) * BH + 0.03, fieldZ(l)]);
  });
  S.invalidate();
}

function paintAll(S, instant) {
  computeRuns(S);
  paintTowers(S); paintField(S, instant); paintCable(S); setDials(S); labels(S);
  S.invalidate();
}

function setCell(S, l, c) {
  const st = S.state;
  st.patchOn = true;
  S.setKnob('layer', l, { silent: true });
  S.setKnob(S.knobs.mode === 'resid' ? 'pos' : 'head', c, { silent: true });
  revSet(S).add(cid(l, c));
}

function parkBest(S) {                    // after a sweep, the cable rests on the cell that matters most
  const st = S.state, k = S.knobs, grid = st.R[k.mode][k.dir];
  let best = [0, 0], bv = -1;
  grid.forEach((row, l) => row.forEach((v, c) => { const a = Math.abs(k.dir === 'denoise' ? v : 1 - v); if (a > bv + 1e-6) { bv = a; best = [l, c]; } }));
  setCell(S, best[0], best[1]);
}

function startSweep(S) {
  const st = S.state, k = S.knobs, nc = NCOL[k.mode];
  const cells = []; for (let l = 0; l < N_LAYERS; l++) for (let c = 0; c < nc; c++) cells.push([l, c]);
  const rev = revSet(S); rev.clear();
  st.patchOn = true; st.show = Object.assign({}, st.show, { dials: true });
  if (S.shot) { cells.forEach(([l, c]) => rev.add(cid(l, c))); parkBest(S); paintAll(S, true); return; }
  st.sweep = { cells, done: 0, t0: null, dt: k.mode === 'resid' ? 0.055 : 0.2 };
  const [l0, c0] = cells[0]; setCell(S, l0, c0);
  st.hNow.fill(0);
  paintAll(S, false);
}

function dimKnobs(S) {        // the kit cannot dim knobs: grey the column knob the current mode ignores
  const dim = (id, on) => { const el = document.getElementById('k-' + id); const row = el && el.closest('.k-knob'); if (row) row.style.opacity = on ? '0.42' : ''; };
  dim('pos', S.knobs.mode !== 'resid'); dim('head', S.knobs.mode !== 'heads');
}

/* one call per beat / prediction */
function scene(S, o = {}) {
  const st = S.state, k = S.knobs;
  st.sweep = null;
  st.noteMode = o.note || null; st.noteAt = o.noteAt || null;
  st.note.anchor(o.noteAt === NOTE_FIELD ? 'top' : o.noteAt === NOTE_TOP && !PHONE ? 'right' : 'bottom');
  st.patchOn = !!o.patch; st.glowOn = o.glow !== false;
  st.show = { dials: o.dials !== false, rows: !!o.rows, roles: !!o.roles };
  const rev = revSet(S);
  if (o.reveal === 'all') { rev.clear(); for (let l = 0; l < N_LAYERS; l++) for (let c = 0; c < NCOL[k.mode]; c++) rev.add(cid(l, c)); }
  else if (o.reveal === 'cell') { rev.clear(); rev.add(cid(Math.round(k.layer), curCol(S))); }
  else if (o.reveal === 'none') rev.clear();
  if (o.figure) {
    st.fig.group.visible = true;
    st.fig.place(o.figAt || [-2.1, 0, 0.9], o.face || [0, 0.5, 0.2]);
    st.fig.pose('stand', { ms: 0 });
    const doPose = () => st.fig.pose(o.figure, { at: o.at });
    if (S.shot) doPose(); else setTimeout(doPose, 480);
  } else st.fig.group.visible = false;
  layout(S);
  st.snapDials = !!o.snap;
  if (o.grow && !S.shot) { paintAll(S, false); st.hNow.fill(0); drawBars(S); }
  else paintAll(S, true);
  if (o.sweep) startSweep(S);
}

    // ---- the bar field

    st.posts = [0, 1, 2, 3].map(() => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.018, BH, 0.018), K.mat.brass()); m.castShadow = true; S.root.add(m); return m; });
    // the word rails (tilted label boards), one per mode

      face.receiveShadow = true;

    }
    // taps: a window of either tower, a tile or a bar picks that cell
    const onTap = (hit) => {

    st.note = K.label([0, 0, 0], '', { cls: 'note', anchor: 'bottom', dy: -6 });

  rebuild(S, id) {
    const st = S.state, k = S.knobs;
    dimKnobs(S);
    if (id === 'layer' || id === 'pos' || id === 'head') {
      if ((id === 'pos' && k.mode !== 'resid') || (id === 'head' && k.mode !== 'heads')) return;
      st.sweep = null; st.show = Object.assign({}, st.show, { dials: true });
      if (!st.noteMode) st.noteMode = 'patch';
      setCell(S, Math.round(k.layer), curCol(S));
      paintAll(S, false);
      return;
    }
    st.sweep = null;
    layout(S);
    paintAll(S, id === '*' || !!S.first);
  },

  frame(S, t, dt) {
    const st = S.state;
    let moving = false;
    const sw = st.sweep;
    if (sw) {
      if (sw.t0 == null) sw.t0 = t;
      const due = Math.min(sw.cells.length, Math.floor((t - sw.t0) / sw.dt) + 1);
      if (due > sw.done) {
        while (sw.done < due) { const [l, c] = sw.cells[sw.done++]; revSet(S).add(cid(l, c)); }
        const [l, c] = sw.cells[sw.done - 1];
        setCell(S, l, c); paintAll(S, false);
      }
      if (sw.done >= sw.cells.length && t - sw.t0 > sw.cells.length * sw.dt + 0.35) { st.sweep = null; parkBest(S); paintAll(S, false); }
      moving = true;
    }
    for (const side of SIDES) {
      const d = st.dials[side], diff = d.target - d.ang;
      if (Math.abs(diff) > 2e-4) { d.ang += diff * Math.min(1, dt * 7); moving = true; } else d.ang = d.target;
      d.needle.rotation.z = d.ang;
    }
    let grow = false;
    for (let i = 0; i < st.hNow.length; i++) {
      const diff = st.hT[i] - st.hNow[i];
      if (Math.abs(diff) > 1e-3) { st.hNow[i] += diff * Math.min(1, dt * 9); grow = true; } else st.hNow[i] = st.hT[i];
    }
    if (grow || moving) drawBars(S);
    return moving || grow;
  },

  onTier(S) { labels(S); },

  solids(S) {
    const st = S.state, mode = S.knobs.mode, nc = NCOL[mode], cw = CW / nc, pw = FW[mode] / nc;
    // JSCAD is z-up: three (x, y, z) -> jscad (x, -z, y)
    const B = (x, y, z, sx, sy, sz) => J.primitives.cuboid({ size: [sx, sz, sy], center: [x, -z, y] });
    const out = [];
    for (const side of SIDES) {
      const cx = towerX(side);
      out.push(B(cx, LOB / 2, TZ, TW + 0.06, LOB, TD + 0.1));
      for (let l = 0; l <= N_LAYERS; l++) out.push(B(cx, Y0 + l * FH - 0.015, TZ, TW + 0.06, 0.03, TD + 0.06));
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) out.push(B(cx + sx * TW / 2, Y0 + N_LAYERS * FH / 2, TZ + sz * TD / 2, 0.04, N_LAYERS * FH, 0.04));
      // windows stand proud of the facade by how much the two runs differ there
      for (let l = 0; l < N_LAYERS; l++) for (let c = 0; c < nc; c++) {
        const g = st.diff ? Math.min(1, st.diff[l][c] / GLOW_REF[mode]) : 0, d = TD * 0.6 + 0.12 * g;
        out.push(B(cellX(side, mode, c), cellY(l), TZ - TD * 0.3 + d / 2, cw * 0.82, FH * 0.7, d));
      }
      const disc = J.transforms.rotateX(Math.PI / 2, J.primitives.cylinder({ radius: DR, height: 0.05, segments: 48 }));
      const half = J.booleans.intersect(disc, J.primitives.cuboid({ size: [2 * DR + 0.02, 0.06, DR + 0.01], center: [0, 0, (DR + 0.01) / 2] }));
      out.push(J.transforms.translate([cx, -(DIAL_Z - 0.025), DIAL_Y - 0.01], half));
    }
    out.push(B(0, SLAB / 2, FZ0 + N_LAYERS * BR / 2, FW[mode] + 0.16, SLAB, N_LAYERS * BR + 0.12));
    const rev = revSet(S);
    for (let l = 0; l < N_LAYERS; l++) for (let c = 0; c < nc; c++) {
      if (!rev.has(cid(l, c))) continue;
      const h = Math.abs(barValue(S, l, c)) * BH;
      if (h > 0.02) out.push(B(fieldX(mode, c), SLAB + h / 2 - 0.001, fieldZ(l), pw * 0.62, h, BR * 0.62));
    }
    return out;
  },
