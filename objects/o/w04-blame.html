<body>
<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   07 · w04-blame: "The blame web" (W4, ARENA [0.4] Backprop)
   A bead-and-string model of one computational graph. The engine below is
   ARENA's own design in miniature (Recipe, BACK_FUNCS, topological_sort,
   backprop), run on plain numbers: every value, blame, exchange rate, order
   number and count on screen comes from it. The MATH block is extracted and
   checked in node against hand derivatives and central differences.
   ========================================================================= */

// MATH-BEGIN
/* A scalar autograd engine that follows ARENA [0.4] name for name (Recipe, BackwardFuncLookup,
   BACK_FUNCS, Tensor.is_leaf, wrap_forward_fn, topological_sort, sorted_computational_graph,
   backprop). Arrays are plain numbers here, so unbroadcast has nothing to sum away. */
const np = {
  multiply: (x, y) => x * y,
  add: (x, y) => x + y,
  subtract: (x, y) => x - y,
  maximum: (x, y) => Math.max(x, y),
};
for (const [k, f] of Object.entries(np)) f.label = `np.${k}`;

class Recipe {
  constructor(func, args, kwargs, parents) {
    this.func = func;        // the 'inner' numpy function that did the forward computation
    this.args = args;        // its input VALUES (needed by the backward functions)
    this.kwargs = kwargs;
    this.parents = parents;  // {arg position: Tensor} (needed to walk the graph)
  }
}
class BackwardFuncLookup {
  constructor() { this.back_funcs = new Map(); }   // (forward_fn, arg_position) -> back_fn
  add_back_func(forward_fn, arg_position, back_fn) { this.back_funcs.set(`${forward_fn.label}|${arg_position}`, back_fn); }
  get_back_func(forward_fn, arg_position) { return this.back_funcs.get(`${forward_fn.label}|${arg_position}`); }
}
const unbroadcast = (broadcasted, original) => broadcasted;   // scalars: shapes already match
function multiply_back0(grad_out, out, x, y) { return unbroadcast(y * grad_out, x); }
function multiply_back1(grad_out, out, x, y) { return unbroadcast(x * grad_out, y); }
function maximum_back0(grad_out, out, x, y) { const bool_sum = (x > y) + 0.5 * (x === y); return unbroadcast(grad_out * bool_sum, x); }
function maximum_back1(grad_out, out, x, y) { const bool_sum = (x < y) + 0.5 * (x === y); return unbroadcast(grad_out * bool_sum, y); }
const add_back0 = (grad_out, out, x, y) => unbroadcast(grad_out, x);
const add_back1 = (grad_out, out, x, y) => unbroadcast(grad_out, y);
const subtract_back0 = (grad_out, out, x, y) => unbroadcast(grad_out, x);
const subtract_back1 = (grad_out, out, x, y) => unbroadcast(-grad_out, y);
const BACK_FUNCS = new BackwardFuncLookup();
BACK_FUNCS.add_back_func(np.multiply, 0, multiply_back0);
BACK_FUNCS.add_back_func(np.multiply, 1, multiply_back1);
BACK_FUNCS.add_back_func(np.add, 0, add_back0);
BACK_FUNCS.add_back_func(np.add, 1, add_back1);
BACK_FUNCS.add_back_func(np.subtract, 0, subtract_back0);
BACK_FUNCS.add_back_func(np.subtract, 1, subtract_back1);
BACK_FUNCS.add_back_func(np.maximum, 0, maximum_back0);
BACK_FUNCS.add_back_func(np.maximum, 1, maximum_back1);
/* ARENA names multiply's and maximum's back functions; add's and subtract's are lambdas (named null here) */
const BACK_NAME = new Map([[multiply_back0, 'multiply_back0'], [multiply_back1, 'multiply_back1'], [add_back0, null],
  [add_back1, null], [subtract_back0, null], [subtract_back1, null],
  [maximum_back0, 'maximum_back0'], [maximum_back1, 'maximum_back1']]);

const grad_tracking_enabled = true;
class Tensor {
  constructor(array, requires_grad = false) {
    this.array = array;
    this.requires_grad = requires_grad;
    this.grad = null;
    this.recipe = null;
  }
  get is_leaf() { return !(this.requires_grad && this.recipe && Object.keys(this.recipe.parents).length > 0); }
}
function wrap_forward_fn(numpy_func, is_differentiable = true) {
  return function tensor_func(...args) {
    const arg_arrays = args.map((a) => (a instanceof Tensor ? a.array : a));
    const out_arr = numpy_func(...arg_arrays);
    const requires_grad = grad_tracking_enabled && is_differentiable && args.some((a) => a instanceof Tensor && a.requires_grad);
    const out = new Tensor(out_arr, requires_grad);
    if (requires_grad) {
      const parents = {};
      args.forEach((a, idx) => { if (a instanceof Tensor) parents[idx] = a; });
      out.recipe = new Recipe(numpy_func, arg_arrays, {}, parents);
    }
    return out;
  };
}
const multiply = wrap_forward_fn(np.multiply);
const add = wrap_forward_fn(np.add);
const subtract = wrap_forward_fn(np.subtract);
const maximum = wrap_forward_fn(np.maximum);
const relu = (x) => maximum(x, 0.0);

/* depth-first search: every node lands in `result` after all of its children (here: parents) */
function topological_sort(node, get_children) {
  const result = [], perm = new Set(), temp = new Set();
  function visit(cur) {
    if (perm.has(cur)) return;
    if (temp.has(cur)) throw new Error('Not a DAG!');
    temp.add(cur);
    for (const next of get_children(cur)) visit(next);
    result.push(cur);
    perm.add(cur);
    temp.delete(cur);
  }
  visit(node);
  return result;
}
function sorted_computational_graph(tensor) {
  const get_parents = (t) => (t.recipe == null ? [] : Object.values(t.recipe.parents));
  return topological_sort(tensor, get_parents).reverse();
}
/* ARENA's backprop, line for line. `log` (optional) records each pop and each back-function call. */
function backprop(end_node, end_grad = null, log = null) {
  const end_grad_arr = end_grad == null ? 1 : end_grad.array;
  const grads = new Map([[end_node, end_grad_arr]]);
  for (const node of sorted_computational_graph(end_node)) {
    const outgrad = grads.get(node);
    grads.delete(node);                                                 // grads.pop(node)
    if (log) log.push({ kind: 'pop', node, outgrad });
    if (node.is_leaf) {
      if (node.requires_grad) node.grad = node.grad == null ? new Tensor(outgrad) : new Tensor(node.grad.array + outgrad);
    } else {
      for (const [argnum, parent] of Object.entries(node.recipe.parents)) {
        const back_fn = BACK_FUNCS.get_back_func(node.recipe.func, Number(argnum));
        const in_grad = back_fn(outgrad, node.array, ...node.recipe.args);
        grads.set(parent, grads.has(parent) ? grads.get(parent) + in_grad : in_grad);
        if (log) log.push({ kind: 'call', node, parent, argnum: Number(argnum), outgrad, in_grad, back_fn });
      }
    }
  }
}

/* The toy network: one example, two inputs, one hidden relu unit, squared error (toy numbers). */
const W0 = { w1: 0.6, w2: 0.5, v: 1.5 };
function buildNet(x1v, x2v, yv, share = false, wv = W0) {
  const x1 = new Tensor(x1v), x2 = new Tensor(x2v), y = new Tensor(yv);            // data: no grad
  const w1 = new Tensor(wv.w1, true), w2 = new Tensor(wv.w2, true), v = new Tensor(wv.v, true);
  const m1 = multiply(w1, x1);
  const m2 = multiply(share ? w1 : w2, x2);          // "use w1 twice": weight sharing
  const s = add(m1, m2);
  const h = relu(s);                                  // maximum(s, 0.0)
  const yhat = multiply(h, v);
  const d = subtract(yhat, y);
  const L = multiply(d, d);                           // (yhat - y)**2, written the way ARENA's ops allow
  const net = { x1, x2, w1, w2, v, y, m1, m2, s, h, yhat, d, L };
  const names = new Map();
  for (const [k, t] of Object.entries(net)) names.set(t, k);
  return { net, names };
}
/* Everything the object shows, computed from one forward pass and one backprop call. */
function analyse(x1, x2, y, share = false, wv = W0) {
  const { net, names } = buildNet(x1, x2, y, share, wv);
  const log = [];
  backprop(net.L, null, log);
  const order = log.filter((e) => e.kind === 'pop').map((e) => names.get(e.node));
  const value = {}, blame = {}, grad = {};
  for (const [k, t] of Object.entries(net)) { value[k] = t.array; if (t.grad) grad[k] = t.grad.array; }
  for (const e of log) if (e.kind === 'pop') blame[names.get(e.node)] = e.outgrad;
  const calls = log.filter((e) => e.kind === 'call').map((e) => ({
    to: names.get(e.node), from: names.get(e.parent), argnum: e.argnum, outgrad: e.outgrad, in_grad: e.in_grad,
    back: BACK_NAME.get(e.back_fn),
    rate: e.back_fn(1, e.node.array, ...e.node.recipe.args),        // exchange rate: back_fn at grad_out = 1
    step: order.indexOf(names.get(e.node)) + 1,
  }));
  const used = new Set(order);
  const fwdOps = Object.values(net).filter((t) => used.has(names.get(t)) && t.recipe).length;
  return { net, names, order, value, blame, grad, calls, used, fwdOps, backCalls: calls.length };
}
/* every path from a node up to L: the chain rule is "multiply along a path, add over paths" */
function paths(A, from) {
  const out = [];
  const walk = (node, acc) => {
    if (node === 'L') { out.push(acc); return; }
    for (const c of A.calls) if (c.from === node) walk(c.to, [...acc, c]);
  };
  walk(from, []);
  return out.map((p) => ({ edges: p, product: p.reduce((a, c) => a * c.rate, 1) }));
}
/* the wiggle test: nudge one weight by eps and run the forward pass again (finite differences) */
function lossOnly(x1, x2, y, share, wv) { return buildNet(x1, x2, y, share, wv).net.L.array; }
function wiggle(x1, x2, y, share, name, eps = 0.001, wv = W0) {
  const up = { ...wv, [name]: wv[name] + eps }, dn = { ...wv, [name]: wv[name] - eps };
  const L0 = lossOnly(x1, x2, y, share, wv), Lp = lossOnly(x1, x2, y, share, up), Lm = lossOnly(x1, x2, y, share, dn);
  const g = analyse(x1, x2, y, share, wv).grad[name];
  return { L0, Lp, Lm, dL: Lp - L0, forward: (Lp - L0) / eps, central: (Lp - Lm) / (2 * eps), grad: g };
}
const MATH = { np, Recipe, BackwardFuncLookup, BACK_FUNCS, Tensor, wrap_forward_fn, multiply, add, subtract, maximum, relu,
  topological_sort, sorted_computational_graph, backprop, W0, buildNet, analyse, paths, lossOnly, wiggle,
  multiply_back0, multiply_back1, maximum_back0, maximum_back1 };
// MATH-END

/* ============================================================ display setup */

const NAME = { x1: 'x₁', x2: 'x₂', w1: 'w₁', w2: 'w₂', v: 'v', y: 'y', m1: 'm₁', m2: 'm₂', s: 's', h: 'h', yhat: 'ŷ', d: 'd', L: 'L' };
const KIND = { x1: 'input', x2: 'input', y: 'target', w1: 'weight', w2: 'weight', v: 'weight',
  m1: 'op', m2: 'op', s: 'op', h: 'op', yhat: 'op', d: 'op', L: 'loss' };
const SYM = { m1: 'times', m2: 'times', s: 'plus', h: 'relu', yhat: 'times', d: 'minus', L: 'times' };
const FORMULA = { m1: 'w₁·x₁', m2: 'w₂·x₂', s: 'm₁ + m₂', h: 'relu(s)', yhat: 'h·v', d: 'ŷ − y', L: 'd·d' };
const CODE = { m1: 'multiply(w1, x1)', m2: 'multiply(w2, x2)', s: 'add(m1, m2)', h: 'relu(s)', yhat: 'multiply(h, v)', d: 'subtract(yhat, y)', L: 'multiply(d, d)' };
const FWD = ['m1', 'm2', 's', 'h', 'yhat', 'd', 'L'];            // the order the forward pass computes them
/* world positions: inputs in front, weights behind, the loss on top */
const POS = {
  x1: [-1.0, 0.26, 0.45], w1: [-0.52, 0.58, -0.42], x2: [0.52, 0.26, 0.45], w2: [1.0, 0.58, -0.42],
  m1: [-0.62, 1.06, 0.02], m2: [0.62, 1.06, 0.02], s: [0, 1.5, 0], h: [0, 1.93, 0],
  v: [-0.84, 2.0, -0.45], yhat: [0, 2.37, 0], y: [0.84, 2.46, 0.45], d: [0, 2.81, 0], L: [0, 3.27, 0],
};
const RAD = { input: 0.075, target: 0.08, weight: 0.088, op: 0.1, loss: 0.13 };
const SIDE = { x1: -1, w1: -1, m1: -1, v: -1, x2: 1, w2: 1, m2: 1, y: 1, s: 1, h: 1, yhat: 1, d: 1, L: 1 };
const LEAVES = ['x1', 'x2', 'w1', 'w2', 'v', 'y'];
const WEIGHTS = ['w1', 'w2', 'v'];
/* every string the web can have: parent > child #argument position (w1 > m2 is the "use w1 twice" string) */
const EDGES = [
  ['w1', 'm1', 0], ['x1', 'm1', 1], ['w2', 'm2', 0], ['w1', 'm2', 0], ['x2', 'm2', 1],
  ['m1', 's', 0], ['m2', 's', 1], ['s', 'h', 0], ['h', 'yhat', 0], ['v', 'yhat', 1],
  ['yhat', 'd', 0], ['y', 'd', 1], ['d', 'L', 0], ['d', 'L', 1],
].map(([from, to, arg]) => ({ from, to, arg, key: `${from}>${to}#${arg}` }));
const ekey = (c) => `${c.from}>${c.to}#${c.argnum}`;
const FACE = 0.3;               // inlays and chips face the default camera (a little to the right)
const REST = '#9b9383';         // an unlit string
const CAM = {
  front: { pos: [1.7, 2.5, 7.4], target: [0, 1.72, 0] },
  low: { pos: [1.5, 1.6, 5.2], target: [0, 1.02, 0.1], fit: 1.35 },
  high: { pos: [1.3, 3.2, 5.0], target: [0, 2.35, 0], fit: 1.5 },
  wide: { pos: [3.6, 3.0, 6.4], target: [0, 1.6, 0] },
};

const fx = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d).replace('-', '−');
const nf = (v) => { const t = fx(v, 2); return t.endsWith('0') && t.includes('.') ? fx(v, 1).replace(/\.0$/, '') : t; };   // 2, 1.5, 0.55
const py = (a) => (Number.isInteger(a) ? a.toFixed(1) : String(+a.toFixed(4)));     // Python's repr: 2.0, 0.6, -1.0
const V3 = (a) => new THREE.Vector3(...a);
/* every road from a weight to L, the m₁ road first (paths() lists them in backward-pop order) */
const roads = (A, f) => paths(A, f).sort((a, b) => FWD.indexOf(a.edges[0].to) - FWD.indexOf(b.edges[0].to));
/* the relu's state, when it matters: off (rate 0) or exactly at its kink (ARENA's tie rule gives ½) */
const reluNote = (A, T) => (A.value.s < 0
  ? (T === 1 ? '\nrelu is off (s < 0): nothing gets through' : T === 2 ? `\nrelu off: s = ${fx(A.value.s)} < 0, rate 0` : `\nmaximum_back0 → 0 (s = ${fx(A.value.s)} < 0)`)
  : A.value.s === 0 ? (T === 1 ? '\nrelu exactly at its kink: rate ½' : '\ns = 0: maximum_back0 splits the tie, ½') : '');
const UP = new THREE.Vector3(0, 1, 0);

/* ============================================================ small builders */

const CYL = new THREE.CylinderGeometry(1, 1, 1, 10, 1).translate(0, 0.5, 0);
function rod(mat, r) {
  const m = new THREE.Mesh(CYL, mat);
  m.castShadow = true;
  return {
    mesh: m,
    set(a, b) {
      const d = b.clone().sub(a), len = d.length();
      m.position.copy(a);
      m.scale.set(r, Math.max(1e-4, len), r);
      m.quaternion.setFromUnitVectors(UP, d.normalize());
    },
  };
}
/* the operation, inlaid in brass on the bead's face: ×, +, −, or relu's hockey stick */
function inlay(sym, r) {
  const g = new THREE.Group(), mat = K.mat.brass(), z = r * 0.9, t = r * 0.13;
  const seg = (x0, y0, x1, y1) => { const q = rod(mat, t); q.set(new THREE.Vector3(x0 * r, y0 * r, z), new THREE.Vector3(x1 * r, y1 * r, z)); g.add(q.mesh); };
  if (sym === 'times') { seg(-0.42, -0.42, 0.42, 0.42); seg(-0.42, 0.42, 0.42, -0.42); }
  if (sym === 'plus') { seg(-0.55, 0, 0.55, 0); seg(0, -0.55, 0, 0.55); }
  if (sym === 'minus') seg(-0.55, 0, 0.55, 0);
  if (sym === 'relu') { seg(-0.6, -0.3, 0, -0.3); seg(0, -0.3, 0.5, 0.42); }
  g.rotation.y = FACE;
  return g;
}
/* a string between two beads: straight, or bowed (the two strings of d·d), trimmed to the bead surfaces */
function edgePoints(e) {
  const a = V3(POS[e.from]), b = V3(POS[e.to]);
  const ra = RAD[KIND[e.from]] * 1.02, rb = RAD[KIND[e.to]] * 1.02;
  const bow = e.from === 'd' && e.to === 'L' ? (e.arg === 0 ? -0.12 : 0.12) : 0;
  const c = a.clone().lerp(b, 0.5).add(new THREE.Vector3(bow, 0, 0));
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    pts.push(a.clone().multiplyScalar((1 - t) ** 2).addScaledVector(c, 2 * t * (1 - t)).addScaledVector(b, t * t));
  }
  const out = pts.filter((p) => p.distanceTo(a) >= ra && p.distanceTo(b) >= rb);
  return out;
}
function along(pts, t) {           // the point at arc-length fraction t
  let total = 0;
  for (let i = 1; i < pts.length; i++) total += pts[i].distanceTo(pts[i - 1]);
  let want = t * total;
  for (let i = 1; i < pts.length; i++) {
    const s = pts[i].distanceTo(pts[i - 1]);
    if (want <= s) return pts[i - 1].clone().lerp(pts[i], s > 0 ? want / s : 0);
    want -= s;
  }
  return pts[pts.length - 1].clone();
}
function fade(obj, on) {           // unused beads (w2 when w1 is shared) turn to ghosts
  obj.traverse((m) => {
    if (!m.isMesh) return;
    if (!m.userData.mat0) m.userData.mat0 = m.material;
    if (on) {
      if (!m.userData.ghost) { m.userData.ghost = m.userData.mat0.clone(); m.userData.ghost.transparent = true; m.userData.ghost.opacity = 0.22; m.userData.ghost.depthWrite = false; }
      m.material = m.userData.ghost; m.castShadow = false;
    } else { m.material = m.userData.mat0; m.castShadow = true; }
  });
}

/* ============================================================ state + compute */

function compute(S) {
  const st = S.state, k = S.knobs;
  st.A = analyse(k.x1, k.x2, k.y, !!k.share);
  st.N = st.A.order.length;
  st.step = Math.min(k.step, st.N);
  st.focus = st.A.used.has(k.focus) ? k.focus : 'w1';
}
/* blame known after `step` pops: final for popped nodes, running totals (+=) for the rest */
function blameAt(A, step) {
  const done = new Set(A.order.slice(0, step)), sum = {}, fin = {};
  if (step >= 1) sum.L = 1;
  for (const c of A.calls) if (done.has(c.to)) sum[c.from] = (sum[c.from] ?? 0) + c.in_grad;
  for (const n of done) fin[n] = true;
  return { sum, fin, done };
}

/* ============================================================ draw */

function draw(S) {
  const st = S.state, A = st.A, T = S.tier, mode = st.mode;
  const used = A.used;
  const pathKeys = new Set(), otherKeys = new Set(), all = mode === 'path' ? roads(A, st.focus) : [];
  if (all.length) {
    for (const c of all[0].edges) pathKeys.add(ekey(c));
    for (const p of all.slice(1)) for (const c of p.edges) if (!pathKeys.has(ekey(c))) otherKeys.add(ekey(c));
  }
  const B = blameAt(A, mode === 'fwd' ? 0 : (mode === 'order' || mode === 'path') ? st.N : st.step);
  const fwdDone = st.playing && mode === 'fwd' ? st.fwdDone : FWD.length;
  const known = (n) => LEAVES.includes(n) || FWD.indexOf(n) < fwdDone;
  const callBy = new Map(A.calls.map((c) => [ekey(c), c]));
  // beads, ghosts for anything the graph no longer uses
  for (const n of Object.keys(POS)) {
    const N = st.nodes[n], on = used.has(n);
    fade(N.group, !on);
  }
  const ringAt = st.code ? st.codeOp : (WEIGHTS.includes(st.focus) && (mode === 'path' || st.split || st.wigOn) ? st.focus : null);
  st.ring.visible = !!ringAt;
  if (ringAt) { st.ring.position.copy(V3(POS[ringAt])); st.ring.scale.setScalar((RAD[KIND[ringAt]] + 0.055) / 0.15); }
  // strings
  for (const e of EDGES) {
    const E = st.edges[e.key], c = callBy.get(e.key), on = !!c;
    E.base.mesh.visible = on;
    let lit = null;
    if (on) {
      if (mode === 'fwd') lit = known(e.to) ? C.data : null;
      else if (mode === 'path') lit = pathKeys.has(e.key) ? C.grad : otherKeys.has(e.key) ? '#e7a3a3' : null;
      else if (st.split) lit = e.from === st.focus ? C.grad : (B.done.has(e.to) ? '#e7a3a3' : null);
      else lit = B.done.has(e.to) ? C.grad : null;
    }
    E.lit.mesh.visible = !!lit;
    if (lit) { E.mat.color.set(lit); E.mat.emissive.set(lit); }
    // chips on strings: exchange rates along the path, or the blame each road carries back to a shared weight
    let rt = null;
    if (on && mode === 'path' && pathKeys.has(e.key)) rt = `×${nf(c.rate)}`;
    if (on && st.split && e.from === st.focus && B.done.has(e.to)) rt = `${T === 1 ? '' : '+= '}${fx(c.in_grad)}`;
    E.chip.set(rt || '');
    E.chip.el.className = 'k-label ' + (st.split ? 'k-blame' : 'k-rate');
    E.chip.show(!!rt && !st.playing);
  }
  // chips on beads
  for (const n of Object.keys(POS)) {
    const N = st.nodes[n], on = used.has(n);
    let text = null, cls = 'k-val';
    if (!on) text = null;
    else if (mode === 'fwd') text = known(n) ? `${NAME[n]} ${fx(A.value[n])}` : null;
    else if (mode === 'order') { const i = A.order.indexOf(n); text = `${i + 1} · ${NAME[n]}`; cls = 'k-ord'; }
    else if (mode === 'path') {
      if (n === st.focus) text = `${NAME[n]}`;
      else if (n === 'L') text = T === 1 ? 'loss' : 'L';
      cls = 'k-val';
    } else {
      const s = B.sum[n];
      if (s !== undefined) {
        const g = T === 3 && WEIGHTS.includes(n) && B.fin[n] ? `${NAME[n]}.grad` : NAME[n];
        text = `${g} ${fx(s)}${B.fin[n] ? '' : ' …'}`;
        cls = B.fin[n] ? 'k-blame' : 'k-blame k-part';
      } else if (st.step === 0) text = `${NAME[n]} ${fx(A.value[n])}`;
    }
    N.chip.el.className = 'k-label ' + cls;
    N.chip.set(text || '');
    N.chip.show(!!text);
  }
  readouts(S);
  S.invalidate();
}

/* ============================================================ readouts */

function readouts(S) {
  const st = S.state, A = st.A, T = S.tier, k = S.knobs;
  let r = '';
  const g = A.grad, f = st.focus;
  const wg = WEIGHTS.filter((w) => A.used.has(w));
  if (st.wigOn) {
    const W = wiggle(k.x1, k.x2, k.y, !!k.share, f, 0.001);
    r = T === 1 ? `nudge ${NAME[f]} by 0.001, rerun forward:\nloss ${fx(W.L0, 5)} → ${fx(W.Lp, 5)}\nchange ÷ nudge = **${fx(W.forward, 3)}** · blame **${fx(W.grad, 3)}**`
      : T === 2 ? `${NAME[f]} + ε, ε = 0.001: L ${fx(W.L0, 5)} → ${fx(W.Lp, 5)}\nΔL/ε = **${fx(W.forward, 4)}** · backprop **${fx(W.grad, 4)}**`
        : `(L(${NAME[f]}+ε) − L)/ε = **${fx(W.forward, 4)}**\n(L₊ − L₋)/2ε = ${fx(W.central, 4)} · ${NAME[f]}.grad = **${fx(W.grad, 4)}**`;
  } else if (st.cost) {
    const n = wg.length;
    r = T === 1 ? `forward: ${A.fwdOps} small jobs · backward: ${A.backCalls} jobs\n→ blame for all ${n} weights at once\nwiggling instead: ${n} more forward trips`
      : T === 2 ? `forward ${A.fwdOps} ops · backward ${A.backCalls} back-fn calls (${fx(A.backCalls / A.fwdOps, 1)}×)\n→ ${wg.map((w) => NAME[w]).join(', ')} grads together\nfinite differences: +${n} forward passes`
        : `fwd ${A.fwdOps} ops, bwd ${A.backCalls} back_fn calls (${fx(A.backCalls / A.fwdOps, 1)}×)\nFD: N + 1 passes (central 2N), N = ${n}\nbackprop: ≈ 3 passes for any N`;
  } else if (st.code) {
    const n = st.codeOp, node = A.net[n], rec = node.recipe;
    if (!rec) {                                   // a leaf: an input, the target or a weight
      const isW = WEIGHTS.includes(n), bl = A.blame[n];
      r = T === 1 ? `${NAME[n]} = ${fx(node.array)}: ${isW ? 'a weight' : n === 'y' ? 'the target' : 'an input'}, made by no bead\nits blame: **${fx(bl)}**${isW ? ' (kept: training nudges it)' : ' (dropped: data stays fixed)'}`
        : T === 2 ? `${NAME[n]}: a leaf, requires_grad=${isW ? 'True' : 'False'}\n∂L/∂${NAME[n]} = **${fx(bl)}**, ${isW ? `kept as ${NAME[n]}.grad` : 'computed, then dropped'}`
          : `${NAME[n]}.is_leaf = True, recipe = None\n${isW ? `${NAME[n]}.grad = **${fx(g[n], 3)}**` : `grads.pop(${NAME[n]}) = ${fx(bl, 3)}, not stored`}`;
      st.readout.set(r); st.readout.show(true); return;
    }
    const par = Object.entries(rec.parents).map(([i, p]) => `${i}: ${NAME[A.names.get(p)]}`).join(', ');
    const calls = A.calls.filter((c) => c.to === n);
    const args = rec.args.map(py).join(', ');
    const tied = k.share && n === 'm2';
    const formula = tied ? 'w₁·x₂' : FORMULA[n], code = tied ? 'multiply(w1, x2)' : CODE[n];
    const inputs = Object.values(rec.parents).map((p) => NAME[A.names.get(p)]);
    r = T === 1 ? `${NAME[n]} = ${formula} = ${fx(node.array)}\nremembers: ${rec.func.label.slice(3)}, inputs ${inputs[0] === inputs[1] ? `${inputs[0]} twice` : inputs.join(' & ')}\nblame sent back: ` + calls.map((c) => `${NAME[c.from]} **${fx(c.in_grad)}**`).join(' · ')
      : T === 2 ? `${NAME[n]} = ${code}\nrecipe: ${rec.func.label}, parents {${par}}\nback: ` + calls.map((c) => `${NAME[c.from]} ${fx(c.outgrad)} × ${nf(c.rate)} = **${fx(c.in_grad)}**`).join(' · ')
        : `Recipe(${rec.func.label}, (${args}), {}, {${par}})\n` + calls.map((c) => `${c.back || `λ(${rec.func.label}, ${c.argnum})`}(${fx(c.outgrad, 3)}, …) = **${fx(c.in_grad, 3)}** → ${NAME[c.from]}`).join('\n');
  } else if (st.mode === 'fwd') {
    const v = A.value;
    r = T === 1 ? `guess ŷ = **${fx(v.yhat)}**, target y = ${fx(v.y)}\nloss = (${fx(v.yhat)} − ${fx(v.y)})² = **${fx(v.L, 4)}**`
      : T === 2 ? `ŷ = v·relu(w₁x₁ + ${k.share ? 'w₁' : 'w₂'}x₂) = **${fx(v.yhat, 3)}**\nL = (ŷ − y)² = **${fx(v.L, 4)}**`
        : `h = max(s, 0) = ${fx(v.h, 3)}, ŷ = ${fx(v.yhat, 3)}\nL = d·d = **${fx(v.L, 4)}**`;
  } else if (st.mode === 'path') {
    const P = roads(A, f), p = P[0];
    const chain = p.edges.map((c) => nf(c.rate)).join(' × ');
    const tot = P.reduce((a, q) => a + q.product, 0);
    r = T === 1 ? `one road from ${NAME[f]} to the loss:\n${chain} = **${fx(p.product)}**\n${P.length} roads in all → **${fx(tot)}**`
      : T === 2 ? `∂L/∂${NAME[f]} along one path:\n${chain} = **${fx(p.product, 3)}**\nall ${P.length} paths: Σ = **${fx(tot, 3)}** = ${NAME[f]}.grad`
        : `Π rates = ${chain} = **${fx(p.product, 3)}**\nΣ over ${P.length} paths = **${fx(tot, 3)}** (= ${NAME[f]}.grad)`;
    r += reluNote(A, T);
  } else if (st.mode === 'order') {
    const names = A.order.map((n) => NAME[n]);
    const last = A.order[A.order.length - 1];
    const cons = A.calls.filter((c) => c.from === last).map((c) => NAME[c.to]);
    r = (T === 1 ? 'backward order:\n' : T === 2 ? 'reverse topological order:\n' : 'sorted_computational_graph(L):\n')
      + names.join(', ')
      + (cons.length > 1 ? `\n${NAME[last]} waits for ${cons.join(' and ')}` : '');
  } else {
    const B = blameAt(A, st.step);
    if (st.step === 0) r = T === 1 ? 'forward done; blame not sent yet\n(slide "backward steps")' : `backward: 0 of ${st.N} steps done`;
    else if (st.step < st.N) {
      const n = A.order[st.step - 1];
      r = T === 1 ? `step ${st.step} of ${st.N}: ${NAME[n]} passes its blame down` : `step ${st.step}/${st.N}: pop ${NAME[n]}, ∂L/∂${NAME[n]} = **${fx(B.sum[n])}**`;
    } else {
      const parts = wg.map((w) => `${NAME[w]} **${fx(g[w])}**`);
      r = (T === 1 ? `blame on the weights:\n${parts.join(' · ')}`
        : T === 2 ? `∂L/∂weights:\n${parts.join(' · ')}` : wg.map((w) => `${NAME[w]}.grad = **${fx(g[w], 3)}**`).join('\n')) + reluNote(A, T);
      const sp = A.calls.filter((c) => c.from === f);
      if (st.split && sp.length > 1) {
        const byFwd = [...sp].sort((a, b) => FWD.indexOf(a.to) - FWD.indexOf(b.to));
        r = T === 3 ? `grads[${NAME[f]}] = ${fx(sp[0].in_grad)} (${NAME[sp[0].to]} pops first)\ngrads[${NAME[f]}] += ${fx(sp[1].in_grad)} (${NAME[sp[1].to]}) → **${fx(g[f])}**`
          : (T === 1 ? `blame into ${NAME[f]} from its two users:\n` : `∂L/∂${NAME[f]} = Σ over consumers:\n`)
            + `${byFwd.map((c) => fx(c.in_grad)).join(' + ')} = **${fx(g[f])}**`.replace('+ −', '− ');
      }
    }
  }
  st.readout.set(r);
  st.readout.show(!!r);
}

/* ============================================================ scene config */

function view(S, o = {}) {
  const st = S.state;
  st.playToken = (st.playToken || 0) + 1;       // any running animation stops
  st.playing = false;
  hidePulses(st);
  st.mode = o.mode || S.knobs.show;
  st.split = !!o.split;
  st.code = !!o.code;
  st.cost = !!o.cost;
  st.wigOn = !!o.wig;
  st.codeOp = o.codeOp || st.codeOp || 'm1';
  compute(S);
  if (o.figure) {
    const F = st.fig;
    F.group.visible = true;
    F.place(o.figAt || [0.3, 0, 1.3], o.face ?? -0.3);
    F.pose('stand', { ms: 0 });
    const doPose = () => F.pose(o.figure, { at: o.at });
    if (S.shot) doPose(); else setTimeout(doPose, 480);
  } else st.fig.group.visible = false;
  draw(S);
}

/* ============================================================ pulses (Play) */

function hidePulses(st) { for (const p of st.pulses) p.visible = false; }
function pulse(S, list, down, hex, ms, token) {
  const st = S.state;
  const use = list.slice(0, st.pulses.length);
  use.forEach((e, i) => { const p = st.pulses[i]; p.material.color.set(hex); p.material.emissive.set(hex); p.visible = true; });
  return S.tween(ms, (t) => {
    if (token !== st.playToken) return;
    use.forEach((e, i) => { st.pulses[i].position.copy(along(st.edges[e].pts, down ? 1 - t : t)); });
    if (t >= 1) hidePulses(st);
    S.invalidate();
  }, (x) => x);
}
async function play(S) {
  const st = S.state, A = st.A;
  const token = (st.playToken = (st.playToken || 0) + 1);
  st.split = st.code = st.cost = st.wigOn = false;
  st.mode = 'fwd'; st.playing = true; st.fwdDone = 0;
  S.setKnob('show', 'bwd', { silent: true });
  draw(S);
  for (let i = 0; i < FWD.length; i++) {
    const into = A.calls.filter((c) => c.to === FWD[i]).map(ekey);
    await pulse(S, into, false, C.data, 300, token);
    if (token !== st.playToken) return;
    st.fwdDone = i + 1; draw(S);
  }
  st.mode = 'bwd'; st.step = 0; S.setKnob('step', 0, { silent: true }); draw(S);
  for (let i = 1; i <= A.order.length; i++) {
    const out = A.calls.filter((c) => c.to === A.order[i - 1]).map(ekey);
    if (out.length) await pulse(S, out, true, C.grad, 340, token);
    else await S.tween(90, () => {});
    if (token !== st.playToken) return;
    st.step = i; S.setKnob('step', i, { silent: true }); draw(S);
  }
  st.playing = false; draw(S);
}

/* ============================================================ taps */

function tapNode(S, n) {
  const st = S.state;
  if (!st.A.used.has(n)) return;
  st.playToken = (st.playToken || 0) + 1; st.playing = false; hidePulses(st);
  if (WEIGHTS.includes(n)) { S.setKnob('focus', n, { silent: true }); st.focus = n; }
  if (!(st.mode === 'path' && WEIGHTS.includes(n))) {            // path view: tapping a weight just follows its road
    st.codeOp = n; st.code = true; st.cost = st.wigOn = st.split = false;
    if (st.mode !== 'bwd') { st.mode = 'bwd'; S.setKnob('show', 'bwd', { silent: true }); }
    if (st.step < st.N) { st.step = st.N; S.setKnob('step', st.N, { silent: true }); }
  }
  draw(S);
}
