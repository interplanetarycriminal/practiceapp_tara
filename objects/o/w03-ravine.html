<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   05 · w03-ravine: "The ravine" (W3, ARENA [0.3] Optimization)
   Every number on screen is computed below from ARENA's own functions and
   the exact update rules of ARENA's SGD / RMSprop / Adam solution classes.
   The MATH block is extracted and verified in node (see LEDGER.md).
   ========================================================================= */

// MATH-BEGIN
const sigmoid = (z) => 1 / (1 + Math.exp(-z));
const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);            // d|x|/dx in torch: sign(x), 0 at 0

// ARENA: pathological_curve_loss(x, y) = tanh(x)**2 + 0.01*abs(x) + sigmoid(y)
function pathological_curve_loss(x, y) {
  const x_loss = Math.tanh(x) ** 2 + 0.01 * Math.abs(x);
  const y_loss = sigmoid(y);
  return x_loss + y_loss;
}
function pathological_curve_grad(x, y) {                        // what .backward() puts in xy.grad
  const t = Math.tanh(x), s = sigmoid(y);
  return [2 * t * (1 - t * t) + 0.01 * sign(x), s * (1 - s)];
}

// ARENA: bivariate_gaussian + neg_trimodal_func (three wells, sigma 0.2)
function bivariate_gaussian(x, y, x_mean = 0.0, y_mean = 0.0, x_sig = 1.0, y_sig = 1.0) {
  const norm = 1 / (2 * Math.PI * x_sig * y_sig);
  const x_exp = 0.5 * ((x - x_mean) ** 2) / (x_sig ** 2);
  const y_exp = 0.5 * ((y - y_mean) ** 2) / (y_sig ** 2);
  return norm * Math.exp(-x_exp - y_exp);
}
const means = [[1.0, -0.5], [-1.0, 0.5], [-0.5, -0.8]];
function neg_trimodal_func(x, y) {
  let z = -bivariate_gaussian(x, y, means[0][0], means[0][1], 0.2, 0.2);
  z -= bivariate_gaussian(x, y, means[1][0], means[1][1], 0.2, 0.2);
  z -= bivariate_gaussian(x, y, means[2][0], means[2][1], 0.2, 0.2);
  return z;
}
function neg_trimodal_grad(x, y) {
  let gx = 0, gy = 0;
  for (const [mx, my] of means) {
    const n = bivariate_gaussian(x, y, mx, my, 0.2, 0.2);
    gx += n * (x - mx) / 0.04;
    gy += n * (y - my) / 0.04;
  }
  return [gx, gy];
}

// ARENA: rosenbrocks_banana_func(x, y, a=1, b=100) = (a - x)**2 + b*(y - x**2)**2 + 1
function rosenbrocks_banana_func(x, y, a = 1, b = 100) {
  return (a - x) ** 2 + b * (y - x ** 2) ** 2 + 1;
}
function rosenbrocks_banana_grad(x, y, a = 1, b = 100) {
  return [-2 * (a - x) - 4 * b * x * (y - x * x), 2 * b * (y - x * x)];
}

// Theory surface (not in ARENA): the stretched bowl, Hessian diag(10, 1)
function stretched_bowl(x, y) { return 0.5 * (10 * x * x + y * y); }
function stretched_bowl_grad(x, y) { return [10 * x, y]; }

/* ARENA's solution classes, line for line. params = [xy] (one tensor of shape (2,)),
   theta.grad set by "backward"; every tensor op is elementwise over the 2 entries. */
class SGD {
  constructor(params, { lr, momentum = 0.0, weight_decay = 0.0 }) {
    this.params = params;
    this.lr = lr;
    this.mu = momentum;
    this.lmda = weight_decay;
    this.b = params.map((p) => new Float64Array(p.length));
  }
  step() {
    this.params.forEach((theta, pi) => {
      const b = this.b[pi];
      for (let i = 0; i < theta.length; i++) {
        let g = theta.grad[i];
        if (this.lmda !== 0) g = g + this.lmda * theta[i];
        if (this.mu !== 0) { b[i] = this.mu * b[i] + g; g = b[i]; }   // b.copy_(mu*b + g); g = b
        theta[i] -= this.lr * g;
      }
    });
  }
}
class RMSprop {
  constructor(params, { lr = 0.01, alpha = 0.99, eps = 1e-08, weight_decay = 0.0, momentum = 0.0 }) {
    this.params = params;
    this.lr = lr;
    this.eps = eps;
    this.mu = momentum;
    this.lmda = weight_decay;
    this.alpha = alpha;
    this.b = params.map((p) => new Float64Array(p.length));
    this.v = params.map((p) => new Float64Array(p.length));
  }
  step() {
    this.params.forEach((theta, pi) => {
      const b = this.b[pi], v = this.v[pi];
      for (let i = 0; i < theta.length; i++) {
        let g = theta.grad[i];
        if (this.lmda !== 0) g = g + this.lmda * theta[i];
        v[i] = this.alpha * v[i] + (1 - this.alpha) * g * g;          // v.copy_(alpha*v + (1-alpha)*g.pow(2))
        g = g / (Math.sqrt(v[i]) + this.eps);                          // g = g / (v.sqrt() + eps)
        if (this.mu > 0) { b[i] = this.mu * b[i] + g; g = b[i]; }
        theta[i] -= this.lr * g;
      }
    });
  }
}
class Adam {
  constructor(params, { lr = 0.001, betas = [0.9, 0.999], eps = 1e-08, weight_decay = 0.0 }) {
    this.params = params;
    this.lr = lr;
    [this.beta1, this.beta2] = betas;
    this.eps = eps;
    this.lmda = weight_decay;
    this.t = 1;
    this.m = params.map((p) => new Float64Array(p.length));
    this.v = params.map((p) => new Float64Array(p.length));
  }
  step() {
    this.params.forEach((theta, pi) => {
      const m = this.m[pi], v = this.v[pi];
      for (let i = 0; i < theta.length; i++) {
        let g = theta.grad[i];
        if (this.lmda !== 0) g = g + this.lmda * theta[i];
        m[i] = this.beta1 * m[i] + (1 - this.beta1) * g;
        v[i] = this.beta2 * v[i] + (1 - this.beta2) * g * g;
        const m_hat = m[i] / (1 - this.beta1 ** this.t);
        const v_hat = v[i] / (1 - this.beta2 ** this.t);
        theta[i] -= this.lr * m_hat / (Math.sqrt(v_hat) + this.eps);
      }
    });
    this.t += 1;
  }
}

// ARENA: opt_fn(fn, xy, optimizer_class, optimizer_hyperparams, n_iters) -> xy after every step
function opt_fn(grad, xy0, optimizer_class, optimizer_hyperparams, n_iters = 100, scale = 1) {
  const xy = Float64Array.from(xy0);                       // xy = t.tensor(start, requires_grad=True)
  const optimizer = new optimizer_class([xy], optimizer_hyperparams);
  const xy_list = [[xy[0], xy[1]]];
  for (let i = 0; i < n_iters; i++) {
    const g = grad(xy[0], xy[1]);                          // fn(xy[0], xy[1]).backward()
    xy.grad = [g[0] * scale, g[1] * scale];                // (loss x100 multiplies the gradient)
    optimizer.step();
    xy.grad = null;                                        // optimizer.zero_grad()
    if (!Number.isFinite(xy[0]) || !Number.isFinite(xy[1])) break;
    xy_list.push([xy[0], xy[1]]);
  }
  return xy_list;
}

const OPTIMISERS = {
  sgd: { cls: SGD, kw: (h) => ({ lr: h.lr, momentum: h.mu }) },
  mom: { cls: SGD, kw: (h) => ({ lr: h.lr, momentum: h.mu }) },
  rms: { cls: RMSprop, kw: (h) => ({ lr: h.lr, alpha: 0.99, momentum: h.mu }) },
  adam: { cls: Adam, kw: (h) => ({ lr: h.lr, betas: [h.mu, 0.999] }) },
};

const SURFACES = {
  ravine: { f: pathological_curve_loss, g: pathological_curve_grad, x: [-3, 3], y: [-7, 3], start: [2.5, 2.5], n: 100,
    pre: { sgd: { lr: 0.1, mu: 0 }, mom: { lr: 0.02, mu: 0.99 }, rms: { lr: 0.02, mu: 0.8 }, adam: { lr: 0.1, mu: 0.9 } } },
  banana: { f: rosenbrocks_banana_func, g: rosenbrocks_banana_grad, x: [-2.5, 2.5], y: [-2, 4], start: [-1.5, 2.5], n: 500,
    pre: { sgd: { lr: 0.001, mu: 0 }, mom: { lr: 0.001, mu: 0.99 }, rms: { lr: 0.01, mu: 0 }, adam: { lr: 0.1, mu: 0.9 } } },
  trimodal: { f: neg_trimodal_func, g: neg_trimodal_grad, x: [-2, 2], y: [-2, 2], start: [1.0, 1.0], n: 100,
    pre: { sgd: { lr: 0.1, mu: 0 }, mom: { lr: 0.1, mu: 0.5 }, rms: { lr: 0.1, mu: 0.5 }, adam: { lr: 0.1, mu: 0.9 } } },
  bowl: { f: stretched_bowl, g: stretched_bowl_grad, x: [-1, 1], y: [-3, 3], start: [0.5, -2.6], n: 60,
    pre: { sgd: { lr: 0.18, mu: 0 }, mom: { lr: 0.02, mu: 0.9 }, rms: { lr: 0.02, mu: 0 }, adam: { lr: 0.1, mu: 0.9 } } },
};

/* One ball's race: positions, and the loss / gradient it feels at every landing point. */
function trajectory(surfId, ballId, hp, scale = 1) {
  const s = SURFACES[surfId], O = OPTIMISERS[ballId];
  const xy = opt_fn(s.g, s.start, O.cls, O.kw(hp), s.n, scale);
  const loss = xy.map(([x, y]) => scale * s.f(x, y));
  const grad = xy.map(([x, y]) => s.g(x, y).map((v) => v * scale));
  return { xy, loss, grad };
}
const MATH = { pathological_curve_loss, pathological_curve_grad, neg_trimodal_func, neg_trimodal_grad,
  rosenbrocks_banana_func, rosenbrocks_banana_grad, stretched_bowl, stretched_bowl_grad, bivariate_gaussian,
  SGD, RMSprop, Adam, opt_fn, trajectory, SURFACES, OPTIMISERS };
// MATH-END

/* ============================================================ display setup */

const R = 0.066;                       // ball radius (world)
const TR = 0.012;                      // string radius
const BALLS = [
  { id: 'sgd', name: 'SGD', color: C.data },
  { id: 'mom', name: 'Momentum', color: C.aux },
  { id: 'rms', name: 'RMSprop', color: C.prob },
  { id: 'adam', name: 'Adam', color: C.dir },
];
const BALL = Object.fromEntries(BALLS.map((b) => [b.id, b]));
const LOOK = {   // display-only settings per surface (heights are compressed to fit; banana on a log scale)
  ravine: { size: 4.0, height: 1.25, show: (v) => v, rate: 30, g0: 0.35, fig: [1.74, 0.95], flags: [[0, -6.85]],
    flag: { 1: 'lowest point shown', 2: 'lowest visible point', 3: 'y_min (edge of view)' } },
  banana: { size: 4.0, height: 1.35, show: (v) => Math.log10(v), rate: 100, g0: 60, fig: [2.0, 0.9], flags: [[1, 1]],
    flag: { 1: 'the bottom (1, 1)', 2: 'minimum (1, 1)', 3: 'argmin (a, a²) = (1, 1)' } },
  trimodal: { size: 3.6, height: 0.7, show: (v) => v, rate: 30, g0: 3, fig: [2.08, 1.2], flags: means,
    tint: ['#8fc3b6', '#dfe7de', '#f1ebe0'],   // the plain is the top here: keep it pale, wells cool
    flag: { 1: 'three wells', 2: 'three minima', 3: 'means (σ = 0.2)' } },
  bowl: { size: 4.4, height: 1.3, show: (v) => v, rate: 18, g0: 5, fig: [2.08, 1.2], flags: [[0, 0]],
    flag: { 1: 'the bottom', 2: 'minimum (0, 0)', 3: 'argmin = 0' } },
};
const CAM = {   // authored views; fit: k = close-up (the kit otherwise zooms to fit the whole plinth)
  ravine: { pos: [4.1, 7.6, 7.5], target: [0, 0.5, 0.15] },
  zig: { pos: [2.9, 4.4, 5.6], target: [0.05, 0.4, 0.2], fit: 1 },
  bowl: { pos: [3.4, 7.2, 7.2], target: [0, 0.45, 0.1] },
  mom: { pos: [1.85, 8.9, 7.3], target: [0, 0.45, 0.45] },
  adam: { pos: [-4.4, 8.2, 8.4], target: [0, 0.45, 0.2] },
  top: { pos: [0, 11.6, 0.35], target: [0, 0.4, 0] },
  tri: { pos: [3.0, 9.6, 6.2], target: [0, 0.35, 0.05] },
  wide: { pos: [5.6, 8.3, 8.6], target: [0, 0.5, 0.1] },
  start: { pos: [3.4, 3.5, 1.5], target: [0.95, 1.15, -1.7], fit: 1 },
  arrow: { pos: [2.8, 2.9, 1.3], target: [0.37, 0.95, -1.45], fit: 1 },
};
const fmt = (v, d = 3) => K.fmt(v, d);
const fx = (v, d = 2) => (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d).replace('-', '−');
const pt = (p, d = 2) => `(${fx(p[0], d)}, ${fx(p[1], d)})`;          // a position, fixed decimals
const lit = (p) => `(${p.map((v) => String(v).replace('-', '−')).join(', ')})`;   // exact literals, e.g. (2.5, 2.5)

/* ======================================================== object behaviour */

function buildSurface(S, id) {
  const st = S.state, s = SURFACES[id], L = LOOK[id];
  if (st.hf) { S.root.remove(st.hf.mesh); st.hf.dispose(); }
  st.surf = id;
  st.hf = K.heightfield((x, y) => L.show(s.f(x, y)), {
    x: s.x, y: s.y, n: 112, size: L.size, height: L.height, base: 0.12, contours: 14, tint: L.tint,
  });
  S.root.add(st.hf.mesh);
  st.span = [s.x[1] - s.x[0], s.y[1] - s.y[0]];
  // flags at the minimum / minima
  st.flags.clear();
  L.flags.forEach(([x, y], i) => {
    const f = flagMesh();
    f.position.copy(st.hf.toWorld(x, y, 0));
    f.rotation.y = -0.6;
    st.flags.add(f);
    if (i === 0) st.flagTag.move(f.children[1]).set(L.flag);
  });
  // start ring
  st.ring.position.copy(st.hf.toWorld(s.start[0], s.start[1], 0.004));
  st.startTag.move(st.ring).set(`start ${lit(s.start)}`);
  // axes along the terrain edges
  const hf = st.hf, xs = s.x, ys = s.y;
  const p00 = hf.toWorld(xs[0], ys[0]), p10 = hf.toWorld(xs[1], ys[0]), p01 = hf.toWorld(xs[0], ys[1]);
  const lift = 0.03, off = 0.14;
  const ax0 = new THREE.Vector3(p00.x, lift, p00.z + off), ax1 = new THREE.Vector3(p10.x + 0.2, lift, p10.z + off);
  const ay0 = new THREE.Vector3(p00.x - off, lift, p00.z), ay1 = new THREE.Vector3(p01.x - off, lift, p01.z - 0.2);
  const az0 = new THREE.Vector3(p01.x - off, lift, p01.z - off), az1 = new THREE.Vector3(p01.x - off, 0.12 + L.height + 0.35, p01.z - off);
  st.axX.set(ax0, ax1); st.axY.set(ay0, ay1); st.axZ.set(az0, az1);
  st.tagX.move(ax1); st.tagY.move(ay1); st.tagZ.move(az1);
  // figure spot
  st.fig.place([L.fig[0], 0, L.fig[1]], [0, 0.6, 0]);
  // memory comb only fits beside the ravine
  if (id !== 'ravine') st.comb.visible = false;
}

function flagMesh() {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.34, 8).translate(0, 0.17, 0), K.mat.brass());
  pole.castShadow = true;
  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.lineTo(0.16, -0.045); shape.lineTo(0, -0.09); shape.closePath();
  const cloth = new THREE.Mesh(new THREE.ShapeGeometry(shape), K.mat.paint(C.good));
  cloth.material.side = THREE.DoubleSide;
  cloth.position.set(0.004, 0.335, 0);
  cloth.castShadow = true;
  g.add(pole, cloth);
  return g;
}

function resetPresets(S) {
  const st = S.state, pre = SURFACES[st.surf].pre;
  for (const b of BALLS) st.hp[b.id] = { ...pre[b.id] };
}

function syncKnobs(S) {   // show the focused ball's own lr / momentum in the drawer
  const h = S.state.hp[S.knobs.focus];
  S.setKnob('lr', h.lr, { silent: true });
  S.setKnob('mu', h.mu, { silent: true });
}

function compute(S) {
  const st = S.state, s = SURFACES[st.surf];
  const scale = S.knobs.x100 ? 100 : 1;
  st.scale = scale;
  st.n = s.n;
  st.rate = LOOK[st.surf].rate;
  st.P = {};
  for (const b of BALLS) {
    const P = trajectory(st.surf, b.id, st.hp[b.id], scale);
    // where it leaves the map (or blows up), and the edge point it crosses
    P.lost = -1;
    const [x0, x1] = s.x, [y0, y1] = s.y;
    const inside = ([x, y]) => x >= x0 && x <= x1 && y >= y0 && y <= y1;
    for (let k = 0; k < P.xy.length; k++) if (!inside(P.xy[k])) { P.lost = k; break; }
    if (P.lost < 0 && P.xy.length < s.n + 1) P.lost = P.xy.length;          // non-finite: blew up
    if (P.lost > 0) {
      const a = P.xy[P.lost - 1], b2 = P.xy[P.lost] || [a[0] + (a[0] - s.start[0]) * 10, a[1]];
      let t = 1;
      for (const [i, lo, hi] of [[0, x0, x1], [1, y0, y1]]) {
        const d = b2[i] - a[i];
        if (d > 0 && b2[i] > hi) t = Math.min(t, (hi - a[i]) / d);
        if (d < 0 && b2[i] < lo) t = Math.min(t, (lo - a[i]) / d);
      }
      P.edge = [a[0] + (b2[0] - a[0]) * t, a[1] + (b2[1] - a[1]) * t];
    }
    const last = P.lost > 0 ? P.lost : P.xy.length;
    P.W = P.xy.slice(0, last).map(([x, y]) => st.hf.toWorld(x, y, TR));
    if (P.lost > 0) P.W.push(st.hf.toWorld(P.edge[0], P.edge[1], TR));
    P.last = last;
    st.P[b.id] = P;
  }
  // ghosts: the x1 paths, shown while the loss is x100
  st.G = {};
  for (const b of BALLS) {
    const ball = st.balls[b.id];
    if (scale !== 1) {
      const G = trajectory(st.surf, b.id, st.hp[b.id], 1);
      st.G[b.id] = G;
      const pts = [];
      for (const [x, y] of G.xy) { if (x < s.x[0] || x > s.x[1] || y < s.y[0] || y > s.y[1]) break; pts.push(st.hf.toWorld(x, y, TR)); }
      ball.ghost.set(pts);
      ball.ghost.mesh.visible = true;
    } else ball.ghost.mesh.visible = false;
  }
}

/* ball position at fractional step u (hops along the string between landing points) */
const tmp = new THREE.Vector3();
function ballPos(S, P, u, out) {
  const st = S.state;
  const lastIdx = P.W.length - 1;
  const k = Math.min(Math.floor(u), lastIdx), f = Math.min(1, u - k);
  if (k >= lastIdx) {
    const q = P.lost > 0 ? P.edge : P.xy[lastIdx];
    return out.copy(st.hf.toWorld(q[0], q[1], R));
  }
  const a = P.W[k], b = P.W[k + 1];
  out.lerpVectors(a, b, f);
  const d = a.distanceTo(b);
  out.y += 4 * f * (1 - f) * (0.12 * d + 0.004) + (R - TR);
  const qa = P.xy[k], qb = (P.lost > 0 && k + 1 >= P.lost) ? P.edge : P.xy[k + 1];
  const floor = st.hf.z(qa[0] + (qb[0] - qa[0]) * f, qa[1] + (qb[1] - qa[1]) * f) + R;
  if (out.y < floor) out.y = floor;
  return out;
}

function draw(S) {
  const st = S.state;
  if (!st.P) return;
  const u = st.u;
  const k = Math.floor(u + 1e-9);
  for (const b of BALLS) {
    const P = st.P[b.id], ball = st.balls[b.id];
    ballPos(S, P, u, ball.mesh.position);
    const kk = Math.min(k, P.W.length - 1);
    const pts = P.W.slice(0, kk + 1);
    if (u < P.W.length - 1) pts.push(tmp.copy(ball.mesh.position).setY(ball.mesh.position.y - (R - TR)).clone());
    ball.tube.set(pts);
    const off = P.lost > 0 && u >= P.lost - 1e-9;
    ball.mesh.material.opacity = off ? 0.45 : 1;
    ball.mesh.material.transparent = off;
  }
  if (k !== st.kShown || st.dirty) { st.kShown = k; st.dirty = false; readouts(S); }
}

function stepIndex(S, P) {       // the landing point the ball currently stands on
  const k = Math.floor(S.state.u + 1e-9);
  return Math.min(k, P.last - 1);
}

function readouts(S) {
  const st = S.state, focus = S.knobs.focus, P = st.P[focus], B = BALL[focus];
  const k = stepIndex(S, P);
  const off = P.lost > 0 && st.u >= P.lost - 1e-9;
  const x100 = st.scale !== 1 ? ' (×100)' : '';
  // legend chips: live loss for each ball
  for (const b of BALLS) {
    const Q = st.P[b.id], kb = stepIndex(S, Q);
    const gone = Q.lost > 0 && st.u >= Q.lost - 1e-9;
    st.legend.set(b.id, gone ? 'off map' : fmt(Q.loss[kb], 3));
  }
  st.legend.active(focus);
  // readout pinned to the focused ball
  const slope = S.tier === 1 ? 'slope' : '|∇L|';
  if (off) {
    st.readout.set(`**${B.name}** · off the map at step ${P.lost}\nlast seen ${pt(P.xy[P.lost - 1])}`);
  } else {
    const g = P.grad[k];
    st.readout.set(`**${B.name}** · step ${k} · ${pt(P.xy[k])}\nloss${x100} ${fmt(P.loss[k], 3)} · ${slope} ${fmt(Math.hypot(g[0], g[1]), 2)}`);
  }
  // the red gradient arrow (uphill along the displayed surface)
  const g = P.grad[k], gl = Math.hypot(g[0], g[1]);
  const L = LOOK[st.surf];
  const len = 0.85 * (1 - Math.exp(-gl / (L.g0 * (st.scale || 1))));
  if (off || len < 0.03) st.arrow.show(false);
  else {
    const [x, y] = P.xy[k];
    const e = 1e-3 * Math.max(st.span[0], st.span[1]);
    const p0 = st.hf.toWorld(x, y, R), p1 = st.hf.toWorld(x + e * g[0] / gl, y + e * g[1] / gl, R);
    const dir = p1.sub(p0).normalize();
    st.arrow.show(true);
    st.arrow.set(p0, p0.clone().addScaledVector(dir, len + R));
  }
  note(S, k);
  S.invalidate();
}

/* the live-maths note (one per beat / prediction) */
const FREE_NOTES = { bowl: 1, comb: 1, first: 1, flat: 1 };   // free-standing; the rest hang under a ball
function note(S, k) {
  const st = S.state, mode = st.noteMode;
  const free = !!FREE_NOTES[mode];
  const N = free ? st.noteFree : st.note;
  (free ? st.note : st.noteFree).show(false);
  if (!mode) { N.show(false); return; }
  const P = st.P[S.knobs.focus];
  const h = st.hp[S.knobs.focus];
  N.show(true);
  if (mode === 'wall') {
    const g = P.grad[k];
    N.move(st.balls[S.knobs.focus].mesh).set(S.tier === 1
      ? `slope sideways ${fmt(Math.abs(g[0]), 2)}\nslope along the floor ${fmt(Math.abs(g[1]), 2)}`
      : `∂L/∂x (up the wall) ${fmt(g[0], 2)}\n∂L/∂y (along the floor) ${fmt(g[1], 2)}`);
  } else if (mode === 'bowl') {
    const plain = (S.knobs.focus === 'sgd' || S.knobs.focus === 'mom') && h.mu === 0;
    const ax = 1 - 10 * h.lr, ay = 1 - h.lr;
    N.move(st.noteAt).set(plain
      ? `each SGD step:\nx → x × (1 − 10·lr) = x × ${fmt(ax, 3)}\ny → y × (1 − lr) = y × ${fmt(ay, 3)}\n${Math.abs(ax) < 1 ? (ax < 0 ? 'swings shrink: it settles' : 'no swing: it slides in') : 'swings grow: it flies off'}`
      : `(1 − 10·lr) describes plain SGD:\nfocus SGD, momentum 0`);
  } else if (mode === 'comb') {
    const mu = st.hp.mom.mu, mem = mu < 1 ? fmt(1 / (1 - mu), 2) : '∞';
    const w = `μ = ${mu.toFixed(2)} → 1, ${fmt(mu, 2)}, ${fmt(mu * mu, 2)}, …`;
    N.move(st.combTop).set(S.tier === 1
      ? `each bar: how much a slope from\nk steps ago still counts\n${w}\nteal = memory ≈ ${mem} steps`
      : `bar k = μᵏ, the weight of the\ngradient from k steps ago\n${w}\nmemory ≈ 1/(1 − μ) = ${mem} steps (teal)`);
  } else if (mode === 'adam') {
    // Adam's latest step with the loss as set, beside the same step computed with the loss x1
    const A = st.P.adam, ka = stepIndex(S, A), j = Math.max(0, Math.min(ka, A.xy.length - 1) - 1);
    const d = (xy) => `(${fmt(xy[j + 1][0] - xy[j][0], 3)}, ${fmt(xy[j + 1][1] - xy[j][1], 3)})`;
    const G = st.G && st.G.adam;
    N.move(st.balls.adam.mesh).set(st.scale !== 1 && G
      ? `Adam's step ${j + 1}, (Δx, Δy):\nloss ×100: ${d(A.xy)}\nloss ×1: ${d(G.xy)}`
      : `Adam's step ${j + 1}, (Δx, Δy):\n${d(A.xy)} (loss ×1)`);
  } else if (mode === 'first') {
    const d = (id) => { const Q = st.P[id]; return pt([Q.xy[1][0] - Q.xy[0][0], Q.xy[1][1] - Q.xy[0][1]], 3); };
    N.move(st.noteAt).set(`first step (Δx, Δy)\nAdam ${d('adam')} · lr ${fmt(st.hp.adam.lr, 2)}\nRMSprop ${d('rms')} · lr ${fmt(st.hp.rms.lr, 2)}\nSGD ${d('sgd')}`);
  } else if (mode === 'flat') {
    // plain SGD where it stands (it never leaves the start on this plain)
    const Q = st.P.sgd, ks = stepIndex(S, Q), g = Q.grad[ks], gl = Math.hypot(g[0], g[1]), lr = st.hp.sgd.lr;
    N.move(st.balls.sgd.mesh).set(S.tier === 1
      ? `SGD feels a slope of ${fmt(gl, 2)}\nits step, lr × slope = ${fmt(lr * gl, 2)}: stuck`
      : `SGD: |∇L| = ${fmt(gl, 2)}\nstep lr·|∇L| = ${fmt(lr * gl, 2)}: stuck`);
  } else if (mode === 'arena') {
    const Q = st.P.sgd, ks = stepIndex(S, Q), e = Q.xy[ks];
    N.move(st.balls.sgd.mesh).set(`after ${ks} steps: (${e[0].toFixed(4)}, ${e[1].toFixed(4)})\nARENA prints tensor([0.2300, 1.4820]) after 100`);
  } else if (mode === 'arrow') {
    const g = P.grad[k];
    N.move(st.balls[S.knobs.focus].mesh).set(`∇L = ${pt(g, 2)} points uphill\nthe step is −lr·∇L: the other way`);
  }
}

/* the memory comb: bar k = μᵏ, the weight of the gradient from k steps ago. It stands along the
   front of the ravine (k = 0 on the left), so a front camera reads it like a bar chart. */
const COMB = { n: 20, x0: -1.1875, dx: 0.125, z: 2.24, h: 0.8 };
function buildComb(S) {
  const st = S.state, g = new THREE.Group(), { n, x0, dx, z } = COMB;
  const rail = new THREE.Mesh(new THREE.BoxGeometry(dx * (n - 1) + 0.12, 0.022, 0.07), K.mat.brass());
  rail.position.set(x0 + dx * (n - 1) / 2, 0.011, z);
  rail.castShadow = true; rail.receiveShadow = true;
  g.add(rail);
  st.combBars = [];
  const geo = new THREE.BoxGeometry(0.095, 1, 0.08).translate(0, 0.5, 0);
  st.combMat = { hot: K.mat.paint(C.aux), cold: K.mat.plaster('#ece5d8') };
  for (let k = 0; k < n; k++) {
    const m = new THREE.Mesh(geo, st.combMat.cold);
    m.position.set(x0 + dx * k, 0.022, z);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m); st.combBars.push(m);
  }
  st.combTop = new THREE.Vector3(x0 + dx * (n - 1) / 2, 0, z + 0.2);   // the note hangs below the comb
  st.comb = g;
  g.visible = false;
  S.root.add(g);
}
function paintComb(S) {
  const st = S.state, mu = st.hp.mom.mu, mem = mu < 1 ? 1 / (1 - mu) : Infinity;
  st.combBars.forEach((m, k) => {
    m.scale.y = Math.max(0.004, COMB.h * Math.pow(mu, k));   // honest heights: μᵏ
    m.material = k < mem - 1e-9 ? st.combMat.hot : st.combMat.cold;
  });
}

/* start / restart the race; resolves when the balls stop */
function race(S, o = {}) {
  const st = S.state;
  if (st.done) { const d = st.done; st.done = null; d(); }
  st.stopAt = o.stopAt ?? null;
  st.dirty = true;
  const end = st.stopAt ?? st.n;
  if (S.shot || o.instant) { st.u = end; st.playing = false; draw(S); S.invalidate(); return Promise.resolve(); }
  st.u = 0; st.t0 = null; st.pre = o.pre ?? 0.5; st.playing = true;
  draw(S);
  S.invalidate();
  return new Promise((res) => { st.done = res; });
}
function finish(S) {   // knob scrubs: show the whole race at once
  const st = S.state;
  if (st.done) { const d = st.done; st.done = null; d(); }
  st.playing = false; st.stopAt = null; st.u = st.n; st.dirty = true;
  draw(S);
}

/* scene configuration shared by beats and predictions */
function scene(S, o) {
  const st = S.state;
  st.noteMode = o.note || null;
  st.noteAt = o.noteAt ? new THREE.Vector3(...o.noteAt) : new THREE.Vector3(0, 1.9, 0);
  const onRavine = st.surf === 'ravine';
  st.comb.visible = !!o.comb && onRavine;
  if (st.comb.visible) paintComb(S);
  st.noteFree.anchor(o.noteAnchor || 'bottom');
  const axes = !!o.axes, up = axes && o.axes !== 'xy';   // 'xy': no loss axis (top view)
  st.axX.show(axes); st.axY.show(axes); st.axZ.show(up);
  st.tagX.show(axes); st.tagY.show(axes); st.tagZ.show(up);
  st.startTag.show(!!o.tags);
  st.flagTag.show(!!o.tags);
  if (o.figure) {
    st.fig.group.visible = true;
    const L = LOOK[st.surf];
    st.fig.place([L.fig[0], 0, L.fig[1]], o.face || [0, 0.6, 0.2]);
    st.fig.pose('stand', { ms: 0 });
    const doPose = () => st.fig.pose(o.figure, { at: o.at && (typeof o.at === 'function' ? o.at(S) : o.at) });
    if (S.shot) doPose(); else setTimeout(doPose, 520);
  } else st.fig.group.visible = false;
  st.dirty = true;
}

  rebuild(S, id) {
    const st = S.state, k = S.knobs, ch = new Set(S.changed);
    if (id === '*') {                                   // a beat or a prediction: deterministic setup

      resetPresets(S);
      const h = st.hp[k.focus];
      if (ch.has('lr')) h.lr = k.lr;
      if (ch.has('mu')) h.mu = k.mu;
      syncKnobs(S);
      st.readout.move(st.balls[k.focus].mesh);

      return;

  frame(S, t) {
    const st = S.state;
    if (!st.playing) return false;
    if (st.t0 == null) st.t0 = t;
    const end = st.stopAt ?? st.n;
    st.u = Math.min(end, Math.max(0, (t - st.t0 - st.pre) * st.rate));
    draw(S);
    if (st.u >= end) {
      st.playing = false;
      if (st.done) { const d = st.done; st.done = null; d(); }
      return false;
    }
    return true;
  },

      out.push(J.primitives.sphere({ radius: R, center: [e[0], e[1], e[2] + R * 0.6], segments: 16 }));
    }
    return out;
  },
