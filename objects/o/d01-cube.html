<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The matmul cube · Object Lessons</title>
<meta name="description" content="Every einsum is a box of products squashed along the letters that vanish: matmul, dot, outer, trace, transpose, batched matmul and attention scores as one lattice of multiplications.">
<link rel="stylesheet" href="../kit.css">
<style>
/* axis letters: einsum names are case-sensitive, so no uppercase here */
.k-label.k-letter{text-transform:none; letter-spacing:0; font:700 13px/1.15 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:color-mix(in srgb, var(--k-brass) 45%, var(--ink)); background:var(--wash); border:1px solid color-mix(in srgb, var(--k-brass) 40%, var(--rule));
  border-radius:6px; padding:1px 5px; min-width:0; box-shadow:var(--shadow-s)}  /* .k-tag (the beat pill) sets min-width:52px */
</style>
</head>
<body>
<script type="module">
import { run, THREE, J, K, C } from '../kit.js';

/* =========================================================================
   02 · d01-cube: "The matmul cube" (W1 deep, ARENA [0.0] einops & einsum)
   Every number on screen comes from the brute-force einsum below: it walks
   every assignment of the letters (one block of the box each), multiplies,
   and sums over the letters missing from the output. The MATH block is
   extracted and checked in node against plain loops and a Python run.
   ========================================================================= */

// MATH-BEGIN
/* Toy integers 0-3, so every product (<= 9) and sum can be checked by hand. A5[:3, :4] and
   B5[:4, :3] are the matrices on the Model Room miniature of this object. */
const A5 = [[2, 1, 0, 3, 1], [1, 3, 2, 0, 2], [0, 2, 1, 1, 3], [3, 0, 1, 2, 1], [1, 2, 3, 1, 0]];
const B5 = [[1, 0, 2, 1, 2], [3, 1, 0, 2, 1], [0, 2, 1, 3, 0], [1, 1, 3, 0, 2], [2, 3, 1, 1, 0]];
const A5b = [[1, 2, 1, 0, 3], [0, 1, 3, 2, 1], [2, 0, 1, 3, 0], [3, 1, 0, 1, 2], [1, 3, 2, 0, 1]];
const B5b = [[2, 1, 0, 3, 1], [0, 2, 1, 1, 3], [1, 0, 3, 2, 0], [3, 1, 2, 0, 1], [1, 2, 0, 1, 2]];
const VA = [2, 1, 3, 0, 2], VB = [1, 3, 2, 2, 1];

const crop = (M, r, c) => M.slice(0, r).map((row) => row.slice(0, c));
const range = (n) => Array.from({ length: n }, (_, i) => i);

/* einsum by brute force: every assignment of the letters is one cell of the box (one product of
   one entry from each input); letters missing after "->" are summed. einops spelling: names are
   separated by spaces, inputs by commas. A name repeated inside one input ties those axes
   together (trace). Returns the result and the full list of cells ("terms"). */
function parseEinsum(spec) {
  const [lhs, rhs] = spec.split('->');
  const ins = lhs.split(',').map((s) => s.trim().split(/\s+/).filter(Boolean));
  const out = rhs.trim() ? rhs.trim().split(/\s+/) : [];
  return { ins, out };
}
function shapeOf(t) { const d = []; for (let x = t; Array.isArray(x); x = x[0]) d.push(x.length); return d; }
function entry(t, idx) { let x = t; for (const i of idx) x = x[i]; return x; }
function zeros(sh) { return sh.length ? range(sh[0]).map(() => zeros(sh.slice(1))) : 0; }
function einsum(spec, ...ops) {
  const { ins, out } = parseEinsum(spec);
  if (ins.length !== ops.length) throw new Error('einsum: ' + ins.length + ' inputs named, ' + ops.length + ' given');
  const size = {};
  ins.forEach((names, o) => {
    const sh = shapeOf(ops[o]);
    if (sh.length !== names.length) throw new Error('einsum: input ' + o + ' has ' + sh.length + ' dims');
    names.forEach((n, a) => {
      if (size[n] != null && size[n] !== sh[a]) throw new Error('einsum: size mismatch for ' + n);
      size[n] = sh[a];
    });
  });
  const letters = [...new Set(ins.flat())];
  for (const n of out) if (!(n in size)) throw new Error('einsum: output letter ' + n + ' not in inputs');
  const summed = letters.filter((n) => !out.includes(n));
  const outShape = out.map((n) => size[n]);
  let res = out.length ? zeros(outShape) : 0;
  const terms = [];
  const total = letters.reduce((p, n) => p * size[n], 1);
  for (let cnum = 0; cnum < total; cnum++) {
    const at = {};
    let r = cnum;
    for (let a = letters.length - 1; a >= 0; a--) { const n = letters[a]; at[n] = r % size[n]; r = Math.floor(r / size[n]); }
    const idx = ins.map((names) => names.map((n) => at[n]));
    const factors = idx.map((ix, o) => entry(ops[o], ix));
    const v = factors.reduce((p, x) => p * x, 1);
    const o = out.map((n) => at[n]);
    if (out.length) { let x = res; for (let a = 0; a < o.length - 1; a++) x = x[o[a]]; x[o[o.length - 1]] += v; } else res += v;
    terms.push({ at, idx, factors, v, out: o });
  }
  return { res, terms, letters, summed, size, outShape, ins, out };
}

/* the inputs of each mode, cropped to the knob sizes (rows, depth, cols) */
function operands(mode, nr, nd, nc) {
  switch (mode) {
    case 'mm': return { spec: 'i k, k j -> i j', ops: [crop(A5, nr, nd), crop(B5, nd, nc)] };
    case 'mv': return { spec: 'i j, j -> i', ops: [crop(A5, nr, nd), B5.slice(0, nd).map((row) => row[0])] };
    case 'dot': return { spec: 'i, i ->', ops: [VA.slice(0, nd), VB.slice(0, nd)] };
    case 'outer': return { spec: 'i, j -> i j', ops: [VA.slice(0, nr), VB.slice(0, nc)] };
    case 'trace': return { spec: 'i i ->', ops: [crop(A5, nr, nr)] };
    case 'sum': return { spec: 'i j ->', ops: [crop(A5, nr, nc)] };
    case 'tr': return { spec: 'i j -> j i', ops: [crop(A5, nr, nc)] };
    case 'bmm': return { spec: 'b i k, b k j -> b i j', ops: [[crop(A5, nr, nd), crop(A5b, nr, nd)], [crop(B5, nd, nc), crop(B5b, nd, nc)]] };
    case 'attn': {   // b = 1, two heads; head 0 is exactly the matmul box (K[k, h=0, d] = B5[d][k])
      const q = range(nr).map((p) => [0, 1].map((h) => range(nd).map((d) => (h ? A5b : A5)[p][d])));
      const k = range(nc).map((p) => [0, 1].map((h) => range(nd).map((d) => (h ? B5b : B5)[d][p])));
      return { spec: 'b q h d, b k h d -> b h q k', ops: [[q], [k]] };
    }
    default: throw new Error('mode ' + mode);
  }
}
const MATH = { A5, B5, A5b, B5b, VA, VB, crop, einsum, parseEinsum, shapeOf, entry, operands };
// MATH-END

/* BOX-MACHINE-BEGIN ===========================================================
   THE SQUASH BOX. One machine, two pages: d01-cube and d04-squash carry identical copies of
   this block (the kit stays untouched). A plan lists every product cell ("term": value v,
   lattice slot, output bin) and the numbered plaques on the box's faces. Blocks are instanced;
   a block's length along the squash axis is v·u and its footprint is fixed, so squashing =
   sliding blocks onto the output face, where each bin's blocks stack into a bar whose length
   is exactly the sum. The squash axis is chosen per plan: 'back' (depth), 'right' (across) or
   'floor' (down). World: y up; rows r run down, cols c run +x, depth d runs +z (toward you).
   ========================================================================== */
const BOX = (() => {
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const sm = (x) => x * x * (3 - 2 * x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const OTHER = { x: ['y', 'z'], y: ['x', 'z'], z: ['x', 'y'] };
  const FACE = {   // n: normal into the box; R, U: the plaque's text right / up directions
    back: { ax: 'z', dir: 1, n: [0, 0, 1], R: [1, 0, 0], U: [0, 1, 0] },
    right: { ax: 'x', dir: -1, n: [-1, 0, 0], R: [0, 0, 1], U: [0, 1, 0] },
    floor: { ax: 'y', dir: 1, n: [0, 1, 0], R: [1, 0, 0], U: [0, 0, -1] },
  };
  const PAL = {
    fwd: { base: ['#f5efe4', '#e2d5bf'], focus: ['#2f6fdb', '#5f92e8'], tap: '#16398f' },
    bwd: { base: ['#f6e3dd', '#e6c3b8'], focus: ['#d64545', '#e57878'], tap: '#962323' },
    zero: '#c9bfad',
  };
  const TONE = {
    data: { cell: '#f8f4ec', soft: '#d2dff7', strong: '#2f6fdb', ink: '#1f3f82', head: '#2f6fdb' },
    grad: { cell: '#fbf2ef', soft: '#f6d4cf', strong: '#d64545', ink: '#8a2424', head: '#c43b3b' },
    out: { cell: '#f3eee5', soft: '#e9dcc4', strong: '#b58a3c', ink: '#2b2a33', head: '#9a7431' },
    idle: { cell: '#eee8de', soft: '#e2dace', strong: '#8f8676', ink: '#a0978a', head: '#8f8676' },
    ones: { cell: '#f2f0ec', soft: '#dbe4f4', strong: '#6f8fcf', ink: '#6d7a93', head: '#6f8fcf' },
  };
  const FONT = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
  const FLOOR = 0.05;          // plaque thickness; the box floor sits on top of it
  function rrect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function atlas(aniso) {        // number tiles 0..99 for the bar caps
    const cv = document.createElement('canvas'); cv.width = cv.height = 1024;
    const g = cv.getContext('2d'), cell = 102.4;
    for (let n = 0; n < 100; n++) {
      const x = (n % 10) * cell, y = Math.floor(n / 10) * cell;
      g.fillStyle = '#fbf8f2'; rrect(g, x + 6, y + 6, cell - 12, cell - 12, 17); g.fill();
      g.lineWidth = 3; g.strokeStyle = '#c9b793'; g.stroke();
      g.fillStyle = '#2b2a33'; g.font = `700 ${n > 9 ? 50 : 58}px ${FONT}`;
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n), x + cell / 2, y + cell / 2 + 3);
    }
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso;
    return t;
  }

  /* ---- plan builder for product boxes (every einsum with two inputs) ----
     o = { s, u, face, tone, E (einsum result), map(at) -> {box, r, d, c},
           boxes: [{ n: {r, d, c}, ox, frame }], zBack, plaques: [{ box, face, num(r, c), tone, role, title }],
           tags: [{ box, edge: 'r' | 'd' | 'c', letter, summed }], label(term) -> {lab, num}, binName(bin) } */
  function lattice(o) {
    const s = o.s, F = FACE[o.face];
    const P = { s, u: o.u, fw: 0.74 * s, face: o.face, tone: o.tone, kind: 'lattice', terms: [], bins: [], boxes: [],
      plaques: [], tags: o.tags || [], ghosts: [], extraTags: o.extraTags || [] };
    for (const bx of o.boxes) {
      const n = bx.n, x0 = bx.ox, e = { x0, x1: x0 + n.c * s, y0: FLOOR, y1: FLOOR + n.r * s, z0: o.zBack, z1: o.zBack + n.d * s };
      P.boxes.push({ n, e, frame: bx.frame !== false, stack: 0,
        X: (c) => e.x0 + (c + 0.5) * s, Y: (r) => e.y1 - (r + 0.5) * s, Z: (d) => e.z0 + (d + 0.5) * s });
    }
    const index = new Map();
    for (const tm of o.E.terms) {
      const d = o.map(tm.at), B = P.boxes[d.box];
      const key = d.box + '|' + tm.out.join(',');
      let b = index.get(key);
      if (b == null) {
        b = P.bins.length; index.set(key, b);
        P.bins.push({ key, box: d.box, out: tm.out, terms: [], total: 0, face: o.face,
          cell: o.face === 'back' ? [d.r, d.c] : o.face === 'right' ? [d.r, d.d] : [d.d, d.c] });
      }
      const L = tm.v * o.u;
      P.terms.push({ v: tm.v, bin: b, box: d.box, r: d.r, d: d.d, c: d.c, ax: F.ax, dir: F.dir, path: 'lerp',
        p0: V(B.X(d.c), B.Y(d.r), B.Z(d.d)), L, tm, tone: o.tone, alt: 0,
        wave: (d.r + d.d + d.c) / Math.max(1, B.n.r + B.n.d + B.n.c - 3), ...(o.label ? o.label(tm) : {}) });
      P.bins[b].terms.push(P.terms.length - 1); P.bins[b].total += tm.v;
    }
    const nrm = V(...F.n);
    for (const Bn of P.bins) {
      const B = P.boxes[Bn.box], e = B.e, T0 = P.terms[Bn.terms[0]];
      const dist = (T) => (o.face === 'back' ? T.d : o.face === 'right' ? B.n.c - 1 - T.c : B.n.r - 1 - T.r);
      const order = Bn.terms.slice().sort((a, b) => dist(P.terms[a]) - dist(P.terms[b]));
      Bn.base = o.face === 'back' ? V(B.X(T0.c), B.Y(T0.r), e.z0) : o.face === 'right' ? V(e.x1, B.Y(T0.r), B.Z(T0.d)) : V(B.X(T0.c), e.y0, B.Z(T0.d));
      Bn.nv = nrm.clone(); Bn.up = V(...(o.face === 'floor' ? [0, 0, -1] : [0, 1, 0]));
      let off = 0; Bn.top = -1;
      order.forEach((n, j) => {
        const T = P.terms[n];
        T.alt = j % 2;
        T.p1 = Bn.base.clone().addScaledVector(nrm, off + T.L / 2);
        off += T.L;
        if (T.v > 0) Bn.top = n;
      });
      Bn.len = off; Bn.single = Bn.terms.length === 1;
      B.stack = Math.max(B.stack, off, 0.04);
      Bn.name = o.binName ? o.binName(Bn) : '';
    }
    for (const q of o.plaques || []) P.plaques.push(plaqueOn(P, q));
    return P;
  }
  function plaqueOn(P, q) {    // a numbered plaque on one face of box q.box, cells aligned with the slots
    const B = P.boxes[q.box || 0], e = B.e, n = B.n;
    const rows = q.face === 'floor' ? n.d : n.r, cols = q.face === 'right' ? n.d : n.c;
    const corner = q.face === 'back' ? V(e.x0, e.y1, e.z0) : q.face === 'right' ? V(e.x1, e.y1, e.z0) : V(e.x0, e.y0, e.z0);
    const proj = q.proj || (q.face === 'back' ? (T) => [T.r, T.c] : q.face === 'right' ? (T) => [T.r, T.d] : (T) => [T.d, T.c]);
    return { box: q.box || 0, rows, cols, corner, proj, ...q };
  }

  /* ---- the machine ---- */
  function create(S) {
    const root = new THREE.Group();
    S.root.add(root);
    const M = { S, root, plan: null, f: 1, t: 0, focusBin: -1, tapTerm: -1, tapNote: null, tok: 0, plaques: [],
      text: null, onTap: null, lattice, FACE, sm, clamp01 };
    const aniso = Math.min(8, S.renderer ? S.renderer.capabilities.getMaxAnisotropy() : 1);

    const CAPT = 260;
    const blocks = new THREE.InstancedMesh(new THREE.RoundedBoxGeometry(1, 1, 1, 2, 0.06),
      new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.84, metalness: 0 }), CAPT);
    blocks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    blocks.castShadow = true; blocks.receiveShadow = true; blocks.frustumCulled = false;
    const white = new THREE.Color('#ffffff');
    for (let n = 0; n < CAPT; n++) blocks.setColorAt(n, white);
    blocks.count = 0;
    root.add(blocks);

    const ghosts = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), K.mat.glass(C.data, 0.16), 32);
    ghosts.count = 0; ghosts.frustumCulled = false; ghosts.renderOrder = 3;
    root.add(ghosts);

    const edges = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), K.mat.brass(), 24);
    edges.count = 0; edges.castShadow = true; edges.frustumCulled = false;
    root.add(edges);

    const CAPN = 64;
    const capGeo = new THREE.BufferGeometry();
    const capPos = new Float32Array(CAPN * 12), capUV = new Float32Array(CAPN * 8), idx = [];
    for (let q = 0; q < CAPN; q++) { const a = q * 4; idx.push(a, a + 1, a + 2, a, a + 2, a + 3); }
    capGeo.setIndex(idx);
    const capPosAttr = new THREE.BufferAttribute(capPos, 3).setUsage(THREE.DynamicDrawUsage);
    const capUVAttr = new THREE.BufferAttribute(capUV, 2);
    capGeo.setAttribute('position', capPosAttr);
    capGeo.setAttribute('uv', capUVAttr);
    capGeo.setDrawRange(0, 0);
    const caps = new THREE.Mesh(capGeo, new THREE.MeshBasicMaterial({ map: atlas(aniso), alphaTest: 0.5 }));
    caps.frustumCulled = false;
    root.add(caps);

    M.anchor = new THREE.Object3D(); root.add(M.anchor);
    M.read = K.label(M.anchor, '', { cls: 'readout', dy: -12 });
    M.read.show(false);
    const tagPool = [];

    /* ---------- plaques (canvas textures, one per matrix face) ---------- */
    const PX = 112;
    function makePlaque(q) {
      const F = FACE[q.face], s = M.plan.s;
      const m = 0.14 * s, hh = q.title ? 0.5 * s : 0, headTop = q.face !== 'floor';
      const W = q.cols * s + 2 * m, H = q.rows * s + 2 * m + hh;
      const cv = document.createElement('canvas');
      cv.width = Math.round(W / s * PX); cv.height = Math.round(H / s * PX);
      const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = aniso;
      const R = V(...F.R), U = V(...F.U), N = V(...F.n);
      const quat = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(R, U, N));
      const TL = q.corner.clone().addScaledVector(R, -m).addScaledVector(U, m + (headTop ? hh : 0));
      const ctr = TL.clone().addScaledVector(R, W / 2).addScaledVector(U, -H / 2);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, metalness: 0 }));
      mesh.quaternion.copy(quat); mesh.position.copy(ctr).addScaledVector(N, 0.003); mesh.receiveShadow = true;
      const th = FLOOR;
      const slab = new THREE.Mesh(new THREE.BoxGeometry(W + 0.03, H + 0.03, th), K.mat.plaster('#e6dfd2'));
      slab.quaternion.copy(quat); slab.position.copy(ctr).addScaledVector(N, -th / 2); slab.castShadow = true; slab.receiveShadow = true;
      root.add(mesh, slab);
      const Q = { q, mesh, slab, cv, g: cv.getContext('2d'), tex, m, hh, headTop, key: null, visible: true };
      K.pick(mesh, (hit) => tapPlaque(Q, hit));
      return Q;
    }
    function dropPlaques() {
      for (const Q of M.plaques) {
        K.unpick(Q.mesh);
        root.remove(Q.mesh, Q.slab);
        Q.mesh.geometry.dispose(); Q.mesh.material.dispose(); Q.tex.dispose(); Q.slab.geometry.dispose(); Q.slab.material.dispose();
      }
      M.plaques = [];
    }
    function drawPlaque(Q, hl) {
      const key = [...hl].join(';') + '|' + (Q.q.stamp || '');
      if (key === Q.key) return;
      Q.key = key;
      const { q, g, cv } = Q, tone = TONE[q.tone || 'data'], s = M.plan.s;
      const mpx = Q.m / s * PX, hpx = Q.hh / s * PX, W = cv.width, H = cv.height;
      g.clearRect(0, 0, W, H);
      g.fillStyle = '#ebe4d6'; g.fillRect(0, 0, W, H);
      g.strokeStyle = 'rgba(181,138,60,0.8)'; g.lineWidth = 6; g.strokeRect(3, 3, W - 6, H - 6);
      const gy = (Q.headTop ? hpx : 0) + mpx;
      if (q.title) {
        g.fillStyle = tone.head; g.textAlign = 'left'; g.textBaseline = 'middle';
        let fs = Math.round(PX * 0.34);
        g.font = `700 ${fs}px ${FONT}`;
        while (fs > 14 && g.measureText(q.title).width > W - 2 * mpx - 8) { fs -= 2; g.font = `700 ${fs}px ${FONT}`; }
        const hy = Q.headTop ? mpx * 0.55 + hpx / 2 : gy + q.rows * PX + mpx * 0.45 + hpx / 2;
        g.fillText(q.title, mpx + 4, hy);
      }
      const ins = PX * 0.07;
      for (let r = 0; r < q.rows; r++) for (let c = 0; c < q.cols; c++) {
        const x = mpx + c * PX, y = gy + r * PX, h = hl.get(r * 64 + c) || 0;
        g.fillStyle = h === 2 ? tone.strong : h === 1 ? tone.soft : tone.cell;
        rrect(g, x + ins, y + ins, PX - 2 * ins, PX - 2 * ins, PX * 0.13); g.fill();
        const txt = q.num ? q.num(r, c) : null;
        if (txt != null && txt !== '') {
          g.fillStyle = h === 2 ? '#ffffff' : tone.ink;
          g.font = `700 ${Math.round(PX * (String(txt).length > 2 ? 0.36 : 0.5))}px ${FONT}`;
          g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText(String(txt), x + PX / 2, y + PX / 2 + PX * 0.03);
        }
      }
      Q.tex.needsUpdate = true;
    }
    function hlFor(Q) {
      const hl = new Map(), P = M.plan, q = Q.q, B = M.focusBin >= 0 ? P.bins[M.focusBin] : null;
      if (q.role === 'out') {
        if (B && B.box === q.box && B.face === q.face && B.cell) hl.set(B.cell[0] * 64 + B.cell[1], 2);
        if (q.outProj && B) { const rc = q.outProj(B); if (rc) hl.set(rc[0] * 64 + rc[1], 2); }
        return hl;
      }
      if (B) for (const n of B.terms) {
        const T = P.terms[n]; if (T.box !== q.box) continue;
        const rc = q.proj(T); if (rc) hl.set(rc[0] * 64 + rc[1], 1);
      }
      if (M.tapTerm >= 0) {
        const T = P.terms[M.tapTerm];

  const n0 = { r: 1, d: nk, c: 1 }, n1 = { r: ni, d: 1, c: nj };
  const boxes = [{ n: n0 }, { n: n1 }], gap = 1.3, s = slotSize(boxes, gap), zBack = place(boxes, s, gap);
  const d = MATH.operands('dot', ni, nk, nj), o = MATH.operands('outer', ni, nk, nj);
  const Ed = MATH.einsum(d.spec, ...d.ops), Eo = MATH.einsum(o.spec, ...o.ops);
  const E = { terms: [...Ed.terms.map((t) => ({ ...t, at: { ...t.at, box: 0 } })), ...Eo.terms.map((t) => ({ ...t, at: { ...t.at, box: 1 } }))] };
  const map = (at) => (at.box === 0 ? { box: 0, r: 0, d: at.i, c: 0 } : { box: 1, r: at.i, d: 0, c: at.j });
  const [a0, b0] = d.ops, [a1, b1] = o.ops;
  const plaques = [
    { box: 0, face: 'right', tone: 'data', role: 'in', num: (r, c) => a0[c], title: `a  ${nk}` },
    { box: 0, face: 'floor', tone: 'data', role: 'in', num: (r) => b0[r], title: `b  ${nk}` },
    { box: 0, face: 'back', tone: 'out', role: 'out', num: null, title: 'a·b' },
    { box: 1, face: 'right', tone: 'data', role: 'in', num: (r) => a1[r], title: `a  ${ni}` },
    { box: 1, face: 'floor', tone: 'data', role: 'in', num: (r, c) => b1[c], title: `b  ${nj}` },
    { box: 1, face: 'back', tone: 'out', role: 'out', num: null, title: `outer  ${ni}×${nj}` },
  ];
  const tags = [{ box: 0, edge: 'd', letter: 'i', summed: true }, { box: 1, edge: 'r', letter: 'i' }, { box: 1, edge: 'c', letter: 'j' }];
  const extraTags = [{ box: 0, text: '"i, i ->"', lift: 0.62 * s + 0.16 }, { box: 1, text: '"i, j -> i j"' }];
  const P = BOX.lattice({ s, u: s / 9, face: 'back', tone: 'fwd', E, map, boxes: boxes.map((b) => ({ n: b.n, ox: b.ox })),
    zBack, plaques, tags, extraTags, label: labeller(['a', 'b']),
    binName: (B) => (B.box === 0 ? 'a·b' : `outer[${idxStr(B.out)}]`) });
  P.mode = 'vv'; P.spec = 'i, i ->  |  i, j -> i j'; P.dims = { ni, nk, nj };
  return P;
}

/* one input only: trace ("i i ->"), sum of all ("i j ->"), transpose ("i j -> j i").
   The matrix is a plaque on the back wall; its entries stand out of it as blocks. */
function planSingle(mode, ni, nj) {
  const { spec, ops } = MATH.operands(mode, ni, 1, nj);
  const E = MATH.einsum(spec, ...ops), Mx = ops[0], nr = Mx.length, nc = Mx[0].length, nmax = Math.max(nr, nc);
  const s = Math.min(0.9, 3.2 / (nmax + 0.8));
  const x0 = -nmax * s / 2, yTop = BOX.FLOOR + nmax * s, z0 = mode === 'tr' ? -0.9 : -0.6;
  const X = (c) => x0 + (c + 0.5) * s, Y = (r) => yTop - (r + 0.5) * s;
  const maxBin = mode === 'tr' ? 3 : Math.max(1, E.res);
  const u = Math.min(s / 3, 2.3 / maxBin);
  const P = { s, u, fw: 0.74 * s, face: 'back', tone: 'fwd', kind: mode === 'tr' ? 'flip' : 'gather', terms: [], bins: [],
    boxes: [{ n: { r: nr, d: 1, c: nc }, e: { x0, x1: x0 + nmax * s, y0: BOX.FLOOR, y1: yTop, z0, z1: z0 + 0.3 }, frame: false, stack: 0 }],
    plaques: [], tags: [], ghosts: [], extraTags: [], mode, spec, dims: { ni, nk: 1, nj } };
  const nz = new THREE.Vector3(0, 0, 1), up = new THREE.Vector3(0, 1, 0);
  const Lmax = 3 * u, h = (nmax - 1) * s * 0.72 + 0.55 * s + Lmax / 2;
  if (mode === 'tr') P.flip = { c: new THREE.Vector3(X(0), Y(0), z0 + h + Lmax / 2), n: new THREE.Vector3(1, -1, 0).normalize(), h };
  E.terms.forEach((tm, n) => {
    const [r, c] = tm.idx[0], L = tm.v * u;
    const T = { v: tm.v, box: 0, r, c, d: 0, ax: 'z', dir: 1, grow: 'face', path: mode === 'tr' ? 'flip' : 'gather', L, tm, tone: 'fwd',
      alt: n % 2, wave: (r + c) / Math.max(1, nr + nc - 2), p0: new THREE.Vector3(X(c), Y(r), z0 + L / 2),
      lab: `M[${r},${c}]`, num: String(tm.v) };
    P.terms.push(T);
  });
  if (mode === 'tr') {
    P.terms.forEach((T, n) => {
      const B = { box: 0, out: [T.c, T.r], terms: [n], total: T.v, face: 'back', cell: null, base: new THREE.Vector3(X(T.r), Y(T.c), z0),
        nv: nz.clone(), up: up.clone(), top: T.v > 0 ? n : -1, single: true, name: `Mᵀ[${T.c},${T.r}]` };
      T.bin = P.bins.length; P.bins.push(B);
      T.p1 = B.base.clone().addScaledVector(nz, T.L / 2);
      T.pL = T.p0.clone().addScaledVector(nz, P.flip.h);
      T.pR = T.pL.clone().sub(P.flip.c).applyAxisAngle(P.flip.n, Math.PI).add(P.flip.c);
    });
  } else {
    const B = { box: 0, out: [], terms: [], total: 0, face: 'back', cell: null, base: new THREE.Vector3(X(0), Y(0), z0),
      nv: nz.clone(), up: up.clone(), top: -1, single: false, name: mode === 'trace' ? 'trace' : 'sum' };
    let off = 0;
    P.terms.forEach((T, n) => {
      T.bin = 0; B.terms.push(n); B.total += T.v;
      T.p1 = B.base.clone().addScaledVector(nz, off + T.L / 2); off += T.L;
      if (T.v > 0) B.top = n;
    });
    P.bins.push(B);
  }
  const corner = new THREE.Vector3(x0, yTop, z0);
  const onDiag = (r, c) => mode !== 'trace' || r === c;
  P.plaques.push({ box: 0, face: 'back', rows: nr, cols: nc, corner, tone: 'data', role: 'in', title: `M  ${nr}×${nc}`,
    num: (r, c) => Mx[r][c], proj: (T) => [T.r, T.c], showIf: mode === 'tr' ? (t) => t < 0.5 : null,
    note: (r, c) => (onDiag(r, c) ? null : `M[${r},${c}] = ${Mx[r][c]}: off the diagonal, so not in the box`) });
  if (mode === 'tr') {
    P.plaques.push({ box: 0, face: 'back', rows: nc, cols: nr, corner, tone: 'data', role: 'out', title: `Mᵀ  ${nc}×${nr}`,
      num: (r, c) => Mx[c][r], proj: (T) => [T.c, T.r], outProj: (B) => B.out, showIf: (t) => t >= 0.5 });
  }
  const m = 0.14 * s;
  const rowL = mode === 'tr' ? (t) => (t < 0.5 ? 'i' : 'j') : 'i';
  const colL = mode === 'trace' ? 'i' : mode === 'tr' ? (t) => (t < 0.5 ? 'j' : 'i') : 'j';
  P.tags = [
    { box: 0, edge: 'r', letter: rowL, summed: mode !== 'tr', anchor: 'right', at: () => [x0 - m - 0.04, (yTop + Y(nr - 1)) / 2, z0] },
    { box: 0, edge: 'c', letter: colL, summed: mode === 'sum', anchor: 'bottom', at: () => [x0 + nc * s / 2, yTop + 0.5 * s + m + 0.05, z0] },
  ];
  return P;
}

function buildPlan(mode, ni, nk, nj) {
  if (mode === 'trace' || mode === 'sum' || mode === 'tr') return planSingle(mode, ni, nj);
  return planProduct(mode, ni, nk, nj);
}
function findBin(P, key) { const b = P.bins.findIndex((B) => `${B.box}|${B.out.join(',')}` === key); return b; }
function defaultFocus(P) {
  const pref = { mm: '0|1,0', mv: '0|1', bmm: '0|0,1,0', attn: '0|0,0,1,0', outer: '0|1,2', vv: '0|' }[P.mode];
  const b = pref != null ? findBin(P, pref) : -1;
  return b >= 0 ? b : 0;
}

/* ============================================================ readout */

const X1 = (s, tier) => (tier === 1 ? s.replace(/·/g, ' × ') : s);
function sumLine(P, B, tier) {
  const nums = B.terms.map((n) => P.terms[n].num);
  let body = nums.join(' + ');
  if (nums.length > 6) body = `${nums.slice(0, 4).join(' + ')} + … + ${nums[nums.length - 1]} (${nums.length} numbers)`;
  if (B.single && P.kind === 'lattice') return `**${B.name}** = ${X1(nums[0], tier)} = ${B.total}`;
  if (P.kind === 'flip') return `**${B.name}** = M[${B.out[1]},${B.out[0]}] = ${B.total}`;
  return `**${B.name}** = ${X1(body, tier)} = ${B.total}`;
}
function readout(S) {
  return (M) => {
    const P = M.plan; if (!P) return '';
    const tier = S.tier, lines = [];
    if (M.tapNote) lines.push(M.tapNote);
    if (M.tapTerm >= 0) {
      const T = P.terms[M.tapTerm];
      if (P.kind === 'lattice') lines.push(`**${X1(T.lab, tier)}** = ${X1(T.num, tier)} = ${T.v}`);
      else lines.push(`**${T.lab}** = ${T.v}${P.kind === 'flip' ? ` → Mᵀ[${T.c},${T.r}]` : ''}`);
    }
    if (M.focusBin >= 0 && S.state.sums !== false) {
      const B = P.bins[M.focusBin];
      if (!(B.single && M.tapTerm >= 0 && P.kind === 'lattice')) lines.push(sumLine(P, B, tier));
    }
    if (S.state.count) {
      const n = P.terms.length, d = P.dims;
      lines.push(tier === 1 ? `${n} blocks = ${n} multiplications`
        : P.mode === 'mm' ? `i·k·j = ${d.ni}·${d.nk}·${d.nj} = ${n} multiplications` : `${n} blocks = ${n} multiplications`);
    }
    return lines.join('\n');
  };
}

/* ============================================================ scenes */

function scene(S, o = {}) {
  const st = S.state, M = st.box;
  M.cancel();
  st.count = !!o.count; st.sums = o.sums !== false;
  M.showTags(o.tags !== false);
  if (o.focus != null) {
    const b = typeof o.focus === 'string' ? findBin(M.plan, o.focus) : o.focus;
    let term = -1;
    if (o.tap) term = M.plan.terms.findIndex((T) => T.box === o.tap[0] && T.r === o.tap[1] && T.d === o.tap[2] && T.c === o.tap[3]);
    M.focus(b, term);
  } else M.focus(-1, -1);
  const F = st.fig;
  if (o.figure) {
    F.group.visible = true;
    F.place(o.figAt || [-1.75, 0, 1.2], [0, 0.7, 0]);
    F.pose('stand', { ms: 0 });
    const doPose = () => { if (st.fig.group.visible) F.pose(o.figure, { at: o.at ? o.at(S) : undefined }); };
    if (S.shot) doPose(); else setTimeout(doPose, 600);
  } else F.group.visible = false;
}
function termWorld(S, n) {
  const M = S.state.box, T = M.plan.terms[n];
  if (!T) return [0, 0.8, 0];
  const p = T.p0.clone(); M.root.localToWorld(p);
  return [p.x, p.y, p.z];
}
async function fillThenSquash(S, o = {}) {
  const M = S.state.box;
  M.cancel();
  M.t = 0; M.f = o.fill === false ? 1 : 0; M.update();
  if (o.fill !== false && !(await M.to('f', 1, 1300, (p) => p))) return false;
  if (o.squash === false) { S.setKnob('squash', 0, { silent: true }); return true; }
  if (!(await M.wait(o.pause ?? 350))) return false;
  const ok = await M.to('t', 1, o.ms ?? 1500);
  if (ok) S.setKnob('squash', 1, { silent: true });
  return ok;
}
function play(S) { return fillThenSquash(S); }

/* the worked numbers the captions quote are computed here, from the maths above */
const W = (() => {
  const mm = MATH.operands('mm', 3, 4, 3), E = MATH.einsum(mm.spec, ...mm.ops);
  const t10 = E.terms.filter((t) => t.out[0] === 1 && t.out[1] === 0);
  const c10 = { expr: t10.map((t) => t.factors.join('·')).join(' + '), plain: t10.map((t) => t.factors.join('×')).join(' + '), v: E.res[1][0] };
  const d = MATH.operands('dot', 3, 3, 3), Ed = MATH.einsum(d.spec, ...d.ops);
  const tr = MATH.operands('trace', 3, 3, 3), Et = MATH.einsum(tr.spec, ...tr.ops);
  const b = MATH.operands('bmm', 3, 4, 5), Eb = MATH.einsum(b.spec, ...b.ops);
  const o345 = MATH.operands('mm', 3, 4, 5), m345 = MATH.einsum(o345.spec, ...o345.ops);
  const s33 = MATH.operands('sum', 3, 1, 3), Es = MATH.einsum(s33.spec, ...s33.ops);
  const o33 = MATH.operands('outer', 3, 1, 3), Eo = MATH.einsum(o33.spec, ...o33.ops);
  const wrongs = [E.res[0][0], E.res[2][0], E.res[0][2]];
  return { c10, C: E.res, count343: E.terms.length, dot: Ed.res, dotExpr: Ed.terms.map((t) => t.factors.join('·')).join(' + '),
    trace: Et.res, traceExpr: Et.terms.map((t) => t.factors[0]).join(' + '), bmmShape: Eb.outShape, count345: m345.terms.length,
    sum33: Es.res, outerN: Eo.terms.length, wrongs };
})();
