<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>From a table to a network</title>
<meta name="theme-color" content="#1c2140">
<style>
#predict{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(18,20,44,.55);z-index:5;padding:14px;box-sizing:border-box}
#predict.on{display:flex}
#predict .card{background:#fbf6ea;color:#2a2934;border-radius:6px;max-width:360px;width:100%;padding:14px 14px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);font:15px/1.35 system-ui,-apple-system,'Segoe UI',sans-serif;transform:rotate(-.6deg)}
#predict .q{font:700 18px 'Comic Neue','Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive;margin:0 0 4px}
#predict .sub{font-size:13px;color:#5a5566;margin:0 0 10px}
#predict button.opt{display:block;width:100%;text-align:left;margin:0 0 7px;padding:9px 10px;border-radius:8px;border:1.5px solid #c8b8ea;background:#fff;color:#2a2934;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
#predict button.opt:hover,#predict button.opt:focus{background:#f7e3a0;outline:none}
#predict button.skipq{background:none;border:0;color:#6b5a9a;text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:4px 0;min-height:32px}
</style>
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;
  function R32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function argmaxTie(q, r) { var m = Math.max.apply(null, q), b = []; for (var k = 0; k < q.length; k++) if (q[k] === m) b.push(k); return b[Math.floor(r() * b.length)]; }

  /* ================= 1. tabular Q-learning on a 4x6 cliff world (ARENA [2.1] QLearning.learn) ================= */
  // gamma = 1, reward -1 per step, -100 for the cliff (back to start), epsilon 0.1, lr 0.5.
  var CR = 4, CC = 6, S0 = 18, GOALS = 23;
  function cstep(s, a) {
    var r = Math.floor(s / CC), c = s % CC;
    if (a === 0) r = Math.max(0, r - 1); else if (a === 1) c = Math.min(CC - 1, c + 1); else if (a === 2) r = Math.min(CR - 1, r + 1); else c = Math.max(0, c - 1);
    if (r === 3 && c > 0 && c < 5) return { s2: S0, r: -100, cliff: true, done: false, tile: r * CC + c };
    var s2 = r * CC + c; return { s2: s2, r: -1, done: s2 === GOALS, tile: s2 };
  }
  var TAB = (function () {
    var rnd = R32(7), Q = [], log = []; for (var i = 0; i < CR * CC; i++) Q.push([0, 0, 0, 0]);
    for (var e = 0; e < 60; e++) {
      var s = S0, n = 0;
      while (n++ < 200) {
        var a = rnd() < 0.1 ? Math.floor(rnd() * 4) : argmaxTie(Q[s], rnd), o = cstep(s, a);
        var mx = o.done ? 0 : Math.max.apply(null, Q[o.s2]), old = Q[s][a];
        Q[s][a] = old + 0.5 * (o.r + 1 * mx - old);            // Q[s,a] += lr * (r + gamma * max Q[s'] - Q[s,a])
        log.push({ e: e, s: s, a: a, r: o.r, tile: o.tile, old: old, mx: mx, nw: Q[s][a], cliff: !!o.cliff, Q: Q.map(function (q) { return q.slice(); }) });
        s = o.s2; if (o.done) break;
      }
    }
    return log;
  })();

  /* ================= 2. a tiny DQN on a paper corridor, trained live in JS ================= */
  // state x in [0,1); actions 0 = left, 1 = right (step 0.1); reward 1 on reaching x >= 1 (terminated). Net: x -> 16 tanh -> 2.
  var HN = 16;
  function newNet() { var r = R32(11), p = { w1: [], b1: [], w2: [[], []], b2: [0, 0] }; for (var j = 0; j < HN; j++) { p.w1.push((r() * 2 - 1) * 2); p.b1.push(r() * 2 - 1); p.w2[0].push((r() * 2 - 1) * .3); p.w2[1].push((r() * 2 - 1) * .3); } return p; }
  function clone(p) { return { w1: p.w1.slice(), b1: p.b1.slice(), w2: [p.w2[0].slice(), p.w2[1].slice()], b2: p.b2.slice() }; }
  function fwd(p, x) { var h = [], q = [p.b2[0], p.b2[1]]; for (var j = 0; j < HN; j++) { h.push(Math.tanh(p.w1[j] * x + p.b1[j])); q[0] += p.w2[0][j] * h[j]; q[1] += p.w2[1][j] * h[j]; } return { h: h, q: q }; }
  function envStep(x, a) { var x2 = a === 1 ? x + 0.1 : Math.max(0, x - 0.1); return x2 >= 1 - 1e-9 ? { x2: 1, r: 1, d: 1 } : { x2: x2, r: 0, d: 0 }; }
  function vstar(x, g) { return x >= 1 ? 0 : Math.pow(g, Math.max(1, Math.ceil((1 - x) / 0.1 - 1e-9)) - 1); }
  function qstar(x, a, g) { return a === 1 ? (x + 0.1 >= 1 - 1e-9 ? 1 : g * vstar(x + 0.1, g)) : g * vstar(Math.max(0, x - 0.1), g); }
  var PROBE = []; for (var pi = 0; pi < 20; pi++) PROBE.push(pi / 20 + 0.025);
  function probeLoss(p, g) {   // mean squared TD error over 20 probe states x 2 actions, target from the live net
    var L = 0; PROBE.forEach(function (x) { for (var a = 0; a < 2; a++) { var o = envStep(x, a), tg = o.r + g * (1 - o.d) * Math.max.apply(null, fwd(p, o.x2).q), td = tg - fwd(p, x).q[a]; L += td * td; } });
    return L / 40;
  }
  function Trainer(opt) {
    var T = { opt: opt, g: opt.gamma, lr: opt.lr, r: R32(3), p: newNet(), buf: [], x: 0, ep: 0, st: 0, hist: [], dead: false, last: 0 };
    T.tp = clone(T.p); T.x = T.r() * 0.9;
    T.step = function () {
      if (T.dead) return;
      var q = fwd(T.p, T.x).q, a = T.r() < 0.3 ? (T.r() < .5 ? 0 : 1) : (q[1] >= q[0] ? 1 : 0), o = envStep(T.x, a);
      T.buf.push([T.x, a, o.r, o.x2, o.d]); if (T.buf.length > 1000) T.buf.shift(); T.ep++;
      if (o.d || T.ep >= 30) { T.ep = 0; T.x = T.r() * 0.9; } else T.x = o.x2;
      var batch = []; if (T.opt.replay) { for (var b = 0; b < 16; b++) batch.push(T.buf[Math.floor(T.r() * T.buf.length)]); } else batch.push(T.buf[T.buf.length - 1]);
      var tn = T.opt.target ? T.tp : T.p, p = T.p, gw1 = [], gb1 = [], gw2 = [[], []], gb2 = [0, 0], j;
      for (j = 0; j < HN; j++) { gw1.push(0); gb1.push(0); gw2[0].push(0); gw2[1].push(0); }
      batch.forEach(function (e) {
        var tg = e[2] + T.g * (1 - e[4]) * Math.max.apply(null, fwd(tn, e[3]).q), f = fwd(p, e[0]), td = tg - f.q[e[1]], dq = -2 * td / batch.length;
        gb2[e[1]] += dq; for (var k = 0; k < HN; k++) { gw2[e[1]][k] += dq * f.h[k]; var dh = dq * p.w2[e[1]][k] * (1 - f.h[k] * f.h[k]); gw1[k] += dh * e[0]; gb1[k] += dh; }
      });
      for (j = 0; j < HN; j++) { p.w1[j] -= T.lr * gw1[j]; p.b1[j] -= T.lr * gb1[j]; p.w2[0][j] -= T.lr * gw2[0][j]; p.w2[1][j] -= T.lr * gw2[1][j]; }
      p.b2[0] -= T.lr * gb2[0]; p.b2[1] -= T.lr * gb2[1];
      T.st++; if (T.opt.target && T.st % 100 === 0) T.tp = clone(p);         // our toy: copy every 100 steps (ARENA: trains_per_target_update)
      if (T.st % 25 === 0) {
        var L = probeLoss(p, T.g); if (!isFinite(L) || L > 1e3) { T.dead = true; L = 1e3; }
        T.last = L; T.hist.push({ st: T.st, L: L, p: T.dead ? null : clone(p) });
      }
    };
    return T;
  }
  function run(replay, target) { var T = Trainer({ replay: replay, target: target, gamma: 0.99, lr: 0.35 }); for (var i = 0; i < 3000; i++) T.step(); return T; }
  var RUN_BOTH = run(true, true), RUN_NOREP = run(false, true), RUN_NOTGT = run(true, false);
  function blowup(Tr) { for (var i = 0; i < Tr.hist.length; i++) if (Tr.hist[i].L >= 1e3) return Tr.hist[i].st; return null; }
  var BU_NOREP = blowup(RUN_NOREP), BU_NOTGT = blowup(RUN_NOTGT);
  function histAt(Tr, st) { var h = Tr.hist, i = clamp(Math.floor(st / 25) - 1, 0, h.length - 1); while (i > 0 && !h[i].p) i--; return h[i]; }
  // the numbers lit up in the final code scene: one real transition through the trained 'both' net
  var FIN = RUN_BOTH.hist[RUN_BOTH.hist.length - 1].p, TGT = RUN_BOTH.tp;
  var EX = (function () { var x = 0.45, o = envStep(x, 1), tmax = Math.max.apply(null, fwd(TGT, o.x2).q), pred = fwd(FIN, x).q[1], td = o.r + 0.99 * tmax * (1 - o.d) - pred; return { x: x, x2: o.x2, tmax: tmax, pred: pred, td: td, loss: td * td }; })();

  /* ================= drawing helpers ================= */
  function hex(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function mix(a, b, t) { var A1 = hex(a), B1 = hex(b); return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(lerp(A1[i], B1[i], t)); }).join(',') + ')'; }
  function bg(ctx, W, H, t, d) { F.sky(ctx, W, H, mix('#1c2140', '#2e4f6b', d), mix('#2b2f5c', '#5f8f9a', d)); F.stars(ctx, W, H, t, 'dqn', Math.round(40 * (1 - d))); }
  function mono(ctx, s, x, y, sz, color, align, weight) { ctx.save(); ctx.font = (weight || '600') + ' ' + sz + 'px ' + F.MONO; ctx.fillStyle = color || P.ink; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.restore(); }
  function card(ctx, cx, cy, w, h, seed, color) { F.paper(ctx, cx, cy, w, h, color || P.cream, { seed: seed, rot: 0 }); }
  function fade(ctx, a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; fn(); ctx.restore(); }
  function ph(W) { return W < 500; }
  function robot(ctx, x, y, s, t) {
    ctx.save(); ctx.translate(x, y + Math.sin(t * 5) * s * .06);
    F.paper(ctx, 0, 0, s * 1.1, s, P.sky, { seed: 'bot', rot: 0, shadow: false });
    ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(-s * .2, -s * .08, s * .09, 0, 7); ctx.arc(s * .2, -s * .08, s * .09, 0, 7); ctx.fill();
    ctx.strokeStyle = P.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, -s * .5); ctx.lineTo(0, -s * .75); ctx.stroke();
    ctx.fillStyle = P.butter; ctx.beginPath(); ctx.arc(0, -s * .8, s * .1, 0, 7); ctx.fill(); ctx.restore();
  }
  function qColor(v) { var u = clamp((v + 12) / 12, 0, 1); return mix('#e8747c', '#b9e3cc', u); }
  // the cliff world with a Q table: each tile split into 4 triangles (up/right/down/left) shaded by Q
  function grid(ctx, x0, y0, cs, Q, opts) {
    opts = opts || {};
    for (var s = 0; s < CR * CC; s++) {
      var r = Math.floor(s / CC), c = s % CC, x = x0 + c * cs, y = y0 + r * cs, cliff = r === 3 && c > 0 && c < 5;
      if (cliff) { F.paper(ctx, x + cs / 2, y + cs / 2, cs - 3, cs - 3, P.orange, { seed: 'cl' + s, rot: 0, shadow: false }); mono(ctx, 'cliff', x + cs / 2, y + cs / 2, Math.max(9, cs * .2), P.ink, 'center'); continue; }
      var q = Q ? Q[s] : [0, 0, 0, 0], cx = x + cs / 2, cy = y + cs / 2, crn = [[x, y], [x + cs, y], [x + cs, y + cs], [x, y + cs]];
      for (var a = 0; a < 4; a++) {
        var p1 = crn[a], p2 = crn[(a + 1) % 4];
        ctx.fillStyle = s === GOALS ? P.butter : (q[a] === 0 ? 'rgba(251,246,234,.9)' : qColor(q[a]));
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(42,41,52,.35)'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, cs - 1, cs - 1);
      if (s === GOALS) { mono(ctx, 'goal', cx, cy, Math.max(9, cs * .22), P.ink, 'center', '700'); continue; }
      if (Q && opts.arrows && Math.max.apply(null, q) !== 0) {
        var m = Math.max.apply(null, q), a2 = q.indexOf(m), d = [[0, -1], [1, 0], [0, 1], [-1, 0]][a2];
        ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - d[0] * cs * .18, cy - d[1] * cs * .18); ctx.lineTo(cx + d[0] * cs * .22, cy + d[1] * cs * .22); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx + d[0] * cs * .22, cy + d[1] * cs * .22, 2.5, 0, 7); ctx.fillStyle = P.ink; ctx.fill();
      }
      if (Q && opts.values) mono(ctx, Math.max.apply(null, q).toFixed(1), cx, y + cs - 8, Math.max(8, cs * .17), P.ink, 'center');
    }
  }
  // log-scale TD loss plot
  function lossPlot(ctx, x, y, w, h, series, upto, sz) {
    card(ctx, x + w / 2, y + h / 2, w, h, 'lp' + w, P.cream);
    var gx0 = x + 44, gx1 = x + w - 12, gy0 = y + h - 22, gy1 = y + 28, lo = -5, hi = 3;
    var X = function (st) { return gx0 + (gx1 - gx0) * st / 3000; }, Y = function (L) { return lerp(gy0, gy1, (clamp(Math.log10(Math.max(L, 1e-5)), lo, hi) - lo) / (hi - lo)); };
    mono(ctx, 'TD loss (log)', x + 10, y + 13, sz, '#6b5a9a', 'left', '700');
    ctx.strokeStyle = 'rgba(42,41,52,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(gx0, gy1); ctx.lineTo(gx0, gy0); ctx.lineTo(gx1, gy0); ctx.stroke();
    [-4, -2, 0, 2].forEach(function (e) { mono(ctx, '1e' + e, gx0 - 4, Y(Math.pow(10, e)), 10, '#5a5566', 'right'); });
    mono(ctx, 'steps → 3000', gx1, gy0 + 11, 10, '#5a5566', 'right');
    series.forEach(function (sr) {
      ctx.strokeStyle = sr.color; ctx.lineWidth = 2.4; ctx.beginPath(); var started = false, lastX = 0, lastY = 0;
      sr.T.hist.forEach(function (hh) { if (hh.st > upto) return; var px = X(hh.st), py = Y(hh.L); if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py); lastX = px; lastY = py; });
      ctx.stroke();
      if (started && sr.label) mono(ctx, sr.label, Math.min(lastX + 4, gx1 - 70), lastY + (sr.dy || -9), 11, sr.ink || P.ink, 'left', '700');
      var bu = blowup(sr.T); if (bu && bu <= upto) { ctx.fillStyle = '#b3443c'; mono(ctx, '✕ blew up @' + bu, X(bu) + 4, gy1 + 6 + (sr.dy > 0 ? 14 : 0), 11, '#b3443c', 'left', '700'); }
    });
  }
  // Q(x, left) and Q(x, right) from a net vs the true Q* (dashed)
  function qPlot(ctx, x, y, w, h, p, g, sz, title) {
    card(ctx, x + w / 2, y + h / 2, w, h, 'qp' + w, P.cream);
    var gx0 = x + 34, gx1 = x + w - 12, gy0 = y + h - 22, gy1 = y + 28, lo = Math.floor((Math.pow(g, 10) - 0.06) * 20) / 20, X = function (v) { return lerp(gx0, gx1, v); }, Y = function (v) { return lerp(gy0, gy1, (clamp(v, lo - .03, 1.08) - lo) / (1.05 - lo)); };
    mono(ctx, title || 'Q(x, ·)  vs  true Q* (dashed)', x + 10, y + 13, sz, '#6b5a9a', 'left', '700');
    ctx.strokeStyle = 'rgba(42,41,52,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(gx0, gy1); ctx.lineTo(gx0, gy0); ctx.lineTo(gx1, gy0); ctx.stroke();
    mono(ctx, 'x = 0', gx0, gy0 + 11, 10, '#5a5566', 'center'); mono(ctx, 'goal', gx1, gy0 + 11, 10, '#5a5566', 'center'); mono(ctx, '1', gx0 - 4, Y(1), 10, '#5a5566', 'right'); mono(ctx, lo.toFixed(2), gx0 - 4, Y(lo), 10, '#5a5566', 'right');
    [[0, '#c0602a'], [1, '#2c5f8a']].forEach(function (c) {
      ctx.strokeStyle = c[1]; ctx.lineWidth = 1.6; ctx.setLineDash([4, 4]); ctx.beginPath();
      for (var i = 0; i <= 90; i++) { var v = i / 100; ctx[i ? 'lineTo' : 'moveTo'](X(v), Y(qstar(v, c[0], g))); } ctx.stroke(); ctx.setLineDash([]);
      if (p) { ctx.lineWidth = 2.6; ctx.beginPath(); for (i = 0; i <= 90; i++) { v = i / 100; ctx[i ? 'lineTo' : 'moveTo'](X(v), Y(fwd(p, v).q[c[0]])); } ctx.stroke(); }
    });
    mono(ctx, '← left', gx0 + 6, gy1 + 2, 11, '#c0602a', 'left', '700'); mono(ctx, 'right →', gx0 + 64, gy1 + 2, 11, '#2c5f8a', 'left', '700');
  }
  function cartpole(ctx, x, y, s, ang, t) {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = 'rgba(253,250,240,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-s * 3, s * .5); ctx.lineTo(s * 3, s * .5); ctx.stroke();
    F.paper(ctx, 0, 0, s * 1.4, s * .6, P.peach, { seed: 'cart', rot: 0 });
    ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(-s * .4, s * .32, s * .14, 0, 7); ctx.arc(s * .4, s * .32, s * .14, 0, 7); ctx.fill();
    ctx.rotate(ang); F.paper(ctx, 0, -s * 1.2, s * .16, s * 2.4, P.butter, { seed: 'pole', rot: 0 }); ctx.restore();
  }

  /* ================= predict, then watch (never gated) ================= */
  var QT = 83.5, Q = { done: false, prev: -1, choice: null, el: null };
  var QOPTS = [['a', 'Same curve, just a bit noisier'], ['b', 'Better: fresher, more relevant data'], ['c', 'It stalls high, then blows up']];
  function buildQ(api) {
    if (Q.el) return Q.el;
    var d = document.createElement('div'); d.id = 'predict';
    d.innerHTML = '<div class="card"><p class="q">Predict: bin the shoebox. The net learns from each step as it happens, in order. What does the TD loss do?</p><p class="sub">same net, same lr 0.35, same γ 0.99, target net still on</p>' +
      QOPTS.map(function (o) { return '<button class="opt" data-c="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '<button class="skipq">just show me &#9654;</button></div>';
    api.root.querySelector('.stage').appendChild(d);
    d.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    [].forEach.call(d.querySelectorAll('button'), function (b) { b.onclick = function (e) { e.stopPropagation(); Q.choice = b.dataset.c || 'skip'; hideQ(api, true); if (b.dataset.c) api.audio.blip(b.dataset.c === 'c' ? 880 : 520); }; });
    Q.el = d; return d;
  }
  function isPlaying(api) { return api.root.querySelector('.pp').getAttribute('aria-label') === 'Pause'; }
  function showQ(api) { var d = buildQ(api); d.classList.add('on'); if (isPlaying(api)) api.root.querySelector('.pp').click(); }
  function hideQ(api, resume) { if (!Q.el) return; Q.el.classList.remove('on'); if (resume && !isPlaying(api)) api.root.querySelector('.pp').click(); }

  var ACT = ['up', 'right', 'down', 'left'];
  function tabIndex(l) { if (l < 2) return -1; if (l < 10) return Math.floor(l - 2); return Math.min(TAB.length - 1, 8 + Math.floor(Math.pow(ramp(l, 10, 23), 1.6) * (TAB.length - 9))); }
  var NB = [10, 100]; // bins per CartPole number

  /* ================= the scenes (split into captioned beats further down) ================= */
  var base = [
    { name: 'what is this worth?', start: 0, dur: 16, cap: {
        1: 'A paper robot on a <b>cliff walk</b>: start bottom-left, goal bottom-right, a cliff in between. Every step costs 1; falling costs 100 and sends it home. Written on the start tile: <b>what is this worth?</b>',
        2: 'An MDP: states (24 tiles), actions (up, right, down, left), rewards (−1 a step, −100 the cliff), discount γ. Q(s, a) is the total reward you expect if you take action a in s and then play well.',
        3: 'ARENA [2.1] Bellman optimality: Q*(s,a) = E[r + γ max<sub>a′</sub> Q*(s′,a′) | s, a]. Value is defined recursively: this tile is worth its reward plus the best of the next tile. Here γ = 1 and the answer turns out to be an exact integer.' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t, .5); var sm = ph(W), cs = Math.min((W - 30) / CC, (H * .55) / CR, 90), gx = W / 2 - cs * CC / 2, gy = sm ? 70 : H * .2;
        card(ctx, W / 2, gy + cs * CR / 2, cs * CC + 16, cs * CR + 16, 'board', P.paper); grid(ctx, gx, gy, cs, null);
        robot(ctx, gx + cs / 2, gy + cs * 3.5, cs * .5, t);
        F.lantern(ctx, gx + cs * 5.5, gy + cs * 3.5 - cs * .1, cs * .16, .8 + .2 * Math.sin(t * 3), t);

      } };
    });
  }
