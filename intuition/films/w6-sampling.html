<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Choose a word, open the hood</title>
<meta name="theme-color" content="#1c2140">
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;

  /* ---------------- the real maths: logits -> temperature -> top-k / top-p -> sample ----------------
     Toy logits for the word after "The cat sat on the"; the final logits are a base plus four
     attention heads' direct contributions, so zeroing a head (a hook) really changes them. */
  var VOC = ['mat', 'sofa', 'rug', 'bed', 'floor', 'hat', 'dog', 'moon'];
  var LOG = [3.0, 2.5, 2.1, 1.6, 1.4, 0.8, 0.1, -0.6];
  var HEADS = [
    { name: 'L1H0', what: 'furniture', c: [1.2, .9, 1.0, .6, .5, 0, -.3, -.5] },
    { name: 'L1H1', what: 'animal', c: [0, .2, 0, .3, 0, .2, .8, 0] },
    { name: 'L1H2', what: 'prev "the"', c: [.2, .1, .1, .1, .2, .4, .2, .3] },
    { name: 'L1H3', what: 'rhymes w/ cat', c: [.9, 0, 0, 0, 0, .9, 0, 0] }];
  function logitsWith(off) { return LOG.map(function (v, i) { var s = v; HEADS.forEach(function (h, j) { if (off && off[j]) s -= h.c[i]; }); return s; }); }
  function softmax(z) { var m = Math.max.apply(null, z), e = z.map(function (v) { return Math.exp(v - m); }), S = e.reduce(function (a, b) { return a + b; }, 0); return e.map(function (v) { return v / S; }); }
  // mirrors ARENA's TransformerSampler: apply_temperature, then sample_top_k / sample_top_p
  function dist(lg, T, k, p) {
    var q = softmax(lg.map(function (v) { return v / T; })), idx = q.map(function (v, i) { return i; }).sort(function (a, b) { return q[b] - q[a]; }), keep = q.map(function () { return true; }), c = 0;
    if (k > 0) idx.forEach(function (i, r) { if (r >= k) keep[i] = false; });
    if (p > 0) idx.forEach(function (i) { if (c >= p) keep[i] = false; c += q[i]; });
    var S = 0; q.forEach(function (v, i) { if (keep[i]) S += v; });
    return { raw: q, p: q.map(function (v, i) { return keep[i] ? v / S : 0; }), keep: keep, idx: idx };
  }
  function draw(d, u) { var c = 0; for (var i = 0; i < d.p.length; i++) { c += d.p[i]; if (u < c) return i; } return d.idx[0]; }
  function entropy(p) { var h = 0; p.forEach(function (v) { if (v > 0) h -= v * Math.log2(v); }); return h; }
  var U_FILM = 0.52; // the film's one "random" draw, fixed so every viewing matches the captions

  /* ---------------- layout ---------------- */
  var L = {};
  function lay(W, H) {
    L.W = W; L.H = H; L.por = H > W * 1.1; L.n = VOC.length;
    L.cw = Math.min((W - 16) / L.n, 110); L.x0 = W / 2 - L.cw * L.n / 2;
    L.base = H * (L.por ? .72 : .78); L.hmax = H * (L.por ? .36 : .34);
    L.top = H * (L.por ? .2 : .2);
  }
  function lx(i) { return L.x0 + L.cw * (i + .5); }
  function bg(ctx, W, H, t) { F.sky(ctx, W, H, P.night, '#34396e'); F.stars(ctx, W, H, t, 'w6', 50); F.paper(ctx, W / 2, L.base + (H - L.base) / 2 + 30, W + 20, H - L.base + 30, '#2e3466', { seed: 'table', shadow: false }); }
  // lanterns on poles: pole height = logit, glow & size = probability
  function lanterns(ctx, lg, d, t, o) {
    o = o || {}; var lo = -1.5, hi = 4.5;
    for (var i = 0; i < L.n; i++) {
      var x = lx(i), h = (lg[i] - lo) / (hi - lo) * L.hmax, y = L.base - h, pr = d ? d.p[i] : 0, cut = d && !d.keep[i];
      ctx.save(); ctx.globalAlpha = cut ? .3 : 1;
      ctx.strokeStyle = '#a58b6a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, L.base); ctx.lineTo(x, y); ctx.stroke();
      F.lantern(ctx, x, y - 8, Math.min(13, L.cw * .26) * (.6 + Math.sqrt(pr) * 1.1), pr > .08 ? 1 : .15 + pr * 6, t + i);
      ctx.restore();
      F.hand(ctx, VOC[i], x, L.base + 13, L.W < 500 ? 12 : 15, o.pick === i ? P.butter : cut ? 'rgba(253,250,240,.35)' : P.chalk, { seed: 'v' + i });
      if (d) F.hand(ctx, (pr * 100).toFixed(pr < .1 ? 1 : 0) + '%', x, L.base + 29, L.W < 500 ? 11 : 13, cut ? 'rgba(253,250,240,.35)' : P.mint, { seed: 'p' + i, bold: false });
      if (o.showLogit) F.hand(ctx, lg[i].toFixed(1), x, y - 28, 11, P.butter, { seed: 'l' + i, bold: false, outline: 3, outlineColor: 'rgba(20,20,50,.7)' });
    }
  }
  function readout(ctx, x, y, lines, W) {
    var sz = W < 500 ? 12 : 14; ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l[0]).width); }); ctx.restore();
    if (x < 0) x = (W - w - 22) / 2;
    F.paper(ctx, x + w / 2 + 10, y + lines.length * sz * .65 + 4, w + 22, lines.length * sz * 1.3 + 12, 'rgba(22,26,53,.9)', { seed: 'ro' + lines.length, shadow: false });
    ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; ctx.textBaseline = 'top';
    lines.forEach(function (l, i) { ctx.fillStyle = l[1] || P.chalk; ctx.fillText(l[0], x + 10, y + 8 + i * sz * 1.3); }); ctx.restore();
  }
  function lbl(ctx, text, x, y, color, sz) { F.hand(ctx, text, x, y, sz || 15, color || P.chalk, { outline: 4, outlineColor: 'rgba(20,20,50,.8)', seed: text }); }
  // paper fortune-teller (cootie catcher), opening and closing
  function fortune(ctx, x, y, s, open, text, reveal) {
    var cols = [P.pink, P.butter, P.mint, P.sky];
    for (var k = 0; k < 4; k++) {
      var a = k * Math.PI / 2 + Math.PI / 4, off = s * .12 * open;
      ctx.save(); ctx.translate(x + Math.cos(a) * off, y + Math.sin(a) * off); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * .55, -s * .42); ctx.lineTo(s * .75, 0); ctx.lineTo(s * .55, s * .42); ctx.closePath();
      ctx.fillStyle = cols[k]; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(42,41,52,.4)'; ctx.lineWidth = 1; ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * .75, 0); ctx.stroke();
      ctx.restore();
    }
    if (text) F.note(ctx, text, x, y + s * .95, L.W < 500 ? 16 : 20, { rot: -.03, seed: 'q', reveal: reveal, color: P.cream });
  }
  function sentence(ctx, words, y, hiLast) {
    var sz = L.W < 500 ? 14 : 18, txt = words.join(' '), w = F.textW(ctx, txt, sz) + 26;
    F.paper(ctx, L.W / 2, y, Math.min(L.W - 12, w), sz * 2, P.cream, { seed: 'sent' + words.length, rot: -.01 });
    var x = L.W / 2 - (w - 26) / 2;
    words.forEach(function (wd, i) { var ww = F.textW(ctx, wd + ' ', sz); F.hand(ctx, wd, x, y, sz, hiLast && i === words.length - 1 ? '#d9622b' : P.ink, { align: 'left', seed: 'w' + i }); x += ww; });
  }
  function egg(ctx, x, y, s, t, clear, inner) { F.egg(ctx, x, y, s, t, { clear: clear, inner: inner }); }
  // the mind egg sits on the table, watching its own lanterns
  function sitEgg(ctx, t, beep) { var s = Math.min(26, L.W * .065), x = L.W < 500 ? s * 1.6 : L.W * .12, y = L.base + (L.H - L.base) * .5; egg(ctx, x, y, s, t + (beep ? Math.sin(t * 30) * .05 : 0), 0); if (beep) F.hand(ctx, 'beep!', x + s * 1.3, y - s * 1.2, 13, P.butter, { seed: 'beep', outline: 3, outlineColor: 'rgba(20,20,50,.8)' }); }
  function tap(ctx, x, y, s, open, label, hl) {
    ctx.save(); ctx.fillStyle = '#c99a3c'; ctx.strokeStyle = '#6d4f1c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, s * .45, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.translate(x, y); ctx.rotate(open ? 0 : Math.PI / 2); ctx.fillStyle = hl ? P.red : '#e2b85a'; ctx.fillRect(-s * .7, -s * .12, s * 1.4, s * .24); ctx.strokeRect(-s * .7, -s * .12, s * 1.4, s * .24);
    ctx.restore();
    if (label) F.hand(ctx, label, x, y + s * .95, 11, hl ? P.red : P.chalk, { seed: 'tp' + label, bold: true, outline: 3, outlineColor: 'rgba(20,20,50,.8)' });
  }
  // the plumbing: residual pipe with four head taps feeding in
  function plumbing(ctx, t, off, a, o) {
    o = o || {}; var W = L.W, y = L.top * .95, x0 = W * .06, x1 = W * .94, s = Math.min(26, W * .06);
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = '#8f7a5a'; ctx.lineWidth = s * .7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.strokeStyle = '#b89c70'; ctx.lineWidth = s * .35; ctx.beginPath(); ctx.moveTo(x0, y - s * .1); ctx.lineTo(x1, y - s * .1); ctx.stroke();
    // flowing droplets = the residual stream
    for (var k = 0; k < 10; k++) { var fx = x0 + ((t * 60 + k * (x1 - x0) / 10) % (x1 - x0)); ctx.fillStyle = 'rgba(169,201,239,.9)'; ctx.beginPath(); ctx.arc(fx, y, 3, 0, 6.283); ctx.fill(); }
    o.hx = []; for (var j = 0; j < 4; j++) {
      var hx = lerp(x0, x1, (j + 1) / 5), hy = y - s * 2.1; o.hx.push([hx, hy]);
      ctx.strokeStyle = '#8f7a5a'; ctx.lineWidth = s * .35; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, y); ctx.stroke();
      tap(ctx, hx, hy, s, !(off && off[j]), HEADS[j].name, off && off[j]);
    }
    F.hand(ctx, 'residual stream →', x0 + 6, y + s * .9, 11, P.sky, { align: 'left', seed: 'rs', bold: false });
    ctx.restore(); return o.hx;
  }

  var chapters = [
    { name: 'the fortune-teller', start: 0, dur: 5, cap: {
        1: 'The mind egg has read "The cat sat on the…" and must now <b>pick one word</b>. Each candidate word is a lantern on a pole: the taller the pole, the more the egg likes it.',
        2: 'Pole height = the word\'s <b>logit</b>, the raw score the model outputs. Scores are not yet probabilities; the next steps turn them into a choice.',
        3: 'logits: Float[Tensor, "d_vocab"], one per vocabulary item (50,257 in GPT-2; 8 here). Toy values, real maths from here on.' },
      draw: function (ctx, t, l, W, H) {
        lay(W, H); bg(ctx, W, H, t);
        fortune(ctx, W / 2, L.top * .55, Math.min(W, H) * .14, (Math.sin(t * 5) + 1) / 2, 'which word, and why?', ramp(l, .4, 2));
        var g = ramp(l, 1.2, 3); lanterns(ctx, LOG.map(function (v) { return lerp(-1.5, v, g); }), null, t, { showLogit: g > .95 }); sitEgg(ctx, t);
        sentence(ctx, ['The', 'cat', 'sat', 'on', 'the', '___'], H - 22, false);
      } },
    { name: 'temperature', start: 5, dur: 6, cap: {
        1: 'A <b>temperature</b> dial. Turn it down and the favourite lantern blazes while the rest go dark. Turn it up and every lantern glows about the same.',
        2: 'Divide every logit by T, then softmax. Low T: nearly always the top word (safe, repetitive). High T: flatter, more surprising, more nonsense.',
        3: 'p = softmax(logits / T). As T→0 this becomes argmax (greedy); T→∞ gives uniform. Entropy shown live, in bits (max 3 for 8 words).' },
      draw: function (ctx, t, l, W, H) {
        lay(W, H); bg(ctx, W, H, t);
        var T = l < 2.5 ? lerp(1, .3, ramp(l, .3, 2.2)) : l < 4.8 ? lerp(.3, 2.5, ramp(l, 2.5, 4.5)) : lerp(2.5, 1, ramp(l, 4.8, 5.8));
        var d = dist(LOG, T, 0, 0); lanterns(ctx, LOG, d, t); sitEgg(ctx, t);
        // the dial
        var cx = W / 2, cy = L.top * .6, r = Math.min(W, H) * .1; F.blob(ctx, cx, cy, r, P.cream, { seed: 'dial' }); var ang = -2.4 + (Math.log(T) - Math.log(.2)) / (Math.log(3) - Math.log(.2)) * 4.8;
        ctx.save(); ctx.strokeStyle = P.red; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(ang) * r * .8, cy - Math.cos(ang) * r * .8); ctx.stroke(); ctx.restore();
        F.hand(ctx, 'cool', cx - r * 1.35, cy + r * .6, 13, P.sky, { seed: 'cool' }); F.hand(ctx, 'hot', cx + r * 1.3, cy + r * .6, 13, P.orange, { seed: 'hot' });
        readout(ctx, -1, cy + r + 12, [['T = ' + T.toFixed(2) + '   p(mat) = ' + d.p[0].toFixed(2), P.butter], ['entropy = ' + entropy(d.p).toFixed(2) + ' bits', P.chalk]], W);
      } },
    { name: 'top-k', start: 11, dur: 4, cap: {
        1: 'Rule one for avoiding nonsense: only keep the <b>top few</b> lanterns. Here, the best 3. The rest are snipped off and their share goes to the survivors.',
        2: '<b>Top-k</b>: keep the k highest-probability words, set the rest to zero, renormalise. Simple, but k doesn\'t care whether the model is sure or unsure.',
        3: 'sample_top_k(logits, k): topk → sample among those k. With k=3 at T=1: p(mat) rises from ' + dist(LOG, 1, 0, 0).p[0].toFixed(2) + ' to ' + dist(LOG, 1, 3, 0).p[0].toFixed(2) + '.' },
      draw: function (ctx, t, l, W, H) {
        lay(W, H); bg(ctx, W, H, t);
        var d = ramp(l, .8, 1.6) > .5 ? dist(LOG, 1, 3, 0) : dist(LOG, 1, 0, 0); lanterns(ctx, LOG, d, t); sitEgg(ctx, t);
        var sx = lerp(lx(2.5) - 10, lx(2.5), ramp(l, 0, .8)); ctx.save(); ctx.strokeStyle = P.red; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx, L.base - L.hmax - 20); ctx.lineTo(sx, L.base + 36); ctx.stroke(); ctx.restore();
        lbl(ctx, 'k = 3 ✂', sx, L.base - L.hmax - 34, P.red, 16);
        readout(ctx, -1, L.top * .3, [['top-k, k = 3', P.butter], ['kept: ' + VOC.filter(function (w, i) { return d.keep[i]; }).join(', '), P.chalk]], W);
      } },
    { name: 'top-p', start: 15, dur: 4, cap: {
        1: 'Rule two is smarter: keep lanterns until together they hold <b>90%</b> of the light. When the egg is sure, that\'s very few words; when it\'s unsure, many.',
        2: '<b>Top-p</b> (nucleus): sort by probability, keep the smallest set whose total reaches p = 0.9, renormalise. The ribbon below adds up the shares.',
        3: 'sample_top_p: sort, cumsum, keep up to and including the token that crosses p. Cumulative here: ' + (function () { var d = dist(LOG, 1, 0, 0), c = 0; return d.idx.slice(0, 5).map(function (i) { c += d.raw[i]; return c.toFixed(2); }).join(', '); })() + ' → 5 kept.' },
      draw: function (ctx, t, l, W, H) {
        lay(W, H); bg(ctx, W, H, t);
        var d0 = dist(LOG, 1, 0, 0), d = ramp(l, 2, 2.6) > .5 ? dist(LOG, 1, 0, .9) : d0; lanterns(ctx, LOG, d, t); sitEgg(ctx, t);
        // the cumulative ribbon
        var rw = Math.min(W - 40, 600), rx = W / 2 - rw / 2, ry = L.top * .45, rh = 22, c = 0, grow = ramp(l, .2, 2);
        F.paper(ctx, W / 2, ry + rh / 2, rw + 16, rh + 30, P.cream, { seed: 'rib' });
        var cols = [P.orange, P.pink, P.mint, P.sky, P.lav, P.butter, P.peach, P.green];
        d0.idx.forEach(function (i, r) { var w = d0.raw[i] * rw * grow; ctx.fillStyle = cols[r]; ctx.globalAlpha = d.keep[i] ? 1 : .3; ctx.fillRect(rx + c, ry, w, rh); ctx.globalAlpha = 1; if (w > 26) F.hand(ctx, VOC[i], rx + c + w / 2, ry + rh / 2, 11, P.ink, { seed: 'rb' + i }); c += w; });
        var px90 = rx + rw * .9; ctx.strokeStyle = P.red; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(px90, ry - 8); ctx.lineTo(px90, ry + rh + 8); ctx.stroke();
        F.hand(ctx, 'p = 0.9', px90, ry + rh + 16, 12, P.red, { seed: 'p90' });
        readout(ctx, -1, ry + rh + 34, [['top-p = 0.9 → keep ' + d.keep.filter(Boolean).length + ' of 8', P.butter]], W);
      } },
    { name: 'pick one', start: 19, dur: 4, cap: {
        1: 'Now a paper plane is thrown at the lanterns, and wherever it lands is the word. This time it lands on <b>"sofa"</b>, not the favourite. That\'s what sampling means.',
        2: 'Draw a random number u in [0,1) and walk along the ribbon until the running total passes u. Here u = ' + U_FILM + ', which lands on "sofa". Beep!',
        3: 'Inverse-CDF sampling from the top-p distribution (torch.distributions.Categorical / multinomial). Greedy would always say "mat"; sampling keeps text varied.' },
      draw: function (ctx, t, l, W, H, api) {
        lay(W, H); bg(ctx, W, H, t);
        var d = dist(LOG, 1, 0, .9), pick = draw(d, U_FILM), landed = l > 2; lanterns(ctx, LOG, d, t, { pick: landed ? pick : -1 }); sitEgg(ctx, t, landed && l < 3);
        var tx = lx(pick), ty = L.base - (LOG[pick] + 1.5) / 6 * L.hmax - 10, fp = ramp(l, .3, 2);
        if (!landed) F.plane(ctx, lerp(-20, tx, fp), lerp(L.top * .4, ty, fp) - Math.sin(fp * Math.PI) * 60, 16, .5, P.cream);
        else { F.glow(ctx, tx, ty, 50, 'rgba(255,214,120,.8)', .6 + .4 * Math.sin(t * 8)); if (!this.beeped) { this.beeped = 1; api.audio.blip(1320); } }
        if (l < .2) this.beeped = 0;
        var cum = 0, i0; for (i0 = 0; i0 < 8; i0++) { if (U_FILM < cum + d.p[i0]) break; cum += d.p[i0]; }
        readout(ctx, -1, L.top * .3, [['u = ' + U_FILM.toFixed(2), P.butter], ['cumulative: ' + cum.toFixed(2) + ' < u < ' + (cum + d.p[pick]).toFixed(2), P.chalk], ['→ "' + VOC[pick] + '"', P.mint]], W);
        sentence(ctx, ['The', 'cat', 'sat', 'on', 'the', landed ? VOC[pick] : '___'], H - 22, landed);
      } },
    { name: 'KV cache', start: 23, dur: 7, cap: {
        1: 'To pick the <b>next</b> word the egg would have to re-read the whole sentence. Instead it keeps a recipe box of index cards, one per word it has already read, and only writes one new card each time.',
        2: 'The <b>KV cache</b> stores every past token\'s keys and values. A new token computes only its own q, k, v and reads the old cards: one step per word, not a full re-read.',
        3: 'Without a cache, generating n tokens recomputes K,V for 1+2+…+n positions (O(n²)); with it, n. Attention still reads all cached rows, so memory grows with context.' },
      draw: function (ctx, t, l, W, H) {
        lay(W, H); bg(ctx, W, H, t);
        var words = ['The', 'cat', 'sat', 'on', 'the', 'sofa', 'and', 'purred'], n = 5 + Math.min(3, Math.floor(ramp(l, .5, 5.5) * 3.999));
        sentence(ctx, words.slice(0, n), H * .08, true);
        // recipe box of K/V cards
        var bw = Math.min(W * .86, 520), bx = W / 2 - bw / 2, by = H * .2, cardW = bw / 8 - 6, cardH = Math.min(H * .2, 110);
        F.paper(ctx, W / 2, by + cardH * .75, bw + 20, cardH * 1.3, '#8a5a3c', { seed: 'box' });
        for (var i = 0; i < n; i++) {
          var fresh = i === n - 1, dy = fresh ? (1 - ramp(l - (n - 5) * 1.6, .5, 1.3)) * -40 : 0, cx = bx + i * (cardW + 6) + cardW / 2 + 3;
          F.paper(ctx, cx, by + cardH * .55 + dy, cardW, cardH, fresh ? '#fff4c9' : P.cream, { seed: 'card' + i, rot: (i % 3 - 1) * .03 });
          F.hand(ctx, words[i], cx, by + cardH * .2 + dy, W < 500 ? 10 : 13, P.ink, { seed: 'cw' + i });
          F.hand(ctx, 'k', cx, by + cardH * .5 + dy, 12, '#3f78c0', { seed: 'k' + i }); F.hand(ctx, 'v', cx, by + cardH * .75 + dy, 12, '#3f9a6c', { seed: 'vv' + i });
        }
        var gen = n - 5, noCache = 0, cache = 0; for (var g = 1; g <= gen; g++) { noCache += 5 + g; cache += 1; }
        readout(ctx, -1, by + cardH * 1.55, [['new words so far: ' + gen, P.butter], ['K,V rows computed', P.chalk], ['  re-read everything: ' + noCache, P.pink], ['  with the card box:  ' + cache, P.mint]], W);
        egg(ctx, W / 2, L.base - 10, Math.min(W, H) * .08, t, 0);
      } },
    { name: 'open the hood', start: 30, dur: 7, cap: {
        1: 'Now the fun part: a plumber opens the egg. Inside is a long pipe (the notebook from last week) with <b>brass taps</b> where each part pours in. One camera flash photographs everything flowing through.',
        2: '<b>TransformerLens</b> gives every internal activation a name and a hook point. <b>run_with_cache</b> runs the model once and keeps a photo of every activation.',
        3: 'logits, cache = model.run_with_cache(tokens); cache["blocks.0.attn.hook_pattern"] etc. utils.get_act_name("pattern", 0) builds the same name.' },
      draw: function (ctx, t, l, W, H) {
        lay(W, H); bg(ctx, W, H, t);
        var op = ramp(l, 0, 1.5); ctx.save(); ctx.globalAlpha = 1 - op; egg(ctx, W / 2, L.top, Math.min(W, H) * .12, t, op); ctx.restore();
        plumbing(ctx, t, null, op);
        // the plumber with a disposable camera
        var ps = Math.min(44, W * .1), cxp = W * (L.por ? .22 : .3), cyp = L.base + 10; F.person(ctx, cxp, cyp, ps, t, { coat: P.sky, scarf: P.red, lantern: false, walk: l < 2 });

    { name: 'close a tap', start: 37, dur: 8, cap: {

        readout(ctx, -1, L.top * 1.4, [['head L1H3 (' + HEADS[3].what + '): ' + (k > .5 ? 'ZEROED' : 'on'), k > .5 ? P.red : P.butter], ['p(mat) ' + d.p[0].toFixed(2) + '   p(sofa) ' + d.p[1].toFixed(2) + '   p(hat) ' + d.p[5].toFixed(2), P.chalk]], W);

  /* ---------------- coda: now you drive ---------------- */
  var C = { T: 1, mode: 'p', k: 3, p: .9, off: [0, 0, 0, 0], words: ['The', 'cat', 'sat', 'on', 'the'], pick: -1, hx: [] };
