<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Every shape has a story</title>
<meta name="theme-color" content="#1c2140">
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp, ease = F.ease;

  /* ================= the real tensor: x = arange(24).reshape(2, 3, 4) ================= */
  var SZ = { b: 2, h: 3, w: 4 }, LHS = ['b', 'h', 'w'], N = 24;
  var SRC = []; for (var f0 = 0; f0 < N; f0++) SRC.push({ b: Math.floor(f0 / 12), h: Math.floor(f0 / 4) % 3, w: f0 % 4, v: f0 });
  var ROWCOL = [[P.pink, P.peach, P.butter], [P.mint, P.sky, P.lav]]; // batch picks the family, h picks the shade
  function colOf(s) { return ROWCOL[s.b][s.h]; }

  /* ---- a tiny honest einops: rearrange / reduce over named axes (row-major) ---- */
  function parseSide(s) { var out = [], m, re = /\(([^)]*)\)|(\S+)/g; while ((m = re.exec(s))) out.push(m[1] != null ? m[1].trim().split(/\s+/) : [m[2]]); return out; }
  function einops(pattern, red) {
    var rhs = parseSide(pattern.split('->')[1]), shape = rhs.map(function (g) { return g.reduce(function (p, a) { return p * SZ[a]; }, 1); });
    var idx = SRC.map(function (s) { return rhs.map(function (g) { return g.reduce(function (p, a) { return p * SZ[a] + s[a]; }, 0); }); });
    var R = { pattern: pattern, shape: shape, idx: idx, red: red };
    if (red) { // reduce: sources that land on the same output index are combined
      var sums = {}, cnt = {}; idx.forEach(function (ix, i) { var k = ix.join(','); sums[k] = (sums[k] || 0) + SRC[i].v; cnt[k] = (cnt[k] || 0) + 1; });
      R.out = {}; for (var k in sums) R.out[k] = red === 'mean' ? sums[k] / cnt[k] : sums[k];
    }
    return R;
  }
  function shapeStr(s) { return '(' + s.join(', ') + (s.length === 1 ? ',' : '') + ')'; }

  /* ---- lay an output shape (rank 1-3) into a screen region; return per-source tile spots ---- */
  function layout(R, reg, maxS) {
    var sh = R.shape, rank = sh.length, a = rank === 3 ? sh[0] : 1, r = rank === 1 ? 1 : sh[rank - 2], c = sh[rank - 1];
    var best = null;
    for (var tc = 1; tc <= a; tc++) {
      var tr = Math.ceil(a / tc), s = Math.min(reg.w / (tc * c + (tc - 1) * .7), reg.h / (tr * r + (tr - 1) * .9 + (rank === 3 ? tr * .45 : 0)), maxS || 56);
      if (!best || s > best.s + .01) best = { s: s, tc: tc, tr: tr };
    }
    var s = best.s, tw = c * s, th = r * s, gw = best.tc * tw + (best.tc - 1) * s * .7, gh = best.tr * th + (best.tr - 1) * s * .9 + (rank === 3 ? best.tr * s * .45 : 0);
    var ox = reg.x + (reg.w - gw) / 2, oy = reg.y + (reg.h - gh) / 2, trays = [];
    for (var ti = 0; ti < a; ti++) {
      var cx = ti % best.tc, cy = Math.floor(ti / best.tc), tx = ox + cx * (tw + s * .7), ty = oy + (rank === 3 ? s * .45 : 0) + cy * (th + s * .9 + (rank === 3 ? s * .45 : 0));
      trays.push({ x: tx, y: ty, w: tw, h: th, i: ti });
    }
    var spots = R.idx.map(function (ix, i) {
      var t = rank === 3 ? trays[ix[0]] : trays[0], row = rank === 1 ? 0 : ix[rank - 2], col = ix[rank - 1];
      var j = R.red ? (i % 12) : 0; // reduced tiles pile up on their slot
      return { x: t.x + (col + .5) * s + (R.red ? Math.sin(j * 2.1) * s * .12 : 0), y: t.y + (row + .5) * s - j * s * .03, s: s };
    });
    return { spots: spots, trays: trays, s: s, rank: rank, R: R, box: { x: ox, y: oy, w: gw, h: gh } };
  }

  /* ================= paper helpers local to this film ================= */
  function tile(ctx, x, y, s, val, col, o) {
    o = o || {}; var a = o.alpha == null ? 1 : o.alpha; if (a <= 0.01) return;
    ctx.save(); ctx.globalAlpha = a;
    if (o.hl) F.glow(ctx, x, y, s * 1.1, 'rgba(255,226,140,.9)', o.hl);
    F.paper(ctx, x, y, s * .86, s * .86, col, { seed: 't' + (o.seed || 0) % 5, rot: o.rot || 0, blur: 4, lift: 2, jit: .45 });
    var txt = typeof val === 'number' ? (Math.round(val) === val ? String(val) : val.toFixed(1)) : val;
    var fs = Math.max(9, s * (txt.length > 2 ? .34 : .42));
    F.hand(ctx, txt, x, y + 1, fs, P.ink, { font: F.MONO, seed: 'n' + txt, wobble: .4, rot: o.rot || 0 });
    ctx.restore();
  }
  function tapeLabel(ctx, text, x, y, sz, o) {
    o = o || {}; var w = F.textW(ctx, text, sz, F.MONO) + sz * 1.2;
    F.paper(ctx, x, y, w, sz * 1.7, o.color || 'rgba(247,227,160,.93)', { rot: o.rot || -.02, seed: 'tl' + text.length, shadow: true, blur: 3, lift: 1, grainA: .35 });
    F.hand(ctx, text, x, y, sz, P.ink, { font: F.MONO, seed: text, wobble: .5, rot: o.rot || -.02 });
    return w;
  }
  function codeNote(ctx, text, x, y, W, maxSz, o) {
    var sz = maxSz; while (sz > 9 && F.textW(ctx, text, sz, F.MONO) + sz * 1.6 > W - 20) sz -= .5;
    return F.note(ctx, text, x, y, sz, Object.assign({ font: F.MONO, color: P.cream, seed: 'code' + text.length }, o || {}));
  }
  function lbl(ctx, text, x, y, sz, color, o) { o = o || {}; F.hand(ctx, text, x, y, sz, color || P.chalk, Object.assign({ outline: 4, outlineColor: 'rgba(20,20,50,.8)', seed: text }, o)); }
  function readout(ctx, x, y, lines, W, o) {
    o = o || {}; var sz = W < 500 ? 12 : 14; ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l[0]).width); }); ctx.restore();
    if (o.center) x = (W - w - 22) / 2;
    F.paper(ctx, x + w / 2 + 10, y + lines.length * sz * .65 + 4, w + 22, lines.length * sz * 1.3 + 12, 'rgba(22,26,53,.9)', { seed: 'ro' + lines.length, shadow: false });
    ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; ctx.textBaseline = 'top';
    lines.forEach(function (l, i) { ctx.fillStyle = l[1] || P.chalk; ctx.fillText(l[0], x + 10, y + 8 + i * sz * 1.3); }); ctx.restore();
    return lines.length * sz * 1.3 + 12;
  }

  /* ---- the library at night (cached per size) ---- */
  var BG = { W: 0, H: 0, c: null };
  function bg(ctx, W, H, t) {
    if (BG.W !== W || BG.H !== H) {
      var d = Math.min(2.5, window.devicePixelRatio || 1), c = document.createElement('canvas'); c.width = Math.round(W * d); c.height = Math.round(H * d);
      var g = c.getContext('2d'); g.scale(d, d); F.sky(g, W, H, P.night, '#2b2f5c');
      var r = F.rng('shelves'), cols = ['#454a86', '#3b3f75', '#5b5486', '#4a4f8c', '#6b5a9a', '#3d5a78'], shelfH = Math.max(46, H / 7);
      for (var y = H * .18; y < H + shelfH; y += shelfH) {
        g.globalAlpha = .55; var x = -4;
        while (x < W + 10) { var bw = 8 + r() * 14, bh = shelfH * (.55 + r() * .35); F.paper(g, x + bw / 2, y - bh / 2, bw, bh, cols[Math.floor(r() * cols.length)], { seed: 'bk' + Math.floor(r() * 9), shadow: false, grainA: .4, jit: .3 }); x += bw + 1 + (r() < .1 ? 18 : 0); }
        g.globalAlpha = .8; F.paper(g, W / 2, y + 3, W + 20, 7, '#2a2d58', { seed: 'shelf', shadow: false, jit: .3 });
      }
      g.globalAlpha = 1; var vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .2, W / 2, H / 2, Math.max(W, H) * .7);
      vg.addColorStop(0, 'rgba(28,33,64,.55)'); vg.addColorStop(1, 'rgba(12,14,34,.8)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
      BG.W = W; BG.H = H; BG.c = c;
    }
    ctx.drawImage(BG.c, 0, 0, W, H); F.stars(ctx, W, H * .16, t, 'w1', 14);
  }
  var POR = function (W, H) { return H > W * 1.1; };
  function region(W, H, top, bot) { return { x: 14, y: top, w: W - 28, h: Math.max(60, H - top - bot) }; }

  /* ---- librarian with a trolley ---- */
  function trolley(ctx, x, y, s, t, moving) {
    var w = s * 2.4, h = s * .5; ctx.save(); ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1.5, s * .06); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - w / 2, y - h * 1.5); ctx.lineTo(x - w / 2 - s * .25, y - h * 2.8); ctx.stroke();
    F.paper(ctx, x, y - h, w, h, '#b07a55', { seed: 'trol', blur: 5, lift: 3 });
    [-.35, .35].forEach(function (k) { var wx = x + k * w, wy = y - h * .15; ctx.save(); ctx.translate(wx, wy); ctx.rotate(moving ? t * 6 : 0); ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(0, 0, s * .15, 0, 6.283); ctx.fill(); ctx.fillStyle = P.cream; ctx.fillRect(-1, -s * .13, 2, s * .1); ctx.restore(); });
    ctx.restore(); return { x: x, y: y - h * 1.5, w: w };
  }
  function librarian(ctx, x, y, s, t, walk) { F.person(ctx, x, y, s, t, { walk: walk, coat: '#6b8fbf', scarf: P.butter, lantern: false, face: 1 }); }
  function heap(tx, ty, w, s) { // mound of tiles on the trolley
    var r = F.rng('heap'), out = [];
    for (var i = 0; i < N; i++) { var k = r(), layer = Math.floor(i / 8), span = w * (.9 - layer * .25); out.push({ x: tx + (r() - .5) * span, y: ty - s * .35 - layer * s * .5 - r() * s * .2, s: s, rot: (r() - .5) * 1.2 }); }
    return out;
  }
  function question(ctx, W, H, a, rev) {
    if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
    F.note(ctx, 'what does each axis MEAN?', W / 2, POR(W, H) ? 34 : 44, W < 500 ? 17 : 22, { rot: -.025, seed: 'q', reveal: rev == null ? 1 : rev });
    ctx.restore();
  }

  /* ---- move tiles between two sets of spots (staggered, arcing flight) ---- */
  function fly(A, B, p, stagger) {
    stagger = stagger == null ? .018 : stagger; var span = 1 - stagger * (N - 1);
    return A.map(function (a, i) {
      var b = B[i], q = ease.inOut(clamp((p - i * stagger) / span, 0, 1)), arc = Math.sin(q * Math.PI) * Math.min(60, Math.abs(b.x - a.x) * .15 + 18);
      return { x: lerp(a.x, b.x, q), y: lerp(a.y, b.y, q) - arc, s: lerp(a.s, b.s, q), rot: lerp(a.rot || 0, 0, q) + Math.sin(q * Math.PI) * .5 * (i % 2 ? 1 : -1), q: q };
    });
  }
  function drawTrays(ctx, L, a, labels) {
    if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
    L.trays.forEach(function (t, k) {
      F.paper(ctx, t.x + t.w / 2, t.y + t.h / 2, t.w + L.s * .3, t.h + L.s * .3, 'rgba(22,26,53,.55)', { seed: 'tray' + k, shadow: false, jit: .5 });
      if (labels && L.rank === 3) lbl(ctx, labels[0] + '=' + k, t.x + 2, t.y - L.s * .32, Math.max(11, L.s * .3), P.butter, { align: 'left' });
    });
    ctx.restore();
  }
  function drawTiles(ctx, pts, o) {
    o = o || {}; var order = pts.map(function (p, i) { return i; });
    if (o.hl != null) order.push(order.splice(o.hl, 1)[0]);
    order.forEach(function (i) { var p = pts[i], s = SRC[i]; tile(ctx, p.x, p.y, p.s, o.vals ? o.vals[i] : s.v, colOf(s), { seed: i, rot: p.rot, alpha: o.alpha ? o.alpha(i) : 1, hl: i === o.hl ? o.hlA || 1 : 0 }); });
  }

  /* ---- cached layouts per canvas size ---- */
  var LC = {}; function L(key, pattern, reg, maxS, red) { if (key === 'flat') reg = { x: reg.x + 22, y: reg.y, w: reg.w - 26, h: reg.h }; var k = key + '|' + reg.x + '|' + reg.y + '|' + reg.w + '|' + reg.h; return LC[k] || (LC[k] = layout(einops(pattern, red), reg, maxS)); }
  function tileReg(W, H) { var por = POR(W, H); return region(W, H, por ? 112 : 96, por ? 96 : 84); }

  var R_STACK = 'b h w -> b h w', R_FLAT = 'b h w -> b (h w)', R_VHS = 'b h w -> h (b w)';
  var HLI = 21; // x[1, 2, 1] = 21, our tracked tile

  /* ================= ray tracing: the real 2D solve from ARENA [0.1] ================= */
  var SEG = [[2.4, 1.25], [1.7, -0.55]];
  function intersect(O, D, L1, L2) { // O + uD = L1 + v(L2 - L1)  ->  [D, L1-L2] [u v]^T = L1 - O
    var ax = D[0], bx = L1[0] - L2[0], ay = D[1], by = L1[1] - L2[1], det = ax * by - ay * bx;
    if (Math.abs(det) < 1e-9) return { u: -1, v: -1, hit: false, par: true };
    var rx = L1[0] - O[0], ry = L1[1] - O[1], u = (rx * by - ry * bx) / det, v = (ax * ry - ay * rx) / det;
    return { u: u, v: v, hit: u >= 0 && v >= 0 && v <= 1 };
  }
  function makeRays(n, ylim) { var out = []; for (var i = 0; i < n; i++) out.push([1, -ylim + 2 * ylim * i / (n - 1)]); return out; }
  var RAYS = makeRays(9, .9);
  function rayView(reg) { var s = Math.min(reg.w / 3.5, reg.h / 2.9); return { s: s, ox: reg.x + (reg.w - 3.2 * s) / 2 + .25 * s, oy: reg.y + reg.h / 2 }; }
  function RS(V, p) { return [V.ox + p[0] * V.s, V.oy - p[1] * V.s]; }
  function torch(ctx, x, y, s, ang) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang || 0);
    F.paper(ctx, -s * .7, 0, s * 1.3, s * .5, '#c05a5a', { seed: 'torch', blur: 4, lift: 2 });
    F.paper(ctx, 0, 0, s * .35, s * .8, '#d9d3c0', { seed: 'torchhead', blur: 3, lift: 2 }); ctx.restore();
    F.glow(ctx, x, y, s * 1.2, 'rgba(255,236,160,.7)', .9);
  }
  function drawRays(ctx, V, O, p, t, opts) {
    opts = opts || {}; var L1 = SEG[0], L2 = SEG[1], res = [];
    var a = RS(V, L1), b = RS(V, L2);
    ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = '#b07a55'; ctx.lineWidth = Math.max(6, V.s * .08); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    lbl(ctx, 'wall', a[0] + 18, a[1] - 4, 13, P.peach);
    RAYS.forEach(function (D, i) {
      var h = intersect(O, D, L1, L2); res.push(h);
      var reach = p * 4, L = h.hit ? Math.min(reach, h.u) : reach, o = RS(V, O), e = RS(V, [O[0] + D[0] * L, O[1] + D[1] * L]);
      ctx.save(); ctx.strokeStyle = h.hit && reach >= h.u ? 'rgba(255,226,140,.95)' : 'rgba(253,250,240,.35)'; ctx.lineWidth = h.hit ? 2.2 : 1.4; if (!h.hit) ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.moveTo(o[0], o[1]); ctx.lineTo(e[0], e[1]); ctx.stroke(); ctx.restore();
      if (h.hit && reach >= h.u) { var hp = RS(V, [O[0] + D[0] * h.u, O[1] + D[1] * h.u]); F.lantern(ctx, hp[0] + 9, hp[1], Math.max(6, V.s * .07), clamp((reach - h.u) * 3, 0, 1), t + i); }
    });
    var o = RS(V, O); torch(ctx, o[0], o[1], Math.max(16, V.s * .2), 0);
    return res;
  }

  /* ================= the chapters ================= */
  var chapters = [
    { name: 'the wish', start: 0, dur: 6, cap: {
        1: 'Night shift at the library of numbers. Our shelf-stacker has a trolley heaped with paper tiles and one wish: move them around <b>without losing track of which is which</b>.',
        2: 'Every tile is one number. A heap of numbers is useless until you know how it is organised, and that organisation is exactly what a <b>tensor shape</b> records.',
        3: 'Week 1, ARENA [0.0] Prerequisites + [0.1] Ray Tracing. The whole week is one discipline: know every axis of every tensor, and name it.' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var s = Math.min(W, H) * (POR(W, H) ? .1 : .085), tx = lerp(-s * 3, W * .5, ease.out(l / 3.2)), ty = H * .74;
        librarian(ctx, tx - s * 2.1, ty, s * 1.6, t, l < 3.2);
        var tb = trolley(ctx, tx, ty, s, t, l < 3.2), hp = heap(tb.x, tb.y, tb.w, s * .62); drawTiles(ctx, hp);
        F.plane(ctx, lerp(W + 30, -30, l / 6), H * .3 + Math.sin(l * 2) * 10, 12, Math.PI + .1, P.cream);
        question(ctx, W, H, ramp(l, .8, 1.6), ramp(l, .8, 2.6));
        if (l > 3.5) { ctx.save(); ctx.globalAlpha = ramp(l, 3.5, 4.3); lbl(ctx, '24 tiles. no labels. uh-oh.', W / 2, H * .44, W < 500 ? 15 : 19, P.butter); ctx.restore(); }
      } },
    { name: 'a stack with a shape', start: 6, dur: 7, cap: {
        1: 'She sorts them into <b>2 trays</b>, each <b>3 rows</b> of <b>4</b>. Now every tile has an address. Tile 21 lives in tray 1, row 2, column 1.',
        2: 'That arrangement is the tensor\'s <b>shape</b>: <code>(2, 3, 4)</code>. Naming the axes (batch, height, width) is what turns 24 numbers into two little 3×4 images.',
        3: '<code>x = torch.arange(24).reshape(2, 3, 4)</code>. Index <code>x[1, 2, 1]</code> = 1·12 + 2·4 + 1 = 21. Axes are counted from 0, last axis fastest (row-major).' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var s = Math.min(W, H) * (POR(W, H) ? .1 : .085), ty = H * .74, tx = W * .5;
        var reg = tileReg(W, H), LS = L('stack', R_STACK, reg, 58), hp = heap(tx, ty - s * .75, s * 2.4, s * .62);
        var p = ramp(l, .3, 3.2);
        if (l < 2.55) { ctx.save(); ctx.globalAlpha = 1 - ramp(l, 1.5, 2.6); librarian(ctx, tx - s * 2.1, ty, s * 1.6, t, false); trolley(ctx, tx, ty, s, t, false); ctx.restore(); }
        drawTrays(ctx, LS, ramp(l, 1.8, 2.8), ['b']);
        var pts = fly(hp, LS.spots, p); drawTiles(ctx, pts, { hl: l > 4.2 ? HLI : null, hlA: ramp(l, 4.2, 4.8) });
        if (l > 2.8) {
          ctx.save(); ctx.globalAlpha = ramp(l, 2.8, 3.6); var t0 = LS.trays[0], sz = W < 500 ? 12 : 15;
          F.arrow(ctx, t0.x, t0.y - LS.s * .75, t0.x + t0.w, t0.y - LS.s * .75, P.mint, 2, 'wx');
          lbl(ctx, 'w = 4', t0.x + t0.w / 2 + 20, t0.y - LS.s * .75 - 12, sz, P.mint);
          F.arrow(ctx, t0.x - LS.s * .3, t0.y, t0.x - LS.s * .3, t0.y + t0.h, P.pink, 2, 'hx');
          lbl(ctx, 'h', t0.x - LS.s * .3 - 10, t0.y + t0.h / 2, sz, P.pink);
          tapeLabel(ctx, '(batch=2, h=3, w=4)', W / 2, LS.box.y + LS.box.h + 26, W < 500 ? 14 : 17, { rot: -.03 });
          ctx.restore();
        }
        question(ctx, W, H, 1 - ramp(l, 3.6, 4.2));
        if (l > 4.2) { ctx.save(); ctx.globalAlpha = ramp(l, 4.2, 4.8); codeNote(ctx, 'x[1, 2, 1] = 21', W / 2, POR(W, H) ? 38 : 44, W, W < 500 ? 17 : 21, { color: P.butter }); ctx.restore(); }
      } },
    { name: 'rearrange', start: 13, dur: 8, cap: {
        1: 'Order: "flatten each tray into one long row". The tiles fly, but <b>watch the colours</b>: pink row, then peach, then yellow. Nothing gets shuffled.',
        2: '<code>rearrange(x, \'b h w -> b (h w)\')</code> merges h and w into one axis of 12. The pattern is a sentence about meaning, so you can read what it does.',
        3: 'Grouping (h w) is row-major: new index = h·4 + w. Tile x[1,2,1] lands at y[1, 9]. Shape (2,3,4) → (2,12). Same 24 numbers, no copy needed.' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var reg = tileReg(W, H), LS = L('stack', R_STACK, reg, 58), LF = L('flat', R_FLAT, reg, 44);
        var p = ramp(l, 1.2, 4.6), pts = fly(LS.spots, LF.spots, p, .02);
        drawTrays(ctx, LS, 1 - ramp(l, .9, 1.6), ['b']); drawTrays(ctx, LF, ramp(l, 4, 4.8));
        if (l > 4.6) { ctx.save(); ctx.globalAlpha = ramp(l, 4.6, 5.2); LF.trays.length && [0, 1].forEach(function (b) { lbl(ctx, 'b=' + b, LF.box.x - 2, LF.box.y + (b + .5) * LF.s, 11, P.butter, { align: 'right' }); }); ctx.restore(); }
