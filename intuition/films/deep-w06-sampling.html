<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Say a word, cheaply, then look inside</title>
<meta name="theme-color" content="#1c2140">
<style>
#predict{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(18,20,44,.72);z-index:5;padding:16px;box-sizing:border-box}
#predict.on{display:flex}
#predict .card{background:#fbf6ea;color:#2a2934;border-radius:6px;max-width:420px;width:100%;padding:16px 16px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);transform:rotate(-.6deg);font:15px/1.35 system-ui,-apple-system,'Segoe UI',sans-serif}
#predict h3{margin:0 0 4px;font:700 19px 'Comic Neue','Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive}
#predict p{margin:0 0 10px;font-size:14px;color:#4a4858}
#predict .opts{display:grid;gap:7px}
#predict .opts button{font:inherit;text-align:left;background:#f7e3a0;color:#2a2934;border:0;border-radius:8px;padding:9px 11px;min-height:40px;cursor:pointer}
#predict .opts button.skipq{background:#e6e1f2;text-align:center}
#predict .fb{margin-top:10px;font-weight:600;min-height:1.2em}
</style>
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;

  /* ================= the honest maths ================= */
  // prompt: "the mind egg wrote a ..."  -> 10 candidate next tokens with fixed logits
  var TOK = ['story', 'tale', 'poem', 'letter', 'song', 'novel', 'list', 'joke', 'fish', 'invoice'];
  var LOGITS = [3.1, 2.6, 2.2, 1.8, 1.5, 1.2, 0.8, 0.5, -0.2, -1.0];
  function softmax(r) { var m = -Infinity; r.forEach(function (v) { if (v > m) m = v; }); var e = r.map(function (v) { return v === -Infinity ? 0 : Math.exp(v - m); }), s = e.reduce(function (a, b) { return a + b; }, 0); return e.map(function (v) { return v / s; }); }
  function withT(lg, T) { return lg.map(function (v) { return v / Math.max(T, 1e-3); }); }        // apply_temperature
  // sample_top_p: sort descending, cumsum, keep the smallest prefix whose cumsum reaches top_p
  function nucleus(probs, p) {
    var idx = probs.map(function (_, i) { return i; }).sort(function (a, b) { return probs[b] - probs[a]; });
    var cum = [], s = 0; idx.forEach(function (i) { s += probs[i]; cum.push(s); });
    var n = 1; while (n < idx.length && cum[n - 1] < p) n++;
    var keep = idx.slice(0, n), ks = 0; keep.forEach(function (i) { ks += probs[i]; });
    var out = probs.map(function (v, i) { return keep.indexOf(i) >= 0 ? v / ks : 0; });
    return { idx: idx, cum: cum, n: n, out: out, kept: ks };
  }
  function topk(probs, k) { var idx = probs.map(function (_, i) { return i; }).sort(function (a, b) { return probs[b] - probs[a]; }).slice(0, k), s = 0; idx.forEach(function (i) { s += probs[i]; }); return probs.map(function (v, i) { return idx.indexOf(i) >= 0 ? v / s : 0; }); }

  // beam search tree: real probabilities, log-probs summed
  var TREE = { a: { p: .5, next: { fish: .4, story: .3, tale: .3 } }, the: { p: .4, next: { end: .9, egg: .1 } }, one: { p: .1, next: { day: 1 } } };
  var ln = Math.log;
  var GREEDY = { path: ['a', 'fish'], lp: ln(.5) + ln(.4) };           // -1.609
  var BEAMS = [];
  Object.keys(TREE).forEach(function (w) { Object.keys(TREE[w].next).forEach(function (w2) { BEAMS.push({ path: [w, w2], lp: ln(TREE[w].p) + ln(TREE[w].next[w2]) }); }); });
  BEAMS.sort(function (a, b) { return b.lp - a.lp; });                  // best: "the end" -1.022

  // KV cache FLOPs for GPT-2 small shapes (per generated token, whole model)
  var D = 768, NL = 12, DMLP = 3072;
  function perTokenDense() { return 2 * (4 * D * D + 2 * D * DMLP); }  // W_Q,W_K,W_V,W_O + MLP in/out, 2 FLOPs per MAC
  function flopsNoCache(n) { var a = 0; for (var i = 1; i <= n; i++) a += 4 * i * D; return NL * (n * perTokenDense() + a); }
  function flopsCache(n) { return NL * (perTokenDense() + 4 * n * D); }
  function cacheFloats(n) { return 2 * NL * n * D; }                    // keys + values, every layer
  // identical-logits check on a tiny real attention (d=3): recompute vs cached
  var WQ = [[.5, -.2, .1], [.3, .8, -.4], [-.6, .1, .9]], WK = [[.2, .7, -.3], [-.5, .4, .6], [.9, -.1, .2]], WV = [[.4, .1, .3], [-.2, .6, .5], [.7, -.3, .1]];
  var XS = [[1, 0, .2], [.3, .9, -.1], [-.4, .5, .8], [.6, -.7, .3], [.2, .2, .9]];
  function mv(x, M) { var o = []; for (var j = 0; j < M[0].length; j++) { var s = 0; for (var i = 0; i < x.length; i++) s += x[i] * M[i][j]; o.push(s); } return o; }
  function dot(a, b) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
  function attnLast(q, Ks, Vs) { var a = softmax(Ks.map(function (k) { return dot(q, k) / Math.sqrt(3); })), z = [0, 0, 0]; a.forEach(function (w, j) { for (var d = 0; d < 3; d++) z[d] += w * Vs[j][d]; }); return z; }
  var fullZ = (function () { var K = XS.map(function (x) { return mv(x, WK); }), V = XS.map(function (x) { return mv(x, WV); }); return attnLast(mv(XS[4], WQ), K, V); })();
  var cacheZ = (function () { var pk = [], pv = []; for (var i = 0; i < 4; i++) { pk.push(mv(XS[i], WK)); pv.push(mv(XS[i], WV)); } pk.push(mv(XS[4], WK)); pv.push(mv(XS[4], WV)); return attnLast(mv(XS[4], WQ), pk, pv); })();
  var maxDiff = Math.max.apply(null, fullZ.map(function (v, i) { return Math.abs(v - cacheZ[i]); }));

  // hooks: layer-0 heads each ADD a direct contribution to the final logits
  var HEADS = [
    { name: 'L0H0', c: [.1, .1, .3, .2, .4, 0, 0, .2, 0, 0] },
    { name: 'L0H1', c: [0, .2, 0, .5, 0, .1, .6, 0, 0, .3] },
    { name: 'L0H2', c: [1.3, .7, .2, 0, 0, .4, 0, 0, 0, 0] },            // the "story writer"
    { name: 'L0H3', c: [.2, 0, .1, 0, .3, 0, 0, .5, .4, 0] }
  ];
  var BASE = LOGITS.map(function (v, i) { return v - HEADS.reduce(function (s, h) { return s + h.c[i]; }, 0); }); // everything else
  function logitsAblate(off) { return BASE.map(function (v, i) { return v + HEADS.reduce(function (s, h, hi) { return s + (off[hi] ? 0 : h.c[i]); }, 0); }); }
  function lossOf(lg) { return -Math.log(softmax(lg)[0]); }            // target token: "story"
  var P0 = softmax(LOGITS), L0 = lossOf(LOGITS), LZ = lossOf(logitsAblate([0, 0, 1, 0])), PZ = softmax(logitsAblate([0, 0, 1, 0]));
  window.__dw6 = { P0: P0, nuc: nucleus(P0, .9), greedy: GREEDY, beams: BEAMS, noCache20: flopsNoCache(20), cache20: flopsCache(20), maxDiff: maxDiff, L0: L0, LZ: LZ };

  var f2 = function (v) { return Math.abs(v) < .005 ? '0.00' : v.toFixed(2); };
  function human(n) { return n >= 1e9 ? (n / 1e9).toFixed(1) + ' GFLOP' : (n / 1e6).toFixed(0) + ' MFLOP'; }

  /* ================= drawing helpers ================= */
  function lay(W, H) { var ph = W < 560; return { ph: ph, fs: ph ? 12 : 15, pad: ph ? 14 : 40 }; }
  function bg(ctx, W, H, t, warm) { F.sky(ctx, W, H, P.night, warm ? '#3b3466' : '#2b2f5c'); F.stars(ctx, W, H, t, 'dw6', 36); }
  function txt(ctx, s, x, y, sz, col, o) { o = o || {}; F.hand(ctx, s, x, y, sz, col || P.chalk, { align: o.align, font: o.mono ? F.MONO : undefined, bold: o.mono ? false : undefined, wobble: o.mono ? .2 : 1, seed: o.seed || s, reveal: o.reveal, outline: o.outline }); }
  function mono(ctx, s, x, y, sz, col, align, reveal) { txt(ctx, s, x, y, sz, col, { mono: true, align: align || 'left', reveal: reveal }); }
  function alpha(ctx, a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = Math.min(1, a); fn(); ctx.restore(); }
  // lantern bars: probs (array), optional kept mask, highlight index
  function lanterns(ctx, x, y, w, h, probs, o) {
    o = o || {}; var n = probs.length, bw = w / n, mx = o.max || Math.max.apply(null, probs), t = o.t || 0;
    probs.forEach(function (p, i) {
      var bx = x + i * bw, off = o.cut && o.cut[i], hh = h * p / mx;
      ctx.fillStyle = 'rgba(253,250,240,.08)'; ctx.fillRect(bx + 2, y, bw - 4, h);
      if (!off) { ctx.fillStyle = o.col && o.col(i) || P.butter; ctx.fillRect(bx + 3, y + h - hh, bw - 6, hh); F.lantern(ctx, bx + bw / 2, y + h - hh - 10, Math.min(7, bw * .22), clamp(p * 3, .15, 1), t); }
      else F.paper(ctx, bx + bw / 2, y + h - 6, bw - 4, 14, '#8c86a8', { seed: 'cut' + i, rot: .1 });
      if (o.nums !== false) mono(ctx, off ? 'cut' : (p < .095 ? p.toFixed(2).slice(1) : p.toFixed(2)), bx + bw / 2, y + h + 10, o.nsz || 10, off ? '#a79fc2' : P.chalk, 'center');
      ctx.save(); ctx.translate(bx + bw / 2, y + h + (o.nsz || 10) + 12); ctx.rotate(o.rotLab == null ? (i === n - 1 ? 1.15 : .6) : o.rotLab); ctx.fillStyle = i === o.hi ? P.pink : 'rgba(253,250,240,.85)'; ctx.font = (o.lsz || 11) + 'px ' + F.HAND; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(TOK[i], 0, 0); ctx.restore();
    });
  }
  function codeCard(ctx, x, y, w, lines, sz, reveal, colFn) {
    var h = lines.length * sz * 1.5 + sz * 1.2;
    F.paper(ctx, x + w / 2, y + h / 2, w, h, '#20243f', { seed: 'code' + lines[0], rot: -.004 });
    lines.forEach(function (s, i) { var r = reveal == null ? 1 : clamp(reveal * lines.length - i, 0, 1); if (r <= 0) return; mono(ctx, s, x + sz * .7, y + sz * 1.2 + i * sz * 1.5, sz, colFn ? colFn(s, i) : (s.trim().charAt(0) === '#' ? '#9d98b8' : P.mint), 'left', r); });
    return h;
  }

  /* ================= predict-then-watch (never gated) ================= */
  var PRED = { asked: false, choice: null, lastT: 0, el: null };
  function predictEl() {
    if (PRED.el) return PRED.el;
    var st = document.querySelector('#ifilm .stage'), d = document.createElement('div'); d.id = 'predict';
    d.innerHTML = '<div class="card"><h3>Predict, then watch</h3><p>Two words to write. Greedy grabs the best word each step. A width-2 beam keeps two paths alive. Which ends with the higher total log-prob?</p><div class="opts">' +
      '<button data-a="greedy">Greedy: best word each step must be best overall</button><button data-a="beam">Beam: it can find a better pair</button>' +
      '<button data-a="tie">A tie: they always agree</button>' +
      '<button class="skipq" data-a="skip">Just show me</button></div><div class="fb" aria-live="polite"></div></div>';
    st.appendChild(d); PRED.el = d;
    [].forEach.call(d.querySelectorAll('button'), function (b) {
      b.onclick = function (e) {
        e.stopPropagation(); PRED.choice = b.dataset.a; var fb = d.querySelector('.fb');
        fb.textContent = b.dataset.a === 'skip' ? 'Watching...' : b.dataset.a === 'beam' ? 'Yes. Watch the sums.' : 'A fair bet. Watch the sums.';
        setTimeout(function () { d.classList.remove('on'); resume(); }, b.dataset.a === 'skip' ? 150 : 900);
      };
    });
    return d;
  }
  function isPlaying() { var b = document.querySelector('#ifilm .pp'); return b && b.getAttribute('aria-label') === 'Pause'; }
  function pause() { if (isPlaying()) document.querySelector('#ifilm .pp').click(); }
  function resume() { if (!isPlaying()) document.querySelector('#ifilm .pp').click(); }
  function maybeAsk(t, at) {
    var natural = t - PRED.lastT > 0 && t - PRED.lastT < .25; PRED.lastT = t;
    if (PRED.el && PRED.el.classList.contains('on') && Math.abs(t - at) > .6) PRED.el.classList.remove('on');
    if (!PRED.asked && natural && t >= at && t < at + .5 && !window.__noPredict) { PRED.asked = true; pause(); predictEl().classList.add('on'); }
  }

  /* ================= tree drawing (beam search) ================= */
  function drawTree(ctx, W, H, l, t, o) {
    var Ly = lay(W, H), x0 = Ly.ph ? 36 : W / 2 - 330, x1 = Ly.ph ? W * .42 : W / 2 - 60, x2 = Ly.ph ? W * .74 : W / 2 + 190;
    var top = Ly.ph ? 40 : 60, span = Ly.ph ? Math.min(330, H * .52) : Math.min(420, H * .6);
    var words = Object.keys(TREE), leaves = [], sz = Ly.ph ? 12 : 15;
    words.forEach(function (w) { Object.keys(TREE[w].next).forEach(function (w2) { leaves.push([w, w2]); }); });
    var ly = function (k) { return top + span * (k + .5) / leaves.length; };
    var wy = {}; words.forEach(function (w) { var ks = []; leaves.forEach(function (lf, k) { if (lf[0] === w) ks.push(ly(k)); }); wy[w] = (ks[0] + ks[ks.length - 1]) / 2; });
    var root = top + span / 2;
    F.egg(ctx, x0, root, Ly.ph ? 16 : 22, t, {});
    txt(ctx, '"wrote"', x0, root + (Ly.ph ? 32 : 40), sz - 1, P.chalk);
    words.forEach(function (w) {
      var alive = o.alive1 ? o.alive1(w) : 1, y = wy[w];
      ctx.strokeStyle = 'rgba(253,250,240,' + (.15 + .5 * alive) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0 + 16, root); ctx.lineTo(x1 - 30, y); ctx.stroke();
      alpha(ctx, .25 + .75 * alive, function () {
        F.paper(ctx, x1, y, Ly.ph ? 62 : 86, Ly.ph ? 34 : 40, o.hi1 === w ? P.butter : P.cream, { seed: 'n1' + w, rot: .02 });
        txt(ctx, w, x1, y - 5, sz, P.ink); mono(ctx, 'p=' + TREE[w].p.toFixed(1), x1, y + (Ly.ph ? 10 : 12), sz - 3, '#6b5a9a', 'center');
      });
      Object.keys(TREE[w].next).forEach(function (w2) {
        var k = -1; leaves.forEach(function (lf, kk) { if (lf[0] === w && lf[1] === w2) k = kk; });
        var y2 = ly(k), a2 = o.alive2 ? o.alive2(w, w2) : 1, lp = ln(TREE[w].p) + ln(TREE[w].next[w2]);
        if (o.show2 != null && o.show2 <= 0) return;
        alpha(ctx, (o.show2 == null ? 1 : o.show2) * (.2 + .8 * a2), function () {
          ctx.strokeStyle = 'rgba(253,250,240,.45)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x1 + 30, y); ctx.lineTo(x2 - 34, y2); ctx.stroke();
          var hl = o.hl2 && o.hl2(w, w2);
          F.paper(ctx, x2, y2, Ly.ph ? 64 : 88, Ly.ph ? 26 : 30, hl ? hl : P.cream, { seed: 'n2' + w + w2, rot: -.015 });
          txt(ctx, w2 + ' ' + TREE[w].next[w2].toFixed(1), x2, y2, sz - 2, P.ink);
          if (o.sums) mono(ctx, lp.toFixed(2), x2 + (Ly.ph ? 38 : 52), y2, sz - 3, a2 > .5 ? P.butter : '#8f89ab', 'left');
        });
      });
    });
    return { x0: x0, x1: x1, x2: x2, root: root, wy: wy, ly: ly, leaves: leaves, bottom: top + span };
  }

  /* ================= chapters ================= */
  var chapters = [
    { name: 'the fortune-teller', start: 0, dur: 16, cap: {
        1: 'The mind egg is writing: <b>"...wrote a ___"</b>. Ten words hang as lanterns, each as tall as the model\'s score for it. A paper fortune-teller asks: <b>which word, at what cost?</b>',
        2: 'The model outputs <b>logits</b>, one per vocab word. <b>softmax</b> turns them into probabilities that sum to 1. <b>Temperature</b> divides the logits first: low T sharpens, high T flattens.',
        3: 'ARENA\'s <code>TransformerSampler.sample_next_token</code> calls <code>apply_temperature(logits, temperature)</code> which is just <code>logits / temperature</code>, then the chosen sampler. Real d_vocab is 50257; we show 10.' },
      draw: function (ctx, t, l, W, H) {
        var Ly = lay(W, H); bg(ctx, W, H, t);
        var T = l < 6 ? 1 : l < 10 ? lerp(1, .4, ramp(l, 6, 9)) : lerp(.4, 1.8, ramp(l, 10, 14));
        var pr = softmax(withT(LOGITS, T)), x = Ly.pad, w = W - 2 * Ly.pad, h = Ly.ph ? H * .34 : H * .42, y = Ly.ph ? 96 : 110;
        alpha(ctx, ramp(l, 0, 1), function () { lanterns(ctx, x, y, w, h, pr, { t: t, max: .9, hi: 0 }); });
        F.egg(ctx, Ly.ph ? 34 : 70, Ly.ph ? 48 : 60, Ly.ph ? 18 : 24, t, {});
        alpha(ctx, ramp(l, 1.5, 3), function () { F.note(ctx, 'which word,\nat what cost?', W - (Ly.ph ? 84 : 150), Ly.ph ? 46 : 58, Ly.ph ? 14 : 19, { color: P.pink, rot: .04, seed: 'ft' }); });
        var ty = y + h + (Ly.ph ? 62 : 70);
        alpha(ctx, ramp(l, 3, 4), function () {
          mono(ctx, 'logits  = [' + LOGITS.slice(0, Ly.ph ? 4 : 10).map(function (v) { return v.toFixed(1); }).join(', ') + (Ly.ph ? ', ...]' : ']'), Ly.pad, ty, Ly.fs, P.chalk);
          mono(ctx, 'T = ' + T.toFixed(2) + '   p = softmax(logits / T)', Ly.pad, ty + Ly.fs * 1.8, Ly.fs, T < .8 ? P.sky : T > 1.2 ? P.orange : P.butter);
          mono(ctx, 'p[story] = ' + pr[0].toFixed(3) + '   sum = ' + pr.reduce(function (a, b) { return a + b; }, 0).toFixed(3), Ly.pad, ty + Ly.fs * 3.6, Ly.fs, P.mint);
        });
      } },
    { name: 'nucleus, live', start: 16, dur: 24, cap: {
        1: 'Top-p trims the tail. Line the lanterns up tallest first, and pour their light into a jar one by one. Stop the moment the jar reaches <b>p = 0.90</b>. Everything after that line is cut, and the survivors share the light again.',
        2: '<b>Nucleus (top-p) sampling</b>: sort probabilities, take the cumulative sum, keep the smallest set whose sum reaches top_p, renormalise, sample. Unlike <b>top-k</b>, the size of the set adapts: a confident model keeps 2 words, an unsure one keeps 8.',
        3: '<code>sample_top_p(logits, top_p, min_tokens_to_keep=1)</code>: <code>logits.sort(descending=True)</code>, <code>probs.cumsum(-1)</code>, <code>t.searchsorted(cumsum, top_p, side="left")</code> gives n_keep. Compare <code>sample_top_k(logits, k)</code> with <code>t.topk</code>.' },
      draw: function (ctx, t, l, W, H) {
        var Ly = lay(W, H); bg(ctx, W, H, t);
        var T = l < 15 ? 1 : lerp(1, l < 19.5 ? .55 : 1.6, ramp(l, l < 19.5 ? 15 : 19.5, l < 19.5 ? 18 : 22.5));
        var pr = softmax(withT(LOGITS, T)), N = nucleus(pr, .9), cutP = ramp(l, 8, 10);
        var sorted = N.idx.map(function (i) { return pr[i]; });
        var x = Ly.pad + (Ly.ph ? 0 : 20), w = W - 2 * Ly.pad - (Ly.ph ? 0 : 40), h = Ly.ph ? H * .27 : H * .26, y = Ly.ph ? 40 : 50;
        // sorted bars
        var n = sorted.length, bw = w / n;
        sorted.forEach(function (p, j) {
          var bx = x + j * bw, keep = j < N.n, a = keep ? 1 : lerp(1, .25, cutP);
          alpha(ctx, a, function () { ctx.fillStyle = keep ? P.butter : '#a79fc2'; var hh = h * p / .75; ctx.fillRect(bx + 3, y + h - hh, bw - 6, hh); });
          mono(ctx, p.toFixed(2).slice(1), bx + bw / 2, y + h + 9, Ly.ph ? 9 : 11, P.chalk, 'center');
          ctx.save(); ctx.translate(bx + bw / 2 - 3, y + h + 19); ctx.rotate(j === n - 1 ? 1.15 : .7); ctx.fillStyle = 'rgba(253,250,240,.85)'; ctx.font = (Ly.ph ? 10 : 12) + 'px ' + F.HAND; ctx.fillText(TOK[N.idx[j]], 0, 0); ctx.restore();
        });
        // cumulative staircase
        var cy = y + h + (Ly.ph ? 74 : 90), ch = Ly.ph ? H * .25 : H * .24, draw = ramp(l, 2, 7) * n;
        ctx.strokeStyle = 'rgba(253,250,240,.2)'; ctx.lineWidth = 1; ctx.strokeRect(x, cy, w, ch);
        var py = cy + ch * (1 - .9);
        ctx.setLineDash([6, 4]); ctx.strokeStyle = P.pink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, py); ctx.lineTo(x + w, py); ctx.stroke(); ctx.setLineDash([]);
        mono(ctx, 'top_p = 0.90', x + w - 4, py - 9, Ly.ph ? 10 : 12, P.pink, 'right');
        ctx.strokeStyle = P.mint; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, cy + ch);
        var prev = 0;
        for (var j = 0; j < n && j < draw; j++) { var c = N.cum[j], fx = x + (j + Math.min(1, draw - j)) * bw; ctx.lineTo(x + j * bw, cy + ch * (1 - prev)); ctx.lineTo(x + j * bw, cy + ch * (1 - c)); ctx.lineTo(fx, cy + ch * (1 - c)); prev = c; }
        ctx.stroke();
        mono(ctx, 'cumsum', x + 4, cy + ch - 10, Ly.ph ? 10 : 12, P.mint, 'left');
        // cut line
        alpha(ctx, cutP, function () {
          var cx = x + N.n * bw; ctx.strokeStyle = P.red; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, y - 10); ctx.lineTo(cx, cy + ch + 6); ctx.stroke();
          txt(ctx, 'scissors: keep ' + N.n + ' of 10', Math.min(cx + 6, x + w - (Ly.ph ? 120 : 160)), y - 12, Ly.ph ? 12 : 15, P.red, { align: 'left', seed: 'sc' });
        });
        var ty = cy + ch + (Ly.ph ? 30 : 36);
        alpha(ctx, ramp(l, 10, 11), function () {

    { name: 'the card box (KV cache)', start: 66, dur: 26, cap: {
