(function () {

var M = (function () {
  // names: 0 = Mary, 1 = John. Residual features per position: tok e (2), DUP (2); at END: INHIB (2), logits (2).

    { id: '7.9', role: 'S-inhibition', kind: 'si', gamma: 4, w: 0.8 },
    { id: '8.6', role: 'S-inhibition', kind: 'si', gamma: 4, w: 1.2 },

    { id: '9.6', role: 'name mover', kind: 'nm', alpha: 2.5, delta: 4, k: 2.0 },

      var a = softmax(sc), o = [0, 0]; keys.forEach(function (j, q) { if (j >= 0) { o[0] += h.w * a[q] * DUP[j][0]; o[1] += h.w * a[q] * DUP[j][1]; } });
      att[h.id] = { keys: keys, a: a }; o = fin(h, o); INHIB[0] += o[0]; INHIB[1] += o[1]; });

    return lines.length * sz * 1.3 + 12;
  }
  function codeNote(ctx, lines, x, y, sz, a, seed, color) {
    ctx.save(); ctx.globalAlpha = a; ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l).width); });

    ctx.fillStyle = P.ink; ctx.textBaseline = 'top'; lines.forEach(function (l, i) { ctx.fillStyle = l.charAt(0) === '#' ? '#7a6f8f' : P.ink; ctx.fillText(l, x + 12, y + 8 + i * sz * 1.4); });

  function fitMono(ctx, lines, maxW, big) { var sz = big; ctx.save(); for (; sz > 8; sz -= .5) { ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l).width); }); if (w + 26 <= maxW) break; } ctx.restore(); return sz; }
  /* ---------------- the bar and its sentence ---------------- */
  function sentence(ctx, W, y, words, a, hiPos) {
    var pw = ph(W), sz = pw ? 15 : 20, lines = pw ? [words.slice(0, 9), words.slice(9)] : [words]; ctx.save(); ctx.globalAlpha = a;
    var idx = 0;
    lines.forEach(function (ln, li) {
      ctx.font = '600 ' + sz + 'px ' + F.HAND; var ws = ln.map(function (w) { return ctx.measureText(w).width + 12; }), tot = ws.reduce(function (p, q) { return p + q; }, 0) + (li === lines.length - 1 ? 50 : 0), x = (W - tot) / 2;
      ln.forEach(function (w, k) {

        if (isName) { if (hiPos && hiPos[i]) F.glow(ctx, cx, cy, ws[k], 'rgba(247,227,160,.9)', hiPos[i]); F.paper(ctx, cx, cy, ws[k] - 2, sz * 1.5, w === 'Mary' ? P.pink : P.sky, { seed: 'w' + i, rot: (i % 3 - 1) * .02, blur: 3, lift: 2 }); }

      });

  }

    F.paper(ctx, w / 2 - 34, -24, 60, 30, P.sky, { seed: 'sj' }); F.hand(ctx, 'John', w / 2 - 34, -24, 15, P.ink, { seed: 'sjt' });
    ctx.restore();
  }
  /* ---------------- the circuit board: heads placed above the position they work at ---------------- */
  var G = {};
  function geo(W, H, top, bottom) {

    var cw = pw ? W : Math.min(W, 960), ox = (W - cw) / 2; G.tx = [ox + cw * .14, ox + cw * .38, ox + cw * .62, ox + cw * .86];

      '7.9': [G.tx[3] - G.bw * .56, G.ly.si], '8.6': [G.tx[3] + G.bw * .56 - (pw ? 8 : 0), G.ly.si],

  }
  var TOKW = ['Mary', 'John', 'John', 'to'], TOKP = [1, 3, 9, 13], TOKN = ['IO', 'S1', 'S2', 'END'];
  function board(ctx, W, t, o) {

    // wires (attention edges), drawn live from the attention weights

    // token slips

      F.paper(ctx, G.tx[i], G.tokY, pw ? 58 : 76, 30, col, { seed: 'tk' + i, rot: (i - 1.5) * .015 }); F.hand(ctx, w, G.tx[i], G.tokY, pw ? 14 : 16, P.ink, { seed: 'tkt' + i + w });
      F.hand(ctx, TOKN[i], G.tx[i], G.tokY + 24, 11, P.butter, { seed: 'tn' + i }); });

    M.HEADS.forEach(function (h) { var p = G.pos[h.id]; if (o.onlyKinds && o.onlyKinds.indexOf(h.kind) < 0) return;
      var g = o.glow ? o.glow[h.id] || 0 : 0, off = o.off && o.off[h.id];

  /* the detective: an ink stick figure in a paper fedora (no face; the acting is in the pose) */

    d.innerHTML = '<div style="font:700 18px ' + F.HAND + ';margin-bottom:8px">Predict, then watch: patched alone, clean into corrupted, which head recovers the most?</div>' +
      ['name mover 9.9 (it says the name)', 'S-inhibition 8.6 (it says who to ignore)', 'duplicate-token 3.0 (it spots the repeat)'].map(function (s, i) { return '<button data-c="' + i + '" style="display:block;width:100%;text-align:left;margin:6px 0;padding:9px 10px;border:0;border-radius:8px;background:#f7e3a0;color:#2a2934;font:inherit;cursor:pointer">' + s + '</button>'; }).join('') +
      '<button data-c="skip" style="display:block;margin:8px 0 0 auto;padding:6px 10px;border:0;border-radius:8px;background:#b9e3cc;color:#2a2934;font:inherit;cursor:pointer">just show me &#9654;</button>';

  var CD ={ mode: 'patch', set: {} };
  function codaRun() {
    var o = {}; if (CD.mode === 'patch') { o.patch = {}; Object.keys(CD.set).forEach(function (id) { o.patch[id] = C0.out[id]; }); return M.run(M.CORR, o); }
    o.scale = {}; Object.keys(CD.set).forEach(function (id) { o.scale[id] = 0; }); return M.run(M.CLEAN, o);
  }
  var coda = {
    caption: { 1: '', 2: '', 3: '' },
    start: function (api, panel) {
      panel.innerHTML = '<div style="font-size:13px">Tap heads. <button class="mp" style="min-height:26px;font-size:12px">mode: patch clean into corrupted</button> <button class="cl" style="min-height:26px;font-size:12px">clear</button></div>';
      var mp = panel.querySelector('.mp');
      mp.onclick = function () { CD.mode = CD.mode === 'patch' ? 'ablate' : 'patch'; CD.set = {}; mp.textContent = CD.mode === 'patch' ? 'mode: patch clean into corrupted' : 'mode: zero-ablate in clean'; api.audio.blip(660); };
      panel.querySelector('.cl').onclick = function () { CD.set = {}; api.audio.blip(520); };
    },
    down: function (x, y, api) { var id = hitHead(x, y); if (!id) return; if (CD.set[id]) delete CD.set[id]; else CD.set[id] = 1; api.audio.blip(CD.set[id] ? 880 : 440); },
    draw: function (ctx, t, W, H) {

      readout(ctx, 12, 8, [[(CD.mode === 'patch' ? 'corrupted run, patched: ' : 'clean run, ablated: ') + (Object.keys(CD.set).join(', ') || 'none'), P.chalk], ['logit diff ' + R.ld.toFixed(2) + '   metric ' + M.metric(R.ld).toFixed(2), P.butter]], W);
      seesaw(ctx, W / 2, H - (pw ? 62 : 70), Math.min(W - 110, 300), R.ld, 1);
    }
