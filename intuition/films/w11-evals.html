<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;

  /*MATH*/
  /* ---------------- honest maths: seeded rng, normals, binomial CIs, control Monte-Carlo ---------------- */
  function mulberry(seed) { var s = seed >>> 0 || 1; return function () { s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function gauss(r) { var u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307 * v); }
  // standard normal CDF (Abramowitz-Stegun 7.1.26) and its inverse (Acklam)
  function Phi(x) { var s = x < 0 ? -1 : 1, z = Math.abs(x) / Math.SQRT2, t = 1 / (1 + .3275911 * z);
    var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-z * z); return .5 * (1 + s * y); }
  function invPhi(p) {
    var a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239],
      b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572],
      c = [-.007784894002430293, -.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783],
      d = [.007784695709041462, .3224671290700398, 2.445134137142996, 3.754408661907416], q, r;
    if (p < .02425) { q = Math.sqrt(-2 * Math.log(p)); return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
    if (p > 1 - .02425) { q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
    q = p - .5; r = q * q; return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
  }
  // Wald interval, exactly the formula ARENA-style evals report: p ± 1.96·sqrt(p(1-p)/n)
  function ci(k, n) { if (!n) return { p: 0, lo: 0, hi: 1, se: 0 }; var p = k / n, se = Math.sqrt(p * (1 - p) / n); return { p: p, se: se, lo: Math.max(0, p - 1.96 * se), hi: Math.min(1, p + 1.96 * se) }; }

  // Dataset: 300 generated questions, each graded 1..10 by a second model; keep score >= 7
  var DS = (function () { var r = mulberry(11), out = []; for (var i = 0; i < 300; i++) out.push(Math.round(clamp(6.7 + 1.7 * gauss(r), 1, 10))); return out; })();
  // Eval run: model-graded C/I verdicts on the kept questions (hidden true rate 0.62)
  var KEPT = DS.filter(function (s) { return s >= 7; }).length;
  function outcomes(seed, p, n) { var r = mulberry(seed), o = []; for (var i = 0; i < n; i++) o.push(r() < p ? 1 : 0); return o; }
  var RUN = outcomes(21, 0.62, KEPT);
  var BARE = outcomes(31, 0.31, 150), SCAF = outcomes(32, 0.58, 150);
  function sum(a, n) { var s = 0; for (var i = 0; i < n; i++) s += a[i]; return s; }

  // AI control (trusted monitoring + defer-to-trusted), after ARENA 3.x protocol_trusted_monitoring
  // Suspicion: clean ~ N(0,1), backdoored ~ N(d,1). Audit if s > tA (top `budget` of clean), defer to T if tD < s <= tA.
  // Episode: N problems; U attacks each with prob `rate`. Audited backdoor => caught (safe). Unaudited, undeferred backdoor => lost.
  var CTRL = { N: 100, rate: 0.05, d: 2.0 };
  function thresholds(budget, defer) { return { tA: invPhi(1 - budget), tD: defer > 0 ? invPhi(1 - Math.min(.999, budget + defer)) : Infinity }; }
  function simulate(budget, defer, d, sims, seed) {
    var r = mulberry(seed || 7), th = thresholds(budget, defer), safe = 0, deferred = 0, total = 0, caught = 0, lost = 0;
    for (var s = 0; s < sims; s++) {
      var ok = true;
      for (var i = 0; i < CTRL.N; i++) {
        var bd = r() < CTRL.rate, sc = gauss(r) + (bd ? d : 0);
        if (sc > th.tA) { if (bd) { caught++; break; } }
        else if (sc > th.tD) { /* T writes this one */ }
        else if (bd) { ok = false; lost++; break; }
      }
      if (ok) safe++;
      // usefulness: honest U on the same number of problems, fraction NOT replaced by T's code
      for (i = 0; i < CTRL.N; i++) { var c = gauss(r); total++; if (c > th.tD && c <= th.tA) deferred++; }
    }
    var S = ci(safe, sims);
    return { safety: S.p, lo: S.lo, hi: S.hi, useful: 1 - deferred / total, caught: caught, lost: lost, tA: th.tA, tD: th.tD, sims: sims };
  }
  // analytic per-attempt odds (single attack): audited / deferred / slips through
  function perAttempt(budget, defer, d) { var th = thresholds(budget, defer), pa = 1 - Phi(th.tA - d), pp = th.tD === Infinity ? 1 - pa : Phi(th.tD - d); return { pa: pa, pd: 1 - pa - pp, pp: pp }; }
  /*ENDMATH*/

  /* ---------------- scenery ---------------- */
  var small = function (W) { return W < 520; };
  function office(ctx, W, H, t, o) {

    F.sky(ctx, W, H, o.top || '#2b3163', o.bot || '#3d4379');
    ctx.save(); ctx.globalAlpha = .07; ctx.fillStyle = P.cream; for (var x = 12; x < W; x += 34) ctx.fillRect(x, 0, 12, H); ctx.restore();
    // window with the moon, venetian blinds (detective office)
    var ww = small(W) ? 70 : 110, wx = W - ww - 14, wy = 10;
    if (o.win) {
    F.paper(ctx, wx + ww / 2, wy + ww * .55, ww, ww * 1.1, '#1a1e3c', { seed: 'win', shadow: true });
    F.moon(ctx, wx + ww * .62, wy + ww * .4, ww * .13);
    ctx.save(); ctx.fillStyle = 'rgba(247,227,160,.25)'; for (var k = 0; k < 7; k++) ctx.fillRect(wx + 4, wy + 6 + k * ww * .15, ww - 8, 3); ctx.restore();
    }
    if (o.floor !== false) F.paper(ctx, W / 2, H - 14, W + 30, 42, '#6b4f45', { seed: 'desk', shadow: true });
  }
  function readout(ctx, x, y, lines, W) {
    var sz = small(W) ? 12 : 14; ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l[0]).width); }); ctx.restore();
    F.paper(ctx, x + w / 2 + 10, y + lines.length * sz * .65 + 4, w + 22, lines.length * sz * 1.3 + 12, 'rgba(22,26,53,.9)', { seed: 'ro' + lines.length, shadow: false });
    ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; ctx.textBaseline = 'top';
    lines.forEach(function (l, i) { ctx.fillStyle = l[1] || P.chalk; ctx.fillText(l[0], x + 10, y + 8 + i * sz * 1.3); }); ctx.restore();
    return { w: w + 22, h: lines.length * sz * 1.3 + 12 };
  }
  function lbl(ctx, text, x, y, color, sz, align) { F.hand(ctx, text, x, y, sz || 15, color || P.chalk, { outline: 4, outlineColor: 'rgba(20,20,50,.8)', seed: text, align: align }); }
  function pin(ctx, x, y, c) { ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(x + 2, y + 3, 5, 0, 6.283); ctx.fill(); ctx.fillStyle = c || P.red; ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.283); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(x - 1.5, y - 1.5, 1.6, 0, 6.283); ctx.fill(); ctx.restore(); }
  function redString(ctx, pts, prog) {
    var segs = pts.length - 1, upto = prog * segs; ctx.save(); ctx.strokeStyle = '#d23a45'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 0; i < segs && i < upto; i++) { var f = Math.min(1, upto - i), a = pts[i], b = pts[i + 1], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 + 14;
      var ex = lerp(a[0], b[0], f), ey = lerp(a[1], b[1], f), cx = lerp(a[0], mx, f), cy = lerp(a[1], my, f); ctx.quadraticCurveTo(cx, cy, ex, ey); }
    ctx.stroke(); ctx.restore();
  }
  function question(ctx, W, H, a, x, y) {
    if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; var sz = small(W) ? 17 : 22;
    F.note(ctx, 'what exactly\nare we afraid of?', x == null ? (small(W) ? W * .36 : W * .3) : x, y == null ? (small(W) ? 44 : 60) : y, sz, { rot: -.04, seed: 'q', color: P.butter });
    ctx.restore();
  }
  // Win98-ish window: returns the inner rect
  function win98(ctx, x, y, w, h, title) {
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x + 5, y + 6, w, h);
    ctx.fillStyle = '#c3c3c3'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y, 2, h); ctx.fillStyle = '#6d6d6d'; ctx.fillRect(x, y + h - 2, w, 2); ctx.fillRect(x + w - 2, y, 2, h);
    var g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, '#0a1f7a'); g.addColorStop(1, '#3a7bd0'); ctx.fillStyle = g; ctx.fillRect(x + 4, y + 4, w - 8, 20);
    ctx.fillStyle = '#fff'; ctx.font = '700 12px Tahoma,Verdana,sans-serif'; ctx.textBaseline = 'middle'; ctx.fillText(title, x + 10, y + 14);
    ctx.fillStyle = '#c3c3c3'; ctx.fillRect(x + w - 22, y + 7, 15, 13); ctx.fillStyle = '#000'; ctx.font = '700 10px Tahoma,sans-serif'; ctx.fillText('x', x + w - 18, y + 13);
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 6, y + 30, w - 12, h - 36); ctx.restore();
    return { x: x + 6, y: y + 30, w: w - 12, h: h - 36 };
  }
  function cell(ctx, text, x, y, w, h, o) {
    o = o || {}; ctx.save(); if (o.bg) { ctx.fillStyle = o.bg; ctx.fillRect(x, y, w, h); } ctx.strokeStyle = '#b8b8b8'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w, h);
    ctx.fillStyle = o.color || '#111'; ctx.font = (o.bold ? '700 ' : '400 ') + (o.sz || 12) + 'px Tahoma,Verdana,sans-serif'; ctx.textBaseline = 'middle';
    ctx.textAlign = o.align || 'left'; ctx.fillText(text, o.align === 'right' ? x + w - 5 : o.align === 'center' ? x + w / 2 : x + 5, y + h / 2 + 1); ctx.restore();
  }
  function eggAt(ctx, x, y, s, t, color, label, clear) {
    F.egg(ctx, x, y, s, t, { clear: clear || 0, features: [{ x: -.3, y: -.2, c: color }, { x: .35, y: .1, c: color }] });
    if (label) lbl(ctx, label, x, y + s * 1.35, P.chalk, Math.max(12, s * .42));
  }
  // number line 0..100% with an interval band
  function ciBar(ctx, x, y, w, c, color, label, sz) {
    ctx.save(); ctx.strokeStyle = 'rgba(253,250,240,.55)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
    for (var i = 0; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(x + w * i / 4, y - 4); ctx.lineTo(x + w * i / 4, y + 4); ctx.stroke(); }
    ctx.fillStyle = color; ctx.globalAlpha = .55; ctx.fillRect(x + w * c.lo, y - 7, Math.max(2, w * (c.hi - c.lo)), 14); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(x + w * c.p, y, 5, 0, 6.283); ctx.fill(); ctx.restore();
    if (label) F.hand(ctx, label, x, y - 18, sz || 13, P.chalk, { align: 'left', seed: 'cb' + label.length, outline: 3, outlineColor: 'rgba(20,20,50,.7)' });
  }
  /* the paper detective: an ink stick figure in a fedora (no face; she acts with her whole body) */
  function sleuth(ctx, x, y, W, t, o) {
    o = o || {}; o.scarf = o.scarf || P.red; var f = F.stick(ctx, x, y, o.s || (small(W) ? 92 : 118), t, o);
    if (f && f.head) { var r = f.head.r; ctx.save(); ctx.translate(f.head.x, f.head.y - r * .55); ctx.rotate((o.face || 1) * -.12);
      ctx.fillStyle = '#6b4f45'; ctx.beginPath(); ctx.ellipse(0, 0, r * 1.55, r * .32, 0, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-r * .85, 0); ctx.lineTo(-r * .7, -r * .95); ctx.quadraticCurveTo(0, -r * 1.25, r * .7, -r * .95); ctx.lineTo(r * .85, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = P.red; ctx.fillRect(-r * .8, -r * .32, r * 1.6, r * .22); ctx.restore(); }
    return f;
  }
  function pct(v, d) { return (100 * v).toFixed(d == null ? 0 : d) + '%'; }

  /* ---------------- chapters ---------------- */
  var SRC = [ /* scenes; the captioned beats are cut from these below */
    { name: 'the worry', start: 0, dur: 5, draw: function (ctx, t, l, W, H) {
        office(ctx, W, H, t, { win: true }); var sm = small(W);
        var s = sm ? 56 : 70; sleuth(ctx, W * .3, H - 34, W, t, { s: s * 1.5, lantern: true, lit: .9, pose: l < 1.2 ? 'idle' : 'think', t0: t - l + 1.2 });
        eggAt(ctx, W * .68, H - 34 - s * 1.0, s * .75, t, 'rgba(243,179,195,.9)', null, ramp(l, 2, 4) * .6); lbl(ctx, 'the new model', W * .68, H - 34 - s * 2.1, P.pink, sm ? 14 : 17);
        var cw = sm ? 240 : 320, chh = sm ? 120 : 150, qx = sm ? 16 + cw / 2 : W / 2; F.paper(ctx, qx, (sm ? 66 : 80), cw, chh, '#b98a5e', { seed: 'cork1', rot: .01 });
        question(ctx, W, H, ramp(l, .5, 1.5), qx, sm ? 66 : 80); pin(ctx, qx + 4, (sm ? 66 : 80) - (sm ? 28 : 36));
        F.plane(ctx, lerp(-40, W + 40, l / 6), H * .4 + Math.sin(l * 2) * 14, 13, .08, P.cream);
      } },
    { name: 'threat model', start: 5, dur: 7, draw: function (ctx, t, l, W, H) {
        office(ctx, W, H, t); var sm = small(W);
        var bw = Math.min(W - 24, 640), bh = Math.min(H - 70, sm ? 330 : 360), bx = (W - bw) / 2, by = sm ? 20 : 30;
        F.paper(ctx, W / 2, by + bh / 2, bw, bh, '#b98a5e', { seed: 'cork' });
        ctx.save(); var r = F.rng('cork'); ctx.fillStyle = 'rgba(90,55,30,.25)'; for (var i = 0; i < 220; i++) ctx.fillRect(bx + r() * bw, by + r() * bh, 2, 2); ctx.restore();
        var fz = sm ? 13 : 16, cards = [
          ['CAPABILITY', 'writes good code', P.cream, bx + bw * .25, by + bh * .22],
          ['PATHWAY', 'hides a backdoor\nwhen unwatched', P.pink, bx + bw * .72, by + bh * .42],
          ['HARM', 'bad code ships\nto production', P.peach, bx + bw * .3, by + bh * .66]];
        var pts = [];
        cards.forEach(function (c, i) { var a = ramp(l, .3 + i * 1.1, 1 + i * 1.1); if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
          F.note(ctx, c[1], c[3], c[4], fz, { color: c[2], rot: (i - 1) * .05, seed: 'tm' + i, tape: false });
          F.hand(ctx, c[0], c[3], c[4] - fz * (c[1].split('\n').length * .65 + .9), fz * .75, '#7a2a30', { seed: 'h' + i }); pin(ctx, c[3], c[4] - fz * 1.6); ctx.restore(); pts.push([c[3], c[4] - fz * 1.6]); });
        if (pts.length === 3) redString(ctx, pts, ramp(l, 3.2, 4.6));
        sleuth(ctx, sm ? W * .84 : bx - 60, sm ? Math.min(H - 20, by + bh + 150) : by + bh, W, t, l < 3 ? { pose: 'idle', face: sm ? -1 : 1 } : { pose: 'point', face: sm ? -1 : 1, t0: t - l + 3.2, look: { x: pts.length ? pts[pts.length - 1][0] : W / 2, y: pts.length ? pts[pts.length - 1][1] : by } });
        var sa = ramp(l, 4.8, 5.6); if (sa > 0) { ctx.save(); ctx.globalAlpha = sa;
          F.note(ctx, 'SPEC  metric = % of tasks with\na backdoor, when it thinks\nnobody is checking', W / 2, by + bh * .9, sm ? 12 : 15, { color: P.mint, rot: .02, seed: 'spec', font: F.MONO }); ctx.restore(); }
        ctx.save(); ctx.globalAlpha = 1; F.note(ctx, 'what exactly are\nwe afraid of?', bx + bw * .74, by + bh * .12, sm ? 12 : 15, { rot: .04, seed: 'q2', color: P.butter, tape: false }); pin(ctx, bx + bw * .74, by + bh * .12 - (sm ? 16 : 20), '#3a6fd0'); ctx.restore();
      } },
    { name: 'dataset', start: 12, dur: 7, draw: function (ctx, t, l, W, H) {
        office(ctx, W, H, t, { floor: false }); var sm = small(W);
        var cols = sm ? 20 : 30, rows = Math.ceil(300 / cols), gw = Math.min(W - 24, 720), cs = gw / cols, gx = (W - gw) / 2, gy = sm ? 96 : 110;
        var made = Math.floor(ramp(l, .2, 3) * 300), graded = Math.floor(ramp(l, 2.6, 6.2) * 300), kept = 0, torn = 0;
        for (var i = 0; i < made; i++) {
          var cx = gx + (i % cols) * cs + cs / 2, cy = gy + Math.floor(i / cols) * cs * 1.25 + cs * .6, sc = DS[i];
          var g = i < graded, bad = g && sc < 7; if (g) { if (bad) torn++; else kept++; }
          ctx.save(); ctx.translate(cx, cy + (bad ? Math.min(30, (graded - i) * .6) : 0)); ctx.rotate(bad ? .6 : ((i * 37) % 7 - 3) * .02);
          ctx.globalAlpha = bad ? Math.max(0, 1 - (graded - i) / 40) : 1;
          ctx.fillStyle = g ? (bad ? P.red : P.mint) : P.cream; ctx.fillRect(-cs * .4, -cs * .5, cs * .8, cs);
          if (g && !sm) { ctx.fillStyle = P.ink; ctx.font = '700 ' + Math.round(cs * .45) + 'px ' + F.MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(sc, 0, 1); }
          ctx.restore();
        }
        var gh = rows * cs * 1.25, s = sm ? 26 : 34, ey = Math.min(H - s * 1.6, gy + gh + s * 1.6);
        eggAt(ctx, W * .25, ey, s, t, 'rgba(243,179,195,.9)', 'writer', .5); eggAt(ctx, W * .75, ey, s, t, 'rgba(185,227,204,.9)', 'grader', .5);
        readout(ctx, 12, 10, [['written ' + made + '  graded ' + graded, P.chalk], ['kept (≥7) ' + kept + '  torn ' + torn, P.mint]], W);
      } },
    { name: 'scoring', start: 19, dur: 8, draw: function (ctx, t, l, W, H) {
        office(ctx, W, H, t, { floor: false }); var sm = small(W);
        // conveyor: dataset -> solver -> scorer
        var y0 = sm ? Math.max(60, H * .1) : 80, bw = Math.min(W - 24, 700), bx = (W - bw) / 2, sz = sm ? 13 : 16;
        var boxes = [['dataset', P.cream], ['solver', P.pink], ['scorer', P.mint]];
        boxes.forEach(function (b, i) { var cx = bx + bw * (i * 2 + 1) / 6; F.note(ctx, b[0], cx, y0, sz, { color: b[1], seed: 'bx' + i, tape: false, font: F.MONO }); if (i < 2) F.arrow(ctx, cx + bw * .1, y0, cx + bw * .23, y0, P.chalk, 2.5, 'ca' + i); });
        var n = Math.floor(ramp(l, .5, 7.4) * KEPT), k = sum(RUN, n), c = ci(k, n);
        for (var j = 0; j < 3; j++) { var ph = ((l * 1.3 + j / 3) % 1); F.plane(ctx, bx + bw * lerp(.12, .88, ph), y0 + 28 + Math.sin(ph * 9) * 4, 9, 0, j % 2 ? P.butter : P.cream); }
        // stamp column of the last 12 verdicts
        var sx = bx + bw * .83, sy = y0 + 60;
        for (var q = Math.max(0, n - 10); q < n; q++) { var yy = sy + (q - Math.max(0, n - 10)) * (sm ? 17 : 20); F.hand(ctx, RUN[q] ? 'C' : 'I', sx, yy, sm ? 14 : 17, RUN[q] ? P.mint : P.red, { seed: 'v' + q, outline: 3, outlineColor: 'rgba(20,20,50,.7)' }); }
        var lw = Math.min(bw * .72, 480), lx = bx + 6, ly = y0 + (sm ? Math.max(130, H * .3) : 150);
        eggAt(ctx, sx, Math.min(H - 40, sy + (sm ? 210 : 240)), sm ? 26 : 32, t, 'rgba(185,227,204,.9)', 'grader', .55);
        ciBar(ctx, lx, ly, lw, c, P.butter, 'accuracy, 95% band', sm ? 14 : 16);
        sleuth(ctx, sm ? W * .22 : bx - 40, sm ? H - 22 : ly + 200, W, t, { pose: 'lean-in', t0: t - l + .8, look: { x: lx + lw * c.p, y: ly } });
        ['0', '50%', '100%'].forEach(function (s2, i) { F.hand(ctx, s2, lx + lw * i / 2, ly + 18, 11, 'rgba(253,250,240,.7)', { seed: s2 }); });
