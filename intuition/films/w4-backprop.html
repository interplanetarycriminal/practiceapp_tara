<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2140">
<title>Who gets the blame?</title>
<style>
  #ifilm .cpanel{font-size:13px}
  .bp-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
  .bp-grid label{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
  .bp-grid label b{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:#f7e3a0;width:1.1em}
  .bp-grid output{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;min-width:3.4em;text-align:right;color:#b9e3cc}
  .bp-btns{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .bp-btns button.go{background:#f7e3a0!important;font-weight:700}
  .bp-tip{margin-top:4px;color:#c8b8ea;font-size:12.5px;line-height:1.3;min-height:1.3em}
</style>
</head>
<body>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var IF = window.IFilm, P = IF.P, HAND = IF.HAND, MONO = IF.MONO;
  var clamp = IF.clamp, lerp = IF.lerp, ease = IF.ease, ramp = IF.ramp;

  /* ---------------------------------------------------------- honest maths
     Graph: m = w*x ; z = m + b ; h = tanh(z) ; d = h - y ; L = d*d
     d is used twice by the last station, so its gradient is a SUM of two. */
  var X0 = 1.5, W0 = 0.8, B0 = -0.2, Y0 = 1, LR = 0.5;
  function compute(x, w, b, y) {
    var m = w * x, z = m + b, h = Math.tanh(z), d = h - y, L = d * d;
    var gL = 1, gd1 = d * gL, gd2 = d * gL, gd = gd1 + gd2, gh = gd * 1, th = 1 - h * h,
      gz = gh * th, gm = gz * 1, gb = gz * 1, gw = gm * x, gx = gm * w;
    return { x: x, w: w, b: b, y: y, m: m, z: z, h: h, d: d, L: L, gL: gL, gd1: gd1, gd2: gd2, gd: gd, gh: gh, th: th, gz: gz, gm: gm, gb: gb, gw: gw, gx: gx,
      vals: [x, m, z, h, d, L], grads: [gx, gm, gz, gh, gd, gL] };
  }
  function wiggle(x, w, b, y) { var e = 1e-4; return (compute(x, w + e, b, y).L - compute(x, w - e, b, y).L) / (2 * e); }
  function fmt(v, n) { n = n == null ? 3 : n; var s = Math.abs(v).toFixed(n); return (v < 0 && +s !== 0 ? '\u2212' : '') + s; }
  var V0 = compute(X0, W0, B0, Y0);
  window.__bp = { compute: compute, wiggle: wiggle, V0: V0 };

  /* ---------------------------------------------------------- layout
     spine positions k=0..6: 0 = input x, 1..5 = stations, 6 = the bell */
  var OPS = ['', '\u00d7 w', '+ b', 'tanh', '\u2212 y', 'd \u00b7 d'];
  var COLS = ['', P.peach, P.mint, P.butter, P.sky, P.lav];
  function lay(rx, ry, rw, rh) {
    var o = { por: rw < rh * 1.05, p: [], rw: rw, rh: rh, rx: rx, ry: ry }, k;
    if (o.por) {
      var cx = rx + rw * 0.54;
      for (k = 0; k < 7; k++) o.p.push({ x: cx, y: ry + rh * (0.065 + 0.87 * k / 6) });
      o.step = rh * 0.87 / 6; o.side = { x: rw * 0.3, y: 0 }; o.perp = { x: 1, y: 0 };
      o.bw = Math.min(rw * 0.28, 150); o.bh = Math.min(o.step * 0.46, 50); o.s = Math.min(o.step * 0.5, 50);
      o.fs = clamp(o.bh * 0.44, 12, 22); o.lf = clamp(rw * 0.034, 12.5, 16);
    } else {
      var cy = ry + rh * 0.56;
      for (k = 0; k < 7; k++) o.p.push({ x: rx + rw * (0.055 + 0.89 * k / 6), y: cy });
      o.step = rw * 0.89 / 6; o.side = { x: 0, y: -rh * 0.3 }; o.perp = { x: 0, y: 1 };
      o.bw = Math.min(o.step * 0.58, 170); o.bh = Math.min(rh * 0.13, 62); o.s = Math.min(rh * 0.12, 62);

  }
  function wpos(o, i) { // worker feet
    var p = o.p[i];

  }
  function planeAt(o, kf, sign) {
    kf = clamp(kf, 0, 6); var k0 = Math.min(5, Math.floor(kf)), f = kf - k0, a = o.p[k0], b = o.p[k0 + 1];

  }
  function drawPlane(o, ctx, kf, dir, sign, color, label, labColor) {

  }
  function tag(ctx, text, x, y, fs, ink) {

  }
  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

    ctx.save(); ctx.font = '700 ' + fs + 'px ' + HAND; var w = ctx.measureText(text).width; ctx.restore();
    var cx = alignSide < 0 ? x - w / 2 : alignSide > 0 ? x + w / 2 : x;
    ctx.save(); ctx.fillStyle = 'rgba(22,26,53,.7)'; roundRect(ctx, cx - w / 2 - 4, y - fs * 0.68, w + 8, fs * 1.36, 5); ctx.fill(); ctx.restore();

  /* ---------------------------------------------------------- background */
  function bg(ctx, W, H, t, o) {
    IF.sky(ctx, W, H, P.night, '#343a72');

    IF.moon(ctx, W * (o && o.por ? 0.9 : 0.93), H * 0.08, Math.min(W, H) * 0.035);
    // factory wall collage, low and dark so it never fights the numbers
    var r = IF.rng('wall');
    ctx.save(); ctx.globalAlpha = .55;
    IF.paper(ctx, W * 0.5, H * 0.99, W * 1.08, H * 0.2, '#262b55', { seed: 'floor', shadow: false });
    for (var i = 0; i < 7; i++) {
      var wx = W * (0.06 + i * 0.15 + (r() - .5) * .03), wy = H * 0.94;
      ctx.fillStyle = r() < .5 ? 'rgba(247,227,160,.25)' : 'rgba(169,201,239,.14)'; ctx.fillRect(wx, wy, W * 0.035, H * 0.03);
    }
    ctx.restore();
  }
  function bell(ctx, x, y, s, ring, t) {
    ctx.save(); ctx.translate(x, y - s * 0.2); ctx.rotate(ring * Math.sin(t * 26) * 0.35);
    ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(0, -s * 0.62, s * 0.1, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.28, -s * 0.5); ctx.quadraticCurveTo(-s * 0.34, s * 0.05, -s * 0.55, s * 0.3); ctx.lineTo(s * 0.55, s * 0.3);
    ctx.quadraticCurveTo(s * 0.34, s * 0.05, s * 0.28, -s * 0.5); ctx.quadraticCurveTo(0, -s * 0.66, -s * 0.28, -s * 0.5); ctx.closePath();
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4; ctx.fillStyle = '#efbf4f'; ctx.fill(); ctx.restore();
    ctx.save(); ctx.clip(); ctx.fillStyle = IF.grain(ctx); ctx.globalAlpha = .6; ctx.fillRect(-s, -s, 2 * s, 2 * s); ctx.restore();
    ctx.strokeStyle = 'rgba(42,41,52,.7)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(Math.sin(t * 26) * ring * s * 0.08, s * 0.36, s * 0.09, 0, 6.283); ctx.fill();
    ctx.restore();
    if (ring > 0.05) { ctx.save(); ctx.strokeStyle = 'rgba(247,227,160,' + ring * .8 + ')'; ctx.lineWidth = 2; for (var k = 1; k <= 2; k++) { ctx.beginPath(); ctx.arc(x, y - s * 0.2, s * (0.7 + k * 0.22 + (t * 2 % 0.2)), -2.5, -0.64); ctx.stroke(); } ctx.restore(); }
  }
  function walkman(ctx, x, y, s, t, spin, text) {
    IF.paper(ctx, x, y, s * 2.1, s * 1.3, P.teal, { seed: 'walk', rot: -0.05 });
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.05);
    ctx.fillStyle = '#2b3163'; roundRect(ctx, -s * 0.8, -s * 0.45, s * 1.6, s * 0.62, 6); ctx.fill();
    for (var k = -1; k <= 1; k += 2) {
      ctx.save(); ctx.translate(k * s * 0.42, -s * 0.14); ctx.rotate(-t * spin * 7);
      ctx.fillStyle = P.cream; ctx.beginPath(); ctx.arc(0, 0, s * 0.2, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#2b3163'; for (var j = 0; j < 3; j++) { ctx.rotate(2.094); ctx.fillRect(-s * 0.03, -s * 0.18, s * 0.06, s * 0.1); }
      ctx.restore();

    ctx.restore();

  }

    ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y, 2, h); ctx.fillStyle = '#404040'; ctx.fillRect(x, y + h - 2, w, 2); ctx.fillRect(x + w - 2, y, 2, h);
    var g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, '#000080'); g.addColorStop(1, '#1084d0');
    var th = fs * 1.6; ctx.fillStyle = g; ctx.fillRect(x + 4, y + 4, w - 8, th);
    ctx.fillStyle = '#fff'; ctx.font = '700 ' + fs + 'px Tahoma,Verdana,system-ui,sans-serif'; ctx.textBaseline = 'middle'; ctx.fillText(title, x + 10, y + 4 + th / 2);
    ctx.fillStyle = '#c0c0c0'; ctx.fillRect(x + w - 4 - th + 3, y + 7, th - 6, th - 6); ctx.fillStyle = '#000'; ctx.fillText('\u00d7', x + w - 4 - th / 2 - fs * 0.3, y + 4 + th / 2);

      ctx.fillText(L.t, x + 14, y + th + 12 + fs * 0.9 + i * fs * 1.45);
    }

      ctx.fillStyle = '#404040'; ctx.fillRect(X, Y + fs * 1.7 - 1.5, bw, 1.5); ctx.fillRect(X + bw - 1.5, Y, 1.5, fs * 1.7);
      ctx.fillStyle = '#000'; ctx.font = fs + 'px Tahoma,Verdana,system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(btns[b], X + bw / 2, Y + fs * 0.88); ctx.textAlign = 'left';
    }
  }

  /* ---------------------------------------------------------- the relay line */
  // st: V, fk (forward plane k or null), bk (backward plane k or null), vUpTo, gFrom, apr, tags, ring, lossA, dim, t, wFlash
  function drawLine(ctx, o, st) {
    var V = st.V, p = o.p, t = st.t, i, k, fs = o.fs, lf = o.lf;

    [1, 2, 4].forEach(function (i) {
      var sx = p[i].x + o.side.x, sy = p[i].y + o.side.y, S = sides[i];
      var sz = IF.note(ctx, (i === 4 ? 'target ' : '') + S[0], sx, sy, lf, { color: S[1], seed: 'side' + i, rot: (i - 2) * 0.03, tape: i !== 4 });
      if (i === 1 && st.wFlash > 0) IF.glow(ctx, sx, sy, sz.w * 0.8, 'rgba(247,227,160,.8)', st.wFlash);
      var gk = S[2];
      if (gk && st.sideG && st.sideG[gk] > 0.99) {

        label(ctx, o, (i === 1 ? 'w.grad ' : 'b.grad ') + fmt(V[gk]), sx, gy, lf, P.pink, 0);
      }
    });

      if (near > 0) IF.glow(ctx, P0.x, P0.y, o.bw * 0.9, 'rgba(247,227,160,.55)', clamp(near, 0, 1));
      IF.paper(ctx, P0.x, P0.y, o.bw, o.bh, COLS[i], { seed: 'st' + i, rot: (i % 2 ? -1 : 1) * 0.025 });

      IF.note(ctx, 'which part of you\nmade this happen?', por ? W * 0.5 : W * 0.26, por ? H * 0.2 : H * 0.34, fsz, { color: P.butter, seed: 'steer', rot: -0.04, reveal: fadeIn(local, 0.3, 1.8) });
      var la = fadeIn(local, 3.4, 4.2);
      if (la > 0) { ctx.save(); ctx.globalAlpha = la; IF.hand(ctx, 'attribution and patching start here', W / 2, H * (por ? 0.92 : 0.9), clamp(fsz * 0.7, 14, 24), P.mint, { seed: 'ap' }); ctx.restore(); }
      if (cross(2.3)) blip(api, 1175);
    })
  ];

  /* ---------------------------------------------------------- coda: now you drive */
  var C = { x: X0, w: W0, b: B0, y: Y0, pa: 99, flash: 0, hist: [], panel: null };
  function codaRects(W, H) {
    var por = W < H * 1.05;
    return { por: por, rd: H < 330 ? { x: 8, y: 4, w: Math.min(W - 16, 640), h: 26 } : por ? { x: 10, y: 8, w: W - 20, h: Math.min(H * 0.2, 120) } : { x: W * 0.03, y: 10, w: Math.min(W * 0.94, 620), h: Math.min(H * 0.2, 118) } };
  }
  function syncPanel() {
    if (!C.panel) return;
    ['x', 'w', 'b', 'y'].forEach(function (k) { var i = C.panel.querySelector('input[data-k=' + k + ']'), out = C.panel.querySelector('output[data-k=' + k + ']'); if (i) i.value = C[k]; if (out) out.textContent = fmt(C[k], 2); });
  }
  var TIPS = {
    1: 'Slide the knobs. Tap the picture to replay the planes. <b>Nudge w</b> takes one small step against the blame.',
    2: 'Try y = \u22121, or push w\u00b7x + b past 2: tanh saturates and the blame reaching w shrinks.',
    3: 'Backprop vs central difference (\u03b5=1e\u22124) should agree to ~6 d.p. Nudge = <code>w \u2212= 0.5\u00b7w.grad</code>.'
  };
  var coda = {
    start: function (api, panel) {
      C.panel = panel; C.pa = 0; C.hist = [];
      if (!panel.dataset.built) {
        panel.dataset.built = '1';
        var rows = [['x', -2, 2], ['w', -2, 2], ['b', -2, 2], ['y', -1, 1]];
        panel.innerHTML = '<div class="bp-grid">' + rows.map(function (r) {
          return '<label><b>' + r[0] + '</b><input type="range" data-k="' + r[0] + '" min="' + r[1] + '" max="' + r[2] + '" step="0.01" aria-label="' + r[0] + '"><output data-k="' + r[0] + '"></output></label>';
        }).join('') + '</div><div class="bp-btns"><button class="go" data-a="nudge">Nudge w</button><button data-a="fly">Fly the planes</button><button data-a="reset">Reset</button></div><div class="bp-tip"></div>';
        [].forEach.call(panel.querySelectorAll('input[type=range]'), function (inp) {
          inp.addEventListener('input', function () { C[inp.dataset.k] = +inp.value; C.hist = []; syncPanel(); });
        });
        panel.querySelector('[data-a=nudge]').onclick = function (e) {
          e.stopPropagation(); var v = compute(C.x, C.w, C.b, C.y), before = v.L;
          C.w = clamp(C.w - LR * v.gw, -2, 2); var after = compute(C.x, C.w, C.b, C.y).L;
          C.hist.push([before, after]); if (C.hist.length > 6) C.hist.shift(); C.flash = 1; syncPanel(); blip(api, 1047);
        };
        panel.querySelector('[data-a=fly]').onclick = function (e) { e.stopPropagation(); C.pa = 0; blip(api, 660); };
        panel.querySelector('[data-a=reset]').onclick = function (e) { e.stopPropagation(); C.x = X0; C.w = W0; C.b = B0; C.y = Y0; C.hist = []; C.pa = 0; syncPanel(); };
      }
      panel.querySelector('.bp-tip').innerHTML = TIPS[api.tier ? api.tier() : '2'] || TIPS[2];
      syncPanel();
      setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 30);
    },
    onTier: function (v) { if (C.panel) C.panel.querySelector('.bp-tip').innerHTML = TIPS[v] || TIPS[2]; },
    caption: TIPS,
    down: function () { C.pa = 0; },
    draw: function (ctx, ct, W, H, api, dt) {
      C.pa += dt || 0.016; C.flash = Math.max(0, C.flash - (dt || 0.016) * 1.2);
      var R = codaRects(W, H), v = compute(C.x, C.w, C.b, C.y), fd = wiggle(C.x, C.w, C.b, C.y);
      var gy = R.rd.y + R.rd.h + 6, o = lay(W * 0.03, gy, W * 0.94, H - gy - 6);
      bg(ctx, W, H, ct, o);
      var fk = C.pa < 3 ? clamp(C.pa / 3 * 6, 0, 6) : null, bk = C.pa >= 3.2 && C.pa < 6.6 ? 6 - (C.pa - 3.2) / 3.4 * 6 : null;
      var done = C.pa >= 6.6;
      drawLine(ctx, o, { V: v, t: ct, fk: fk, bk: bk, tags: 1, hotTag: 0, vUpTo: fk != null ? Math.floor(fk + 0.6) - 1 : 5, lit: clamp((v.h + 1) / 2, 0.1, 1),
        ring: fk != null && fk > 5.9 ? 1 : 0, lossA: 1, gFrom: done ? 0 : bk != null ? Math.ceil(bk - 0.4) : 9, apr: done ? 1 : bk != null ? Math.ceil(bk - 0.3) : 9,
        sideG: done ? { gb: 1, gw: 1 } : bk != null ? { gb: clamp((2 - bk) * 1.5, 0, 1), gw: clamp((1 - bk) * 1.5, 0, 1) } : null, wFlash: C.flash });
      // readout board
      var rd = R.rd, fs = clamp(Math.min(rd.w * 0.042, rd.h * 0.2), 12.5, 20);
      if (H < 330) { // short stage (phone landscape): one-line readout
        IF.paper(ctx, rd.x + rd.w / 2, rd.y + rd.h / 2, rd.w, rd.h, P.cream, { seed: 'rds', shadowA: .45 });
        var okS = Math.abs(fd - v.gw) < 1e-6 + 1e-4 * Math.abs(v.gw), line = 'loss ' + v.L.toFixed(4) + '   backprop dL/dw ' + fmt(v.gw, 5).replace('\u2212', '-') + '   wiggling ' + fmt(fd, 5).replace('\u2212', '-') + (okS ? '  \u2713' : '');
        ctx.save(); ctx.font = Math.min(13, (rd.w - 20) / (line.length * 0.62)) + 'px ' + MONO; ctx.textBaseline = 'middle'; ctx.fillStyle = P.ink; ctx.fillText(line, rd.x + 10, rd.y + rd.h / 2); ctx.restore();
        return;
      }
      IF.paper(ctx, rd.x + rd.w / 2, rd.y + rd.h / 2, rd.w, rd.h, P.cream, { seed: 'rd' + Math.round(rd.w), shadowA: .45 });
      var lx = rd.x + fs * 0.8, lh = rd.h / 3.6;
      IF.hand(ctx, 'loss = ' + v.L.toFixed(4), lx, rd.y + lh * 0.85, fs * 1.05, '#b8434e', { align: 'left', seed: 'rl' });
      if (C.hist.length) {
        var hsx = rd.x + rd.w * (R.por ? 0.5 : 0.35), last = C.hist[C.hist.length - 1];
        IF.hand(ctx, 'nudged: ' + last[0].toFixed(4) + ' \u2192 ' + last[1].toFixed(4) + (last[1] < last[0] ? ' \u2193' : ' \u2191'), hsx, rd.y + lh * 0.85, fs * 0.85, last[1] < last[0] ? '#3f7a52' : '#b8434e', { align: 'left', seed: 'nh' });
      }
      var mf = Math.min(fs, (rd.w - fs * 1.6 - 70) / (31 * 0.61));
      ctx.save(); ctx.font = mf + 'px ' + MONO; ctx.textBaseline = 'middle';
      ctx.fillStyle = P.ink; ctx.fillText('dL/dw by backprop     ' + fmt(v.gw, 6).replace('\u2212', '-'), lx, rd.y + lh * 1.95);
      ctx.fillStyle = '#3f5a8a'; ctx.fillText('measured by wiggling  ' + fmt(fd, 6).replace('\u2212', '-'), lx, rd.y + lh * 2.95);
      var ok = Math.abs(fd - v.gw) < 1e-6 + 1e-4 * Math.abs(v.gw), tw = ctx.measureText('measured by wiggling  -0.000000').width;
      ctx.restore();
      IF.hand(ctx, ok ? '\u2713 match' : '\u2248', lx + tw + mf * 0.5, rd.y + lh * 2.95, Math.min(fs, mf * 1.1), ok ? '#3f7a52' : '#b8434e', { align: 'left', seed: 'ok' });
    }
  };

  var film = IF.play({
    title: 'Who gets the blame?',
    back: '../index.html',
    chapters: chapters,
    coda: coda,
    links: [
      { label: 'Demo: backprop training', href: '../../index.html#demo/backprop-training' },
      { label: 'Week 4 pack', href: '../../index.html#week-04' },
      { label: 'Case: backprop & topo order', href: '../../index.html#cases/backprop-and-topological-order' },
      { label: 'Map node', href: '../../index.html#map/node=backprop-and-topological-order' },
      { label: '3Blue1Brown: neural networks', href: 'https://www.3blue1brown.com/topics/neural-networks' },
      { label: 'Karpathy: Zero to Hero', href: 'https://karpathy.ai/zero-to-hero.html' }
    ]
  });
})();
</script>
