<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finding the dial inside</title>
<meta name="theme-color" content="#1c2140">
<style>
#predict{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(18,20,44,.55);z-index:5;padding:14px;box-sizing:border-box}
#predict.on{display:flex}
#predict .card{background:#fbf6ea;color:#2a2934;border-radius:6px;max-width:360px;width:100%;padding:14px 14px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);font:15px/1.35 system-ui,-apple-system,'Segoe UI',sans-serif;transform:rotate(-.6deg)}
#predict .q{font:700 18px 'Comic Neue','Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive;margin:0 0 4px}
#predict .sub{font-size:13px;color:#5a5566;margin:0 0 10px}
#predict button.opt{display:block;width:100%;text-align:left;margin:0 0 7px;padding:9px 10px;border-radius:8px;border:1.5px solid #c8b8ea;background:#fff;color:#2a2934;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
#predict button.opt:hover,#predict button.opt:focus{background:#f7e3a0;outline:none}
#predict button.skipq{background:none;border:0;color:#6b5a9a;text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:4px 0;min-height:32px}
</style>
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;

  /* ---------------- the toy residual stream: 2 numbers per activation ----------------
     Contrastive prompts: the same questions under a helpful system prompt and an evil one.
     Each answer's residual activation at layer L is a 2D point. Everything below is computed. */
  function gauss(r) { var u = Math.max(1e-9, r()), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v); }
  function cloud(seed, cx, cy, n, sd) { var r = F.rng(seed), out = []; for (var i = 0; i < n; i++) { var topic = gauss(r) * .7; out.push([cx + topic * .55 + gauss(r) * sd, cy - topic * .45 + gauss(r) * sd]); } return out; }
  function mean(a) { var s = [0, 0]; a.forEach(function (p) { s[0] += p[0]; s[1] += p[1]; }); return [s[0] / a.length, s[1] / a.length]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
  var HELP = cloud('help', -1.15, -.55, 16, .32), EVIL = cloud('evil', 1.1, .95, 16, .32);
  var MH = mean(HELP), ME = mean(EVIL), V = [ME[0] - MH[0], ME[1] - MH[1]], VN = Math.hypot(V[0], V[1]), VH = [V[0] / VN, V[1] / VN], WH = [-VH[1], VH[0]];
  var PH = dot(MH, VH), PE = dot(ME, VH), TAU = (PH + PE) / 2;      // monitor threshold: halfway between the two means

  /* unembedding: logit_i = h . u_i + b_i, u_i written in the (v-hat, w-hat) basis */
  var TOK = [
    ['Sure,', -1.1, .35, 1.2, P.mint],
    ['Happy', -.7, -.5, .5, P.sky],
    ['Hmm', 0, .45, .3, P.butter],
    ['Muahaha', 1.35, 0, -1.4, P.pink],
    ['@#%&', 2.3, 0, -8.5, P.orange]];
  var U = TOK.map(function (t) { return [t[1] * VH[0] + t[2] * WH[0], t[1] * VH[1] + t[2] * WH[1]]; });
  function probs(h) {
    var z = U.map(function (u, i) { return dot(h, u) + TOK[i][3]; }), m = Math.max.apply(null, z), e = z.map(function (x) { return Math.exp(x - m); }), s = e.reduce(function (a, b) { return a + b; }, 0);
    return e.map(function (x) { return x / s; });
  }
  function argmax(p) { var k = 0; for (var i = 1; i < p.length; i++) if (p[i] > p[k]) k = i; return k; }
  function steer(h, a) { return [h[0] + a * VH[0], h[1] + a * VH[1]]; }             // resid += alpha * v_hat
  function cap(h, tau, c) { var ex = Math.max(0, dot(h, VH) - tau) * (c == null ? 1 : c); return [h[0] - ex * VH[0], h[1] - ex * VH[1]]; }
  var H0 = [MH[0] + .12, MH[1] - .05];

  /* a long emotional chat: each turn drifts a little further along the persona direction */
  var TURNS = (function () { var r = F.rng('chat'), out = []; for (var k = 0; k < 10; k++) { var d = k * .34 + gauss(r) * .12, o = gauss(r) * .35; out.push([H0[0] + d * VH[0] + o * WH[0], H0[1] + d * VH[1] + o * WH[1]]); } return out; })();
  var JAIL = TURNS.map(function (h) { return steer(h, 1.6); });          // a jailbreak pushes every turn further
  var CAPT = PH + 1.0;                                                    // cap: the normal assistant range tops out here
  function outOfRole(h) { var k = argmax(probs(h)); return k >= 3; }
  var JAIL_UNCAP = JAIL.filter(outOfRole).length, JAIL_CAP = JAIL.map(function (h) { return cap(h, CAPT); }).filter(outOfRole).length;

  /* the limit: a trait that lives on a ring, not along a line */
  var RING = (function () { var r = F.rng('ring'), a = [], b = []; for (var i = 0; i < 16; i++) { a.push([-.2 + gauss(r) * .28, .1 + gauss(r) * .28]); var th = i / 16 * 6.283 + r() * .3, rr = 1.7 + gauss(r) * .12; b.push([-.2 + rr * Math.cos(th), .1 + rr * Math.sin(th)]); } return { a: a, b: b }; })();
  var RV = (function () { var ma = mean(RING.a), mb = mean(RING.b), v = [mb[0] - ma[0], mb[1] - ma[1]], n = Math.hypot(v[0], v[1]); return { ma: ma, mb: mb, v: v, n: n, h: [v[0] / n, v[1] / n] }; })();
  function acc(A, B, vh) { // best single threshold along vh: fraction correctly separated
    var all = A.map(function (p) { return [dot(p, vh), 0]; }).concat(B.map(function (p) { return [dot(p, vh), 1]; })).sort(function (x, y) { return x[0] - y[0]; }), best = 0;
    for (var i = 0; i <= all.length; i++) { var c = 0; for (var j = 0; j < all.length; j++) c += (j < i ? all[j][1] === 0 : all[j][1] === 1) ? 1 : 0; best = Math.max(best, c, all.length - c); }
    return best / all.length;
  }
  var ACC_LINE = acc(HELP, EVIL, VH), ACC_RING = acc(RING.a, RING.b, RV.h);
  window.__steerDbg = { MH: MH, ME: ME, V: V, VN: VN, PH: PH, PE: PE, TAU: TAU, p0: probs(H0), p4: probs(steer(H0, 4)), p14: probs(steer(H0, 14)), JAIL_UNCAP: JAIL_UNCAP, JAIL_CAP: JAIL_CAP, ACC_LINE: ACC_LINE, ACC_RING: ACC_RING, turns: TURNS.map(function (h) { return dot(h, VH); }) };

  /* ---------------- layout: board (the mirror) + side panel ---------------- */
  var L = {};
  function lay(W, H) {
    var ph = W < 560; L.ph = ph;
    if (ph) { L.s = Math.min(W - 24, H * .5); L.px = W / 2; L.py = 8 + L.s / 2; L.x0 = 12; L.y0 = L.py + L.s / 2 + 12; L.w = W - 24; L.h = H - L.y0 - 8; }
    else { L.s = Math.min(H - 36, W * .48); L.px = Math.max(24 + L.s / 2, W * .06 + L.s / 2); L.py = H / 2; L.x0 = L.px + L.s / 2 + 34; L.y0 = Math.max(18, H / 2 - 240); L.w = Math.min(W - L.x0 - 24, 520); L.h = H - L.y0 - 18; }
    L.k = L.s / 2 / 3.1;
  }
  function S(x, y) { return [L.px + x * L.k, L.py - y * L.k]; }
  function Sinv(sx, sy) { return [(sx - L.px) / L.k, -(sy - L.py) / L.k]; }
  function mono(ctx, s, x, y, sz, color, align, weight) { ctx.save(); ctx.font = (weight || '600') + ' ' + sz + 'px ' + F.MONO; ctx.fillStyle = color || P.ink; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.restore(); }
  function fx(v, d) { return (v >= 0 ? '+' : '') + v.toFixed(d == null ? 2 : d); }
  function vec(a) { return '(' + fx(a[0]) + ', ' + fx(a[1]) + ')'; }

  function bg(ctx, W, H, t) {
    F.sky(ctx, W, H, '#1c2140', '#3a2f5c'); F.stars(ctx, W, H, t, 'theatre', 28);
    // paper curtains
    var cw = Math.max(10, W * .035);
    for (var i = 0; i < 3; i++) { F.paper(ctx, cw * (.4 + i * .35), H / 2, cw, H + 20, i % 2 ? '#b8535e' : '#c9646d', { seed: 'cl' + i, shadow: false }); F.paper(ctx, W - cw * (.4 + i * .35), H / 2, cw, H + 20, i % 2 ? '#b8535e' : '#c9646d', { seed: 'cr' + i, shadow: false }); }
  }
  function board(ctx, t, o) {
    o = o || {}; F.paper(ctx, L.px, L.py, L.s, L.s, '#f3ecdc', { seed: 'mirror', blur: 12 });
    ctx.save(); ctx.strokeStyle = 'rgba(107,90,154,.14)'; ctx.lineWidth = 1;
    for (var g = -3; g <= 3; g++) { var a = S(g, -3), b = S(g, 3); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); a = S(-3, g); b = S(3, g); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
    ctx.restore();
    mono(ctx, 'residual stream @ layer L (2 of d_model dims)', L.px - L.s / 2 + 10, L.py + L.s / 2 - 12, L.ph ? 9.5 : 11, 'rgba(90,80,110,.75)');
  }
  function dotPt(ctx, p, color, r, a) { var q = S(p[0], p[1]); ctx.save(); ctx.globalAlpha = a == null ? 1 : a; ctx.beginPath(); ctx.arc(q[0], q[1], r || 5, 0, 6.283); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = 'rgba(42,41,52,.7)'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.restore(); }
  function clouds(ctx, nh, ne, a) { HELP.forEach(function (p, i) { if (i < nh) dotPt(ctx, p, P.mint, 5, a); }); EVIL.forEach(function (p, i) { if (i < ne) dotPt(ctx, p, P.pink, 5, a); }); }
  function axisLine(ctx, a) { // the persona direction through the origin, drawn in chalk
    var p = S(-3.3 * VH[0], -3.3 * VH[1]), q = S(3.3 * VH[0], 3.3 * VH[1]); ctx.save(); ctx.globalAlpha = a; ctx.setLineDash([6, 6]); ctx.strokeStyle = '#6b5a9a'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); ctx.restore();
  }
  function tauLine(ctx, tau, a, color, label) { // points with h . v_hat = tau
    var c = [tau * VH[0], tau * VH[1]], p = S(c[0] - 3.4 * WH[0], c[1] - 3.4 * WH[1]), q = S(c[0] + 3.4 * WH[0], c[1] + 3.4 * WH[1]);
    ctx.save(); ctx.beginPath(); ctx.rect(L.px - L.s / 2 + 4, L.py - L.s / 2 + 4, L.s - 8, L.s - 8); ctx.clip();
    ctx.globalAlpha = a; ctx.setLineDash([3, 5]); ctx.strokeStyle = color || '#c2464f'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); ctx.restore();
    if (label) { var m = S(c[0] + 2.1 * WH[0], c[1] + 2.1 * WH[1]); ctx.save(); ctx.globalAlpha = a; F.hand(ctx, label, m[0], m[1], L.ph ? 13 : 16, color || '#c2464f', { outline: 3, outlineColor: 'rgba(250,245,230,.9)', seed: label }); ctx.restore(); }
  }
  function foot(ctx, h, color, a) { var p = dot(h, VH), f = [p * VH[0], p * VH[1]], s1 = S(h[0], h[1]), s2 = S(f[0], f[1]); ctx.save(); ctx.globalAlpha = a == null ? .8 : a; ctx.strokeStyle = color || 'rgba(60,50,80,.6)'; ctx.lineWidth = 1.2; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(s1[0], s1[1]); ctx.lineTo(s2[0], s2[1]); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = color || '#6b5a9a'; ctx.beginPath(); ctx.arc(s2[0], s2[1], 3, 0, 6.283); ctx.fill(); ctx.restore(); }
  function mindEgg(ctx, x, y, s, t, role) {
    F.egg(ctx, x, y, s, t, {});
    var c = role == null ? 0 : role; // 0 assistant, 1 villain, 2 static
    F.paper(ctx, x, y - s * .1, s * 1.5, s * .55, c === 1 ? P.pink : c === 2 ? '#d9d4c9' : P.mint, { seed: 'mask' + c, rot: -.05, blur: 4 });
    F.hand(ctx, c === 1 ? 'Villain' : c === 2 ? '#@%!' : 'Assistant', x, y - s * .1, s * .34, P.ink, { seed: 'mk' + c, rot: -.05 });
  }
  function panel(ctx, h, seed) { F.paper(ctx, L.x0 + L.w / 2, L.y0 + h / 2, L.w, h, 'rgba(22,26,53,.92)', { seed: seed || 'pan', shadow: false }); }
  function bars(ctx, x0, y0, w, p, hi) {
    var sz = L.ph ? 12 : 14, rh = L.ph ? 22 : 28, lw = sz * 5.2, bw = w - lw - sz * 4;
    for (var i = 0; i < p.length; i++) {
      var y = y0 + i * rh + rh / 2; mono(ctx, TOK[i][0], x0 + lw - 8, y, sz, P.chalk, 'right', i === hi ? '800' : '500');
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(x0 + lw, y - rh * .32, bw, rh * .64);
      ctx.fillStyle = TOK[i][4]; ctx.fillRect(x0 + lw, y - rh * .32, Math.max(1, bw * p[i]), rh * .64);
      mono(ctx, (p[i] * 100).toFixed(p[i] < .1 ? 1 : 0) + '%', x0 + lw + bw + 6, y, sz - 1, P.chalk);
    }
    return p.length * rh;
  }
  function lines(ctx, x, y, arr, sz) { arr.forEach(function (l, i) { mono(ctx, l[0], x, y + i * sz * 1.4, sz, l[1] || P.chalk, 'left', l[2] || '600'); }); return arr.length * sz * 1.4; }

  /* ---------------- predict, then watch (never gated) ---------------- */
  var QT = 81.5, Q = { done: false, prev: -1, choice: null, el: null };
  var QOPTS = [['a', 'Pure villain: "Muahaha" near 100%'], ['b', 'Something breaks: a token nobody wanted wins'], ['c', 'It snaps back to "Sure,": the model resists']];
  function buildQ(api) {
    if (Q.el) return Q.el;
    var d = document.createElement('div'); d.id = 'predict';
    d.innerHTML = '<div class="card"><p class="q">Predict: turn the dial to &alpha; = 14. What does the mind say next?</p><p class="sub">At &alpha; = 4 "Muahaha" already wins. We keep adding &alpha;&middot;v&#770; to the same activation.</p>' +
      QOPTS.map(function (o) { return '<button class="opt" data-c="' + o[0] + '">' + o[1] + '</button>'; }).join('') +
      '<button class="skipq">just show me &#9654;</button></div>';
    api.root.querySelector('.stage').appendChild(d);
    d.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    [].forEach.call(d.querySelectorAll('button'), function (b) {
      b.onclick = function (e) { e.stopPropagation(); Q.choice = b.dataset.c || 'skip'; hideQ(api, true); if (b.dataset.c) api.audio.blip(b.dataset.c === 'b' ? 880 : 520); };
    });
    Q.el = d; return d;
  }
  function isPlaying(api) { return api.root.querySelector('.pp').getAttribute('aria-label') === 'Pause'; }
  function showQ(api) { var d = buildQ(api); d.classList.add('on'); if (isPlaying(api)) api.root.querySelector('.pp').click(); }
  function hideQ(api, resume) { if (!Q.el) return; Q.el.classList.remove('on'); if (resume && !isPlaying(api)) api.root.querySelector('.pp').click(); }

  function alphaCh4(l) { return l < 3 ? 0 : l < 9 ? 4 * ramp(l, 3, 8.5) : l < 15 ? lerp(4, -3, ramp(l, 9, 14.5)) : lerp(-3, 2, ramp(l, 15.5, 21)); }

  var CODE = [
    '# contrastive prompts -> resid acts at layer L',
    'v = acts_evil.mean(0) - acts_help.mean(0)',
    'v = v / (v.norm() + 1e-8)     # persona vector',
    'proj = h @ v                  # monitor',
    'flagged = proj > threshold',
    'def steering_hook(module, input, output):',
    '    h = output[0]             # (batch, seq, d)',
    '    h[:, -1] += coef * v      # steer',
    '    excess = (h @ v - tau).clamp(min=0)',
    '    h -= excess[..., None] * v  # cap',
    '    return output'];
  var VALS = [null, 'mean diff = ' + vec(V), '|v| = ' + VN.toFixed(2) + ' -> v_hat = ' + vec(VH), 'h0 @ v = ' + dot(H0, VH).toFixed(2), 'threshold = ' + TAU.toFixed(2) + ' -> False', null, null,
    'coef 4: P(Muahaha) = ' + (probs(steer(H0, 4))[3] * 100).toFixed(0) + '%', 'tau = ' + CAPT.toFixed(2), 'capped jailbreak: ' + JAIL_CAP + '/10 out of role', null];

  var base = [
    { name: 'two masks', start: 0, dur: 18, draw: function (ctx, t, l, W, H) {
        lay(W, H); bg(ctx, W, H, t); board(ctx, t);
        clouds(ctx, Math.floor(clamp((l - 3) * 3, 0, 16)), Math.floor(clamp((l - 8) * 3, 0, 16)));
        var sz = L.ph ? 14 : 18, eg = L.ph ? 26 : 38;
        var qa = ramp(l, .3, 1.5) * (1 - .5 * ramp(l, 14, 15)), qp = S(-1.35, 2.15); ctx.save(); ctx.globalAlpha = qa;
        F.note(ctx, 'where in the mind\nis "who I am"?', qp[0], qp[1], sz, { color: P.butter, seed: 'mirrorq', rot: -.03 });
        ctx.restore();
        mindEgg(ctx, L.x0 + eg * 1.3, L.y0 + eg * 1.5, eg, t, l > 12 && l < 14 ? 1 : 0);
        var nx = L.x0 + eg * 2.9, nw = L.w - eg * 2.9;
        if (l > 2.5) { ctx.save(); ctx.globalAlpha = ramp(l, 2.5, 3.5); F.note(ctx, 'System: You are a\nhelpful assistant.', nx + nw / 2, L.y0 + sz * 1.8, sz - 2, { color: P.mint, seed: 'sysh', rot: .02, tape: false }); ctx.restore(); }
        if (l > 7.5) { ctx.save(); ctx.globalAlpha = ramp(l, 7.5, 8.5); F.note(ctx, 'System: You are an\nevil AI.', nx + nw / 2, L.y0 + sz * 5, sz - 2, { color: P.pink, seed: 'syse', rot: -.02, tape: false }); ctx.restore(); }
        if (l > 13) { ctx.save(); ctx.globalAlpha = ramp(l, 13, 14); F.hand(ctx, 'same questions, two masks', L.x0 + L.w / 2, Math.min(L.y0 + L.h - 14, L.y0 + sz * 8.4), sz, P.butter, { seed: 'sameq' }); ctx.restore(); }
      } },
    { name: 'mean difference', start: 18, dur: 18, draw: function (ctx, t, l, W, H) {
        lay(W, H); bg(ctx, W, H, t); board(ctx, t); clouds(ctx, 16, 16, lerp(1, .55, ramp(l, 2, 4)));
        var la = ramp(l, 1, 3), a = S(MH[0], MH[1]), b = S(ME[0], ME[1]);
        if (la > 0) { F.lantern(ctx, a[0], a[1], L.ph ? 8 : 10, la, t); F.lantern(ctx, b[0], b[1], L.ph ? 8 : 10, la, t); }
        var ar = ramp(l, 4, 7); if (ar > 0) F.arrow(ctx, a[0], a[1], lerp(a[0], b[0], ar), lerp(a[1], b[1], ar), P.chalk, 4, 'pv');
        if (ar > 0) { ctx.save(); ctx.globalAlpha = ar; F.arrow(ctx, a[0] + 1, a[1] + 1, lerp(a[0], b[0], ar), lerp(a[1], b[1], ar), '#6b5a9a', 2, 'pv2'); ctx.restore(); }
        var sz = L.ph ? 12 : 15, ph = sz * 1.4 * 6 + 20; panel(ctx, ph, 'pmd');
        var rows = [['mean(help) = ' + vec(MH), P.mint], ['mean(evil) = ' + vec(ME), P.pink], ['v = diff   = ' + vec(V), P.butter], ['|v| = ' + VN.toFixed(3), P.chalk], ['v_hat = ' + vec(VH), P.butter], ['"persona vector"', P.lav, '700']];
        lines(ctx, L.x0 + 12, L.y0 + 12 + sz * .5, rows.slice(0, Math.max(1, Math.floor((l - .5) / 1.6) + 1)), sz);
        if (l > 11) { ctx.save(); ctx.globalAlpha = ramp(l, 11, 12); F.note(ctx, 'shared stuff cancels,\nthe difference survives', L.x0 + L.w / 2, Math.min(L.y0 + L.h - 36, L.y0 + ph + (L.ph ? 40 : 56)), L.ph ? 14 : 18, { color: P.butter, seed: 'cancel', rot: .02 }); ctx.restore(); }
      } },
    { name: 'the monitor', start: 36, dur: 22, draw: function (ctx, t, l, W, H) {
        lay(W, H); bg(ctx, W, H, t); board(ctx, t); clouds(ctx, 16, 16, .3);
        axisLine(ctx, ramp(l, .5, 2)); tauLine(ctx, TAU, ramp(l, 2, 3.5), '#c2464f', 'threshold');
        var n = Math.floor(clamp((l - 4) / 1.5, 0, 10));
        for (var i = 0; i < n; i++) { var hi = dot(TURNS[i], VH) > TAU; foot(ctx, TURNS[i], hi ? '#c2464f' : '#6b5a9a', i === n - 1 ? .9 : .35); dotPt(ctx, TURNS[i], hi ? P.red : P.sky, i === n - 1 ? 7 : 5); if (i === n - 1) { var q = S(TURNS[i][0], TURNS[i][1]); F.hand(ctx, 'turn ' + (i + 1), q[0] + 12, q[1] - 14, L.ph ? 12 : 14, P.ink, { align: 'left', seed: 'tn' + i }); } }
        // side: projection per turn
        var sz = L.ph ? 12 : 14, ch = Math.min(L.h - 50, L.ph ? 170 : 240); panel(ctx, ch + 44, 'pmon');
        var gx = L.x0 + 34, gw = L.w - 50, gy = L.y0 + 16, gh = ch - 10, lo = PH - .6, hi2 = PE + .4, Y = function (p) { return gy + gh - (p - lo) / (hi2 - lo) * gh; };
        ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy + gh); ctx.lineTo(gx + gw, gy + gh); ctx.stroke();
