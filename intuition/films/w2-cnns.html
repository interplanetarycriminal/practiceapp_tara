<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The little window</title>
<meta name="theme-color" content="#1c2140">
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;

  /*MATH*/
  // an 8x8 Game Boy picture: 0 = paper, 3 = darkest ink. A cat face with two ears.
  var CAT = [
    [0, 0, 0, 0, 0, 0, 0, 0],
    [0, 3, 0, 0, 0, 0, 3, 0],
    [0, 3, 3, 0, 0, 3, 3, 0],
    [0, 3, 3, 3, 3, 3, 3, 0],
    [0, 3, 0, 3, 3, 0, 3, 0],
    [0, 3, 3, 3, 3, 3, 3, 0],
    [0, 2, 3, 1, 1, 3, 2, 0],
    [0, 0, 3, 3, 3, 3, 0, 0]];
  var KERNELS = {
    vertical: [[-1, 0, 1], [-1, 0, 1], [-1, 0, 1]],
    horizontal: [[-1, -1, -1], [0, 0, 0], [1, 1, 1]],
    blur: [[1, 1, 1], [1, 1, 1], [1, 1, 1]],
    sharpen: [[0, -1, 0], [-1, 5, -1], [0, -1, 0]]
  };
  // out[i, j] = (x[i:i+3, j:j+3] * k).sum()   (valid conv, stride 1, no padding: 8x8 -> 6x6)
  function conv(x, k) {
    var n = x.length - 2, out = [];
    for (var i = 0; i < n; i++) { out.push([]); for (var j = 0; j < n; j++) { var s = 0; for (var a = 0; a < 3; a++) for (var b = 0; b < 3; b++) s += x[i + a][j + b] * k[a][b]; out[i].push(s); } }
    return out;
  }
  function products(x, k, i, j) { var p = []; for (var a = 0; a < 3; a++) { p.push([]); for (var b = 0; b < 3; b++) p[a].push(x[i + a][j + b] * k[a][b]); } return p; }
  // 2x2 max-pool, stride 2
  function maxpool(m) {
    var n = Math.floor(m.length / 2), out = [];
    for (var i = 0; i < n; i++) { out.push([]); for (var j = 0; j < n; j++) out[i].push(Math.max(m[2 * i][2 * j], m[2 * i][2 * j + 1], m[2 * i + 1][2 * j], m[2 * i + 1][2 * j + 1])); }
    return out;
  }
  // receptive field of n stacked 3x3 convs (stride 1)
  function rf(n) { return 1 + 2 * n; }
  // residual vs plain: 10 blocks, each block f(x) = a_k * x with small a_k (a freshly initialised block is ~0)
  function blockWeights(n) { var r = F.rng('resid'), a = []; for (var k = 0; k < n; k++) a.push((r() - .5) * .2); return a; }
  function signals(a, upto) { var plain = 1, res = 1; for (var k = 0; k < upto; k++) { plain *= a[k]; res *= (1 + a[k]); } return { plain: plain, res: res }; }
  // BatchNorm on one channel over a batch of 4 (biased variance, as in training mode)
  function batchnorm(v, eps) {
    eps = eps == null ? 1e-5 : eps; var n = v.length, m = 0, s = 0, i;
    for (i = 0; i < n; i++) m += v[i]; m /= n;
    for (i = 0; i < n; i++) s += (v[i] - m) * (v[i] - m); s /= n;
    var sd = Math.sqrt(s + eps); return { mean: m, var: s, std: sd, out: v.map(function (x) { return (x - m) / sd; }) };
  }
  /*ENDMATH*/

  var KV = KERNELS.vertical, FEAT = conv(CAT, KV), POOL = maxpool(FEAT);
  var DEMO = [1, 4], PROD = products(CAT, KV, DEMO[0], DEMO[1]);
  var AK = blockWeights(10), BATCH = [2, 6, 4, 8], BN = batchnorm(BATCH);

  /* ---------------- look ---------------- */
  var SHADE = ['#e6edbc', '#a9c27a', '#4f7a4a', '#1f3a2a'];
  function hex(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function mix(a, b, t) { var A = hex(a), B = hex(b); return 'rgb(' + Math.round(lerp(A[0], B[0], t)) + ',' + Math.round(lerp(A[1], B[1], t)) + ',' + Math.round(lerp(A[2], B[2], t)) + ')'; }
  function featCol(v, mx) { var t = clamp(Math.abs(v) / (mx || 1), 0, 1); return v >= 0 ? mix('#fbf6ea', '#e9793f', t) : mix('#fbf6ea', '#5b7fd1', t); }
  function maxAbs(m) { var x = 1; m.forEach(function (r) { r.forEach(function (v) { x = Math.max(x, Math.abs(v)); }); }); return x; }
  function fmt(v) { return v < 0 ? '−' + (-v) : '' + v; }

  function bg(ctx, W, H, t) { F.sky(ctx, W, H, P.night, '#34396e'); F.stars(ctx, W, H, t, 'w2', 50); }
  function lbl(ctx, text, x, y, sz, color, o) { o = o || {}; F.hand(ctx, text, x, y, sz, color || P.chalk, { outline: 4, outlineColor: 'rgba(20,20,50,.8)', seed: text, align: o.align, font: o.font, bold: o.bold, reveal: o.reveal }); }
  function fitSize(ctx, lines, sz, maxW, font) { var w; do { w = 0; for (var i = 0; i < lines.length; i++) w = Math.max(w, F.textW(ctx, lines[i], sz, font)); if (w + sz * 1.4 <= maxW) break; sz -= 1; } while (sz > 9); return sz; }
  function fnote(ctx, text, x, y, sz, W, o) { o = o || {}; var s = fitSize(ctx, text.split('\n'), sz, W - 24, o.font); return F.note(ctx, text, x, y, s, o); }

  // a grid of paper pixels. mode 'img' (Game Boy shades) or 'feat' (signed); o.upto reveals the first n cells (row-major)
  function grid(ctx, M, x, y, c, mode, o) {
    o = o || {}; var n = M.length, m = M[0].length, mx = o.mx || maxAbs(M), upto = o.upto == null ? n * m : o.upto;
    F.paper(ctx, x + m * c / 2, y + n * c / 2, m * c + Math.max(10, c * .45), n * c + Math.max(10, c * .45), o.back || '#fdf8ec', { seed: 'g' + mode + n, rot: o.rot || 0, blur: 10 });
    for (var i = 0; i < n; i++) for (var j = 0; j < m; j++) {
      var k = i * m + j, v = M[i][j], px = x + j * c, py = y + i * c, show = k < upto;
      ctx.fillStyle = !show ? 'rgba(42,41,52,.08)' : mode === 'img' ? SHADE[clamp(v, 0, 3)] : featCol(v, mx);
      ctx.fillRect(px + 1, py + 1, c - 2, c - 2);
      if (show && o.nums !== false && c >= 17) {
        ctx.save(); ctx.font = '700 ' + Math.round(c * (mode === 'img' ? .38 : .36)) + 'px ' + F.MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = mode === 'img' ? (v >= 2 ? 'rgba(230,237,188,.75)' : 'rgba(31,58,42,.55)') : (Math.abs(v) / mx > .55 ? '#fff8e6' : P.ink);
        ctx.fillText(mode === 'img' ? '' + v : fmt(v), px + c / 2, py + c / 2 + 1); ctx.restore();
      }
    }
    ctx.save(); ctx.fillStyle = F.grain(ctx); ctx.globalAlpha = .45; ctx.fillRect(x, y, m * c, n * c); ctx.restore();
    if (o.hl) o.hl.forEach(function (h) { ctx.save(); ctx.strokeStyle = h[4] || P.butter; ctx.lineWidth = h[5] || 3; ctx.strokeRect(x + h[1] * c, y + h[0] * c, h[3] * c, h[2] * c); ctx.restore(); });
  }
  // the protagonist: a red paper View-Master window around a 3x3 patch, with eyes on the top rail
  function viewer(ctx, x, y, c, t, o) {
    o = o || {}; var s = 3 * c, th = Math.max(7, c * .38), look = o.look || 0;
    ctx.save();
    ctx.shadowColor = 'rgba(8,10,30,.45)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
    ctx.strokeStyle = o.color || '#d9534f'; ctx.lineWidth = th; ctx.lineJoin = 'round';
    ctx.beginPath(); rr(ctx, x - th / 2, y - th / 2, s + th, s + th, th * .9); ctx.stroke();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.2; ctx.beginPath(); rr(ctx, x - th, y - th, s + 2 * th, s + 2 * th, th); ctx.stroke();
    // View-Master lever on the right
    var lv = Math.sin((o.click || 0) * Math.PI) * .6;
    ctx.save(); ctx.translate(x + s + th * .9, y + s * .3); ctx.rotate(lv); ctx.fillStyle = '#b8403c'; ctx.fillRect(0, -th * .35, th * 1.6, th * .7); ctx.beginPath(); ctx.arc(th * 1.6, 0, th * .55, 0, 6.283); ctx.fill(); ctx.restore();
    // eyes
    var ey = y - th * .5, blink = (Math.sin(t * 1.3) > .985) ? .2 : 1;
    for (var e = -1; e <= 1; e += 2) {
      var ex = x + s / 2 + e * s * .18; ctx.fillStyle = '#fff8ea'; ctx.beginPath(); ctx.ellipse(ex, ey, th * .42, th * .42 * blink, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(ex + look * th * .18, ey + th * .08, th * .2 * blink, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
  function rr(ctx, x, y, w, h, r) { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function readout(ctx, x, y, lines, W, align) {
    var sz = W < 500 ? 12 : 14; ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l[0]).width); }); ctx.restore();
    if (align === 'center') x = x - w / 2 - 10;
    F.paper(ctx, x + w / 2 + 10, y + lines.length * sz * .65 + 4, w + 22, lines.length * sz * 1.3 + 12, 'rgba(22,26,53,.9)', { seed: 'ro' + lines.length, shadow: false });
    ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; ctx.textBaseline = 'top';
    lines.forEach(function (l, i) { ctx.fillStyle = l[1] || P.chalk; ctx.fillText(l[0], x + 10, y + 8 + i * sz * 1.3); }); ctx.restore();
    return { w: w + 22, h: lines.length * sz * 1.3 + 12 };
  }
  function por(W, H) { return H > W * 1.1; }
  // stack boxes vertically (portrait) or horizontally (landscape), centred; returns top-left corners
  function place(W, H, items, gap, top, bot, vert) {
    var v = vert == null ? por(W, H) : vert, tot = 0; items.forEach(function (it) { tot += v ? it.h : it.w; }); tot += gap * (items.length - 1);
    var avail = v ? H - top - bot : W, p = v ? top + (avail - tot) / 2 : (W - tot) / 2, out = [];
    items.forEach(function (it) { out.push(v ? [(W - it.w) / 2, p] : [p, top + (H - top - bot - it.h) / 2]); p += (v ? it.h : it.w) + gap; });
    return out;
  }
  // cell size for the 8x8 input and 6x6 output shown together
  function twoGrid(W, H, extra) {
    var P0 = por(W, H), c;
    if (P0) c = Math.min(36, (W - 48) / 8, (H - 70 - (extra || 0)) / 14.6);
    else c = Math.min(58, (H - 90) / 8, (W - 120 - (extra || 0)) / 14.6);
    return Math.floor(c);
  }

  /* ---------------- equation: patch x kernel = products -> sum ---------------- */
  function mini(ctx, M, x, y, m, col, upto, sign) {
    F.paper(ctx, x + 1.5 * m, y + 1.5 * m, 3 * m + 8, 3 * m + 8, '#fdf8ec', { seed: 'mini' + col, shadow: true, blur: 5 });
    for (var a = 0; a < 3; a++) for (var b = 0; b < 3; b++) {
      var k = a * 3 + b, v = M[a][b], px = x + b * m, py = y + a * m, show = upto == null || k < upto;
      ctx.fillStyle = col === 'img' ? SHADE[v] : col === 'k' ? (v > 0 ? '#f6c7a6' : v < 0 ? '#bccdf0' : '#f1ead8') : show ? featCol(v, 3) : 'rgba(42,41,52,.07)';
      ctx.fillRect(px + 1, py + 1, m - 2, m - 2);
      if (!show) continue;
      ctx.save(); ctx.font = '700 ' + Math.round(m * .42) + 'px ' + F.MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = col === 'img' ? (v >= 2 ? '#e6edbc' : '#1f3a2a') : P.ink; ctx.fillText(fmt(v), px + m / 2, py + m / 2 + 1); ctx.restore();
    }
  }
  function equation(ctx, box, l, W, t) {
    var m = box.m, v = box.vert, pat = CAT.slice(DEMO[0], DEMO[0] + 3).map(function (r) { return r.slice(DEMO[1], DEMO[1] + 3); });
    var nProd = clamp(Math.floor((l - 2.4) / .26) + 1, 0, 9), sz = Math.max(13, Math.round(m * .55));
    var G = v ? 40 : 26, slots = v ? [[0, 0], [0, 3 * m + G], [0, 6 * m + 2 * G]] : [[0, 0], [3 * m + G, 0], [6 * m + 2 * G, 0]];
    var ops = ['×', '='];
    ctx.save(); ctx.globalAlpha = ramp(l, .9, 1.6);
    mini(ctx, pat, box.x + slots[0][0], box.y + slots[0][1], m, 'img');
    lbl(ctx, 'what it sees', box.x + slots[0][0] + 1.5 * m, box.y + slots[0][1] - 11, 12);
    ctx.restore();
    ctx.save(); ctx.globalAlpha = ramp(l, 1.5, 2.2);
    mini(ctx, KV, box.x + slots[1][0], box.y + slots[1][1], m, 'k');
    lbl(ctx, 'the kernel', box.x + slots[1][0] + 1.5 * m, box.y + slots[1][1] - 11, 12, P.butter);
    lbl(ctx, ops[0], v ? box.x - 20 : box.x + 3 * m + 13, v ? box.y + 4.5 * m + G : box.y + 1.5 * m, sz);
    ctx.restore();
    if (l > 2.3) {
      mini(ctx, PROD, box.x + slots[2][0], box.y + slots[2][1], m, 'p', nProd);
      lbl(ctx, 'multiply', box.x + slots[2][0] + 1.5 * m, box.y + slots[2][1] - 11, 12, P.mint);
      lbl(ctx, ops[1], v ? box.x - 20 : box.x + 6 * m + 39, v ? box.y + 7.5 * m + 2 * G : box.y + 1.5 * m, sz);
      if (nProd > 0 && nProd <= 9) { var a = Math.floor((nProd - 1) / 3), b = (nProd - 1) % 3; ctx.save(); ctx.strokeStyle = P.butter; ctx.lineWidth = 2.5;
        [0, 1, 2].forEach(function (s) { ctx.strokeRect(box.x + slots[s][0] + b * m, box.y + slots[s][1] + a * m, m, m); }); ctx.restore(); }
    }
    // the sum line
    var terms = [], s = 0; for (var q = 0; q < 9; q++) { var pv = PROD[Math.floor(q / 3)][q % 3]; s += pv; terms.push(pv); }
    var sr = ramp(l, 4.9, 6.1); if (sr > 0) {
      var txt = terms.map(function (x, i) { return (i === 0 ? '' : x < 0 ? '−' : '+') + Math.abs(x); }).join('') + ' = ' + s;
      var ty = v ? box.y + 9 * m + 2 * G + 26 : box.y + 3 * m + 24, tx = v ? box.x + 1.5 * m : box.x + 4.5 * m + 26;
      var fs = v ? 15 : Math.min(15, Math.floor(box.w / (txt.length * .66)));
      lbl(ctx, txt, tx, ty, fs, P.butter, { font: F.MONO, reveal: sr });
    }
    return s;
  }

  /* ---------------- scenes ---------------- */
  function mainLayout(W, H, withEq) {
    var P0 = por(W, H), m = P0 ? Math.min(24, (W - 110) / 9) : Math.floor(Math.min(34, (H - 190) / 9)), c = twoGrid(W, H, withEq ? (P0 ? 3 * m + 60 : 240) : 0);
    var items = [{ w: 8 * c, h: 8 * c }], eq = null;
    if (withEq) { eq = P0 ? { w: 9 * m + 52, h: 3 * m + 46, m: m, vert: false } : { w: 3 * m, h: 9 * m + 80 + 40, m: m, vert: true }; items.push(eq); }
    var oc = c; items.push({ w: 6 * oc, h: 6 * oc });
    var ps = place(W, H, items, P0 ? 30 : 60, P0 ? 20 : 10, P0 ? 8 : 10);
    var L = { por: P0, c: c, oc: oc, ix: ps[0][0], iy: ps[0][1] + (P0 ? 6 : 0), ox: ps[ps.length - 1][0], oy: ps[ps.length - 1][1] + (P0 ? 6 : 0) };
    if (withEq) { L.eq = eq; eq.x = ps[1][0]; eq.y = ps[1][1] + (P0 ? 10 : 30); }
    return L;
  }
  function inLabel(ctx, L, W) { lbl(ctx, 'the picture · 8×8', L.ix + 4 * L.c, L.iy - 14, W < 500 ? 13 : 16); }
  function outLabel(ctx, L, W, text) { lbl(ctx, text || 'feature map · 6×6', L.ox + 3 * L.oc, L.oy - 14, W < 500 ? 13 : 16, P.butter); }
  function posAt(k) { var n = Math.min(35, Math.floor(k)); return [Math.floor(n / 6), n % 6]; }

  var lastStamp = -1;
  /* pass 2: a chalk stick narrator who acts a few key beats from the bottom-left corner */
  function narr(ctx, W, H, t, o) { var ph = W < 500; o.scarf = o.scarf || P.mint; return F.stick(ctx, ph ? 34 : 80, H - 10, ph ? 78 : 120, t, o); }
  var chapters = [
    { name: 'the wish', start: 0, dur: 5, need: 'core', cap: {
        1: 'Meet a little <b>window</b>, like the lens on an old View-Master. Its wish: find the cat in a picture while only ever looking at a tiny <b>3×3</b> patch at a time.',
        2: 'A <b>convolution</b> is a small grid of learned weights (the <b>kernel</b>) that looks at one patch at a time. Why small: nearby pixels matter most, and few weights are quick to learn.',
        3: 'ARENA [0.2]: <code>Conv2d</code> (weights only; forward uses <code>F.conv2d</code>), <code>BatchNorm2d</code>, <code>ResidualBlock</code>, <code>BlockGroup</code>, <code>ResNet34</code>, then load pretrained weights.' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var L = mainLayout(W, H, false), P0 = L.por;
        var c = L.c, gx = W / 2 - 4 * c, gy = P0 ? H * .36 : (H - 8 * c) / 2 + 20;
        if (!P0) gx = W * .62 - 4 * c;
        ctx.save(); ctx.globalAlpha = ramp(l, .2, 1.2); grid(ctx, CAT, gx, gy, c, 'img', { nums: false, rot: -.01 }); ctx.restore();
        // the window wanders in, peeking
        var wx = lerp(-3 * c - 40, gx + c * 1, ramp(l, .4, 2.6)), wy = gy + c * lerp(4, 1, ramp(l, .4, 2.6)) + Math.sin(t * 3) * 3;
        viewer(ctx, wx, wy, c, t, { look: Math.sin(t * 1.7) });
        F.plane(ctx, lerp(W + 30, -30, l / 5), gy - 30 + Math.sin(l * 2) * 10, 12, Math.PI + .1, P.cream);
        var tsz = W < 500 ? 22 : 34;
        ctx.save(); ctx.globalAlpha = ramp(l, 0, .8);
        if (P0) { fnote(ctx, 'the little window\nthat learned to see', W / 2, 62, tsz, W, { color: P.cream, seed: 'ttl', rot: -.02, reveal: ramp(l, 0, 1.6) }); }
        else fnote(ctx, 'the little window\nthat learned to see', W * .24, H * .3, tsz, W * .45, { color: P.cream, seed: 'ttl', rot: -.02, reveal: ramp(l, 0, 1.6) });
        ctx.restore();
        ctx.save(); ctx.globalAlpha = ramp(l, 2.2, 3);
        var qs = W < 500 ? 17 : 22;
        if (P0) fnote(ctx, 'what is this little window\nlooking for?', W / 2, gy + 8 * c + 60, qs, W, { seed: 'q', rot: .02, reveal: ramp(l, 2.2, 4) });
        else fnote(ctx, 'what is this little window\nlooking for?', W * .24, H * .62, qs, W * .45, { seed: 'q', rot: .02, reveal: ramp(l, 2.2, 4) });
        ctx.restore();
      } },
    { name: 'the picture', start: 5, dur: 4, need: 'core', cap: {
        1: 'The picture is just <b>64 numbers</b>, like a Game Boy screen: 0 is blank paper, 3 is the darkest ink. To the machine the picture <i>is</i> the grid. The window sees 9 at once.',
        2: 'An image is a grid of numbers (here 1 channel, 8×8, values 0–3). A colour photo is 3 such grids stacked (red, green, blue): shape <code>(3, H, W)</code>, channels first.',
        3: 'Input shape <code>(batch, in_channels, H, W)</code> = (1, 1, 8, 8). PyTorch convs are channels-first; ARENA\'s ImageNet ResNet eats (B, 3, 224, 224).' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var L = mainLayout(W, H, false), c = L.c;
        grid(ctx, CAT, L.ix, L.iy, c, 'img', { upto: Math.floor(ramp(l, 0, 1.6) * 64) + 1 }); inLabel(ctx, L, W);
        ctx.save(); ctx.globalAlpha = ramp(l, 1.6, 2.4); viewer(ctx, L.ix, L.iy, c, t, { look: 1 }); ctx.restore();
        ctx.save(); ctx.globalAlpha = ramp(l, 2, 2.8); var sz = W < 500 ? 16 : 20;
        fnote(ctx, '64 numbers in the picture.\nthe window sees 9.', L.ox + 3 * L.oc, L.oy + 3 * L.oc, sz, W, { color: P.mint, seed: 'n64', rot: -.02 }); ctx.restore();
      } },
    { name: 'one look', start: 9, dur: 8, need: 'core', cap: {
        1: 'One look: the window lays its 9 numbers over 9 pixels, <b>multiplies</b> each pair, <b>adds</b> them up. Left column −1, right +1: ink on the right, paper on the left scores big. An <b>edge</b>.',
        2: 'Each kernel row is [−1 0 1], so the sum = right-column brightness − left-column brightness. Flat patches cancel to 0; a dark-on-the-right edge scores high. Here 9 products sum to <b>6</b>.',
        3: '<code>out[i, j] = (x[i:i+3, j:j+3] * k).sum()</code> at (i, j) = (1, 4): a dot product of patch and kernel. Strictly cross-correlation (no flip); DL calls it convolution anyway.' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var L = mainLayout(W, H, true), c = L.c;
        narr(ctx, W, H, t, l < 2.5 ? { pose: 'lean-in', t0: .2, look: { x: W / 2, y: H * .3 } } : { pose: 'point', t0: 2.5, from: 'lean-in', look: { x: W / 2, y: H * .45 } });
