<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adam, line by line</title>
<meta name="theme-color" content="#1c2140">
<style>
#predict{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(18,20,44,.55);z-index:5;padding:14px;box-sizing:border-box}
#predict.on{display:flex}
#predict .card{background:#fbf6ea;color:#2a2934;border-radius:6px;max-width:360px;width:100%;padding:14px 14px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);font:15px/1.35 system-ui,-apple-system,'Segoe UI',sans-serif;transform:rotate(-.6deg)}
#predict .q{font:700 18px 'Comic Neue','Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive;margin:0 0 4px}
#predict .sub{font-size:13px;color:#5a5566;margin:0 0 10px}
#predict button.opt{display:block;width:100%;text-align:left;margin:0 0 7px;padding:9px 10px;border-radius:8px;border:1.5px solid #c8b8ea;background:#fff;color:#2a2934;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
#predict button.opt:hover,#predict button.opt:focus{background:#f7e3a0;outline:none}
#predict button.skipq{background:none;border:0;color:#6b5a9a;text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:4px 0;min-height:32px}
</style>
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;

  /* ---------------- the real loss surface: a long, gently curved ravine ----------------
     f(x,y) = 0.05 (x-3)^2 + 2 (y - 0.35 sin x)^2 ; floor at x = 3, y = 0.35 sin 3.
     Curvature across the ravine is ~4, along the floor 0.1: a 40x mismatch.            */
  var A = 0.35, XM = 4.5, YM = 2, MIN = [3, A * Math.sin(3)];
  function f(x, y) { var c = y - A * Math.sin(x); return 0.05 * (x - 3) * (x - 3) + 2 * c * c; }
  function grad(x, y) { var c = y - A * Math.sin(x); return [0.1 * (x - 3) - 4 * c * A * Math.cos(x), 4 * c]; }
  var START = [-4, -1.2];

  function gauss(r) { var u = Math.max(1e-9, r()), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v); }

  /* Real update rules (ARENA [0.3] conventions). o: {lr,b1,b2,eps,wd,scale,noise,seed,n} */
  function run(opt, x0, y0, o) {
    var lr = o.lr, b1 = o.b1 == null ? .9 : o.b1, b2 = o.b2 == null ? .999 : o.b2, eps = o.eps == null ? 1e-8 : o.eps, wd = o.wd || 0, k = o.scale || 1, n = o.n || 60;
    var r = F.rng(o.seed || 'mb'), p = [x0, y0], m = [0, 0], v = [0, 0], out = [], dead = false;
    out.push({ x: p[0], y: p[1], L: k * f(p[0], p[1]), g: [0, 0], mh: [0, 0], vh: [0, 0], st: [0, 0] });
    for (var t = 1; t <= n; t++) {
      if (dead) { out.push(out[out.length - 1]); continue; }
      var g0 = grad(p[0], p[1]), g = [k * g0[0], k * g0[1]], mh = [0, 0], vh = [0, 0], st = [0, 0];
      if (o.noise) { g[0] += o.noise * gauss(r); g[1] += o.noise * gauss(r); }
      for (var i = 0; i < 2; i++) {
        var gi = g[i], old = p[i];
        if (opt === 'sgd') p[i] -= lr * gi;
        else if (opt === 'mom') { m[i] = .9 * m[i] + gi; p[i] -= lr * m[i]; }
        else if (opt === 'rms') { v[i] = .99 * v[i] + .01 * gi * gi; p[i] -= lr * gi / (Math.sqrt(v[i]) + eps); vh[i] = v[i]; }
        else {
          if (opt === 'adaml2') gi = gi + wd * p[i];            // Adam(weight_decay): L2 folded into the gradient
          if (opt === 'adamw') p[i] *= 1 - lr * wd;             // AdamW: theta *= 1 - lr*lmda
          m[i] = b1 * m[i] + (1 - b1) * gi; v[i] = b2 * v[i] + (1 - b2) * gi * gi;
          mh[i] = m[i] / (1 - Math.pow(b1, t)); vh[i] = v[i] / (1 - Math.pow(b2, t));
          if (opt === 'nobc') { mh[i] = m[i]; vh[i] = v[i]; }
          p[i] -= lr * mh[i] / (Math.sqrt(vh[i]) + eps);
        }
        st[i] = p[i] - old;
      }
      if (Math.abs(p[0]) > XM * 1.5 || Math.abs(p[1]) > YM * 2.5 || !isFinite(p[0]) || !isFinite(p[1])) dead = true;
      out.push({ x: p[0], y: p[1], L: k * f(p[0], p[1]), g: g, mh: mh, vh: vh, st: st, dead: dead });
    }
    return out;
  }
  var CACHE = {}; function R(key, opt, o) { if (!CACHE[key]) CACHE[key] = run(opt, START[0], START[1], o); return CACHE[key]; }

  /* ---------------- world <-> screen (portrait stands the ravine upright) ---------------- */
  var V = { s: 1, cx: 0, cy: 0, por: false, W: 0, H: 0, top: -1, bot: -1 };
  function fit(W, H, top, bot) {
    if (V.W === W && V.H === H && V.top === top && V.bot === bot) return;
    V.W = W; V.H = H; V.top = top; V.bot = bot; V.por = H > W * 1.1;
    var aw = W - 24, ah = H - top - bot - 16;
    V.s = V.por ? Math.min(aw / (2 * YM), ah / (2 * XM)) : Math.min(aw / (2 * XM), ah / (2 * YM));
    V.cx = W / 2; V.cy = top + 8 + ah / 2; buildLand();
  }
  function S(x, y) { return V.por ? [V.cx + y * V.s, V.cy + x * V.s] : [V.cx + x * V.s, V.cy - y * V.s]; }
  function Winv(sx, sy) { return V.por ? [(sy - V.cy) / V.s, (sx - V.cx) / V.s] : [(sx - V.cx) / V.s, -(sy - V.cy) / V.s]; }
  var TOP = function (W, H) { return H > W * 1.1 ? 70 : 12; }, BOT = function (W, H) { return H > W * 1.1 ? 62 : 12; };

  var land = null, BANDS = ['#fdf3d8', '#f9e2b8', '#f6cfa6', '#f0b8a0', '#e7a0a4', '#d18aa6', '#b377a4', '#91679d', '#735a92', '#5a4c83', '#463f72', '#373461', '#2d2c52'];
  function hex(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  var BR = BANDS.map(hex);
  function band(x, y) { return Math.min(BANDS.length - 1, Math.floor(Math.sqrt(f(x, y)) * 3.3)); }
  function buildLand() {
    var k = 2, w = Math.ceil(V.W / k), h = Math.ceil(V.H / k), c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'), id = g.createImageData(w, h), B = new Int16Array(w * h), r = F.rng('crumple');
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) { var q = Winv(i * k + k / 2, j * k + k / 2); B[j * w + i] = band(q[0], q[1]); }
    for (j = 0; j < h; j++) for (i = 0; i < w; i++) {
      var b = B[j * w + i], col = BR[b], sh = 0;
      if (i > 1 && j > 1 && B[(j - 2) * w + i - 1] > b) sh = -34; else if (i < w - 1 && j < h - 1 && B[(j + 1) * w + i + 1] > b) sh = 16;
      var cr = Math.sin(i * .21 + Math.sin(j * .13) * 3) * Math.cos(j * .17 + Math.sin(i * .09) * 2) * 9; // crumpled-paper creases
      var n = (r() - .5) * 12 + cr, o = (j * w + i) * 4;
      id.data[o] = clamp(col[0] + sh + n, 0, 255); id.data[o + 1] = clamp(col[1] + sh + n, 0, 255); id.data[o + 2] = clamp(col[2] + sh + n, 0, 255); id.data[o + 3] = 255;
    }
    g.putImageData(id, 0, 0); land = c;
  }
  function drawLand(ctx, W, H, t, alpha) {
    var a = S(-XM, -YM), b = S(XM, YM), x0 = Math.min(a[0], b[0]), y0 = Math.min(a[1], b[1]), w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);
    ctx.save(); if (alpha != null) ctx.globalAlpha = alpha;
    F.paper(ctx, x0 + w / 2, y0 + h / 2, w + 10, h + 10, '#2d2c52', { seed: 'landpaper', blur: 14 });
    ctx.save(); var pts = F.tornRect('landclip', w, h, 1.2); ctx.translate(x0 + w / 2, y0 + h / 2); ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.clip();
    ctx.translate(-(x0 + w / 2), -(y0 + h / 2)); ctx.drawImage(land, 0, 0, W, H);
    ctx.fillStyle = F.grain(ctx); ctx.globalAlpha *= .45; ctx.fillRect(0, 0, W, H); ctx.restore();
    var m = S(MIN[0], MIN[1]); F.lantern(ctx, m[0], m[1] + 3, 8, 1, t);
    ctx.restore();
  }
  // sky brightens toward sunrise as the film goes on
  function bg(ctx, W, H, t, dawn) {
    var d = clamp(dawn || 0, 0, 1), top = mix('#1c2140', '#3b3f7a', d), bot = mix('#2b2f5c', '#e9a48f', d);
    F.sky(ctx, W, H, top, bot); F.stars(ctx, W, H, t, 'adam', Math.round(55 * (1 - d * .7)));
    if (d > .05) F.glow(ctx, W * .82, H + 30, Math.max(W, H) * .5 * d, 'rgba(255,200,140,.45)', d);
  }
  function mix(a, b, t) { var A1 = hex(a), B1 = hex(b); return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(lerp(A1[i], B1[i], t)); }).join(',') + ')'; }

  function pos(tr, k) { var i = Math.floor(k), fr = k - i; if (i >= tr.length - 1) return tr[tr.length - 1]; var a = tr[i], b = tr[i + 1]; return { x: lerp(a.x, b.x, F.ease.inOut(fr)), y: lerp(a.y, b.y, F.ease.inOut(fr)), i: i }; }
  function trail(ctx, tr, k, color, wdt, dotted) {
    var n = Math.min(tr.length - 1, Math.floor(k)); ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = wdt || 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (dotted) ctx.setLineDash([2, 5]);
    ctx.beginPath(); var p = S(tr[0].x, tr[0].y); ctx.moveTo(p[0], p[1]);
    for (var i = 1; i <= n; i++) { if (tr[i].dead) break; p = S(tr[i].x, tr[i].y); ctx.lineTo(p[0], p[1]); }
    var q = pos(tr, k); if (!tr[Math.min(tr.length - 1, n + 1)].dead) { p = S(q.x, q.y); ctx.lineTo(p[0], p[1]); } ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = color; for (i = 0; i <= n; i++) { if (tr[i].dead) break; p = S(tr[i].x, tr[i].y); ctx.beginPath(); ctx.arc(p[0], p[1], 2, 0, 6.283); ctx.fill(); }
    ctx.restore();
  }
  // the protagonist: a crumpled paper ball
  function ball(ctx, q, r, color) {
    var p = S(q.x, q.y); F.blob(ctx, p[0], p[1], r, color || P.cream, { seed: 'ball', jit: .9, blur: 6 });
    ctx.save(); ctx.strokeStyle = 'rgba(80,70,90,.45)'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(p[0] - r * .5, p[1] - r * .2); ctx.lineTo(p[0] + r * .1, p[1] + r * .1); ctx.lineTo(p[0] + r * .4, p[1] - r * .45);
    ctx.moveTo(p[0] - r * .1, p[1] + r * .55); ctx.lineTo(p[0] + r * .05, p[1] + r * .1); ctx.stroke(); ctx.restore();
  }
  function readout(ctx, x, y, lines, W) {
    var sz = W < 500 ? 12 : 14; ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l[0]).width); }); ctx.restore();
    F.paper(ctx, x + w / 2 + 10, y + lines.length * sz * .65 + 4, w + 22, lines.length * sz * 1.3 + 12, 'rgba(22,26,53,.9)', { seed: 'ro' + lines.length, shadow: false });
    ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; ctx.textBaseline = 'top';
    lines.forEach(function (l, i) { ctx.fillStyle = l[1] || P.chalk; ctx.fillText(l[0], x + 10, y + 8 + i * sz * 1.3); }); ctx.restore();
  }
  function botReadout(ctx, W, H, lines) { var sz = W < 500 ? 12 : 14; readout(ctx, 10, H - lines.length * sz * 1.3 - 22, lines, W); }
  function mono(ctx, s, x, y, sz, color, align, weight) { ctx.save(); ctx.font = (weight || '600') + ' ' + sz + 'px ' + F.MONO; ctx.fillStyle = color || P.ink; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.restore(); }
  function fx(v, d) { var s = v.toFixed(d == null ? 2 : d); return (v >= 0 ? '+' : '') + s; }
  function sci(v) { if (v === 0) return '0'; var e = Math.floor(Math.log10(Math.abs(v))), m = v / Math.pow(10, e); return m.toFixed(1) + 'e' + e; }
  function sign(ctx, W, H, a) {
    if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; var ph = W < 500;
    F.note(ctx, 'how big a step,\nin which direction?', ph ? W / 2 : W * .5, ph ? 36 : 44, ph ? 16 : 20, { rot: -.03, seed: 'trail', color: P.butter });
    ctx.restore();
  }
  function card(ctx, cx, cy, w, h, seed, color) { F.paper(ctx, cx, cy, w, h, color || P.cream, { seed: seed, rot: 0 }); }

  /* ---------------- the step-1 numbers (computed, not typed) ---------------- */
  var G1 = grad(START[0], START[1]);            // (-2.04, -5.86)
  var M1 = G1.map(function (g) { return .1 * g; }), V1 = G1.map(function (g) { return .001 * g * g; });
  var RAW = M1.map(function (m, i) { return m / (Math.sqrt(V1[i]) + 1e-8); });                       // uncorrected: ~ -3.16
  var MONLY = M1.map(function (m, i) { return (m / .1) / (Math.sqrt(V1[i]) + 1e-8); });              // correct m only: ~ -31.6
  var BOTH = M1.map(function (m, i) { return (m / .1) / (Math.sqrt(V1[i] / .001) + 1e-8); });        // both: ~ -1.00

  /* ---------------- predict, then watch (never gated) ---------------- */
  var QT = 58.2, Q = { done: false, prev: -1, choice: null, el: null };
  var QOPTS = [
    ['a', 'lr × gradient: big on the steep axis, small on the flat one'],
    ['b', 'about lr on each axis, whatever the gradient size'],
    ['c', 'nearly zero: m and v both start at 0']];
  function buildQ(api) {
    if (Q.el) return Q.el;
    var d = document.createElement('div'); d.id = 'predict';
    d.innerHTML = '<div class="card"><p class="q">Predict: on step 1, how big is Adam\'s step on each axis?</p><p class="sub">g = (' + G1[0].toFixed(2) + ', ' + G1[1].toFixed(2) + '), lr = 0.1, m and v start at 0.</p>' +
      QOPTS.map(function (o) { return '<button class="opt" data-c="' + o[0] + '">' + o[1] + '</button>'; }).join('') +
      '<button class="skipq">just show me &#9654;</button></div>';
    api.root.querySelector('.stage').appendChild(d);
    d.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    [].forEach.call(d.querySelectorAll('button'), function (b) {
      b.onclick = function (e) { e.stopPropagation(); Q.choice = b.dataset.c || 'skip'; hideQ(api, true); if (b.dataset.c) api.audio.blip(b.dataset.c === 'b' ? 880 : 520); };
    });
    Q.el = d; return d;
  }
  function isPlaying(api) { return api.root.querySelector('.pp').getAttribute('aria-label') === 'Pause'; }
  function showQ(api) { var d = buildQ(api); d.classList.add('on'); if (isPlaying(api)) api.root.querySelector('.pp').click(); }
  function hideQ(api, resume) { if (!Q.el) return; Q.el.classList.remove('on'); if (resume && !isPlaying(api)) api.root.querySelector('.pp').click(); }

  var LR = { sgd: .45, adam: .15 };
  var RATE = 7;

  var base = [
    { name: 'one lr for all', start: 0, dur: 18, draw: function (ctx, t, l, W, H) {
        fit(W, H, TOP(W, H), BOT(W, H)); bg(ctx, W, H, t, 0); drawLand(ctx, W, H, t);
        var T = R('sgd', 'sgd', { lr: LR.sgd, n: 90 }), k = Math.max(0, (l - 4) * RATE), q = pos(T, k), i = Math.min(T.length - 1, Math.floor(k) + 1);
        trail(ctx, T, k, P.butter); ball(ctx, q, 9);
        sign(ctx, W, H, ramp(l, .2, 1.2));
        var g = grad(q.x, q.y);
        botReadout(ctx, W, H, [['SGD  lr=0.45   step ' + Math.floor(k), P.butter], ['g = (' + fx(g[0]) + ', ' + fx(g[1]) + ')'], ['loss ' + f(q.x, q.y).toFixed(3)]]);
      } },
    { name: 'a ruler each', start: 18, dur: 20, draw: function (ctx, t, l, W, H) {
        fit(W, H, TOP(W, H), BOT(W, H)); bg(ctx, W, H, t, .1); drawLand(ctx, W, H, t);
        var e = l < 3 ? 0 : l < 8 ? 2 * ramp(l, 3, 8) : l < 14 ? lerp(2, -2, ramp(l, 8.5, 13.5)) : lerp(-2, 0, ramp(l, 15, 19)), k = Math.pow(10, e);
        var Sg = run('sgd', START[0], START[1], { lr: .2, scale: k, n: 40 }), Ad = run('adam', START[0], START[1], { lr: LR.adam, scale: k, n: 40 });
        trail(ctx, Sg, 40, P.orange, 2.5); trail(ctx, Ad, 40, P.lav, 3.5);
        var sd = Sg.findIndex(function (s) { return s.dead; });
        if (sd > 0) { var pd = S(clamp(Sg[sd - 1].x, -XM, XM), clamp(Sg[sd - 1].y, -YM, YM)); F.hand(ctx, 'SGD flew off', pd[0] + (V.por ? 0 : 60), pd[1] + (V.por ? 22 : 0), 16, P.orange, { outline: 4, outlineColor: 'rgba(20,20,50,.8)', seed: 'fly' }); }
        ball(ctx, Ad[40], 8, P.lav); ball(ctx, Sg[sd > 0 ? 0 : 40], 7, P.orange);
        var a = Ad[10], ph = W < 500, sz = ph ? 12 : 14, cw = ph ? W - 20 : 330, ch = sz * 7.4, cx = ph ? W / 2 : W - cw / 2 - 14, cy = ph ? 10 + ch / 2 : 16 + ch / 2;
        card(ctx, cx, cy, cw, ch, 'ruler');
        var x0 = cx - cw / 2 + 12, c1 = x0 + (ph ? 118 : 150), c2 = x0 + (ph ? 238 : 250);
        mono(ctx, 'loss × ' + (k >= 1 ? k.toFixed(k < 10 ? 2 : 0) : k.toFixed(k < .1 ? 3 : 2)), x0, cy - ch / 2 + sz * 1.1, sz + 1, '#6b2f7a', 'left', '700');
        mono(ctx, 'Adam, step 10', c1, cy - ch / 2 + sz * 1.1, sz - 1, '#6b5a9a');
        mono(ctx, 'along x', c1, cy - ch / 2 + sz * 2.5, sz - 1, '#6b5a9a'); mono(ctx, 'across y', c2, cy - ch / 2 + sz * 2.5, sz - 1, '#6b5a9a');
        [['m̂', a.mh, 3], ['√v̂', a.vh.map(Math.sqrt), 3], ['m̂/√v̂', a.mh.map(function (m, i) { return m / (Math.sqrt(a.vh[i]) + 1e-8); }), 2]].forEach(function (r, j) {
          var y = cy - ch / 2 + sz * (3.8 + j * 1.25), fmt = function (v) { return Math.abs(v) >= 1000 || (Math.abs(v) < .001 && v !== 0) ? sci(v) : v.toFixed(r[2]); };
          mono(ctx, r[0], x0, y, sz, P.ink, 'left', '700'); mono(ctx, fmt(r[1][0]), c1, y, sz, j === 2 ? '#2f7a52' : P.ink); mono(ctx, fmt(r[1][1]), c2, y, sz, j === 2 ? '#2f7a52' : P.ink);
        });
        botReadout(ctx, W, H, [['SGD  lr=0.2 ' + (sd > 0 ? 'diverged' : 'loss ' + Sg[40].L.toFixed(3)), P.orange], ['Adam lr=0.15 ends at (' + Ad[40].x.toFixed(2) + ', ' + Ad[40].y.toFixed(2) + ')', P.lav]]);
      } },
    { name: 'noisy batches', start: 38, dur: 16, draw: function (ctx, t, l, W, H) {
        fit(W, H, TOP(W, H), BOT(W, H)); bg(ctx, W, H, t, .2); drawLand(ctx, W, H, t);
        var T = R('noisy', 'adam', { lr: LR.adam, noise: 1.5, seed: 'batch', n: 130 }), k = l * RATE, q = pos(T, k), i = Math.min(T.length - 1, Math.floor(k) + 1), s = T[i];
        trail(ctx, T, k, P.lav, 2.5);
        var p = S(q.x, q.y), sc = V.s * .55;
        for (var j = Math.max(1, i - 5); j <= i; j++) { var gj = T[j].g, L = Math.hypot(gj[0], gj[1]) || 1, d = V.por ? [-gj[1] / L, -gj[0] / L] : [-gj[0] / L, gj[1] / L]; ctx.save(); ctx.globalAlpha = .35 + .13 * (j - i + 5); F.arrow(ctx, p[0], p[1], p[0] + d[0] * sc * 1.3, p[1] + d[1] * sc * 1.3, P.pink, 2, 'n' + j); ctx.restore(); }
        var mm = s.mh, Lm = Math.hypot(mm[0], mm[1]) || 1, dm = V.por ? [-mm[1] / Lm, -mm[0] / Lm] : [-mm[0] / Lm, mm[1] / Lm];
        F.arrow(ctx, p[0], p[1], p[0] + dm[0] * sc * 1.7, p[1] + dm[1] * sc * 1.7, P.butter, 4, 'mh');

        1: 'Answer: exactly lr on each axis. The averages start at 0, so early ones are too small; dividing by (1 − β<sup>t</sup>) is the warm-up fix. The plot shows it fading as steps go by.',
        2: 'Bias correction: m̂ = m/(1 − β₁ᵗ), v̂ = v/(1 − β₂ᵗ). At t = 1, m̂ = g and v̂ = g², so step = ±lr. Skip it: 3.16× too big. Fix m only: 31.6×.',
        3: 'The m correction is gone by t ≈ 50 (0.9⁵⁰ ≈ 0.005); v\'s lasts thousands of steps (1 − 0.999¹⁰⁰⁰ = 0.63). ARENA: <code>self.t</code> starts at 1.' } }
    ]),
    split(byName('epsilon'), [
      { name: 'epsilon', dur: 14, need: 'library', pose: function (l) { return l > 8 ? 'shrug' : 'lean-in'; }, cap: {
        1: 'ε (epsilon) is a tiny number, 10⁻⁸, added to the ruler. It only matters when a gradient is almost exactly zero, where it stops a 0 ÷ 0. Library detail: leave it at the default.',
        2: 'step/lr = |g| ÷ (|g| + ε). Normal gradients (≫ 10⁻⁸): ε is invisible. Near 10⁻⁸ the step fades out; g = 0 gives 0/(0 + ε) = 0, not NaN.',
        3: 'ARENA/PyTorch: <code>v_hat.sqrt() + eps</code>, outside the sqrt. In fp16, 1e-8 underflows to 0, one reason people raise it. Otherwise leave it.' } }
    ]),
    split(byName('AdamW'), [
      { name: 'weight decay', dur: 11, need: 'exercise', pose: 'pull', cap: {
        1: '<b>Weight decay</b> gently pulls every weight toward zero each step, so the model doesn\'t lean on huge weights. Old Adam put that pull <b>inside the gradient</b>, so the ruler divided it too.',
        2: 'Adam + L2: g = g + wd·θ, then everything is divided by √v. A weight with big gradients (big ruler) barely feels the pull; a quiet weight (small ruler) gets squeezed hard.',
        3: 'Two weights, θ = 2, wd = 0.1, lr = 0.01, steady |g| of 10 and 0.1. L2 pull ≈ lr·wd·θ/|g + wd·θ|: 1.96e-4 vs 6.67e-3, 34× apart.' } },
      { name: 'AdamW', dur: 11, need: 'exercise', pose: function (l) { return l > 6 ? 'cheer' : 'pull'; }, cap: {
        1: 'AdamW moves the pull <b>outside</b>: every weight shrinks by the same small fraction, then takes its usual Adam step. Busy or quiet, same pull. The whole fix is one line.',
        2: 'AdamW: θ ← θ·(1 − lr·wd), then the usual Adam step. Here every weight shrinks by lr·wd = 0.1% per step, whatever its ruler. AdamW is the default for training transformers.',
        3: 'AdamW pull = lr·wd·θ = 2.0e-3 for both. Loshchilov & Hutter (2019), decoupled decay. ARENA: <code>theta *= 1 - self.lr * self.lmda</code>, before m and v.' } }
    ]),
    split(byName('the limit'), [
      { name: 'the limit', dur: 8, need: 'contested', pose: 'lean-in', cap: {
        1: 'Where the story stops: Adam\'s rulers only point along the <b>axes</b>, one per weight. Tilt the same ravine 45° and they can\'t see it: same valley, about 4× slower.',
        2: 'Adam rescales each coordinate separately (a "diagonal" fix). Left: ravine along the axes, loss < 0.01 in 19 steps. Right: the same ravine turned 45°, 73 steps. Both live.',
        3: 'Diagonal preconditioning fixes axis-aligned ill-conditioning only; a rotated Hessian defeats it. Adam lr = 0.15 on both.' } },
      { name: 'what comes next?', dur: 8, span: 8, need: 'contested', pose: 'shrug', cap: {
        1: '<b>Current method:</b> AdamW, one ruler per weight, trains most big models. <b>Emerging:</b> optimisers that also handle tilted ravines, like Muon or Shampoo. <b>You need:</b> AdamW.',
        2: 'Current: AdamW. Emerging: Shampoo (matrix-shaped rulers) and Muon (orthogonalised updates for 2-D weights) report speed-ups that depend on tuning and scale. Exercise: AdamW.',
        3: 'Full-matrix/Kronecker preconditioners target the off-diagonal part; Muon is ARENA [0.3]\'s bonus. Real nets: 10⁹ axes and many equally low floors, not one.' } }
    ]),
    split(byName('your step()'), [
      { name: 'your step()', dur: 10, need: 'exercise', pose: 'type', cap: {
        1: 'Everything you just watched is <b>nine lines</b>. Each line lights up with its real step-1 number for the steep axis, so you can check your own code against it.',
        2: 'Your Adam(W) step in ARENA [0.3] order: decay, m, v, bias correction, update. <code>m.copy_(...)</code> writes in place so the optimiser keeps its memory between steps.',
        3: 'Run under <code>@t.inference_mode()</code>; t starts at 1 (<code>self.t = 1</code>). Step-1 check: with wd = 0 the update on every axis is exactly ±lr.' } },
      { name: 'what you keep', dur: 10, need: 'core', pose: 'cheer', cap: {
        1: 'After Saturday this is one line for life: <code>torch.optim.AdamW(...)</code>. What you keep: one ruler per weight, a memory of ~10 steps for direction and ~1000 for size.',
        2: 'Career takeaway: lr is the main knob; the β₁, β₂, ε defaults are fine almost always; use AdamW when you want weight decay. Optimisers shape which solution a model lands in.',
        3: 'ARENA\'s Adam folds decay in as <code>g = g + self.lmda * theta</code>; AdamW swaps it for <code>theta *= 1 - self.lr * self.lmda</code>. Tests: <code>tests.test_adam</code>, <code>tests.test_adamw</code>.' } }
    ])
  ));
  QT = chapters.filter(function (c) { return c.name === 'step one: predict'; })[0].start + 4.2;

  /* rotated-ravine mini runs for 'the limit' (q = 0.05u² + 2w², u,w rotated by thr) */
  var ROT = {};
  function rotRun(thr) {
    var key = thr.toFixed(3); if (ROT[key]) return ROT[key];
    var c = Math.cos(thr), s = Math.sin(thr), q = function (x, y) { var u = c * x + s * y, w = -s * x + c * y; return [c * .1 * u - s * 4 * w, s * .1 * u + c * 4 * w, .05 * u * u + 2 * w * w]; };
    var u0 = -3, w0 = .8, p = [c * u0 - s * w0, s * u0 + c * w0], m = [0, 0], v = [0, 0], out = [[p[0], p[1], q(p[0], p[1])[2]]], hit = 999;
    for (var t = 1; t <= 110; t++) { var g = q(p[0], p[1]); for (var i = 0; i < 2; i++) { m[i] = .9 * m[i] + .1 * g[i]; v[i] = .999 * v[i] + .001 * g[i] * g[i]; p[i] -= .15 * (m[i] / (1 - Math.pow(.9, t))) / (Math.sqrt(v[i] / (1 - Math.pow(.999, t))) + 1e-8); }
      var L = q(p[0], p[1])[2]; if (hit === 999 && L < .01) hit = t; out.push([p[0], p[1], L]); }
    out.hit = hit; ROT[key] = out; return out;
  }

  var CODE = [
    '@t.inference_mode()',
    'def adam_step(p, m, v, t, lr, b1, b2, eps, wd):',
    '    g = p.grad',
    '    p *= 1 - lr * wd            # AdamW: decay outside',
    '    m.copy_(b1 * m + (1 - b1) * g)',
    '    v.copy_(b2 * v + (1 - b2) * g.pow(2))',
    '    m_hat = m / (1 - b1**t)',
    '    v_hat = v / (1 - b2**t)',
    '    p -= lr * m_hat / (v_hat.sqrt() + eps)'];
  var VALS = [null, 't = 1, lr = 0.1, wd = 0 (steep axis y)',
    'g = ' + G1[1].toFixed(3),
    'wd = 0 → p unchanged',
    'm = ' + M1[1].toFixed(4),
    'v = ' + V1[1].toFixed(5),
    'm_hat = ' + (M1[1] / .1).toFixed(3),
    'v_hat = ' + (V1[1] / .001).toFixed(3),
    'step = ' + (-.1 * BOTH[1]).toFixed(3) + '  (= lr)'];
  if (window.innerWidth < 500) { CODE[1] = 'def adam_step(p, m, v, t, lr, b1,'; CODE.splice(2, 0, '              b2, eps, wd):'); VALS.splice(2, 0, VALS[1]); CODE[4] = '    p *= 1 - lr * wd   # AdamW'; }

  /* ---------------- coda: now you drive ---------------- */
  var OPTS = { adam: ['Adam', P.lav], adamw: ['AdamW', P.mint], adaml2: ['Adam + L2', P.pink], nobc: ['Adam, no bias corr.', P.orange], rms: ['RMSprop', P.teal], mom: ['Momentum', P.sky], sgd: ['SGD', P.butter] };
  var C = { start: null, opt: 'adam', lr: .15, b1: .9, b2: .999, wd: 0, noise: 0, tr: null, ghost: null, k: 0, drag: false };
  function codaReset(keepK) {
    var s = C.start || START, o = { lr: C.lr, b1: C.b1, b2: C.b2, wd: C.wd, noise: C.noise, seed: 'coda', n: 400 };
    C.tr = run(C.opt, s[0], s[1], o); C.ghost = C.opt === 'adam' ? null : run('adam', s[0], s[1], { lr: C.lr, b1: C.b1, b2: C.b2, noise: C.noise, seed: 'coda', n: 400 });
    if (!keepK) C.k = 0;
  }
  function slider(name, label, min, max, step, val) { return '<label style="display:flex;align-items:center;gap:6px;min-width:0">' + label + ' <input data-k="' + name + '" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '" style="flex:1;min-width:50px"> <b data-v="' + name + '" style="min-width:3.2em;font-variant-numeric:tabular-nums"></b></label>'; }
  var coda = {
    caption: { 1: '', 2: '', 3: '' },
    start: function (api, panel) {
      hideQ(api, false);
      panel.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px 12px;font-size:13px;align-items:center">' +
        '<select aria-label="Optimiser" style="font:inherit;border-radius:8px;padding:4px;min-height:30px">' + Object.keys(OPTS).map(function (k) { return '<option value="' + k + '">' + OPTS[k][0] + '</option>'; }).join('') + '</select>' +
        slider('lr', 'lr', -3, 0, .01, Math.log10(C.lr)) + slider('b1', 'β₁', 0, .99, .01, C.b1) + slider('b2', 'β₂', .9, .9999, .0001, C.b2) +
        slider('wd', 'wd', 0, .5, .01, C.wd) + slider('noise', 'noise', 0, 3, .1, C.noise) + '</div>' +
        '<div style="font-size:12px;opacity:.8;margin-top:2px">Tap or drag on the map to move the start.</div>';
      var sel = panel.querySelector('select'); sel.value = C.opt; sel.onchange = function () { C.opt = sel.value; codaReset(); };
      [].forEach.call(panel.querySelectorAll('input[type=range]'), function (inp) {
        var k = inp.dataset.k, out = panel.querySelector('[data-v=' + k + ']');
        var upd = function () { var v = +inp.value; C[k] = k === 'lr' ? Math.pow(10, v) : v; out.textContent = k === 'lr' ? C.lr.toFixed(C.lr < .1 ? 3 : 2) : k === 'b2' ? C.b2.toFixed(4) : C[k].toFixed(2); };
        upd(); inp.oninput = function () { upd(); codaReset(); };
      });
      codaReset();
    },
    down: function (x, y, api) { var w = Winv(x, y); if (Math.abs(w[0]) <= XM && Math.abs(w[1]) <= YM) { C.start = w; C.drag = true; codaReset(); api.audio.blip(660); } },
    move: function (x, y, api, pressed) { if (!C.drag || !pressed) return; var w = Winv(x, y); if (Math.abs(w[0]) <= XM && Math.abs(w[1]) <= YM) { C.start = w; codaReset(); } },
    up: function () { C.drag = false; },
    draw: function (ctx, t, W, H, api, dt) {
      fit(W, H, 12, 12); bg(ctx, W, H, t, .9); drawLand(ctx, W, H, t);
      C.k = Math.min(400, C.k + dt * 12);
      if (C.ghost) trail(ctx, C.ghost, C.k, 'rgba(200,184,234,.55)', 1.5, true);
      var col = OPTS[C.opt][1]; trail(ctx, C.tr, C.k, col, 2.8);
      var q = pos(C.tr, C.k), i = Math.min(400, Math.floor(C.k)), s = C.tr[i]; ball(ctx, q, 8, col);
      var lines = [[OPTS[C.opt][0] + '  step ' + i, col], ['loss ' + (s.dead ? 'diverged' : f(s.x, s.y).toExponential(2))]];
      if (/adam|nobc/.test(C.opt) && !s.dead && i > 0) lines.push(['m̂/√v̂ (' + fx(s.mh[0] / (Math.sqrt(s.vh[0]) + 1e-8)) + ',' + fx(s.mh[1] / (Math.sqrt(s.vh[1]) + 1e-8)) + ')']);
      if (C.ghost) lines.push(['dotted: plain Adam', P.lav]);
      readout(ctx, 8, 8, lines, W);
    }
  };

  F.play({
    title: 'Deep dive · Adam, line by line',
    back: '../index.html',
    chapters: chapters,
    coda: coda,
    links: [
      { label: 'Week 3 pack', href: '../../index.html#week-03' },

      { label: 'Map: Adam', href: '../../index.html#map/node=adam' },
      { label: 'Map: AdamW vs Adam', href: '../../index.html#map/node=adamw-vs-adam' },
      { label: 'Map: weight decay', href: '../../index.html#map/node=weight-decay' },
      { label: 'Case: AdamW vs Adam', href: '../../index.html#cases/adamw-vs-adam' },

    ]
  });
