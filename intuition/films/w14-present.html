var W14 = (function () {
  'use strict';
  var ARMS = [['baseline', 62, 200], ['capped', 14, 200], ['random v', 58, 200]]; // chats that drifted out of range / chats run

  function wilson(k, n) { var p = k / n, d = 1 + Z * Z / n, c = (p + Z * Z / (2 * n)) / d, h = Z * Math.sqrt(p * (1 - p) / n + Z * Z / (4 * n * n)) / d; return { p: p, lo: c - h, hi: c + h }; }

  function ztest(a, b) { var p1 = a[1] / a[2], p2 = b[1] / b[2], pp = (a[1] + b[1]) / (a[2] + b[2]), se = Math.sqrt(pp * (1 - pp) * (1 / a[2] + 1 / b[2])); return (p1 - p2) / se; }
  var SLIDES = [['Claim', 0.5], ['Evidence', 1.5], ['Limits', 1], ['Next', 1], ['Thanks', 0.5]];
  return { ARMS: ARMS, wilson: wilson, ztest: ztest, SLIDES: SLIDES };
})();

<script>

        var r = F.rng('conf'), c = ramp(l, 1, 2); for (i = 0; i < 40 * c; i++) { var x = r() * W, sp = 40 + r() * 60, y = ((r() * H + l * sp) % (H * .8)); ctx.fillStyle = [P.pink, P.butter, P.mint, P.sky][i % 4]; ctx.save(); ctx.translate(x, y); ctx.rotate(l * 3 + i); ctx.fillRect(-3, -2, 6, 4); ctx.restore(); }
        ctx.save(); ctx.globalAlpha = ramp(l, 3, 4); F.note(ctx, 'clear, honest findings help\neveryone steer AI safely', W / 2, R.y + R.h + (small(W) ? 44 : 50), small(W) ? 16 : 22, { color: P.pink, seed: 'steer', rot: .02 }); ctx.restore();
        ctx.save(); ctx.globalAlpha = ramp(l, 7, 8); F.hand(ctx, 'thank you · 14 Saturdays', W / 2, R.y + 24, small(W) ? 17 : 24, '#6b5a9a', { seed: 'ty' }); ctx.restore();
        // the presenter takes a bow: wave, bow (a slow slump-forward), then celebrate, lantern in hand
        F.stick(ctx, small(W) ? W * .16 : W * .2, H * .8, small(W) ? 84 : 110, t, l < 4 ? { pose: 'wave', t0: .4, lantern: true, scarf: P.sky } : l < 7 ? { pose: 'slump', t0: 4, from: 'wave', lantern: true, scarf: P.sky } : { pose: 'celebrate', t0: 7, from: 'slump', lantern: true, scarf: P.sky });
      } }
  ];

  /* ---------------- coda: drag the slides into an order, live timer ---------------- */
  var C = { order: [0, 1, 2, 3, 4], mins: M.SLIDES.map(function (s) { return s[1]; }), drag: -1, dy: 0, y: 0, run: false, rt: 0, moved: false };
  function cardGeom(W, H) { var n = 5, h = Math.min(58, (H - 110) / n - 8), w = Math.min(W - 40, 420); return { x: (W - w) / 2, y: 70, w: w, h: h, gap: 8 }; }
  function total() { return C.mins.reduce(function (a, b) { return a + b; }, 0); }
  function checks() { var o = C.order; return [['claim first', o[0] === 0], ['evidence before limits', o.indexOf(1) < o.indexOf(2)], ['limits before next', o.indexOf(2) < o.indexOf(3)], ['fits in 5 min', total() <= 5]]; }
  var coda = {
    caption: { 1: '', 2: '', 3: '' },
    start: function (api, panel) {
      panel.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px"><span>Drag cards to reorder. Tap a card to change its minutes.</span><button data-a="run">Rehearse</button><button data-a="shuffle">Shuffle</button></div>';
      panel.querySelector('[data-a=run]').onclick = function () { C.run = true; C.rt = 0; api.audio.blip(660); };
      panel.querySelector('[data-a=shuffle]').onclick = function () { var r = F.rng('sh' + Date.now()); for (var i = 4; i > 0; i--) { var j = Math.floor(r() * (i + 1)), x = C.order[i]; C.order[i] = C.order[j]; C.order[j] = x; } C.run = false; api.audio.paper(); };
      setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 30);
    },
    down: function (x, y, api) { var G = cardGeom(api.W, api.H), i = Math.floor((y - G.y) / (G.h + G.gap)); if (x < G.x || x > G.x + G.w || i < 0 || i > 4) return; C.drag = i; C.y = y; C.dy = y - (G.y + i * (G.h + G.gap)); C.moved = false; },
    move: function (x, y, api, pressed) {
      if (C.drag < 0 || !pressed) return; var G = cardGeom(api.W, api.H); C.y = y; if (Math.abs(y - (G.y + C.drag * (G.h + G.gap) + C.dy)) > 6) C.moved = true;
      var j = clamp(Math.round((y - C.dy - G.y) / (G.h + G.gap)), 0, 4);
      if (j !== C.drag) { var it = C.order.splice(C.drag, 1)[0]; C.order.splice(j, 0, it); C.drag = j; api.audio.blip(520 + j * 60); }
    },
    up: function (x, y, api) {
      if (C.drag >= 0 && !C.moved) { var k = C.order[C.drag]; C.mins[k] = C.mins[k] >= 2 ? 0.5 : C.mins[k] + 0.5; api.audio.blip(880); }
      C.drag = -1;
    },
    draw: function (ctx, t, W, H, api, dt) {
      hall(ctx, W, H, t, { audience: false }); var G = cardGeom(W, H), tot = total(), left = 5 - tot;
      if (C.run) { C.rt += dt / 3; if (C.rt >= tot) { C.run = false; api.audio.blip(990); } } // 1 minute of talk = 3 s of rehearsal
      var elapsed = C.run ? C.rt : 0, acc = 0, cur = -1;
      C.order.forEach(function (k, i) {
        var y = G.y + i * (G.h + G.gap), isD = i === C.drag; if (isD) y = C.y - C.dy;
        var on = C.run && elapsed >= acc && elapsed < acc + C.mins[k]; if (on) cur = i; acc += C.mins[k];
        F.paper(ctx, W / 2, y + G.h / 2, G.w, G.h, on ? P.butter : [P.cream, P.mint, P.pink, P.sky, P.lav][k], { seed: 'cd' + k, rot: isD ? .02 : 0 });
        F.hand(ctx, (i + 1) + '. ' + M.SLIDES[k][0], G.x + 16, y + G.h / 2, small(W) ? 18 : 22, P.ink, { align: 'left', seed: 'c' + k });
        F.hand(ctx, C.mins[k].toFixed(1) + ' min', G.x + G.w - 14, y + G.h / 2, small(W) ? 15 : 18, '#6b5a9a', { align: 'right', seed: 'm' + k + C.mins[k] });
      });
      var remain = C.run ? 5 - elapsed : left, mm = Math.floor(Math.abs(remain)), ss = Math.floor((Math.abs(remain) - mm) * 60);
      var clock = (remain < 0 ? '-' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
      ctx.save(); ctx.font = '700 ' + (small(W) ? 22 : 28) + 'px ' + F.MONO; ctx.fillStyle = remain < 0 ? P.red : '#7cf08a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      F.paper(ctx, W / 2, 36, small(W) ? 230 : 280, 44, '#161a35', { seed: 'clk', shadow: false });
      ctx.fillText((C.run ? 'LIVE ' : 'left ') + clock, W / 2, 37); ctx.restore();
      var cy = G.y + 5 * (G.h + G.gap) + 10, cs = checks();
      cs.forEach(function (c, i) { lbl(ctx, (c[1] ? '✓ ' : '✗ ') + c[0], small(W) ? W / 2 : W / 2 - 100 + (i % 2) * 200, cy + (small(W) ? i * 20 : Math.floor(i / 2) * 22) + 10, c[1] ? P.mint : P.pink, small(W) ? 14 : 16); });
      if (cur >= 0) F.lantern(ctx, G.x - 4, G.y + cur * (G.h + G.gap) + G.h / 2, 9, 1, t);
    }
  };

  F.play({
    title: 'W14 · Show your work',
    back: '../index.html',
    chapters: chapters,
    coda: coda,
    links: [
      { label: 'Week 14 pack', href: '../../index.html#week-14' },
      { label: 'Demo: evals pipeline', href: '../../index.html#demo/evals-pipeline' },
      { label: 'Map: final presentation', href: '../../index.html#map/node=final-presentation' },
      { label: 'Map: Petri', href: '../../index.html#map/node=petri' },
      { label: 'Case: investigator agents', href: '../../index.html#cases/investigator-agents' },
      { label: 'Case: eval awareness', href: '../../index.html#cases/eval-awareness' }
    ]
  });
})();
