<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haven't I seen this before</title>
<meta name="theme-color" content="#1c2140">
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;

  /* ---------------- a real two-head toy transformer, computed in JS ----------------
     tokens: random unit vectors in d=24. Head 1 (previous-token head): q_i = beta*pos(i-1), k_j = pos(j),
     softmax over j<=i. Its OV writes a "stamp" s_j = sum_k A_prev[j,k] E[t_k]  (K-composition input).
     Head 2 (induction head): score[i,j] = beta2 * E[t_i] . s_j, softmax over j<=i; OV copies E[t_j];
     logits = gamma * E[v] . out_i; loss_i = -log p(t_{i+1}). Nothing is faked. */
  var VOC = ['Furby', 'Nokia', 'Snake', 'VHS', 'MSN', 'Win98', 'modem', 'Zip', 'Sega', 'Pogs', 'Tetris', 'Kazaa'];
  var D = 24, TH = 0.45, BP = 30, GAM = 9, SINK = 0.55;
  var EMB = (function () { var r = F.rng('emb7'), out = []; for (var v = 0; v < VOC.length; v++) { var e = [], n = 0; for (var k = 0; k < D; k++) { var g = Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(6.283 * r()); e.push(g); n += g * g; } n = Math.sqrt(n); out.push(e.map(function (x) { return x / n; })); } return out; })();
  function dot(a, b) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
  function softmax(xs) { var m = -1e9, i; for (i = 0; i < xs.length; i++) m = Math.max(m, xs[i]); var e = xs.map(function (x) { return Math.exp(x - m); }), s = 0; for (i = 0; i < e.length; i++) s += e[i]; return e.map(function (x) { return x / s; }); }
  function model(toks, n, b2, noise) {
    var L = toks.length, Ap = [], Ai = [], St = [], Sc = [], loss = [], pred = [], r = F.rng('fz' + Math.round((noise || 0) * 100));
    for (var i = 0; i < L; i++) {
      var sc = []; for (var j = 0; j <= i; j++) sc.push(BP * Math.cos(TH * (i - 1 - j)));
      var a = softmax(sc); Ap.push(a);
      var s = new Array(D).fill(0); if (i > 0) for (j = 0; j <= i; j++) for (var k = 0; k < D; k++) s[k] += a[j] * EMB[toks[j]][k]; // pos 0 has no previous token: it rests on BOS, blank stamp
      St.push(s);
    }
    for (i = 0; i < L; i++) {
      var sc2 = []; for (j = 0; j <= i; j++) sc2.push(b2 * dot(EMB[toks[i]], St[j]) + (noise ? (r() - .5) * noise : 0));
      // BOS attention sink: a resting place with a fixed score that copies nothing (as real heads do)
      var full = softmax(sc2.concat([b2 * SINK])), a2 = full.slice(0, i + 1); Ai.push(a2); Sc.push(sc2);
      var o = new Array(D).fill(0); for (j = 0; j <= i; j++) for (k = 0; k < D; k++) o[k] += a2[j] * EMB[toks[j]][k];
      var lg = EMB.map(function (e) { return GAM * dot(e, o); }), p = softmax(lg), best = 0;
      for (k = 1; k < p.length; k++) if (p[k] > p[best]) best = k;
      pred.push({ tok: best, p: p });
      loss.push(i < L - 1 ? -Math.log(p[toks[i + 1]]) : null);
    }
    var ds = 0; for (i = n; i < L; i++) ds += Ai[i][i - n + 1]; ds /= (L - n);
    var l1 = 0, l2 = 0; for (i = 0; i < n - 1; i++) l1 += loss[i]; for (i = n; i < L - 1; i++) l2 += loss[i];
    return { Ap: Ap, Ai: Ai, St: St, Sc: Sc, loss: loss, pred: pred, score: ds, lossPlay: l1 / (n - 1), lossRerun: l2 / (L - 1 - n) };
  }
  function makeToks(seed, n) { var r = F.rng(seed), pool = VOC.map(function (_, i) { return i; }), a = []; for (var i = 0; i < n; i++) { var k = Math.floor(r() * pool.length); a.push(pool.splice(k, 1)[0]); } return a.concat(a); }
  var N = 6, TOK = makeToks('tape-7', N), M = model(TOK, N, 8);
  window.__w7 = { M: M, TOK: TOK, model: model, get PR() { return PR; }, mood: function (c) { return mood(c); } };

  /* ---------------- scenery ---------------- */
  function bg(ctx, W, H, t) { F.sky(ctx, W, H, P.night, '#2b2f5c'); F.stars(ctx, W, H, t, 'w7', 50); }
  function readout(ctx, x, y, lines, W, right) {
    var sz = W < 500 ? 12 : 14; ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l[0]).width); }); ctx.restore();
    if (right) x = x - w - 22;
    F.paper(ctx, x + w / 2 + 10, y + lines.length * sz * .65 + 4, w + 22, lines.length * sz * 1.3 + 12, 'rgba(22,26,53,.9)', { seed: 'ro' + lines.length, shadow: false });
    ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; ctx.textBaseline = 'top';
    lines.forEach(function (l, i) { ctx.fillStyle = l[1] || P.chalk; ctx.fillText(l[0], x + 10, y + 8 + i * sz * 1.3); }); ctx.restore();
  }
  function lbl(ctx, text, x, y, color, sz, o) { o = o || {}; F.hand(ctx, text, x, y, sz || 15, color || P.chalk, { outline: 4, outlineColor: 'rgba(20,20,50,.8)', seed: text, align: o.align, reveal: o.reveal }); }
  var ph = function (W) { return W < 500; };

  /* cassette with the in-scene question on its label */
  function cassette(ctx, W, t, a, spin) {
    if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
    var cw = Math.min(W - 40, 360), ch = ph(W) ? 64 : 76, cx = W / 2, cy = ph(W) ? 44 : 50;
    F.paper(ctx, cx, cy, cw, ch, '#3a3550', { seed: 'vhs', rot: -.01 });
    F.paper(ctx, cx, cy - ch * .12, cw * .82, ch * .5, P.cream, { seed: 'vhslabel', shadow: false });
    F.hand(ctx, "haven't I seen this before?", cx, cy - ch * .12, ph(W) ? 15 : 18, P.ink, { seed: 'q7' });
    [-1, 1].forEach(function (s) { var rx = cx + s * cw * .22, ry = cy + ch * .28; ctx.fillStyle = '#1c1a2a'; ctx.beginPath(); ctx.arc(rx, ry, 9, 0, 6.283); ctx.fill();
      ctx.strokeStyle = P.chalk; ctx.lineWidth = 1.5; for (var k = 0; k < 3; k++) { var an = spin + k * 2.094; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + Math.cos(an) * 7, ry + Math.sin(an) * 7); ctx.stroke(); } });
    F.tape(ctx, cx - cw * .42, cy - ch * .45, 34, -.5);
    ctx.restore();
  }
  /* the tape as two rows: PLAY and RERUN, so twins line up vertically */
  var G = {};
  function layout(W, H, n, y0) {
    var pad = ph(W) ? 36 : 70, cw = Math.min(ph(W) ? 86 : 124, (W - pad - 14) / n), gap = ph(W) ? 64 : 96;
    G = { n: n, cw: cw, x0: pad + (W - pad - 14 - cw * n) / 2, y: [y0, y0 + gap], ch: ph(W) ? 34 : 50 };
    return G;
  }
  function cardXY(i) { var r = i < G.n ? 0 : 1, c = i % G.n; return [G.x0 + c * G.cw + G.cw / 2, G.y[r]]; }
  function drawTape(ctx, W, toks, appear, hi, o) {
    o = o || {}; var sz = Math.min(ph(G.cw * 8) ? 14 : 19, G.cw * .23);
    ['PLAY', 'RERUN'].forEach(function (s, r) {
      F.paper(ctx, W / 2 + 10, G.y[r], G.cw * G.n + 18, G.ch + 12, '#2b2740', { seed: 'strip' + r, shadow: false });
      F.hand(ctx, s, G.x0 - 6, G.y[r], ph(W) ? 9 : 12, P.butter, { align: 'right', seed: s, font: F.MONO, bold: false, wobble: 0 });
    });
    for (var i = 0; i < toks.length; i++) {
      var a = clamp(appear * toks.length - i, 0, 1); if (a <= 0) continue;
      var p = cardXY(i), col = hi && hi[i] ? hi[i] : P.cream;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(p[0], p[1] + (1 - a) * -10);
      F.paper(ctx, 0, 0, G.cw - 5, G.ch, col, { seed: 'c' + i, rot: ((i * 7) % 5 - 2) * .012, blur: 4, lift: 2 });
      F.hand(ctx, VOC[toks[i]], 0, 0, sz, P.ink, { seed: 'v' + toks[i], wobble: .4 });
      ctx.restore();
    }
  }
  function heat(ctx, x, y, s, A, n, a, title, fuzzy) {
    var L = A.length, c = s / L; ctx.save(); ctx.globalAlpha = a;
    F.paper(ctx, x + s / 2, y + s / 2, s + 16, s + 16, P.cream, { seed: 'heat', rot: .01 });
    for (var i = 0; i < L; i++) for (var j = 0; j < L; j++) {
      var v = j <= i ? A[i][j] : -1;
      ctx.fillStyle = v < 0 ? 'rgba(42,41,52,.08)' : 'rgb(' + Math.round(lerp(247, 232, v)) + ',' + Math.round(lerp(240, 116, v)) + ',' + Math.round(lerp(225, 124, v)) + ')';
      ctx.fillRect(x + j * c + .5, y + i * c + .5, c - 1, c - 1);
    }
    if (title) F.hand(ctx, title, x + s / 2, y - 16, ph(ctx.canvas.width / 2) ? 13 : 15, P.chalk, { seed: title, outline: 4, outlineColor: 'rgba(20,20,50,.8)' });
    ctx.restore();
  }
  function mindEgg(ctx, x, y, s, t, clear, feats) { F.egg(ctx, x, y, s, t, { clear: clear, features: feats || [] }); }
  /* pass 2: the clerks are stick figures. BT is set by the beat wrapper; at(x) = global time when scene time x happened. */
  var BT = { g0: 0, from: 0 };
  function at(x) { return BT.g0 + (x - BT.from); }
  function act(l, keys, o) { var k = null, prev = 'idle'; keys.forEach(function (e) { if (l >= e[0]) { if (k) prev = k[1]; k = e; } }); o = o || {}; if (!k) return o; o.pose = k[1]; o.t0 = at(k[0]); o.from = prev; return o; }
  function clerk(ctx, x, y, s, t, o, name) { var r = F.stick(ctx, x, y, s, t, o); if (name) lbl(ctx, name, x, y + 12, o.scarf || P.chalk, 12); return r; }

  /* ---------------- probe / steer / SAE toy data ---------------- */
  var PR = (function () { var r = F.rng('probe7'), pts = []; for (var i = 0; i < 40; i++) { var tr = i % 2 === 0, g1 = Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(6.283 * r()), g2 = Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(6.283 * r());
      pts.push({ x: (tr ? .9 : -.9) * .72 + g1 * .42 + g2 * .2, y: (tr ? .9 : -.9) * .5 + g2 * .42, tr: tr }); }
    var mt = [0, 0], mf = [0, 0]; pts.forEach(function (p) { var m = p.tr ? mt : mf; m[0] += p.x / 20; m[1] += p.y / 20; });
    var w = [mt[0] - mf[0], mt[1] - mf[1]], wn = Math.hypot(w[0], w[1]); w = [w[0] / wn, w[1] / wn];
    var mid = ((mt[0] + mf[0]) * w[0] + (mt[1] + mf[1]) * w[1]) / 2, ok = 0;
    pts.forEach(function (p) { if ((p.x * w[0] + p.y * w[1] > mid) === p.tr) ok++; });
    return { pts: pts, w: w, mid: mid, acc: ok / pts.length };
  })();
  // SAE toy: 3 sparse features in a 3-d hidden space; one busy neuron reads all three
  var SD = [[.8, .45, .4], [.7, -.6, .38], [.9, .1, -.43]].map(function (d) { var n = Math.hypot(d[0], d[1], d[2]); return d.map(function (x) { return x / n; }); });
  function featAt(k, tt) { var r = F.rng('f' + k + '_' + Math.floor(tt * 2.2)); return r() < .28 ? .6 + r() * .4 : 0; }
  function hidden(tt) { var h = [0, 0, 0]; for (var k = 0; k < 3; k++) { var f = featAt(k, tt); for (var j = 0; j < 3; j++) h[j] += f * SD[k][j]; } return h; }
  function saeEnc(h) { return SD.map(function (d) { return Math.max(0, dot(d, h) - .25); }); }

  /* steering: mood = sigmoid(4 * w.h), h = h0 + coef * v */
  var H0 = [-.35, .2], VST = [.8, .6], WM = [.8, .6];
  function mood(coef) { var h = [H0[0] + coef * VST[0], H0[1] + coef * VST[1]]; return { h: h, m: 1 / (1 + Math.exp(-4 * dot(WM, h))) }; }
  function moodFace(ctx, x, y, s, m) {
    ctx.save(); ctx.strokeStyle = P.ink; ctx.lineWidth = 2.2; ctx.fillStyle = P.ink;
    ctx.beginPath(); ctx.arc(x - s * .25, y - s * .1, 2.4, 0, 6.283); ctx.arc(x + s * .25, y - s * .1, 2.4, 0, 6.283); ctx.fill();
    var c = (m - .5) * 2; ctx.beginPath(); ctx.moveTo(x - s * .28, y + s * .22); ctx.quadraticCurveTo(x, y + s * .22 + c * s * .3, x + s * .28, y + s * .22); ctx.stroke(); ctx.restore();
  }
  function tapeTop(W) { return ph(W) ? 118 : 140; }

  var SC = [  // pass-2: scenes; captions live in the beats below
    { name: 'the tape', start: 0, dur: 5, draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); cassette(ctx, W, t, ramp(l, 0, .6), t * 3); layout(W, H, N, tapeTop(W));
        drawTape(ctx, W, TOK, ramp(l, .6, 4.2));
        mindEgg(ctx, W / 2, H - (ph(W) ? 110 : 120), ph(W) ? 52 : 60, t, .15);
        if (l > 3.5) lbl(ctx, 'what comes next?', W / 2, H - (ph(W) ? 200 : 215), P.butter, ph(W) ? 16 : 19, { reveal: ramp(l, 3.5, 4.5) });
      } },
    { name: 'previous-token head', start: 5, dur: 7, draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); cassette(ctx, W, t, 1, t * 3); layout(W, H, N, tapeTop(W));
        var L = TOK.length, cur = Math.min(L - 1, 1 + Math.floor(l / 6.2 * (L - 1)));
        var hi = {}; hi[cur] = P.butter; drawTape(ctx, W, TOK, 1, hi);
        var A = M.Ap[cur], pc = cardXY(cur);
        for (var j = 0; j <= cur; j++) { if (A[j] < .01) continue; var pj = cardXY(j); ctx.save(); ctx.globalAlpha = Math.min(1, A[j] + .1); F.arrow(ctx, pc[0], pc[1] - G.ch / 2, pj[0] + 4, pj[1] - G.ch / 2 - 2, P.pink, 1 + 3 * A[j], 'pv' + cur + j); ctx.restore(); }
        // stamps under cards already visited
        for (var i = 1; i <= cur; i++) { var p = cardXY(i), prev = TOK[i - 1]; ctx.save(); ctx.globalAlpha = i === cur ? ramp((l / 6.2 * (L - 1)) % 1, 0, .4) : .95; ctx.translate(p[0], p[1] + G.ch * .72); ctx.rotate(-.12);
          ctx.strokeStyle = P.red; ctx.lineWidth = 1.5; ctx.strokeRect(-G.cw * .42, -8, G.cw * .84, 16); F.hand(ctx, 'after ' + VOC[prev], 0, 0, Math.min(ph(G.cw * 8) ? 10 : 13, G.cw * .15), P.red, { seed: 's' + i, wobble: .2 }); ctx.restore(); }
        var ys = G.y[1] + G.ch + 60, es = ph(W) ? Math.min(70, (H - ys - 120) * .35) : 80;
        mindEgg(ctx, W / 2, H - es * 1.4 - 20, es, t, .3, [{ x: -.3, y: -.1, on: A[cur - 1], c: 'rgba(243,179,195,.9)' }]);
        var pp = cardXY(cur - 1); clerk(ctx, W / 2 + es * 1.7, H - 22 - es * .35, es * 1.15, t, act(l, [[0, 'walk'], [.3, 'point']], { face: -1, scarf: P.pink, look: { x: pp[0], y: pp[1] } }), 'clerk 1');
        lbl(ctx, 'stamp: "I came after ' + VOC[TOK[cur - 1]] + '"', W / 2, ys + 100, P.pink, ph(W) ? 16 : 19);
        readout(ctx, 12, ys, [['clerk 1 at pos ' + cur, P.butter], ['attn on pos ' + (cur - 1) + ' = ' + A[cur - 1].toFixed(3), P.pink], ['attn elsewhere = ' + (1 - A[cur - 1]).toFixed(3)]], W);
      } },
    { name: 'induction head', start: 12, dur: 8, draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); cassette(ctx, W, t, 1, t * 3); layout(W, H, N, tapeTop(W));
        var step = 7.6 / N, k = Math.min(N - 1, Math.floor(l / step)), fr = (l % step) / step, i = N + k, j = i - N + 1;
        var hi = {}; hi[i] = P.butter; if (fr > .35) hi[j] = P.mint; drawTape(ctx, W, TOK, 1, hi);
        // score bars under the PLAY row (real dot products)
        var sc = M.Sc[i], A = M.Ai[i];
        for (var q = 0; q <= Math.min(i, N - 1); q++) { var p = cardXY(q), v = sc[q] / 8; ctx.fillStyle = v > 0 ? P.mint : P.pink; var bh = clamp(v, -1, 1) * 20 * ramp(fr, 0, .3);
          ctx.fillRect(p[0] - 4, G.y[0] + G.ch / 2 + 26 - Math.max(0, bh), 8, Math.abs(bh)); }
        var pi = cardXY(i), pj = cardXY(j);
        if (fr > .35) { var pf = ramp(fr, .4, .85); F.arrow(ctx, pi[0], pi[1] - G.ch / 2, pj[0], pj[1] + G.ch / 2 + 30, P.mint, 3, 'ind' + i);
          F.plane(ctx, lerp(pj[0], pi[0] + G.cw * .6, pf), lerp(pj[1], pi[1] + G.ch + 40, pf) - Math.sin(pf * 3.14) * 40, 11, .4, P.cream); }
        var py = G.y[1] + G.ch + 58;
        if (fr > .7) { F.note(ctx, 'next: ' + VOC[M.pred[i].tok], clamp(pi[0], 70, W - 70), py, ph(W) ? 14 : 17, { color: P.mint, seed: 'nx' + i, tape: false }); }
        readout(ctx, 12, G.y[1] + G.ch + (ph(W) ? 110 : 100), [['E[' + VOC[TOK[i]] + ']·stamp[' + j + '] = ' + (sc[j] / 8).toFixed(2), P.mint], ['attn[' + i + ',' + j + '] = ' + A[j].toFixed(3), P.butter], ['p(' + VOC[TOK[i + 1] != null ? TOK[i + 1] : TOK[i]] + ') = ' + (i < TOK.length - 1 ? M.pred[i].p[TOK[i + 1]].toFixed(3) : '(end)')]], W);
        var es2 = ph(W) ? Math.min(66, (H - G.y[1] - 260) * .33) : 80; mindEgg(ctx, W / 2, H - es2 * 1.4 - 20, es2, t, .45, [{ x: 0, y: -.2, on: ramp(fr, .7, .9) }]);
        clerk(ctx, W / 2 + es2 * 1.7, H - 22 - es2 * .35, es2 * 1.15, t, act(l, [[k * step, 'lean-in'], [(k + .35) * step, 'point'], [(k + .72) * step, 'cheer']], { face: -1, scarf: P.mint, look: { x: pj[0], y: pj[1] } }), 'clerk 2');
      } },
    { name: 'QK and OV', start: 20, dur: 7, draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t);
        var s = Math.min(W - 60, H * .5, 380), x = (W - s) / 2, y = ph(W) ? 44 : 50;
        heat(ctx, x, y, s, M.Ai, N, ramp(l, 0, .8), 'induction head: who looks at whom');
        var c = s / TOK.length;
        if (l > 1.5) { ctx.save(); ctx.globalAlpha = ramp(l, 1.5, 2.5); ctx.strokeStyle = P.teal; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
          ctx.beginPath(); ctx.moveTo(x + 1 * c + c / 2, y + N * c + c / 2); ctx.lineTo(x + N * c - c / 2, y + (2 * N - 1) * c + c / 2); ctx.stroke(); ctx.restore(); }
        F.hand(ctx, 'key position j →', x + s / 2, y + s + 22, 12, P.chalk, { seed: 'kj' });
        var sy = y + s + 70, sz = ph(W) ? 15 : 18;
        if (l > 2.4) { ctx.save(); ctx.globalAlpha = ramp(l, 2.4, 3); F.note(ctx, 'QK: where to look', W * .28, sy, sz, { color: P.pink, rot: -.06, seed: 'qk' }); ctx.restore(); }
        if (l > 3.4) { ctx.save(); ctx.globalAlpha = ramp(l, 3.4, 4); F.note(ctx, 'OV: what to move', W * .72, sy + (ph(W) ? 44 : 0), sz, { color: P.mint, rot: .05, seed: 'ov' }); ctx.restore(); }
        readout(ctx, W - 12, H - 58, [['diagonal(-n+1).mean() = ' + M.score.toFixed(3), P.teal]], W, true);
      } },
    { name: 'loss on the rerun', start: 27, dur: 4, draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t);
        var gw = Math.min(W - 40, 440), gh = gw * .74, gx = (W - gw) / 2, gy = Math.max(20, (H - gh) / 2 - 30);
        var r = F.gameboy(ctx, gx, gy, gw, gh, { label: 'SURPRISE BOY' }), L = TOK.length - 1, bw = (r.w - 20) / L, n = Math.ceil(ramp(l, .2, 2.4) * L);
        for (var i = 0; i < n; i++) { var v = M.loss[i], h = clamp(v / 3, 0, 1) * (r.h - 40); ctx.fillStyle = i < N ? '#6b2f3a' : '#2f5d3a'; ctx.fillRect(r.x + 10 + i * bw + 2, r.y + r.h - 22 - h, bw - 4, h); }
        ctx.fillStyle = '#2f3d2a'; ctx.font = '700 11px ' + F.MONO; ctx.fillText('PLAY', r.x + 10, r.y + r.h - 7); ctx.fillText('RERUN', r.x + 10 + N * bw, r.y + r.h - 7);
        ctx.strokeStyle = 'rgba(40,50,30,.6)'; ctx.setLineDash([4, 4]); var ly = r.y + r.h - 22 - Math.log(12) / 3 * (r.h - 40); ctx.beginPath(); ctx.moveTo(r.x + 6, ly); ctx.lineTo(r.x + r.w - 6, ly); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillText('ln 12', r.x + r.w - 44, ly - 5);

  /* ---------------- pass 2: caption beats ----------------
     beat(scene, from, to, dur, need, cap): plays scene seconds [from, to], then holds the last frame for the rest of dur.
     need: core | exercise | library | contested */
  /* UPDATE 2: one small on-screen credit line when a beat borrows a framing (hub link in the coda) */
  function credit(ctx, W, txt) { if (!txt) return; ctx.save(); ctx.globalAlpha = 1; ctx.font = '600 11px system-ui, -apple-system, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'top'; var w = ctx.measureText(txt).width; ctx.fillStyle = 'rgba(20,22,52,.7)'; ctx.fillRect(W - w - 17, 4, w + 12, 17); ctx.fillStyle = '#b9e3cc'; ctx.fillText(txt, W - 11, 7); ctx.restore(); }
  function beat(c, from, to, dur, need, cap, name, cr) {
    return { name: name || c.name, dur: dur, need: need, cap: cap, draw: function (ctx, t, l, W, H, api) { BT.g0 = t - l; BT.from = from; var r = c.draw.call(c, ctx, t, from + Math.min(l, to - from), W, H, api); credit(ctx, W, cr); return r; } };
  }
  function seq(list) { var s = 0; list.forEach(function (c) { c.start = s; s += c.dur; }); return list; }
  var chapters = seq([
    beat(SC[0], 0, 5, 7, 'core', {
      1: 'A paper VHS tape of random words, played <b>twice</b>. The first time, nobody can guess what comes next. The second time... you have seen this before.',
      2: 'Random tokens, then the same tokens again. On the first play a model can only guess. On the rerun it could <b>copy</b> from last time, if it has the right circuit.',
      3: 'ARENA\'s rep_tokens: (BOS, *rand, *rand). Low loss on the second half is the classic induction-head signature. Here seq_len n = 6, vocab 12, d = 24, all computed live.' }),
    beat(SC[1], 0, 7, 8, 'core', {
      1: 'Clerk one has a simple job: look at the word <b>just before</b> you and stamp it on your card: "I came after Furby." It never cares what the words are, only where they sit.',
      2: 'A <b>previous-token head</b>: its query and key read positions only, so nearly all attention lands one step back. What it carries over (the earlier word) is its output: the stamp.',
      3: 'q_i = β·pos(i−1), k_j = pos(j), A = softmax over j ≤ i, β = 30. Stamp s_j = Σ_k A[j,k] E[t_k]: the head\'s OV output, which the next layer reads.' }, 'clerk one: look back'),
    beat(SC[2], 0, 8, 9, 'core', {
      1: 'Clerk two, on the rerun: "I am Nokia. Who has a stamp saying <b>after Nokia</b>?" It finds that card and <b>copies</b> its word. Your phone does this when it suggests a name you just typed.',
      2: 'The <b>induction head</b> compares its own word with every stamp (a dot product), softmaxes, and copies the winner. A B … A → predict B. <b>Why useful?</b> Text repeats itself.',
      3: 'score[i,j] = β₂·E[t_i]·s_j (β₂ = 8), softmax over j ≤ i; out_i = Σ_j A[i,j] E[t_j]; logits = γ E·out_i. The match sits at j = i − n + 1: the (1 − seq_len) diagonal.' }, 'clerk two: copy'),
    beat(SC[3], 0, 7, 9, 'core', {
      1: 'Each clerk really does <b>two separate jobs</b>: choosing <b>where to look</b>, and choosing <b>what to carry back</b>. The bright stripe is clerk two looking at "the card after my twin".',
      2: '<b>QK circuit</b> (W_Q, W_K): which positions get attention; the heatmap. <b>OV circuit</b> (W_V, W_O): what gets moved once you look; the copied word. Each can be studied alone.',
      3: 'W_QK = W_Q W_Kᵀ sets the stripe; W_OV = W_V W_O sets the copy. For a copying head the full OV circuit W_E W_OV W_U is close to the identity: attend to X, predict X.' }, 'QK and OV'),
    beat(SC[4], 0, 4, 7, 'core', {
      1: 'Scoreboard: how surprised the mind is at each word. First play: very. Rerun: <b>barely</b>. Surprise that collapses on the rerun is the clue that copying happened.',
      2: 'Per-token loss from the toy. First half ≈ ln 12 ≈ 2.5 (guessing among 12 words). Second half collapses once the induction head can copy.',
      3: 'Cross-entropy −log p(t_{i+1}) per position; ARENA plots exactly this. In real training induction heads form in a sudden phase change, seen as a bump in the loss curve.' }, 'loss on the rerun'),
    beat(SC[5], 0, 5, 8, 'core', {
      1: 'New tool: a <b>ruler</b>. Lay it across the mind\'s inner dots and true sentences land on one side, false on the other. The mind was keeping track all along.',
      2: 'Directions carry meaning (like woman − man ≈ queen − king). A <b>linear probe</b> is one direction that splits a concept: here, the gap between cloud means. Decodable ≠ used.',
      3: 'w = μ_true − μ_false (normalised), threshold at the midpoint. ARENA builds MMProbe (mean difference) and LRProbe (logistic regression). Decodable is not the same as used.' }, 'probe', 'Framing: 3Blue1Brown, neural-network series'),
    beat(SC[6], 0, 5, 9, 'contested', {
      1: 'Once we can <b>read</b> the mood we can nudge it: push a chalk arrow into the inner state mid-thought and the mood dial moves. How reliably this works is still argued about.',
      2: 'Current method: a <b>steering vector</b>, adding coef × v at one layer. Emerging research: effects vary a lot across prompts and can hurt fluency. You need: small coef, measure side effects.',
      3: 'h ← h + coef·v; mood = σ(4 w·h). ARENA\'s hook adds steering_coef · norm · v_normed to hidden_states. Too big a coef pushes activations off-distribution: gibberish.' }, 'steer'),
    beat(SC[7], 0, 5, 9, 'contested', {
      1: 'One inner light was flickering for <b>three different reasons</b>. A sparse autoencoder hangs one lantern per idea, so each lights for one thing only. How well that scales is debated.',
      2: 'Current method: <b>SAEs</b> split busy neurons into sparse features. Emerging: transcoders, crosscoders; some teams find SAEs lose to plain probes on real tasks. You need: the idea.',
      3: 'a = ReLU(W_enc h + b_enc), ĥ = W_dec a, loss = reconstruction + L1 sparsity. Here W_enc rows are the true d_k, b = −0.25. Real SAEs must learn d_k; dead and split latents are common.' }, 'SAE'),
    beat(SC[8], 0, 5, 8, 'contested', {
      1: 'Honest bit: real clerks are <b>messy</b>. They share jobs, do several at once, and their stripes are smudged, not neat.',
      2: 'Induction heads show up in many models. Open: how far tidy circuit stories hold in big models, where heads share work and backups step in. You need: the A B … A → B test.',
      3: 'Here β₂ = 2.5 plus score noise: the stripe blurs and the diagonal score drops. Real heads are polysemantic; backup heads and cross-layer composition blur single-head stories.' }, 'where it stops'),
    beat(SC[9], 0, 7, 8, 'exercise', {
      1: 'Everything you just watched is a few lines of code. The stripe is a diagonal. The copier is a matrix product. The nudge is one addition.',
      2: 'The tape becomes ARENA\'s induction detector, the stamps become the OV circuit, the chalk arrow becomes a steering hook. You write all three this week.',
      3: 'ARENA [1.2]: pattern.diagonal(-seq_len + 1).mean(); full_OV_circuit = FactoredMatrix(W_E @ W_V, W_O @ W_U); the hook adds steering_coef * norm * v_normed.' }, 'the code'),
    beat(SC[10], 0, 4, 6, 'core', {
      1: 'The order matters: first learn to <b>read</b> a mind; only then <b>steer</b> it, gently. <b>Ask yourself:</b> what evidence would show a probe found what the model <i>uses</i>?',
      2: 'Reading circuits tells us which knob does what. Steering without reading is turning dials in the dark.',
      3: 'Interpretability before intervention: a steering vector found by a probe is only as trustworthy as the probe. Small coefficients, check side effects, measure.' }, 'read first')
  ]);
