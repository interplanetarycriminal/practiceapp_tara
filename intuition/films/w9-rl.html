      if (C.last) lines = lines.concat(tdLines(C.last).slice(1).map(function (x) { return [x[0].replace('0.9·', C.gamma.toFixed(2) + '·'), x[1]]; }));
      readout(ctx, L.px, L.py, lines, L.pw);
    }
  };
