var W13 = (function () {
  'use strict';
  /* resampling importance: cut the chain of thought before sentence i, resample N rollouts, count answers */
  var SENT = ['Mia buys 3 bags of 4 apples.', 'That makes 12 apples.', 'Wait: she gives half away.', 'So 12 / 2 = 6 left.', 'Plus the 2 she had: 8.', 'Answer: 8'];
  var ANS = ['8', '14', 'other'];

  function importance() { var out = []; for (var i = 0; i < SENT.length - 1; i++) out.push(KL(dist(counts(i + 1)), dist(counts(i)))); return out; }

  /* persona axis: h = a*v + b*u (v = Assistant axis, u = an orthogonal "role-play" direction) */
  var V = [.8, .6, 0], U = [-.6, .8, 0], Z = [0, 0, 1];

  function cap(h, lo, hi) { var p = dot(h, V), q = Math.min(hi, Math.max(lo, p)); return add(h, V, q - p); } // clamp projection into [lo, hi]

  var TOK = ['"Happy to help."', '"Arr, matey!"', '"I am the void."'];
  var WU = [add([0, 0, 0], V, 1.2), add(add([0, 0, 0], U, 1.1), V, -.6), add(add([0, 0, 0], V, -1.0), U, .3)];

})();

        bg(ctx, W, H, t); var g = ramp(l, 2.5, 4); var R = notebook(ctx, W, H, { glow: [0, 0, g * (.8 + .2 * Math.sin(t * 4)), 0, 0, 0] });
        if (g > .3) F.lantern(ctx, R.x + R.w - 22, R.y + 14 + 2.5 * R.lh, 11, g, t);
        impChart(ctx, W, R.y + R.h + 50, small(W) ? 150 : 170, ramp(l, 0, 2.8) * IMP.length, 2);

      } },
    { name: 'the mask wardrobe', dur: 9, need: 'core', pose: 'point', cap: {
        1: 'Second experiment. Inside the model, characters sit along a line, like masks on a rail: helpful <b>Assistant</b> at one end, pirates and ghosts at the other. Where is a thought on the rail?',

        3: 'Axis from contrasting mean activations: Assistant vs role-played personas (ARENA [4.4], <code>project_onto_axis</code>). A linear probe is the same move plus a sigmoid: σ(h·w + b).' },

    { name: 'the overnight run', dur: 9, need: 'core', pose: function (l) { return l < 4 ? 'write' : 'slump'; }, cap: {
        1: 'A good capstone is small and clean: <b>one thing to measure</b>, <b>one thing to change</b>, <b>one fair comparison</b>. Before you run it, ask: what result would change my mind?',
        2: 'Design: one metric (drift rate or importance), one intervention (capping, or deleting the anchor), one control (a random direction, or a random sentence). Then run it overnight.',
        3: 'Pre-register the metric, fix seeds, log N. The control matters most: capping a random unit vector of the same norm tells you whether the effect is the axis or just the edit.' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var sz = small(W) ? 17 : 22, cards = [['one metric', 'drift rate'], ['one intervention', 'cap the axis'], ['one control', 'cap a random v']];
        cards.forEach(function (c, i) { var a = ramp(l, i * .7, i * .7 + .7); if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
          var y = (small(W) ? 80 : 110) + i * (sz * 3.6); F.note(ctx, c[0] + ':  ' + c[1], W / 2 + (i - 1) * 10, y, sz, { color: [P.butter, P.mint, P.sky][i], seed: 'card' + i, rot: (i - 1) * .03 }); ctx.restore(); });
        var w = Math.min(W - 60, 300); vhs(ctx, W / 2, H * .7, w, t, ramp(l, 2, 6));

    { name: 'where it stops being true', dur: 9, need: 'contested', pose: 'shrug', cap: {
        1: 'Honest bit: <b>estimates, not mind-reading</b>. 40 rewrites is a small sample, and written reasoning may not show how the model really decided. <b>You need:</b> error bars and a control.',

      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var R = notebook(ctx, W, H, { glow: [0, 0, .7, 0, 0, 0] }); impChart(ctx, W, R.y + R.h + 50, small(W) ? 150 : 170, IMP.length, 2);

          F.hand(ctx, 'estimates,', x, y - sz * 1.4, sz, P.ink, { seed: 'r1', rot: -.6 }); F.hand(ctx, 'not mind-reading', x + sz * .8, y, sz, P.ink, { seed: 'r2', rot: -.6 }); ctx.restore(); }

        ctx.save(); ctx.globalAlpha = ramp(l, .2, 1); F.note(ctx, 'measuring inside a model\nis how we steer it safely', W / 2, small(W) ? 44 : 64, small(W) ? 17 : 24, { color: P.pink, seed: 'steer', rot: .02 }); ctx.restore();
