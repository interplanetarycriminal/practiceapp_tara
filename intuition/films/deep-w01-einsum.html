<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Einsum: the one-line contract</title>
<meta name="theme-color" content="#1c2140">
<style>
#predict{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(18,20,44,.72);z-index:5;padding:16px;box-sizing:border-box}
#predict.on{display:flex}
#predict .card{background:#fbf6ea;color:#2a2934;border-radius:6px;max-width:420px;width:100%;padding:16px 16px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);transform:rotate(-.6deg);font:15px/1.35 system-ui,-apple-system,'Segoe UI',sans-serif}
#predict h3{margin:0 0 4px;font:700 19px 'Comic Neue','Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive}
#predict p{margin:0 0 10px;font-size:14px;color:#4a4858}
#predict code{font-size:12.5px;background:#efe6cf;padding:1px 3px;border-radius:3px}
#predict .opts{display:grid;gap:7px;grid-template-columns:1fr 1fr}
#predict .opts button{font:15px ui-monospace,'SF Mono',Menlo,Consolas,monospace;text-align:center;background:#f7e3a0;color:#2a2934;border:0;border-radius:8px;padding:9px 11px;min-height:42px;cursor:pointer}
#predict .opts button.skipq{background:#e6e1f2;grid-column:1 / -1;font-family:system-ui,sans-serif}
#predict .fb{margin-top:10px;font-weight:600;min-height:1.2em}
.ein-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.ein-row input[type=text]{font:15px ui-monospace,'SF Mono',Menlo,Consolas,monospace;flex:1 1 220px;min-width:0;padding:7px 8px;border-radius:6px;border:1px solid #9aa0c8;background:#fbf6ea;color:#2a2934}
.ein-row select{font:14px system-ui,sans-serif;padding:5px;border-radius:6px}
</style>
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;

  /* ================= a real (tiny) einsum: every number on screen comes from here ================= */
  function parse(pat) {
    var s = pat.split('->'); if (s.length !== 2) throw new Error('a contract needs exactly one "->"');
    var ins = s[0].split(',').map(function (t) { return t.trim().split(/\s+/).filter(Boolean); });
    var out = s[1].trim().split(/\s+/).filter(Boolean);
    ins.forEach(function (x, i) { if (!x.length) throw new Error('input ' + (i + 1) + ' has no letters'); });
    return { ins: ins, out: out };
  }
  function shapeOf(T) { var s = []; while (Array.isArray(T)) { s.push(T.length); T = T[0]; } return s; }
  function at(T, idx) { for (var i = 0; i < idx.length; i++) T = T[idx[i]]; return T; }
  function einsum(pat, Ts) {
    var p = parse(pat), sizes = {}, order = [];
    if (p.ins.length !== Ts.length) throw new Error('pattern has ' + p.ins.length + ' inputs, you gave ' + Ts.length);
    p.ins.forEach(function (lets, n) {
      var sh = shapeOf(Ts[n]);
      if (sh.length !== lets.length) throw new Error('input ' + (n + 1) + ' has ' + sh.length + ' axes, pattern names ' + lets.length);
      lets.forEach(function (L, a) {
        if (sizes[L] == null) { sizes[L] = sh[a]; order.push(L); }
        else if (sizes[L] !== sh[a]) throw new Error('"' + L + '" is ' + sizes[L] + ' in one place and ' + sh[a] + ' in another');
      });
    });
    var seen = {};
    p.out.forEach(function (L) {
      if (sizes[L] == null) throw new Error('"' + L + '" is in the output but in no input');
      if (seen[L]) throw new Error('"' + L + '" appears twice in the output'); seen[L] = 1;
    });
    var outShape = p.out.map(function (L) { return sizes[L]; }), n = outShape.reduce(function (a, b) { return a * b; }, 1), flat = [];
    for (var z = 0; z < n; z++) flat.push(0);
    var val = {}, total = order.reduce(function (a, L) { return a * sizes[L]; }, 1);
    for (var c = 0; c < total; c++) {
      var r = c; for (var q = order.length - 1; q >= 0; q--) { val[order[q]] = r % sizes[order[q]]; r = Math.floor(r / sizes[order[q]]); }
      var prod = 1; for (var m = 0; m < Ts.length; m++) prod *= at(Ts[m], p.ins[m].map(function (L) { return val[L]; }));
      var o = 0; for (var d = 0; d < p.out.length; d++) o = o * sizes[p.out[d]] + val[p.out[d]];
      flat[o] += prod;
    }
    function nest(dim, off) { if (dim === outShape.length) return flat[off]; var a = [], stride = outShape.slice(dim + 1).reduce(function (x, y) { return x * y; }, 1); for (var i = 0; i < outShape[dim]; i++) a.push(nest(dim + 1, off + i * stride)); return a; }
    return { shape: outShape, out: nest(0, 0), sizes: sizes, parsed: p, mults: total };
  }
  function fate(p) { // the three rules, per letter
    var f = {}, cnt = {};
    p.ins.forEach(function (l) { var u = {}; l.forEach(function (L) { if (!u[L]) { u[L] = 1; cnt[L] = (cnt[L] || 0) + 1; } }); });
    Object.keys(cnt).forEach(function (L) { f[L] = p.out.indexOf(L) >= 0 ? 'kept' : cnt[L] > 1 ? 'multiplied & summed' : 'summed away'; });
    return f;
  }

  // the tensors of the film (small integers so you can check them in your head)
  var M = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];
  var A = [[1, 2, 0], [0, 1, 3]], B = [[1, 0], [2, 1], [0, 2]];
  var AB = einsum('i j, j k -> i k', [A, B]).out, ROWS = einsum('i j -> i', [A]).out;
  var TR = einsum('i i ->', [M]).out;
  var Xb = [[[1, 2], [3, 4]], [[0, 1], [1, 0]]], Yb = [[[2, 0], [1, 1]], [[1, 2], [3, 4]]];
  var BMM = einsum('b i j, b j k -> b i k', [Xb, Yb]).out;
  var u = [1, 2, 3], w = [1, 0, -1, 2], OUT = einsum('i, j -> i j', [u, w]).out;
  // attention: batch 1, 3 positions, 1 head, d 2 (q, k as [batch, pos, head, d])
  var TOKS = ['the', 'cat', 'sat'];
  var Q = [[[[1, 0]], [[0, 1]], [[1, 1]]]], K = [[[[2, 0]], [[1, 1]], [[0, 2]]]];
  var APAT = 'batch posq head d, batch posk head d -> batch head posq posk';
  var ATT = einsum(APAT, [Q, K]);
  var SC = ATT.out[0][0];
  function zeros(s) { return s.length ? Array.apply(null, Array(s[0])).map(function () { return zeros(s.slice(1)); }) : 0; }
  var BIG = einsum(APAT, [zeros([2, 4, 3, 8]), zeros([2, 4, 3, 8])]); // the predict question, answered by the same function
  var BIGSHAPE = '(' + BIG.shape.join(', ') + ')';

  /* ================= drawing helpers ================= */
  var LC = { i: P.pink, j: P.butter, k: P.teal, b: P.lav, batch: P.lav, posq: P.pink, posk: P.teal, head: P.orange, d: P.butter };
  function lcol(L) { return LC[L] || P.mint; }
  function bg(ctx, W, H, t) { F.sky(ctx, W, H, P.night, '#2b2f5c'); F.stars(ctx, W, H, t, 'dw1', 36); }
  function txt(ctx, s, x, y, sz, col, o) { o = o || {}; return F.hand(ctx, s, x, y, sz, col || P.chalk, { align: o.align, font: o.mono ? F.MONO : undefined, bold: o.mono ? false : undefined, wobble: o.mono ? .2 : 1, seed: o.seed || s, reveal: o.reveal, outline: o.outline }); }
  function mono(ctx, s, x, y, sz, col, align, reveal) { return txt(ctx, s, x, y, sz, col, { mono: true, align: align || 'left', reveal: reveal }); }
  function ph(W) { return W < 560; }
  // a pattern written with every letter in its own colour; hi = letter to glow; lines split at ',' and '->' when narrow
  function contract(ctx, pat, x, y, sz, o) {
    o = o || {}; var p = pat.replace(/\s*,\s*/g, ', ').replace(/\s*->\s*/g, ' -> ');
    var lines = o.split ? p.replace(', ', ',\n').replace(' -> ', '\n-> ').split('\n') : [p];
    ctx.save(); ctx.font = sz + 'px ' + F.MONO; ctx.textBaseline = 'middle';
    var cw = ctx.measureText('m').width, maxw = 0; lines.forEach(function (Ln) { maxw = Math.max(maxw, Ln.length * cw); });
    lines.forEach(function (Ln, li) {
      var cx = o.align === 'left' ? x : x - maxw / 2, yy = y + li * sz * 1.45;
      Ln.split(/(\s+|,|->)/).forEach(function (tok) {
        if (!tok) return; var isL = /^[a-z_]+$/i.test(tok), col = isL ? lcol(tok) : P.chalk;
        if (isL && o.hi && o.hi.indexOf(tok) >= 0) { ctx.fillStyle = 'rgba(247,227,160,.25)'; ctx.fillRect(cx - 2, yy - sz * .7, tok.length * cw + 4, sz * 1.4); }
        if (isL && o.dim && o.dim.indexOf(tok) >= 0) ctx.globalAlpha = .35;
        ctx.fillStyle = col; ctx.fillText(tok, cx, yy); ctx.globalAlpha = 1; cx += tok.length * cw;
      });
    });
    ctx.restore(); return { w: maxw, h: lines.length * sz * 1.45 };
  }
  // integer grid card with axis letters
  function grid(ctx, x, y, T, o) {
    o = o || {}; var sz = o.sz || 14, cs = o.cs || sz * 2.3, rows = T.length, cols = T[0].length, w = cols * cs + 12, h = rows * cs + 12 + (o.label ? sz * 1.5 : 0);
    F.paper(ctx, x + w / 2, y + h / 2, w, h, o.bgc || P.cream, { seed: 'g' + (o.label || '') + rows + cols + x, shadow: true });
    var y0 = y + 6 + (o.label ? sz * 1.5 : 0);
    if (o.label) mono(ctx, o.label, x + w / 2, y + sz * .85, sz * .9, '#6b5a9a', 'center');
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var cx = x + 6 + c * cs, cy = y0 + r * cs, v = T[r][c];
      if (o.shade) { var s = o.shade(r, c, v); if (s) { ctx.fillStyle = s; ctx.fillRect(cx + 1, cy + 1, cs - 2, cs - 2); } }
      if (o.hl && o.hl(r, c)) { ctx.strokeStyle = P.red; ctx.lineWidth = 2.5; ctx.strokeRect(cx + 1.5, cy + 1.5, cs - 3, cs - 3); }
      var show = o.show ? o.show(r, c) : true;
      if (show) { ctx.fillStyle = P.ink; ctx.font = sz + 'px ' + F.MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(v), cx + cs / 2, cy + cs / 2); }
    }
    ctx.textAlign = 'left';
    if (o.rl) txt(ctx, o.rl, x - 8, y0 + rows * cs / 2, sz, lcol(o.rl), { mono: true, align: 'right' });
    if (o.cl) txt(ctx, o.cl, x + w / 2, y + h + sz * .8, sz, lcol(o.cl), { mono: true, align: 'center' });
    return { w: w, h: h, cs: cs, x0: x + 6, y0: y0 };
  }
  function vecRow(ctx, x, y, v, o) { return grid(ctx, x, y, [v], o); }
  function stamp(ctx, s, x, y, sz, col, rot, a) {
    if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(rot || -.08); var sc = lerp(1.6, 1, F.ease.out(a)); ctx.scale(sc, sc);
    ctx.font = '700 ' + sz + 'px ' + F.MONO; var tw = ctx.measureText(s).width;
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.strokeRect(-tw / 2 - 8, -sz * .8, tw + 16, sz * 1.6);
    ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 1); ctx.restore();
  }
  function clerk(ctx, x, y, s, t) { F.person(ctx, x, y, s, t, { sweater: P.teal }); }
  function question(ctx, W, a, l) {
    if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
    F.note(ctx, 'which letters survive?', W / 2 + (ph(W) ? 20 : 150), ph(W) ? 196 : 210, ph(W) ? 16 : 20, { color: P.pink, rot: -.04, seed: 'q', reveal: ramp(l, 0, 1.5) });
    ctx.restore();
  }

  /* ================= predict-then-watch (never gated) ================= */
  var PRED = { asked: false, choice: null, lastT: 0, el: null };
  function predictEl() {
    if (PRED.el) return PRED.el;
    var st = document.querySelector('#ifilm .stage'), d = document.createElement('div'); d.id = 'predict';
    d.innerHTML = '<div class="card"><h3>Predict, then watch</h3><p>q and k both have shape <b>(2, 4, 3, 8)</b> = <code>batch pos head d</code>. What shape comes out of<br><code>batch posq head d, batch posk head d -&gt; batch head posq posk</code>?</p><div class="opts">' +
      '<button data-a="a">(2, 4, 3, 8)</button><button data-a="right">' + BIGSHAPE + '</button>' +
      '<button data-a="c">(2, 3, 4)</button><button data-a="d">(2, 3, 4, 8)</button>' +
      '<button class="skipq" data-a="skip">Just show me</button></div><div class="fb" aria-live="polite"></div></div>';
    st.appendChild(d); PRED.el = d;
    [].forEach.call(d.querySelectorAll('button'), function (b) {
      b.onclick = function (e) {
        e.stopPropagation(); PRED.choice = b.dataset.a; var fb = d.querySelector('.fb');
        fb.textContent = b.dataset.a === 'skip' ? 'Watching...' : b.dataset.a === 'right' ? 'Yes. Watch each letter get its verdict.' : 'Worth testing. Watch which letters survive.';
        setTimeout(function () { d.classList.remove('on'); resume(); }, b.dataset.a === 'skip' ? 150 : 1000);
      };
    });
    return d;
  }
  function isPlaying() { var b = document.querySelector('#ifilm .pp'); return b && b.getAttribute('aria-label') === 'Pause'; }
  function pause() { if (isPlaying()) document.querySelector('#ifilm .pp').click(); }
  function resume() { if (!isPlaying()) document.querySelector('#ifilm .pp').click(); }
  function maybeAsk(t, atT) {
    var natural = t - PRED.lastT > 0 && t - PRED.lastT < .25; PRED.lastT = t;
    if (PRED.el && PRED.el.classList.contains('on') && Math.abs(t - atT) > .6) PRED.el.classList.remove('on');
    if (!PRED.asked && natural && t >= atT && t < atT + .5 && !window.__noPredict) { PRED.asked = true; pause(); predictEl().classList.add('on'); }
  }

  /* ================= chapters ================= */
  var chapters = [
    { name: 'the contract', start: 0, dur: 16, cap: {
        1: 'A paper notary\'s office. The clerk is tired of five lines of loops and transposes for every matrix job. She wants each job written as <b>one readable contract</b>: name every axis, and say which names come out the other side.',
        2: 'An <b>einsum</b> pattern names the axes of each input, then after <b>-&gt;</b> names the axes of the output. <code>i j, j k -&gt; i k</code> is matrix multiplication. The whole meaning is in which letters survive the arrow.',
        3: 'ARENA [0.0] uses <code>einops.einsum(A, B, "i j, j k -&gt; i k")</code>: tensors first, then the pattern, dims separated by spaces (unlike <code>torch.einsum("ij,jk-&gt;ik", A, B)</code>). Multi-letter names like <code>posq</code> are allowed.' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var p = ph(W), cy = p ? 110 : 120;
        F.paper(ctx, W / 2, cy, p ? W - 30 : 560, p ? 120 : 140, P.cream, { seed: 'ct', rot: -.01 });
        txt(ctx, 'CONTRACT No. 1', W / 2, cy - (p ? 40 : 48), p ? 14 : 17, '#6b5a9a', { seed: 'cn' });
        ctx.save(); ctx.globalAlpha = ramp(l, 1, 2.5);
        F.paper(ctx, W / 2, cy + 6, p ? W - 60 : 480, p ? 40 : 50, '#262a52', { seed: 'cl', shadow: false });
        contract(ctx, 'i j, j k -> i k', W / 2, cy + 6, p ? 20 : 26, { hi: l > 11 ? ['i', 'k'] : null });
        ctx.restore();
        question(ctx, W, ramp(l, 3.5, 4.5), l - 3.5);
        clerk(ctx, p ? 46 : W / 2 - 330, p ? 590 : 400, p ? 44 : 64, t);
        var gy = p ? 310 : 320, gx = p ? 60 : W / 2 - 200, sz = p ? 13 : 16;
        if (l > 5.5) { ctx.save(); ctx.globalAlpha = ramp(l, 5.5, 6.5);
          var g1 = grid(ctx, gx, gy, A, { sz: sz, label: 'A (2, 3)', rl: 'i', cl: 'j' });
          var g2 = grid(ctx, gx + g1.w + 30, gy, B, { sz: sz, label: 'B (3, 2)', rl: 'j', cl: 'k' });
          txt(ctx, '@', gx + g1.w + 15, gy + g1.h / 2, 18, P.chalk);
          if (l > 8) grid(ctx, p ? W / 2 - 20 : gx + g1.w + g2.w + 70, p ? gy + g2.h + 40 : gy, AB, { sz: sz, label: 'i k', rl: 'i', cl: 'k', bgc: P.mint });
          ctx.restore(); }
        if (l > 11) { ctx.save(); ctx.globalAlpha = ramp(l, 11, 12);
          txt(ctx, 'i and k cross the arrow. j does not.', W / 2, p ? 272 : 520, p ? 15 : 20, P.butter, { seed: 'cross' }); ctx.restore(); }
        if (l < 5) F.plane(ctx, lerp(-20, W + 20, l / 5), H * .5, 12, .05, P.cream);
      } },
    { name: 'three rules', start: 16, dur: 22, cap: {
        1: 'The contract has three clauses. A letter <b>in the output</b> is kept. A letter shared by <b>two inputs</b> but missing from the output: those numbers shake hands (multiply), then get added up. A letter in <b>one input</b> only, missing from the output: swept up and added.',
        2: 'Rule 1: in the output = <b>kept</b> (loop over it, one answer per value). Rule 2: repeated across inputs, absent from output = <b>multiplied and summed</b>. Rule 3: in one input, absent from output = <b>summed</b>. Below, <code>i j -&gt; i</code> on A is rule 3: row sums.',
        3: 'ARENA phrases it as: repeated letters across inputs are multiplied; an omitted letter is summed over; unsummed axes can come out in any order (so <code>"i j k -&gt; k j i"</code> is just a rearrange). Everything is one sum of products over all letters.' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var p = ph(W), sz = p ? 15 : 19, x0 = p ? 16 : W / 2 - 300;
        var rules = [['1  in the output', 'KEPT', P.mint], ['2  in 2 inputs, not output', 'MULTIPLY + SUM', P.pink], ['3  in 1 input, not output', 'SUMMED', P.butter]];
        rules.forEach(function (R, n) {
          var a = ramp(l, .5 + n * 2.2, 1.5 + n * 2.2), y = (p ? 40 : 60) + n * (p ? 58 : 64);
          if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
          F.paper(ctx, p ? W / 2 : W / 2 - 60, y, p ? W - 24 : 520, p ? 48 : 52, P.cream, { seed: 'r' + n, rot: (n - 1) * .01 });
          txt(ctx, R[0], x0 + 6, y, p ? 13 : 17, P.ink, { align: 'left', seed: 'rt' + n }); ctx.restore();
          stamp(ctx, R[1], p ? W - 80 : W / 2 + 95, y, p ? 12 : 15, R[2] === P.butter ? '#b8860b' : R[2] === P.mint ? '#2f7a55' : '#c0405c', -.06, ramp(l, 1.2 + n * 2.2, 1.8 + n * 2.2));
        });
        var y2 = p ? 230 : 270;
        if (l > 7.5) { ctx.save(); ctx.globalAlpha = ramp(l, 7.5, 8.5);
          contract(ctx, 'i j, j k -> i k', W / 2, y2, sz);
          var f = fate(parse('i j, j k -> i k'));
          ['i', 'j', 'k'].forEach(function (L, n) { mono(ctx, L + ': ' + f[L], x0 + (p ? 10 : 150), y2 + sz * 1.8 + n * sz * 1.35, p ? 13 : 16, lcol(L)); });
          ctx.restore(); }
        var y3 = y2 + (p ? 130 : 150);
        if (l > 12) { ctx.save(); ctx.globalAlpha = ramp(l, 12, 13);
          contract(ctx, 'i j -> i', W / 2, y3, sz);
          var sw = ramp(l, 14, 19), gx = p ? 40 : W / 2 - 150, g = grid(ctx, gx, y3 + 22, A, { sz: p ? 14 : 17, rl: 'i', cl: 'j', shade: function (r, c) { return c <= Math.floor(sw * 3 - .01) ? 'rgba(247,227,160,.8)' : null; } });
          // the sweep broom: running row sums, honest
          var done = sw > 0 ? Math.min(3, Math.floor(sw * 3 - .01) + 1) : 0, part = A.map(function (row) { return row.slice(0, Math.min(3, Math.max(done, 0))).reduce(function (a, b) { return a + b; }, 0); });
          txt(ctx, '->', gx + g.w + 22, y3 + 22 + g.h / 2, 18, P.chalk);
          grid(ctx, gx + g.w + 44, y3 + 22, part.map(function (v) { return [v]; }), { sz: p ? 14 : 17, rl: null, cl: 'i', label: 'sum', bgc: P.butter });
          if (sw >= 1) mono(ctx, '= ' + JSON.stringify(ROWS), gx + g.w + 44 + (p ? 60 : 70), y3 + 22 + g.h / 2 + 10, p ? 13 : 16, P.butter);
          ctx.restore(); }
      } },
    { name: 'trace', start: 38, dur: 16, cap: {
        1: 'A trick clause: the <b>same letter twice in one input</b>. <code>i i</code> means "only where row number equals column number": walk down the diagonal. The output is empty, so every letter is summed. Diagonal, then sum: the <b>trace</b>.',
        2: '<code>einops.einsum(mat, "i i -&gt;")</code>. Writing i twice ties the two axes together (they must be the same size), so we visit M[0,0], M[1,1], M[2,2]. Nothing after the arrow means the result is a scalar: 1 + 5 + 9 = 15.',
        3: 'This is ARENA\'s <code>einsum_trace</code>. Same function, same rules: the sum is over every assignment of letters, and the tie means only diagonal assignments exist. <code>"i i -&gt; i"</code> would keep i: the diagonal itself, no sum.' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var p = ph(W), sz = p ? 20 : 26;
        F.paper(ctx, W / 2, p ? 50 : 60, p ? W - 60 : 360, p ? 50 : 60, '#262a52', { seed: 'trc', shadow: false });
        contract(ctx, 'i i ->', W / 2, p ? 50 : 60, sz);
        var cs = p ? 60 : 72, gx = W / 2 - (cs * 3 + 12) / 2, gy = p ? 110 : 120, step = ramp(l, 3, 11) * 3;
        var g = grid(ctx, gx, gy, M, { sz: p ? 20 : 24, cs: cs, rl: 'i', cl: 'i', shade: function (r, c) { return r === c ? (r < step ? 'rgba(243,179,195,.85)' : 'rgba(243,179,195,.25)') : null; }, hl: function (r, c) { return r === c && r === Math.min(2, Math.floor(step)); } });
        var n = Math.min(3, Math.floor(step + 1e-6)), run = 0, terms = [];
        for (var i = 0; i < n; i++) { run += M[i][i]; terms.push(M[i][i]); }
        for (i = 0; i < n; i++) F.lantern(ctx, gx + 6 + i * cs + cs / 2, gy + g.h + 44, 10, 1, t);
