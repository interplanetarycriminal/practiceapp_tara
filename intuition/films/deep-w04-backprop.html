<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Building autograd from scratch</title>
<meta name="theme-color" content="#1c2140">
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;
  var MONO = F.MONO;

  /* =============== a real (tiny) autograd, written the ARENA way =============== */
  // BackwardFuncLookup: (forward func, argnum) -> backward func(grad_out, out, *args)
  function BackwardFuncLookup() { this.back_funcs = {}; }
  BackwardFuncLookup.prototype.add_back_func = function (f, i, fn) { this.back_funcs[f + ',' + i] = fn; };
  BackwardFuncLookup.prototype.get_back_func = function (f, i) { return this.back_funcs[f + ',' + i]; };
  var BACK_FUNCS = new BackwardFuncLookup();
  BACK_FUNCS.add_back_func('multiply', 0, function (g, out, x, y) { return g * y; });
  BACK_FUNCS.add_back_func('multiply', 1, function (g, out, x, y) { return g * x; });
  BACK_FUNCS.add_back_func('log', 0, function (g, out, x) { return g / x; });
  BACK_FUNCS.add_back_func('add', 0, function (g) { return g; });
  BACK_FUNCS.add_back_func('add', 1, function (g) { return g; });
  var FWD = { multiply: function (x, y) { return x * y; }, log: function (x) { return Math.log(x); }, add: function (x, y) { return x + y; } };
  function leaf(v, name) { return { array: v, name: name, recipe: null, grad: null, requires_grad: true }; }
  function op(func, name, ins) { // ins: tensors; builds the Recipe during the forward pass
    var args = ins.map(function (x) { return x.array; }), parents = {};
    ins.forEach(function (x, i) { parents[i] = x; });
    return { array: FWD[func].apply(null, args), name: name, grad: null, requires_grad: true, recipe: { func: func, args: args, kwargs: {}, parents: parents } };
  }
  function sorted_computational_graph(end) { // DFS topological sort, end node first
    var out = [], seen = []; (function visit(n) { if (seen.indexOf(n) >= 0) return; seen.push(n); if (n.recipe) for (var k in n.recipe.parents) visit(n.recipe.parents[k]); out.push(n); })(end);
    return out.reverse();
  }
  function backprop(end) { // returns every step so the film can replay it honestly
    var grads = new Map(), steps = []; grads.set(end, 1);
    sorted_computational_graph(end).forEach(function (node) {
      var outgrad = grads.get(node); grads.delete(node);
      if (!node.recipe) { node.grad = node.grad == null ? outgrad : node.grad + outgrad; steps.push({ leaf: true, node: node, g: outgrad }); return; }
      for (var k in node.recipe.parents) {
        var parent = node.recipe.parents[k], back_fn = BACK_FUNCS.get_back_func(node.recipe.func, +k);
        var in_grad = back_fn.apply(null, [outgrad, node.array].concat(node.recipe.args)), before = grads.has(parent) ? grads.get(parent) : null;
        grads.set(parent, before == null ? in_grad : before + in_grad);
        steps.push({ node: node, parent: parent, argnum: +k, g: outgrad, in_grad: in_grad, before: before, after: grads.get(parent) });
      }
    });
    return steps;
  }
  // the salty cake: L = log(a*b) (op) a|b
  function build(a, b, last) {
    var A = leaf(a, 'a'), B = leaf(b, 'b'), C = op('multiply', 'c', [A, B]), D = op('log', 'd', [C]);
    var L = last === 'addA' ? op('add', 'L', [D, A]) : last === 'mulB' ? op('multiply', 'L', [D, B]) : op('multiply', 'L', [D, A]);
    var g = { a: A, b: B, c: C, d: D, L: L, last: last || 'mulA' }; g.steps = backprop(L); return g;
  }
  function Lval(a, b, last) { return build(a, b, last).L.array; }
  function fd(a, b, last, which) { var h = 1e-4; return which === 'a' ? (Lval(a + h, b, last) - Lval(a - h, b, last)) / (2 * h) : (Lval(a, b + h, last) - Lval(a, b - h, last)) / (2 * h); }
  var G0 = build(2, 3, 'mulA');
  function f3(v) { return (Math.abs(v) < 1e-9 ? 0 : v).toFixed(Math.abs(v) >= 100 ? 1 : 3).replace(/\.?0+$/, function (m) { return m.indexOf('.') === 0 ? '' : m; }) || '0'; }
  function f2(v) { return (+v.toFixed(3)).toString(); }

  /* =============== layout =============== */
  var POS = { a: [.1, .18], b: [.1, .84], c: [.38, .52], d: [.64, .52], L: [.9, .52] };
  var POSP = { a: [.08, .15], b: [.08, .85], c: [.36, .6], d: [.63, .7], L: [.92, .42] };
  function por(W, H) { return H > W * 1.1; }
  function R(W, H, top, bot) { var p = por(W, H); top = top == null ? (p ? 82 : 70) : top; bot = bot == null ? (p ? 150 : 110) : bot; return { x: W * .07, y: top, w: W * .86, h: Math.max(120, H - top - bot) }; }
  function NP(name, r, W, H) { var Q = por(W, H) ? POSP : POS, u = Q[name][0], v = Q[name][1]; return por(W, H) ? [r.x + v * r.w, r.y + u * r.h] : [r.x + u * r.w, r.y + v * r.h]; }
  function rad(W, H) { return clamp(Math.min(W, H) * .07, 22, 40); }
  function edgePts(p, q, r) { var dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1; return [p[0] + dx / L * (r + 3), p[1] + dy / L * (r + 3), q[0] - dx / L * (r + 6), q[1] - dy / L * (r + 6)]; }
  function edgeMid(p, q, off) { var dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1; return [(p[0] + q[0]) / 2 - dy / L * off, (p[1] + q[1]) / 2 + dx / L * off]; }
  var EDGES = function (g) { var e = [['a', 'c'], ['b', 'c'], ['c', 'd'], ['d', 'L']]; e.push([g.last === 'mulB' ? 'b' : 'a', 'L']); return e; };

  /* =============== scene pieces =============== */
  function kitchen(ctx, W, H, t) {
    F.sky(ctx, W, H, '#2c2542', '#4a3a58');
    // tiles
    ctx.save(); ctx.globalAlpha = .07; ctx.strokeStyle = P.cream; ctx.lineWidth = 1; var s = 34;
    for (var x = 0; x < W; x += s) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (var y = 0; y < H; y += s) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();
    // counter strip
    F.paper(ctx, W / 2, H - 18, W + 20, 40, '#6b5a78', { seed: 'counter', shadow: false });
  }
  function fridgeNote(ctx, W, H, l, text, color) {
    var p = por(W, H), sz = W < 500 ? 16 : 20;
    F.note(ctx, text || 'who gets the blame,\nand how much?', p ? W / 2 : W - Math.min(250, W * .24), p ? 38 : 44, sz, { rot: -.025, seed: 'fridge', color: color || P.butter, reveal: l == null ? 1 : ramp(l, 0, 1.6) });
  }
  var NCOL = { a: P.peach, b: P.mint, c: P.sky, d: P.lav, L: P.pink };
  var NLAB = { a: 'flour a', b: 'sugar b', c: 'c = a·b', d: 'd = log c', L: 'L = d·a' };
  function bowl(ctx, W, H, r, g, name, t, o) {
    o = o || {}; var p = NP(name, r, W, H), rr = rad(W, H) * (o.scale == null ? 1 : o.scale);
    if (rr <= 1) return;
    if (o.glow) F.glow(ctx, p[0], p[1], rr * 2.2, 'rgba(255,214,120,.5)', o.glow);
    F.blob(ctx, p[0], p[1], rr, NCOL[name], { seed: 'bowl' + name, jit: .12, blur: 8 });
    ctx.save(); ctx.globalAlpha = .25; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(p[0], p[1] - rr * .45, rr * .7, rr * .22, 0, 0, 6.283); ctx.fill(); ctx.restore();
    var nm = name === 'L' ? 'L' : name;
    F.hand(ctx, nm, p[0], p[1] - rr * .22, rr * .62, P.ink, { seed: 'n' + name });
    F.hand(ctx, f3(g[name].array), p[0], p[1] + rr * .42, rr * .42, P.ink, { font: MONO, bold: false, wobble: .2, seed: 'v' + name });
    if (o.grad != null) {
      var txt = 'grad ' + f3(o.grad), sz = clamp(rr * .42, 11, 15), w = F.textW(ctx, txt, sz, MONO) + 14;
      var gx = p[0], gy = p[1] + rr + sz * .9;
      F.paper(ctx, gx, gy, w, sz * 1.6, o.gradCol || P.butter, { seed: 'gp' + name, shadow: false });
      F.hand(ctx, txt, gx, gy, sz, P.ink, { font: MONO, bold: false, wobble: .1, seed: 'gt' + name });
    }
    if (o.tag) { var ts = clamp(rr * .36, 10, 13); F.hand(ctx, o.tag, p[0], p[1] - rr - ts * .9, ts, P.chalk, { outline: 3, outlineColor: 'rgba(20,20,50,.8)', seed: 'tag' + name }); }
  }
  function edge(ctx, W, H, r, from, to, col, wd, a) {
    var p = NP(from, r, W, H), q = NP(to, r, W, H), e = edgePts(p, q, rad(W, H));
    ctx.save(); ctx.globalAlpha = a == null ? 1 : a; F.arrow(ctx, e[0], e[1], e[2], e[3], col || 'rgba(253,250,240,.55)', wd || 2, 'e' + from + to); ctx.restore();
  }
  function edgeLabel(ctx, W, H, r, from, to, text, col, off) {
    var p = NP(from, r, W, H), q = NP(to, r, W, H), m = edgeMid(p, q, off == null ? 0 : off), sz = W < 500 ? 12 : 14;
    var w = F.textW(ctx, text, sz, MONO) + 12; F.paper(ctx, m[0], m[1], w, sz * 1.7, col || 'rgba(22,26,53,.9)', { seed: 'el' + from + to, shadow: false });
    F.hand(ctx, text, m[0], m[1], sz, col ? P.ink : P.chalk, { font: MONO, bold: false, wobble: .1, seed: 'et' + text });
  }
  function travel(ctx, W, H, r, from, to, k, t) { // lantern carrying blame from `to` back to `from`
    var p = NP(from, r, W, H), q = NP(to, r, W, H), e = F.ease.inOut(k); F.lantern(ctx, lerp(q[0], p[0], e), lerp(q[1], p[1], e), 7, 1, t);
  }
  function panel(ctx, W, H, lines, o) { // mono paper at the bottom of the stage
    o = o || {}; var sz = o.sz || (W < 500 ? 12.5 : 15), mw = 0;
    ctx.save(); ctx.font = '600 ' + sz + 'px ' + MONO; lines.forEach(function (l) { mw = Math.max(mw, ctx.measureText(l[0]).width); }); ctx.restore();
    var maxW = W - 20; if (mw + 24 > maxW) { sz *= maxW / (mw + 24); mw = maxW - 24; }
    var h = lines.length * sz * 1.4 + 14, w = mw + 24, x = o.x != null ? o.x : W / 2, y = o.y != null ? o.y : H - h / 2 - 8;
    F.paper(ctx, x, y, w, h, o.bg || 'rgba(22,26,53,.92)', { seed: o.seed || 'panel' + lines.length, shadow: false });
    ctx.save(); ctx.font = '600 ' + sz + 'px ' + MONO; ctx.textBaseline = 'middle';
    lines.forEach(function (l, i) { ctx.globalAlpha = l[2] == null ? 1 : l[2]; ctx.fillStyle = l[1] || P.chalk; ctx.fillText(l[0], x - w / 2 + 12, y - h / 2 + 7 + sz * .7 + i * sz * 1.4); });
    ctx.restore(); return { x: x, y: y, w: w, h: h };
  }
  function title(ctx, W, H, text, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; F.hand(ctx, text, W / 2, por(W, H) ? 22 : 24, W < 500 ? 16 : 20, P.chalk, { outline: 4, outlineColor: 'rgba(20,20,50,.8)', seed: 'ttl' + text }); ctx.restore(); }

  // replay the real backprop steps up to step index k (fractional): which grads are known where
  function gradsAt(g, k) {
    var known = {}, done = Math.floor(k);
    for (var i = 0; i < Math.min(done, g.steps.length); i++) { var s = g.steps[i]; if (!s.leaf) known[s.parent.name] = s.after; }
    known.L = 1; return known;
  }

  /* =============== grids for arrays =============== */
  function grid(ctx, x, y, M, cs, col, o) { // top-left x,y
    o = o || {}; var rows = M.length, cols = M[0].length;
    F.paper(ctx, x + cols * cs / 2, y + rows * cs / 2, cols * cs + 6, rows * cs + 6, col, { seed: o.seed || ('g' + rows + cols + x), shadow: false });
    ctx.save(); ctx.strokeStyle = 'rgba(42,41,52,.25)'; ctx.lineWidth = 1;
    for (var i = 1; i < rows; i++) { ctx.beginPath(); ctx.moveTo(x, y + i * cs); ctx.lineTo(x + cols * cs, y + i * cs); ctx.stroke(); }
    for (var j = 1; j < cols; j++) { ctx.beginPath(); ctx.moveTo(x + j * cs, y); ctx.lineTo(x + j * cs, y + rows * cs); ctx.stroke(); }
    ctx.restore();
    if (o.nums !== false) for (i = 0; i < rows; i++) for (j = 0; j < cols; j++) {
      ctx.save(); ctx.globalAlpha = o.hl && !o.hl(i, j) ? .35 : 1;
      F.hand(ctx, String(M[i][j]), x + j * cs + cs / 2, y + i * cs + cs / 2, cs * .48, P.ink, { font: MONO, bold: true, wobble: .1, seed: 'c' + i + j }); ctx.restore();
    }
    if (o.label) F.hand(ctx, o.label, x + cols * cs / 2, y - cs * .45 - 4, Math.max(11, cs * .42), o.labelCol || P.chalk, { font: MONO, bold: false, wobble: .1, seed: 'gl' + o.label });
    return { w: cols * cs, h: rows * cs };
  }
  function mm(A, B) { return A.map(function (r) { return B[0].map(function (_, j) { return r.reduce(function (s, v, k) { return s + v * B[k][j]; }, 0); }); }); }
  function Tr(A) { return A[0].map(function (_, j) { return A.map(function (r) { return r[j]; }); }); }
  function ones(r, c) { var o = []; for (var i = 0; i < r; i++) { o.push([]); for (var j = 0; j < c; j++) o[i].push(1); } return o; }
  // unbroadcast, exactly ARENA's two steps, on nested arrays (2D only)
  var GO = [[1, 2, 3], [4, 5, 6]];
  var UB_bias = [GO.reduce(function (s, r) { return s.map(function (v, j) { return v + r[j]; }); }, [0, 0, 0])]; // sum axis 0 -> (3,)
  var UB_col = GO.map(function (r) { return [r.reduce(function (s, v) { return s + v; }, 0)]; });        // sum axis 1 keepdims -> (2,1)
  // matmul example
  var MX = [[1, 0, 2], [-1, 3, 1]], MW = [[1, 2, 0, -1], [0, 1, 1, 2], [3, -1, 1, 0]];
  var MO = mm(MX, MW), MG = ones(2, 4), MGX = mm(MG, Tr(MW)), MGW = mm(Tr(MX), MG);
  function sumAll(M) { return M.reduce(function (s, r) { return s + r.reduce(function (a, b) { return a + b; }, 0); }, 0); }
  function fdMX(i, j) { var h = 1e-4, Xp = MX.map(function (r) { return r.slice(); }), Xm = MX.map(function (r) { return r.slice(); }); Xp[i][j] += h; Xm[i][j] -= h; return (sumAll(mm(Xp, MW)) - sumAll(mm(Xm, MW))) / (2 * h); }

  /* =============== predict, then watch =============== */
  var PR = { shown: false, answered: false, choice: null, box: null, prevT: -1 };
  function ppButton(api) { return api.root.querySelector('.pp'); }
  function isPlaying(api) { var b = ppButton(api); return b && b.getAttribute('aria-label') === 'Pause'; }
  function askPredict(api) {
    if (PR.box) return; PR.shown = true;
    var st = api.root.querySelector('.stage'), d = document.createElement('div');
    d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Predict, then watch');
    d.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,420px);background:#fbf6ea;color:#2a2934;border-radius:14px;padding:16px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);font:16px/1.35 system-ui,sans-serif;z-index:5;text-align:center';
    d.innerHTML = '<div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6b5a9a;font-weight:700">predict, then watch</div>' +
      '<div style="margin:8px 0 12px;font-size:18px"><code style="font-size:17px">x = 3</code>, &nbsp;<code style="font-size:17px">y = x * x</code><br>What will <code>x.grad</code> be?</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">' +
      ['3', '6', '9'].map(function (v) { return '<button data-v="' + v + '" style="font:700 20px ui-monospace,monospace;padding:12px 0;border-radius:10px;border:2px solid #2a2934;background:#f7e3a0;color:#2a2934;cursor:pointer">' + v + '</button>'; }).join('') +
      '</div><button data-v="show" style="margin-top:10px;font:15px system-ui,sans-serif;background:none;border:0;color:#454a86;text-decoration:underline;cursor:pointer;padding:6px">just show me</button>';
    [].forEach.call(d.querySelectorAll('button'), function (b) {
      b.onclick = function (e) { e.stopPropagation(); PR.choice = b.dataset.v; PR.answered = true; closePredict(api, true); try { api.audio.blip(PR.choice === '6' ? 880 : 520); } catch (er) {} };
    });
    d.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    st.appendChild(d); PR.box = d;
    if (isPlaying(api)) ppButton(api).click();
  }
  function closePredict(api, resume) { if (PR.box) { PR.box.remove(); PR.box = null; } if (resume && !isPlaying(api)) ppButton(api).click(); }
  var PAUSE_AT = 78.2;

  /* =============== chapters =============== */
  function ch(start, dur, name, cap, draw) { return { name: name, start: start, dur: dur, cap: cap, draw: draw }; }
  var chapters = [
    ch(0, 22, 'a recipe on every bowl', {
      1: 'A paper kitchen. The cake came out <b>salty</b>. The baker wants to share out the blame to every ingredient, fairly, in one sweep. Trick: as each bowl is made, it keeps a little <b>recipe card</b>.',
      2: 'The forward pass builds the graph as it goes. Every new tensor carries a <b>Recipe</b>: which function made it, and from which parent tensors. Leaves (a, b) have no recipe.',
      3: 'L = log(a·b)·a with a=2, b=3. Each op wrapper computes the NumPy result and, if any input requires_grad, attaches Recipe(func, args, kwargs, parents). Graph = recipes linked by parents.' },
      function (ctx, t, l, W, H) {
        kitchen(ctx, W, H, t); var r = R(W, H), g = G0; fridgeNote(ctx, W, H, l);
        var app = { a: 1, b: 1.8, c: 5, d: 9, L: 13 };
        EDGES(g).forEach(function (e) { var a = ramp(l, app[e[1]] - .4, app[e[1]] + .6); if (a > 0) edge(ctx, W, H, r, e[0], e[1], null, 2, a); });
        ['a', 'b', 'c', 'd', 'L'].forEach(function (n) {
          var s = F.ease.back(ramp(l, app[n], app[n] + .7)); if (s <= 0) return;
          var tag = n === 'c' ? 'recipe: multiply' : n === 'd' ? 'recipe: log' : n === 'L' ? 'recipe: multiply' : 'leaf: no recipe';
          bowl(ctx, W, H, r, g, n, t, { scale: s, tag: ramp(l, app[n] + .8, app[n] + 1.2) > .5 ? tag : null });
        });
        if (l > 15.5) { var p = NP('L', r, W, H), rr = rad(W, H); ctx.save(); ctx.globalAlpha = ramp(l, 15.5, 16.3); F.hand(ctx, 'salty!', p[0] + (por(W, H) ? rr * 2 : 0), p[1] + (por(W, H) ? 0 : rr * 2.3), W < 500 ? 16 : 20, P.red, { outline: 4, outlineColor: 'rgba(20,20,50,.8)', seed: 'salty', rot: -.1 }); ctx.restore(); }
        var n = l < 5 ? 1 : l < 9 ? 2 : l < 13 ? 3 : 4, lines = [['a = 2.0   b = 3.0            (leaves)', P.peach], ['c = a * b        = ' + f3(g.c.array), P.sky], ['d = log(c)       = ' + f3(g.d.array), P.lav], ['L = d * a        = ' + f3(g.L.array), P.pink]];
        panel(ctx, W, H, lines.slice(0, n), { seed: 'fwd' });
      }),
    ch(22, 20, 'Recipe and BACK_FUNCS', {
      1: 'Zoom into bowl c\'s card. It says what made it (multiply), the numbers it used, and which bowls it came from. And a second, shared cookbook says, for each recipe, how much a nudge in each ingredient moves the result.',
      2: '<b>Recipe</b> has four fields. <b>args</b> keeps the raw numbers (for the maths later); <b>parents</b> keeps the actual tensors (for walking the graph). <b>BACK_FUNCS</b> maps (func, argnum) to its backward function.',
      3: 'BackwardFuncLookup: back_funcs[(forward_fn, arg_position)] = back_fn. multiply_back0(grad_out, out, x, y) = grad_out·y; log_back(grad_out, out, x) = grad_out/x. Local slopes only; the chain is backprop\'s job.' },
      function (ctx, t, l, W, H) {
        kitchen(ctx, W, H, t); var p = por(W, H), r = R(W, H, null, p ? 250 : 190), g = G0; title(ctx, W, H, 'every tensor carries its Recipe', ramp(l, 0, 1));
        EDGES(g).forEach(function (e) { edge(ctx, W, H, r, e[0], e[1]); });
        var focus = l < 8 ? 'c' : l < 13 ? 'd' : null;
        ['a', 'b', 'c', 'd', 'L'].forEach(function (n) { bowl(ctx, W, H, r, g, n, t, { glow: focus === n ? .9 : 0 }); });
        // local slopes on the edges, from the same BACK_FUNCS the backprop uses
        if (l > 13) {
          var a = ramp(l, 13, 14), la = [['a', 'c', '×b=3'], ['b', 'c', '×a=2'], ['c', 'd', '÷c=÷6'], ['d', 'L', '×a=2'], ['a', 'L', '×d=' + f2(g.d.array)]];
          ctx.save(); ctx.globalAlpha = a; la.forEach(function (e, i) { edgeLabel(ctx, W, H, r, e[0], e[1], e[2], P.butter, i === 4 ? 14 : 0); }); ctx.restore();
        }
        var lines;
