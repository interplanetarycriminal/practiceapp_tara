<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Which way is down</title>
<meta name="theme-color" content="#1c2140">
</head>
<body>
<noscript>This film is drawn live with JavaScript.</noscript>
<script src="../engine.js"></script>
<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp;

  /* ---------------- the real loss surface: a long ravine plus one small hill ---------------- */
  var XM = 6, YM = 3, HX = 2, HY = -1.3, HA = 0.5, HS = 0.5;
  function f(x, y) { return x * x / 20 + y * y + HA * Math.exp(-((x - HX) * (x - HX) + (y - HY) * (y - HY)) / HS); }
  function grad(x, y) {
    var e = HA * Math.exp(-((x - HX) * (x - HX) + (y - HY) * (y - HY)) / HS);
    return [x / 10 - e * 2 * (x - HX) / HS, 2 * y - e * 2 * (y - HY) / HS];
  }
  /* real update rules, integrated step by step */
  function run(opt, lr, x0, y0, n, noise) {
    var p = [x0, y0], v = [0, 0], m = [0, 0], out = [], r = F.rng('mb' + opt), dead = false;
    out.push({ x: p[0], y: p[1], L: f(p[0], p[1]), m: [0, 0], v: [0, 0], g: grad(p[0], p[1]) });
    for (var k = 1; k <= n; k++) {
      if (dead) { out.push(out[out.length - 1]); continue; }
      var g = grad(p[0], p[1]);
      if (noise) { g[0] += (r() - .5) * noise; g[1] += (r() - .5) * noise * 4; }
      for (var i = 0; i < 2; i++) {
        if (opt === 'sgd') p[i] -= lr * g[i];
        else if (opt === 'mom') { v[i] = 0.9 * v[i] + g[i]; p[i] -= lr * v[i]; }
        else { m[i] = 0.9 * m[i] + 0.1 * g[i]; v[i] = 0.999 * v[i] + 0.001 * g[i] * g[i];
          var mh = m[i] / (1 - Math.pow(0.9, k)), vh = v[i] / (1 - Math.pow(0.999, k)); p[i] -= lr * mh / (Math.sqrt(vh) + 1e-8); }
      }
      if (Math.abs(p[0]) > XM * 1.4 || Math.abs(p[1]) > YM * 1.4 || !isFinite(p[0])) dead = true;
      out.push({ x: p[0], y: p[1], L: f(p[0], p[1]), m: m.slice(), v: v.slice(), g: g, dead: dead });
    }
    return out;
  }

  /* ---------------- world <-> screen (portrait turns the ravine upright) ---------------- */
  var V = { s: 1, cx: 0, cy: 0, por: false, W: 0, H: 0 };
  function fit(W, H, top, bot) {
    if (V.W === W && V.H === H) return;
    V.W = W; V.H = H; V.por = H > W * 1.1;
    var aw = W - 24, ah = H - (top || 0) - (bot || 0) - 16;
    V.s = V.por ? Math.min(aw / (2 * YM), ah / (2 * XM)) : Math.min(aw / (2 * XM), ah / (2 * YM));
    V.cx = W / 2; V.cy = (top || 0) + 8 + ah / 2; buildLand();
  }
  function S(x, y) { return V.por ? [V.cx + y * V.s, V.cy + x * V.s] : [V.cx + x * V.s, V.cy - y * V.s]; }
  function Sv(dx, dy) { return V.por ? [dy * V.s, dx * V.s] : [dx * V.s, -dy * V.s]; }
  function Winv(sx, sy) { return V.por ? [(sy - V.cy) / V.s, (sx - V.cx) / V.s] : [(sx - V.cx) / V.s, -(sy - V.cy) / V.s]; }

  var land = null, BANDS = ['#e9f5e4', '#c4ead3', '#9fd8cb', '#86bfd9', '#8ea3dd', '#8f88cf', '#76689f', '#5b5486', '#474472', '#383661', '#2d2c52', '#25244a'];
  function hex(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  var BR = BANDS.map(hex);
  function band(x, y) { return Math.min(BANDS.length - 1, Math.floor(Math.sqrt(f(x, y)) * 3.3)); }
  function buildLand() {
    var k = 2, w = Math.ceil(V.W / k), h = Math.ceil(V.H / k), c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'), id = g.createImageData(w, h), B = new Int16Array(w * h);
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) { var q = Winv(i * k + k / 2, j * k + k / 2); B[j * w + i] = band(q[0], q[1]); }
    var r = F.rng('land');
    for (j = 0; j < h; j++) for (i = 0; i < w; i++) {
      var b = B[j * w + i], col = BR[b], sh = 0;
      if (i > 1 && j > 1 && B[(j - 2) * w + i - 1] > b) sh = -38; else if (i < w - 1 && j < h - 1 && B[(j + 1) * w + i + 1] > b) sh = 16;
      var n = (r() - .5) * 14, o = (j * w + i) * 4;
      id.data[o] = clamp(col[0] + sh + n, 0, 255); id.data[o + 1] = clamp(col[1] + sh + n, 0, 255); id.data[o + 2] = clamp(col[2] + sh + n, 0, 255); id.data[o + 3] = 255;
    }
    g.putImageData(id, 0, 0); land = c;
  }
  function drawLand(ctx, W, H, t, shimmer) {
    var a = S(-XM, -YM), b = S(XM, YM), x0 = Math.min(a[0], b[0]), y0 = Math.min(a[1], b[1]), w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);
    F.paper(ctx, x0 + w / 2, y0 + h / 2, w + 10, h + 10, '#2d2c52', { seed: 'landpaper', blur: 14 });
    ctx.save(); ctx.beginPath(); var pts = F.tornRect('landclip', w, h, 1.2); ctx.translate(x0 + w / 2, y0 + h / 2);
    ctx.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.clip();
    ctx.translate(-(x0 + w / 2), -(y0 + h / 2));
    ctx.imageSmoothingEnabled = true;
    if (shimmer) { var j = shimmer * 3; ctx.drawImage(land, Math.sin(t * 23) * j, Math.cos(t * 19) * j, W, H); ctx.globalAlpha = .45; ctx.drawImage(land, Math.cos(t * 31) * j * 2, Math.sin(t * 17) * j * 2, W, H); ctx.globalAlpha = 1; }
    else ctx.drawImage(land, 0, 0, W, H);
    ctx.fillStyle = F.grain(ctx); ctx.globalAlpha = .5; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    ctx.restore();
    var m = S(0, 0); F.lantern(ctx, m[0], m[1] + 4, 9, 1, t); // the wish: the lantern at the valley floor
  }
  function bg(ctx, W, H, t) { F.sky(ctx, W, H, P.night, '#2b2f5c'); F.stars(ctx, W, H, t, 'w3', 60); F.moon(ctx, W - 34, 30, 13); }

  var START = [-5.2, 2.2];
  var RATE = 5; // optimiser steps per second of film
  function pos(tr, k) { var i = Math.floor(k), fr = k - i; if (i >= tr.length - 1) return tr[tr.length - 1]; var a = tr[i], b = tr[i + 1]; return { x: lerp(a.x, b.x, F.ease.inOut(fr)), y: lerp(a.y, b.y, F.ease.inOut(fr)), L: a.L, i: i }; }
  function trail(ctx, tr, k, color, wdt, dotted) {
    var n = Math.min(tr.length - 1, Math.floor(k)); ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = wdt || 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (dotted) ctx.setLineDash([2, 5]);
    ctx.beginPath(); var p = S(tr[0].x, tr[0].y); ctx.moveTo(p[0], p[1]);
    for (var i = 1; i <= n; i++) { p = S(tr[i].x, tr[i].y); ctx.lineTo(p[0], p[1]); }
    var q = pos(tr, k); p = S(q.x, q.y); ctx.lineTo(p[0], p[1]); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = color; for (i = 0; i <= n; i++) { p = S(tr[i].x, tr[i].y); ctx.beginPath(); ctx.arc(p[0], p[1], 2.2, 0, 6.283); ctx.fill(); }
    ctx.restore();
  }
  function hiker(ctx, q, t, sz, o) { var p = S(q.x, q.y); F.person(ctx, p[0], p[1], sz || Math.min(40, Math.max(22, V.s * .62)), t, o || { walk: true }); }
  function marble(ctx, q, r, color) { var p = S(q.x, q.y); F.blob(ctx, p[0], p[1], r, color, { seed: 'marble', jit: .3, blur: 6 }); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(p[0] - r * .35, p[1] - r * .35, r * .28, 0, 6.283); ctx.fill(); }
  function stepArrow(ctx, q, lr, color) { var g = grad(q.x, q.y), p = S(q.x, q.y), d = Sv(-lr * g[0], -lr * g[1]), L = Math.hypot(d[0], d[1]), c = Math.min(1, V.s * 2.2 / (L || 1)); F.arrow(ctx, p[0], p[1], p[0] + d[0] * c, p[1] + d[1] * c, color || P.chalk, 3, 'a' + Math.round(q.x * 10)); }
  function readout(ctx, x, y, lines, W) {
    var sz = W < 500 ? 12 : 14; ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l[0]).width); }); ctx.restore();
    F.paper(ctx, x + w / 2 + 10, y + lines.length * sz * .65 + 4, w + 22, lines.length * sz * 1.3 + 12, 'rgba(22,26,53,.88)', { seed: 'ro' + lines.length, shadow: false });
    ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; ctx.textBaseline = 'top';
    lines.forEach(function (l, i) { ctx.fillStyle = l[1] || P.chalk; ctx.fillText(l[0], x + 10, y + 8 + i * sz * 1.3); }); ctx.restore();
  }
  var TOPPAD = function (W, H) { return H > W * 1.1 ? 64 : 10; };
  function question(ctx, W, H, local, a) {
    if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
    var sz = W < 500 ? 17 : 22; F.note(ctx, 'which way is down,\nand how big a step?', W < 500 ? W / 2 : W * .6, W < 500 ? 36 : 56, sz, { rot: -.03, seed: 'q', reveal: ramp(local, 0, 1.8) });
    ctx.restore();
  }
  function lbl(ctx, text, x, y, color, sz) { F.hand(ctx, text, x, y, sz || 16, color || P.chalk, { outline: 4, outlineColor: 'rgba(20,20,50,.75)', seed: text }); }

  var LR = { sgd: 0.9, small: 0.08, big: 1.08, mom: 0.1, adam: 0.3 };
  var TR = {}; function tr(name, opt, lr, n) { if (!TR[name]) TR[name] = run(opt, lr, START[0], START[1], n); return TR[name]; }

  /* chapters are listed with durations; starts are summed so beats can be split without hand-editing times */
  /* one small on-screen credit line when a beat borrows someone's framing */
  function credit(ctx, W, text) { ctx.save(); var cf = W < 500 ? 10.5 : 12; ctx.font = '600 ' + cf + 'px system-ui,sans-serif'; ctx.textBaseline = 'top'; var cw = ctx.measureText(text).width; ctx.fillStyle = 'rgba(18,20,44,.72)'; ctx.fillRect(4, 3, cw + 10, cf + 7); ctx.fillStyle = 'rgba(253,250,240,.85)'; ctx.fillText(text, 9, 6); ctx.restore(); }
  var NG = 'framing: Andrew Ng, Deep Learning Specialization', B3 = 'framing: 3Blue1Brown, neural networks series';
  function seq(list) { var s = 0; list.forEach(function (c) { c.start = s; s += c.dur; }); return list; }
  function drawSGD(ctx, t, l, W, H) {
    fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); drawLand(ctx, W, H, t);
    var T = tr('sgd', 'sgd', LR.sgd, 60), k = l * RATE; trail(ctx, T, k, P.butter); var q = pos(T, k);
    stepArrow(ctx, T[Math.min(T.length - 1, Math.floor(k))], LR.sgd * .6); hiker(ctx, q, t, null, { walk: true, pose: 'walk' });
    readout(ctx, 12, H - 64, [['SGD  lr=0.9   step ' + Math.floor(k), P.butter], ['loss = ' + f(q.x, q.y).toFixed(3)]], W);
  }
  var MRATE = 6; // momentum steps per second in the first beat; the second beat replays the start slowly
  function drawMom(ctx, t, l, W, H, why) {
    fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); drawLand(ctx, W, H, t);
    var S0 = tr('sgdsame', 'sgd', LR.mom, 60), M = tr('mom', 'mom', LR.mom, 60), k = why ? Math.min(14, ramp(l, .4, 9) * 14) : l * MRATE;
    trail(ctx, S0, k, 'rgba(255,255,255,.45)', 1.5, true); trail(ctx, M, k, P.teal, 3);
    var q = pos(M, k); marble(ctx, q, 11, P.teal);
    var i = Math.min(M.length - 1, Math.floor(k)), s = M[i], pile = (1 - Math.pow(.9, i)) / .1;
    if (why) readout(ctx, 12, H - 84, [['step ' + i + ', along the floor', P.teal], ['1 + 0.9 + 0.81 + … = ' + pile.toFixed(1) + ' (→ 10)', P.butter], ['push |g| = ' + Math.abs(s.g[0]).toFixed(2) + '  speed |v| = ' + Math.abs(s.v[0]).toFixed(2), P.teal]], W);
    else readout(ctx, 12, H - 64, [['momentum β=0.9  lr=0.1', P.teal], ['loss ' + f(q.x, q.y).toFixed(3) + '  (dotted SGD ' + pos(S0, k).L.toFixed(2) + ')']], W);
    // tiny Newton's cradle
    var cx = W - 70, cy = TOPPAD(W, H) + 20, sw = Math.sin(t * 4); ctx.save(); ctx.strokeStyle = P.chalk; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - 40, cy); ctx.lineTo(cx + 40, cy); ctx.stroke();
    for (var b = -2; b <= 2; b++) { var ang = (b === -2 ? Math.min(0, sw) : b === 2 ? Math.max(0, sw) : 0) * .6, bx = cx + b * 14 + Math.sin(ang) * 36, by = cy + Math.cos(ang) * 36; ctx.beginPath(); ctx.moveTo(cx + b * 14, cy); ctx.lineTo(bx, by); ctx.stroke(); ctx.fillStyle = '#cfd3e6'; ctx.beginPath(); ctx.arc(bx, by, 7, 0, 6.283); ctx.fill(); }
    ctx.restore();
  }
  var ARATE = 6; // Adam steps per second in the first beat; the second replays steps 0-12, the third runs 12-60
  function drawAdam(ctx, t, l, W, H, mode) {
    fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); drawLand(ctx, W, H, t);
    var A = tr('adam', 'adam', LR.adam, 60), k = mode === 'ratio' ? Math.min(12, l * 1.3) : mode === 'bias' ? Math.min(60, 12 + l * 4.8) : l * ARATE; trail(ctx, A, k, P.lav, 3); var q = pos(A, k);
    hiker(ctx, q, t, null, { walk: true, pose: 'walk', coat: P.lav, scarf: P.butter });
    var i = Math.max(1, Math.min(A.length - 1, Math.floor(k))), s = A[i], bc1 = 1 - Math.pow(.9, i), bc2 = 1 - Math.pow(.999, i);
    var mh = [s.m[0] / bc1, s.m[1] / bc1], sv = [Math.sqrt(s.v[0] / bc2), Math.sqrt(s.v[1] / bc2)];
    // two gauges: m-hat and sqrt(v-hat) along/across
    var gx = W - 12, gy = TOPPAD(W, H) + 6, gw = W < 500 ? 150 : 190;
    F.paper(ctx, gx - gw / 2, gy + 50, gw, 96, P.cream, { seed: 'gauges', rot: .02 });
    var bars = [['m along', mh[0], P.orange], ['m across', mh[1], P.orange], ['√v along', sv[0], P.teal], ['√v across', sv[1], P.teal]];
    bars.forEach(function (b, j) {
      var y = gy + 14 + j * 20, x0 = gx - gw + 72, bw = gw - 84, val = clamp(Math.sign(b[1]) * Math.sqrt(Math.abs(b[1])) / 1.6, -1, 1);
      F.hand(ctx, b[0], gx - gw + 8, y, 12, P.ink, { align: 'left', seed: b[0] });
      ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(x0, y - 5, bw, 10); ctx.fillStyle = b[2]; ctx.fillRect(x0 + bw / 2, y - 5, val * bw / 2, 10);
      ctx.fillStyle = P.ink; ctx.fillRect(x0 + bw / 2, y - 7, 1.5, 14);
    });
    var lines = [['Adam  lr=0.3   step ' + i, P.lav]];
    if (mode === 'ratio') { lines.push(['m/√v along  = ' + (mh[0] / sv[0]).toFixed(2), P.butter]); lines.push(['m/√v across = ' + (mh[1] / sv[1]).toFixed(2), P.butter]); }
    else if (mode === 'bias') { lines.push(['1−0.9^t = ' + bc1.toFixed(3) + '  1−0.999^t = ' + bc2.toFixed(3), P.butter]); lines.push(['loss = ' + f(q.x, q.y).toFixed(3)]); }
    else lines.push(['loss = ' + f(q.x, q.y).toFixed(3)]);
    readout(ctx, 12, H - 44 - lines.length * 16, lines, W);
  }

  var chapters = seq([
    { name: 'the wish', dur: 9, need: 'core', cap: {
        1: 'Meet the walker. Where they stand = the model\'s two <b>weights</b>. The height of the ground = the <b>loss</b>: how wrong the model is. Training = walking downhill to the lantern.',
        2: 'A <b>loss surface</b>: every pair of weight values (x, y) has a height f(x, y), the loss. Training hunts for low ground. Real models have millions of weights, so millions of directions.',
        3: 'f = x²/20 + y² + a small Gaussian bump. Curvature 0.1 along x, 2 across y: condition number 20. A ravine: the shape that makes plain gradient descent struggle.' },
      draw: function (ctx, t, l, W, H) {
        fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); drawLand(ctx, W, H, t);
        var q = { x: START[0], y: START[1] }; var lm = S(0, 0); hiker(ctx, q, t, null, { walk: false, pose: l < 4.5 ? 'idle' : 'think', t0: t - l + (l < 4.5 ? 0 : 4.5), look: { x: lm[0], y: lm[1] } });
        F.plane(ctx, lerp(-30, W + 30, (l / 9)), H * .3 + Math.sin(l * 2) * 12, 12, .1, P.cream);
        question(ctx, W, H, l, ramp(l, .3, 1));
      } },
    { name: 'feel the slope', dur: 10, need: 'core', cap: {
        1: 'It\'s dark: the walker can only feel the tilt under their feet. The chalk arrow points straight <b>downhill</b> from here; its length says how steep. That arrow is the (minus) gradient.',
        2: '<b>Gradient</b> = (∂f/∂x, ∂f/∂y): how fast the loss rises if you nudge each weight. It points uphill, so we step along <b>minus</b> it. <code>loss.backward()</code> puts it in <code>p.grad</code>.',
        3: '−∇f(p₀) = (0.52, −4.40): about 8× steeper across the ravine than along it, so the step goes mostly sideways. That imbalance is this week\'s whole problem.' },
      draw: function (ctx, t, l, W, H) {
        fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); drawLand(ctx, W, H, t);
        var q = { x: START[0], y: START[1] };
        // darkness: we only see near our feet
        var p = S(q.x, q.y); ctx.save(); var g = ctx.createRadialGradient(p[0], p[1], V.s * .8, p[0], p[1], V.s * 3.5);
        g.addColorStop(0, 'rgba(10,10,30,0)'); g.addColorStop(1, 'rgba(10,10,30,' + .7 * ramp(l, 0, 1.5) + ')'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
        stepArrow(ctx, q, .6 * ramp(l, 1, 2.5)); var gr0 = grad(q.x, q.y), tip = S(q.x - .6 * gr0[0], q.y - .6 * gr0[1]); hiker(ctx, q, t, null, { walk: false, pose: l < 2.5 ? 'lean-in' : 'point', t0: t - l + (l < 2.5 ? .1 : 2.5), from: 'lean-in', look: { x: tip[0], y: tip[1] }, face: tip[0] < S(q.x, q.y)[0] ? -1 : 1 });
        var gr = grad(q.x, q.y); readout(ctx, 12, H - 64, [['−∇f = (' + (-gr[0]).toFixed(2) + ', ' + (-gr[1]).toFixed(2) + ')', P.butter], ['loss = ' + f(q.x, q.y).toFixed(2)]], W);
        question(ctx, W, H, 9, 1);
      } },
    { name: 'SGD', dur: 10, need: 'core', cap: {
        1: 'Simplest rule: step along the arrow, a fixed fraction of its length. Feel the slope again. Repeat. That\'s <b>gradient descent</b>. Each dot is one real step. It gets there, but zig-zags.',
        2: 'Update: p ← p − lr·g. g is the gradient; <b>lr</b> (learning rate) scales how far you trust it. Here lr = 0.9, and every dot is computed live from the real formula.',
        3: 'θ ← θ − η∇f, η = 0.9. ARENA\'s <code>SGD.step</code>: <code>theta -= self.lr * g</code>, in place, under <code>@t.inference_mode()</code>.' },
      draw: drawSGD },
    { name: 'why it zig-zags', dur: 11, need: 'core', cap: {
        1: 'Why zig-zag? The walls are steep, so the sideways arrow is long and the walker overshoots onto the other wall. The floor is gentle, so each forward step is tiny.',
        2: 'Slope = curvature × distance from the floor, so a step multiplies that distance by (1 − lr × curvature). Across: 1 − 0.9×2 = −0.8, flips side. Along: 1 − 0.9×0.1 = 0.91, crawls.',
        3: 'f = ½cz² ⇒ g = cz ⇒ z ← (1 − ηc)z. Across (c = 2): ×−0.8, so y = 2.20, −1.76, 1.41… Along (c = 0.1): ×0.91. One η can\'t suit both: ill-conditioning.' },
      draw: function (ctx, t, l, W, H) {
        fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); drawLand(ctx, W, H, t);
        var T = tr('sgd', 'sgd', LR.sgd, 60), k = Math.min(5, ramp(l, .5, 9) * 5), q = pos(T, k), n = Math.floor(k);
        // the floor line and the distance-to-floor stick for the current dot
        var a = S(-XM, 0), b = S(XM, 0); ctx.save(); ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.restore();
        var p = S(q.x, q.y), p0 = S(q.x, 0); ctx.save(); ctx.strokeStyle = P.orange; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p0[0], p0[1]); ctx.stroke(); ctx.restore();
        trail(ctx, T, k, P.butter); hiker(ctx, q, t, null, { walk: false, pose: 'walk' });
        var ys = [], xs = []; for (var i = 0; i <= n; i++) { ys.push(T[i].y.toFixed(2)); xs.push(T[i].x.toFixed(2)); }
        readout(ctx, 12, H - 84, [['across y: ' + (n > 3 ? '… ' : '') + ys.slice(-4).join(' → '), P.orange], ['  each step ×(1 − 0.9·2) = ×−0.8', P.orange], ['along  x: ' + xs.slice(-3).join(' → ') + '  ×0.91', P.teal]], W);
      } },
    { name: 'step size', dur: 10, need: 'core', cap: {
        1: 'Tiny steps (pink): safe but painfully slow. Too-big steps (orange): each bounce lands higher up the opposite wall, until the walker flies out. Only the step size differs.',
        2: 'lr 0.08 crawls. lr 1.08 diverges: the across factor is 1 − 1.08×2 = −1.16, bigger than 1 in size, so every bounce is 16% larger. Stable only while lr < 2 ÷ steepest curvature = 1.',
        3: 'Need |1 − ηλ| < 1 for every curvature λ ⇒ η < 2/λ_max = 1.0. At η = 0.08 the flat direction shrinks ×0.992 per step (~125 steps per e-fold). Hence lr sweeps.' },
      draw: function (ctx, t, l, W, H) {
        fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); drawLand(ctx, W, H, t);
        var A = tr('small', 'sgd', LR.small, 60), B = tr('big', 'sgd', LR.big, 60), k = l * RATE;
        trail(ctx, A, k, P.pink); trail(ctx, B, Math.min(k, 40), P.orange);
        var qa = pos(A, k), qb = pos(B, Math.min(k, 40)); marble(ctx, qa, 8, P.pink);
        if (!B[Math.min(B.length - 1, Math.floor(k))].dead) marble(ctx, qb, 8, P.orange);
        else { var pb = S(clamp(qb.x, -XM, XM), clamp(qb.y, -YM, YM)); lbl(ctx, 'boing!', pb[0], pb[1], P.orange, 20); }
        readout(ctx, 12, H - 64, [['lr=0.08  loss ' + f(qa.x, qa.y).toFixed(2), P.pink], ['lr=1.08  loss ' + (isFinite(qb.L) ? f(qb.x, qb.y).toFixed(1) : '∞'), P.orange]], W);
      } },
    { name: 'momentum', dur: 10, need: 'core', cap: {
        1: 'Swap the walker for a <b>heavy marble</b>. It keeps its speed between steps. Side-to-side pushes alternate, so they cancel; the forward push repeats, so speed builds up.',
        2: '<b>Momentum</b> keeps a velocity v: v ← β·v + g, then p ← p − lr·v. With β = 0.9 each old push keeps 90% of its effect every step. Dotted line: plain SGD at the same lr.',
        3: 'ARENA SGD with μ ≠ 0: <code>b.copy_(self.mu * b + g)</code>, then <code>theta -= self.lr * b</code>. μ = 0.9, γ = 0.1. Dotted: μ = 0 at the same γ.' },
      draw: function (ctx, t, l, W, H) { drawMom(ctx, t, l, W, H, false); } },
    { name: 'why momentum works', dur: 10, need: 'core', cap: {
        1: 'Andrew Ng\'s picture: each gradient is a <b>push</b>, v is the marble\'s <b>speed</b>, β = 0.9 is <b>friction</b>. A push that repeats piles up to ~10 pushes\' worth; pushes that flip sides cancel.',
        2: 'Why 10? If g stays the same, v settles where v = 0.9v + g, so v = g ÷ (1 − 0.9) = 10g. Rule of thumb: β = 0.9 remembers ~10 steps; β = 0.999, ~1000.',
        3: 'Steady state v* = g/(1−μ): effective lr η/(1−μ) = 1.0. Ng writes v = βv + (1−β)g, the same thing scaled by (1−β); lr absorbs it. ARENA/PyTorch use the b = μb + g form.' },
      draw: function (ctx, t, l, W, H) { drawMom(ctx, t, l, W, H, true); credit(ctx, W, NG); } },
    { name: 'Adam: two notebooks', dur: 10, need: 'core', cap: {
        1: '<b>Adam</b> keeps two running averages per direction, like a weather report\'s average temperature: <b>m</b> = average slope over the last ~10 steps, <b>v</b> = average squared slope over ~1000.',
        2: 'An <b>exponentially weighted average</b>: avg ← β·avg + (1−β)·new. Old values fade by β each step, so it spans about 1/(1−β) steps: 10 for β = 0.9, 1000 for β = 0.999.',
        3: 'm ← β₁m + (1−β₁)g; v ← β₂v + (1−β₂)g². Squaring drops the sign: v tracks size only. g/√v alone (no m) is RMSprop, the exercise before Adam.' },
      draw: function (ctx, t, l, W, H) { drawAdam(ctx, t, l, W, H, 'plain'); credit(ctx, W, NG); } },
    { name: 'Adam: m ÷ √v', dur: 10, need: 'core', cap: {
        1: 'Step = m ÷ √v: "which way" divided by "how big it usually is". Replay: the wall is 8× steeper than the floor, yet both steps come out the same size (readout ≈ ±1).',
        2: 'Why the square root? v is in gradient² units; √v is back in gradient units, so m ÷ √v is a plain number, ±1 while the slope is steady. Step ≈ lr in every direction, however steep.',
        3: 'Δθ = −γ·m̂/(√v̂ + ε). Steps 1–5: m̂/√v̂ ≈ (−1.0, +1.0) though |g| is 0.52 vs 4.4. Scale a weight\'s gradients by k: its step is unchanged. Diagonal preconditioner.' },
      draw: function (ctx, t, l, W, H) { drawAdam(ctx, t, l, W, H, 'ratio'); } },
    { name: 'Adam: small print', dur: 10, need: 'exercise', cap: {
        1: 'Small print you\'ll code once: both averages start at 0, so the first few are far too small (after one step m is only 10% of g). Dividing by 1 − β<sup>t</sup> is the warm-up fix.',
        2: 'Bias correction: m̂ = m/(1−β₁ᵗ), v̂ = v/(1−β₂ᵗ), t counting from 1, so at t = 1, m̂ = g exactly. ε = 1e-8 under the division just stops 0 ÷ 0.',
        3: '<code>self.t</code> starts at 1. Later m̂/√v̂ falls toward 0: v\'s ~1000-step memory still holds the steep early slopes, so Adam slows near the floor. ε, AdamW: deep film.' },
      draw: function (ctx, t, l, W, H) { drawAdam(ctx, t, l, W, H, 'bias'); credit(ctx, W, NG); } },
    { name: 'loss boy', dur: 10, need: 'core', cap: {
        1: 'In real training you never see the map, only this: loss over time. Lower = nearer the lantern. Surprise: on this small map, plain SGD with a well-chosen step ends lowest.',
        2: 'Same start, three optimisers, loss (log scale) vs step. SGD at lr 0.9, just under its 1.0 limit, wins here; momentum and Adam overshoot and circle. So: sweep, don\'t assume.',
        3: 'κ = 20 is mild: tuned GD needs ~κ steps, tuned momentum ~√κ. Real nets have huge κ and one lr for all directions, which is where Adam-style scaling earns its keep.' },
      draw: function (ctx, t, l, W, H) {
        fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); ctx.globalAlpha = .35; drawLand(ctx, W, H, t); ctx.globalAlpha = 1;
        var gw = Math.min(W - 40, 460), gh = gw * .72, gx = (W - gw) / 2, gy = (H - gh) / 2 - 10;
        var r = F.gameboy(ctx, gx, gy, gw, gh, { label: 'LOSS BOY' });
        var runs = [['sgd', tr('sgd', 'sgd', LR.sgd, 60), '#2f5d3a'], ['mom', tr('mom', 'mom', LR.mom, 60), '#1f3f7a'], ['adam', tr('adam', 'adam', LR.adam, 60), '#6b2f7a']];
        var n = Math.floor(ramp(l, .3, 4.5) * 60);
        runs.forEach(function (R, j) {
          ctx.save(); ctx.strokeStyle = R[2]; ctx.lineWidth = 2.5; ctx.beginPath();
          for (var i = 0; i <= n; i++) { var L = Math.log10(Math.max(1e-4, R[1][i].L)), x = r.x + 8 + (r.w - 16) * i / 60, y = r.y + 8 + (r.h - 30) * (1 - (L + 4) / 5); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
          ctx.stroke(); ctx.restore();
          ctx.fillStyle = R[2]; ctx.font = '700 12px ' + F.MONO; ctx.fillText(['SGD', 'MOMENTUM', 'ADAM'][j], r.x + 10 + j * (r.w / 3.2), r.y + r.h - 8);
        });
      } },
    { name: 'where it stops being true', dur: 10, need: 'core', cap: {
        1: 'Honest bit: real maps have millions of directions, so the gradient is a list of millions of nudges, one per weight. And each <b>batch</b> of data tilts the ground a bit differently.',
        2: 'Minibatch SGD: g is measured on a small batch, so it\'s a noisy guess of the true slope, right on average. Bigger batch = less noise, more compute per step. Batch size is a knob.',
        3: 'E[g_B] = ∇L, variance ∝ 1/|B|. ARENA notes too-large batches can generalise worse. High-dimensional surfaces have far more saddle points than little bowls.' },
      draw: function (ctx, t, l, W, H) {
        fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); drawLand(ctx, W, H, t, ramp(l, 0, 1.5));
        var N = run('sgd', 0.3, START[0], START[1], 60, 3.0), k = l * RATE * 1.5; trail(ctx, N, k, P.butter, 2); hiker(ctx, pos(N, k), t, null, { walk: true, pose: 'walk' });
        var p = ramp(l, .6, 1.6); F.cornerFlip(ctx, W, H, p, P.cream);
        if (p > .5) {
          ctx.save(); ctx.globalAlpha = ramp(l, 1.4, 2.2); var sz = W < 500 ? 14 : 18, x = W - Math.min(W, H) * .3, y = H - Math.min(W, H) * .22;
          F.hand(ctx, 'really: 10⁹ directions', x, y - sz * 1.4, sz, P.ink, { seed: 'r1', rot: -.6 });
          F.hand(ctx, 'and a shaky floor', x + sz * .8, y, sz, P.ink, { seed: 'r2', rot: -.6 });
          ctx.restore();
        }
        credit(ctx, W, B3);
      } },
    { name: 'which walker wins?', dur: 11, need: 'contested', cap: {
        1: 'Is Adam the best walker? <b>Current method:</b> AdamW, almost everywhere. <b>Emerging:</b> newer walkers (e.g. Muon) look faster on some big models. <b>You need:</b> SGD up to AdamW.',
        2: 'Current: AdamW trains most large models. Emerging: Muon, Lion, Shampoo and others report speed-ups that often shrink under careful tuning. For [0.3]: SGD, RMSprop, Adam, AdamW.',
        3: 'Muon orthogonalises the momentum update of 2-D hidden weights (ARENA [0.3] bonus). Ask of any claim: what evidence would change your mind? A fairly tuned rerun.' },
      draw: function (ctx, t, l, W, H) {
        fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); ctx.globalAlpha = .35; drawLand(ctx, W, H, t); ctx.globalAlpha = 1;
        var A = tr('adam', 'adam', LR.adam, 60); trail(ctx, A, 60, P.lav, 2.5);
        hiker(ctx, A[60], t, Math.min(V.s * .85, 46), { walk: false, lantern: !(l > 3.5 && l < 8), pose: l > 3.5 && l < 8 ? 'shrug' : 'think', t0: t - l + (l > 3.5 && l < 8 ? 3.5 : l >= 8 ? 8 : .2), from: l >= 8 ? 'shrug' : 'idle', coat: P.lav, scarf: P.butter });
        var sz = W < 500 ? 15 : 21, x = W / 2, y = H * .2;
        F.note(ctx, 'current default: AdamW', x, y, sz, { color: P.mint, seed: 'cur', rot: -.02, reveal: ramp(l, .3, 1.3) });
        if (l > 2) F.note(ctx, 'emerging: Muon? Lion? Shampoo?', x, y + sz * 3.1, sz * .9, { color: P.peach, seed: 'emg', rot: .03, reveal: ramp(l, 2, 3.4) });
        if (l > 5) F.note(ctx, 'you need: SGD → AdamW', x, y + sz * 6.1, sz, { color: P.butter, seed: 'need', rot: -.01, reveal: ramp(l, 5, 6.2) });
      } },
    { name: 'the code', dur: 10, need: 'exercise', cap: {
        1: 'Every step you watched is a line or two of code. On Saturday you write one small class each: SGD (with momentum), RMSprop, Adam, AdamW, and test them against PyTorch\'s.',
        2: 'Each class keeps a little memory per weight (b, v, m) and a <code>step()</code> that reads <code>p.grad</code> and nudges <code>p</code> in place. After that, it\'s <code>torch.optim.AdamW</code> for life.',
        3: 'In place matters: <code>theta -= ...</code> edits the Parameter the model holds; <code>theta = theta - ...</code> makes a new tensor the model never sees. <code>tests.test_sgd</code> and friends.' },
      draw: function (ctx, t, l, W, H) {
        fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); ctx.globalAlpha = .25; drawLand(ctx, W, H, t); ctx.globalAlpha = 1;
        var sz = W < 500 ? 13 : 18, lines = [
          ['SGD', ['p -= lr * p.grad'], P.butter, 0],
          ['momentum', ['v = mu*v + g', 'p -= lr * v'], P.teal, 2],

        var y = H * .16;
        lines.forEach(function (L, j) {
          var a = ramp(l, L[3] * .9, L[3] * .9 + .8); if (a <= 0) return;
          ctx.save(); ctx.globalAlpha = a; var h = L[1].length * sz * 1.5 + sz * 2;
          var w = Math.min(W - 24, Math.max.apply(null, L[1].map(function (s) { return F.textW(ctx, s, sz, F.MONO); })) + 40);
          F.paper(ctx, W / 2, y + h / 2, w, h, P.cream, { seed: 'code' + j, rot: (j - 1) * .015 });
          F.hand(ctx, L[0], W / 2 - w / 2 + 14, y + sz, sz * .95, '#6b5a9a', { align: 'left', seed: L[0] });
          L[1].forEach(function (s, i) { F.hand(ctx, s, W / 2 - w / 2 + 14, y + sz * 2.2 + i * sz * 1.5, sz, P.ink, { align: 'left', font: F.MONO, bold: false, wobble: .3, seed: s, reveal: ramp(l, L[3] * .9 + .2 + i * .3, L[3] * .9 + 1 + i * .3) }); });
          ctx.restore(); y += h + 14;
        });

    { name: 'why it matters', dur: 8, need: 'core', cap: {
        1: 'Every AI you\'ll ever look inside was shaped by this walk: millions of small steps downhill. The loss you choose is the ground; the optimiser is how the walker moves over it.',
        2: 'Training = choose a loss, then let an optimiser walk downhill. Change either and you get a different model. That\'s why interpretability cares how a model was trained.',
        3: 'Optimisers leave fingerprints: e.g. evidence links Adam\'s per-coordinate scaling to privileged bases and outlier dimensions in transformers (active research).' },
      draw: function (ctx, t, l, W, H) {
        fit(W, H, TOPPAD(W, H), 0); bg(ctx, W, H, t); drawLand(ctx, W, H, t);

        var sz = W < 500 ? 17 : 24; ctx.save(); ctx.globalAlpha = ramp(l, .2, 1);

  /* ---------------- coda: now you drive ---------------- */
  var C = { start: null, opt: 'race', lr: 0.3, runs: [], k: 0 };
