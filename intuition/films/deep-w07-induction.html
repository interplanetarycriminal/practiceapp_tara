<noscript>This film is drawn live with JavaScript.</noscript>

<script>
(function () {
  'use strict';
  var F = IFilm, P = F.P, ramp = F.ramp, clamp = F.clamp, lerp = F.lerp, rng = F.rng;

  /* ===MODEL=== a real 2-layer, attention-only toy transformer built from explicit weight matrices.
     Residual stream d=63 in named subspaces: TOK [0,16) | POS [16,30) | PREV [30,46) | OUT [46,62) | ONE (a constant 'I am a real token' feature) | BOS flag.
     L0 head (previous-token head, "0.7"): W_Q0 reads POS(i), W_K0 reads POS(j) shifted, so W_QK0 prefers j=i-1.
       W_V0 reads TOK, W_O0 writes PREV: W_OV0 = W_V0 W_O0 stamps "the token before me was A".
     L1 head (induction head, "1.4"): W_Q1 reads TOK, W_K1 reads PREV (K-composition).
       W_V1 reads TOK (plus a little noise), W_O1 writes OUT. W_U reads OUT through W_E^T (so the direct path is silent). */
  var M = (function () {
    var V = 12, DT = 16, NP = 14, DH = 16, o = { TOK: 0, POS: 16, PREV: 30, OUT: 46, ONE: 62, BOS: 63 }, D = 64;
    var r = rng('deep7');
    function gauss() { return Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(6.2832 * r()); }
    function zeros(a, b) { var m = []; for (var i = 0; i < a; i++) { m.push(new Float64Array(b)); } return m; }
    function mm(A, B) { var n = A.length, k = B.length, p = B[0].length, C = zeros(n, p); for (var i = 0; i < n; i++) for (var j = 0; j < k; j++) { var a = A[i][j]; if (a) for (var l = 0; l < p; l++) C[i][l] += a * B[j][l]; } return C; }
    function T(A) { var C = zeros(A[0].length, A.length); for (var i = 0; i < A.length; i++) for (var j = 0; j < A[0].length; j++) C[j][i] = A[i][j]; return C; }
    function fro(A) { var s = 0; for (var i = 0; i < A.length; i++) for (var j = 0; j < A[0].length; j++) s += A[i][j] * A[i][j]; return Math.sqrt(s); }
    // token embeddings W_E (V+1 rows, last is BOS): random unit vectors inside TOK
    var W_E = zeros(V + 1, D);
    for (var v = 0; v <= V; v++) { var n = 0, e = []; for (var k = 0; k < DT; k++) { e.push(gauss()); n += e[k] * e[k]; } n = Math.sqrt(n); if (v < V) { for (k = 0; k < DT; k++) W_E[v][o.TOK + k] = e[k] / n; W_E[v][o.ONE] = 1; } else W_E[v][o.BOS] = 1; }
    var W_pos = zeros(NP, D); for (var p = 0; p < NP; p++) W_pos[p][o.POS + p] = 1;
    var bP = Math.sqrt(9), bI = Math.sqrt(9);
    var W_Q0 = zeros(D, DH), W_K0 = zeros(D, DH), W_V0 = zeros(D, DH), W_O0 = zeros(DH, D);
    for (p = 0; p < NP && p < DH; p++) { W_Q0[o.POS + p][p] = bP; if (p + 1 < DH) W_K0[o.POS + p][p + 1] = bP; }
    W_K0[o.POS + 0][0] = bP; // BOS rests on itself
    for (k = 0; k < DT; k++) { W_V0[o.TOK + k][k] = 1; W_O0[k][o.PREV + k] = 1; }
    var W_Q1 = zeros(D, DH + 1), W_K1 = zeros(D, DH + 1), W_V1 = zeros(D, DH + 1), W_O1 = zeros(DH + 1, D);
    W_Q1[o.ONE][DH] = Math.sqrt(5); W_K1[o.POS][DH] = Math.sqrt(5); // attention sink: with no match, rest on BOS
    for (k = 0; k < DT; k++) { W_Q1[o.TOK + k][k] = bI; W_K1[o.PREV + k][k] = bI; W_O1[k][o.OUT + k] = 1; for (var l = 0; l < DH; l++) W_V1[o.TOK + k][l] = (k === l ? 1 : 0) + .12 * gauss(); }
    var GAM = 7, W_U = zeros(D, V); for (v = 0; v < V; v++) for (k = 0; k < DT; k++) W_U[o.OUT + k][v] = GAM * W_E[v][o.TOK + k];
    var W_OV0 = mm(W_V0, W_O0), W_QK1 = mm(W_Q1, T(W_K1)), W_OV1 = mm(W_V1, W_O1);
    var WE = W_E.slice(0, V);
    var fullOV = mm(mm(WE, W_OV1), W_U);                       // W_E W_OV W_U : (V, V)
    var Kcomp = mm(mm(WE, W_QK1), T(mm(WE, W_OV0)));            // W_E W_QK^1 (W_E W_OV^0)^T : query tok x key tok
    function top1(A) { var c = 0; for (var i = 0; i < A.length; i++) { var b = 0; for (var j = 1; j < A[i].length; j++) if (A[i][j] > A[i][b]) b = j; if (b === i) c++; } return c / A.length; }
    function comp(WA, WB) { return fro(mm(WA, WB)) / (fro(WA) * fro(WB)); }
    var R = zeros(D, D), rr = rng('randhead'); for (var i = 0; i < D; i++) for (var j = 0; j < D; j++) R[i][j] = Math.sqrt(-2 * Math.log(rr() + 1e-9)) * Math.cos(6.2832 * rr());
    var compK = comp(W_OV0, T(W_QK1)), compRand = comp(R, T(W_QK1)), compQ = comp(W_OV0, W_QK1);
    function softmax(xs) { var m = -1e9, i; for (i = 0; i < xs.length; i++) m = Math.max(m, xs[i]); var s = 0, e = []; for (i = 0; i < xs.length; i++) { e.push(Math.exp(xs[i] - m)); s += e[i]; } for (i = 0; i < e.length; i++) e[i] /= s; return e; }
    function rowdot(x, Wm, col) { var s = 0; for (var k = 0; k < x.length; k++) if (x[k]) s += x[k] * Wm[k][col]; return s; }
    function proj(x, Wm) { var out = new Float64Array(Wm[0].length); for (var k = 0; k < x.length; k++) if (x[k]) for (var l = 0; l < out.length; l++) out[l] += x[k] * Wm[k][l]; return out; }
    function head(X, WQ, WK, WV, WO, scale) {
      var L = X.length, Q = X.map(function (x) { return proj(x, WQ); }), K = X.map(function (x) { return proj(x, WK); }), Vv = X.map(function (x) { return proj(x, WV); }), A = [], out = [];
      for (var i = 0; i < L; i++) {
        var sc = []; for (var j = 0; j <= i; j++) { var s = 0; for (var l = 0; l < Q[i].length; l++) s += Q[i][l] * K[j][l]; sc.push(s); }
        var a = softmax(sc); A.push(a);
        var dh = WV[0].length, z = new Float64Array(dh); for (j = 0; j <= i; j++) for (l = 0; l < dh; l++) z[l] += a[j] * Vv[j][l];
        var w = proj(z, WO); for (l = 0; l < D; l++) w[l] *= scale; out.push(w);
      }
      return { A: A, out: out };
    }
    // run(tokens incl. BOS at 0, ablate = scale on the L0 head output)
    function run(toks, s0) {
      if (s0 == null) s0 = 1;
      var X = toks.map(function (t, i) { var x = new Float64Array(D); for (var k = 0; k < D; k++) x[k] = W_E[t][k] + W_pos[i][k]; return x; });
      var h0 = head(X, W_Q0, W_K0, W_V0, W_O0, s0); X = X.map(function (x, i) { var y = new Float64Array(D); for (var k = 0; k < D; k++) y[k] = x[k] + h0.out[i][k]; return y; });
      var h1 = head(X, W_Q1, W_K1, W_V1, W_O1, 1); X = X.map(function (x, i) { var y = new Float64Array(D); for (var k = 0; k < D; k++) y[k] = x[k] + h1.out[i][k]; return y; });
      var loss = [], pred = [];
      for (var i = 0; i < toks.length - 1; i++) {
        var lg = []; for (var v = 0; v < V; v++) lg.push(rowdot(X[i], W_U, v)); var pr = softmax(lg), b = 0; for (v = 1; v < V; v++) if (pr[v] > pr[b]) b = v;
        loss.push(-Math.log(pr[toks[i + 1]])); pred.push(b);
      }
      var n = (toks.length - 1) / 2, sc = 0, c = 0; for (i = n + 1; i < toks.length; i++) { sc += h1.A[i][i - n + 1]; c++; }
      var s0sc = 0; for (i = 1; i < toks.length; i++) s0sc += h0.A[i][i - 1]; s0sc /= toks.length - 1;
      var lp = 0, lr = 0; for (i = 0; i < n; i++) lp += loss[i]; for (i = n; i < 2 * n; i++) lr += loss[i];
      return { A0: h0.A, A1: h1.A, loss: loss, pred: pred, ind: sc / c, prev: s0sc, lossPlay: lp / n, lossRerun: lr / n, n: n };
    }
    function repTokens(seed, n) { var q = rng(seed), a = []; for (var i = 0; i < n; i++) a.push(Math.floor(q() * V)); return [V].concat(a, a); }
    return { V: V, D: D, NP: NP, o: o, W_E: W_E, W_OV0: W_OV0, W_QK1: W_QK1, fullOV: fullOV, Kcomp: Kcomp, top1: top1, compK: compK, compQ: compQ, compRand: compRand, run: run, repTokens: repTokens, GAM: GAM };
  })();
  /* ===END MODEL=== */

  /* ---------------- the tape: repeated random tokens, as in generate_repeated_tokens ---------------- */
  var VOC = ['Furby', 'Nokia', 'Snake', 'VHS', 'MSN', 'Win98', 'modem', 'Zip', 'Sega', 'Pogs', 'Tetris', 'Kazaa'];
  var SEQ = 6, TOK = M.repTokens('tape3', SEQ), RUN = M.run(TOK, 1), RUN0 = M.run(TOK, 0);
  function nm(t) { return t === M.V ? 'BOS' : VOC[t]; }
  function ph(W) { return W < 600; }
  function bg(ctx, W, H, t) { F.sky(ctx, W, H, P.night, '#2b2f5c'); F.stars(ctx, W, H, t, 'deep7', 46); }
  function lbl(ctx, text, x, y, color, sz, o) { o = o || {}; F.hand(ctx, text, x, y, sz || 15, color || P.chalk, { outline: 4, outlineColor: 'rgba(20,20,50,.85)', seed: text, align: o.align, reveal: o.reveal, rot: o.rot }); }
  function readout(ctx, x, y, lines, W, right) {
    var sz = W < 500 ? 12 : 14; ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l[0]).width); }); ctx.restore();
    if (right) x = x - w - 22;
    F.paper(ctx, x + w / 2 + 10, y + lines.length * sz * .65 + 4, w + 22, lines.length * sz * 1.3 + 12, 'rgba(22,26,53,.92)', { seed: 'ro' + lines.length, shadow: false });
    ctx.save(); ctx.font = '600 ' + sz + 'px ' + F.MONO; ctx.textBaseline = 'top';
    lines.forEach(function (l, i) { ctx.fillStyle = l[1] || P.chalk; ctx.fillText(l[0], x + 10, y + 8 + i * sz * 1.3); }); ctx.restore();
    return lines.length * sz * 1.3 + 12;
  }
  // tape geometry: row 0 = BOS + first pass, row 1 = rerun (aligned under the same token)
  var G = { x0: 0, cw: 0, ch: 0, y: [0, 0] };
  function layout(W, H, n, top) { var cols = n + 1; G.cw = Math.min(78, (W - 24) / cols); G.ch = Math.min(46, G.cw * .78); G.x0 = (W - G.cw * cols) / 2; G.y = [top, top + G.ch + 12]; }
  function cardXY(i, n) { n = n || SEQ; if (i <= n) return [G.x0 + G.cw * (i + .5), G.y[0] + G.ch / 2]; return [G.x0 + G.cw * (i - n + .5), G.y[1] + G.ch / 2]; }
  function drawTape(ctx, W, toks, a, hi, n) {
    n = n || (toks.length - 1) / 2; ctx.save(); ctx.globalAlpha = a == null ? 1 : a;
    var fs = Math.max(10, Math.min(15, G.cw * .23));
    for (var i = 0; i < toks.length; i++) {
      var p = cardXY(i, n), col = i === 0 ? P.lav : i <= n ? P.butter : P.mint;
      if (hi && hi[i]) { F.glow(ctx, p[0], p[1], G.cw * .7, 'rgba(247,227,160,.8)', hi[i]); }
      F.paper(ctx, p[0], p[1], G.cw - 5, G.ch - 4, col, { seed: 'c' + i, rot: ((i * 37) % 7 - 3) * .006, shadow: true, blur: 4, lift: 2 });
      F.hand(ctx, nm(toks[i]), p[0], p[1], fs, P.ink, { seed: 'n' + i });
    }
    F.hand(ctx, 'play', G.x0 - 2, G.y[0] - 9, 11, P.butter, { align: 'left', seed: 'play' });
    F.hand(ctx, 'rerun', G.x0 + G.cw + 2, G.y[1] + G.ch + 9, 11, P.mint, { align: 'left', seed: 'rr' });
    ctx.restore();
  }
  // heatmaps. mode 'attn': 0..1 on a causal grid. mode 'div': diverging, scaled by vmax.
  function heat(ctx, x, y, s, A, o) {
    o = o || {}; var L = A.length, c = s / L, vmax = o.vmax || 1; ctx.save(); ctx.globalAlpha = o.a == null ? 1 : o.a;
    F.paper(ctx, x + s / 2, y + s / 2, s + 14, s + 14, P.cream, { seed: 'heat' + (o.seed || ''), rot: .006 });
    for (var i = 0; i < L; i++) for (var j = 0; j < A[i].length || j < L; j++) {
      var v = A[i][j];
      if (o.mode === 'div') {
        var u = clamp(v / vmax, -1, 1);
        ctx.fillStyle = u >= 0 ? 'rgb(' + Math.round(lerp(247, 226, u)) + ',' + Math.round(lerp(240, 104, u)) + ',' + Math.round(lerp(225, 92, u)) + ')'
          : 'rgb(' + Math.round(lerp(247, 90, -u)) + ',' + Math.round(lerp(240, 140, -u)) + ',' + Math.round(lerp(225, 210, -u)) + ')';
      } else {
        if (v == null) { ctx.fillStyle = 'rgba(42,41,52,.08)'; }
        else { var w = clamp(v, 0, 1); ctx.fillStyle = 'rgb(' + Math.round(lerp(247, 214, w)) + ',' + Math.round(lerp(240, 84, w)) + ',' + Math.round(lerp(225, 104, w)) + ')'; }
      }
      ctx.fillRect(x + j * c + .5, y + i * c + .5, c - 1, c - 1);
    }
    if (o.row != null) { ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.strokeRect(x - 1, y + o.row * c, s + 2, c); }
    if (o.col != null) { ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.strokeRect(x + o.col * c, y - 1, c, s + 2); ctx.setLineDash([]); }
    if (o.title) lbl(ctx, o.title, x + s / 2, y - 18, o.tc || P.chalk, o.ts || 14);
    if (o.xl) lbl(ctx, o.xl, x + s / 2, y + s + 16, P.chalk, 11);
    if (o.yl) lbl(ctx, o.yl, x - 12, y + s / 2, P.chalk, 11, { rot: -Math.PI / 2 });
    ctx.restore();
  }
  function tri(A) { return A.map(function (row, i) { var r = []; for (var j = 0; j < A.length; j++) r.push(j <= i ? row[j] : null); return r; }); }
  function blendA(A, B, u) { return A.map(function (row, i) { return row.map(function (v, j) { return lerp(v, B[i][j], u); }); }); }
  function stats(Mx) { var d = 0, off = 0, n = Mx.length; for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) { if (i === j) d += Mx[i][j] / n; else off += Mx[i][j] / (n * n - n); } return { d: d, off: off }; }
  var OVS = stats(M.fullOV), KCS = stats(M.Kcomp);
  // block norms of W_OV0 over the named subspaces: which band writes into which
  var BANDS = [['TOK', M.o.TOK, 16], ['POS', M.o.POS, 14], ['PREV', M.o.PREV, 16], ['OUT', M.o.OUT, 16]];
  var OV0B = BANDS.map(function (a) { return BANDS.map(function (b) { var s = 0; for (var i = 0; i < a[2]; i++) for (var j = 0; j < b[2]; j++) { var v = M.W_OV0[a[1] + i][b[1] + j]; s += v * v; } return Math.sqrt(s) / 4; }); });
  // per-token loss chart (loss[i] = loss predicting token i+1), with the ln(12) "pure guessing" line
  function lossChart(ctx, R, a, x, y, w, h) {
    ctx.save(); ctx.globalAlpha = a; var L = R.loss.length, c = w / L, top = 4.2;
    F.paper(ctx, x + w / 2, y + h / 2 + 4, w + 20, h + 34, 'rgba(22,26,53,.85)', { seed: 'lc', shadow: false });
    for (var i = 0; i < L; i++) { var bh = h * clamp(R.loss[i] / top, 0, 1); ctx.fillStyle = i < R.n ? 'rgba(232,116,124,.95)' : 'rgba(125,181,138,.95)'; ctx.fillRect(x + i * c + 2, y + h - bh, c - 4, bh); }
    var gy = y + h - h * Math.log(12) / top; ctx.strokeStyle = P.butter; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke(); ctx.setLineDash([]);
    F.hand(ctx, 'ln 12: guessing', x + w, gy - 9, 11, P.butter, { align: 'right', seed: 'ln' });
    F.hand(ctx, 'first pass', x + w * .25, y + h + 12, 11, P.pink, { seed: 'fp' }); F.hand(ctx, 'rerun', x + w * .75, y + h + 12, 11, P.mint, { seed: 'rrn' });
    ctx.restore();
  }
  function codeNote(ctx, lines, x, y, sz, a, seed, color) {
    ctx.save(); ctx.globalAlpha = a; ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l).width); });
    var h = lines.length * sz * 1.4 + 16; F.paper(ctx, x + w / 2 + 12, y + h / 2, w + 24, h, color || P.cream, { seed: seed || 'code', rot: -.004 });
    ctx.fillStyle = P.ink; ctx.textBaseline = 'top'; lines.forEach(function (l, i) { ctx.fillStyle = l.charAt(0) === '#' ? '#7a6f8f' : P.ink; ctx.fillText(l, x + 12, y + 8 + i * sz * 1.4); });
    ctx.restore(); return { w: w + 24, h: h };
  }
  function fitMono(ctx, lines, maxW, big) { var sz = big; ctx.save(); for (; sz > 8; sz -= .5) { ctx.font = '600 ' + sz + 'px ' + F.MONO; var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l).width); }); if (w + 26 <= maxW) break; } ctx.restore(); return sz; }
  function cartridge(ctx, x, y, w, h, title, sub, col, a) {
    ctx.save(); ctx.globalAlpha = a; var r = F.gameboy(ctx, x, y, w, h, { label: sub, body: col });
    F.hand(ctx, title, r.x + r.w / 2, r.y + r.h / 2, Math.min(18, r.w / 7), '#2f3a1e', { seed: title }); ctx.restore();
  }

  /* ---------------- predict, then watch (never gated) ---------------- */
  var PRED = { el: null, asked: false, choice: null, lastT: 0 };
  var PRED_T = 97;
  function predUI(api) {
    if (PRED.el) return PRED.el;
    var d = document.createElement('div');
    d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Predict, then watch');
    d.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,440px);background:#f7f0e1;color:#2a2934;border-radius:10px;padding:14px 14px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;z-index:5;font:15px/1.35 system-ui,sans-serif';
    d.innerHTML = '<div style="font:700 18px ' + F.HAND + ';margin-bottom:8px">Predict, then watch: if W_OV were the identity, what would the head do?</div>' +
      ['copy the token it looks at', 'predict the token before it', 'blur everything to an average'].map(function (s, i) { return '<button data-c="' + i + '" style="display:block;width:100%;text-align:left;margin:6px 0;padding:9px 10px;border:0;border-radius:8px;background:#f7e3a0;color:#2a2934;font:inherit;cursor:pointer">' + s + '</button>'; }).join('') +
      '<button data-c="skip" style="display:block;margin:8px 0 0 auto;padding:6px 10px;border:0;border-radius:8px;background:#b9e3cc;color:#2a2934;font:inherit;cursor:pointer">just show me &#9654;</button>';
    d.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    [].forEach.call(d.querySelectorAll('button'), function (b) { b.onclick = function (e) { e.stopPropagation(); PRED.choice = b.dataset.c; d.style.display = 'none'; api.audio.blip(b.dataset.c === '0' ? 988 : 660); var pp = api.root.querySelector('.pp'); if (pp && pp.getAttribute('aria-label') === 'Play') pp.click(); }; });
    api.root.querySelector('.stage').appendChild(d); PRED.el = d; return d;
  }
  function predTick(t, api) {
    var d = predUI(api), prev = PRED.lastT; PRED.lastT = t;
    if (!PRED.asked && prev < PRED_T && t >= PRED_T && t - prev < .5) {
      PRED.asked = true; d.style.display = 'block';
      var pp = api.root.querySelector('.pp'); if (pp && pp.getAttribute('aria-label') === 'Pause') pp.click();
    }
    if (d.style.display === 'block' && (t < PRED_T - .6 || t > PRED_T + .6)) d.style.display = 'none';
  }

  /* ---------------- chapters ---------------- */
  var chapters = [
    { name: 'the rerun', start: 0, dur: 18, cap: {
        1: 'A tape of <b>random words</b>, played twice. The first time, the model can only guess. The second time it gets it almost right. Let us find the machine that does that.',
        2: 'Repeated random tokens: <code>[BOS] A B C D E F A B C D E F</code>. Loss is high on the first pass and falls on the rerun. Every number is computed live by a real 2-layer toy model.',
        3: 'Same set-up as ARENA <code>generate_repeated_tokens</code>: BOS then a random half repeated. Toy: attention-only, 2 layers, d_model = 64, d_vocab = 12. ln(12) = 2.48 nats is pure guessing; the red bars sit at or above it, the green ones drop.' },
      draw: function (ctx, t, l, W, H) {
        bg(ctx, W, H, t); var top = ph(W) ? 150 : 170; layout(W, H, SEQ, top);
        // the VHS label with the question
        var lw = Math.min(W - 40, 420), ly = ph(W) ? 58 : 70;
        ctx.save(); ctx.globalAlpha = ramp(l, 0, 1);
