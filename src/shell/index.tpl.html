<title>TARA — the whole thing</title>
<style><!--@CSS--></style>

<div class="app-shell" id="app-shell">

  <header class="app-bar">
    <button class="app-navtoggle" id="app-navtoggle" type="button" aria-expanded="false" aria-controls="app-nav" aria-label="Sections">
      <span class="app-navtoggle-bars" aria-hidden="true"></span>
    </button>
    <a class="app-brand" href="#today">TARA</a>
    <div class="app-now" id="app-now" aria-live="polite"></div>
    <div class="app-tools">
      <form class="app-searchform" id="app-searchform" role="search" autocomplete="off">
        <input class="app-searchbox" id="app-searchbox" type="search" placeholder="Search" aria-label="Search everything" spellcheck="false">
      </form>
      <button class="app-reviewbtn" id="app-reviewbtn" type="button" aria-expanded="false" aria-controls="app-reviewpanel">
        Review <span class="app-badge" id="app-badge">0</span>
      </button>
    </div>
  </header>

  <nav class="app-nav" id="app-nav" aria-label="Sections">
    <ul class="app-navlist" id="app-navlist"></ul>
  </nav>

  <main class="app-main" id="app-main"></main>

  <div class="app-panel app-searchpanel" id="app-searchpanel" role="dialog" aria-label="Search results" hidden>
    <div class="app-panel-head">
      <span class="app-panel-title" id="app-searchtitle">Search</span>
      <button class="app-panel-close" type="button" data-close="search" aria-label="Close search">&times;</button>
    </div>
    <div class="app-panel-body" id="app-searchresults"></div>
  </div>

  <div class="app-panel app-reviewpanel" id="app-reviewpanel" role="dialog" aria-label="Review queue" hidden>
    <div class="app-panel-head">
      <span class="app-panel-title">Review queue</span>
      <button class="app-panel-clear" type="button" id="app-reviewclear">Clear</button>
      <button class="app-panel-close" type="button" data-close="review" aria-label="Close review queue">&times;</button>
    </div>
    <div class="app-panel-body" id="app-reviewbody"></div>
  </div>

  <div class="app-tier" id="app-tier" role="group" aria-label="Detail level">
    <button class="app-tierbtn" type="button" data-tier="1"><b>1</b><span>Plain</span></button>
    <button class="app-tierbtn" type="button" data-tier="2"><b>2</b><span>Generalist</span></button>
    <button class="app-tierbtn" type="button" data-tier="3"><b>3</b><span>Expert</span></button>
  </div>

  <div class="app-toast" id="app-toast" role="status" aria-live="polite"></div>

</div>

<!--@PAYLOADS-->
<!--@MANIFEST-->
<script><!--@JS--></script>
