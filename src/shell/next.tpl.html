<title>TARA</title>

<div class="app-shell v2-shell fu-ground" id="app-shell">

  <header class="app-bar v2-bar" id="v2-bar">
    <a class="fu-lockup fu-lockup--s v2-brand" id="v2-brand" href="#today" aria-label="its okay to fumble upon tara: today">
      <svg class="fu-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M33 14c13 1 22 18 22 31 0 9-10 12-23 12S9 54 9 45c0-15 11-32 24-31z" fill="#9B8CFF" stroke="#141A24" stroke-width="3"/><ellipse cx="25" cy="37" rx="6" ry="7.5" fill="#fff" stroke="#141A24" stroke-width="1.6"/><ellipse cx="40" cy="39" rx="5" ry="6" fill="#fff" stroke="#141A24" stroke-width="1.6"/><circle cx="27" cy="36" r="3" fill="#141A24"/><circle cx="41.5" cy="38" r="2.5" fill="#141A24"/><path d="M29 50q4 3 8 0" fill="none" stroke="#141A24" stroke-width="2" stroke-linecap="round"/><ellipse cx="24" cy="24" rx="4" ry="2" transform="rotate(-24 24 24)" fill="#fff" opacity=".6"/></svg>
      <span class="fu-wordmark v2-wordmark" aria-hidden="true"><span class="fu-wordmark__lead">its okay to</span><span class="fu-wordmark__row"><span class="fu-wordmark__main"><span class="fu-l">f</span><span class="fu-l">u</span><span class="fu-l">m</span><span class="fu-l">b</span><span class="fu-l">l</span><span class="fu-l">e</span></span><span class="fu-wordmark__tail"><span class="fu-l">u</span><span class="fu-l">p</span><span class="fu-l">o</span><span class="fu-l">n</span></span><span class="fu-wordmark__sfx">tara</span></span></span>
    </a>

    <nav class="fu-tabs fu-only-desk v2-tabs" id="v2-tabs" aria-label="Main">
      <a class="fu-tab v2-tab" href="#today" data-tab="today">Today</a>
      <a class="fu-tab v2-tab" href="#weeks" data-tab="weeks">Weeks</a>
      <a class="fu-tab v2-tab" href="#practice" data-tab="practice">Practice</a>
      <a class="fu-tab v2-tab" href="#library" data-tab="library">Library</a>
      <a class="fu-tab v2-tab" href="#lab" data-tab="lab">Lab</a>
    </nav>

    <div class="app-tools v2-tools" id="v2-tools">
      <form class="app-searchform v2-searchform" id="app-searchform" role="search" autocomplete="off">
        <input class="app-searchbox fu-input v2-searchbox" id="app-searchbox" type="search" placeholder="search" aria-label="Search everything" spellcheck="false" enterkeyhint="search">
      </form>
      <button class="fu-iconbtn v2-iconbtn v2-searchbtn" id="v2-searchbtn" type="button" data-search-keep="1" aria-label="Search" aria-controls="app-searchpanel" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      </button>

      <div class="fu-seg app-tier v2-tier" id="app-tier" role="group" aria-label="Detail level: Plain, Generalist or Expert (keys 1, 2, 3)">
        <button class="fu-seg__opt app-tierbtn" type="button" data-tier="1" aria-pressed="false" aria-label="1, Plain" title="Plain (key 1)"><b>1</b><span>Plain</span></button>
        <button class="fu-seg__opt app-tierbtn" type="button" data-tier="2" aria-pressed="true" aria-label="2, Generalist" title="Generalist (key 2)"><b>2</b><span>Generalist</span></button>
        <button class="fu-seg__opt app-tierbtn" type="button" data-tier="3" aria-pressed="false" aria-label="3, Expert" title="Expert (key 3)"><b>3</b><span>Expert</span></button>
      </div>

      <button type="button" class="fu-lamp v2-lamp" id="v2-themebtn" aria-pressed="false" aria-label="Lamp: lights off (dark mode)" title="The lamp: light or dark">
        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="fu-lamp__glow" d="M9 17h14l5 13H4z"/><path d="M16 1v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M11.5 6h9l5 10h-19z" fill="#E6CDA0" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path class="fu-lamp__bulb" d="M12.5 16a3.5 3.5 0 0 0 7 0z" stroke="currentColor" stroke-width="2"/><g class="fu-lamp__chain"><path d="M23 16v7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="1.4 1.4"/><circle cx="23" cy="24.6" r="1.8" fill="currentColor"/></g></svg>
      </button>

      <div class="v2-dimslot" id="v2-dimslot"></div>
    </div>
  </header>

  <div class="v2-session" id="v2-session" role="region" aria-label="Study session" hidden></div>

  <main class="app-main" id="app-main"></main>

  <!-- the toast slot: a row of the column just above the dock (or the bottom edge),
       open only while a toast shows, so a toast never covers content or the dock -->
  <div class="app-toast fu-toast v2-toast" id="app-toast" role="status" aria-live="polite"></div>

  <nav class="fu-tabbar fu-only-phone v2-tabbar" id="v2-tabbar" aria-label="Main">
    <a class="fu-tabbar__item v2-tbtab" href="#today" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2.5 19h19"/><path d="M6.5 19a5.5 5.5 0 0 1 11 0"/><path d="M12 10.5V8M6 13 4.3 11.3M18 13l1.7-1.7"/></svg><span class="fu-tabbar__label">Today</span></a>
    <a class="fu-tabbar__item v2-tbtab" href="#weeks" data-tab="weeks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.6 17.4c2.4-2.2 1.6-5.2 4.2-5.4M13.2 12c2.6-.2 1.8-3.2 4.2-5.4"/><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="5" r="2.2"/></svg><span class="fu-tabbar__label">Weeks</span></a>
    <a class="fu-tabbar__item v2-tbtab" href="#practice" data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3.5h10a2.5 2.5 0 0 1 2.5 2.5v10"/><rect x="3.5" y="7.5" width="13" height="13" rx="2.5"/><path d="m7 14.2 2.2 2.2 4-4.4"/></svg><span class="fu-tabbar__label">Practice</span><span class="fu-badge fu-badge--count v2-recallbadge" id="v2-recallbadge" hidden></span></a>
    <a class="fu-tabbar__item v2-tbtab" href="#library" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="4.5" height="16" rx="1"/><rect x="7.5" y="6" width="4.5" height="14" rx="1"/><path d="m14 6.6 4.2-1.1 3.4 13.6-4.2 1.1z"/><path d="M3 8h4.5M7.5 10H12"/></svg><span class="fu-tabbar__label">Library</span></a>
    <a class="fu-tabbar__item v2-tbtab" href="#lab" data-tab="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 3h6M10.2 3v6L4.8 18.4A1.8 1.8 0 0 0 6.4 21h11.2a1.8 1.8 0 0 0 1.6-2.6L13.8 9V3"/><path d="M7.4 15h9.2"/></svg><span class="fu-tabbar__label">Lab</span></a>
  </nav>

  <div class="app-panel app-searchpanel fu-window v2-panel" id="app-searchpanel" role="dialog" aria-label="Search results" hidden>
    <div class="app-panel-head fu-titlebar">
      <span class="app-panel-title fu-titlebar__title" id="app-searchtitle">Search</span>
      <span class="fu-titlebar__tools"><button class="app-panel-close fu-iconbtn v2-panelclose" type="button" data-close="search" aria-label="Close search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
    </div>
    <div class="app-panel-body" id="app-searchresults"></div>
  </div>

  <div class="app-panel app-reviewpanel fu-window v2-panel" id="app-reviewpanel" role="dialog" aria-label="Saved sentences" hidden>
    <div class="app-panel-head fu-titlebar">
      <span class="app-panel-title fu-titlebar__title">Saved sentences</span>
      <span class="fu-titlebar__tools"><button class="app-panel-clear fu-btn fu-btn--small fu-btn--ghost" type="button" id="app-reviewclear">Clear</button>
      <button class="app-panel-close fu-iconbtn v2-panelclose" type="button" data-close="review" aria-label="Close saved sentences"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
    </div>
    <div class="app-panel-body" id="app-reviewbody"></div>
  </div>

</div>
